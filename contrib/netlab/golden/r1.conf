# Rendered by netlab from contrib/netlab/ze/ze.j2. Edits are lost on the next
# `netlab create`.

# The lab login. This is a well-known lab credential in a throwaway container,
# never a deployment credential. Ze hashes plaintext-password when it loads the
# file, so the file carries what the operator typed and the running tree carries
# a bcrypt hash.
system {
	authentication {
		user netlab {
			plaintext-password "netlab";
		}
	}
}

# `netlab validate` and `netlab connect` reach the CLI over SSH, from inside the
# container: netlab_show_command runs through `docker exec`. The listener is
# therefore bound to the loopback and not to the node's links.
environment {
	ssh {
		enabled true;
		server main {
			ip 127.0.0.1;
			port 2222;
		}
	}
}

# rib and fib-kernel put learned routes in the container's kernel FIB, which is
# what a `ping` validation measures. connected makes the interface prefixes
# resolvable next-hops.
plugin {
	internal rib {
		use rib;
	}
	internal fib-kernel {
		use fib-kernel;
	}
	internal connected {
		use connected;
	}
	internal bgp-rib {
		use bgp-rib;
	}
}

connected {
}

# netlab states the BFD timers in milliseconds; ze takes microseconds.
bfd {
	enabled true;
	profile netlab {
		detect-multiplier 3;
		desired-min-tx-us 200000;
		required-min-rx-us 200000;
	}
}

ospf {
	router-id 10.0.0.1;
	areas {
		area 0.0.0.0 {
			area-type normal;
		}
	}
	interfaces {
		interface eth1 {
			area 0.0.0.0;
			network-type point-to-point;
			priority 10;
			hello-interval 3;
			dead-interval 12;
			bfd {
				enabled true;
				min-tx 200;
				min-rx 200;
				multiplier 3;
			}
		}
		interface lo {
			area 0.0.0.0;
			passive true;
		}
	}
}

isis {
	net 49.0001.0000.0000.0001.00;
	level l2;
	interfaces {
		interface eth1 {
			circuit-type point-to-point;
		}
		interface lo {
			passive true;
		}
	}
}

static {
	table default {
		route 10.43.0.0/24 {
			blackhole;
		}
		route 10.42.0.0/24 {
			next {
				hop 10.1.0.2 {
					interface eth1;
				}
			}
		}
	}
}

bgp {
	peer r2 {
		connection {
			remote {
				ip 10.0.0.2;
			}
			local {
				ip 10.0.0.1;
			}
		}
		session {
			asn {
				local 65001;
				remote 65001;
			}
			router-id 10.0.0.1;
			next-hop self;
			family {
				ipv4/unicast {
					prefix {
						maximum 100000;
					}
				}
			}
		}
	}
	peer r3 {
		connection {
			remote {
				ip 10.1.0.6;
			}
			local {
				ip 10.1.0.5;
			}
		}
		session {
			asn {
				local 65001;
				remote 65002;
			}
			router-id 10.0.0.1;
			family {
				ipv4/unicast {
					prefix {
						maximum 100000;
					}
				}
			}
		}
	}
}

# netlab labs validate with a ping, so the sessions have to carry the prefixes
# the containers own. Ze redistributes the connected prefixes, the loopback
# among them, which is the whole route set a netlab node has to offer.
redistribute {
	destination bgp {
		import connected
		import ospf
		import isis
	}
}
