# golangci-lint configuration for ZeBGP (v2 format)
version: "2"

run:
  # 10m was the budget for ONE pass. `./le verify lint run` drives sixteen
  # flavors over 756 packages with `-j` at a quarter of the machine's cores,
  # and on a checkout several sessions are working it ran out at the last
  # flavor, having already found and reported 210 files. A budget that expires
  # after the work is done reports "Timeout exceeded" and throws the findings
  # away, which is the most expensive way to fail.
  timeout: 30m
  # The worker cap is not static YAML. `./le verify-lint run` passes `-j` from
  # internal/le/gotoolchain, which assigns one quarter of the machine's cores.
  #
  # The former `concurrency: 8` matched one 32-core host and consumed half of a
  # 16-core development machine. The shared job admission calculation depends
  # on each process honoring the same CPU share. Observed before the dynamic
  # cap: one run used 708% CPU with 18 threads while a sibling sat at 3.97 GiB
  # against a 4 GiB GOMEMLIMIT.
  #
  # A hardcoded number cannot follow the machine. Do not put one back.
  #
  # internal/le/gotoolchain also sets GOMEMLIMIT to one eighth of host memory,
  # with a floor, because golangci-lint v2.10.1 has no memory setting. The
  # `ZE_LINT_MEMLIMIT` environment variable overrides it when a run needs a
  # measured exception.
  # See plan/spec-shared-machine-job-admission.md, AC-1.
  # Lint the feature-rich shipped build (ze + ze-appliance feature set): ze_core
  # plus every default-on per-feature compile-out tag. This gives the
  # //go:build ze_<feature> registration + factory files real lint coverage and
  # prevents their registry callers (e.g. registerService) from being reported
  # as unused.
  #
  # golangci-lint cannot read feature-gates.txt, so `./le feature-tags write`
  # derives this list from the manifest. Do not edit it by hand.
  # `./le feature-tags check` rejects drift. See ai/rules/plugins.md.
  build-tags:
    - ze_core
    - ze_lg
    - ze_ssh
    - ze_web
    - ze_gnmi
    - ze_mcp
    - ze_rest
    - ze_grpc
    - ze_telemetry
    - ze_isis
    - ze_ldp
    - ze_ospf
    - ze_rsvpte
    - ze_vrrp
    - ze_ntp
    - ze_flowexport
    - ze_ddos
    - ze_anomaly
    - ze_as112
    - ze_geodns
    - ze_dhcpserver
    - ze_pxe
    - ze_trafficusage
    - ze_policyroute
    - ze_cos
    - ze_copp
    - ze_mpls
    - ze_tacacs
    - ze_exabgp
    - ze_bfd
    - ze_vpp
    - ze_ike
    - ze_l2tp
    - ze_radius
    - ze_mrt
    - ze_bgp
    - ze_bmp

linters:
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - goconst
          - gosec
          - prealloc
      - path: cmd/
        linters:
          - forbidigo
      - linters:
          - staticcheck
        text: "QF1008"
      # Bubbletea tea.Model interface requires value receivers — cannot use pointer
      - path: "(internal/component/cli/model[^/]*|cmd/ze/cli/main)\\.go"
        text: "hugeParam"
      # slog.Handler interface requires slog.Record by value — cannot use pointer
      - path: "internal/core/slogutil/color\\.go"
        text: "hugeParam"
      # IANA service names copied verbatim from the registry: "commonspace",
      # "composit-server", "extensis", "fyre-messanger". They are the strings the
      # lookup must return, so "correcting" one breaks the table.
      #
      # goconst for the same reason. The file is the IANA registry transcribed
      # as a Go table, and it indexes every name three ways -- {port, 6} for TCP,
      # {port, 17} for UDP, and port alone for the proto=0 fallback -- so 4815
      # of its literals occur three or more times. Those are index entries, not
      # duplicated logic: "3com-tsmux" written as svc3comTsmux carries exactly
      # the meaning of the literal it hides, and 4815 such names would make a
      # table that is read by eye unreadable. The file carries no
      # "Code generated" marker and no generator is wired for it, so it is
      # hand-maintained data; that does not change the argument.
      - path: "internal/core/portname/services_table\\.go"
        linters:
          - goconst
          - misspell

  enable:
    # Core linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional linters
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - unconvert
    - unparam
    - nakedret
    - prealloc
    - noctx
    - bodyclose
    - dupl
    - errorlint
    - exhaustive
    - forcetypeassert
    - goconst
    - godot
    - nilerr
    - nilnil
    - tparallel
    - wastedassign
    # Modernization linters
    - intrange
    - modernize

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - "(*strings.Builder).Write"
        - "(*strings.Builder).WriteByte"
        - "(*strings.Builder).WriteRune"
        - "(*strings.Builder).WriteString"
        - "(*github.com/ze-software/ze/internal/core/textbuf.Buffer).Write"
        - "(*github.com/ze-software/ze/internal/core/textbuf.Buffer).WriteByte"
        - "(*github.com/ze-software/ze/internal/core/textbuf.Buffer).WriteRune"
        - "(*github.com/ze-software/ze/internal/core/textbuf.Buffer).WriteString"

    govet:
      disable:
        - fieldalignment

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - builtinShadow
        - commentedOutCode
        - importShadow
        - unnamedResult
      settings:
        hugeParam:
          # ospfConfig is an intentionally-copied immutable config snapshot passed by value
          # across the OSPF package (setConfig/reconcile/forInstance and ~20 read helpers).
          # Each OSPF spec that adds a config field grows it; the threshold has tracked that
          # growth (256 -> 280 -> 288) rather than converting the snapshot pattern to pointers.
          sizeThreshold: 288
        rangeValCopy:
          sizeThreshold: 160

    gosec:
      excludes:
        - G104 # Errors unhandled — checked by errcheck linter instead
        - G115 # Integer overflow conversion — intentional byte extraction in wire encoding
        - G602 # Slice index out of range — false positives on bounded loops
        - G703 # Path traversal — XDG config resolution uses env vars by design
        - G704 # SSRF via taint — false positive on URL construction from constants
        - G705 # XSS via taint — false positive on fmt.Fprintf to os.Stderr / io.Writer
        - G706 # Log injection via taint — false positive on slog structured logging

    misspell:
      # US spelling is the codebase convention (neighbor 1833:3, behavior 423:0, ...).
      locale: US

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true

    dupl:
      threshold: 150

    goconst:
      min-len: 3
      min-occurrences: 3

    exhaustive:
      default-signifies-exhaustive: true

    forbidigo:
      analyze-types: true
      forbid:
        # Legacy log package is forbidden; use log/slog (ai/rules/go-standards.md).
        # NOTE: forbidigo matches identifiers/selectors only, never call
        # arguments, so `os.Getenv("ZE_...")` cannot be expressed here; a
        # blanket os.Getenv ban would flood legitimate system-var reads
        # (HOME, PATH, ...). Ze env access (internal/core/env only) is
        # enforced by ai/rules/go-standards.md and the edit hooks instead.
        - pattern: '^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$'
          pkg: '^log$'
          msg: "use log/slog -- ai/rules/go-standards.md"

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/ze-software/ze

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
