# Ze as the PPPoE access concentrator (RFC 2516) for a pppd/rp-pppoe client.
#
# The `pppoe` block binds the AC to eth0 on the shared Docker bridge: it answers
# PADI with PADO, validates the AC-Cookie in PADR, allocates a session id in
# PADS, then terminates PPP itself (LCP, CHAP-MD5, IPCP) through the shared PPP
# driver -- the same driver the L2TP LNS uses.
#
# The credential and the address pool come from the two BNG plugins that serve
# both transports: l2tp-auth-local holds the subscriber's CHAP secret, and
# l2tp-pool hands out the IPCP address. Neither needs the L2TP subsystem itself,
# so `l2tp` carries no `enabled` leaf and no listener.
pppoe {
    enabled true;
    ac-name ze-bng;
    service-name internet;
    auth-method chap-md5;
    interface eth0 {
    }
}

l2tp {
    auth {
        local {
            user alice {
                password s3cr3t;
            }
        }
    }
    pool {
        ipv4 {
            gateway 10.20.0.1;
            start 10.20.0.2;
            end 10.20.0.10;
            dns-primary 8.8.8.8;
            dns-secondary 8.8.4.4;
        }
    }
}

# The scenario reads Ze's own session table over REST (`show pppoe sessions`)
# rather than inferring session state from log lines.
environment {
    api-server {
        token "ze-pppoe-interop";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 9099;
            }
        }
    }
}
