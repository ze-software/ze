when:
  event:
    - push
    - pull_request

steps:
  verify:
    image: golang:1.26
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends build-essential curl git iproute2 iptables nftables nodejs npm python3 python3-venv util-linux
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="/usr/local/go/bin:$HOME/.local/bin:$PATH"
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
      # Web suite (.wb tests) requires agent-browser; without it the suite
      # fails hard under the verify gate instead of silently skipping.
      - npm install -g agent-browser
      - agent-browser install --with-deps
      - make ze-verify
