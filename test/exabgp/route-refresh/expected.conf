plugin {
	internal bgp-rib {
		use bgp-rib
	}
}
bgp {
	group default {
		peer peer-1 {
			connection {
				local {
					ip 10.0.0.2
				}
				remote {
					ip 10.0.0.1
				}
			}
			session {
				router-id 1.1.1.1
				asn {
					local 65001
					remote 65002
				}
				capability {
					extended-message enable
					route-refresh enable
				}
			}
			attach process bgp-rib {
				receive [ update state refresh ]
				send [ update refresh ]
			}
		}
	}
}
