bus {
	endpoint bgp-rib {
		internal bgp-rib
	}
	endpoint bgp-watchdog {
		internal bgp-watchdog
	}
	endpoint my-plugin {
		external {
			run "ze exabgp plugin --family ipv4/unicast --encoder json /path/to/plugin.py"
		}
		receive {
			from none
		}
		send {
			to [ /bgp/group/default/peer/peer-1 ]
		}
	}
}
bgp {
	group default {
		peer peer-1 {
			connection {
				local {
					ip 10.0.0.2
				}
				remote {
					ip 10.0.0.1
				}
			}
			session {
				router-id 1.1.1.1
				asn {
					local 65001
					remote 65002
				}
				capability {
					extended-message enable
				}
				family {
					ipv4/unicast { prefix { maximum 10000; } }
				}
			}
			filter {
				import {
					final accept
				}
				export {
					final accept
				}
			}
			timer {
				receive-hold-time 180
			}
		}
	}
}
