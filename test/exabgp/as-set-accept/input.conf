# ExaBGP 6.0 neighbor that keeps received routes whose AS_PATH holds an AS_SET.
# The migration writes ze's session as-set accept (RFC 9774 Section 3 operator
# configuration), which only the migration writes.
neighbor 10.0.0.1 {
	router-id 1.1.1.1
	local-address 10.0.0.2
	local-as 65001
	peer-as 65002
	hold-time 180
	as-set accept;
	family {
		ipv4 unicast
	}
}
