charon {
    plugins {
        # MEASURED, and without this the scenario cannot test anything. strongSwan
        # loads bypass-lan by default, which installs shunt policies for every
        # locally attached subnet. In this lab that is 172.28.0.0/24, which holds
        # BOTH containers, so every packet between them takes the bypass instead of
        # the tunnel.
        #
        # The reading that proves it: with bypass-lan loaded, a ping either way
        # ends in 100% loss and both kernels raise XfrmInTmplMismatch, while
        # strongSwan's OUTBOUND ESP SA stays at 0 packets. So strongSwan sends Ze
        # no ESP at all and Ze's receive path is never reached. Scenario 07 still
        # passes in that state, because it asserts on SA byte counters and Ze's own
        # outbound counter advances either way.
        bypass-lan {
            load = no
        }
    }
}
