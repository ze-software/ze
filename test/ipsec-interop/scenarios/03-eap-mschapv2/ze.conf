vpn {
	ipsec {
		ike-group IKE-EAP {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-EAP {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-EAP;
				esp-group ESP-EAP;
				connection-type initiate;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				authentication {
					mode eap-mschapv2;
					local-id "testuser";
					remote-id "172.28.0.3";
					pre-shared-secret "testpassword";
				}
			}
		}
	}
}
