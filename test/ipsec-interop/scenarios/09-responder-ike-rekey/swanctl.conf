connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # strongSwan initiates and, with a short IKE rekey_time, drives an IKE-SA
        # rekey (CREATE_CHILD_SA rekeying the IKE SA) that Ze must answer as
        # responder (respondIKERekey, closing spec-ipsec-13's deferral). reauth=no
        # forces a rekey rather than a full reauthentication.
        rekey_time = 40s
        reauth_time = 0s

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                # Keep the Child SA stable so only the IKE SA rekeys.
                rekey_time = 0
                life_time = 0
                start_action = start
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
