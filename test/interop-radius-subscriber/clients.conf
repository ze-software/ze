# Ze FreeRADIUS subscriber lab: the one NAS this server answers.
#
# The secret is a fixture value published in this repository. It never protects
# anything, and it must not resemble an operator secret.
#
# require_message_authenticator is on: FreeRADIUS discards an Access-Request
# that carries no valid Message-Authenticator, the server side of the
# BlastRADIUS (CVE-2024-3596) defence. Ze signs every Access-Request,
# draft-ietf-radext-deprecating-radius-10 Section 4.2, so every subscriber
# login here also proves FreeRADIUS verifies the signature Ze computed.
client ze-lns {
	ipaddr = 172.26.0.0/24
	secret = ze-subscriber-fixture-secret
	nas_type = other
	require_message_authenticator = yes
}
