# Ze FreeRADIUS subscriber lab: the one NAS this server answers.
#
# The secret is a fixture value published in this repository. It never protects
# anything, and it must not resemble an operator secret.
client ze-lns {
	ipaddr = 172.26.0.0/24
	secret = ze-subscriber-fixture-secret
	nas_type = other
	require_message_authenticator = no
}
