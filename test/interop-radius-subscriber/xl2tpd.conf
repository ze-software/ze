[global]
port = 1702
auth file = /etc/xl2tpd/l2tp-secrets
debug tunnel = yes
debug state = yes

[lac ze]
lns = 172.26.0.2
; Dial once at start and never again on its own. A checker makes each new
; session by restarting the LAC (checkers.go redial), so a session ze tears
; down stays down: an automatic redial 1s later is a session the checker did
; not ask for, and the next Accounting-Start it reads would be that one.
autodial = yes
redial = no
require authentication = no
ppp debug = yes
pppoptfile = /etc/ppp/options.l2tpd.client
length bit = yes
