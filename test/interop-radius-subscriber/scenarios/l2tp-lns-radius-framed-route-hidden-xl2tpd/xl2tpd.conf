; The lab's xl2tpd.conf, plus the two options that make this LAC hide an AVP.
; `challenge = yes` challenges ze in the SCCRQ, so handle_challenge (aaa.c)
; reads the tunnel secret from l2tp-secrets when ze's SCCRP arrives; that is
; the secret encrypt_avp hides under, which ze's shared-secret matches.
; `hidden bit = yes` (set_hbit, file.c) puts a Random Vector in every control
; message and, in this lab's -DTEST_HIDDEN build, hides the Assigned Session
; ID of the ICRQ (add_callid_avp, avpsend.c).
[global]
port = 1702
auth file = /etc/xl2tpd/l2tp-secrets
debug tunnel = yes
debug state = yes

[lac ze]
lns = 172.26.0.2
autodial = yes
redial = no
require authentication = no
ppp debug = yes
pppoptfile = /etc/ppp/options.l2tpd.client
length bit = yes
challenge = yes
hidden bit = yes
