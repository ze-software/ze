l2tp {
    enabled true;
    auth-method chap-md5;
    hello-interval 5;
    max-tunnels 4;
    max-sessions 4;
    auth {
        radius {
            nas-identifier ze-lns;
            timeout 5;
            retries 2;
            coa-port 3799;
            server freeradius {
                address 172.26.0.3;
                port 1812;
                shared-key ze-subscriber-fixture-secret;
            }
        }
    }
    pool {
        ipv4 {
            gateway 10.101.0.1;
            start 10.101.0.2;
            end 10.101.0.10;
        }
    }
}
environment {
    l2tp {
        server main {
            ip 172.26.0.2;
            port 1701;
        }
    }
    api-server {
        token "secret";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 17012;
            }
        }
    }
}
