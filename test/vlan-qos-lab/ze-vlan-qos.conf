# Ze config: VLAN unit with bidirectional 802.1p QoS maps via cos profile.
# This is the BNG-style configuration using named class-of-service profiles.
#
# To use with ze in the lab:
#   ip netns exec zelab-ze ze test/vlan-qos-lab/ze-vlan-qos.conf
#
# The veth "eth0" must already exist (created by run.sh).

class-of-service {
	ieee-802.1p residential {
		ingress {
			pcp 0 { priority 0; }
			pcp 6 { priority 6; }
			pcp 7 { priority 7; }
		}
		egress {
			priority 0 { pcp 0; }
			priority 6 { pcp 6; }
			priority 7 { pcp 7; }
		}
	}
}

interface {
	backend netlink;
	ethernet eth0 {
		class-of-service residential;
		unit v100 {
			vlan-id 100;
			ipv4 {
				address [10.0.0.1/24]
			}
		}
	}
}

firewall {
	backend nft;
	table cos {
		family inet;
		chain forward {
			type filter;
			hook forward;
			priority 0;
			policy accept;
			term voice {
				from {
					dscp ef;
				}
				then {
					dscp-set ef;
					accept;
				}
			}
		}
	}
}

traffic {
	control {
		backend tc
		interface eth0.100 {
			qdisc {
				type htb;
				default-class default;
				class voice {
					rate 10mbit;
					ceil 20mbit;
					priority 0;
					match dscp {
						value 46;
					}
				}
				class default {
					rate 50mbit;
					ceil 100mbit;
					priority 1;
				}
			}
		}
	}
}
