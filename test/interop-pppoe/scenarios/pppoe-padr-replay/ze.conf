# Ze as the PPPoE access concentrator (RFC 2516), with max-sessions-per-mac
# set to 1, against a real pppd/rp-pppoe client.
#
# spec-pppoe-padr-replay-allocates-unbounded-sessions: a MAC that already
# holds one session must get that SAME session id back when it replays its
# own PADR, and a second, genuinely distinct dial from that MAC must be
# refused with a PADS carrying an AC-System-Error tag and session id 0x0000
# once it is at the cap. The checker reads both facts off the wire (captured
# PADR and PADS frames), never off the session count alone.
#
# Otherwise identical to 02-ze-ac-pppd-client/ze.conf: same credential and
# pool plugins, same REST session table.
pppoe {
    enabled true;
    ac-name ze-bng;
    service-name internet;
    auth-method chap-md5;
    max-sessions-per-mac 1;
    interface eth0 {
    }
}

l2tp {
    auth {
        local {
            user alice {
                password s3cr3t;
            }
        }
    }
    pool {
        ipv4 {
            gateway 10.20.0.1;
            start 10.20.0.2;
            end 10.20.0.10;
            dns-primary 8.8.8.8;
            dns-secondary 8.8.4.4;
        }
    }
}

# The scenario reads Ze's own session table over REST (`show pppoe sessions`)
# rather than inferring session state from log lines.
environment {
    api-server {
        token "ze-pppoe-interop";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 9099;
            }
        }
    }
}
