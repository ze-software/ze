# Ze as the PPPoE access concentrator (RFC 2516), against a real pppd
# client whose IPv6CP Configure-Request carries no Interface-Identifier
# option.
#
# spec-ipv6cp-accepts-and-proposes-a-zero-interface-identifier: RFC 5072
# Section 4.1 requires exactly one Interface-Identifier option in a
# Configure-Request. A request with none is Naked once and, on the peer's
# next tagless request, Acked rather than Naked again (AC-10's one-shot
# rule). pppd always sends the option in its own negotiation, so the
# checker (internal/le/interoplab/pppoe/check_ipv6cp.go,
# checkZeAccessConcentratorIPv6CPMissingOption) captures a genuine
# Configure-Request and replays it twice with the option stripped, reading
# both Ze responses off the wire.
#
# BLOCKED today (see the checker's own file header): poolPlugin.handle
# (internal/component/l2tp/plugins/pool/register.go) declines every
# non-IPv4 EventIPRequest, so runNCPPhase (internal/component/l2tp/ppp/ncp.go)
# never starts IPv6CP's FSM. This config carries the same IPv4 pool every
# other pppd-client scenario in this lab uses, because nothing today makes
# the pool's IPv6 answer configurable; plan/spec-l2tp-ipv6-subscriber.md
# is what changes that.
pppoe {
    enabled true;
    ac-name ze-bng;
    service-name internet;
    auth-method chap-md5;
    interface eth0 {
    }
}

l2tp {
    auth {
        local {
            user alice {
                password s3cr3t;
            }
        }
    }
    pool {
        ipv4 {
            gateway 10.20.0.1;
            start 10.20.0.2;
            end 10.20.0.10;
            dns-primary 8.8.8.8;
            dns-secondary 8.8.4.4;
        }
    }
}

# The scenario reads Ze's own session table over REST (`show pppoe sessions`)
# rather than inferring session state from log lines.
environment {
    api-server {
        token "ze-pppoe-interop";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 9099;
            }
        }
    }
}
