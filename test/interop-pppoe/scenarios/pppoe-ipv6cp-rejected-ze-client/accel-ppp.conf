# accel-ppp PPPoE access concentrator for pppoe-ipv6cp-rejected-ze-client:
# IPv4 only. Read against accel-ppp 1.14.0 (Alpine 3.24's package,
# Dockerfile.accel).
#
# ipv6=deny: ppp/ppp_ipv6cp.c ipv6cp_recv discards every IPv6CP packet and
# answers it with lcp_send_proto_rej (ppp/ppp_lcp.c), logged as
# "send [LCP ProtoRej id=N <8057>]". The scenario proves the Ze client stops
# sending IPv6CP (RFC 1661 Section 5.7) and keeps the IPv4 session
# (RFC 7084 WLL-3).
#
# No [dns] section: the client learns no IPv4 server, so the shared CHAP proof
# expects an empty resolv.conf.
[modules]
log_file
cli
pppoe
auth_chap_md5
chap-secrets
ippool

# accel-cmd's default target is localhost:2001; the readiness gate uses it.
[cli]
tcp=127.0.0.1:2001

[core]
thread-count=2

# copy=1 and verbose=1 put the LCP and CHAP packets in the log the checker
# reads.
[log]
log-file=/dev/stdout
level=4
copy=1

[pppoe]
interface=eth0
ac-name=ze-accel-ac
service-name=internet
verbose=1

[ppp]
verbose=1
mtu=1492
mru=1492
ipv4=require
ipv6=deny
lcp-echo-interval=30
lcp-echo-failure=3
mppe=deny

[ip-pool]
gw-ip-address=10.11.0.1
10.11.0.2-10

[chap-secrets]
chap-secrets=/etc/accel-ppp/chap-secrets
