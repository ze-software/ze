# Ze as a PPPoE client with IPv6 enabled, dialing an accel-ppp that denies
# IPv6 and answers IPv6CP with an LCP Protocol-Reject. RFC 7084 WLL-3: the
# IPv4 session must stay up.
interface {
    pppoe-client pppoe0 {
        source-interface eth0;
        service-name internet;
        authentication {
            username alice;
            password s3cr3t;
        }
        ipv6 {
            enabled true;
            accept-ra 2;
            autoconf true;
            forwarding true;
        }
    }
}
