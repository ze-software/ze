# accel-ppp PPPoE access concentrator (server) for the Ze PPPoE-client interop
# lab. Minimal config: PPPoE on eth0, PAP auth checked against a local
# chap-secrets file, IPv4 addresses from a local pool. No RADIUS, no shaper, no kernel IPoE
# driver. Logs to stdout so `docker logs` shows negotiation.
#
# Only auth_pap is loaded (no auth_chap_md5), so the AC requires PAP and the
# negotiated method is deterministic for the pppoe-pap-ze-client assertion.
# auth_pap reads its credentials through the chap-secrets module.

# `cli` is load-bearing, not diagnostics: the scenario's readiness gate and its
# session assertions all run `accel-cmd`, which speaks to the CLI listener
# below. Without the module accel-pppd starts, serves PPPoE, and answers no
# accel-cmd at all, so the lab failed at "accel-ppp control socket" before any
# Ze frame was sent.
[modules]
log_file
cli
pppoe
auth_pap
chap-secrets
ippool

# accel-cmd's default target is localhost:2001.
[cli]
tcp=127.0.0.1:2001

[core]
thread-count=2

# copy=1 copies each session's messages (the LCP and PAP trace) into this
# general log: the checker reads `send [PAP AuthAck` from docker logs.
[log]
log-file=/dev/stdout
level=4
copy=1

[pppoe]
interface=eth0
ac-name=ze-accel-ac
service-name=internet
verbose=1

[ppp]
verbose=1
mtu=1492
mru=1492
ipv4=require
ipv6=deny
lcp-echo-interval=30
lcp-echo-failure=3
mppe=deny

[ip-pool]
gw-ip-address=10.11.0.1
10.11.0.2-10

[chap-secrets]
chap-secrets=/etc/accel-ppp/chap-secrets
