# Ze as a PPPoE client (RFC 2516) dialing the accel-ppp access concentrator.
#
# The pppoe-client interface kind performs PADI/PADO/PADR/PADS discovery on
# eth0, negotiates LCP, authenticates with CHAP, completes IPCP, and presents
# the server-assigned address on a kernel pppN interface. accel-ppp is the AC
# on the other end of the shared Docker bridge (its eth0).
interface {
    pppoe-client pppoe0 {
        source-interface eth0;
        service-name internet;
        authentication {
            username alice;
            password s3cr3t;
        }
    }
}
