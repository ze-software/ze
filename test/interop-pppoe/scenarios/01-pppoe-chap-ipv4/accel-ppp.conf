# accel-ppp PPPoE access concentrator (server) for the Ze PPPoE-client interop
# lab. Minimal config: PPPoE on eth0, CHAP-MD5 auth from a local chap-secrets
# file, IPv4 addresses from a local pool. No RADIUS, no shaper, no kernel IPoE
# driver. Logs to stdout so `docker logs` shows negotiation.
#
# Only auth_chap_md5 is loaded (no auth_pap), so the AC requires CHAP and the
# negotiated method is deterministic for the 01-pppoe-chap-ipv4 assertion.

# `cli` is load-bearing, not diagnostics: the scenario's readiness gate and its
# session assertions all run `accel-cmd`, which speaks to the CLI listener
# below. Without the module accel-pppd starts, serves PPPoE, and answers no
# accel-cmd at all, so the lab failed at "accel-ppp control socket" before any
# Ze frame was sent.
[modules]
log_file
cli
pppoe
auth_chap_md5
chap-secrets
ippool

# accel-cmd's default target is localhost:2001.
[cli]
tcp=127.0.0.1:2001

[core]
thread-count=2

# copy=1 exposes the session's LCP and CHAP exchange in the general log read
# by the checker; verbose PPP messages otherwise stay out of docker logs.
[log]
log-file=/dev/stdout
level=4
copy=1

[pppoe]
interface=eth0
ac-name=ze-accel-ac
service-name=internet
verbose=1

[ppp]
verbose=1
mtu=1492
mru=1492
ipv4=require
ipv6=deny
lcp-echo-interval=30
lcp-echo-failure=3
mppe=deny

[ip-pool]
gw-ip-address=10.11.0.1
10.11.0.2-10

# RFC 1877: accel-ppp 1.14.0 ppp/ipcp_opt_dns.c dns_recv_conf_req Naks the
# client's 0.0.0.0 Primary- and Secondary-DNS-Address request with these
# servers (load_config reads [dns] dns1 and dns2). The checker reads them back
# from the Ze container's resolv.conf and from Ze's own
# `show interface pppoe-client` dns-servers, primary first.
[dns]
dns1=192.0.2.53
dns2=192.0.2.54

[chap-secrets]
chap-secrets=/etc/accel-ppp/chap-secrets
