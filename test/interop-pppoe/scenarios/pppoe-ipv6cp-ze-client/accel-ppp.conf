# accel-ppp PPPoE access concentrator for pppoe-ipv6cp-ze-client: IPv4 and
# IPv6 on one session, with Router Advertisements. Read against accel-ppp
# 1.14.0 (Alpine 3.24's package, Dockerfile.accel).
#
# ipv6=prefer makes IPv6CP active (ppp/ppp_ipv6cp.c, ipv6cp_layer_init sets
# ld.passive only for allow and deny), so the session starts only once IPv6CP
# opened and ipv6_nd's ev_ses_started finds the pool prefix.
#
# Identifiers (ppp/ipv6cp_opt_intfid.c): accel-ppp's own is ipv6-intf-id
# 0:0:0:1, so its link-local is fe80::1. ipaddr_recv_conf_req Acks the
# client's identifier only when it equals ipv6-peer-intf-id and Naks it with
# that value otherwise; ipv6-accept-peer-intf-id=0 keeps it from adopting the
# client's. The Ze client starts from its source MAC's EUI-64, so it is
# Naked with 0:0:0:5a and must adopt it (RFC 5072 Section 4.1), which leaves
# it fe80::5a.
#
# ipv6pool hands the session the first /64 of 2001:db8:100::/56
# (extra/ipv6pool.c, get_ip); ipv6_nd advertises it (ipv6/nd.c,
# ipv6_nd_send_ra) with the on-link and autonomous flags, because ipv6_dhcp is
# not loaded, and a Router Lifetime of 3 * MaxRtrAdvInterval.
#
# No [dns] section: the client learns no IPv4 server, so the shared CHAP proof
# expects an empty resolv.conf.
[modules]
log_file
cli
pppoe
auth_chap_md5
chap-secrets
ippool
ipv6pool
ipv6_nd

# accel-cmd's default target is localhost:2001; the readiness gate uses it.
[cli]
tcp=127.0.0.1:2001

[core]
thread-count=2

# copy=1 and verbose=1 put the LCP, CHAP and IPv6CP packets in the log the
# checker reads.
[log]
log-file=/dev/stdout
level=4
copy=1

[pppoe]
interface=eth0
ac-name=ze-accel-ac
service-name=internet
verbose=1

[ppp]
verbose=1
mtu=1492
mru=1492
ipv4=require
ipv6=prefer
ipv6-intf-id=0:0:0:1
ipv6-peer-intf-id=0:0:0:5a
ipv6-accept-peer-intf-id=0
lcp-echo-interval=30
lcp-echo-failure=3
mppe=deny

[ip-pool]
gw-ip-address=10.11.0.1
10.11.0.2-10

[ipv6-pool]
2001:db8:100::/56,64

[ipv6-nd]
MaxRtrAdvInterval=60

[chap-secrets]
chap-secrets=/etc/accel-ppp/chap-secrets
