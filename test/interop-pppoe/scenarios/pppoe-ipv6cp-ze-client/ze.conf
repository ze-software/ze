# Ze as a dual-stack PPPoE client (RFC 2516, RFC 5072) dialing accel-ppp.
#
# ipv6 enabled negotiates IPv6CP beside IPCP and installs the link-local
# address of the negotiated identifier on pppoe0. accept-ra 2 with forwarding
# on lets the kernel take the default route from accel-ppp's Router
# Advertisements (RFC 7084 W-3), and autoconf forms an address from the
# autonomous prefix they carry.
interface {
    pppoe-client pppoe0 {
        source-interface eth0;
        service-name internet;
        authentication {
            username alice;
            password s3cr3t;
        }
        ipv6 {
            enabled true;
            accept-ra 2;
            autoconf true;
            forwarding true;
        }
    }
}
