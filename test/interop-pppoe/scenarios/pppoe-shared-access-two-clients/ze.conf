# Healthy native fixture only: two pppd clients share this actual VLAN.
# This configuration requests no rate, class-of-service or native retirement.
interface {
    backend kernel;
    ethernet eth0 {
        unit 100 {
            vlan-id 100;
        }
    }
}

pppoe {
    enabled true;
    ac-name ze-shared-access;
    service-name internet;
    auth-method chap-md5;
    interface eth0.100 {
    }
}

l2tp {
    auth {
        local {
            user alice { password s3cr3t; }
            user bob { password s3cr3t; }
        }
    }
    pool {
        ipv4 {
            gateway 10.20.0.1;
            start 10.20.0.2;
            end 10.20.0.10;
            dns-primary 8.8.8.8;
            dns-secondary 8.8.4.4;
        }
    }
}

environment {
    api-server {
        token "ze-pppoe-interop";
        rest {
            enabled true;
            server main { ip 127.0.0.1; port 9099; }
        }
    }
}
