# Ze uses its default CHAP-MD5 authentication policy, with no allow-list.
# The checker dials the pinned pppd client, which refuses CHAP and suggests PAP.
# Valid credentials and a working pool deliberately make an accidental PAP
# downgrade usable: refusal must come from LCP policy, not bad credentials.
pppoe {
    enabled true;
    ac-name ze-bng;
    service-name internet;
    interface eth0 {
    }
}

l2tp {
    auth {
        local {
            user alice {
                password s3cr3t;
            }
        }
    }
    pool {
        ipv4 {
            gateway 10.20.0.1;
            start 10.20.0.2;
            end 10.20.0.10;
            dns-primary 8.8.8.8;
            dns-secondary 8.8.4.4;
        }
    }
}

# Read the actual AC session table, independently of the peer trace.
environment {
    api-server {
        token "ze-pppoe-interop";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 9099;
            }
        }
    }
}
