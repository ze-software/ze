# Ze as a home CPE dialling the accel-ppp access concentrator (RFC 2516), with
# the WAN named by its configured name everywhere: the session device, the
# static default route and the masquerade rule all say pppoe0.
#
# no-default-route keeps the IPCP-learned default out of the kernel, so the
# default route the checker reads is the static one, which waits for the
# session and follows it across a reconnect (docs/guide/static-routes.md,
# "Interface-only next-hops").
#
# lan0 stands in for the LAN: traffic sourced from 198.51.100.1 reaches the AC
# only if the masquerade rule rewrites it to the session address, because the
# AC holds no route back to 198.51.100.0/24.
interface {
    dummy lan0 {
        unit 0 {
            ipv4 {
                address [198.51.100.1/24]
            }
        }
    }
    pppoe-client pppoe0 {
        source-interface eth0;
        service-name internet;
        no-default-route;
        authentication {
            username alice;
            password s3cr3t;
        }
    }
}

static {
    table default {
        route 0.0.0.0/0 {
            next { interface pppoe0 { } }
        }
    }
}

firewall {
    backend nft;
    table cpenat {
        family ip;
        chain postrouting {
            type nat;
            hook postrouting;
            priority 100;
            policy accept;
            term wan-masquerade {
                from { output-interface "pppoe0"; }
                then {
                    masquerade;
                }
            }
        }
    }
}
