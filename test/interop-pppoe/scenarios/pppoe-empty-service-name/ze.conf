# Ze as the PPPoE access concentrator (RFC 2516), with NO service-name
# configured. RFC 2516 Section 5.1 makes an empty Service-Name tag mean "any
# service is acceptable", and Section 5.2/5.4 make the tag mandatory on every
# PADO and PADS the AC sends, even when the offered or accepted service is the
# empty one. This scenario proves both ends of that rule against a real pppd
# client that dials with no requested service: the checker reads the PADO and
# PADS frames off the wire and requires exactly one Service-Name tag on each.
#
# Otherwise identical to 02-ze-ac-pppd-client/ze.conf: same credential and pool
# plugins, same REST session table.
pppoe {
    enabled true;
    ac-name ze-bng;
    auth-method chap-md5;
    interface eth0 {
    }
}

l2tp {
    auth {
        local {
            user alice {
                password s3cr3t;
            }
        }
    }
    pool {
        ipv4 {
            gateway 10.20.0.1;
            start 10.20.0.2;
            end 10.20.0.10;
            dns-primary 8.8.8.8;
            dns-secondary 8.8.4.4;
        }
    }
}

# The scenario reads Ze's own session table over REST (`show pppoe sessions`)
# rather than inferring session state from log lines.
environment {
    api-server {
        token "ze-pppoe-interop";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 9099;
            }
        }
    }
}
