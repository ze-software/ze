# Omitted peer MRU must not raise the AC's fixed transmit MTU above 1492.
pppoe {
    enabled true;
    ac-name ze-bng;
    service-name internet;
    auth-method chap-md5;
    interface eth0 {
    }
}

l2tp {
    auth {
        local {
            user alice {
                password s3cr3t;
            }
        }
    }
    pool {
        ipv4 {
            gateway 10.20.0.1;
            start 10.20.0.2;
            end 10.20.0.10;
        }
    }
}

environment {
    api-server {
        token "ze-pppoe-interop";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 9099;
            }
        }
    }
}
