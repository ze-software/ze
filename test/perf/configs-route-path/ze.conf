# Route-path overlay of test/perf/configs/ze.conf, selected with
# PERF_CONFIGS_DIR=test/perf/configs-route-path.
#
# It measures Ze's full control-plane route path without kernel FIB programming:
#   perf-sender -> bgp-rib -> sysrib (rib) -> best-change -> fib-dummy
#                              \-> perf-receiver
#
# Unlike the stock route-server DUT (`rs-client true` relayed by bgp-rs),
# neither peer here is an rs-client, so bgp-rib runs full RFC 4271 best-path
# selection, installs selected routes into the system RIB, and disseminates
# them to perf-receiver. fib { dummy { } } pulls in rib, suppresses fib-kernel
# auto-load, holds every selected route in memory, and serves
# `show fib dummy counters | json` so the perf runner verifies that every
# announced and withdrawn prefix reached the writer.
#
# This is NOT the route-server throughput baseline. `./le perf record history`
# and `./le perf record evidence` refuse any result produced with an overlay.

# Loopback SSH CLI account used by the perf runner (`interoplab.ZeCLICommand`)
# to read `show fib dummy counters | json` before and after each pass.
system {
    authentication {
        user interop {
            password "$2a$04$UlwuiuH82Unfsq.XEMPGJeDkXwbm3KW.nvVaVXOd/JeFK8VjMjrQO"
        }
    }
}

environment {
    ssh {
        enabled true;
        server main {
            ip 127.0.0.1;
            port 2222;
        }
    }
}

bus {
    endpoint bgp-rib {
        internal bgp-rib;
    }
}

fib {
    dummy { }
}

# Resolve perf-sender's BGP next hop (172.31.0.10) in the system RIB per
# RFC 4271 Section 9.1.2.1 without redistributing any system route into BGP.
static {
    table default {
        route 172.31.0.10/32 {
            next { interface eth0 { } }
        }
    }
}

bgp {
    # RFC 8212 Section 3: an EBGP direction with no explicit policy is refused,
    # so both sessions explicitly accept import and export.
    filter {
        import { final accept; }
        export { final accept; }
    }
    peer perf-sender {
        connection {
            remote { ip 172.31.0.10; connect false; }
            local  { ip 172.31.0.2; port 1790; }
        }
        session {
            asn { local 65000; remote 65001; }
            router-id 10.0.0.1;
            family {
                ipv4/unicast { prefix { maximum 1000000; } }
                ipv6/unicast { prefix { maximum 1000000; } }
            }
        }
    }
    peer perf-receiver {
        connection {
            remote { ip 172.31.0.11; connect false; }
            local  { ip 172.31.0.2; port 1791; }
        }
        session {
            asn { local 65000; remote 65002; }
            router-id 10.0.0.1;
            family {
                ipv4/unicast { prefix { maximum 1000000; } }
                ipv6/unicast { prefix { maximum 1000000; } }
            }
        }
    }
}
