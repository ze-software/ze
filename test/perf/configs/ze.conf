# The perf lab DUT: a route server with two route-server client peers.
#
# Both peers carry `rs-client true` so `bgp-rs` relays between them on the
# RS fast path; auto-loaded `bgp-rib` is silenced so it neither ingests nor
# originates routes. `adj-rib-in` stores what `perf-sender` announces and
# replays it to `perf-receiver` when the sender-first pass brings the
# receiver up after the sender has converged.
bus {
    endpoint bgp-rib {
        internal bgp-rib;
        receive { allow none; }
        send { allow none; }
    }
    endpoint bgp-rs {
        internal bgp-rs;
    }
    endpoint adj-rib-in {
        internal bgp-adj-rib-in;
        receive { from [ /bgp/peer/perf-sender ]; }
        send { to [ /bgp/peer/perf-receiver ]; }
    }
}

bgp {
    # RFC 8212 Section 3: an EBGP direction with no explicit policy is refused,
    # so without this block the DUT accepts the sender's routes into nothing
    # and sends the receiver none (AcceptsAtEnd,
    # internal/component/bgp/filterapi/policy.go). Both sessions are EBGP.
    filter {
        import { final accept; }
        export { final accept; }
    }
    peer perf-sender {
        connection {
            remote { ip 172.31.0.10; connect false; }
            local  { ip 172.31.0.2; port 1790; }
        }
        session {
            asn { local 65000; remote 65001; }
            router-id 10.0.0.1;
            rs-client true;
            family {
                ipv4/unicast { prefix { maximum 1000000; } }
                ipv6/unicast { prefix { maximum 1000000; } }
            }
        }
        behavior {
            rs-fast-path enable;
        }
    }
    peer perf-receiver {
        connection {
            remote { ip 172.31.0.11; connect false; }
            local  { ip 172.31.0.2; port 1791; }
        }
        session {
            asn { local 65000; remote 65002; }
            router-id 10.0.0.1;
            rs-client true;
            family {
                ipv4/unicast { prefix { maximum 1000000; } }
                ipv6/unicast { prefix { maximum 1000000; } }
            }
        }
        behavior {
            rs-fast-path enable;
        }
    }
}
