# The perf lab DUT: a route server with two peers.
#
# Each peer names the two programs it feeds. A peer that attaches no program
# feeds none, because PeerScopedProcs
# (internal/component/plugin/server/delivery_graph.go) reads the attach block
# as the receive authorization. Without these blocks only the reactor-native
# fast path forwards, which stores nothing, so the sender-first pass measures
# a replay that cannot happen and waits out its duration timeout instead.
#
# The token lists are the ones the same shape uses in
# test/interop/scenarios/as-path-mixed-width-relay-frr/ze.conf.
plugin {
    internal bgp-rs {
        use bgp-rs;
    }
    # The store the peer-up replay reads. bgp-rs asks it for the table a peer
    # that establishes late is owed.
    internal adj-rib-in {
        use bgp-adj-rib-in;
    }
}

bgp {
    peer perf-sender {
        connection {
            remote { ip 172.31.0.10; connect false; }
            local  { ip 172.31.0.2; port 1790; }
        }
        session {
            asn { local 65000; remote 65001; }
            router-id 10.0.0.1;
            family {
                ipv4/unicast { prefix { maximum 1000000; } }
                ipv6/unicast { prefix { maximum 1000000; } }
            }
        }
        behavior {
            rs-fast-path enable;
        }
        attach process bgp-rs {
            receive [ update-received state open-received refresh ]
            send [ update ]
        }
        # The source half of the replay: adj-rib-in stores what this peer sends.
        attach process adj-rib-in {
            receive [ update-received state ]
        }
    }
    peer perf-receiver {
        connection {
            remote { ip 172.31.0.11; connect false; }
            local  { ip 172.31.0.2; port 1791; }
        }
        session {
            asn { local 65000; remote 65002; }
            router-id 10.0.0.1;
            family {
                ipv4/unicast { prefix { maximum 1000000; } }
                ipv6/unicast { prefix { maximum 1000000; } }
            }
        }
        behavior {
            rs-fast-path enable;
        }
        attach process bgp-rs {
            receive [ update-received state open-received refresh ]
            send [ update ]
        }
        # The destination half: the replayed route leaves on this peer's wire,
        # so adj-rib-in needs permission to originate one here.
        attach process adj-rib-in {
            send [ update ]
        }
    }
}
