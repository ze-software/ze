// Filter-enabled overlay of test/perf/configs/ze.conf, selected with
// PERF_CONFIGS_DIR=test/perf/configs-filter.
//
// It exists for one purpose:
// `PPROF=1 PERF_CONFIGS_DIR=test/perf/configs-filter go run ./cmd/ze-perf-run --build --test ze`
// enters the filter-delta modify path so the CPU and allocation profiles carry the
// parseFilterAttrs / textDeltaToModOps / encode*Value frames. The stock
// configs/ze.conf has no policy, so that path is never reached and the profile
// is silent about it.
//
// This is NOT the throughput baseline. Do not record a run made with this
// overlay into test/perf/history/: the filters give ze work no other DUT is
// asked to do, so the cross-DUT comparison would be meaningless.
//
// Both halves of the path are covered:
//   - import on perf-sender, once per received UPDATE
//   - export on perf-receiver, once per forwarded UPDATE per destination peer
// Every directive below CHANGES the filter text; an unchanged text takes the
// zero-alloc fast path and the modify code never runs.

plugin {
    internal bgp-rs {
        use bgp-rs;
    }
    internal bgp-filter-modify {
        use bgp-filter-modify;
    }
}

bgp {
    policy {
        modify PERF-IMPORT {
            set {
                local-preference 250;
            }
        }
        modify PERF-EXPORT {
            set {
                med 77;
                origin incomplete;
                community-add [ 65000:100 65000:200 ];
                large-community-add [ 65000:1:2 ];
            }
        }
    }
    peer perf-sender {
        connection {
            remote { ip 172.31.0.10; connect false; }
            local  { ip 172.31.0.2; port 1790; }
        }
        session {
            asn { local 65000; remote 65001; }
            router-id 10.0.0.1;
            family {
                ipv4/unicast { prefix { maximum 1000000; } }
                ipv6/unicast { prefix { maximum 1000000; } }
            }
        }
        filter {
            import [ modify:PERF-IMPORT ];
        }
        behavior {
            rs-fast-path enable;
        }
    }
    peer perf-receiver {
        connection {
            remote { ip 172.31.0.11; connect false; }
            local  { ip 172.31.0.2; port 1791; }
        }
        session {
            asn { local 65000; remote 65002; }
            router-id 10.0.0.1;
            family {
                ipv4/unicast { prefix { maximum 1000000; } }
                ipv6/unicast { prefix { maximum 1000000; } }
            }
        }
        filter {
            export [ modify:PERF-EXPORT ];
        }
        behavior {
            rs-fast-path enable;
        }
    }
}
