plugin {
 internal rsvp-te { use rsvp-te; }
 internal fib-kernel { use fib-kernel; }
}
# The interface section starts the netlink monitor whose link-down event
# drives the PLR's local repair; prot0 itself is made by transit-setup.sh.
interface {
 backend netlink;
}
# OSPF on eth0 to the freeRouter egress (router-id 10.0.14.14) is what ties the
# egress's eth0 address 172.29.81.14, which its RESV for the backup PATH comes
# from, to the merge point 10.0.14.14: the PLR accepts an alternate merge-point
# source only when a live native IGP database attributes it to the same node.
ospf {
 router-id 172.29.81.3
 areas {
  area 0.0.0.0 {
   area-type normal
  }
 }
 interfaces {
  interface eth0 {
   area 0.0.0.0
   network-type point-to-point
   cost 10
  }
 }
}
# The checker reads the OSPF adjacency through `ze cli` as user interop.
system {
 authentication {
  user interop {
   password "$2a$04$UlwuiuH82Unfsq.XEMPGJeDkXwbm3KW.nvVaVXOd/JeFK8VjMjrQO"
  }
 }
}
environment {
 ssh {
  enabled true
  server main {
   ip 127.0.0.1;
   port 2222;
  }
 }
}
rsvp-te {
 router-id 172.29.81.3
 refresh-period 2
 refresh-multiplier 3
 interface eth0 {
  address 172.29.81.3/24
  max-bandwidth 1000000000
  max-reservable-bandwidth 1000000000
 }
 interface prot0 {
  address 10.0.14.3/24
  max-bandwidth 1000000000
  max-reservable-bandwidth 1000000000
 }
 bypass around-prot0 {
  merge-point 10.0.14.14
  explicit-route 1 {
   address 172.29.81.15/32
   type strict
  }
  explicit-route 2 {
   address 172.29.81.14/32
   type strict
  }
 }
}
