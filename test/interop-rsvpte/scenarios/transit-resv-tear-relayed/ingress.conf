plugin {
 internal rsvp-te { use rsvp-te; }
 internal fib-kernel { use fib-kernel; }
}
rsvp-te {
 router-id 172.29.81.2
 refresh-period 2
 refresh-multiplier 3
 interface eth0 {
  address 172.29.81.2/24
  max-bandwidth 1000000000
  max-reservable-bandwidth 1000000000
 }
 tunnel lsp {
  destination 172.29.81.4
  tunnel-id 1
  bandwidth 1000000
  explicit-route 1 {
   address 172.29.81.15/32
   type strict
  }
  explicit-route 2 {
   address 172.29.81.3/32
   type strict
  }
  explicit-route 3 {
   address 172.29.81.4/32
   type strict
  }
  fast-reroute {
   backup facility
   node-protection false
  }
 }
}
