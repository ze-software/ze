; xl2tpd as an LNS (answerer) for the ze-initiator interop scenario.
; ze dials this daemon (sends SCCRQ); xl2tpd answers SCCRP, receives ze's
; SCCCN, and the control connection is established. This proves ze's new
; initiator/LAC tunnel path interoperates with a real L2TPv2 daemon.
;
; Port 17010 (not the RFC 1701 default) avoids colliding with any host L2TP
; listener when the scenario runs the peer with --network host.
[global]
port = 17010
debug tunnel = yes
debug state = yes
debug avp = yes

; [lns default] accepts an incoming tunnel from any LAC. Tunnel
; authentication is disabled so the handshake needs no shared secret
; (ze dials with auth-method none).
[lns default]
require authentication = no
require chap = no
refuse pap = no
ppp debug = yes
pppoptfile = /etc/ppp/options.xl2tpd
length bit = yes
