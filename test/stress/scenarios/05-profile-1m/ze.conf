# The profile scenario. Its job is to make one CPU/heap profile carry the
# three paths perf round 3 changed (docs/architecture/perf-round-3.md), so
# every block below exists to reach one of them. Those paths run once per
# UPDATE, so the harness's injector sends one prefix per UPDATE, each with its
# own MED and COMMUNITIES (1,000,000 UPDATEs for the full run):
#   - filter delta: an import AND an export modify policy whose directives
#     change the filter text; an unchanged text takes the zero-alloc fast
#     path and the modify code never runs.
#   - eBGP forwarding: bgp-rs relays every injected route to "receiver", an
#     eBGP sink (AS 65200), so each forwarded UPDATE is rebuilt with the local
#     AS prepended and the export delta applied.
#   - Community.AppendText: the import policy adds communities, bgp-rib keeps
#     the routes, and the harness fetches the best table as JSON through the
#     looking glass, whose rendering marshals every community.
# Addresses and ASNs are the harness's (internal/le/test/integration/stress.go).

plugin {
	internal rs {
		use bgp-rs;
	}
	internal bgp-rib {
		use bgp-rib;
	}
	internal bgp-filter-modify {
		use bgp-filter-modify;
	}
}
environment {
	looking-glass {
		enabled true;
		tls false;
		server stress {
			ip 127.0.0.1;
			port 8443;
		}
	}
}
bgp {
	router-id 172.31.0.2;
	session {
		asn {
			local 65001;
		}
	}
	policy {
		modify STRESS-IMPORT {
			set {
				local-preference 250;
				community-add [ 65001:100 65001:200 ];
			}
		}
		modify STRESS-EXPORT {
			set {
				med 77;
				community-add [ 65001:300 ];
			}
		}
	}
	peer injector {
		connection {
			remote {
				ip 172.31.0.3;
				connect false;
			}
			local {
				ip 172.31.0.2;
				port 179;
				accept true;
			}
		}
		session {
			asn {
				remote 65100;
			}
			family {
				ipv4/unicast { prefix { maximum 2000000; } }
			}
		}
		filter {
			import [ modify:STRESS-IMPORT ];
		}
		attach process bgp-rib {
			receive [ update state refresh ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
	peer receiver {
		connection {
			remote {
				ip 172.31.0.4;
			}
			local {
				ip 172.31.0.2;
				accept false;
			}
		}
		session {
			asn {
				remote 65200;
			}
			family {
				ipv4/unicast { prefix { maximum 2000000; } }
			}
		}
		filter {
			export [ modify:STRESS-EXPORT ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
}
