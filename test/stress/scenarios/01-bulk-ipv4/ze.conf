plugin {
	internal rib {
		use bgp-rib;
	}
}
bgp {
	# RFC 8212 Section 3: an EBGP direction with no explicit policy passes
	# no routes, so this config states that its sessions exchange them all.
	filter {
		import { final accept; }
		export { final accept; }
	}
	router-id 172.31.0.2;
	session {
		asn {
			local 65001;
		}
	}
	peer injector {
		connection {
			remote {
				ip 172.31.0.3;
				connect false;
			}
			local {
				ip 172.31.0.2;
				port 179;
				accept true;
			}
		}
		session {
			asn {
				remote 65100;
			}
			family {
				ipv4/unicast { prefix { maximum 2000000; } }
			}
		}
	}
}
