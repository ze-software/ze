l2tp {
    enabled true;
    shared-secret s3cr3t;
    mru 1492;
    auth-method chap-md5;
    authentication {
        allow [ chap-md5 ];
    }
    ncp {
        enable-ipv6cp false;
    }
    auth {
        local {
            user "subscriber@ze" {
                password chapsecret;
            }
        }
    }
    pool {
        ipv4 {
            gateway 10.99.8.1;
            start 10.99.8.10;
            end 10.99.8.20;
        }
    }
}
environment {
    l2tp {
        server main {
            ip 0.0.0.0;
            port 1701;
        }
    }
}
