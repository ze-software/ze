l2tp {
    enabled true;
    auth-method none;
    allow-no-auth true;
    hello-interval 5;
    max-tunnels 4;
    max-sessions 4;
    auth {
        radius {
            nas-identifier lns1;
            nas-port-id-format "{nas-id}:{tunnel-id}.{session-id}";
            acct-interval 60;
            timeout 5;
            retries 2;
            server mock {
                address 172.29.0.5;
                port 1812;
                shared-key testing123;
            }
        }
    }
    pool {
        ipv4 {
            gateway 10.100.0.1;
            start 10.100.0.2;
            end 10.100.0.10;
            dns-primary 8.8.8.8;
            dns-secondary 8.8.4.4;
        }
    }
}
environment {
    l2tp {
        server main {
            ip 172.29.0.2;
            port 1701;
        }
    }
}
