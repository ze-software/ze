l2tp {
    enabled true;
    auth-method chap-md5;
    hello-interval 5;
    max-tunnels 4;
    max-sessions 4;
    auth {
        radius {
            nas-identifier lns-policy;
            timeout 5;
            retries 1;
            server mock {
                address 172.29.0.5;
                port 1812;
                accounting-port 1812;
                shared-key testing123;
            }
        }
    }
    pool {
        ipv4 {
            gateway 10.100.0.1;
            start 10.100.0.2;
            end 10.100.0.10;
        }
    }
}
environment {
    l2tp {
        server main {
            ip 172.29.0.2;
            port 1701;
        }
    }
    api-server {
        token "secret";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 17012;
            }
        }
    }
}
