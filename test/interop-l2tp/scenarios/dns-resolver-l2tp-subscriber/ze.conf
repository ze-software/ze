# Ze as the L2TP LNS and LAN DNS resolver of its subscribers.
#
# The subscriber (the xl2tpd + pppd LAC, `usepeerdns`) asks for DNS servers
# in IPCP (RFC 1877) and is given the pool gateway 10.100.0.1, where the
# resolver listens, as both its primary and secondary DNS. The resolver
# answers the pool (allow-from 10.100.0.0/24) and forwards to Knot DNS
# (172.29.0.7), authoritative for lab.example. The gateway exists only
# while a session is up; the resolver binds it before then (IP_FREEBIND), so
# the lab needs no sysctl.
l2tp {
    enabled true;
    auth-method none;
    allow-no-auth true;
    hello-interval 5;
    max-tunnels 4;
    max-sessions 4;
    pool {
        ipv4 {
            gateway 10.100.0.1;
            start 10.100.0.2;
            end 10.100.0.10;
            dns-primary 10.100.0.1;
            dns-secondary 10.100.0.1;
        }
    }
}
service {
    dns-resolver {
        enabled true;
        listener subscribers {
            ip 10.100.0.1;
            port 53;
        }
        allow-from [ 10.100.0.0/24 ];
        forward {
            server 172.29.0.7 {
                port 53;
            }
        }
    }
}
environment {
    l2tp {
        server main {
            ip 172.29.0.2;
            port 1701;
        }
    }
}
