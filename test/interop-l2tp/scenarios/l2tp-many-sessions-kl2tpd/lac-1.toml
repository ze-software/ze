# One real L2TPv2 tunnel carrying sixteen separately authenticated PPP sessions.
[tunnel.lac1]
local = "172.29.0.11:1702"
peer = "172.29.0.21:1701"
version = "l2tpv2"
encap = "udp"
tid = 1001
window_size = 4
hello_timeout = 5000
host_name = "scale-lac-1"
framing_caps = ["sync"]

[tunnel.lac1.session.s01]
sid = 1
pseudowire = "ppp"
pppd_args = "/etc/ppp/scale/scale-1-01"

[tunnel.lac1.session.s02]
sid = 2
pseudowire = "ppp"
pppd_args = "/etc/ppp/scale/scale-1-02"

