# One real L2TPv2 tunnel carrying sixteen separately authenticated PPP sessions.
[tunnel.lac3]
local = "172.29.0.13:1702"
peer = "172.29.0.23:1701"
version = "l2tpv2"
encap = "udp"
tid = 1003
window_size = 4
hello_timeout = 5000
host_name = "scale-lac-3"
framing_caps = ["sync"]

[tunnel.lac3.session.s01]
sid = 1
pseudowire = "ppp"
pppd_args = "/etc/ppp/scale/scale-3-01"

[tunnel.lac3.session.s02]
sid = 2
pseudowire = "ppp"
pppd_args = "/etc/ppp/scale/scale-3-02"

