l2tp {
    enabled true;
    auth-method chap-md5;
    hello-interval 5;
    max-tunnels 8;
    max-sessions 64;
    authentication {
        allow [ chap-md5 ];
    }
    auth {
        radius {
            nas-identifier lns-scale;
            timeout 5;
            retries 1;
            coa-port 3799;
            server scale {
                address 172.29.0.5;
                port 1812;
                accounting-port 1813;
                shared-key ze-subscriber-fixture-secret;
            }
        }
    }
    pool {
        ipv4 {
            gateway 10.100.0.1;
            start 10.100.0.2;
            end 10.100.0.100;
        }
    }
}
environment {
    l2tp {
        server main {
            ip 172.29.0.2;
            port 1701;
        }
    }
    api-server {
        token "secret";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 17012;
            }
        }
    }
}
redistribute {
    destination bgp {
        import l2tp
    }
}
bgp {
    filter {
        import { final accept; }
        export { final accept; }
    }
    peer frr {
        connection {
            remote { ip 172.29.0.4; }
            local  { ip 172.29.0.2; }
        }
        session {
            asn { local 65001; remote 65002; }
            router-id 172.29.0.2;
            family {
                ipv4/unicast { prefix { maximum 10000; } }
            }
        }
    }
}
