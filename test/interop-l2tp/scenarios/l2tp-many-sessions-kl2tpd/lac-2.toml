# One real L2TPv2 tunnel carrying sixteen separately authenticated PPP sessions.
[tunnel.lac2]
local = "172.29.0.12:1702"
peer = "172.29.0.22:1701"
version = "l2tpv2"
encap = "udp"
tid = 1002
window_size = 4
hello_timeout = 5000
host_name = "scale-lac-2"
framing_caps = ["sync"]

[tunnel.lac2.session.s01]
sid = 1
pseudowire = "ppp"
pppd_args = "/etc/ppp/scale/scale-2-01"

[tunnel.lac2.session.s02]
sid = 2
pseudowire = "ppp"
pppd_args = "/etc/ppp/scale/scale-2-02"

