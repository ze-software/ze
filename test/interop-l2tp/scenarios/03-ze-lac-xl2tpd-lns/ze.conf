# ze as the L2TP initiator (LAC/dialer) for the interop scenario.
#
# The `remote xl2tpd` dial target points at the containerised xl2tpd-LNS
# (reached over 127.0.0.1:17010 with --network host). `outgoing-calls true`
# permits the `request l2tp outgoing-call` RPC to dial it. auth-method none +
# no per-remote shared-secret means ze's SCCRQ carries no Challenge, matching
# xl2tpd's `require authentication = no`.
#
# The api-server/rest block (token-guarded) is the trigger surface: the
# scenario runner POSTs `request l2tp outgoing-call` to /api/v1/execute, which
# drives the dial. Ports are high and fixed so the runner can reach them.
l2tp {
	enabled true
	auth-method none
	allow-no-auth true
	remote xl2tpd {
		address 127.0.0.1
		port 17010
		outgoing-calls true
	}
}
environment {
	l2tp {
		server main {
			ip 127.0.0.1
			port 17011
		}
	}
	api-server {
		token "secret";
		rest {
			enabled true;
			server main {
				ip 127.0.0.1;
				port 17012;
			}
		}
	}
}
