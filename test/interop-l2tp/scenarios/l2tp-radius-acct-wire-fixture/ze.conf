l2tp {
    enabled true;
    shared-secret s3cr3t;
    auth-method chap-md5;
    cqm-enabled true;
    auth {
        radius {
            nas-identifier lns1;
            nas-port-id-format "{nas-id}:{tunnel-id}.{session-id}";
            acct-interval 60;
            timeout 5;
            retries 2;
            server mock {
                address 127.0.0.1;
                port 1812;
                accounting-port 1812;
                shared-key testing123;
            }
        }
    }
    pool {
        ipv4 {
            gateway 10.99.7.1;
            start 10.99.7.10;
            end 10.99.7.10;
        }
    }
}
environment {
    l2tp {
        server main {
            ip 0.0.0.0;
            port 1701;
        }
    }
}
