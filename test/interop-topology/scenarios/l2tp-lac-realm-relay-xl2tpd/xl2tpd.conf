; xl2tpd 1.3.20 as the LNS of l2tp-lac-realm-relay-xl2tpd, on eth1 (link core,
; 192.0.2.3). It answers the tunnel ze-lac dials: ze-lac challenges it with the
; shared secret in l2tp-secrets and xl2tpd answers (control.c, SCCRQ). For the
; incoming call it starts pppd with the options below and ppp-options. xl2tpd
; ignores the proxy LCP and proxy authentication AVPs of the ICCN (avp.c: no
; handler for 26 to 28, ignore_avp for 29 to 33), so its pppd runs its own LCP
; and CHAP-MD5 with a subscriber the LAC already took to Opened, checking CHAP
; from chap-secrets, and hands it 203.0.113.1 with 100.64.0.1 as its own end.
[global]
listen-addr = 192.0.2.3
port = 1701
auth file = /etc/xl2tpd/l2tp-secrets
access control = no
debug avp = yes
debug state = yes
debug tunnel = yes

[lns default]
ip range = 203.0.113.1-203.0.113.1
local ip = 100.64.0.1
require chap = yes
refuse pap = yes
require authentication = yes
name = xl2tpd-lns
ppp debug = yes
pppoptfile = /etc/ppp/options.xl2tpd-lns
length bit = yes
