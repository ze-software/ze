# accel-ppp 1.14.0, the access concentrator of pppoe-dhcpv6-pd-ze-client, on
# eth1 (link access). It runs IPv6CP with interface identifier ::1 and takes
# the CPE's own identifier (ipv6-accept-peer-intf-id), sends Router
# Advertisements carrying the session's /64 from 2001:db8:198::/48 with the
# autonomous flag (ipv6_nd, nd.c), and answers DHCPv6 on the session with a
# /60 from 2001:db8:2000::/40 (ipv6_dhcp, dhcpv6.c): a length other than the
# /56 Ze hints, so the CPE accepting it is RFC 7084 WPD-3. IPv6 is allow, not
# require, so a CPE that never opens IPv6CP keeps its IPv4 session and the
# checker names the IPv6 step that failed. [ipv6-dhcp] verbose and [log]
# level 5 print every DHCPv6 message to the file the checker reads. PAP reads
# its credentials through chap-secrets, which the prestart writes.

[modules]
log_file
cli
pppoe
auth_pap
chap-secrets
ippool
ipv6pool
ipv6_nd
ipv6_dhcp

[cli]
tcp=127.0.0.1:2001

[core]
thread-count=2

[log]
log-file=/var/log/accel-ppp.log
level=5
copy=1

[pppoe]
interface=eth1
ac-name=ze-pd-ac
service-name=internet
verbose=1

[ppp]
verbose=1
mtu=1492
mru=1492
ipv4=require
ipv6=allow
ipv6-intf-id=0:0:0:1
ipv6-accept-peer-intf-id=1
lcp-echo-interval=30
lcp-echo-failure=3
mppe=deny

[ip-pool]
gw-ip-address=10.198.0.1
10.198.0.2-10

[ipv6-pool]
2001:db8:198::/48,64
delegate=2001:db8:2000::/40,60

[ipv6-nd]
AdvAutonomousFlag=1

[ipv6-dhcp]
verbose=1
pref-lifetime=3600
valid-lifetime=7200
route-via-gw=1

[chap-secrets]
chap-secrets=/etc/accel-ppp/chap-secrets
