# Ze as the CPE of pppoe-dhcpv6-pd-ze-client: a PPPoE client on eth1 (link
# access) that negotiates IPv6CP beside IPCP, takes its default route from
# accel-ppp's Router Advertisements with forwarding on (accept-ra 2),
# autoconfigures from their prefix, and asks DHCPv6 on the session device for
# a delegated /56 (spec-home-cpe-8 Phases 1 to 3). Nothing here uses the
# delegated prefix on a LAN: that is Phases 4 and 5.
interface {
    pppoe-client pppoe0 {
        source-interface eth1;
        mtu 1492;
        service-name internet;
        authentication {
            username alice;
            password s3cr3t;
        }
        ipv6 {
            enabled true;
            accept-ra 2;
            autoconf true;
            forwarding true;
            dhcpv6 {
                enabled true;
                pd {
                    length 56;
                }
            }
        }
    }
}
