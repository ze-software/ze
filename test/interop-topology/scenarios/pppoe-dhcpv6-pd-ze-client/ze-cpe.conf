# Ze as the CPE of pppoe-dhcpv6-pd-ze-client: a PPPoE client on eth1 (link
# access) that negotiates IPv6CP beside IPCP, takes its default route from
# accel-ppp's Router Advertisements with forwarding on (accept-ra 2),
# autoconfigures from their prefix, and asks DHCPv6 on the session device for
# a delegated /56 (spec-home-cpe-8 Phases 1 to 3). lan0 (link delegated-lan)
# takes subnet-id 1 of the delegated prefix with the default interface
# identifier ::1, and advertises that /64 and the delegated prefix to the
# dhcpcd host there (Phases 4 and 5). The RA intervals are the shortest the
# schema allows, so the checker reads many RAs inside one 30-second renew
# period; router-lifetime is written out because the checker asserts it.
interface {
    ethernet lan0 {
        unit 0 {
            ipv6 {
                forwarding true;
                delegated-prefix pppoe0 {
                    subnet-id 1;
                }
                router-advertisement {
                    enabled true;
                    maximum-interval 4;
                    minimum-interval 3;
                    router-lifetime 1800;
                }
            }
        }
    }
    pppoe-client pppoe0 {
        source-interface eth1;
        mtu 1492;
        service-name internet;
        authentication {
            username alice;
            password s3cr3t;
        }
        ipv6 {
            enabled true;
            accept-ra 2;
            autoconf true;
            forwarding true;
            dhcpv6 {
                enabled true;
                pd {
                    length 56;
                }
            }
        }
    }
}
