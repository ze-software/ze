# Ze LAC of access-wholesale. Unlike the access chain's shared LAC, it relays by
# realm: the subscriber's username ends in @lab.example.net, so the LAC runs
# LCP and starts CHAP with the subscriber itself, then places the incoming
# call to ze-lns with the proxy LCP and proxy authentication AVPs of RFC 2661
# Section 4.4.5. ze-lns ignores the proxy LCP (proxy-lcp renegotiate).
pppoe {
    enabled true;
    ac-name ze-lac;
    interface eth1 {
    }
}

l2tp {
    enabled true;
    hello-interval 5;
    remote lns {
        address 192.0.2.3;
        port 1701;
        shared-secret ze-access-tunnel-secret;
    }
    relay-realm lab.example.net {
        remote lns;
    }
}

environment {
    l2tp {
        server main {
            ip 192.0.2.2;
            port 1701;
        }
    }
    api-server {
        token "secret";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 17012;
            }
        }
    }
}
