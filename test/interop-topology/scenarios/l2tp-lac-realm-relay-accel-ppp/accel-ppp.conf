# accel-ppp 1.14.0 as the LNS of l2tp-lac-realm-relay-accel-ppp, on eth1 (link
# core, 192.0.2.3). It answers the tunnel ze-lac dials with the shared fixture
# secret and terminates the realm-relayed subscriber's PPP. Its ICCN handling
# (l2tp.c l2tp_recv_ICCN) skips the proxy LCP and proxy authentication AVPs,
# so it starts its own LCP with a subscriber the LAC already took to Opened,
# and challenges it again with CHAP-MD5 from chap-secrets, which the
# scenario's prestart writes with pppd's entry only (register_wholesale_accel.go
# accelLNSFor, pppdChapLine). The subscriber gets the address chap-secrets
# names and sees 100.64.0.1 as its IPCP peer. [ppp] verbose and [log] level 5
# print every LCP and CHAP packet to the file the checker reads.
[modules]
log_file
l2tp
auth_chap_md5
chap-secrets

[core]
thread-count=2

[log]
log-file=/var/log/accel-ppp.log
level=5
copy=1

[l2tp]
bind=192.0.2.3
secret=ze-access-tunnel-secret
host-name=accel-lns
hello-interval=5
ppp-max-mtu=1492
verbose=1

[ppp]
verbose=1
mtu=1492
mru=1492
ipv4=require
ipv6=deny
lcp-echo-interval=30
lcp-echo-failure=3
mppe=deny

[chap-secrets]
chap-secrets=/etc/accel-ppp/chap-secrets
gw-ip-address=100.64.0.1

# accel-ppp accepts an L2TP peer only from an address in [client-ip-range]:
# with the section absent its list is empty, so l2tp_udp_read
# (ctrl/l2tp/l2tp.c) discards every SCCRQ as "out of client-ip-range", and
# l2tp_init warns "no IP address range defined ... incoming L2TP connections
# will be rejected" (iprange.c iprange_client_check, check_range). The range
# is link core, where ze-lac dials from 192.0.2.2. It stays clear of the
# subscriber's 203.0.113.1, which ipcp_opt_ipaddr.c refuses inside it.
[client-ip-range]
192.0.2.0/24
