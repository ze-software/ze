# Ze LAC of l2tp-lac-realm-relay-accel-ppp. It relays the realm lab.example.net: a
# subscriber whose username ends in @lab.example.net (pppd) has its LCP and
# CHAP run here, then the LAC places an incoming call to the LNS at 192.0.2.3
# (accel-ppp) with the proxy LCP and proxy authentication AVPs of RFC 2661
# Section 4.4.5 and bridges the subscriber to it. A subscriber of any other
# realm (pppd-stray, @other.example.net) is authenticated locally, and with no
# local user configured the LAC refuses it ("no users configured").
pppoe {
    enabled true;
    ac-name ze-lac;
    interface eth1 {
    }
}

l2tp {
    enabled true;
    hello-interval 5;
    remote lns {
        address 192.0.2.3;
        port 1701;
        shared-secret ze-access-tunnel-secret;
    }
    relay-realm lab.example.net {
        remote lns;
    }
}

environment {
    l2tp {
        server main {
            ip 192.0.2.2;
            port 1701;
        }
    }
    api-server {
        token "secret";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 17012;
            }
        }
    }
}
