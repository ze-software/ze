# Ze as the PPPoE access concentrator on the access link, eth1: a VLAN
# only ze-client joins, so discovery never reaches eth0. The credential and
# the pool follow test/interop-pppoe/scenarios/02-ze-ac-pppd-client/ze.conf.
pppoe {
    enabled true;
    ac-name ze-bng;
    service-name internet;
    auth-method chap-md5;
    interface eth1 {
    }
}

l2tp {
    auth {
        local {
            user alice {
                password s3cr3t;
            }
        }
    }
    pool {
        ipv4 {
            gateway 10.20.0.1;
            start 10.20.0.2;
            end 10.20.0.10;
            dns-primary 8.8.8.8;
            dns-secondary 8.8.4.4;
        }
    }
}
