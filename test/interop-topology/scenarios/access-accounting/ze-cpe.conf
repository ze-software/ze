# Ze CPE of the access chain: a PPPoE client on eth1, link access, asking for
# no Service-Name, so ze-lac's relay keyed by the empty string carries the
# session to ze-lns. Its eth0 holds no address (the declaration's prestart
# flushes it), so the session is the only way it reaches the LNS. The
# credential is the fixture user FreeRADIUS answers with Framed-IP-Address
# 203.0.113.1.
interface {
    pppoe-client pppoe0 {
        source-interface eth1;
        authentication {
            username "cpe@lab.example.net";
            password cpe-fixture-password;
        }
    }
}
