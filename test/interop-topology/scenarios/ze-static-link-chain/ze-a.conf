# Ze node A of ze-static-link-chain. It reaches link b-c (10.181.2.0/24) through B's eth1 on link a-b.

static {
	table default {
		route 10.181.2.0/24 {
			next {
				hop 10.181.1.3 {
				}
			}
		}
	}
}

# The CLI account the checker queries this node with (interoplab.ZeCLICommand):
# the fixture-only user interop, password testpass, published bcrypt hash.
system {
	authentication {
		user interop {
			password "$2a$04$UlwuiuH82Unfsq.XEMPGJeDkXwbm3KW.nvVaVXOd/JeFK8VjMjrQO"
		}
	}
}

environment {
	ssh {
		enabled true
		server main {
			ip 127.0.0.1;
			port 2222;
		}
	}
}

# The netlink interface backend, which the checker's `show interface brief`
# reads: with no `interface` block the interface component loads no backend
# and the command answers "iface: no backend loaded".
interface {
	backend netlink;
}
