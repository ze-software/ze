# Ze CPE of access-pool: a PPPoE client on eth1, link access, asking for no
# Service-Name, so ze-lac's relay keyed by the empty string carries the
# session to ze-lns. Its eth0 holds no address (the declaration's prestart
# flushes it). The credential is the fixture user whose Access-Accept carries
# no Framed-IP-Address, so its address comes from the LNS pool.
interface {
    pppoe-client pppoe0 {
        source-interface eth1;
        authentication {
            username "pool@lab.example.net";
            password pool-fixture-password;
        }
    }
}
