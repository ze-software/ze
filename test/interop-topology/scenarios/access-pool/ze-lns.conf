# Ze LNS of access-pool, on eth1 (link core, 192.0.2.3).
#
# It answers the tunnel ze-lac dials with the shared fixture secret, offers
# MRU 1492 and CHAP-MD5 only, and checks every CHAP response with FreeRADIUS
# at 192.0.2.4, sending from 192.0.2.3 as NAS ze-lns. The subscriber's
# Access-Accept carries no Framed-IP-Address, so the subscriber's address
# comes from the pool, which also holds the gateway every session sees as its
# IPCP peer and the DNS servers IPCP offers. The REST surface on loopback is
# how the checker reads the session table and the pool.
l2tp {
    enabled true;
    shared-secret ze-access-tunnel-secret;
    auth-method chap-md5;
    mru 1492;
    authentication {
        allow [ chap-md5 ];
    }
    hello-interval 5;
    auth {
        radius {
            source-address 192.0.2.3;
            nas-identifier ze-lns;
            timeout 5;
            retries 2;
            server freeradius {
                address 192.0.2.4;
                port 1812;
                shared-key ze-access-fixture-secret;
            }
        }
    }
    pool {
        ipv4 {
            gateway 100.64.0.1;
            start 100.64.0.2;
            end 100.64.0.254;
            dns-primary 192.0.2.53;
            dns-secondary 192.0.2.54;
        }
    }
}

environment {
    l2tp {
        server main {
            ip 192.0.2.3;
            port 1701;
        }
    }
    api-server {
        token "secret";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 17012;
            }
        }
    }
}
