# Ze as the home CPE of pppoe-mss-pmtu: a PPPoE client on eth1 (link access)
# with MTU 1492, the LAN on eth2 (link lan, 10.185.1.3), and the converted
# VyOS `adjust-mss clamp-mss-to-pmtu`: a forward-chain term that clamps every
# SYN leaving on the PPPoE device to the route MSS. The masquerade gives the
# LAN host's SYN the session address, the source accel-ppp routes back.
interface {
    pppoe-client pppoe0 {
        source-interface eth1;
        mtu 1492;
        service-name internet;
        authentication {
            username alice;
            password s3cr3t;
        }
    }
}

firewall {
    backend nft;
    table cpe {
        family inet;
        chain forward {
            type filter;
            hook forward;
            priority 0;
            policy accept;
            term clamp {
                from { output-interface "pppoe*"; protocol tcp; tcp-flags syn; }
                then { tcp-mss-clamp-to-pmtu; }
            }
        }
        chain postrouting {
            type nat;
            hook postrouting;
            priority 100;
            policy accept;
            term wan {
                from { output-interface "pppoe*"; }
                then { masquerade; }
            }
        }
    }
}
