# accel-ppp, the access concentrator and router of pppoe-mss-pmtu. PPPoE runs
# on eth1 (link access); eth2 (link core, 10.186.1.0/24) reaches the server.
# The session MTU is 1492, the PPPoE value, and this file sets no MSS clamp
# option, so a 1452 at the server comes from Ze's term; the red walk (Ze's term
# removed, the 1460 SYN arrives as 1460) proves it (A-3).
# auth_pap reads its credentials through the chap-secrets module; the file is
# written by the scenario's prestart (register_pppoe_mss_pmtu.go).

# `cli` serves accel-cmd on 127.0.0.1:2001, for diagnosis.
[modules]
log_file
cli
pppoe
auth_pap
chap-secrets
ippool

[cli]
tcp=127.0.0.1:2001

[core]
thread-count=2

[log]
log-file=/dev/stdout
level=4
copy=1

[pppoe]
interface=eth1
ac-name=ze-mss-ac
service-name=internet
verbose=1

[ppp]
verbose=1
mtu=1492
mru=1492
ipv4=require
ipv6=deny
lcp-echo-interval=30
lcp-echo-failure=3
mppe=deny

[ip-pool]
gw-ip-address=10.184.0.1
10.184.0.2-10

[chap-secrets]
chap-secrets=/etc/accel-ppp/chap-secrets
