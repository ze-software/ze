# Ze LAC of access-wholesale-accel-lns, the same as access-wholesale's: it
# relays by realm, so it runs LCP and starts CHAP with the subscriber itself,
# then places the incoming call to the LNS at 192.0.2.3 (here accel-ppp) with
# the proxy LCP and proxy authentication AVPs of RFC 2661 Section 4.4.5.
# accel-ppp ignores them and renegotiates.
pppoe {
    enabled true;
    ac-name ze-lac;
    interface eth1 {
    }
}

l2tp {
    enabled true;
    hello-interval 5;
    remote lns {
        address 192.0.2.3;
        port 1701;
        shared-secret ze-access-tunnel-secret;
    }
    relay-realm lab.example.net {
        remote lns;
    }
}

environment {
    l2tp {
        server main {
            ip 192.0.2.2;
            port 1701;
        }
    }
    api-server {
        token "secret";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 17012;
            }
        }
    }
}
