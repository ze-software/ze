# FreeRADIUS of the access chain: the one NAS it answers, the Ze LNS at
# 192.0.2.3 on the core link (host 3 of 192.0.2.0/24).
#
# The secret is a fixture value published in this repository. It never
# protects anything, and it must not resemble an operator secret.
#
# require_message_authenticator is on: FreeRADIUS discards an Access-Request
# with no valid Message-Authenticator, so every login also proves the server
# verified the signature Ze computed (the subscriber lab's clients.conf
# explains the BlastRADIUS defence this mirrors).
client ze-lns {
	ipaddr = 192.0.2.3
	secret = ze-access-fixture-secret
	nas_type = other
	require_message_authenticator = yes
}
