# Ze LAC of the access chain (access-up, access-pool, access-accounting).
#
# The PPPoE server answers on eth1, link access, which only ze-cpe joins. A
# subscriber that asks for no Service-Name matches the relay keyed by the
# empty string, so the LAC terminates nothing: it dials the LNS remote at
# 192.0.2.3 on eth2 (link core), places an incoming call and bridges the
# PPPoE channel to the PPPoL2TP channel in the kernel. LCP, CHAP and IPCP run
# between ze-cpe and ze-lns across that bridge.
#
# The L2TP listener binds this node's core address: a dialed tunnel sends
# from the listener socket, so this is the tunnel's source. The tunnel secret
# is a fixture value, the same in ze-lns.conf. The REST surface on loopback
# is how the checker reads the LAC's tunnel and session tables.
pppoe {
    enabled true;
    ac-name ze-lac;
    interface eth1 {
    }
}

l2tp {
    enabled true;
    hello-interval 5;
    remote lns {
        address 192.0.2.3;
        port 1701;
        shared-secret ze-access-tunnel-secret;
    }
    relay "" {
        remote lns;
    }
}

environment {
    l2tp {
        server main {
            ip 192.0.2.2;
            port 1701;
        }
    }
    api-server {
        token "secret";
        rest {
            enabled true;
            server main {
                ip 127.0.0.1;
                port 17012;
            }
        }
    }
}
