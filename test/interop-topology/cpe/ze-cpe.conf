# The home CPE's Ze configuration: vyos.conf converted by the model following
# docs/guide/migrating-from-vyos.md, with conversion-record.md beside it. It
# holds placeholders, never a value. A placeholder is SECRET:name or LAB:name
# between doubled angle brackets, written only where a value goes, because
# every one in this file is substituted, in a comment too: a SECRET is a
# secret the owner fills on the router, a LAB value one the lab issues at run
# time (a certificate body, a public key derived from a lab private key). The lab
# substitutes lab-values and the issued values (home_lab_render.go) and runs
# the result as the CPE of every home-CPE lab scenario. Edit this file only by
# re-running the conversion: the conversion scenario refuses a hand edit that
# the record does not explain.
interface {
    ethernet eth1 {
        description WAN;
    }
    ethernet eth2 {
        description LAN;
    }
    bridge br0 {
        member [ eth2 ];
        unit 0 {
            ipv4 {
                address [ 192.168.50.1/24 10.99.0.1/24 ];
            }
        }
    }
    pppoe-client pppoe0 {
        source-interface eth1;
        mtu 1492;
        no-default-route;
        authentication {
            username cpe@lab.example.net;
            password "<<SECRET:pppoe-pppoe0-password>>";
        }
    }
    wireguard wg0 {
        listen-port 51820;
        private-key "<<SECRET:wg-wg0-private-key>>";
        peer laptop {
            public-key "<<LAB:wg-wg0-laptop-public-key>>";
            preshared-key "<<SECRET:wg-wg0-laptop-psk>>";
            allowed-ips [ 10.88.0.2/32 ];
        }
        unit 0 {
            ipv4 {
                address [ 10.88.0.1/24 ];
            }
        }
    }
    xfrm vti0 {
        if-id 10;
        unit 0 {
            ipv6 {
                address [ fd00:db8:1::2/112 ];
            }
        }
    }
}

static {
    table default {
        route 0.0.0.0/0 {
            distance 10;
            next {
                interface pppoe0 {
                }
            }
        }
    }
}

firewall {
    backend nft;
    global-options {
        all-ping enable;
        syn-cookies enable;
    }
    table v4-input {
        family ip;
        chain input {
            type filter;
            hook input;
            priority 0;
            policy drop;
            term rule-10 {
                from {
                    connection-state established,related;
                }
                then {
                    accept;
                }
            }
            term rule-20-a {
                from {
                    protocol tcp;
                    source-address 192.168.50.0/24;
                    destination-port 22;
                }
                then {
                    accept;
                }
            }
            term rule-20-b {
                from {
                    protocol tcp;
                    source-address 10.99.0.0/24;
                    destination-port 22;
                }
                then {
                    accept;
                }
            }
            term rule-30 {
                from {
                    protocol udp;
                    destination-port 51820;
                }
                then {
                    accept;
                }
            }
            term rule-40 {
                from {
                    protocol icmp;
                }
                then {
                    accept;
                }
            }
            term rule-50 {
                from {
                    input-interface br0;
                    protocol udp;
                    destination-port 67;
                }
                then {
                    accept;
                }
            }
            term default-action {
                then {
                    counter;
                    log {
                        prefix "[ipv4-input-default-D]";
                    }
                    drop;
                }
            }
        }
    }
    table v6-input {
        family ip6;
        chain input {
            type filter;
            hook input;
            priority 0;
            policy drop;
            term rule-10 {
                from {
                    connection-state established,related;
                }
                then {
                    accept;
                }
            }
            term rule-20 {
                from {
                    protocol icmpv6;
                }
                then {
                    accept;
                }
            }
            term default-action {
                then {
                    drop;
                }
            }
        }
    }
    table wan-mss {
        family ip;
        chain mss {
            type filter;
            hook postrouting;
            priority -300;
            policy accept;
            term pppoe0-mss {
                from {
                    output-interface pppoe0;
                    protocol tcp;
                }
                then {
                    tcp-mss-set 1400;
                }
            }
        }
    }
    table nat-source {
        family ip;
        chain postrouting {
            type nat;
            hook postrouting;
            priority 100;
            policy accept;
            term rule-100-a {
                from {
                    output-interface pppoe0;
                    source-address 192.168.50.0/24;
                }
                then {
                    masquerade;
                }
            }
            term rule-100-b {
                from {
                    output-interface pppoe0;
                    source-address 10.99.0.0/24;
                }
                then {
                    masquerade;
                }
            }
            term rule-110 {
                from {
                    output-interface pppoe0;
                    source-address 10.88.0.0/24;
                }
                then {
                    masquerade;
                }
            }
        }
    }
}

service {
    dhcp-server {
        enabled true;
        listen-interface br0;
        shared-network LAN {
            subnet 192.168.50.0/24 {
                range 0 {
                    start 192.168.50.100;
                    stop 192.168.50.199;
                }
                lease-time 86400;
                default-router 192.168.50.1;
                dns-server 192.0.2.53;
                static-mapping res-a {
                    mac-address 02:00:5e:50:00:30;
                    ip-address 192.168.50.30;
                }
            }
            subnet 10.99.0.0/24 {
                range 0 {
                    start 10.99.0.100;
                    stop 10.99.0.199;
                }
                lease-time 86400;
                default-router 10.99.0.1;
                static-mapping res-b {
                    mac-address 02:00:5e:50:00:40;
                    ip-address 10.99.0.40;
                }
            }
        }
    }
}

pki {
    ca LAB-CA {
        certificate "<<LAB:pki-LAB-CA-certificate>>";
    }
    certificate CPE {
        certificate "<<LAB:pki-CPE-certificate>>";
        private {
            key "<<SECRET:pki-CPE-key>>";
        }
    }
}

vpn {
    ipsec {
        interface pppoe0;
        unmatched bypass;
        esp-group ESP-MGMT {
            pfs disable;
            proposal 1 {
                encryption aes128gcm;
            }
        }
        ike-group IKE-MGMT {
            key-exchange ikev2;
            proposal 1 {
                dh-group 19;
                encryption aes128gcm;
                hash sha256;
            }
        }
        site-to-site {
            peer mgmt {
                ike-group IKE-MGMT;
                esp-group ESP-MGMT;
                connection-type initiate;
                remote-address vpn.example.net;
                vti {
                    bind vti0;
                }
                traffic-selector 1 {
                    local {
                        prefix 0.0.0.0/0;
                    }
                    remote {
                        prefix 0.0.0.0/0;
                    }
                }
                traffic-selector 2 {
                    local {
                        prefix ::/0;
                    }
                    remote {
                        prefix ::/0;
                    }
                }
                authentication {
                    mode x509;
                    ca-certificate LAB-CA;
                    certificate CPE;
                    local-id cpe.lab.example.net;
                    remote-id vpn.example.net;
                }
            }
        }
    }
}

system {
    host cpe;
    domain home.example.net;
    name-server 192.0.2.53;
    conntrack {
        module ftp;
    }
    authentication {
        user admin {
            plaintext-password "<<SECRET:user-admin-password>>";
        }
    }
}

environment {
    ssh {
        enabled true;
        server main {
            ip ::;
            port 22;
        }
    }
}
