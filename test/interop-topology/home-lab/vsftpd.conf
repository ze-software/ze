# vsftpd of the home-CPE lab's web and FTP server: anonymous downloads, active
# mode only (PORT, data from port 20), so the LAN host's transfer crosses the
# CPE's masquerade only with the FTP conntrack helper rewriting the PORT
# command and expecting the server's data connection.
listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=YES
anon_root=/srv/ftp
no_anon_password=YES
local_enable=NO
write_enable=NO
port_enable=YES
connect_from_port_20=YES
pasv_enable=NO
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log
