# Knot DNS of the home-CPE lab, authoritative for example.net on link core
# (192.0.2.53). The CPE resolves vpn.example.net through it, across its PPP
# session and the LNS.
server:
    listen: 0.0.0.0@53
    rundir: /run/knot

log:
  - target: stdout
    any: info

database:
    storage: /var/lib/knot

template:
  - id: default
    storage: /etc/knot
    zonefile-sync: -1
    zonefile-load: whole
    journal-content: none

zone:
  - domain: example.net.
    file: example.net.zone
