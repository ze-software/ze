# strongSwan as vpn.example.net, the ISP's management responder of the
# home-CPE lab. It answers the CPE (cpe.lab.example.net) with the PKI the run
# issued (home_lab_render.go), narrows the CPE's two traffic selectors
# (0.0.0.0/0 and ::/0) to ::/0, and takes ESP AES-GCM-128 with no PFS. MOBIKE
# is on and nothing translates the path (encap = no), so IKE moves to UDP 4500
# only because MOBIKE was negotiated (RFC 4555 Section 3.3). The CPE's
# certificate is P-256; the Ed25519 variant waits on spec-home-cpe-5.
connections {
    cpe {
        version = 2
        local_addrs = 198.51.100.30
        remote_addrs = %any
        mobike = yes
        encap = no
        reauth_time = 0s
        rekey_time = 0s
        proposals = aes128gcm16-prfsha256-ecp256
        local {
            auth = pubkey
            certs = vpn.pem
            id = vpn.example.net
        }
        remote {
            auth = pubkey
            id = cpe.lab.example.net
            cacerts = lab-ca.pem
        }
        children {
            mgmt {
                local_ts = ::/0
                remote_ts = ::/0
                esp_proposals = aes128gcm16
                mode = tunnel
                start_action = none
                close_action = none
                dpd_action = none
                rekey_time = 0s
                life_time = 1h
            }
        }
    }
}
