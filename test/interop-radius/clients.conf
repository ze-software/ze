# Ze RADIUS interop lab: the one NAS this server answers.
#
# The secret is a fixture value published in this repository. It never protects
# anything, and it must not resemble an operator secret.
#
# require_message_authenticator is off because RFC 2865 does not require the
# attribute in an Access-Request, and ze does not send one on the admin path.
# Turning it on would reject every ze request before the credential is read,
# which tells us nothing about PAP or CHAP.
client ze-lab {
	ipaddr = 172.27.0.0/24
	secret = ze-interop-fixture-secret
	nas_type = other
	require_message_authenticator = no
}
