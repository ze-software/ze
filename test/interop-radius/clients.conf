# Ze RADIUS interop lab: the one NAS this server answers.
#
# The secret is a fixture value published in this repository. It never protects
# anything, and it must not resemble an operator secret.
#
# require_message_authenticator is on: FreeRADIUS discards an Access-Request
# that carries no valid Message-Authenticator, which is the server side of the
# BlastRADIUS (CVE-2024-3596) defence. Ze signs every Access-Request,
# draft-ietf-radext-deprecating-radius-10 Section 4.2, so every PAP, CHAP and
# EAP scenario here also proves FreeRADIUS verifies the signature Ze computed.
client ze-lab {
	ipaddr = 172.27.0.0/24
	secret = ze-interop-fixture-secret
	nas_type = other
	require_message_authenticator = yes
}
