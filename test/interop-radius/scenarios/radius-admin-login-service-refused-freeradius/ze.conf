# Scenario radius-admin-login-service-refused-freeradius.
#
# OD-1 option (d): system/authentication/radius carries `login-service ssh-only`,
# restricting FreeRADIUS-authenticated operators to SSH while leaving NAS-Port-Id
# unchanged on the wire ("ssh" on SSH, "web" on Web).
#
# FreeRADIUS returns Access-Accept for radiusop on both doors. Ze admits radiusop
# on SSH with the Filter-Id profile `interop-operator`, and terminally refuses
# radiusop on Web (HTTP 401, logging `login refused by login-service gate` and
# incrementing `ze_aaa_login_service_refused_total{service="web"}`) without
# falling through to the unrestricted local account.
#
# localop is the unrestricted positive control on both SSH and Web.
system {
	authentication {
		user localop {
			password "$2a$04$UlwuiuH82Unfsq.XEMPGJeDkXwbm3KW.nvVaVXOd/JeFK8VjMjrQO"
			profile [ admin ];
		}
		user radiusop {
			password "$2a$04$UlwuiuH82Unfsq.XEMPGJeDkXwbm3KW.nvVaVXOd/JeFK8VjMjrQO"
			profile [ admin ];
		}
		radius {
			server 172.27.0.3 { port 1812; key "ze-interop-fixture-secret"; }
			timeout 2;
			retries 2;
			auth-method pap;
			login-service ssh-only;
		}
	}
	authorization {
		profile admin {
			run { default-action allow; }
			edit { default-action allow; }
		}
		profile interop-operator {
			run {
				entry 10 {
					action deny;
					match "show bgp";
				}
				default-action allow;
			}
			edit {
				default-action deny;
			}
		}
		login-service ssh-only {
			service [ ssh ];
		}
	}
}

environment {
	ssh {
		enabled true
		server main {
			ip 127.0.0.1;
			port 2222;
		}
	}
	web {
		enabled true
		server main {
			ip 127.0.0.1;
			port 8443;
		}
	}
}

telemetry {
	prometheus {
		enabled true;
		server main {
			ip 127.0.0.1;
			port 9273;
		}
		netdata {
			enabled false;
		}
	}
}
