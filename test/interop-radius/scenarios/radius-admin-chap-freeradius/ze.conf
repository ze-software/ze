# Scenario radius-admin-chap-freeradius.
#
# CHAP against a real FreeRADIUS server that stores the password in
# CLEARTEXT. RFC 2865 Section 2.2 requires that form for CHAP, and the
# server reproduces ze's digest from it.
#
# Every credential here is a published fixture. localop and radiusop share one
# bcrypt hash, which is the hash of "testpass" already published in
# internal/le/interoplab/ipsec/ipsec.go, so nothing in this file protects
# anything.
#
# localop is the positive control. The lab server holds no entry for it and
# answers nothing, which docs/guide/radius.md step 7 sends to the next backend,
# so a localop login reaching source=local proves the SSH listener and the local
# bcrypt backend are both live in this daemon. Without it, a refused radiusop
# login could mean "the chain stopped at the server's reject" or "SSH is
# broken", and the scenario could not tell those apart.
system {
	authentication {
		user localop {
			password "$2a$04$UlwuiuH82Unfsq.XEMPGJeDkXwbm3KW.nvVaVXOd/JeFK8VjMjrQO"
			profile [ admin ];
		}
		user radiusop {
			password "$2a$04$UlwuiuH82Unfsq.XEMPGJeDkXwbm3KW.nvVaVXOd/JeFK8VjMjrQO"
			profile [ admin ];
		}
		radius {
			server 172.27.0.3 { port 1812; key "ze-interop-fixture-secret"; }
			timeout 2;
			retries 2;
			auth-method chap;
		}
	}
	authorization {
		profile admin {
			run { default-action allow; }
			edit { default-action allow; }
		}
		# The profile the server names in Filter-Id. It denies one operational
		# command that admin allows, so "show bgp refused while show version
		# answers" is positive evidence that THIS profile was attached and the
		# built-in admin profile was not.
		profile interop-operator {
			run {
				entry 10 {
					action deny;
					match "show bgp";
				}
				default-action allow;
			}
			edit {
				default-action deny;
			}
		}
	}
}

environment {
	ssh {
		enabled true
		server main {
			ip 127.0.0.1;
			port 2222;
		}
	}
}
