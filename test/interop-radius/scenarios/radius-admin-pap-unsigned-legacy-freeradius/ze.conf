# Scenario radius-admin-pap-unsigned-legacy-freeradius.
#
# The per-server escape hatch of draft-ietf-radext-deprecating-radius-10
# Section 4.1 for a server that predates 2024 and cannot sign its answers. The
# relay on port 1912 (test/interop-radius/unsigned-relay.pl) runs in "strip"
# mode from the start, so every Access-Accept reaches ze without a
# Message-Authenticator. This server row sets require-message-authenticator
# false, so ze must accept that answer and complete the PAP login, and log no
# BlastRADIUS discard. radius-admin-pap-unsigned-freeradius is the same answer
# on a default row, refused.
#
# Every credential here is a published fixture, as in
# radius-admin-pap-freeradius.
system {
	authentication {
		user localop {
			password "$2a$04$UlwuiuH82Unfsq.XEMPGJeDkXwbm3KW.nvVaVXOd/JeFK8VjMjrQO"
			profile [ admin ];
		}
		user radiusop {
			password "$2a$04$UlwuiuH82Unfsq.XEMPGJeDkXwbm3KW.nvVaVXOd/JeFK8VjMjrQO"
			profile [ admin ];
		}
		radius {
			server 172.27.0.3 { port 1912; key "ze-interop-fixture-secret"; require-message-authenticator false; }
			timeout 2;
			retries 2;
			auth-method pap;
		}
	}
	authorization {
		profile admin {
			run { default-action allow; }
			edit { default-action allow; }
		}
		# The profile the server names in Filter-Id. It denies one operational
		# command that admin allows, so "show bgp refused while show version
		# answers" is positive evidence that THIS profile was attached and the
		# built-in admin profile was not.
		profile interop-operator {
			run {
				entry 10 {
					action deny;
					match "show bgp";
				}
				default-action allow;
			}
			edit {
				default-action deny;
			}
		}
	}
}

environment {
	ssh {
		enabled true
		server main {
			ip 127.0.0.1;
			port 2222;
		}
	}
}

telemetry {
	prometheus {
		enabled true;
		server main {
			ip 127.0.0.1;
			port 9273;
		}
		netdata {
			enabled false;
		}
	}
}
