# Scenario radius-admin-pap-unsigned-freeradius.
#
# draft-ietf-radext-deprecating-radius-10 Section 4.6: "Response packets
# which do not contain Message-Authenticator MUST be silently discarded."
#
# This is BlastRADIUS (CVE-2024-3596) on the PAP path. FreeRADIUS signs every
# Access-Accept, so ze talks to the lab's relay on port 1912 inside the
# server's container (test/interop-radius/unsigned-relay.pl). In "pass" mode
# the Access-Accept keeps its Message-Authenticator and the PAP login
# completes, which proves the relay path. In "strip" mode the relay removes the
# Message-Authenticator and recomputes the Response Authenticator, the answer
# an on-path forger produces. The server row leaves require-message-authenticator
# at its default, true, so ze must discard that Access-Accept, log the
# BlastRADIUS warning, step ze_radius_unsigned_response_discards_total, and
# refuse the login.
#
# Every credential here is a published fixture. localop and radiusop share one
# bcrypt hash, the hash of "testpass" already published in
# internal/le/interoplab/ipsec/ipsec.go. localop is the positive control for the
# SSH listener and the local backend, as in radius-admin-pap-freeradius.
system {
	authentication {
		user localop {
			password "$2a$04$UlwuiuH82Unfsq.XEMPGJeDkXwbm3KW.nvVaVXOd/JeFK8VjMjrQO"
			profile [ admin ];
		}
		user radiusop {
			password "$2a$04$UlwuiuH82Unfsq.XEMPGJeDkXwbm3KW.nvVaVXOd/JeFK8VjMjrQO"
			profile [ admin ];
		}
		radius {
			server 172.27.0.3 { port 1912; key "ze-interop-fixture-secret"; }
			timeout 2;
			retries 2;
			auth-method pap;
		}
	}
	authorization {
		profile admin {
			run { default-action allow; }
			edit { default-action allow; }
		}
		# The profile the server names in Filter-Id. It denies one operational
		# command that admin allows, so "show bgp refused while show version
		# answers" is positive evidence that THIS profile was attached and the
		# built-in admin profile was not.
		profile interop-operator {
			run {
				entry 10 {
					action deny;
					match "show bgp";
				}
				default-action allow;
			}
			edit {
				default-action deny;
			}
		}
	}
}

environment {
	ssh {
		enabled true
		server main {
			ip 127.0.0.1;
			port 2222;
		}
	}
}

telemetry {
	prometheus {
		enabled true;
		server main {
			ip 127.0.0.1;
			port 9273;
		}
		netdata {
			enabled false;
		}
	}
}
