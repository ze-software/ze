# Scenario radius-admin-eap-unsigned-freeradius.
#
# RFC 3579 Section 3.1: "Access-Challenge, Access-Accept, or Access-Reject
# packets including EAP-Message attribute(s) without a Message-Authenticator
# attribute SHOULD be silently discarded by the NAS."
#
# FreeRADIUS signs every such answer and cannot be told not to, so ze talks to
# the lab's relay on port 1912 inside the server's container
# (test/interop-radius/unsigned-relay.pl). The relay forwards each request to
# FreeRADIUS on 1812 and each answer back. In "pass" mode the answer keeps its
# Message-Authenticator and the EAP-MSCHAPv2 login completes, which proves the
# relay path and its Response Authenticator. In "strip" mode the relay removes
# the Message-Authenticator and nothing else, so ze must discard the
# Access-Challenge, count it on ze_radius_unsigned_eap_discards_total, and
# never complete the login.
#
# The Prometheus endpoint is on loopback only: the checker reads the counter
# from inside ze's container.
#
# Every credential here is a published fixture. localop and radiusop share one
# bcrypt hash, the hash of "testpass" already published in
# internal/le/interoplab/ipsec/ipsec.go. localop is the positive control for the
# SSH listener and the local backend, as in radius-admin-eap-freeradius.
system {
	authentication {
		user localop {
			password "$2a$04$UlwuiuH82Unfsq.XEMPGJeDkXwbm3KW.nvVaVXOd/JeFK8VjMjrQO"
			profile [ admin ];
		}
		user radiusop {
			password "$2a$04$UlwuiuH82Unfsq.XEMPGJeDkXwbm3KW.nvVaVXOd/JeFK8VjMjrQO"
			profile [ admin ];
		}
		radius {
			server 172.27.0.3 { port 1912; key "ze-interop-fixture-secret"; }
			timeout 2;
			retries 2;
			auth-method eap-mschapv2;
		}
	}
	authorization {
		profile admin {
			run { default-action allow; }
			edit { default-action allow; }
		}
		profile interop-operator {
			run {
				entry 10 {
					action deny;
					match "show bgp";
				}
				default-action allow;
			}
			edit {
				default-action deny;
			}
		}
	}
}

environment {
	ssh {
		enabled true
		server main {
			ip 127.0.0.1;
			port 2222;
		}
	}
}

telemetry {
	prometheus {
		enabled true;
		server main {
			ip 127.0.0.1;
			port 9273;
		}
		netdata {
			enabled false;
		}
	}
}
