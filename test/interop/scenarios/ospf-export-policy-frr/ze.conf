# Ze side of the ospf-export-policy-frr interop scenario
# (spec-route-policy-0-umbrella AC-13).
#
# Ze forms a point-to-point OSPFv2 adjacency with FRR over the shared Docker
# bridge (eth0) and redistributes three static routes into OSPF. The
# `ospf filter export` chain judges each one before Ze originates its
# AS-External-LSA:
#   10.67.1.0/24 (tag 100) -> metric 50, type-1 (E1), tag 200 from the modify
#   10.67.2.0/24           -> no filter sets it: metric 20, type-2 (E2), tag 0
#   10.67.3.0/24           -> rejected by `ospf-export-refused`, no LSA at all
#
# The router ID sits outside the lab subnet, so the runner's address rewrite
# leaves it alone and the checker can bind each LSA to Ze as its advertising
# router. The redistribute root needs no `bgp` block
# (docs/guide/redistribution.md).

static {
	table default {
		route 10.67.1.0/24 {
			tag 100
			next {
				hop 172.30.0.3 {
				}
			}
		}
		route 10.67.2.0/24 {
			next {
				hop 172.30.0.3 {
				}
			}
		}
		route 10.67.3.0/24 {
			next {
				hop 172.30.0.3 {
				}
			}
		}
	}
}

policy {
	prefix-list ospf-export-refused-list {
		entry 10.67.3.0/24 {
			action accept;
		}
	}
	match ospf-export-refused {
		action reject;
		prefix-list ospf-export-refused-list;
	}
	modify ospf-export-tagged {
		match {
			protocol [ static ];
			tag [ 100 ];
		}
		set {
			metric 50;
			metric-type type-1;
			tag 200;
		}
	}
}

ospf {
	router-id 10.255.0.2
	filter {
		export {
			filters [ ospf-export-refused ospf-export-tagged ];
			final accept;
		}
	}
	redistribute {
		static {
		}
	}
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
	}
}

redistribute {
	destination ospf {
		import static
	}
}
