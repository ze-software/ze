frr defaults traditional
hostname frr-ospf-export
log file /tmp/frr.log informational
!
! OSPFv2 point-to-point on the shared Docker bridge to Ze (eth0). Same area
! 0.0.0.0, so the adjacency forms and FRR receives the AS-External-LSAs Ze
! originates for the static routes its export chain accepted. FRR reports each
! LSA's metric, metric type and External Route Tag in
! `show ip ospf database external json`, which is what the checker reads.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
!
