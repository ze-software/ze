# Ze as a route server (RFC 7947) relaying l2vpn/evpn between a raw injector and an
# independent speaker. That relay is the path RFC 7606 Section 5.4 governs: the received
# wire is fanned to every eligible client by reactorForwardRS, and buildFwdBody appends the
# payload verbatim on the same-context path, so a route type ze does not implement leaves
# the daemon unchanged unless it is discarded at ingress.
plugin {
	internal rib {
		use bgp-rib;
	}
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# The raw injector. Ze dials it (accept false) exactly as the plugin .ci suite does,
	# because ze-test peer listens rather than connects in check mode. The injector mirrors
	# ze's OPEN, so declaring l2vpn/evpn here is what makes the family negotiated on both
	# sides and the EVPN UPDATE acceptable rather than an RFC 4760 Section 7 teardown.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			# RFC 7947 Section 2.2.2.1: a route server MUST NOT prepend its own AS.
			# rs-client defaults to false and is the only thing selecting that path.
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				l2vpn/evpn   { prefix { maximum 10000; } }
			}
		}
		# Without this block the route server receives no peer-scoped event and
		# relays nothing: PeerScopedProcs (plugin/server/delivery_graph.go) reads
		# the attach bindings, and filterPermittedPeers
		# (reactor/send_permission.go) drops a destination whose bindings grant no
		# `send update`. The tokens match SetStartupSubscriptions in
		# RunRouteServer (plugins/rs/server.go).
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
	}
	# The independent speaker DIALS ze and does not listen, so ze is passive (connect false).
	# Its OPEN carries l2vpn/evpn because speaker-args names --family 25:70; without that the
	# family is not negotiated and ze would never send it an EVPN UPDATE at all, which would
	# make the check pass on an empty session.
	peer speaker {
		connection {
			remote { ip 172.30.0.10; connect false; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				l2vpn/evpn   { prefix { maximum 10000; } }
			}
		}
		# Without this block the route server receives no peer-scoped event and
		# relays nothing: PeerScopedProcs (plugin/server/delivery_graph.go) reads
		# the attach bindings, and filterPermittedPeers
		# (reactor/send_permission.go) drops a destination whose bindings grant no
		# `send update`. The tokens match SetStartupSubscriptions in
		# RunRouteServer (plugins/rs/server.go).
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
	}
}
