# Ze config the bgp-reload-global-router-id checker swaps in before SIGHUP.
#
# Ze starts with the global router-id 10.255.0.1. The checker then replaces the
# running config with ze-reload.conf, which changes only the global router-id to
# 10.255.0.2, and sends SIGHUP. The peer below sets no router-id of its own, so
# it inherits the global value.
#
# BIRD (172.30.0.4) is a static peer. It is up before the reload and must see the
# new BGP Identifier after Ze restarts the session.
#
# FRR (172.30.0.3) is not in this file. After the reload the checker adds it at
# run time with `create bgp peer`, which builds the peer in AddDynamicPeer from
# the reactor's global router-id and local AS. Its OPEN must carry the new
# router-id: before b40379c07c the reactor kept its startup copy, and FRR saw
# 10.255.0.1.

bgp {
	router-id 10.255.0.2
	session {
		asn { local 65001; }
	}

	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; accept true; }
		}
		session {
			asn { local 65001; remote 65002; }
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
