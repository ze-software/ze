frr defaults traditional
hostname extended-message-frr-sink
log file /tmp/frr.log informational
!
! Native consumer with a distinct router ID; no locally originated test routes.
router bgp 65002
 bgp router-id 172.30.0.15
 no bgp ebgp-requires-policy
 neighbor 172.30.0.11 remote-as 65001
 neighbor 172.30.0.11 passive
 neighbor 172.30.0.11 timers 3 9
 address-family ipv4 unicast
  neighbor 172.30.0.11 activate
  neighbor 172.30.0.11 prefix-list SINK out
  neighbor 172.30.0.11 allowas-in 1
 exit-address-family
!
ip prefix-list SINK seq 10 deny 0.0.0.0/0 le 32
!
