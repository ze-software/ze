# Ze side of the ospfv3-sr-frr interop scenario (spec-ospf-ext-5, RFC 8666).
#
# Ze runs the OSPFv3 (IPv6) family with the RFC 7770 OSPFv3 Router Information LSA (carrying the
# SR-Algorithm 0 + SRGB capabilities) and Segment Routing: a Prefix-SID for its loopback in an
# RFC 8362 E-Intra-Area-Prefix-LSA (0x2029) and an Adj-SID from the SRLB in an E-Router-LSA
# (0x2021). On a Full OSPFv3 adjacency with FRR ospf6d (SR-MPLS enabled) over the shared bridge
# (eth0, area 0.0.0.0, ff02::5), Ze and FRR exchange the RFC 8666 SR TLVs, compute matching
# index->label mappings, and install matching MPLS forwarding through the shared mpls-fib.
ospf {
	router-id 172.30.0.2
	address-family ipv6 {
		router-information {
			enabled true
			scope area
		}
		segment-routing {
			enable true
			srgb {
				lower-bound 16000
				upper-bound 23999
			}
			srlb {
				lower-bound 15000
				upper-bound 15999
			}
			prefix-sid 2001:db8:cafe::2/128 {
				index 200
				no-php true
			}
		}
		areas {
			area 0.0.0.0 {
				area-type normal
			}
		}
		interfaces {
			interface eth0 {
				area 0.0.0.0
				network-type point-to-point
				cost 10
			}
		}
	}
}
