frr defaults traditional
hostname frr-ospfv3-sr
log file /tmp/frr.log informational
!
! OSPFv3 (RFC 5340) point-to-point on the shared L2 bridge to Ze (eth0), area 0.0.0.0. FRR
! ospf6d enables Segment Routing (RFC 8666): it advertises SR-Algorithm 0 + an SRGB in the
! OSPFv3 RI Opaque LSA and a Prefix-SID (index 100) for loopback 2001:db8:cafe::3/128 in an
! RFC 8362 E-Intra-Area-Prefix-LSA. Ze must form a Full adjacency, install FRR's Prefix-SID as
! an MPLS push toward FRR (label = FRR SRGB base 16000 + index 100 = 16100), and FRR must
! install Ze's Prefix-SID (index 200). Requires an FRR ospf6d build with SR-MPLS support.
interface eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
!
interface lo
 ipv6 ospf6 area 0.0.0.0
!
router ospf6
 ospf6 router-id 172.30.0.3
 segment-routing on
 segment-routing global-block 16000 23999 local-block 15000 15999
 segment-routing prefix 2001:db8:cafe::3/128 index 100
!
