# Import and export policy, judged against FRR and BIRD.
#
# FRR (172.30.0.3, AS65039) redistributes two statics on one session:
#
#   10.39.1.0/24   the prefix the export prefix-list accepts
#   10.39.2.0/24   the prefix the export prefix-list rejects
#
# Ze runs `modify:IMPORT-PREF` on the frr-source IMPORT chain, which writes
# LOCAL_PREF 250, and `bgp-filter-prefix:EXPORT-ONLY` then `modify:EXPORT-ATTRS`
# on the bird-dest EXPORT chain, which accepts one prefix, rejects the other by
# the implicit deny, and writes MED 77 and community 65000:39.
#
# BIRD (172.30.0.4) is the downstream observer. It reads what ze re-advertised,
# so both halves of the claim are made by a foreign daemon: the accepted prefix
# carries the two attributes, and the rejected one is not in its table.
plugin {
	internal bgp-rib {
		use bgp-rib;
	}
	internal bgp-rs {
		use bgp-rs;
	}
	internal bgp-filter-prefix {
		use bgp-filter-prefix;
	}
	internal bgp-filter-modify {
		use bgp-filter-modify;
	}
}
bgp {
	policy {
		prefix-list EXPORT-ONLY {
			entry 10.39.1.0/24 {
				action accept;
			}
		}
		modify IMPORT-PREF {
			set {
				local-preference 250;
			}
		}
		modify EXPORT-ATTRS {
			set {
				med 77;
				community-add [ 65000:39 ];
			}
		}
	}
	peer frr-source {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65000; remote 65039; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		filter {
			import [ modify:IMPORT-PREF ];
		}
		# An ACTIVE export chain takes bird-dest OFF the reactor fast path
		# (RSFastPath, reactor/peer_settings.go; hasActiveFilter, reactor/forward_rs.go),
		# so the relay to it runs through bgp-rs ForwardCached, which is the rail
		# that applies the chain. bgp-rs is fed by these attach blocks and by
		# nothing else: a peer that attaches nothing feeds nothing
		# (docs/guide/configuration.md, Process Bindings). Without this block the
		# plugin sees no UPDATE from this peer and BIRD receives neither prefix.
		attach process bgp-rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		behavior { rs-fast-path enable; }
	}
	peer bird-dest {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65000; remote 65000; }
			router-id 172.30.0.2;
			next-hop self;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		filter {
			export [ bgp-filter-prefix:EXPORT-ONLY modify:EXPORT-ATTRS ];
		}
		# See frr-source. `send [ update ]` is what permits bgp-rs to write to
		# this peer (filterPermittedPeers, reactor/send_permission.go), and
		# `state` with `open-received` are what fill peer.Up and peer.Families in
		# the plugin's target selection (plugins/rs/server_forward.go).
		attach process bgp-rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		behavior { rs-fast-path enable; }
	}
}
