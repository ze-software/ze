# BIRD is the independent judge of RFC 4456 Section 9. It holds the same two
# paths ze holds, from the same two speakers, and bgp_rte_better (proto/bgp/
# attrs.c) compares CLUSTER_LIST lengths between the BGP identifier step and the
# peer address step, with no configuration gate. The route BIRD marks primary is
# the answer ze has to agree with.
#
# The two protocol names are the assertion surface: BIRD prints the protocol that
# produced a route inside the brackets of its route line, and marks the primary
# route with an asterisk.
log stderr all;
router id 172.30.0.4;

protocol device {
}

# The connected route for the lab network, so BIRD can resolve the next hop both
# candidate paths carry. Without it BIRD holds them as unreachable, which the
# first step of bgp_rte_better reads, and this scenario needs every step above
# the CLUSTER_LIST comparison to be a tie rather than a shared failure.
protocol direct {
	ipv4;
	interface "eth*";
}

# The direct path from the origin. It carries no CLUSTER_LIST, which RFC 4456
# Section 9 reads as length zero.
protocol bgp origin_direct {
	local 172.30.0.4 as 65000;
	neighbor 172.30.0.5 as 65000;
	ipv4 {
		import all;
		export none;
	};
}

# The reflected path. FRR prepends its own CLUSTER_ID, so this one carries a
# CLUSTER_LIST of one entry and must lose.
protocol bgp reflected_path {
	local 172.30.0.4 as 65000;
	neighbor 172.30.0.3 as 65000;
	ipv4 {
		import all;
		export none;
	};
}
