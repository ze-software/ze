frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! The route reflector of the lab. Ze and BIRD are its clients, GoBGP is not, so
! RFC 4456 Section 6 makes FRR reflect GoBGP's route to ze and to BIRD. That
! reflection is what stamps ORIGINATOR_ID and prepends the CLUSTER_ID, which is
! the input this scenario needs.
!
! The cluster id is pinned rather than defaulted so the CLUSTER_LIST the checker
! reads out of BIRD is a value this file states.
router bgp 65000
 bgp router-id 172.30.0.3
 bgp cluster-id 172.30.0.3
 neighbor 172.30.0.2 remote-as 65000
 neighbor 172.30.0.2 update-source 172.30.0.3
 neighbor 172.30.0.4 remote-as 65000
 neighbor 172.30.0.4 update-source 172.30.0.3
 neighbor 172.30.0.5 remote-as 65000
 neighbor 172.30.0.5 update-source 172.30.0.3
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  neighbor 172.30.0.2 route-reflector-client
  neighbor 172.30.0.4 activate
  neighbor 172.30.0.4 route-reflector-client
  neighbor 172.30.0.5 activate
 exit-address-family
!
