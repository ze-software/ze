# RFC 4456 Section 9, the CLUSTER_LIST length tie-break, judged against BIRD.
#
# GoBGP (172.30.0.5, BGP Identifier 172.30.0.5) originates 10.66.0.0/24 into
# AS 65000 and holds an internal session with ze, with FRR and with BIRD. FRR
# (172.30.0.3) is a route reflector whose clients are ze and BIRD, so it
# reflects GoBGP's route to both, stamping ORIGINATOR_ID 172.30.0.5 and a
# CLUSTER_LIST of one entry.
#
# Ze and BIRD therefore each hold two paths for one prefix that are identical
# through every earlier step of RFC 4271 Section 9.1.2.2:
#
#   LOCAL_PREF   100 on both (GoBGP sets it, FRR reflects it unchanged)
#   AS_PATH      empty on both, so the length ties and step d) never fires,
#                because a MED comparison needs a first AS on each side
#   ORIGIN       one value, set by GoBGP and reflected unchanged
#   eBGP/iBGP    both sessions are internal
#   NEXT_HOP     172.30.0.5 on both, so the IGP cost to the next hop ties
#   step f)      172.30.0.5 on both: the direct path has no ORIGINATOR_ID and
#                falls back to GoBGP's BGP Identifier, and the reflected path
#                carries that same identifier in ORIGINATOR_ID
#
# Only the CLUSTER_LIST differs: zero entries on the direct path, one on the
# reflected path. RFC 4456 Section 9 puts the shorter list ahead, so both
# speakers must choose the path from 172.30.0.5. Step g), the peer address,
# would choose the OTHER path, because 172.30.0.3 is the lower address. That is
# what makes the scenario discriminate: a speaker that skips the CLUSTER_LIST
# step falls through to the peer address and picks FRR's copy.
#
# bgp-rib is the plugin that runs the decision process; without it ze holds no
# Loc-RIB and `show bgp rib best` has nothing to answer.
plugin {
	internal rib {
		use bgp-rib;
	}
}
bgp {
	peer reflector {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65000; remote 65000; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rib {
			receive [ update state refresh ];
		}
	}
	peer origin {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65000; remote 65000; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rib {
			receive [ update state refresh ];
		}
	}
}
