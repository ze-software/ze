# Ze side of the ospfv3-ri-frr interop scenario (spec-ospf-ext-3, RFC 7770 sec 2.2).
#
# Ze runs the OSPFv3 (IPv6) address family and enables `router-information` (inherited by
# the v6 family from the top-level container). On a point-to-point OSPFv3 adjacency with
# FRR ospf6d over the shared Docker bridge (eth0, area 0.0.0.0), Ze originates a native
# function-code-12 RI LSA with the U-bit set (area 0xA00C + AS 0xC00C scope), and stores +
# renders FRR's RI LSA. The U-bit ensures a non-supporting router still floods it; the
# adjacency must stay Full.

ospf {
	router-id 172.30.0.2
	router-information {
		enabled true
		scope area
		scope as
	}
	address-family ipv6 {
		areas {
			area 0.0.0.0 {
				area-type normal
			}
		}
		interfaces {
			interface eth0 {
				area 0.0.0.0
				network-type point-to-point
				cost 10
			}
		}
	}
}
