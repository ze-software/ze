frr defaults traditional
hostname frr-ospf6-ri
log file /tmp/frr.log informational
!
! OSPFv3 (RFC 5340) point-to-point on the shared L2 bridge to Ze (eth0), area 0.0.0.0.
! FRR ospf6d forms the adjacency over IPv6 link-local and originates its Router
! Information LSA (function code 12, RFC 7770) at AS scope via `router-info as`. Ze must
! keep the adjacency Full, decode FRR's RI LSA, and flood its own U-bit-set RI LSA so FRR
! (which understands it) files it as Router Information.
interface eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
!
router ospf6
 ospf6 router-id 172.30.0.3
 router-info as
!
