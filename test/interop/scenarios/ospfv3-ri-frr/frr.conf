frr defaults traditional
hostname frr-ospf6-ri
log file /tmp/frr.log informational
!
! OSPFv3 (RFC 5340) point-to-point on the shared L2 bridge to Ze (eth0), area 0.0.0.0.
! FRR ospf6d forms the adjacency over IPv6 link-local. ospf6d implements no Router
! Information LSA (RFC 7770 lives only in ospfd), so FRR originates none and stores
! Ze's RI LSAs as unknown types: their U-bit is set, so it keeps and floods them.
! Ze must keep the adjacency Full while FRR holds both of Ze's RI LSAs.
interface eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
!
router ospf6
 ospf6 router-id 172.30.0.3
!
