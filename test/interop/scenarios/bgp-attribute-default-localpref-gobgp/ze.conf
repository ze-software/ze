# A CONFIGURED ABSENT-ATTRIBUTE BASE FEEDS THE MODIFIER ARITHMETIC, judged by a
# foreign RIB rather than by a hand-written filter subject.
#
# RFC 4271 Section 9.1.1 supplies no number for the degree of preference: "The
# exact nature of this policy information, and the computation involved, is a
# local matter." Ze declares 100 in ze-bgp-conf.yang and lets an operator move
# it, which is the knob FRR (BGP_DEFAULT_LOCAL_PREF) and BIRD
# (default_local_pref) both carry. This lab is what proves the operator's number
# reaches the arithmetic.
#
# THE TWO OUTCOMES ARE TWENTY APART ON PURPOSE. The injector announces a route
# with no LOCAL_PREF, and the import chain adds 50 to whatever base applies. 130
# is the configured base of 80. 150 is the schema's declared 100, which is what
# a build whose config plumbing never reaches the plugin computes. No third
# value can be mistaken for either.
#
# THE DESTINATION IS INTERNAL, AND THAT IS WHAT MAKES THE PREFERENCE READABLE.
# RFC 4271 Section 5.1.5 forbids LOCAL_PREF toward an external peer, and ze
# enforces it on both forward rails (applyFactsLocalPref,
# reactor/forward_local_pref.go returns early for an internal destination
# alone). On this iBGP session attribute 5 survives the relay, so whatever the
# import chain computed is what GoBGP decodes.
#
# THE IN-RUN CONTROL IS THE SECOND PREFIX. The policy carries a match container,
# so only the route tagged 65005:1 is modified. The untagged one travels the
# same session, the same route-server rail and the same policy chain, and ze
# adds no LOCAL_PREF of its own on egress: nothing in the forward rails inserts
# attribute 5, they only strip it. GoBGP therefore reads no LocalPref on that
# route, which is what tells a computed 130 from a daemon that writes a
# preference onto everything it relays.
#
# THE INJECTOR'S WAIT IS WHAT SELECTS THE RAIL UNDER TEST. The forward rail
# skips a destination that is not established yet (forwardUpdateCore,
# reactor/reactor_api_forward.go), so a prefix announced before GoBGP is up
# either never arrives or arrives by some other path. inject.msg waits for four
# of ze's KEEPALIVEs first.
plugin {
	internal rib {
		use bgp-rib;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
	internal rs {
		use bgp-rs;
	}
	internal bgp-filter-modify {
		use bgp-filter-modify;
	}
}
bgp {
	# The mechanism under test. Without this block the base is the schema's
	# declared 100 and the same chain computes 150.
	defaults {
		attribute {
			local-preference 80;
		}
	}
	policy {
		# `increment` adds the stated value to the value the route carries, and
		# to the configured base when the route carries none. The import chain
		# is where a preference is set, because the Decision Process reads it
		# after the chain has run.
		modify INC-LP {
			increment {
				local-preference 50;
			}
			match {
				community [ 65005:1 ];
			}
		}
	}
	# The source, EXTERNAL to ze (65005 -> 65001), so the routes it announces
	# carry no LOCAL_PREF and none could be relayed if they did. Ze dials it
	# (accept false) because `ze-test peer` listens in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65005; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# Ze sends a KEEPALIVE every hold/3, so a 15 s hold gives the injector a
		# 5 s clock to count GoBGP's start-up against. The default 90 s hold
		# makes the same wait take eighteen times longer.
		timer { receive-hold-time 15; }
		filter {
			import [ modify:INC-LP ];
		}
		# The relay itself. bgp-rs is the ONLY plugin that forwards a received
		# UPDATE to other peers: `flushBatch` (plugins/rs/server_forward.go) is
		# what reaches forwardUpdateCore. Without the block the route server
		# takes delivery of no peer-scoped event (PeerScopedProcs,
		# plugin/server/delivery_graph.go) and `send update` is not granted
		# (filterPermittedPeers, reactor/send_permission.go), so nothing leaves.
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
	}
	# The destination, INTERNAL to ze (65001 -> 65001). GoBGP keeps the RECEIVED
	# attribute list on the path and prints it verbatim, so it reports what
	# arrived rather than what it decided to keep.
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
	}
}
