frr defaults traditional
hostname frr-ospf6-marea
log file /tmp/frr.log informational
!
! OSPFv3 (RFC 5340) backbone router. eth0 is in area 0.0.0.0 facing the ABR (Ze); FRR
! must learn the area-1 prefix Ze summarises into the backbone as an Inter-Area-Prefix-LSA
! and install it as an OSPFv3 inter-area route.
interface eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
!
router ospf6
 ospf6 router-id 172.30.0.3
!
