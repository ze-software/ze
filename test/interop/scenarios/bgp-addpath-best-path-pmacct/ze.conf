# Ze's best-path election over two paths of one prefix that arrive on ONE ADD-PATH
# session, read back by a collector that is not Ze. The injector (inject.msg)
# announces 10.0.0.0/24 under path id 2 (MED 10) and then path id 1 (MED 50).
# The paths name two routes to one prefix; they never partition the election
# (RFC 7911 Section 2: "a particular path for an address prefix can be identified
# by the combination of the address prefix and the Path Identifier"). So Ze's
# Loc-RIB holds ONE best for the prefix, MED 10, and pmacct reads it from the RFC
# 9069 Loc-RIB stream.
#
# Ze advertises no best path to a BGP peer (bgp-rs relays without choosing,
# docs/guide/route-reflection.md), so the Loc-RIB monitoring stream is where a
# foreign implementation can observe Ze's election at all.
plugin {
	internal bgp-rib {
		use bgp-rib;
	}
	internal bgp-bmp {
		use bgp-bmp;
	}
}
bgp {
	router-id 172.30.0.2;
	# RFC 9069 Section 5.1: the Loc-RIB peer describes itself with the router's
	# ASN and BGP ID, so Ze sends no Loc-RIB Peer Up until both are configured.
	session {
		asn {
			local 65001;
		}
	}
	bmp {
		sender {
			collector pmacct {
				address 172.30.0.13;
				port 1790;
			}
			route-monitoring-policy all;
			loc-rib true;
		}
	}
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
				add-path {
					direction send/receive;
				}
			}
		}
		# The RIB elects from what this peer sends, and BMP reports both the
		# received paths and the Loc-RIB best: each needs the peer's events.
		attach process bgp-rib {
			receive [ update state refresh ];
		}
		attach process bgp-bmp {
			receive [ state update open notification keepalive refresh ];
		}
	}
}
