frr defaults traditional
hostname frr-med-cycle
log file /tmp/frr.log informational
!
ip route 10.99.77.0/24 Null0
!
! A shares C's neighboring AS but has lower MED and a worse Router ID.
route-map MED_CYCLE permit 10
 set origin igp
 set metric 0
!
router bgp 65004
 bgp router-id 198.51.100.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 update-source 172.30.0.3
 neighbor 172.30.0.2 graceful-restart-disable
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  network 10.99.77.0/24 route-map MED_CYCLE
 exit-address-family
!
