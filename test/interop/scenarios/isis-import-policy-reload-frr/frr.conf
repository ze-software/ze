frr defaults traditional
hostname frr-isis-reload
log file /tmp/frr.log informational
!
! The origin of both prefixes, advertised into IS-IS as passive reachability
! from the loopback. Ze's `isis filter import` in ze.conf rejects 10.77.1.0/24
! and accepts 10.77.2.0/24, the control the first is read against.
! ze-reload.conf drops the chain, and the reload back to ze.conf restores it.
! FRR's configuration never changes, so its LSP carries both prefixes from the
! first flood to the end of the run.
interface lo
 ip address 10.77.1.1/24
 ip address 10.77.2.1/24
 ip router isis ZE
 isis passive
!
! IS-IS point-to-point on the shared lab bridge to Ze (eth0).
interface eth0
 ip router isis ZE
 isis circuit-type level-1-2
 isis network point-to-point
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
!
