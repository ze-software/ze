# Ze side of the isis-import-policy-reload-frr interop scenario, the relaxed
# config. It is ze.conf with the `isis filter import` chain removed and every
# other line kept, so the chain is the only thing the reload changes. The
# policy instances stay defined and unused.

bus {
	endpoint sysrib-policy-owner {
		internal rib;
	}
}

policy {
	prefix-list ISIS-HIDE-LIST {
		entry 10.77.1.0/24 { action accept; }
	}
	match ISIS-HIDE {
		action reject;
		prefix-list ISIS-HIDE-LIST;
	}
}

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1-l2
	interfaces {
		interface eth0 {
			metric 10
			level l1-l2
			circuit-type point-to-point
		}
	}
}
