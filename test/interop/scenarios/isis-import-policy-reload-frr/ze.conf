# Ze side of the isis-import-policy-reload-frr interop scenario, its start
# config. The import chain rejects 10.77.1.0/24 as IS-IS installs it into the
# Loc-RIB, so the path is kept hidden while 10.77.2.0/24 is installed.
# ze-reload.conf is this file without the chain; the checker reloads into it
# (the chain relaxed) and then back into this file (the chain tightened).

plugin {
	internal sysrib-policy-owner {
		use rib;
	}
}

policy {
	prefix-list ISIS-HIDE-LIST {
		entry 10.77.1.0/24 { action accept; }
	}
	match ISIS-HIDE {
		action reject;
		prefix-list ISIS-HIDE-LIST;
	}
}

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1-l2
	filter {
		import {
			filters [ ISIS-HIDE ];
			final accept;
		}
	}
	interfaces {
		interface eth0 {
			metric 10
			level l1-l2
			circuit-type point-to-point
		}
	}
}
