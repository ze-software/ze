# Ze side of the ospf-gr-helper-broadcast-frr interop scenario
# (spec-rfc-verdict-fix-ospf, commit 50044040c5).
#
# RFC 3623 Section 3.1: "On broadcast, NBMA and Point-to-MultiPoint segments,
# the neighbor relationship with X is identified by the IP interface address in
# the body of the grace-LSA (see Appendix A)."
#
# Ze is the helper. eth0 runs network-type broadcast, so graceOnReceive asks
# graceRestarterV4 for X, which matches the Grace-LSA's IP interface address TLV
# against the address of each neighbor on eth0 and answers that neighbor's
# Router ID. FRR's router-id (10.255.0.3) differs from its eth0 address, so the
# match has to go through the neighbor table. Ze then enters helper mode for
# FRR, keeps the adjacency Full through FRR's restart, and ends the session when
# FRR flushes its Grace-LSA: graceRestarterV4 matches the flushed LSA's body the
# same way, and helperExit counts the exit as reason "flushed" in
# ze_ospf_gr_helper_exits_total. That counter is the checker's proof that a
# helper session existed and that the flush found it.
#
# strict-lsa-checking is off so an LSA change during FRR's restart cannot end
# the session early with another reason: the exit the checker reads can only be
# the flush.
#
# What this scenario does NOT prove: FRR is an honest restarter, so its Grace-LSA
# Advertising Router is the same Router ID its Hellos carry. Identifying X by
# the Advertising Router (the code before 50044040c5) finds the same neighbor
# and passes too. This scenario proves Ze's broadcast helper path, the one the
# fix introduced, works against FRR's real Grace-LSA. The discrimination of the
# fix itself lives in rfc3623_grace_helper_identity_test.go, which feeds Grace-LSAs
# whose Advertising Router and IP interface address name different neighbors
# (docs/architecture/testing/interop.md, "Prove a scenario discriminates").

ospf {
	router-id 172.30.0.2
	opaque true
	graceful-restart {
		restarter {
			support planned
			restart-interval 120
		}
		helper {
			support true
			strict-lsa-checking false
		}
	}
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type broadcast
			priority 100
			cost 10
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}

# The helper-exit assertions read the daemon's real Prometheus counters.
telemetry {
	prometheus {
		enabled true
		netdata {
			enabled false
		}
	}
}
