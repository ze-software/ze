frr defaults traditional
hostname frr-ospf-gr-bcast
log file /tmp/frr.log informational
!
! OSPFv2 broadcast LAN to Ze (eth0). FRR is the planned restarter here: the
! checker runs `clear ip ospf process graceful-restart`, so FRR originates a
! Grace-LSA, restarts with Ze as its helper, and flushes the Grace-LSA once its
! adjacencies are back. On a broadcast segment FRR's Grace-LSA carries the IP
! interface address TLV (RFC 3623 Appendix A), here eth0's address.
!
! The router-id is deliberately NOT eth0's address, so the address the TLV
! carries and the Router ID Ze's neighbor table holds are two different values:
! Ze can only find its helped neighbor by matching the TLV against neighbor
! addresses and then reading that neighbor's Router ID.
!
! Priority 1 against Ze's 100 makes Ze the DR, so FRR's restart never changes
! the segment's DR.
interface eth0
 ip ospf network broadcast
 ip ospf area 0.0.0.0
 ip ospf priority 1
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 10.255.0.3
 capability opaque
 graceful-restart grace-period 120
 graceful-restart helper enable
 passive-interface lo
!
