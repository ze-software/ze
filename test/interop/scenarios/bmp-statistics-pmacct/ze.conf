plugin {
	internal bgp-rib {
		use bgp-rib;
	}
	internal bgp-bmp {
		use bgp-bmp;
	}
}
bgp {
	router-id 172.30.0.2;
	session {
		asn {
			local 65044;
		}
	}
	bmp {
		sender {
			collector pmacct {
				address 172.30.0.13;
				port 1790;
			}
			route-monitoring-policy all;
			# RFC 7854 Section 4.8: "It is left to the implementation to
			# determine transmission timings -- however, configuration control
			# should be provided of the timer and/or threshold values." One
			# second is that control set as low as the leaf allows, so the run
			# reads several reports rather than waiting on one.
			statistics-timeout 1;
		}
	}
	peer frr-statistics {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65044; remote 65045; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		# The Statistics Report describes an established BGP peer, and ze learns
		# a peer is established from a peer-scoped event. Without this block the
		# plugin is told about no peer, holds no Peer Up state, and has nothing
		# to report on.
		attach process bgp-bmp {
			receive [ state update open notification keepalive refresh ]
		}
	}
}
