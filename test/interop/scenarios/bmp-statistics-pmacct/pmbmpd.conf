!
! pmacct BMP collector, reading the periodic Statistics Report ze sends at the
! interval `statistics-timeout` configures.
!
! The msglog is the assertion surface: pmacct writes one JSON object per BMP
! message it DECODED, so the stat type and its counter are another
! implementation's reading of ze's bytes rather than a string ze emitted.
!
! debug prints the type of each message as well, so a failure shows what pmacct
! parsed rather than only what the msglog kept.
!
bmp_daemon_ip: 0.0.0.0
bmp_daemon_port: 1790
bmp_daemon_msglog_output: json
bmp_daemon_msglog_file: /var/log/pmacct/bmp.log
debug: true
