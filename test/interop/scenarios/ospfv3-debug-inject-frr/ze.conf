# Ze side of the ospfv3-debug-inject-frr interop scenario (spec-ospf-ext-14, RFC 5340).
#
# Ze runs the OSPFv3 (IPv6) address family and forms a P2P OSPFv3 adjacency with FRR
# ospf6d. Debug injection is off by default and enabled at runtime by the check; the
# injected area-scope Intra-Area-Prefix (0x2009) LSA floods to FRR by normal machinery.
ospf {
	router-id 172.30.0.2
	address-family ipv6 {
		areas { area 0.0.0.0 { area-type normal } }
		interfaces {
			interface eth0 { area 0.0.0.0 network-type point-to-point cost 10 }
		}
	}
}
