# Four independent prefixes prove ordinary route ownership and watchdog values.
# The checker injects 10.77.4.0/24 only after credited watchdog completion and
# quiesce; that sentinel MUST NOT be configured here or in a watchdog pool.
environment {
    log { bgp.routes debug; }
}
plugin {
    internal bgp-watchdog { use bgp-watchdog; }
    internal gr { use bgp-gr; }
}
bgp {
    filter {
        import { final accept; }
        export { final accept; }
    }
    peer peer1 {
        connection {
            remote { ip 172.30.0.3; }
            local { ip 172.30.0.2; }
        }
        session {
            asn { local 65001; remote 65002; }
            router-id 172.30.0.2
            family { ipv4/unicast { prefix { maximum 10000; } } }
            # FRR exposes its received-EOR flag only with this capability.
            capability { graceful-restart { restart-time 120; } }
        }
        update {
            attribute { origin igp; next-hop self; }
            nlri { ipv4/unicast add 10.77.0.0/24; }
        }
        update {
            attribute { origin igp; next-hop self; }
            nlri { ipv4/unicast add 10.77.1.0/24; }
            watchdog { name omitted; }
        }
        update {
            attribute { origin igp; next-hop self; }
            nlri { ipv4/unicast add 10.77.2.0/24; }
            watchdog { name explicit-false; withdraw false; }
        }
        update {
            attribute { origin igp; next-hop self; }
            nlri { ipv4/unicast add 10.77.3.0/24; }
            watchdog { name held; withdraw true; }
        }
        attach process bgp-watchdog {
            receive [ state ]
            send [ update ]
        }
        attach process gr { receive [ open state eor ]; send update; }
    }
}
