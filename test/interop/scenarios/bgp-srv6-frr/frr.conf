frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
segment-routing
 srv6
  locators
   locator LOC1
    prefix fc00:0:1::/48
    behavior usid
   !
  !
 !
!
router bgp 65001
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 update-source 172.30.0.3
 !
 address-family ipv4 unicast
  no neighbor 172.30.0.2 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 172.30.0.2 activate
 exit-address-family
 !
 segment-routing srv6
  locator LOC1
 !
!
router bgp 65001 vrf customer1
 bgp router-id 172.30.0.3
 !
 address-family ipv6 unicast
  sid vpn export auto
  rd vpn export 1:1
  rt vpn both 100:1
  redistribute connected
  network 2001:db8:customer::/48
 exit-address-family
!
