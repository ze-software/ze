# Ze side of the ospfv3-ptmp-frr interop scenario (spec-ospf-ext-8, IPv6 PtMP).
#
# Ze runs the OSPFv3 (IPv6) family with eth0 as a point-to-multipoint interface:
# no DR/BDR, a full adjacency with FRR ospf6d over IPv6 link-local (ff02::5), one
# address-free point-to-point Router-LSA link per neighbor, and a /128 LA-bit host
# route for its own global address in the Intra-Area-Prefix-LSA (RFC 5340).

ospf {
	router-id 172.30.0.2
	address-family ipv6 {
		areas {
			area 0.0.0.0 {
				area-type normal
			}
		}
		interfaces {
			interface eth0 {
				area 0.0.0.0
				network-type point-to-multipoint
				cost 10
			}
		}
	}
}
