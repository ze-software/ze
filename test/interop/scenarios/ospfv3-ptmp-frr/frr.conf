frr defaults traditional
hostname frr-ospfv3-ptmp
log file /tmp/frr.log informational
!
! OSPFv3 (RFC 5340) point-to-multipoint on the shared L2 bridge to Ze (eth0). No
! DR/BDR is elected; each router advertises the other as an address-free
! point-to-point Router-LSA link and its own address as a /128 host route in the
! Intra-Area-Prefix-LSA. Same area 0.0.0.0.
interface eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-multipoint
!
router ospf6
 ospf6 router-id 172.30.0.3
!
