# RFC 8277 Section 2.4, a labelled withdrawal carrying the Compatibility
# field, judged by FRR.
#
#     INTEROP_SCENARIO=bgp-labeled-withdraw-compatibility-frr ./le test integration interop
#
# WHAT THE SCENARIO MEASURES. A raw injector announces 10.10.0.0/24 under
# label 100 and 10.11.0.0/24 under label 101 in ipv4/mpls-label, then withdraws
# 10.10.0.0/24 alone with MP_UNREACH_NLRI [Length 48][0x800000][10.10.0.0/24].
# "Upon reception, the value of the Compatibility field MUST be ignored": ze
# must read the three octets as the Compatibility field, not as a label entry,
# and find 10.10.0.0/24. FRR loses 10.10.0.0/24 with the injector session still
# Established. The checker then stops the injector, and bgp-rs withdraws what
# its route inventory still holds for that peer: FRR loses 10.11.0.0/24 and
# logs no second withdrawal of 10.10.0.0/24.
# Both VPN families add three equal-prefix routes at RDs65004:10,20,30.
# RD10 is withdrawn with Compatibility800000, RD20 with123456; RD30 remains.
# FRR's RD-scoped table and labels prove identity before withdrawal. Injector
# DOWN must withdraw only RD30, never repeat either target withdrawal.
#
# WHAT MAKES IT DISCRIMINATE. bgp-rs relays the withdrawal's bytes unchanged
# and FRR parses them itself, so FRR losing 10.10.0.0/24 is not ze's reading.
# ze's reading (MPUnreachWire.NLRIs, internal/component/bgp/wireu/mpwire.go)
# decides what bgp-rs removes from its inventory. Frame the withdrawal with the
# announcement reader (ParseNLRIs) and 0x800000 reads as a label entry whose S
# bit is clear, the walk runs past the NLRI, and the inventory keeps
# 10.10.0.0/24: the peer-down withdrawal sends it to FRR a second time, and
# the checker's count of FRR's withdrawal decodes goes from one to two.
#
# THE RELAY IS bgp-rs on a plain eBGP peering (no rs-client), the rail
# as-path-mixed-width-relay-frr uses: ze prepends 65001, which FRR's
# enforce-first-as demands. adj-rib-in serves the route server's peer-up
# replay, but the injector waits for FRR before announcing so the checker sees
# every initial route before the deliberate withdrawals (inject.msg, BARRIER1).
plugin {
	internal rs {
		use bgp-rs;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	# ze dials the injector (accept false), because le test peer listens rather
	# than connects in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/mpls-label { prefix { maximum 10000; } }
				ipv4/mpls-vpn { prefix { maximum 10000; } }
				ipv6/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		# The tokens match SetStartupSubscriptions in RunRouteServer
		# (plugins/rs/server.go).
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			receive [ update-received state ]
			send [ update ]
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/mpls-label { prefix { maximum 10000; } }
				ipv4/mpls-vpn { prefix { maximum 10000; } }
				ipv6/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			receive [ update-received state ]
			send [ update ]
		}
	}
}
