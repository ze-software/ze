frr defaults traditional
hostname frr-labeled-withdraw-compatibility
! debugging level, not informational: the checker counts FRR's own per-UPDATE
! decodes of the withdrawals ze sends, which FRR logs only at debug level.
log file /tmp/frr.log debugging
!
debug bgp updates
debug bgp updates in
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 ! FRR refuses to activate one neighbor for both ipv4 unicast and ipv4
 ! labeled-unicast ("Cannot activate peer for both"), and the traditional
 ! defaults activate ipv4 unicast for every neighbor, so that default is off.
 no bgp default ipv4-unicast
 neighbor 172.30.0.2 remote-as 65001
 !
 ! The family under test, RFC 8277 labelled unicast (AFI 1, SAFI 4).
 address-family ipv4 labeled-unicast
  neighbor 172.30.0.2 activate
 exit-address-family
 address-family ipv4 vpn
  neighbor 172.30.0.2 activate
 exit-address-family
 address-family ipv6 vpn
  neighbor 172.30.0.2 activate
 exit-address-family
!
