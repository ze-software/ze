frr defaults traditional
hostname frr-isis-lan
log file /tmp/frr.log informational
!
! IS-IS broadcast LAN on the shared bridge to Ze (eth0). FRR uses a LOWER DIS
! priority (default 64) than Ze (100) so Ze is elected DIS and originates the
! pseudo-node LSP; FRR records the pseudo-node as its neighbour. Same area
! (49.0001), level-1-2, so the LAN adjacency forms and routes converge (AC-14).
interface eth0
 ip router isis ZE
 isis circuit-type level-1-2
 isis network broadcast
 isis priority 64
!
interface lo
 ip router isis ZE
 isis passive
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
!
