# Ze side of the isis-lan-dis-frr interop scenario (spec-isis-13 AC-14).
#
# Ze and FRR sit on the shared Docker bridge (eth0) as a broadcast LAN segment.
# A Designated IS is elected (priority + MAC tiebreak); the DIS originates a
# pseudo-node LSP representing the segment. Ze runs with a HIGHER DIS priority so
# it is the elected DIS and originates the pseudo-node LSP (AC-14); routes
# converge over the LAN.

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1-l2
	hostname ze-lan
	interface eth0 {
		metric 10
		level l1-l2
		circuit-type broadcast
		priority 100
	}
	interface lo {
		passive true
	}
}
