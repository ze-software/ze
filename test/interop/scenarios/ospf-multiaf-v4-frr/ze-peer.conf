# Peer Ze side of the ospf-multiaf-v4-frr scenario (Ze<->Ze fallback, assumption A-9).
#
# A second Ze instance running the same IPv4-unicast-over-OSPFv3 address family (Instance ID
# 64) on eth0, so the two Ze nodes form the IPv4-over-OSPFv3 adjacency FRR ospf6d cannot. It
# learns the connected IPv4 prefix the first node redistributes and installs it into its IPv4
# RIB/FIB (RFC 5838 §2.7).

ospf {
	router-id 172.30.0.3
	address-family {
		ipv4-unicast {
			instance-id 64
			areas {
				area 0.0.0.0 {
					area-type normal
				}
			}
			interfaces {
				interface eth0 {
					area 0.0.0.0
					network-type point-to-point
					cost 10
				}
			}
		}
	}
}
