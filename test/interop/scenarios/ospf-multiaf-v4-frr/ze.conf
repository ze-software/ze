# Ze side of the ospf-multiaf-v4-frr interop scenario (spec-ospf-ext-15 §2.7, RFC 5838).
#
# Ze runs the IPv4-unicast-over-OSPFv3 address family (Instance ID 64) on the shared bridge
# (eth0) and redistributes a connected IPv4 route into it, originating an OSPFv3 AS-External
# LSA that carries an IPv4 prefix (RFC 5838 §2.7: a 0-32-bit prefix in one 32-bit word) with
# the AF-bit set. The learned IPv4 route installs into family.IPv4Unicast on the peer.
#
# NOTE (assumption A-9): FRR ospf6d does not implement the IPv4-unicast AF, so the peer here
# is a SECOND Ze instance (Ze<->Ze), recorded as a Deviation. The default IPv6-unicast leg
# still peers with FRR in ospf-multiaf-frr; this scenario isolates the IPv4-over-OSPFv3 path.
#
# GOAL-VALIDATION TARGET (AC-8/AC-13): the IPv4-unicast instance forms an adjacency, an IPv4
# prefix rides the OSPFv3 LSA model, and the route installs into the IPv4 RIB/FIB on the peer.

ospf {
	router-id 172.30.0.2
	address-family {
		ipv4-unicast {
			instance-id 64
			areas {
				area 0.0.0.0 {
					area-type normal
				}
			}
			interfaces {
				interface eth0 {
					area 0.0.0.0
					network-type point-to-point
					cost 10
				}
			}
		}
	}
	redistribute connected {
		metric 20
		metric-type type-2
	}
}
