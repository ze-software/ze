# Ze side of the ospf-multiaf-v4-frr interop scenario (spec-ospf-ext-15 §2.7, RFC 5838).
#
# Ze runs the IPv4-unicast-over-OSPFv3 address family (Instance ID 64) on the shared bridge
# (eth0) and redistributes IPv4 routes into it, originating OSPFv3 AS-External LSAs that
# carry an IPv4 prefix (RFC 5838 §2.7: a 0-32-bit prefix in one 32-bit word) with the AF-bit
# set. The static 10.99.0.0/24 is a prefix only Ze holds (the connected eth0 /24 is the
# peer's own connected network too), so the peer's kernel can hold it only as the route it
# learned over OSPFv3, through Ze's address on the lab link.
#
# NOTE (assumption A-9): FRR ospf6d does not implement the IPv4-unicast AF, so the peer here
# is a SECOND Ze instance (Ze<->Ze), recorded as a Deviation. The default IPv6-unicast leg
# still peers with FRR in ospf-multiaf-frr; this scenario isolates the IPv4-over-OSPFv3 path.
#
# GOAL-VALIDATION TARGET (AC-8/AC-13): the IPv4-unicast instance forms an adjacency, an IPv4
# prefix rides the OSPFv3 LSA model, and the route installs into the IPv4 RIB/FIB on the peer.

ospf {
	router-id 172.30.0.2
	address-family {
		ipv4-unicast {
			instance-id 64
			areas {
				area 0.0.0.0 {
					area-type normal
				}
			}
			interfaces {
				interface eth0 {
					area 0.0.0.0
					network-type point-to-point
					cost 10
				}
			}
		}
	}
}

# The shared orchestrator rule is what redistributes: an IPv4 route imported into
# ospf originates on the IPv4-unicast instance (RFC 5838 §2.7).
redistribute {
	destination ospf {
		import static
	}
}

static {
	table default {
		route 10.99.0.0/24 {
			blackhole { }
		}
	}
}
