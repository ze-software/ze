frr defaults traditional
hostname frr-ospf-gr
log file /tmp/frr.log informational
!
! OSPFv2 P2P to Ze (eth0) with Graceful Restart helper + restarter enabled, so
! FRR both helps a restarting Ze and can itself restart with Ze as helper
! (RFC 3623, bidirectional).
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 capability opaque
 graceful-restart grace-period 120
 graceful-restart helper enable
 passive-interface lo
!
