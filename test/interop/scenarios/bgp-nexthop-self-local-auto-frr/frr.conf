frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! FRR originates one prefix of its own. It is not asserted on: it is the
! injector's READINESS BARRIER. Ze relays it to the injector, and the injector
! sends nothing until it arrives, which is how the scenario knows the FRR
! session is established and the forward rail is carrying traffic. Blackhole so
! zebra has a matching route for `network`.
ip route 10.20.0.0/24 blackhole
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 ! enforce-first-as is LEFT ON: the leftmost AS of every route Ze advertises
 ! must be 65001.
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 aigp
 neighbor 172.30.0.2 oad
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  network 10.20.0.0/24
 exit-address-family
!
