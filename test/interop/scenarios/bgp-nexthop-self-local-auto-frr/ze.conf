# RFC 4271 Section 5.1.3 against a real receiver, under `local ip auto`.
#
#     "A BGP speaker MUST be able to support the disabling advertisement of
#      third party NEXT_HOP attributes in order to handle imperfectly bridged
#      media."
#
# Ze (AS 65001) relays between a raw injector (AS 65004) and FRR (AS 65002). The
# FRR peer carries `next-hop self` and configures NO local address
# (`local { ip auto; }`), so the only address of Ze for that session is the
# local endpoint of its established TCP connection. FRR must report that
# address, 172.30.0.2, as the NEXT_HOP of two routes:
#
#   10.10.1.0/24  Ze's OWN route (the `update` block below, `next-hop self`):
#                 the announce rail, resolveNextHop.
#   10.10.0.0/24  the injector's route, received with NEXT_HOP 172.30.0.9 and
#                 FORWARDED to FRR: the forward rail, precomputeNextHop.
#
# The forwarded half is what discriminates. Before precomputeNextHop read the
# connected endpoint (connectedLocalAddress, reactor/session_connection.go), it
# built next-hop self from the configured local address alone, found none under
# `ip auto`, left the mode at none, and FRR received the injector's 172.30.0.9.
#
# The injector keeps an explicit local address and no next-hop self: the route
# Ze relays to it is only the readiness barrier.
#
# rs-fast-path is ABSENT and the `attach process rs` blocks select the GENERAL
# forward rail (forwardUpdateSection), the one an ordinary deployment runs; see
# bgp-self-nexthop-withheld-frr for why the attach tokens are these.
plugin {
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# The raw injector. Ze dials it (accept false), because le test peer
	# listens rather than connects in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			# The subject, with next-hop self below: no configured local address.
			local  { ip auto; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			next-hop self;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		# Ze's own route. `next-hop self` here is answered by resolveNextHop
		# from the same connected endpoint.
		update {
			attribute {
				origin igp
				next-hop self
			}
			nlri {
				ipv4/unicast add 10.10.1.0/24
			}
		}
	}
}
