frr defaults traditional
hostname frr-as-path-mixed-width-relay
log file /tmp/frr.log informational
!
! FRR IS THE NEW BGP SPEAKER OF RFC 6793 HERE. It negotiates the four-octet AS
! capability with ze, so the reconstructed AS number 4200000123 can reach it in
! AS_PATH itself and its own route view is what the checker reads. The OLD
! speaker of this scenario is the raw injector at 172.30.0.9, and ze holds THAT
! session to two octets from its own side (ze.conf, capability asn4 false).
!
! THE TWO FRR-SIDE FACTS MEASURED ON 2026-09-08 IN
! test/interop/scenarios/as-path-prepend-two-octet-peer/frr.conf DO NOT BIND
! THIS SCENARIO, and each one is written down here so the next reader does not
! copy a line that guards nothing:
!
!   dont-capability-negotiate suppresses only what FRR SENDS, so a scenario
!   using it must put the REAL four-octet ASN in remote-as or FRR answers every
!   OPEN with "2/2 (OPEN Message Error/Bad Peer AS)". This scenario does not use
!   it: FRR must be a NEW speaker for the reconstruction to be visible to it at
!   all. remote-as therefore carries ze's real ASN, 65001, which is mappable.
!
!   enforce-first-as is on by default in FRR 10.3 and rejects a leading AS_TRANS
!   that RFC 6793 Section 4.2.2 requires on a two-octet session. This session
!   carries no AS_TRANS: ze relays over a plain eBGP peering and prepends 65001,
!   which is exactly what enforce-first-as demands. The check is left ON, so a
!   relay that lost the prepend is caught here rather than passing.
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
