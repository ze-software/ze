# RFC 6793 Section 4.2.3, the mixed-width relay, judged by FRR.
#
#     INTEROP_SCENARIO=as-path-mixed-width-relay-frr ./le integration interop
#
# WHAT THE SCENARIO MEASURES. The injector is an OLD BGP speaker: ze holds that
# session to two octets (capability asn4 false below), so the AS path it sends
# arrives as AS_PATH [65004, AS_TRANS] with the real four-octet AS number in the
# AS4_PATH companion. RFC 6793 Section 4.2.3 obliges the receiver to reconstruct
# one AS path from the pair. ze does that ONCE, at ingest (CollapseAS4Family,
# internal/component/bgp/wireu/aspath_collapse.go, called from processMessage,
# internal/component/bgp/reactor/session_read.go), so the route ze holds and the
# route ze relays both carry 4200000123 where AS_TRANS was.
#
# FRR IS THE JUDGE, AND ONLY A PEER DAEMON CAN BE. ze's own tests pin the octets
# ze writes. Whether those octets name the real AS number in another
# implementation's route view is a question ze cannot answer about itself, and
# `show bgp ipv4 unicast 10.0.0.0/24 json` is FRR reading its own table.
#
# WHAT MAKES IT DISCRIMINATE. Break the collapse and the payload keeps its
# two-octet label, the forward path widens [65004, 23456] to four octets, and
# FRR reports AS 23456 in the path. The checker requires the ordered pair
# "65004 4200000123" AND the absence of 23456, and both fail.
#
# THE RELAY IS bgp-rs, NOT bgp-rib, and that was measured rather than chosen.
# With `internal rib` alone and both peers attaching it, ze's own `show bgp rib`
# held 10.0.0.0/24 with 4200000123 and FRR's table stayed empty for the whole
# 90-second wait, with and without a `send [ update ]` grant on the FRR peer
# (2026-09-09, plan/journal/test-against-broken-path.md). bgp-rs is the rail
# this spec's story names anyway: ForwardUpdate to buildFwdBody, the same one
# bgp-rfc7606-relay-shape-frr drives with this injector and this FRR.
#
# NO rs-client ANYWHERE. That leaf selects the RFC 7947 non-prepending path
# (forward_rs.go, the `isEBGP && !rsClient` branch), and leaving it false makes
# this a plain eBGP relay: ze prepends 65001, which is what FRR's own
# enforce-first-as demands of its peer.
plugin {
	internal rs {
		use bgp-rs;
	}
	# The STORE, and it relays nothing here: it is what makes `show bgp rib`
	# answer, so the checker can read ze's own view of the reconciled route
	# before it reads FRR's. A red on that assertion names the ingest side; a
	# red on the FRR assertions with it green names the relay.
	internal rib {
		use bgp-rib;
	}
	# The injector announces before FRR connects, so the route reaches FRR
	# through the peer-up REPLAY rather than a live forward, and the route
	# server asks adj-rib-in for that replay. Without this instance it waits for
	# a store that does not exist and logs `peer-up replay gave up waiting for
	# adj-rib-in to reach the cut ... ingested=0`.
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	# THE OLD SPEAKER. `asn4 false` is the whole condition of the requirement
	# under test: neg.ASN4 is localASN4 && remoteASN4
	# (internal/core/bgp/capability/negotiated.go), so ze withholding the
	# capability puts the session in two-octet mode whatever the injector
	# offers. ze dials it (accept false), as the plugin suite does, because
	# ze-test peer listens rather than connects in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			capability {
				asn4 false;
			}
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# The tokens match SetStartupSubscriptions in RunRouteServer
		# (plugins/rs/server.go). `state` and `open-received` are as load-bearing
		# as `update-received`, because they are what fill peer.Up and
		# peer.Families.
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		# The SOURCE half of the replay: adj-rib-in stores what this peer sends.
		attach process adj-rib-in {
			receive [ update-received state ]
		}
		# The same events feed the RIB store the checker reads.
		attach process rib {
			receive [ update-received state ]
		}
	}
	# THE NEW SPEAKER. No capability block, so this session negotiates four
	# octets and the reconstructed AS number can travel in AS_PATH itself.
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		# The DESTINATION half of the replay: the replayed route leaves on this
		# peer's wire, so adj-rib-in needs permission to originate one here
		# (maySend, internal/component/bgp/reactor/send_permission.go).
		attach process adj-rib-in {
			send [ update ]
		}
	}
}
