frr defaults traditional
hostname frr-path-asn-leak
log file /tmp/frr.log informational
!
! Two prefixes leave FRR on one session, and they differ only in the AS_PATH
! they carry. That is what makes the scenario discriminate: a ze that rejects
! every route fails on the clean prefix, and a ze that rejects nothing fails on
! the leaked one.
!
!   10.71.1.0/24   the CUSTOMER route.  AS_PATH [64500 64520]
!   10.71.2.0/24   the LEAKED route.    AS_PATH [64500 3356 64510]
!
ip route 10.71.1.0/24 Null0
ip route 10.71.2.0/24 Null0
!
ip prefix-list CLEAN seq 5 permit 10.71.1.0/24
ip prefix-list LEAKED seq 5 permit 10.71.2.0/24
!
! FRR prepends its own AS 64500 when a route leaves an external session, so each
! route-map clause writes only the tail of the path. The leaked clause writes
! AS3356, a transit provider ze must not be reached through, and behind it the
! ASN that originated the route.
route-map TO-ZE permit 10
 match ip address prefix-list LEAKED
 set as-path prepend 3356 64510
!
! The clean clause writes a customer ASN behind AS64500. That ASN is outside the
! leading run, so ze judges it at `origin`, and `indirect` covers `origin`.
! The route is accepted because 64520 is not on the list, not because its
! position exempted it.
route-map TO-ZE permit 20
 match ip address prefix-list CLEAN
 set as-path prepend 64520
!
router bgp 64500
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65000
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  neighbor 172.30.0.2 route-map TO-ZE out
  redistribute static
 exit-address-family
!
