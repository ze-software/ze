# RFC 7454 Section 9, the transit leak, judged against FRR and BIRD.
#
# FRR (172.30.0.3, AS64500) is the peer that leaks. It announces two prefixes on
# one session, and only the AS_PATH differs between them:
#
#   10.71.1.0/24   [64500 64520]        a customer route
#   10.71.2.0/24   [64500 3356 64510]   reached through a transit provider
#
# Ze holds one reject-asn list naming AS3356 at `indirect`, and the
# frr-source peer names it on its import chain. AS3356 sits at index 1 of the
# leaked path, outside the leading run of the sender's own ASN, so it occupies
# `transit` and the route is rejected before it is cached. AS64520 sits at
# `origin` on the clean path, which `indirect` also covers, and it is accepted
# because it is not on the list.
#
# BIRD (172.30.0.4) is the downstream observer. It reads what ze re-advertised,
# so the claim that the leak never left ze is made by a foreign daemon rather
# than by ze's own view of what it sent.
plugin {
	# bgp-rib holds the adj-RIB-in the checker reads, so `show bgp rib` can
	# answer which of the two prefixes ze installed.
	internal bgp-rib {
		use bgp-rib;
	}
	# bgp-rs is the rail that re-advertises what frr-source sent to bird-dest.
	internal bgp-rs {
		use bgp-rs;
	}
	# Without this instance the `reject-asn` config root is an unknown keyword
	# and the daemon refuses the file.
	internal bgp-filter-path-asn {
		use bgp-filter-path-asn;
	}
}
bgp {
	policy {
		reject-asn NO-TRANSIT {
			indirect [ 3356 ];
		}
	}
	peer frr-source {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65000; remote 64500; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		# The chain names the list by its bare name, which is the form an
		# operator writes.
		filter {
			import [ NO-TRANSIT ];
		}
		# Loading bgp-rib does not feed it. A peer grants events through its own
		# attach block, so without this one the RIB holds nothing and every
		# `show bgp rib` answer is empty for a reason that is not the filter.
		attach process bgp-rib {
			receive [ update state refresh ];
		}
		behavior { rs-fast-path enable; }
	}
	peer bird-dest {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65000; remote 65000; }
			router-id 172.30.0.2;
			next-hop self;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		behavior { rs-fast-path enable; }
	}
}
