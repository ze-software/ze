log stderr all;
router id 172.30.0.4;

protocol device {
}

# BIRD is the downstream observer. It accepts everything ze offers, so its table
# is a reading of what ze re-advertised and of nothing else. It exports nothing,
# so no route travels back and no second path can satisfy an assertion for the
# wrong reason.
protocol bgp ze_leak {
	local 172.30.0.4 as 65000;
	neighbor 172.30.0.2 as 65000;
	ipv4 {
		import all;
		export none;
	};
}
