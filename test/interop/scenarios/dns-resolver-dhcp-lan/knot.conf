# Knot DNS, authoritative for the lab zone lab.example.
server:
    listen: 0.0.0.0@53
    rundir: /run/knot

log:
  - target: stdout
    any: info

database:
    storage: /var/lib/knot

template:
  - id: default
    storage: /etc/knot
    zonefile-sync: -1
    zonefile-load: whole
    journal-content: none

zone:
  - domain: lab.example.
    file: lab.example.zone
