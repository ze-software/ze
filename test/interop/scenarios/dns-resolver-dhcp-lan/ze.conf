# Ze as the DHCP server and LAN DNS resolver of the lab segment.
#
# The lab client (dnsclient) leases the one pool address 172.30.0.60 from ze's
# DHCP server, which hands out ze's own lab address as the DNS server
# (option 6). The resolver answers only the leased address (allow-from
# 172.30.0.60/32) and forwards to Knot DNS (172.30.0.40), authoritative for
# lab.example. A query from the client's other address, 172.30.0.42, is
# refused.
service {
    dhcp-server {
        enabled true;
        listen-interface eth0;
        shared-network LAN {
            subnet 172.30.0.0/24 {
                range {
                    start 172.30.0.60;
                    stop 172.30.0.60;
                }
                lease-time 3600;
                dns-server [ 172.30.0.2 ];
            }
        }
    }
    dns-resolver {
        enabled true;
        listener lan {
            ip 172.30.0.2;
            port 53;
        }
        allow-from [ 172.30.0.60/32 ];
        forward {
            server 172.30.0.40 {
                port 53;
            }
        }
    }
}
