frr defaults traditional
hostname frr-ospf-te-interas
! Retain DD negotiation evidence if the native adjacency prerequisite fails.
! FRR ospfd CLI: https://docs.frrouting.org/en/stable-8.5/ospfd.html
log file /tmp/frr.log debugging
debug ospf packet dd send detail
debug ospf packet dd recv detail
!
! OSPFv2 point-to-point on the shared L2 bridge to Ze (eth0), area 0.0.0.0, with the
! opaque-LSA capability explicitly enabled. FRR does not originate an Inter-AS-TE-v2 LSA itself;
! its role here is to accept and flood the AS-wide (Type 11) Opaque-type-6 LSA Ze
! originates for its proxied inter-AS link (RFC 5392 sec 4 / RFC 5250 legacy flooding).
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
 ! Explicitly negotiate O in DDs; TE origination alone is not the fixture oracle.
 ! https://docs.frrouting.org/en/stable-10.3/ospfd.html#opaque-lsa
 capability opaque
 mpls-te on
 mpls-te router-address 172.30.0.3
!
