# Ze side of the ospf-te-interas-frr interop scenario (spec-ospf-ext-2, RFC 5392).
#
# Ze forms a normal opaque OSPFv2 adjacency with FRR on eth0 (area 0.0.0.0). On a separate
# proxy interface (lo, passive -- RFC 5392 sec 4: no adjacency is formed on the inter-AS
# link) it configures an inter-AS TE link with scope=as, so Ze originates an Inter-AS-TE-v2
# LSA (Opaque type 6) as a Type 11 (AS-wide) opaque LSA carrying the Remote AS Number and
# IPv4 and IPv6 Remote ASBR IDs (no Link ID). FRR floods that AS-wide opaque LSA
# per RFC 5250 even though it does not interpret the inter-AS body.

ospf {
	router-id 172.30.0.2
	opaque true
	router-address 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
		interface lo {
			area 0.0.0.0
			passive true
			traffic-engineering {
				enable true
				max-bandwidth 1000000000
				inter-as {
					remote-as 65001
					remote-asbr-ipv4 203.0.113.9
					remote-asbr-ipv6 2001:db8::9
					scope as
				}
			}
		}
	}
}

# Export native LSAs, not injected BGP UPDATEs, to the wire collector.
plugin { internal native-export { use bgp-ls-export; } }
bgp-ls-export { }
bgp {
	peer collector {
		connection {
			remote { ip 172.30.0.10; connect false; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2
			family { bgp-ls/bgp-ls { prefix { maximum 10000; } } }
		}
		attach process native-export {
			receive [ state refresh ]
			send [ update ]
		}
	}
}
