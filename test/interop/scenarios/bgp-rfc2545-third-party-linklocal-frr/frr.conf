frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! The receiver of bgp-rfc2545-third-party-linklocal-frr. It peers with ze over
! the lab's IPv6 /64 and must decode a 32-octet Next Hop field naming
! frr-sink (fd00:1e:0::f) and frr-sink's link-local, then install the route
! through that link-local.
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor fd00:1e:0::2 remote-as 65001
 !
 address-family ipv6 unicast
  neighbor fd00:1e:0::2 activate
 exit-address-family
!
