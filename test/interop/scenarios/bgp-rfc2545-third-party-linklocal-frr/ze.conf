# RFC 2545 Section 3 for a next hop that names ANOTHER router, against a real
# receiver (FRR).
#
#     INTEROP_SCENARIO=bgp-rfc2545-third-party-linklocal-frr ./le test integration interop
#
# Three containers share the lab's IPv6 /64:
#
#   ze        fd00:1e:0::2   the speaker
#   frr       fd00:1e:0::3   the peer the route is advertised to
#   frr-sink  fd00:1e:0::f   the third-party router the next hop names; it runs
#                            no BGP, it only owns its addresses
#
# The checker resolves frr-sink's global and its one link-local from Ze's
# container with ping, so Ze's kernel neighbor table names both with frr-sink's
# MAC. It then runs, once FRR's session is up,
#
#     send bgp * update text origin igp nhop fd00:1e:0::f mp ipv6/unicast add 2001:db8:5603::/48
#
# The speaker shares one subnet with the entity the global names and with the
# peer, so the Next Hop field must carry frr-sink's global, then frr-sink's own
# link-local, read from the neighbor table (linkScope.thirdPartyLinkLocal,
# internal/component/bgp/reactor/link_scope.go). Ze's own link-local would send
# FRR's traffic to the wrong router, so no `link-local` leaf is set here: the
# second address can only come from the table.
#
# The export final is explicit because RFC 8212 Section 3 adds nothing to an
# EBGP peer's Adj-RIB-Out without an export policy.
#
# The interface block starts Ze's netlink monitor, whose (interface,
# neighbor-changed) event makes BGP re-read the neighbor table once the checker's
# pings resolve frr-sink. Without it no monitor runs, and the table BGP read
# when the session came up, before frr-sink was resolved, stays the answer.
#
# The checker is internal/le/interoplab/bgp/check_rfc2545_third_party.go.
interface {
	backend netlink
}

bgp {
	peer frr {
		connection {
			remote { ip fd00:1e:0::3; }
			local  { ip fd00:1e:0::2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv6/unicast { prefix { maximum 10000; } }
			}
		}
		filter { export { final accept; } }
	}
}
