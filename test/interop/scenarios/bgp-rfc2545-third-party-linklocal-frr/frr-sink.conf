frr defaults traditional
hostname frr-sink
log file /tmp/frr.log informational
!
! The third-party router of bgp-rfc2545-third-party-linklocal-frr. It runs no
! BGP: Ze's route names its global (fd00:1e:0::f) as the next hop, and its one
! link-local is the address the Next Hop field must carry second. It is a real
! host on the shared /64, so the address FRR installs the route through answers
! on the link.
!
