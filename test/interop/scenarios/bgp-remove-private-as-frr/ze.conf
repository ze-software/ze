plugin {
	internal rs {
		use bgp-rs;
	}
	internal bgp-filter-remove-private-as {
		use bgp-filter-remove-private-as;
	}
}
	policy {
		remove-private-as STRIP {
		}
	}

bgp {
	peer source-gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 64512; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			rs-fast-path enable;
		}
		# A peer that attaches nothing feeds nothing (docs/guide/plugins.md):
		# bgp-rs relays GoBGP's route to FRR only through these blocks.
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
	peer dest-frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		filter {
			export { filters [ remove-private-as:STRIP ]; final accept; }
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
}
