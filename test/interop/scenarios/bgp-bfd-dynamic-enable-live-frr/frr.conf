frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! FRR connects into ze's dynamic range (iBGP 65001) and runs BFD for ze from
! the start, at the bfdd defaults (300ms, detect multiplier 3). ze's group
! template gains the non-strict opt-in only by reload, so the BFD session first
! comes Up on a BGP session that was already Established.
!
bfd
 peer 172.30.0.2
 exit
!
router bgp 65001
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 bfd
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
