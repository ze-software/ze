# Reload config of the bgp-bfd-dynamic-enable-live-frr interop scenario:
# ze.conf with the group template's non-strict BFD opt-in under profile
# "fast". Nothing else differs.
bfd {
	enabled true;
	profile fast {
		detect-multiplier 3;
		desired-min-tx-us 300000;
		required-min-rx-us 300000;
	}
}

bgp {
	group dynpeers {
		connection {
			remote { ip dynamic; connect false; range 172.30.0.0/24; }
			local  { ip 172.30.0.2; accept true; }
			bfd {
				enabled true;
				mode single-hop;
				profile fast;
			}
		}
		session {
			asn { local 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast {
					mode enable;
					prefix { maximum 100000; }
				}
			}
		}
	}
}
