# Ze side of the bgp-bfd-dynamic-enable-live-frr interop scenario
# (spec-bgp-live-receive-binding-and-bfd-keep-session, AC-19 against FRR).
#
# FRR is accepted as a dynamic peer of group dynpeers. The bfd root and
# profile "fast" are present from boot, but the group template does not opt
# in. ze-reload.conf adds the non-strict opt-in to the template, and a reload
# back to this file removes it. FRR's BGP session to ze must not be
# re-established by the add. The removal must reach FRR as ze's AdminDown
# (remote-diagnostic "administratively down"); FRR 10.3.1 then resets BGP
# against RFC 5882 Section 4.2, a recorded peer deviation the checker does not
# assert on. The bfd root stays in both configs: an opt-in names the bfd
# plugin's profile, so the root is removed only after the last opt-in is.
bfd {
	enabled true;
	profile fast {
		detect-multiplier 3;
		desired-min-tx-us 300000;
		required-min-rx-us 300000;
	}
}

bgp {
	group dynpeers {
		connection {
			remote { ip dynamic; connect false; range 172.30.0.0/24; }
			local  { ip 172.30.0.2; accept true; }
		}
		session {
			asn { local 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast {
					mode enable;
					prefix { maximum 100000; }
				}
			}
		}
	}
}
