# Ze side of the bgp-redist-late-join-dynamic-frr interop scenario.
#
# Ze redistributes a static route into BGP and accepts FRR as a DYNAMIC inbound
# peer. On port 179 (root in Docker) the passive-peer listener is SHARED, so an
# inbound from an address in the dynamic group's range that does not match a
# configured peer becomes a dynamic peer (dyn-<addr>). The `anchor` peer only
# opens the shared listener on 172.30.0.2:179; its remote (172.30.0.99) never
# connects, so FRR (172.30.0.3) is not matched to it.
#
# The static route is redistributed at Ze startup, BEFORE FRR connects. FRR is a
# genuinely-new peer (absent from the reactor map at redistribute-emit time, with
# no PluginRoutes and no ribOut), so it receives 10.99.0.0/24 via the redistribute
# late-join replay fired on its session establishment -- a real-implementation
# proof of the dynamic/inbound late-join path.

static {
	table default {
		route 10.99.0.0/24 {
			next {
				hop 172.30.0.3 {
				}
			}
		}
	}
}

redistribute {
	destination bgp {
		import static {
			family [ ipv4/unicast ];
		}
	}
}

bgp {
	peer anchor {
		connection {
			remote { ip 172.30.0.99; connect false; }
			local  { ip 172.30.0.2; accept true; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}

	group dynpeers {
		connection {
			remote { ip dynamic; connect false; range 172.30.0.0/24; }
			local  { ip 172.30.0.2; accept true; }
		}
		session {
			asn { local 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast {
					mode enable;
					prefix { maximum 100000; }
				}
			}
		}
	}
}
