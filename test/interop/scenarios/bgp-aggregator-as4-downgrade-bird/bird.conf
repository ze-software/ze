# The OLD speaker. Ze holds this session to two-octet mode from its own side
# (ze.conf, capability asn4 false), so BIRD negotiates without the four-octet AS
# capability and reads AGGREGATOR as the six-octet attribute RFC 4271 defines.
#
# import all: the route under test must reach BIRD's table for `show route all`
# to report its aggregator.
log stderr all;
router id 172.30.0.4;

protocol device {
}

protocol bgp ze_peer {
	local 172.30.0.4 as 65002;
	neighbor 172.30.0.2 as 65001;
	# A genuine OLD speaker, which is what RFC 6793 Section 4.2.2 is about. Ze
	# withholds the capability from its side (ze.conf, asn4 false); this makes
	# BIRD withhold it too, so neither end negotiates four-octet AS support and
	# BIRD reads AGGREGATOR as the six-octet attribute RFC 4271 defines.
	enable as4 off;
	ipv4 {
		import all;
		export none;
	};
}
