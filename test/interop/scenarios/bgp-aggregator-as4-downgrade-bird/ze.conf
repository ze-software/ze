# RFC 6793 Section 4.2.2, the AGGREGATOR half, judged by a third-party daemon.
#
# The injector announces a route carrying an AGGREGATOR whose AS number is
# 4200000000, which is non-mappable. Ze forwards it to BIRD over a session Ze
# holds to two-octet mode (capability asn4 false), so Section 4.2.2's pair
# applies: "if the aggregating Autonomous System's AS number is a non-mappable
# four-octet AS number, then the speaker MUST use the AS4_AGGREGATOR attribute
# and set the AS number field in the existing AGGREGATOR attribute to the
# reserved AS number, AS_TRANS."
#
# bgp-rib is the point. The forward must take the RIB COMMIT rail
# (internal/component/bgp/rib/commit.go, packAttributesWithASPath), which sized
# and wrote every attribute but AS_PATH context-free. The route-server fast path
# (bgp-rs, buildFwdBody) was already correct and would hide the defect, so no
# rs-client and no rs-fast-path here.
#
# What makes it discriminate: with the fix backed out Ze sends the eight-octet
# AGGREGATOR on a session BIRD negotiated as two-octet. BIRD reads the attribute
# length against its own mode and does not accept it, so the aggregator BIRD
# reports is not 4200000000 and the check fails.
plugin {
	internal rib {
		use bgp-rib;
	}
}
bgp {
	# The source, in four-octet mode: this is how the four-octet aggregating AS
	# reaches Ze in the AGGREGATOR attribute at all. Ze dials it (accept false),
	# as the plugin suite does.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# Without this the RIB engine receives no peer-scoped event, so it learns
		# no route and commits nothing to the other peer.
		attach process rib {
			receive [ update-received state ]
		}
	}
	# The OLD speaker. asn4 false is what puts the session in two-octet mode, and
	# it is the whole condition of the requirement under test.
	peer bird-old {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			# BIRD's own AS is two-octet, which keeps AS_TRANS out of the OPEN
			# entirely. The four-octet AS this scenario is about is the AGGREGATOR's,
			# and it arrives from the injector, not from this peer.
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			capability {
				asn4 false;
			}
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rib {
			receive [ update-received state ]
		}
	}
}
