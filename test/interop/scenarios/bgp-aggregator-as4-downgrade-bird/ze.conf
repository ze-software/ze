# RFC 6793 Section 4.2.2, the AGGREGATOR half, judged by a third-party daemon.
#
#     INTEROP_SCENARIO=bgp-aggregator-as4-downgrade-bird ./le integration interop
#
# WHAT THE SCENARIO MEASURES. The injector announces a route carrying an
# AGGREGATOR whose AS number is 4200000000, which is non-mappable. Ze relays it
# to BIRD over a session Ze holds to two-octet mode (capability asn4 false), so
# Section 4.2.2's pair applies: "if the aggregating Autonomous System's AS
# number is a non-mappable four-octet AS number, then the speaker MUST use the
# AS4_AGGREGATOR attribute and set the AS number field in the existing
# AGGREGATOR attribute to the reserved AS number, AS_TRANS."
#
# BIRD IS THE JUDGE, AND ONLY A PEER DAEMON CAN BE. Ze's own tests pin the
# octets Ze writes. Whether an OLD speaker reads the real aggregating AS back
# out of the AS4_AGGREGATOR companion is a question Ze cannot answer about
# itself, and `birdc show route for 10.0.0.0/24 all` is BIRD reporting its own
# table.
#
# THE RELAY IS bgp-rs, NOT bgp-rib, and that was measured rather than chosen.
# `internal rib` alone STORES a learned route and advertises it to no other
# peer: the plugin's only route-sending producer is sendRoutes
# (internal/component/bgp/plugins/rib/rib_commands.go), which RFC 7313 route
# refresh calls and nothing on the receive path does. Measured on 2026-09-09 in
# the sibling scenario, with and without a `send [ update ]` grant, the peer's
# table stayed empty for the whole 90-second wait
# (plan/journal/test-against-broken-path.md). This scenario carried that same
# broken premise until 2026-09-11 and therefore proved nothing at all.
#
# WHAT THAT MOVES. The emission under test is now recordAggregator
# (internal/component/bgp/wireu/aspath_slot.go), the AS-path edit rail
# reactorForwardRS records its intent on, and no longer appendAS4AggregatorFor
# (internal/component/bgp/rib/commit.go), which the header claimed until the
# relay question was settled. The commit rail keeps its own unit coverage in
# internal/component/bgp/rib/rfc6793_aggregator_test.go.
#
# WHAT MAKES IT DISCRIMINATE. Suppress the AS4_AGGREGATOR half of
# recordAggregator and the AGGREGATOR still leaves as AS_TRANS, with no
# companion carrying the real number. BIRD then reports AS 23456 and the
# checker's required "4200000000" is absent.
#
# NO rs-client ANYWHERE. That leaf selects the RFC 7947 non-prepending path
# (forward_rs.go, the `isEBGP && !rsClient` branch), and leaving it false makes
# this a plain eBGP relay: Ze prepends 65001, which is what an OLD speaker
# expects of its neighbor.
plugin {
	internal rs {
		use bgp-rs;
	}
	# The STORE, and it relays nothing here. It is what makes `show bgp rib`
	# answer, so a red can be read: a red on BIRD with Ze's own view holding the
	# route names the relay, and an empty view names ingest.
	internal rib {
		use bgp-rib;
	}
	# The injector announces before BIRD connects, so the route reaches BIRD
	# through the peer-up REPLAY rather than a live forward, and the route
	# server asks adj-rib-in for that replay. Without this instance it waits for
	# a store that does not exist and logs `peer-up replay gave up waiting for
	# adj-rib-in to reach the cut ... ingested=0`.
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	# The source, in four-octet mode: this is how the four-octet aggregating AS
	# reaches Ze in the AGGREGATOR attribute at all. Ze dials it (accept false),
	# as the plugin suite does.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# The tokens match SetStartupSubscriptions in RunRouteServer
		# (plugins/rs/server.go). `state` and `open-received` are as load-bearing
		# as `update-received`, because they are what fill peer.Up and
		# peer.Families.
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		# The SOURCE half of the replay: adj-rib-in stores what this peer sends.
		attach process adj-rib-in {
			receive [ update-received state ]
		}
		# The same events feed the RIB store.
		attach process rib {
			receive [ update-received state ]
		}
	}
	# The OLD speaker. asn4 false is what puts the session in two-octet mode, and
	# it is the whole condition of the requirement under test.
	peer bird-old {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			# BIRD's own AS is two-octet, which keeps AS_TRANS out of the OPEN
			# entirely. The four-octet AS this scenario is about is the AGGREGATOR's,
			# and it arrives from the injector, not from this peer.
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			capability {
				asn4 false;
			}
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		# The DESTINATION half of the replay: the replayed route leaves on this
		# peer's wire, so adj-rib-in needs permission to originate one here
		# (maySend, internal/component/bgp/reactor/send_permission.go).
		attach process adj-rib-in {
			send [ update ]
		}
		attach process rib {
			receive [ update-received state ]
		}
	}
}
