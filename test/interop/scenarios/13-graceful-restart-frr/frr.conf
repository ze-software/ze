frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! One prefix for FRR to advertise. check.py asserts Ze RECEIVED at least one
! route, and until 2026-08-07 this file gave FRR nothing to send: no network,
! no redistribute, no static route. The assertion could not pass on any run.
! It read as an empty RIB because Ze.rib_count answered 0 for a failed query
! too, so the setup gap and the broken query were indistinguishable.
! A graceful-restart peer holding no routes also proves less than one that does.
ip route 10.20.0.0/24 Null0
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 bgp graceful-restart
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  redistribute static
 exit-address-family
!
