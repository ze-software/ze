# Ze side of the isis-narrow-metric-frr interop scenario (RFC 3787 section 5).
#
# RFC 3787 section 5: "If not all devices in the IS-IS domain support wide
# metrics, narrow metrics MUST continue to be used."
#
# FRR runs `metric-style narrow`, so it is the device that does not support
# wide metrics. Ze runs `metric-style narrow` too and redistributes the static
# 10.78.2.0/24 into IS-IS. FRR can install that prefix only if Ze advertises it
# in TLV 128 and lists FRR in TLV 2: a Ze that advertised only TLV 22 and TLV
# 135 would leave FRR's IS-IS route table without it.

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1-l2
	hostname ze-narrow
	metric-style narrow
	interfaces {
		interface eth0 {
			metric 10
			level l1-l2
			circuit-type point-to-point
			hello-interval 1
			hold-multiplier 3
		}
	}
}

static {
	table default {
		route 10.78.2.0/24 {
			next {
				hop 172.30.0.3 {
				}
			}
		}
	}
}

redistribute {
	destination isis {
		import static
	}
}
