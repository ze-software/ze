frr defaults traditional
hostname frr-isis-narrow
log file /tmp/frr.log informational
!
! FRR is the narrow-only router of RFC 3787 section 5: with `metric-style narrow`
! its SPF reads only TLV 2 and TLV 128/130 (isis_spf.c process_lsp skips every
! wide TLV when newmetric is off). It installs a prefix Ze advertises only when
! Ze advertises it in a narrow TLV.
interface eth0
 ip router isis ZE
 isis circuit-type level-1-2
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
!
! A prefix only FRR advertises, so Ze installing it shows Ze reads FRR's narrow
! LSP as well.
interface lo
 ip address 10.78.7.7/32
 ip router isis ZE
 isis passive
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1-2
 metric-style narrow
!
