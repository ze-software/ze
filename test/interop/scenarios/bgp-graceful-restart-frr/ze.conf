plugin {
	internal rib {
		use bgp-rib;
	}
	internal gr {
		use bgp-gr;
	}
	internal rs { use bgp-rs; }
	internal adj-rib-in { use bgp-adj-rib-in; }
	external announce-routes {
		run "le test interop-bgp process bgp-graceful-restart-frr announce-routes";
		encoder json;
	}
}
bgp {
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv6/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart {
					restart-time 120;
					long-lived-stale-time 60;
				}
			}
		}
		attach process announce-routes {
			send update;
		}
		attach process rib { receive [ update state refresh ]; send update; }
		attach process gr { receive [ open state eor ]; send update; }
		attach process rs { receive [ update-received state open-received refresh ]; send update; }
		attach process adj-rib-in { receive [ update-received state ]; send update; }
	}
	# The strict source omits IPv4 from code 64, but lists it with LLST 40 in
	# code 71. IPv6 has GR 20 then LLST 40, on the very same TCP connection.
	peer llgr-source {
		connection {
			remote { ip 172.30.0.10; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv6/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart { restart-time 20; long-lived-stale-time 60; } }
		}
		attach process rib { receive [ update state refresh ]; send update; }
		attach process gr { receive [ open state eor ]; send update; }
		attach process rs { receive [ update-received state open-received refresh ]; send update; }
		attach process adj-rib-in { receive [ update-received state ]; send update; }
	}
	# The second source supplies the no-LLST negative control.
	peer no-llst-source {
		connection {
			remote { ip 172.30.0.11; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65005; }
			router-id 172.30.0.2;
			family { ipv4/unicast { prefix { maximum 10000; } } }
			capability { graceful-restart { restart-time 20; long-lived-stale-time 60; } }
		}
		attach process rib { receive [ update state refresh ]; send update; }
		attach process gr { receive [ open state eor ]; send update; }
		attach process rs { receive [ update-received state open-received refresh ]; send update; }
		attach process adj-rib-in { receive [ update-received state ]; send update; }
	}
}
