bus {
	endpoint announce-routes {
		external {
			run "le test interop-bgp process bgp-graceful-restart-frr announce-routes";
		}
		encoding json;
		send {
			message bgp:update {
				to [ /bgp/peer/peer1 ];
			}
		}
	}
}
static {
	table default {
		route 172.30.0.3/32 {
			next {
				interface eth0 { }
			}
		}
		route 172.30.0.10/32 {
			next {
				interface eth0 { }
			}
		}
		route 172.30.0.11/32 {
			next {
				interface eth0 { }
			}
		}
		route fd00:1e:0::a/128 {
			next {
				interface eth0 { }
			}
		}
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv6/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart {
					short-lived {
						restart-time 120
					}
					long-lived {
						family {
							ipv4/unicast 60
							ipv6/unicast 60
						}
					}
				}
			}
		}
	}
	# The strict source omits IPv4 from code 64, but lists it with LLST 40 in
	# code 71. IPv6 has GR 20 then LLST 40, on the very same TCP connection.
	peer llgr-source {
		connection {
			remote { ip 172.30.0.10; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv6/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart { short-lived { restart-time 20; } long-lived { family { ipv4/unicast 60; ipv6/unicast 60; } } } }
		}
	}
	# The second source supplies the no-LLST negative control.
	peer no-llst-source {
		connection {
			remote { ip 172.30.0.11; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65005; }
			router-id 172.30.0.2;
			family { ipv4/unicast { prefix { maximum 10000; } } }
			capability { graceful-restart { short-lived { restart-time 20; } long-lived { family { ipv4/unicast 60; } } } }
		}
	}
}
