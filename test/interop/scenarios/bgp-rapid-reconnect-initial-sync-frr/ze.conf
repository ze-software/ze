# Ze side of the bgp-rapid-reconnect-initial-sync-frr interop scenario
# (spec-single-owner-lifecycle-2-bgp-session, AC-1).
#
# FRR clears the session three times, each time as soon as it reports the new
# session Established, so each clear lands while ze's initial sync for that
# session is still running. On the fourth session FRR must hold exactly the
# five prefixes below, each once, and report End-of-RIB received for both
# families.
#
# Graceful Restart is advertised on purpose: FRR 10.7.1 prints End-of-RIB
# received (gracefulRestartInfo.endOfRibRecv) only for a peer whose Graceful
# Restart capability it received (bgp_show_peer_gr_extra_info), so without it
# the End-of-RIB half of the check reads an empty object.
#
# The IPv6 next hop names ze's lab IPv6 address, which also makes the lab give
# the containers the IPv6 network.

plugin {
	internal gr {
		use bgp-gr;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exports routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv6/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart {
					restart-time 120;
				}
			}
		}
		update {
			attribute {
				origin igp;
				next-hop 172.30.0.2;
			}
			nlri {
				ipv4/unicast add 10.83.1.0/24 10.83.2.0/24 10.83.3.0/24;
			}
		}
		update {
			attribute {
				origin igp;
				next-hop fd00:1e:0::2;
			}
			nlri {
				ipv6/unicast add 2001:db8:83:1::/64 2001:db8:83:2::/64;
			}
		}
	}
}
