frr defaults traditional
hostname frr-rapid-reconnect
log file /tmp/frr.log informational
!
! FRR originates nothing: every route it holds from ze is one ze's config
! originates, so the checker can require the exact set.
!
! The checker runs `clear bgp <ze>` three times, each as soon as FRR reports
! the new session Established. FRR's own redial after each clear waits its
! start timer, which bgp_establish resets to 1 s on every Established; the
! connect timer of 2 s bounds a redial whose connect failed.
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 timers connect 2
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
