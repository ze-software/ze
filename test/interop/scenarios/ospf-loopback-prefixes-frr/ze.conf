# Actual kernel lo retains host127 ahead of two globally routable addresses.
# Advertising only the primary address loses both reciprocal loopback routes.
interface {
	backend netlink
	loopback {
		unit 0 {
			ipv4 {
				address [ 127.0.0.1/8 10.81.0.2/32 10.81.1.2/32 ]
			}
		}
	}
}

ospf {
	router-id 10.81.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
		interface lo {
			area 0.0.0.0
			passive true
			network-type loopback
		}
	}
}
