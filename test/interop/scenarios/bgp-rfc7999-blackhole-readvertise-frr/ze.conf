# RFC 7999 Section 3.1 against a real eBGP neighbor. A route carrying BLACKHOLE
# is re-advertised only to a neighbor that agreed to receive it; FRR has no
# agreement, so `blackholeReadvertiseRefused`
# (internal/component/bgp/plugins/filter_community/blackhole.go) withholds
# 10.200.0.1/32 from it while the untagged 10.201.0.0/24 goes through.
# test/plugin/rfc7999-blackhole-readvertise-agreement.ci pins every destination
# kind with hex.
#
# BIRD's session carries no `blackhole` block either. An agreement there would
# make Ze honor the route and add the NO_EXPORT guard
# (`blackholePropagationGuard`), and that community alone would keep the route
# off FRR: the scenario could then not go red with the refusal reverted.
#
# bgp-rs replays what bgp-adj-rib-in holds to a client that comes up after the
# routes arrived, so adj-rib-in is attached to both peers: BIRD's routes reach
# Ze before FRR is up, and without it the peer-up replay to FRR has nothing to
# send ("peer-up replay gave up waiting for adj-rib-in", first run 2026-10-21),
# which would make FRR's missing tagged route prove nothing.
plugin {
	internal rs {
		use bgp-rs;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
	internal community {
		use bgp-filter-community;
	}
	internal bgp-rib {
		use bgp-rib;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process adj-rib-in {
			receive [ update-received state ];
		}
		attach process bgp-rib {
			receive [ update-received state ];
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process adj-rib-in {
			send [ update ];
		}
	}
}
