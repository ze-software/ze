# The sender. BIRD originates two routes toward Ze: 10.200.0.1/32 tagged with
# BLACKHOLE (65535:666) and the untagged control 10.201.0.0/24. Both leave in
# the same session, so FRR holding the control proves the tagged one reached
# Ze and was refused toward FRR rather than never sent.
log stderr all;
router id 172.30.0.4;

protocol device {
}

protocol static static_routes {
	ipv4;
	route 10.200.0.1/32 blackhole;
	route 10.201.0.0/24 blackhole;
}

protocol bgp ze_peer {
	local 172.30.0.4 as 65003;
	neighbor 172.30.0.2 as 65001;
	ipv4 {
		import all;
		export filter {
			if proto != "static_routes" then reject;
			if net = 10.200.0.1/32 then bgp_community.add((65535, 666));
			accept;
		};
	};
}
