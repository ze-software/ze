# Kea as ze's DHCPv6 server on the shared interop segment (host 22 of the
# lab's IPv6 /64).
#
# The pool is one address, so the lease ze holds is known in advance. The
# lease is short so several lease periods fit in a few minutes: valid 40 s,
# preferred 30 s, T1 10 s, T2 20 s.
#
# The memfile database persists in the container, so a lease survives the
# checker's stop and start; the image's entrypoint deletes the server DUID on
# every start (test/interop/Dockerfile.kea), so after the restart Kea drops
# ze's RENEW for the old server and answers its REBIND.
#
# At INFO Kea 2.6 logs every packet it receives (DHCP6_PACKET_RECEIVED, with
# the client DUID and transaction id), every lease it grants or extends
# (DHCP6_LEASE_ALLOC, DHCP6_LEASE_RENEW), and at each start the server DUID it
# uses (DHCP6_USING_SERVERID): the lines the checker reads.
{
  "Dhcp6": {
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "service-sockets-max-retries": 30,
      "service-sockets-retry-wait-time": 1000
    },
    "lease-database": { "type": "memfile", "persist": true, "lfc-interval": 0 },
    "preferred-lifetime": 30,
    "valid-lifetime": 40,
    "renew-timer": 10,
    "rebind-timer": 20,
    "subnet6": [
      {
        "id": 1,
        "subnet": "fd00:1e:0::/64",
        "interface": "eth0",
        "pools": [ { "pool": "fd00:1e:0::50 - fd00:1e:0::50" } ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp6",
        "output-options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ]
  }
}
