# bgp-role-frr with bgp-role FORKED (spec-filter-wire-6-stage-filters). Everything
# but the plugin block is bgp-role-frr: the same FRR (local-role customer), the
# same peer config (role import provider) and the same checker steps. bgp-role
# runs as a real external process over TLS connect-back (`ze plugin bgp-role`),
# so the Role capability Ze puts in its OPEN, and the check of the Role FRR
# sends, cross the process boundary instead of running in the daemon. The hub
# server is what that connect-back dials.
#
# FRR 10.7.1 bgp_role_violation (bgpd/bgp_open.c) answers a Role that does not
# pair with its own Customer with a Role Mismatch NOTIFICATION, so the session
# reaches Established only when Ze advertised Provider.
plugin {
	hub { server local { ip 127.0.0.1; port 0; secret bgp-role-frr-forked-secret-000001; } }
	external bgp-role { run "ze plugin bgp-role --log-level info"; }
}
policy {
}

bgp {
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		role {
			import provider;
		}
	}
}
