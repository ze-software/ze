# Ze side of the ospf-auth-frr interop scenario (spec-ospf-13 AC-19).
#
# Ze and FRR form a keyed-MD5 authenticated OSPFv2 adjacency over the shared
# bridge (eth0). Both sides share key-id 1 / secret "ZeFrrOspfKey1"; the
# adjacency only reaches Full if the cryptographic authentication matches
# (RFC 2328 Appendix D). A mismatched key is rejected (unit-covered by
# TestOSPFAuthStoreSignVerify autype/digest mismatch).

ospf {
	router-id 172.30.0.2
	key-chains core {
		key 1 {
			algorithm md5
			secret ZeFrrOspfKey1
		}
	}
	areas {
		area 0.0.0.0 {
			area-type normal
			authentication {
				key-chain core
			}
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
			authentication {
				mode inherit
			}
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
