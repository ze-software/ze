frr defaults traditional
hostname frr-ospf-auth
log file /tmp/frr.log informational
!
! OSPFv2 keyed-MD5 authentication on the shared bridge to Ze (eth0). FRR shares
! key-id 1 / secret "ZeFrrOspfKey1" with Ze, so the cryptographically
! authenticated adjacency reaches Full (RFC 2328 Appendix D, AC-19).
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 ZeFrrOspfKey1
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
!
