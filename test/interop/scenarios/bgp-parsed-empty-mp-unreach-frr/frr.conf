frr defaults traditional
hostname parsed-empty-mp-recipient
log file /tmp/frr.log informational
!
! IPv6 EOR negotiation needs a real local IPv6 address even on IPv4 transport.
interface eth0
 ipv6 address fd00:1e:0::3/64
exit
!
! The existing bounded OPEN-only relay is the transport, never the UPDATE decoder.
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 no bgp enforce-first-as
 neighbor 172.30.0.11 remote-as 65001
 neighbor 172.30.0.11 passive
 address-family ipv4 unicast
  neighbor 172.30.0.11 activate
  neighbor 172.30.0.11 prefix-list NONE out
 exit-address-family
 address-family ipv6 unicast
  neighbor 172.30.0.11 activate
  neighbor 172.30.0.11 prefix-list NONE6 out
 exit-address-family
!
ip prefix-list NONE seq 10 deny 0.0.0.0/0 le 32
ipv6 prefix-list NONE6 seq 10 deny ::/0 le 128
