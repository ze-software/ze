# The source is ASN4; the FRR-facing destination is deliberately two-octet.
# Disabling ASN4 only on an old source would not force the parsed path: ingest
# may canonicalize its context. Neither session enables ADD-PATH.
plugin { internal rs { use bgp-rs; } }
bgp {
	peer source {
		connection {
			remote { ip 172.30.0.10; connect false; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			rs-client true;
			capability { asn4 enable; extended-message disable; graceful-restart disable; }
			family {
				ipv4/unicast { prefix { maximum 100; } }
				ipv6/unicast { prefix { maximum 100; } }
			}
		}
		behavior { rs-fast-path enable; }
	}
	peer recipient {
		connection {
			remote { ip 172.30.0.11; connect false; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			rs-client true;
			capability { asn4 disable; extended-message disable; graceful-restart disable; }
			family {
				ipv4/unicast { prefix { maximum 100; } }
				ipv6/unicast { prefix { maximum 100; } }
			}
		}
		behavior { rs-fast-path enable; }
	}
}
