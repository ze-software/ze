# One path, two deliveries. GoBGP announces 10.99.0.0/24 while speaker1 is already
# established, so speaker1 gets the LIVE forward. speaker2 dials 45 seconds later,
# so the only way it can learn the path is Ze's peer-up replay from store. Both
# clients negotiated ADD-PATH and are configured identically, so the only difference
# between the two UPDATEs Ze emits is the rail that produced them, and the check
# compares the bytes.
#
# spec-fixit-bgp-egress-rail-divergence closed on that invariant. The Path Identifier
# generator is new code both rails reach by different routes, which is exactly the
# shape that broke it before.
plugin {
	internal rib {
		use bgp-rib;
	}
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# The source. It negotiates no ADD-PATH, so its paths arrive under identifier 0
	# and Ze mints its own for the two clients that did negotiate it.
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	# The two observers. Each DIALS Ze (connect false), which is what lets speaker2
	# join late. Identical session settings on purpose: same ASN, same family, same
	# ADD-PATH direction, so nothing but the rail can move the bytes.
	peer speaker1 {
		connection {
			remote { ip 172.30.0.10; connect false; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				add-path {
					direction send/receive;
				}
			}
		}
	}
	peer speaker2 {
		connection {
			remote { ip 172.30.0.11; connect false; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				add-path {
					direction send/receive;
				}
			}
		}
	}
}
