# Ze side of the bgp-bfd-strict-speaker interop scenario
# (spec-bgp-bfd-strict, draft-ietf-idr-bgp-bfd-strict-mode).
#
# This is the POSITIVE half: the peer DOES implement the draft. It advertises
# capability 74, so BfdStrictNegotiated is TRUE on both sides, and it answers
# BFD only after a silent window. Ze must hold this session in OpenSent for the
# whole window and establish once the BFD session is Up.
#
# The peer is the lab's own wire-level speaker rather than a shipping daemon,
# because no daemon this lab can run implements the draft: FRR 10.3.1 carries no
# BFD strict-mode capability, and the draft's Appendix A lists Junos, IOS-XR and
# Nokia. The negative half, against FRR, is bgp-bfd-strict-frr.
#
# hold-time 30 rather than the default: the BfdHoldTimer only ever runs when the
# NEGOTIATED BGP hold time is zero, and this session negotiates 90, so what
# bounds the wait here is the BGP hold timer. The leaf is set to show it parses.
bfd {
	enabled true;
	profile fast {
		detect-multiplier 3;
		desired-min-tx-us 300000;
		required-min-rx-us 300000;
	}
}

bgp {
	peer speaker {
		connection {
			remote {
				# connect false: the speaker DIALS ze, exactly as it does in
				# bgp-addpath-rail-agreement-speaker. Ze dialling back at an
				# address with no listener churns the peer through a new
				# Session every backoff, and the BFD subscriber is per peer
				# while the sub-state is per connection.
				ip 172.30.0.10;
				connect false;
			}
			local {
				ip 172.30.0.2;
			}
			bfd {
				enabled true;
				mode single-hop;
				profile fast;
				strict true;
				hold-time 30;
				hold-down 300;
			}
		}
		session {
			asn {
				local 65001;
				remote 65003;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
			}
		}
	}
}
