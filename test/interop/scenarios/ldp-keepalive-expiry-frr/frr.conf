frr defaults traditional
hostname frr-ldp-keepalive-expiry
log file /tmp/frr.log debugging
!
! Received LDP messages are logged with their Status name, which is how the
! checker reads the Notification ze sends when its KeepAlive Timer expires.
debug mpls ldp messages recv all
!
! FRR's transport address (172.30.0.3) is lower than ze's (172.30.0.250), so
! FRR plays the passive role and ze, which only plays the active one, dials.
mpls ldp
 router-id 172.30.0.3
 !
 address-family ipv4
  discovery transport-address 172.30.0.3
  interface eth0
 exit-address-family
!
