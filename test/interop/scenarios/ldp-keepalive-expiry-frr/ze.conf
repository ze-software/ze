# Ze side of the ldp-keepalive-expiry-frr interop scenario
# (spec-ldp-keepalive-expiry-notification, RFC 5036 Sections 2.5.4 and 3.5.1.2.3).
#
# Ze forms an LDP session with FRR ldpd over eth0, proposing a 3 s KeepAlive
# Time. The checker then rewrites the receive window ze advertises to zero in
# ze's container, so FRR can send no LDP PDU and ze's KeepAlive Timer expires
# while ze's own segments still reach FRR and are acknowledged; FRR must log the
# KeepAlive Timer Expired Notification ze sends before it closes.
#
# The transport address 172.30.0.250 is higher than FRR's, which makes ze the
# active LSR (RFC 5036 Section 2.5.2): ze plays only the active role. The
# checker adds it to eth0 before the session it waits for can be dialed.

ldp {
	lsr-id 172.30.0.2
	transport-address 172.30.0.250
	keepalive-time 3
	interfaces eth0
}
