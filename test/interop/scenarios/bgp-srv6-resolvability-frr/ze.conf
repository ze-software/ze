# bgp-srv6-resolvability-frr -- RFC 9252 Section 5 SRv6 Service SID
# resolvability before BGP best-path selection against FRR.
#
# FRR (172.30.0.3, iBGP AS 65001) exports IPv6 VPN 2001:db8:9252:1::/64 under
# RD 65001:1 with an SRv6 Service SID from LOC1 (fc00:0:1::/48), plus an
# independent IPv4 unicast control 10.92.52.0/24. Ze resolves FRR's BGP
# next-hop (fd00:1e:0::/64 via eth0) from boot so only the SRv6 Service SID
# locator fc00:0:1::/48 is unreachable initially. Ze must exclude the VPN
# route from best-path and withhold it from frr-sink (172.30.0.15, eBGP AS
# 65002) while propagating the control; once FRR advertises fc00:0:1::/48 over
# ipv6/unicast, Ze elects and advertises 2001:db8:9252:1::/64 to frr-sink.
bus {
	endpoint rib {
		internal rib;
	}
	endpoint bgp-rib {
		internal bgp-rib;
	}
	endpoint static {
		internal static;
	}
}

connected {
}

static {
	table default {
		route fd00:1e:0::/64 {
			next {
				interface eth0 { }
			}
		}
	}
}

bgp {
	router-id 172.30.0.2;
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv6/unicast { prefix { maximum 10000; } }
				ipv6/mpls-vpn { prefix { maximum 10000; } }
			}
		}
	}
	peer frr-sink {
		connection {
			remote { ip 172.30.0.15; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			propagate-srv6-prefix-sid true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv6/mpls-vpn { prefix { maximum 10000; } }
			}
		}
	}
}
