frr defaults traditional
hostname frr-srv6-resolvability
log file /tmp/frr.log informational
!
! FRR source PE (AS 65001) exporting one IPv6 VPN route (RD 65001:1,
! 2001:db8:9252:1::/64) with an SRv6 L3 Service SID allocated from LOC1
! (fc00:0:1::/48) plus an independent non-SRv6 IPv4 unicast control
! (10.92.52.0/24). Initially Ze has no route reaching fc00:0:1::/48, so Ze
! MUST exclude the SRv6 VPN route before best-path selection and MUST NOT
! re-advertise it to frr-sink (RFC 9252 Section 5). Once the checker
! advertises fc00:0:1::/48 over ipv6 unicast from FRR, Ze resolves the SID,
! selects the retained VPN route without a new VPN UPDATE, and advertises it
! to frr-sink.
!
interface eth0
 ipv6 address fd00:1e:0::3/64
exit
!
segment-routing
 srv6
  locators
   locator LOC1
    prefix fc00:0:1::/48
    behavior usid
   !
  !
 !
!
route-map VPN-NH permit 10
 set ipv6 next-hop global fd00:1e:0::3
exit
!
router bgp 65001
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 update-source 172.30.0.3
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  network 10.92.52.0/24
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 172.30.0.2 activate
  neighbor 172.30.0.2 route-map VPN-NH out
  sid vpn export auto
  rd vpn export 65001:1
  rt vpn both 100:1
  export vpn
  network 2001:db8:9252:1::/64
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 172.30.0.2 activate
  neighbor 172.30.0.2 route-map VPN-NH out
 exit-address-family
 !
 segment-routing srv6
  locator LOC1
 !
!
