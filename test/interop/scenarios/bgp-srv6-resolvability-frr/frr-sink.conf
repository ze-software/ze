frr defaults traditional
hostname frr-srv6-resolvability-sink
log file /tmp/frr.log informational
!
! Downstream eBGP receiver (AS 65002). Must receive the non-SRv6 IPv4 unicast
! control 10.92.52.0/24 immediately, MUST NOT receive the SRv6 IPv6 VPN route
! 2001:db8:9252:1::/64 while its locator fc00:0:1::/48 is unreachable on Ze,
! and MUST receive 2001:db8:9252:1::/64 once Ze learns fc00:0:1::/48.
!
interface eth0
 ipv6 address fd00:1e:0::15/64
exit
!
router bgp 65002
 bgp router-id 172.30.0.15
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 update-source 172.30.0.15
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 172.30.0.2 activate
 exit-address-family
!
