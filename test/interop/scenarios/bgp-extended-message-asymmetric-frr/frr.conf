frr defaults traditional
hostname extended-message-frr
log file /tmp/frr.log informational
!
! Native producer; a separate FRR consumer has its own router ID.
! The relays preserve those IDs and every UPDATE byte.
! The checker originates the baseline only after both native sessions establish.
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 172.30.0.10 remote-as 65001
 neighbor 172.30.0.10 passive
 neighbor 172.30.0.10 timers 3 9
 address-family ipv4 unicast
  neighbor 172.30.0.10 activate
  neighbor 172.30.0.10 prefix-list SOURCE out
 exit-address-family
!
ip prefix-list SOURCE seq 10 permit 10.86.0.0/16 ge 24 le 24
!
! 400 distinct large communities are 4800 wire octets in one indivisible path
! attribute. FRR must encode an extended UPDATE, not batch many short UPDATEs.
! Keep each command below FRR VTY_BUFSIZ (4096); each sequence has one set.
! Continue through additive sequences to retain all 400 values on one route.
route-map EXTENDED permit 10
