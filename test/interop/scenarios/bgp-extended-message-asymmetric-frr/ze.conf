# RFC 8654 Sections 4-6. FRR produces and decodes the UPDATEs.
# Sidecars rewrite only capability 6 in OPENs, never UPDATE or KEEPALIVE.
# The original Ze OPEN (not the rewritten FRR view) determines local permission.
plugin { internal rs { use bgp-rs; } }
bgp {
	peer source {
		connection {
			remote { ip 172.30.0.10; connect false; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			next-hop self;
			capability { extended-message enable; graceful-restart disable; }
			family { ipv4/unicast { prefix { maximum 100; } } }
		}
		timer { receive-hold-time 9; }
		behavior { rs-fast-path enable; }
	}
	peer sink {
		connection {
			remote { ip 172.30.0.11; connect false; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			next-hop self;
			capability { extended-message disable; graceful-restart disable; }
			family { ipv4/unicast { prefix { maximum 100; } } }
		}
		timer { receive-hold-time 9; }
		behavior { rs-fast-path enable; }
	}
}
