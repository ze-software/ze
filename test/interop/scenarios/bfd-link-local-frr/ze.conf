# Ze side of the bfd-link-local-frr interop scenario
# (spec-bfd-link-local-peer-zone, AC-9).
#
# A BFD-plugin-pinned single-hop session to FRR's link-local on eth0, with no
# client protocol: the bfd root alone starts the plugin and owns the session.
# Both link-locals are assigned to each container's eth0 before its daemon
# starts, because this file and frr.conf carry their placeholders
# (prepareScenario). bind-v6 opens the IPv6 socket the session needs.
bfd {
	enabled true;
	bind-v6 true;
	profile fast {
		detect-multiplier 3;
		desired-min-tx-us 300000;
		required-min-rx-us 300000;
	}
	single-hop-session @FRR_LINK_LOCAL@ {
		interface eth0;
		local @ZE_LINK_LOCAL@;
		profile fast;
	}
}
