frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! FRR's own link-local, @FRR_LINK_LOCAL@, is assigned to eth0 before bfdd
! starts, and Ze's session names it as its peer. local-address is required:
! without it bfdd 10.3.1 sends from eth0's global address (fd00:...::3), and
! neither side then matches the other's packets to its session (smoke on
! 2026-10-15: FRR stayed down with remote-id 0 for 30s; Up in 1s with it).
bfd
 profile fast
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
 !
 peer @ZE_LINK_LOCAL@ local-address @FRR_LINK_LOCAL@ interface eth0
  profile fast
 exit
 !
exit
!
