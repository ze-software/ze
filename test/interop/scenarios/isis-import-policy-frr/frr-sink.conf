frr defaults traditional
hostname frr-isis-b
log file /tmp/frr.log informational
!
! FRR-B: the far side. It originates nothing and meets only Ze, on its own
! link (eth1, VLAN 102, 10.102.0.15/24, built by the harness before FRR
! starts). Every route it learns for 10.77.0.0/16 comes from an LSP FRR-A
! originated and Ze flooded on, including the one Ze's import chain hid from
! Ze's own RIB.
interface eth1
 ip router isis ZE
 isis circuit-type level-1-2
 isis network point-to-point
!
router isis ZE
 net 49.0001.0000.0000.0000.0015.00
 is-type level-1-2
 metric-style wide
!
