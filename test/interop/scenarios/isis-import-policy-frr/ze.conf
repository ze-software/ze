# Ze side of the isis-import-policy-frr interop scenario
# (spec-route-policy-0-umbrella AC-4).
#
# Ze sits between two FRRs, on two links the harness builds before ze starts
# (scenarioLinks in internal/le/interoplab/bgp/register_import_policy.go):
# eth1 (VLAN 101, 10.101.0.2/24) to FRR-A, which originates both prefixes, and
# eth2 (VLAN 102, 10.102.0.2/24) to FRR-B. The import chain rejects
# 10.77.1.0/24 as IS-IS installs it into the Loc-RIB. The prefix stays in Ze's
# LSDB (the chain never filters the protocol's own database), so Ze floods it
# on to FRR-B, while it is absent from Ze's `show rib` and kernel FIB, and
# `show rib candidates` lists it hidden by the `isis import` chain.
# 10.77.2.0/24 passes the same chain and is installed.

policy {
	prefix-list ISIS-HIDE-LIST {
		entry 10.77.1.0/24 { action accept; }
	}
	match ISIS-HIDE {
		action reject;
		prefix-list ISIS-HIDE-LIST;
	}
}

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1-l2
	filter {
		import {
			filters [ ISIS-HIDE ];
			final accept;
		}
	}
	interfaces {
		interface eth1 {
			metric 10
			level l1-l2
			circuit-type point-to-point
		}
		interface eth2 {
			metric 10
			level l1-l2
			circuit-type point-to-point
		}
	}
}
