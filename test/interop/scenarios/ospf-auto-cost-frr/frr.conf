frr defaults traditional
hostname frr-ospf-auto-cost
log file /tmp/frr.log informational
!
! FRR is the reader in this scenario. It forms a point-to-point OSPFv2 adjacency
! with Ze on the shared bridge and floods Ze's Router-LSA into its own database,
! where `show ip ospf database router` prints the metric Ze put on the link.
! FRR's own cost is left at its default; nothing here asserts on it.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
!
