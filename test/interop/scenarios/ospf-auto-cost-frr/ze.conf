# Ze side of the ospf-auto-cost-frr interop scenario
# (spec-ospf-auto-cost-reference-bandwidth).
#
# eth0 sets NO `cost`, so Ze prices it by the auto-cost convention:
# `reference-bandwidth` divided by the speed of the link. eth0 is a Docker veth
# and the veth driver declares 10 Gbit/s, so the kernel reports 10000 Mbit/s and
# 470000 / 10000 = 47. FRR reads that 47 out of Ze's Router-LSA, which is the
# only place an outside implementation can see what Ze decided.
#
# 470000 is deliberately not a round multiple of anything else in the lab: 47 is
# a number no default produces, so the assertion cannot pass by coincidence.
# Before auto-cost existed Ze advertised 1 for every interface with no `cost`.

ospf {
	router-id 172.30.0.2
	reference-bandwidth 470000
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}

# Retain NSM event counters so a recovered adjacency cannot hide a reload reset.
telemetry {
	prometheus {
		enabled true
		netdata {
			enabled false
		}
	}
}
