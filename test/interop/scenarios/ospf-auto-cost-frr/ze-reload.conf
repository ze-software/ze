# Cost-only reload of ze.conf. The native checker installs this file and sends
# SIGHUP after FRR reaches Full, then restores ze.conf to return to auto-cost.
ospf {
	router-id 172.30.0.2
	reference-bandwidth 470000
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 17
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}

telemetry {
	prometheus {
		enabled true
		netdata {
			enabled false
		}
	}
}
