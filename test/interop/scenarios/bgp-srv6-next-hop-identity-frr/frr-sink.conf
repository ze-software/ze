frr defaults traditional
hostname srv6-identity-15
log file /tmp/frr.log informational
!
! Resolve the remote SRv6 globals through the real dual-stack source endpoint.
! This is underlay fixture configuration, not local SID allocation or transport proof.
ipv6 route 2001:db8:9252::/64 fd00:1e:0::9
ipv6 route 2001:db8::1/128 fd00:1e:0::9
router bgp 65003
 bgp router-id 172.30.0.15
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 172.30.0.11 remote-as 65001
 ! A, B and the SID are remote globals resolved through the fixture underlay.
 neighbor 172.30.0.11 disable-connected-check
 neighbor 172.30.0.11 passive
 neighbor 172.30.0.11 timers 3 9
 address-family ipv6 unicast
  neighbor 172.30.0.11 activate
 exit-address-family
!
