frr defaults traditional
hostname frr-attr-set-included-as-set
log file /tmp/frr.log informational
!
! FRR judges what ze relays. bgp_attr_parse hands code 128 to bgp_attr_unknown,
! which keeps an optional transitive attribute it does not know as transit, so
! FRR holds the route whatever the ATTR_SET carries. FRR prints nothing for a
! transit attribute, so the dump below records every UPDATE ze sends, octet for
! octet, and the check reads the ATTR_SET's included AS_SET out of it.
!
dump bgp updates /tmp/attr-set-included-as-set-updates.mrt
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
