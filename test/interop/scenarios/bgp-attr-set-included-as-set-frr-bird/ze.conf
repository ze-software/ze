# An AS_SET inside an ATTR_SET keeps the route; an AS 0 inside one withdraws
# it. Judged by FRR and BIRD on what ze relays.
#
#     INTEROP_SCENARIO=bgp-attr-set-included-as-set-frr-bird ./le test integration interop
#
# The raw injector announces 10.97.80.0/24 with an ATTR_SET (RFC 6368) whose
# included AS_PATH carries AS_SET {65009, 65010}, then 10.97.81.0/24 with an
# ATTR_SET whose included AS_PATH carries AS 0, then the control 10.97.82.0/24.
#
# RFC 9774 Section 3: "MUST use the "treat-as-withdraw" error handling behavior
# per [RFC7606] upon reception of BGP UPDATE messages containing AS_SETs or
# AS_CONFED_SETs in the AS_PATH or AS4_PATH [RFC6793]." It binds the UPDATE's
# own paths, and FRR (bgp_attr_unknown) and BIRD (bgp_decode_unknown) never look
# inside an ATTR_SET, so ze keeps the first route and relays it, ATTR_SET
# included, to both. The included paths still run their structural and AS 0
# checks (validateAttrSetDepth,
# internal/component/bgp/message/rfc7606_optional_attrs.go), so the AS 0 route
# is treated as withdrawn: RFC 6368 Section 5 makes an ATTR_SET whose "included
# attributes are malformed themselves" malformed.
#
# The relay shape (bgp-rs, adj-rib-in for the peer-up replay, bgp-rib as the
# store the checker reads) is the one bgp-rfc9774-as-set-frr uses.
plugin {
	internal rs {
		use bgp-rs;
	}
	internal rib {
		use bgp-rib;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	# Two octets, so the injector's frames are read exactly as inject.msg spells
	# them whatever the injector offers.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			capability {
				asn4 disable;
			}
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			receive [ update-received state ]
		}
		attach process rib {
			receive [ update-received state ]
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			send [ update ]
		}
	}
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			send [ update ]
		}
	}
}
