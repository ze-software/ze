# BIRD 3 judges what ze relays. bgp_attr_table has no entry for code 128, so
# bgp_register_attrs gives it the bgp_unknown_0x80 class and bgp_decode_unknown
# keeps it opaque (proto/bgp/attrs.c at v3.4.0): BIRD holds the route whatever
# the ATTR_SET carries.
log stderr all;
router id 172.30.0.4;

protocol device {
}

protocol bgp ze_peer {
	local 172.30.0.4 as 65003;
	neighbor 172.30.0.2 as 65001;
	ipv4 {
		import all;
		export none;
	};
}
