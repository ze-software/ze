# `bgp update-delay` observed by a second implementation.
#
# TWO peers are configured and only one of them exists. Convergence can never be
# reached, so the hold can end only on its outer bound, and FRR is the witness:
# it reaches Established while ze holds, and receives the route only after the
# hold releases.
bgp {
	router-id 172.30.0.2;

	session {
		asn { local 65001; }
	}

	# 90 seconds, not the smallest number that works. The checker waits up to 30s
	# for FRR to reach Established and then asserts the prefix is ABSENT, so the
	# hold has to outlast that wait by a clear margin: a hold that released first
	# would redden the run for a reason that has nothing to do with the product
	# (internal/le/interoplab/bgp/checkers.go, bgp-update-delay-frr).
	update-delay {
		max-delay 90
	}

	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		update {
			attribute {
				origin igp
				next-hop 172.30.0.2
			}
			nlri {
				ipv4/unicast add 10.10.0.0/24
			}
		}
	}

	# The peer nothing answers for. It is configured, so the hold counts it among
	# the peers it waits for, and no daemon runs on 172.30.0.9.
	peer peer2 {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		timer { connect-retry 120; }
	}
}
