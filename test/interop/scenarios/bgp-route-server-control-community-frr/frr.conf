frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
ip route 10.99.0.0/24 Null0
ip route 10.98.0.0/24 Null0
!
! 10.99.0.0/24 asks the route server (AS 65001) to prepend its AS once toward
! BIRD (AS 65003): the large control community RS:101:peer-as.
! 10.98.0.0/24 asks for the same prepend toward AS 65099, a client that does
! not exist here, so BIRD must receive its path unchanged. Both carry
! 65002:1:1, a value in FRR's own namespace the route server must leave alone.
route-map RS-PREPEND-BIRD permit 10
 set large-community 65001:101:65003 65002:1:1
exit
!
route-map RS-PREPEND-OTHER permit 10
 set large-community 65001:101:65099 65002:1:1
exit
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  network 10.99.0.0/24 route-map RS-PREPEND-BIRD
  network 10.98.0.0/24 route-map RS-PREPEND-OTHER
  neighbor 172.30.0.2 activate
  neighbor 172.30.0.2 send-community large
 exit-address-family
!
