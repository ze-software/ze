frr defaults traditional
hostname frr-rfc9774-as-set
log file /tmp/frr.log informational
!
! FRR IS THE JUDGE OF BOTH HALVES OF RFC 9774 SECTION 3. It peers with ze over
! plain eBGP and accepts an AS_SET: `no bgp reject-as-sets` is stated rather
! than left to the default, because FRR later turned the knob on by default and
! a judge that refuses every set would hold neither set prefix whatever ze did.
! With the knob off, an AS_SET route that reaches FRR stays in its table, so the
! absence of both set prefixes is ze's doing.
!
! enforce-first-as stays on: ze relays as a plain eBGP speaker and prepends
! 65001, which is what the check demands.
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 no bgp reject-as-sets
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
