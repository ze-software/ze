# RFC 9774 Section 3, both halves, judged by FRR.
#
#     INTEROP_SCENARIO=bgp-rfc9774-as-set-frr ./le test integration interop
#
# RFC 9774 Section 3: "BGP speakers: MUST NOT advertise BGP UPDATE messages
# containing AS_SETs or AS_CONFED_SETs, and MUST use the "treat-as-withdraw"
# error handling behavior per [RFC7606] upon reception of BGP UPDATE messages
# containing AS_SETs or AS_CONFED_SETs in the AS_PATH or AS4_PATH [RFC6793]."
#
# RECEIVE HALF. The raw injector announces 10.97.74.0/24 with AS_PATH
# [65004 {65005,65006}], then the control 10.97.75.0/24 with [65004]. ze treats
# the first as withdrawn (validateASPath, internal/component/bgp/message/rfc7606.go),
# so neither its own RIB nor FRR holds it, and relays the control to FRR.
#
# SEND HALF. ze originates two static routes toward FRR: 10.97.76.0/24 with a
# configured raw AS_PATH holding an AS_SET, then the clean 10.97.77.0/24. The
# send guard (writeUpdateBody, internal/component/bgp/reactor/session_write.go)
# writes the first as a withdrawal, so FRR holds only the clean one. Ze sends
# single-route static UPDATEs in prefix order (groupRoutesByAttributes,
# reactor/peer_static_routes.go), so the set route's lower prefix makes FRR
# holding the clean route proof that ze has already written the set route's
# UPDATE.
#
# WHAT MAKES IT DISCRIMINATE. The send guard alone keeps a relayed set off FRR,
# so FRR's table cannot see the receive half. ze's own `show bgp rib` and its
# treat-as-withdraw log line are what break when the receive scan is reverted;
# FRR's table is what breaks when the send guard is reverted. FRR runs with
# `no bgp reject-as-sets`, so a set that reaches it stays in its table.
#
# The relay shape (bgp-rs, adj-rib-in for the peer-up replay, bgp-rib as the
# store the checker reads) is the one as-path-mixed-width-relay-frr measured.
plugin {
	internal rs {
		use bgp-rs;
	}
	internal rib {
		use bgp-rib;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	# Two octets, so the injector's frames are read exactly as inject.msg spells
	# them whatever the injector offers.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			capability {
				asn4 disable;
			}
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			receive [ update-received state ]
		}
		attach process rib {
			receive [ update-received state ]
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# The set route: the raw attribute is a second AS_PATH holding
		# AS_SET {65010, 65011} in four-octet form (this session negotiates
		# four octets), written beside ze's own typed AS_PATH.
		#
		# THE MED KEEPS IT IN ITS OWN UPDATE. The static grouping key
		# (routeGroupKey, reactor/peer_static_routes.go) omits raw attributes,
		# so without a typed difference both routes leave in one UPDATE and
		# the guard withdraws the clean twin with it (measured 2026-10-19,
		# plan/journal/key-omits-a-fact-the-builder-uses.md).
		update {
			attribute {
				origin igp;
				med 1;
				next-hop 172.30.0.2;
				attribute "0x02 0x40 0x01020000FDF20000FDF3";
			}
			nlri {
				ipv4/unicast add 10.97.76.0/24;
			}
		}
		# The clean twin, written after the set route.
		update {
			attribute {
				origin igp;
				next-hop 172.30.0.2;
			}
			nlri {
				ipv4/unicast add 10.97.77.0/24;
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			send [ update ]
		}
	}
}
