# Ze side of the isis-per-level-hello-frr interop scenario
# (spec-isis-per-level-hello-timers).
#
# Ze and FRR sit on the shared Docker bridge (eth0) as a broadcast LAN segment,
# both at level-1-2 in area 49.0001, so each side forms TWO adjacencies over one
# circuit: one at Level-1 and one at Level-2.
#
# eth0 carries a circuit-wide hello-interval of 10 and hold-multiplier of 3, and
# a DIFFERENT pair under each level container. The three pairs give three
# distinct holding times, so the holding time FRR records for each adjacency
# says which pair Ze applied:
#
#   circuit-wide   10 * 3 =  30 seconds  (what Ze advertised at both levels
#                                         before the per-level leaves were read)
#   level-1         3 * 3 =   9 seconds
#   level-2        30 * 4 = 120 seconds
#
# FRR is an independent decoder of the Holding Time field of each LAN IIH, and
# it holds the two adjacencies separately, so it reads back one number per
# level. Ze also sends the Level-1 IIH every 3 seconds against a 9-second
# holding time, which is what keeps the Level-1 adjacency Up: a circuit still
# sending one IIH every 10 seconds would let it expire.

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1-l2
	hostname ze-perlevel
	interfaces {
		interface eth0 {
			metric 10
			level l1-l2
			circuit-type broadcast
			hello-interval 10
			hold-multiplier 3
			level-1 {
				hello-interval 3
				hold-multiplier 3
			}
			level-2 {
				hello-interval 30
				hold-multiplier 4
			}
		}
		interface lo {
			passive true
		}
	}
}
