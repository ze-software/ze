frr defaults traditional
hostname frr-isis-perlevel
log file /tmp/frr.log informational
!
! IS-IS broadcast LAN on the shared bridge to Ze (eth0), level-1-2 in the same
! area (49.0001), so FRR forms one adjacency with Ze at each level and records
! the Holding Time Ze advertised in that level's IIH separately. FRR keeps its
! own default timers: the scenario reads what Ze sent, never what FRR sends.
interface eth0
 ip router isis ZE
 isis circuit-type level-1-2
 isis network broadcast
!
interface lo
 ip router isis ZE
 isis passive
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
!
