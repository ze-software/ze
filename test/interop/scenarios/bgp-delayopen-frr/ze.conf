# Native TCP peers: the checker releases administrative holds only after capture.
# FRR .3 waits longer than Ze (expiry); FRR .15 sends first (early OPEN).
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	router-id 172.30.0.2;
	session { asn { local 65001; } }
	peer expiry {
		shutdown { }
		connection {
			remote { ip 172.30.0.3; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family { ipv4/unicast { } }
		}
		timer { delay-open 5; connect-retry 1; }
	}
	peer early {
		shutdown { }
		connection {
			remote { ip 172.30.0.15; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family { ipv4/unicast { } }
		}
		timer { delay-open 20; connect-retry 1; }
	}
}
