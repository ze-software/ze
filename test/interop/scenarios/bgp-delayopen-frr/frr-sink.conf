frr defaults traditional
hostname frr-delayopen-early
log file /tmp/frr.log informational
!
router bgp 65002
 bgp router-id 172.30.0.15
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 shutdown
 neighbor 172.30.0.2 timers connect 1
 neighbor 172.30.0.2 timers delayopen 1
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
