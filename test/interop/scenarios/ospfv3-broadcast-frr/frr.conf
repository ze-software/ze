frr defaults traditional
hostname frr-ospf6-bcast
log file /tmp/frr.log informational
!
! OSPFv3 (RFC 5340) broadcast LAN on the shared bridge to Ze (eth0). FRR keeps the default
! broadcast network type with a LOWER priority than Ze, so Ze is elected DR and originates
! the Network-LSA (Type 0x2002); FRR becomes BDR and the adjacency reaches Full.
interface eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 priority 1
!
router ospf6
 ospf6 router-id 172.30.0.3
!
