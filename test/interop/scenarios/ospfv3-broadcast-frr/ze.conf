# Ze side of the ospfv3-broadcast-frr interop scenario (spec-ospf-af-unify).
#
# Ze and FRR ospf6d sit on the shared Docker bridge (eth0) as an OSPFv3 broadcast LAN.
# A DR/BDR is elected over the v6 Hello (DR/BDR carried as Router IDs, RFC 5340). Ze runs
# with a HIGHER OSPF priority so it is elected DR and originates the OSPFv3 Network-LSA
# (Type 0x2002) for the segment; every router on the segment carries a transit link in its
# Router-LSA.

ospf {
	router-id 172.30.0.2
	address-family ipv6 {
		areas {
			area 0.0.0.0 {
				area-type normal
			}
		}
		interfaces {
			interface eth0 {
				area 0.0.0.0
				network-type broadcast
				priority 100
				cost 10
			}
		}
	}
}
