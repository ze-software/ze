# Ze side of the bgp-bfd-strict-preup-speaker interop scenario
# (spec-bgp-bfd-strict, draft-ietf-idr-bgp-bfd-strict-mode).
#
# The SHARED-SESSION path against a second implementation: one BFD session
# serving both a top-level pinned entry and a strict BGP peer.
#
# It does NOT reach the pre-up condition, and the checker comment records the
# measurement that says so. The peer and the pinned entry are created by one
# daemon start, so the peer subscribes before the session can come Up.
#
# The top-level `single-hop-session` below is a pinned entry to the same
# neighbor the strict peer names. The BFD engine creates it at configure time,
# the speaker answers BFD immediately (--bfd-delay 0), and the speaker does not
# dial BGP until --connect-delay 25. So by the time the peer runs, the session
# is Up and its EnsureSession finds the existing key: it only bumps a refcount,
# and Subscribe is the ONLY thing that can tell the peer what state it joined.
#
# What the `local` leaf below buys is the collision itself: without it the two
# requests build different keys and the engine runs two sessions to one
# neighbor, each sending its own packets.
bfd {
	enabled true;
	profile fast {
		detect-multiplier 3;
		desired-min-tx-us 300000;
		required-min-rx-us 300000;
	}
	single-hop-session 172.30.0.10 {
		# local MUST match the peer's `connection local ip`. api.SessionRequest.Key
		# includes Local, so a pinned entry that omits it builds a DIFFERENT key
		# and the engine holds TWO sessions to the same neighbor -- which is what
		# this scenario is here to avoid, since the peer would then learn Up from
		# a transition it was already subscribed for, on the ordinary path.
		local 172.30.0.2;
		profile fast;
	}
}

bgp {
	peer speaker {
		connection {
			remote {
				# connect false: the speaker dials ze, as in the sibling scenario.
				ip 172.30.0.10;
				connect false;
			}
			local {
				ip 172.30.0.2;
			}
			bfd {
				enabled true;
				mode single-hop;
				profile fast;
				strict true;
				hold-time 30;
				hold-down 300;
			}
		}
		session {
			asn {
				local 65001;
				remote 65003;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
			}
		}
	}
}
