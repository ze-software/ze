# Ze side of the ldp-init-unknown-tlv-frr interop scenario
# (spec-refuse-instead-of-defaulting, RFC 5036 Section 3.3).
#
# Ze forms an LDP session with FRR ldpd over eth0. Before ze can dial, the
# checker installs an nft rule in ze's container that rewrites the type of the
# first Capability TLV in FRR's Initialization to 0x3f00, a type no RFC
# registers, with the U bit clear. Ze must answer FRR with an Unknown TLV
# Notification and ignore the whole Initialization, so the session never
# becomes OPERATIONAL while the rule runs. With the rule removed it must.
#
# The transport address 172.30.0.250 is higher than FRR's, which makes ze the
# active LSR (RFC 5036 Section 2.5.2), so FRR's Initialization is FRR's first
# data on the connection ze dialed and starts at the segment's first octet.
# The checker adds the address to eth0 after the rule is in place.

ldp {
	lsr-id 172.30.0.2
	transport-address 172.30.0.250
	interfaces eth0
}
