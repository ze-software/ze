# StayRTR supplies VRPs; FRR announces once and BIRD observes live policy reloads.
# Only action/invalid differs in ze-reload.conf. Peer configuration stays fixed.
# `port 8282` is StayRTR's default RTR port, not Ze's 323 plain-TCP default.
bus {
	endpoint bgp-rpki {
		internal bgp-rpki;
	}
	endpoint bgp-adj-rib-in {
		internal bgp-adj-rib-in;
		send {
			message bgp:update {
				to none;
			}
		}
	}
	endpoint bgp-rib {
		internal bgp-rib;
	}
}
connected {
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	rpki {
		cache-server 172.30.0.12 {
			trusted-network true;
			port 8282;
		}
		validation-timeout 5;
		action {
			invalid reject;
			not-found accept;
		}
	}
	group reload-peers {
		session {
			asn { local 65000; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart { short-lived { restart-time 120; } }
			}
		}
		peer frr-source {
			connection {
				remote { ip 172.30.0.3; }
				local { ip 172.30.0.2; }
			}
			session { asn { remote 65001; } }
		}
		peer bird-sink {
			connection {
				remote { ip 172.30.0.4; }
				local { ip 172.30.0.2; }
			}
			session { asn { remote 65002; } }
		}
	}
}
