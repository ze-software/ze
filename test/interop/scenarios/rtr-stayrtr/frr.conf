frr defaults traditional
hostname frr-rpki-reload
log file /tmp/frr.log informational
!
! The first route is Invalid (wrong origin); the second is the Valid control.
ip route 9.58.0.0/24 Null0
ip route 10.58.0.0/16 Null0
!
router bgp 65001
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 bgp graceful-restart
 neighbor 172.30.0.2 remote-as 65000
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  redistribute static
 exit-address-family
!
