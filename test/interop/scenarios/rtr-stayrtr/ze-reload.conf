# StayRTR supplies VRPs; FRR announces once and BIRD observes live policy reloads.
# Only action/invalid differs in ze-reload.conf. Peer configuration stays fixed.
# `port 8282` is StayRTR's default RTR port, not Ze's 323 plain-TCP default.
plugin {
	internal bgp-rpki {
		use bgp-rpki;
	}
	internal bgp-adj-rib-in {
		use bgp-adj-rib-in;
	}
	internal bgp-rib {
		use bgp-rib;
	}
	internal rs {
		use bgp-rs;
	}
}
bgp {
	rpki {
		cache-server 172.30.0.12 {
			trusted-network true;
			port 8282;
		}
		validation-timeout 5;
		action {
			invalid accept;
			not-found accept;
		}
	}
	group reload-peers {
		session {
			asn { local 65000; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart { restart-time 120; }
			}
		}
		attach process bgp-rpki {
			receive [ update-received state ];
		}
		attach process bgp-adj-rib-in {
			receive [ update-received state ];
			send [ update ];
		}
		attach process bgp-rib {
			receive [ update state refresh ];
			send [ update ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		peer frr-source {
			connection {
				remote { ip 172.30.0.3; }
				local { ip 172.30.0.2; }
			}
			session { asn { remote 65001; } }
		}
		peer bird-sink {
			connection {
				remote { ip 172.30.0.4; }
				local { ip 172.30.0.2; }
			}
			session { asn { remote 65002; } }
		}
	}
}
