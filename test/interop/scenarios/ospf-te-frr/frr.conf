frr defaults traditional
hostname frr-ospf-te
log file /tmp/frr.log informational
!
! OSPFv2 point-to-point on the shared L2 bridge to Ze (eth0), area 0.0.0.0. FRR enables
! mpls-te (RFC 3630 Traffic Engineering) and per-link TE parameters (link-params), so it
! originates a Router-Address TE LSA plus a Link TE LSA carrying bandwidth / admin-group /
! TE metric. Ze must parse these into its TED and FRR must accept Ze's TE LSAs.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
 link-params
  enable
  metric 100
  max-bw 1.25e9
  max-rsv-bw 1e9
  unrsv-bw 0 1e9
  admin-grp 0x5
 exit-link-params
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
 mpls-te on
 mpls-te router-address 172.30.0.3
!
