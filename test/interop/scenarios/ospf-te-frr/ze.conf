# Ze side of the ospf-te-frr interop scenario (spec-ospf-ext-2, RFC 3630).
#
# Ze enables the opaque-LSA capability and a per-interface traffic-engineering block on the
# point-to-point OSPFv2 adjacency with FRR (eth0, area 0.0.0.0). It originates a
# Router-Address TE LSA (from `router-address`) plus a Link TE LSA carrying the configured
# bandwidth / admin-group / TE metric, and parses FRR's mpls-te TE LSAs into its TED
# (visible via `show ospf te-database`). The TE metric is independent of the OSPF cost.

ospf {
	router-id 172.30.0.2
	opaque true
	router-address 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
			traffic-engineering {
				enable true
				te-metric 100
				max-bandwidth 1250000000
				max-reservable-bandwidth 1000000000
				admin-group 5
			}
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
