frr defaults traditional
hostname frr-rfc8212-no-policy
log file /tmp/frr.log informational
!
! The session Ze holds no policy for. FRR keeps its own RFC 8212 default on and
! gives Ze explicit route-maps, so FRR exchanges in both directions: whatever
! is missing across this session before Ze's reload is Ze's verdict.
!
ip route 10.81.1.0/24 Null0
!
route-map ZE-ALLOW permit 10
!
router bgp 65002
 bgp router-id 172.30.0.3
 bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65000
 address-family ipv4 unicast
  network 10.81.1.0/24
  neighbor 172.30.0.2 activate
  neighbor 172.30.0.2 route-map ZE-ALLOW in
  neighbor 172.30.0.2 route-map ZE-ALLOW out
 exit-address-family
!
