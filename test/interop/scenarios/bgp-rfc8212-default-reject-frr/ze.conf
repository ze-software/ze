# RFC 8212 default reject, judged by real FRR. The FRR session has NO policy in
# this generation: Ze must install none of FRR's routes and send FRR none of its
# own, while the control session to the FRR sink exchanges. The checker then
# reloads ze-reload.conf.
plugin {
    internal adj-rib-in { use bgp-adj-rib-in; }
    internal rs { use bgp-rs; }
    internal rib { use bgp-rib; }
}

bgp {
    router-id 172.30.0.2;
    # RFC 8212 Section 2: this session has no import and no export policy, so
    # Ze refuses both directions. Deliberate: it is the behaviour under test.
    peer frr {
        connection { remote { ip 172.30.0.3; } local { ip 172.30.0.2; } }
        session {
            asn { local 65000; remote 65002; }
            router-id 172.30.0.2;
            next-hop self;
            family { ipv4/unicast { prefix { maximum 10000; } } }
            capability { graceful-restart disable; route-refresh enable; }
        }
        update {
            attribute {
                origin igp
                next-hop 172.30.0.2
            }
            nlri {
                ipv4/unicast add 10.81.0.0/24
            }
        }
        attach process rs { receive [ update-received state open-received refresh ]; send [ update ]; }
        attach process adj-rib-in { receive [ update-received state ]; send [ update ]; }
        attach process rib { receive [ update state refresh ]; }
    }
    # The control session: an explicit policy at the peer, so its routes cross
    # in both directions in every generation.
    peer sink {
        connection { remote { ip 172.30.0.15; } local { ip 172.30.0.2; } }
        session {
            asn { local 65000; remote 65015; }
            router-id 172.30.0.2;
            next-hop self;
            family { ipv4/unicast { prefix { maximum 10000; } } }
            capability { graceful-restart disable; }
        }
        filter {
            import { final accept; }
            export { final accept; }
        }
        update {
            attribute {
                origin igp
                next-hop 172.30.0.2
            }
            nlri {
                ipv4/unicast add 10.81.0.0/24
            }
        }
        attach process rs { receive [ update-received state open-received refresh ]; send [ update ]; }
        attach process adj-rib-in { receive [ update-received state ]; send [ update ]; }
        attach process rib { receive [ update state refresh ]; }
    }
}
