frr defaults traditional
hostname frr-rfc8212-control
log file /tmp/frr.log informational
!
! The control session: Ze holds an explicit import and export policy for this
! peer, so its routes cross while the policy-less session's routes do not.
!
ip route 10.81.15.0/24 Null0
!
route-map ZE-ALLOW permit 10
!
router bgp 65015
 bgp router-id 172.30.0.15
 bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65000
 address-family ipv4 unicast
  network 10.81.15.0/24
  neighbor 172.30.0.2 activate
  neighbor 172.30.0.2 route-map ZE-ALLOW in
  neighbor 172.30.0.2 route-map ZE-ALLOW out
 exit-address-family
!
