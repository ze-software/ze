# RFC 8212 default reject, second generation: the same peers plus an explicit
# bgp-level import and export policy. FRR's routes must now reach Ze and Ze's
# must reach FRR, and FRR's session must not be reset.
plugin {
    internal adj-rib-in { use bgp-adj-rib-in; }
    internal rs { use bgp-rs; }
    internal rib { use bgp-rib; }
}

bgp {
    # RFC 8212 Section 2: the explicit policy every peer without its own now
    # inherits, in both directions.
    filter {
        import { final accept; }
        export { final accept; }
    }
    router-id 172.30.0.2;
    peer frr {
        connection { remote { ip 172.30.0.3; } local { ip 172.30.0.2; } }
        session {
            asn { local 65000; remote 65002; }
            router-id 172.30.0.2;
            next-hop self;
            family { ipv4/unicast { prefix { maximum 10000; } } }
            capability { graceful-restart disable; }
        }
        update {
            attribute {
                origin igp
                next-hop 172.30.0.2
            }
            nlri {
                ipv4/unicast add 10.81.0.0/24
            }
        }
        attach process rs { receive [ update-received state open-received refresh ]; send [ update ]; }
        attach process adj-rib-in { receive [ update-received state ]; send [ update ]; }
        attach process rib { receive [ update state refresh ]; }
    }
    peer sink {
        connection { remote { ip 172.30.0.15; } local { ip 172.30.0.2; } }
        session {
            asn { local 65000; remote 65015; }
            router-id 172.30.0.2;
            next-hop self;
            family { ipv4/unicast { prefix { maximum 10000; } } }
            capability { graceful-restart disable; }
        }
        filter {
            import { final accept; }
            export { final accept; }
        }
        update {
            attribute {
                origin igp
                next-hop 172.30.0.2
            }
            nlri {
                ipv4/unicast add 10.81.0.0/24
            }
        }
        attach process rs { receive [ update-received state open-received refresh ]; send [ update ]; }
        attach process adj-rib-in { receive [ update-received state ]; send [ update ]; }
        attach process rib { receive [ update state refresh ]; }
    }
}
