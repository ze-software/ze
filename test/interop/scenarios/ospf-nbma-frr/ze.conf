# Ze side of the ospf-nbma-frr interop scenario (spec-ospf-ext-8, IPv4 NBMA).
#
# Ze treats eth0 as an OSPFv2 non-broadcast (NBMA) interface: it discovers FRR
# only through the static nbma-neighbor list, unicasts Hellos to it, elects a
# DR/BDR (RFC 2328 sec 9.4), and the DR originates the Network-LSA. Both nodes are
# in area 0.0.0.0.

ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type nbma
			cost 10
			poll-interval 20
			nbma-neighbor 172.30.0.3 {
				priority 1
			}
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
