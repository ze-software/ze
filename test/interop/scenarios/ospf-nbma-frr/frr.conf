frr defaults traditional
hostname frr-ospf-nbma
log file /tmp/frr.log informational
!
! OSPFv2 non-broadcast (NBMA) on the shared L2 bridge to Ze (eth0). FRR discovers
! Ze only through the static neighbor statement, unicasts Hellos to it, and a
! DR/BDR is elected over the two eligible routers; the DR originates the
! Network-LSA. Same area 0.0.0.0.
interface eth0
 ip ospf network non-broadcast
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 neighbor 172.30.0.2
 passive-interface lo
!
