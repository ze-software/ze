# The internal scenario's declarations cross real TLS connect-back here.
bus {
	endpoint bgp-role {
		internal bgp-role;
		process separate;
	}
	hub {
		server local {
			ip 127.0.0.1;
			port 0;
			secret role-reload-frr-forked-secret-000001;
		}
	}
}
bgp {
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family { ipv4/unicast { prefix { maximum 10000; } } }
		}
	}
}
