frr defaults traditional
hostname frr-ospf-lfa
log file /tmp/frr.log informational
!
! Two point-to-point OSPFv2 links to Ze (eth0 cost 10, eth1 cost 20) plus a
! loopback FRR advertises into area 0, so Ze has a primary (eth0) and a
! link-protecting loop-free alternate (eth1) toward the loopback. FRR runs its own
! LFA so both sides compute the same backup (RFC 5286 interop).
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 ip ospf cost 10
!
interface eth1
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 ip ospf cost 20
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
 fast-reroute per-prefix
!
