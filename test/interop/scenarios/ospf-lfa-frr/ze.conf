# Ze side of the ospf-lfa-frr interop scenario (spec-ospf-ext-6).
#
# Ze and FRR share TWO point-to-point OSPFv2 links (eth0 cost 10, eth1 cost 20),
# so Ze reaches FRR's advertised loopback via a primary (eth0) with a
# link-protecting loop-free alternate (eth1, RFC 5286). fast-reroute is enabled in
# lfa mode: SPF pre-computes the eth1 backup next-hop and the FIB programs it as a
# link-down backup. The check cuts eth0 and asserts traffic to FRR's loopback
# survives via the pre-computed backup (no control-plane recompute needed).

ospf {
	router-id 172.30.0.2
	fast-reroute {
		enable true
		mode lfa
		node-protection true
	}
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			hello-interval 2
			dead-interval 8
			cost 10
		}
		interface eth1 {
			area 0.0.0.0
			network-type point-to-point
			hello-interval 2
			dead-interval 8
			cost 20
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
