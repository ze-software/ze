frr defaults traditional
hostname frr-med-remove
log file /tmp/frr.log informational
!
ip route 10.61.0.0/24 Null0
ip route 10.61.1.0/24 Null0
!
ip prefix-list MED_REMOVED seq 5 permit 10.61.0.0/24
ip prefix-list MED_KEPT seq 5 permit 10.61.1.0/24
!
route-map MED_ROUTES permit 10
 match ip address prefix-list MED_REMOVED
 set metric 100
 set community 65005:1
route-map MED_ROUTES permit 20
 match ip address prefix-list MED_KEPT
 set metric 100
!
router bgp 65005
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 send-community
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  redistribute static route-map MED_ROUTES
 exit-address-family
!