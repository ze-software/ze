# RFC 4271 Section 5.1.4's CONFIGURED removal, judged by a foreign RIB.
#
# Section 5.1.4: "A BGP speaker MUST implement a mechanism (based on local
# configuration) that allows the MULTI_EXIT_DISC attribute to be removed from a
# route." That mechanism is `del { med; }` on a modify policy, and
# this lab watches its effect from another daemon rather than from Ze's own view.
#
# THE DESTINATION IS INTERNAL, AND THAT IS WHAT MAKES THE ABSENCE MEAN
# SOMETHING. Ze's automatic Section 5.1.4 strip runs only toward a different
# neighboring AS (medPropagationAllowedTo, reactor/forward_med.go returns true
# for every non-eBGP destination), so on this iBGP session nothing removes
# attribute 4 unless an operator asked for it. Scenario 60 is the other half:
# there the destinations are external and the automatic rule is what is measured.
#
# THE IN-RUN POSITIVE CONTROL IS THE SECOND PREFIX. The policy carries a match
# container, so only the route tagged 65005:1 loses its metric. The untagged one
# travels the same session, the same route-server rail and the same policy chain
# and keeps Med 100. A blanket strip, a broken relay or a daemon that prints no
# attributes at all fails that half.
plugin {
	internal rs {
		use bgp-rs;
	}
	internal bgp-adj-rib-in {
		use bgp-adj-rib-in;
	}
	internal bgp-filter-modify {
		use bgp-filter-modify;
	}
}
bgp {
	policy {
		# The mechanism under test. `del { med; }` takes effect on an IMPORT chain
		# alone, because Section 5.1.4 requires the removal before Decision
		# Process phases 1 and 2 and the import chain is the only chain that
		# runs there.
		modify DROP-MED {
			del {
				med;
			}
			match {
				community [ 65005:1 ];
			}
		}
	}
	# The source peer, EXTERNAL to Ze (65005 -> 65001). FRR announces two static
	# routes, both carrying MULTI_EXIT_DISC 100. Only one route carries the
	# community the policy matches.
	peer frr-source {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65005; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		filter {
			import [ modify:DROP-MED ];
		}
		attach process bgp-adj-rib-in {
			receive [ update-received state ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
	# The destination, INTERNAL to Ze (65001 -> 65001). GoBGP keeps the RECEIVED
	# attribute list on the path and prints it verbatim, so it reports what
	# arrived rather than what it decided to keep.
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process bgp-adj-rib-in {
			send [ update ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
}
