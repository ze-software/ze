# Final-only export reconciliation, observed by real FRR 10.7.1.
# The injector sends the subject and permitted fence once after FRR's sentinel.
bus {
    endpoint bgp-adj-rib-in {
        internal bgp-adj-rib-in;
        send {
            message bgp:update {
                to none;
            }
        }
    }
    endpoint bgp-rib {
        internal bgp-rib;
    }
    endpoint bgp-filter-modify {
        internal bgp-filter-modify;
    }
    endpoint bgp-filter-path-asn {
        internal bgp-filter-path-asn;
    }
}
connected {
}
policy {
    modify IMPORT { set { community-add [ 65000:73 ]; } }
    modify EXPORT { set { med 77; } }
    reject-asn PASS { indirect [ 64512 ]; }
    match reject-asn-PASS { reject-asn PASS; }
}

bgp {
    # RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
    filter {
        import { final accept; }
        export { final accept; }
    }
    peer injector {
        connection { remote { ip 172.30.0.9; } local { ip 172.30.0.2; } }
        session {
            asn { local 65000; remote 65004; }
            router-id 172.30.0.2;
            family { ipv4/unicast { prefix { maximum 10000; } } }
            capability { graceful-restart disable; }
        }
        filter {
            import { filters [ modify:IMPORT ]; final accept; }
            export { filters [ next-hop:self ]; final accept; }
        }
    }
    peer frr {
        connection { remote { ip 172.30.0.3; } local { ip 172.30.0.2; } }
        session {
            asn { local 65000; remote 65002; }
            router-id 172.30.0.2;
            family { ipv4/unicast { prefix { maximum 10000; } } }
            capability { graceful-restart disable; }
        }
        filter { export { filters [ reject-asn-PASS modify:EXPORT next-hop:self ]; final reject; } }
    }
}
