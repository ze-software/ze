# Final-only export reconciliation, observed by real FRR 10.7.1.
# The injector sends the subject and permitted fence once after FRR's sentinel.
plugin {
    internal adj-rib-in { use bgp-adj-rib-in; }
    internal rs { use bgp-rs; }
    internal rib { use bgp-rib; }
    internal bgp-filter-modify { use bgp-filter-modify; }
    internal bgp-filter-path-asn { use bgp-filter-path-asn; }
}
policy {
    modify IMPORT { set { community-add [ 65000:73 ]; } }
    modify EXPORT { set { med 77; } }
    reject-asn PASS { indirect [ 64512 ]; }
}

bgp {
    peer injector {
        connection { remote { ip 172.30.0.9; } local { ip 172.30.0.2; } }
        session {
            asn { local 65000; remote 65004; }
            router-id 172.30.0.2;
            next-hop self;
            family { ipv4/unicast { prefix { maximum 10000; } } }
            capability { graceful-restart disable; }
        }
        filter { import { filters [ modify:IMPORT ]; final accept; } }
        attach process rs { receive [ update-received state open-received refresh ]; send [ update ]; }
        attach process adj-rib-in { receive [ update-received state ]; send [ update ]; }
        attach process rib { receive [ update state refresh ]; }
    }
    peer frr {
        connection { remote { ip 172.30.0.3; } local { ip 172.30.0.2; } }
        session {
            asn { local 65000; remote 65002; }
            router-id 172.30.0.2;
            next-hop self;
            family { ipv4/unicast { prefix { maximum 10000; } } }
            capability { graceful-restart disable; }
        }
        filter { export { filters [ bgp-filter-path-asn:PASS modify:EXPORT ]; final reject; } }
        attach process rs { receive [ update-received state open-received refresh ]; send [ update ]; }
        attach process adj-rib-in { receive [ update-received state ]; send [ update ]; }
        attach process rib { receive [ update state refresh ]; }
    }
}
