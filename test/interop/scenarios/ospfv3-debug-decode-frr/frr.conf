frr defaults traditional
hostname frr-ospfv3-debug-decode
log file /tmp/frr.log informational
!
! OSPFv3 (RFC 5340) P2P to Ze (eth0), area 0.0.0.0. FRR ospf6d originates its base v3
! LSAs (Router / Intra-Area-Prefix / Link) for Ze to receive and decode.
interface eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
!
router ospf6
 ospf6 router-id 172.30.0.3
!
