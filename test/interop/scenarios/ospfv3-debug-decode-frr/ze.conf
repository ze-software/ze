# Ze side of the ospfv3-debug-decode-frr interop scenario (spec-ospf-ext-14, RFC 5340).
#
# Ze runs the OSPFv3 (IPv6) family and forms a P2P OSPFv3 adjacency with FRR ospf6d. Ze
# receives FRR's base v3 LSAs (Router / Network / Intra-Area-Prefix / Link) and decodes
# them via `show ospf ipv6 database detail` with the scope-aware header.
ospf {
	router-id 172.30.0.2
	address-family ipv6 {
		areas { area 0.0.0.0 { area-type normal } }
		interfaces {
			interface eth0 { area 0.0.0.0 network-type point-to-point cost 10 }
		}
	}
}
