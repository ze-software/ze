# RFC 6608: actual FRR frames are held/replayed by the .10 relay.
bgp {
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer frr-relay {
		connection {
			remote { ip 172.30.0.10; connect false; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			capability { graceful-restart disable; }
			family { ipv4/unicast { prefix { maximum 100; } } }
		}
		timer { receive-hold-time 90; }
		update {
			attribute {
				origin igp;
				next-hop 172.30.0.2;
			}
			nlri { ipv4/unicast add 10.66.8.0/24; }
		}
	}
}
