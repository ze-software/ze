# The receive ceiling of draft-abraitis-idr-addpath-paths-limit against a
# sender that ignores it.
#
#     INTEROP_SCENARIO=bgp-paths-limit-receive-bird ./le test integration interop
#
# Section 3: "An implementation SHOULD provide a configuration knob to specify
# the maximum number of paths to accept from a sender."
#
# Ze advertises PATHS-LIMIT 2 for ipv4/unicast. BIRD 3 ignores capability 76
# and offers four paths of 10.70.0.0/24 (bird.conf). Ze must hold exactly two,
# count the two it refused in ze_bgp_paths_limit_refused_total, install
# 10.71.0.0/24, and keep the session up. FRR cannot be the sender: it caps its
# own ADD-PATH TX at the limit it received, so it never over-sends.
#
# WHAT MAKES IT DISCRIMINATE. Remove the receiveCeiling call from
# processValidatedMessage (internal/component/bgp/reactor/session_read.go) and
# Ze holds all four paths with nothing counted.
plugin {
	# The store `show bgp rib received` reads. Ze relays nothing here.
	internal rib {
		use bgp-rib;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				add-path {
					direction receive;
					family {
						ipv4/unicast { limit { receive 2; } }
					}
				}
			}
		}
		attach process rib {
			receive [ update-received state ]
		}
	}
}
# The refusal counter is read from `show metrics values`.
telemetry {
	prometheus {
		enabled true
		netdata {
			enabled false
		}
	}
}
