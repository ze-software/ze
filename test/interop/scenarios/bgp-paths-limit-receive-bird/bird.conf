# The over-sender for bgp-paths-limit-receive-bird. BIRD 3 has no PATHS-LIMIT
# (capability 76): bgp_read_capabilities (proto/bgp/packets.c) has no case for
# it, so the limit Ze advertises is ignored. With `add paths tx` BIRD sets
# ra_mode RA_ANY (proto/bgp/bgp.c) and exports every route the table holds for
# a prefix, one path identifier each.
#
# The master table holds one route per source protocol, so the four static
# protocols below give 10.70.0.0/24 four paths. Their attributes are identical
# once BIRD sets itself as the eBGP next hop, so BIRD may pack all four, and
# 10.71.0.0/24, into one UPDATE: the ceiling must then cut whole NLRIs out of a
# message whose other prefix still installs.
log stderr all;
router id 172.30.0.4;

protocol device {
}

protocol static paths_a {
	ipv4;
	route 10.70.0.0/24 blackhole;
	route 10.71.0.0/24 blackhole;
}

protocol static paths_b {
	ipv4;
	route 10.70.0.0/24 blackhole;
}

protocol static paths_c {
	ipv4;
	route 10.70.0.0/24 blackhole;
}

protocol static paths_d {
	ipv4;
	route 10.70.0.0/24 blackhole;
}

protocol bgp ze_peer {
	local 172.30.0.4 as 65003;
	neighbor 172.30.0.2 as 65001;
	ipv4 {
		import none;
		export all;
		add paths tx;
	};
}
