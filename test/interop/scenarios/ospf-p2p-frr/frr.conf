frr defaults traditional
hostname frr-ospf-p2p
log file /tmp/frr.log informational
!
! OSPFv2 point-to-point on the shared L2 bridge to Ze (eth0). Same area 0.0.0.0
! so the adjacency forms (no DR/BDR on a point-to-point link) and FRR learns the
! reachability Ze advertises. FRR also advertises its loopback so Ze learns a
! route back (bidirectional convergence, AC-15).
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
!
