# Ze side of the ospf-p2p-frr interop scenario (spec-ospf-13 AC-15).
#
# Ze forms a point-to-point OSPFv2 adjacency with FRR over the shared Docker
# bridge (eth0, a single L2 broadcast domain treated as point-to-point on both
# sides, so no DR/BDR election). Both nodes are in area 0.0.0.0; Ze advertises a
# passive loopback prefix so FRR installs an OSPF route (Ze -> FRR convergence),
# and learns FRR's prefix back (bidirectional convergence, AC-15).

ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
