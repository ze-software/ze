frr defaults traditional
hostname frr
! debugging level, not informational: the withdrawal assertion in the internal/le/interoplab/bgp
! checker reads
! FRR's own per-UPDATE decode, which is only emitted at debug level.
log file /tmp/frr.log debugging
!
debug bgp updates
debug bgp updates in
!
! FRR originates one prefix of its own. It is not asserted on: it is the
! injector's READINESS BARRIER. Ze relays it to the injector, and the injector
! releases nothing until it arrives, which is how the scenario knows the FRR
! session is established and the forward rail is carrying traffic. A timer would
! only assume both. Blackhole so zebra has a matching route for `network`.
ip route 10.20.0.0/24 blackhole
!
! FRR advertises its own readiness prefix to Ze and nothing else. With no
! local-role (below), FRR's bgp_otc_egress no longer withholds a route that
! carries OTC from Ze, so without this list FRR would echo the relayed
! 10.10.0.0/24 back to Ze, and an unstamped echo would reach the injector and
! fail the run at assertion 2 instead of at the OTC assertion it owes.
ip prefix-list FRR-OWN seq 5 permit 10.20.0.0/24
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 ! Ze relays as a route server (RFC 7947, see ze.conf): it does not prepend its
 ! own AS, so the first AS in a received path is the originator's. An RS client
 ! that enforces first-AS rejects every relayed route. Same as scenario 47.
 no bgp enforce-first-as
 neighbor 172.30.0.2 remote-as 65001
 ! NO `local-role` on purpose. Ze's role toward FRR is Provider (ze.conf), so
 ! FRR is a Customer and RFC 9234 Section 5 egress rule 1 binds Ze: every route
 ! it sends here MUST carry OTC equal to Ze's local AS. With strict at its
 ! default, Ze takes the Customer complement of its own role when FRR sends no
 ! Role capability (resolvePeerRole), so the obligation is unchanged.
 ! A configured customer, peer or rs-client role would make FRR 10.7.1's
 ! bgp_otc_filter (bgpd/bgp_route.c) add OTC = peer->as (65001, the same value)
 ! on ingress to a route that arrives without one, and the checker could then
 ! never tell Ze's stamp from FRR's. With no role, bgp_otc_filter adds nothing,
 ! and the OTC FRR prints is the one bgp_attr_otc parsed off Ze's wire.
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  neighbor 172.30.0.2 prefix-list FRR-OWN out
  network 10.20.0.0/24
 exit-address-family
!
