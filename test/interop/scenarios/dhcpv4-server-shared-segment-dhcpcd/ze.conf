# Ze as the DHCP server of a LAN that carries two subnets on one interface.
#
# eth0 holds the lab address 172.30.0.2/24 (primary) and 10.99.0.1/24, which
# the scenario's prestart adds before ze starts. One shared network holds both
# subnets, each with a reservation, and neither names a default-router, so the
# server identifier (option 54) must come from eth0's own addresses.
# dhcpclient runs dhcpcd on macvlan interfaces with fixed MACs:
#   02:00:00:00:00:01 reserved 172.30.0.20 (household)
#   02:00:00:00:00:02 reserved 10.99.0.20  (devices)
#   02:00:00:00:00:03 reserved nowhere: leased from 172.30.0.100-110
service {
    dhcp-server {
        enabled true;
        listen-interface eth0;
        shared-network lan {
            subnet 172.30.0.0/24 {
                range {
                    start 172.30.0.100;
                    stop 172.30.0.110;
                }
                lease-time 3600;
                static-mapping laptop {
                    mac-address 02:00:00:00:00:01;
                    ip-address 172.30.0.20;
                }
            }
            subnet 10.99.0.0/24 {
                range {
                    start 10.99.0.50;
                    stop 10.99.0.60;
                }
                lease-time 3600;
                static-mapping printer {
                    mac-address 02:00:00:00:00:02;
                    ip-address 10.99.0.20;
                }
            }
        }
    }
}
