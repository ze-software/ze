# Received routes cross the actual public raw-policy SDK before FRR sees them.
# The checker releases each injector phase only after the prior FRR state holds.
plugin {
 internal rs { use bgp-rs; }
 internal adj-rib-in { use bgp-adj-rib-in; }
 external atomic-policy {
  run "le test interop-bgp process bgp-atomic-policy-admission-frr atomic-policy";
  encoder json;
 }
}
bgp {
 router-id 172.30.0.2;
 # RFC 8212: both exercised directions explicitly accept.
 filter { import { final accept; } export { final accept; } }
 peer injector {
  connection { remote { ip 172.30.0.9; } local { ip 172.30.0.2; accept false; } }
  session {
   asn { local 65001; remote 65004; }
   family { ipv4/unicast { prefix { maximum 100; } } }
   capability { graceful-restart disable; }
  }
  behavior { group-updates disable; }
  attach process rs { receive [ update-received state open-received refresh ]; }
  attach process adj-rib-in { receive [ update-received state ]; }
  attach process atomic-policy { send [ update ]; }
 }
 peer frr {
  connection { remote { ip 172.30.0.3; } local { ip 172.30.0.2; accept false; } }
  session {
   # iBGP preserves the received MED, so MED77 proves the SDK attribute edit.
   asn { local 65001; remote 65001; }
   family { ipv4/unicast { prefix { maximum 100; } } }
   capability { graceful-restart disable; }
  }
  behavior { group-updates disable; }
  filter { export { filters [ atomic-policy:rewrite ]; final accept; } }
  attach process rs { receive [ update-received state open-received refresh ]; send [ update ]; }
  attach process adj-rib-in { receive [ update-received state ]; }
 }
}
