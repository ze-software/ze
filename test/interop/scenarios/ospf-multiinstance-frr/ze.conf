# Ze side of the ospf-multiinstance-frr interop scenario (spec-ospf-ext-12, RFC 6549).
#
# Ze runs TWO OSPFv2 instances on the one shared L2 bridge (eth0): the base Instance ID 0
# and a non-zero Instance ID 5. Each instance is a separate engine demuxed by the Instance
# ID in the packet header (RFC 6549 section 2/3.1).
#
# On the same subnet: a legacy FRR ospfd (172.30.0.3, Instance ID 0 only) and a
# multi-instance BIRD (172.30.0.4, Instance ID 5). Expected outcome:
#   - Ze's Instance 0 engine forms a Full adjacency with legacy FRR (unchanged bytes, AC-9).
#   - Ze's Instance 5 engine forms a Full adjacency with BIRD at Instance ID 5 (AC-10).
#   - FRR drops Ze's Instance-5 multicast Hellos at authentication (16-bit AuType mismatch)
#     and never adjoins Instance 5, without crashing (RFC 6549 section 5/6, AC-10).
ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type broadcast
			cost 10
			instance-id 0
			instance-id 5
		}
	}
}
