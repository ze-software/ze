frr defaults traditional
hostname frr-ospf-multiinstance
log file /tmp/frr.log informational
!
! Legacy OSPFv2 (RFC 2328, no RFC 6549 support): FRR reads the whole former 16-bit
! Authentication Type field, so it accepts Ze's Instance-ID-0 packets (offset 14 = 0) and
! forms a Full adjacency, but sees Ze's Instance-ID-5 multicast Hellos as a mismatched
! (large) AuType and drops them at authentication -- the intended RFC 6549 section 5/6
! isolation. FRR is on the same L2 bridge (eth0, area 0.0.0.0).
interface eth0
 ip ospf network broadcast
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
!
