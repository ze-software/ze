log stderr all;
router id 172.30.0.4;

protocol device {
}

# BIRD is the RFC 6549 multi-instance reference: this OSPFv2 instance runs with Instance ID
# 5, so it forms a Full adjacency with Ze's Instance-5 engine and ignores the Instance-0
# traffic from Ze and legacy FRR (its own Instance-ID demux). "instance id 5" writes 5 into
# the OSPFv2 header Instance ID octet (offset 14) on transmit and demultiplexes on receive.
protocol ospf v2 ospf5 {
	instance id 5;
	area 0.0.0.0 {
		interface "eth0" {
			type broadcast;
			cost 10;
		};
	};
}
