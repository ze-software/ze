# The ADD-PATH source for bgp-paths-limit-best-path-frr. Four static protocols
# each hold one route for 10.72.0.0/24 with a different MED, and every one
# starts disabled: the checker enables them one at a time with `birdc enable`,
# so the order the paths reach Ze is the checker's, worst first.
#
# With `add paths tx` BIRD sets ra_mode RA_ANY (proto/bgp/bgp.c) and exports
# every route the table holds for the prefix, one path identifier each. All
# four come from one neighbor AS, so Ze's election compares their MEDs.
log stderr all;
router id 172.30.0.4;

protocol device {
}

protocol static med_300 {
	disabled yes;
	ipv4 { import filter { bgp_med = 300; accept; }; };
	route 10.72.0.0/24 blackhole;
}

protocol static med_200 {
	disabled yes;
	ipv4 { import filter { bgp_med = 200; accept; }; };
	route 10.72.0.0/24 blackhole;
}

protocol static med_100 {
	disabled yes;
	ipv4 { import filter { bgp_med = 100; accept; }; };
	route 10.72.0.0/24 blackhole;
}

protocol static med_50 {
	disabled yes;
	ipv4 { import filter { bgp_med = 50; accept; }; };
	route 10.72.0.0/24 blackhole;
}

protocol bgp ze_peer {
	local 172.30.0.4 as 65003;
	neighbor 172.30.0.2 as 65001;
	ipv4 {
		import none;
		export all;
		add paths tx;
	};
}
