# Best paths under a peer's PATHS-LIMIT, judged by the peer that advertised it.
#
#     INTEROP_SCENARIO=bgp-paths-limit-best-path-frr ./le test integration interop
#
# draft-abraitis-idr-addpath-paths-limit Section 1: "This indication allows
# the sender to optimize the transmission of BGP routes by selectively
# relaying pertinent routes instead of the entire set."
#
# FRR (AS 65002) advertises PATHS-LIMIT 2 for ipv4/unicast. BIRD (AS 65003)
# sends Ze, the route server, paths of 10.72.0.0/24 one at a time, worst first:
# MED 300, 200, 100, then 50. FRR must end each step holding the two paths
# bgp-rib ranks best, never the first two to arrive: a better path makes Ze
# withdraw the demoted one, and when the best path goes away the demoted one
# comes back under the path identifier FRR saw it with before.
#
# WHAT MAKES IT DISCRIMINATE. Make owePathsLimitElections
# (internal/component/bgp/reactor/session_paths_limit_elect.go) return before
# it owes an election and FRR keeps MED 300 and MED 200 after MED 100 arrives.
plugin {
	# The election: the reactor asks bgp-rib to rank a contested prefix.
	internal rib {
		use bgp-rib;
	}
	internal rs {
		use bgp-rs;
	}
	# bgp-rs asks this store for the peer-up replay.
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				add-path {
					direction receive;
					family { ipv4/unicast; }
				}
			}
		}
		# The tokens match SetStartupSubscriptions in RunRouteServer
		# (plugins/rs/server.go).
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			receive [ update-received state ]
		}
		# The candidates the election ranks.
		attach process rib {
			receive [ update-received state ]
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				# The capability exchange of bgp-paths-limit-frr: Ze advertises
				# receive 10, FRR advertises the limit 2 this scenario is about,
				# and the checker reads both from each side.
				add-path {
					direction send/receive;
					family {
						ipv4/unicast { limit { receive 10; } }
					}
				}
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			send [ update ]
		}
		attach process rib {
			receive [ update-received state ]
		}
	}
}
