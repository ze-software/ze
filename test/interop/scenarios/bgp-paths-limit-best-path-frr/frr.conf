frr defaults traditional
hostname frr-paths-limit-best-path
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 ! Ze is a route server: the AS_PATH it relays starts with BIRD's AS, not 65001.
 no neighbor 172.30.0.2 enforce-first-as
 address-family ipv4 unicast
  ! ADD-PATH both ways, as in bgp-paths-limit-frr: Ze applies its receive
  ! limit 10 only to a family whose negotiated ADD-PATH includes receive, and
  ! the checker reads that 10 beside FRR's 2. FRR holds no route of its own,
  ! so it sends Ze nothing.
  neighbor 172.30.0.2 addpath-tx-all-paths
  neighbor 172.30.0.2 addpath-rx-paths-limit 2
 exit-address-family
