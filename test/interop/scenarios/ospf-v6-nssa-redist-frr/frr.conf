frr defaults traditional
hostname frr-ospf6-nssa-redist
log file /tmp/frr.log informational
!
! OSPFv3 (RFC 5340) NSSA internal peer for the v6 redistribution scenario.
! FRR installs Ze's redistributed Type-7 route and must not see a Type-5 leak.
interface eth0
 ipv6 ospf6 area 0.0.0.2
 ipv6 ospf6 network point-to-point
!
router ospf6
 ospf6 router-id 172.30.0.3
 area 0.0.0.2 nssa
!
