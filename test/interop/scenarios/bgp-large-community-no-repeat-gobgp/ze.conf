# RFC 8092 Section 3 against a real receiver. The export policy toward GoBGP
# adds a Large Community value the relayed route already carries, and a second
# definition adds 65000:2:2 again. The final session writer removes the
# repeats (`compactLargeCommunities`,
# internal/component/bgp/reactor/session_egress_normalize.go), whichever
# producer added them; test/plugin/rfc8092-large-community-no-repeat-egress.ci
# pins the same exchange with hex.
# GoBGP removes repeated values on receipt (RFC 8092 Section 3 binds the receiver
# too), so it shows each value once whatever Ze sent: the first red run passed.
# The lab's native speaker at 172.30.0.10 receives the same relay with the same
# egress tags and judges the wire as sent (oracle no-repeated-large-community).
# bgp-adj-rib-in lets bgp-rs replay the route to it, since it connects late.
plugin {
	internal rs {
		use bgp-rs;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
	internal community {
		use bgp-filter-community;
	}
}
bgp {
	community {
		large add-present {
			value [ 65000:1:1 65000:2:2 ];
		}
		large add-again {
			value [ 65000:2:2 ];
		}
	}
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process adj-rib-in {
			receive [ update-received state ];
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		filter {
			egress {
				community {
					tag [ add-present add-again ];
				}
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process adj-rib-in {
			send [ update ];
		}
	}
	peer speaker {
		connection {
			remote { ip 172.30.0.10; connect false; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		filter {
			egress {
				community {
					tag [ add-present add-again ];
				}
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process adj-rib-in {
			send [ update ];
		}
	}
}
