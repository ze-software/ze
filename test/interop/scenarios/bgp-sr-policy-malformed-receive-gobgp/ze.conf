# RFC 9830 Section 5 against a real SR Policy receiver downstream of Ze. The
# raw injector upstream sends a 13-octet SR Policy NLRI beside policy A, then
# re-announces policy B with no Tunnel Encapsulation attribute. Ze's registered
# SR Policy length rule (internal/component/bgp/plugins/nlri/srpolicy) answers
# treat-as-withdraw for the first, and the applyTunnelEncap branch
# (internal/component/bgp/reactor/session_tunnel_encap.go) for the second. Ze
# drops the malformed NLRI at typedNLRIEdit and relays an MP_UNREACH_NLRI
# holding only the well-formed ones, so GoBGP loses A and B, keeps the control
# policy C, and its session with Ze stays up.
#
# GoBGP is an rs-client, as in bgp-mup-malformed-t1st-withdraw-gobgp, so Ze
# relays the injector's paths transparently.
plugin {
	internal rs {
		use bgp-rs;
	}
}
bgp {
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/sr-policy { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/sr-policy { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
}
