# Kea after the move: the same server on the same link now serves another
# subnet, so the address ze leased before the move no longer fits the link.
#
# The subnet is the literal fd00:1e:0:1::/64. The lab renders only the
# fd00:1e:0:: prefix into its own /64, so this one stays as written: a sibling
# of the lab /64 that no lab network uses, and the checker names its one pool
# address (fd00:1e:0:1::50) as the lease ze must hold after the move.
#
# The subnet id differs from kea-dhcp6.conf's, so Kea treats the lease it
# granted before the move as one of a subnet it no longer serves. The timers
# and loggers are kea-dhcp6.conf's.
{
  "Dhcp6": {
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "service-sockets-max-retries": 30,
      "service-sockets-retry-wait-time": 1000
    },
    "lease-database": { "type": "memfile", "persist": true, "lfc-interval": 0 },
    "preferred-lifetime": 500,
    "valid-lifetime": 600,
    "renew-timer": 300,
    "rebind-timer": 480,
    "subnet6": [
      {
        "id": 2,
        "subnet": "fd00:1e:0:1::/64",
        "interface": "eth0",
        "pools": [ { "pool": "fd00:1e:0:1::50 - fd00:1e:0:1::50" } ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp6",
        "output-options": [ { "output": "stdout" } ],
        "severity": "INFO"
      },
      {
        "name": "kea-dhcp6.packets",
        "output-options": [ { "output": "stdout" } ],
        "severity": "DEBUG",
        "debuglevel": 55
      }
    ]
  }
}
