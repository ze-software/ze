# Ze as a DHCPv6 client on the shared interop segment.
#
# The static addresses match the ones docker assigns this container, so the
# interface reconcile is a no-op on them; the DHCPv6 client runs beside them
# on the same unit and installs the leased address fd00:1e:0::50 as a /128.
interface {
    backend netlink;
    ethernet eth0 {
        unit 0 {
            ipv4 {
                address [ 172.30.0.2/24 ];
            }
            ipv6 {
                address [ fd00:1e:0::2/64 ];
                dhcpv6 {
                    enabled true;
                }
            }
        }
    }
}
