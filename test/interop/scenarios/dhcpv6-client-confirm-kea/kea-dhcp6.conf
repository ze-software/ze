# Kea as ze's DHCPv6 server on the shared interop segment (host 22 of the
# lab's IPv6 /64), before the move.
#
# The pool is one address, so the lease ze holds is known in advance. The
# timers are long so no Renew or Rebind falls inside the run: valid 600 s,
# preferred 500 s, T1 300 s, T2 480 s. Every exchange Kea sees after the bind
# is then the one a link change started, and an address that stays past the
# move was kept by ze, never refreshed by a Renew Kea answered.
#
# kea-dhcp6-moved.conf is the configuration after the move: the checker copies
# it over the live configuration (/run/kea/kea-dhcp6.conf, written from this
# file at every start by test/interop/Dockerfile.kea) and reloads Kea with
# SIGHUP.
#
# At INFO Kea logs every packet it receives (DHCP6_PACKET_RECEIVED) and every
# lease it grants (DHCP6_LEASE_ALLOC). The kea-dhcp6.packets logger runs at
# debug level 55, where Kea logs every packet it sends with its options
# (DHCP6_RESPONSE_DATA): the status code of the Reply to a Confirm is read
# there.
{
  "Dhcp6": {
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "service-sockets-max-retries": 30,
      "service-sockets-retry-wait-time": 1000
    },
    "lease-database": { "type": "memfile", "persist": true, "lfc-interval": 0 },
    "preferred-lifetime": 500,
    "valid-lifetime": 600,
    "renew-timer": 300,
    "rebind-timer": 480,
    "subnet6": [
      {
        "id": 1,
        "subnet": "fd00:1e:0::/64",
        "interface": "eth0",
        "pools": [ { "pool": "fd00:1e:0::50 - fd00:1e:0::50" } ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp6",
        "output-options": [ { "output": "stdout" } ],
        "severity": "INFO"
      },
      {
        "name": "kea-dhcp6.packets",
        "output-options": [ { "output": "stdout" } ],
        "severity": "DEBUG",
        "debuglevel": 55
      }
    ]
  }
}
