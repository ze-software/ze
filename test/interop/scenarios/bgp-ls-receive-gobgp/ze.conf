# RFC 9552 Section 8.2.2 against a real BGP-LS receiver (GoBGP v4.11.0)
# downstream of Ze. The raw injector upstream sends valid BGP-LS Node and Link
# NLRIs plus a skipable malformed Link-State NLRI beside a well-formed survivor.
# Ze's registered BGP-LS nlrisyntax rule discards only the malformed NLRI and
# relays the valid controls and survivor transparently to GoBGP without
# resetting the session.
#
# GoBGP is an rs-client, as in bgp-sr-policy-malformed-receive-gobgp, so Ze
# relays the injector's paths transparently.
bus {
	endpoint bgp-rib {
		internal bgp-rib;
		send {
			message bgp:update {
				to none;
			}
		}
	}
	endpoint bgp-rs {
		internal bgp-rs;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				bgp-ls/bgp-ls { prefix { maximum 10000; } }
			}
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				bgp-ls/bgp-ls { prefix { maximum 10000; } }
			}
		}
	}
}
