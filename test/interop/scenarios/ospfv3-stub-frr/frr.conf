frr defaults traditional
hostname frr-ospf6-stub
log file /tmp/frr.log informational
!
! OSPFv3 (RFC 5340) stub internal router. eth0 is in the stub area 0.0.0.3; FRR must
! install the ::/0 default the stub ABR (Ze) originates as an Inter-Area-Prefix-LSA,
! and the stub E-bit in the Hello options must agree for the adjacency to form.
interface eth0
 ipv6 ospf6 area 0.0.0.3
 ipv6 ospf6 network point-to-point
!
router ospf6
 ospf6 router-id 172.30.0.3
 area 0.0.0.3 stub
!
