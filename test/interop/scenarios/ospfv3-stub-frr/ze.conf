# Ze side of the ospfv3-stub-frr interop scenario (spec-ospfv3-6 AC-2).
#
# Ze is the OSPFv3 stub Area Border Router: eth0 faces FRR inside the stub area
# 0.0.0.3, and a passive loopback anchors the backbone (area 0.0.0.0). As the stub
# ABR Ze originates a single Inter-Area-Prefix default (::/0) into the stub
# (RFC 5340 sec 3.5 / RFC 2328 sec 3.6), so FRR -- the stub internal router --
# installs ::/0. The stub E-bit in the Hello options must match for the adjacency
# to form at all, and no AS-External (Type 0x4005) LSA is flooded into the stub.

ospf {
	router-id 172.30.0.2
	address-family ipv6 {
		areas {
			area 0.0.0.0 {
				area-type normal
			}
			area 0.0.0.3 {
				area-type stub
			}
		}
		interfaces {
			interface eth0 {
				area 0.0.0.3
				network-type point-to-point
				cost 10
			}
			interface lo {
				area 0.0.0.0
				passive true
			}
		}
	}
}
