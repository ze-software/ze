frr defaults traditional
hostname frr-ospf-redistribute-default
log file /tmp/frr.log informational
!
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface ze-redist0
 ip address 10.82.0.3/24
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 10.82.0.3
 passive-interface ze-redist0
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
