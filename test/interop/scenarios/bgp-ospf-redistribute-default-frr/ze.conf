# FRR originates its loopback's subnet through OSPF. Its gateway must remain a
# default candidate: the external BGP announcement must use Ze's own endpoint.
environment {
	log {
		bgp.redistribute debug
		redistribute.orchestrator debug
	}
}

interface {
	backend netlink
}

ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
	}
}

policy {
	match ospf-to-bgp {
		family [ ipv4/unicast ];
	}
}
redistribute {
	destination bgp {
		import ospf {
			filters [ ospf-to-bgp ];
			final accept;
		}
	}
}

bgp {
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
