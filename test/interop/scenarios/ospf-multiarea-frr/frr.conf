frr defaults traditional
hostname frr-ospf-marea
log file /tmp/frr.log informational
!
! OSPFv2 backbone (area 0.0.0.0) on the shared bridge to Ze (eth0). FRR is an
! internal backbone router; it must learn the area-1 prefix Ze (the ABR)
! summarizes into the backbone as a Type 3 Summary-LSA (AC-17).
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
!
