# Ze side of the ospf-multiarea-frr interop scenario (spec-ospf-13 AC-17).
#
# Ze is an Area Border Router: eth0 is in the backbone (area 0.0.0.0, facing FRR)
# and a passive loopback is in area 0.0.0.1. Ze summarizes the area-1 prefix as a
# Type 3 Summary-LSA into the backbone, so FRR (area 0) reaches it as an
# inter-area route across the ABR (AC-17).

ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
		area 0.0.0.1 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
		interface lo {
			area 0.0.0.1
			passive true
		}
	}
}
