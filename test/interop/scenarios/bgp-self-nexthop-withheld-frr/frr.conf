frr defaults traditional
hostname frr
! debugging level, not informational: the internal/le/interoplab/bgp checker reads FRR's own
! per-UPDATE decode
! to learn which prefixes reached it. A routing table cannot answer that
! question, because FRR applies RFC 4271 Section 6.3(a) itself and would drop a
! route naming its own address whether or not Ze withheld it.
log file /tmp/frr.log debugging
!
debug bgp updates
debug bgp updates in
!
! FRR originates one prefix of its own. It is not asserted on: it is the
! injector's READINESS BARRIER. Ze relays it to the injector, and the injector
! sends nothing until it arrives, which is how the scenario knows the FRR
! session is established and the forward rail is carrying traffic. A timer would
! only assume both. Blackhole so zebra has a matching route for `network`.
ip route 10.20.0.0/24 blackhole
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 ! enforce-first-as is LEFT ON. Ze is an ordinary eBGP speaker here, so the
 ! leftmost AS of every route it advertises must be 65001, and FRR refusing an
 ! advertisement would be a second, independent way for this scenario to redden.
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  network 10.20.0.0/24
 exit-address-family
!
