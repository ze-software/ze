# RFC 4271 Section 5.1.3 against a real receiver.
#
#     "A route originated by a BGP speaker SHALL NOT be advertised to a peer
#      using an address of that peer as NEXT_HOP."
#
# Ze (AS 65001) relays between a raw injector (AS 65004) and FRR (AS 65002), the
# same eBGP rail scenarios 52 and 53 use. The injector announces TWO prefixes and
# the only difference between them is the NEXT_HOP:
#
#   10.11.0.0/24  NEXT_HOP 172.30.0.3  -- FRR's OWN address. Ze must withhold it.
#   10.12.0.0/24  NEXT_HOP 172.30.0.9  -- the injector. Ze must relay it.
#
# NEITHER PEER CARRIES `next-hop self`, and that is the whole scenario. The
# next-hop mode stays at its default, nhModeNone, so applyFactsNextHop records
# nothing and the address the injector chose is the address Ze would put on FRR's
# wire. That is the third-party NEXT_HOP Section 5.1.3 case 2 permits, and it is
# how a relay comes to tell one peer to reach a destination through itself.
#
# rs-fast-path is DELIBERATELY ABSENT, unlike scenarios 52 and 53, and the
# `attach process rs` block on each peer is what takes its place. Absence alone
# selects NO rail at all: notifyMessageReceiver (reactor_notify.go) calls
# reactorForwardRS inline only for a peer carrying RSFastPath, and every other
# route to forwardUpdateCore (reactor_api_forward.go) is a plugin RPC. The
# events that drive that RPC reach a process only through PeerScopedProcs
# (plugin/server/delivery_graph.go), which reads the attach bindings, and
# filterPermittedPeers (reactor/send_permission.go) drops a destination whose
# bindings grant no `send update`. So this scenario runs the GENERAL forward
# rail, which is the one an ordinary deployment runs, and both rails carry the
# Section 5.1.3 gate.
#
# The token lists match SetStartupSubscriptions in RunRouteServer
# (bgp/plugins/rs/server.go): delivery is the overlap of the two halves. `state`
# and `open-received` are as load-bearing as `update-received`, because
# handleState fills peer.Up and ForwardFrom and handleOpen fills peer.Families,
# and without those selectForwardTargets finds no destination at all.
plugin {
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# The raw injector. Ze dials it (accept false) exactly as the plugin .ci
	# suite does, because ze-test peer listens rather than connects in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# Both peers are a relay SOURCE and a relay DESTINATION here, so both
		# carry the receive half and the send half.
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
	}
}
