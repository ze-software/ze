plugin {
	internal rib {
		use bgp-rib;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# A peer that attaches nothing receiving feeds nothing (docs/guide/plugins.md):
		# bgp-rib counts BIRD's routes in `routes-in` only through this block.
		attach process rib {
			receive [ update-received state ];
		}
	}
}
