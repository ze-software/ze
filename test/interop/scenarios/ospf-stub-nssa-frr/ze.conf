# Ze side of the ospf-stub-nssa-frr interop scenario (spec-ospf-13 AC-18).
#
# Ze is the NSSA Area Border Router. eth0 faces FRR inside NSSA area
# 0.0.0.2. A passive loopback anchors backbone area 0.0.0.0. RFC 3101 requires
# Ze to originate the Type 7 default without an operator `default-originate`
# gate, so this fixture deliberately omits that leaf.

ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
		area 0.0.0.2 {
			area-type nssa
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.2
			network-type point-to-point
			cost 10
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
