# Ze side of the ospf-stub-nssa-frr interop scenario (spec-ospf-13 AC-18).
#
# Ze is the NSSA Area Border Router: eth0 faces FRR inside the NSSA area
# 0.0.0.2, and a passive loopback anchors the backbone (area 0.0.0.0). As the
# NSSA ABR Ze originates a Type 7 default route into the NSSA (default-originate),
# so FRR -- the NSSA internal router -- installs 0.0.0.0/0. The NSSA N-bit in the
# Hello options must match for the adjacency to form at all (RFC 3101, AC-18).

ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
		area 0.0.0.2 {
			area-type nssa
			nssa {
				default-originate true
			}
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.2
			network-type point-to-point
			cost 10
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
