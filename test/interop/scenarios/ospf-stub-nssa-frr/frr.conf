frr defaults traditional
hostname frr-ospf-nssa
log file /tmp/frr.log informational
!
! OSPFv2 NSSA internal router on the shared bridge to Ze (eth0). FRR is inside
! NSSA area 0.0.0.2; the adjacency forms only if the NSSA N-bit options match
! Ze's. As an NSSA internal router FRR installs the Type 7 default route the NSSA
! ABR (Ze) originates (RFC 3101, AC-18).
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.2
!
interface lo
 ip ospf area 0.0.0.2
!
router ospf
 ospf router-id 172.30.0.3
 area 0.0.0.2 nssa
 passive-interface lo
!
