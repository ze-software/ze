# Received forwarding only. No subject or control has an update block.
# The equal destination is explicit A; only the second destination runs SDK policy.
plugin {
 internal rs { use bgp-rs; }
 internal adj-rib-in { use bgp-adj-rib-in; }
 external srv6-policy {
  run "le test interop-bgp process bgp-srv6-next-hop-identity-frr srv6-policy";
  encoder json;
 }
}
bgp {
 peer injector {
  connection { remote { ip 172.30.0.9; } local { ip 172.30.0.2; accept false; } }
  session {
   asn { local 65001; remote 65004; }
   router-id 172.30.0.2;
   accept-srv6-prefix-sid true;
   capability { graceful-restart disable; }
   family { ipv4/unicast { prefix { maximum 100; } } ipv6/unicast { prefix { maximum 100; } } }
  }
  behavior { group-updates disable; }
  attach process rs { receive [ update-received state open-received refresh ]; send [ update ]; }
  attach process adj-rib-in { receive [ update-received state ]; send [ update ]; }
  attach process srv6-policy { send [ update ]; }
 }
 peer equal {
  connection { remote { ip 172.30.0.10; connect false; } local { ip 172.30.0.2; } }
  session {
   asn { local 65001; remote 65002; }
   router-id 172.30.0.2;
   next-hop 2001:db8:9252::9;
   propagate-srv6-prefix-sid true;
   capability { graceful-restart disable; }
   family { ipv6/unicast { prefix { maximum 100; } } }
  }
  behavior { group-updates disable; }
  attach process rs { receive [ update-received state open-received refresh ]; send [ update ]; }
  attach process adj-rib-in { receive [ update-received state ]; send [ update ]; }
 }
 peer changed {
  connection { remote { ip 172.30.0.11; connect false; } local { ip 172.30.0.2; } }
  session {
   asn { local 65001; remote 65003; }
   router-id 172.30.0.2;
   next-hop unchanged;
   propagate-srv6-prefix-sid true;
   capability { graceful-restart disable; }
   family { ipv6/unicast { prefix { maximum 100; } } }
  }
  behavior { group-updates disable; }
  attach process rs { receive [ update-received state open-received refresh ]; send [ update ]; }
  attach process adj-rib-in { receive [ update-received state ]; send [ update ]; }
  filter { export [ srv6-policy:change-hop ]; }
 }
}
