frr defaults traditional
hostname frr-ospf6-redist
log file /tmp/frr.log informational
!
! OSPFv3 (RFC 5340) point-to-point peer for the v6 redistribution scenario.
! FRR installs the AS-External route Ze redistributes from a real BGP source.
interface eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
!
router ospf6
 ospf6 router-id 172.30.0.3
!
