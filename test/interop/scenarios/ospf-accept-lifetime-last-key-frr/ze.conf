# Ze side of the ospf-accept-lifetime-last-key-frr interop scenario
# (spec-rfc-verdict-fix-ospf, commit bec87a7d44).
#
# RFC 5709 Section 3.2, put to a real peer: "In the event that the last key
# associated with an interface expires, it is unacceptable to revert to an
# unauthenticated condition, and not advisable to disrupt routing.  Therefore,
# the router should send a "last Authentication Key expiration" notification to
# the network manager and treat the key as having an infinite lifetime until the
# lifetime is extended, the key is deleted by network management, or a new key
# is configured."
#
# Key 1 is the ONLY key of the chain, so it is the chain's last key
# (lastKeyIndex). Its send-lifetime and its accept-lifetime both closed in 2020.
# FRR holds the same key-id and secret with no lifetime at all.
#
# Receive: no key of the chain accepts today and the last key's accept-lifetime
# has ended, so lastKeyExtendedIndex names key 1 and verify still tries it as if
# its lifetime were infinite. FRR's packets verify, and the adjacency reaches
# Full on both sides.
#
# Send: no key's send-lifetime covers today, so selectSendKey falls back to the
# last key and Ze keeps signing with key 1. FRR therefore verifies Ze's packets
# whichever way Ze's receive side behaves.
#
# With the receive extension removed (lastKeyExtendedIndex always -1), verify
# skips key 1 as outside its window and refuses every FRR packet with reason
# accept-lifetime. FRR still hears Ze's signed Hellos but never finds its own
# router id in them, so FRR stays in Init and neither side reaches Full: the
# scenario goes red. The sibling ospf-accept-lifetime-frr proves the other half:
# a retired key that is NOT the chain's last key is refused.

ospf {
	router-id 172.30.0.2
	key-chains core {
		key 1 {
			algorithm md5
			secret ZeFrrOspfKey1
			send-lifetime {
				start 2019-01-01T00:00:00Z
				end 2020-01-01T00:00:00Z
			}
			accept-lifetime {
				start 2019-01-01T00:00:00Z
				end 2020-01-01T00:00:00Z
			}
		}
	}
	areas {
		area 0.0.0.0 {
			area-type normal
			authentication {
				key-chain core
			}
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
			authentication {
				mode inherit
			}
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
