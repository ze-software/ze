frr defaults traditional
hostname frr-ospf-last-key
log file /tmp/frr.log informational
!
! FRR signs and verifies with key-id 1 / secret "ZeFrrOspfKey1", the pair the
! ospf-auth-frr scenario uses to reach Full. FRR's key carries no lifetime, so
! nothing changes on this side over time. Every lifetime that matters is on Ze's
! side: its only key has a send-lifetime and an accept-lifetime that both closed
! in 2020, so Full is reached only if Ze keeps that last key working.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 ZeFrrOspfKey1
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
!
