# RFC 1997 well-known communities on egress, judged by two independent
# conforming implementations.
#
# Ze (AS 65001) relays from a raw injector (AS 65004, EXTERNAL) to two observers:
#
#   FRR  (172.30.0.3, AS 65002) -- EXTERNAL. RFC 1997 says a route received
#        carrying NO_EXPORT "MUST NOT be advertised outside a BGP confederation
#        boundary". Ze configures no confederation, so its AS is "a stand-alone
#        autonomous system that is not part of a confederation", which that same
#        sentence says to consider a confederation itself. FRR is outside it.
#
#   BIRD (172.30.0.4, AS 65001) -- INTERNAL. Inside the boundary, so the SAME
#        route MUST still be advertised there. This is what stops the FRR
#        assertion passing on a build that advertises nothing.
#
# The injector also sends a FENCE route carrying an ordinary community. It must
# reach BOTH observers, which is the second control: a build that suppressed
# every route would redden it on the very session the NO_EXPORT absence is
# asserted on.
#
# rs-fast-path is on every peer, as in scenarios 52 and 53. That selects the
# ROUTE-SERVER forwarding rail (reactorForwardRS), which carries its own copy of
# the destination loop. test/plugin/wellknown-no-export-egress.ci drives the
# GENERAL rail (forwardUpdateCore) in the verify tier, so between the two files
# both rails are proven against a running daemon rather than only in unit tests.
plugin {
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# The raw injector. Ze dials it (accept false), because ze-test peer listens
	# rather than connects in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			rs-fast-path enable;
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			rs-fast-path enable;
		}
	}
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			rs-fast-path enable;
		}
	}
}
