log stderr all;
router id 172.30.0.4;

protocol device {
}

# BIRD's own prefix, the injector's second readiness barrier. Ze relays it to the
# injector, which releases nothing until it arrives, so the scenario knows this
# session is established rather than assuming it.
protocol static {
	ipv4;
	route 10.21.0.0/24 blackhole;
}

# INTERNAL to Ze: local as 65001 and neighbor as 65001. RFC 1997 puts an internal
# peer INSIDE the confederation boundary, so it receives the NO_EXPORT route.
protocol bgp ze_peer {
	local 172.30.0.4 as 65001;
	neighbor 172.30.0.2 as 65001;
	ipv4 {
		import all;
		export all;
	};
}
