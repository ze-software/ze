# Ze side of the bgp-as-migration-local-as interop scenario: RFC 7705 judged by
# FRR and BIRD in one lab.
#
#     INTEROP_SCENARIO=bgp-as-migration-local-as ./le test integration interop
#
# Ze's globally configured AS is 65001. It originates 10.77.5.0/24 from a static
# route (next hop the lab gateway, so it is no peer's own address) and
# announces it to both peers.
#
#   frr   AS 65002, iBGP under `migration 65002` (Section 4.2). Ze opens with
#         65001 first, FRR answers Bad Peer AS, and the next OPEN carries 65002.
#         The session is native iBGP, so FRR receives the route with an empty
#         AS_PATH.
#   gobgp AS 64512, eBGP toward the Local AS 65030 with no option (Section
#         3.3). GoBGP receives AS_PATH [65030, 65001]: the Local AS outermost
#         and the globally configured AS behind it.
#   bird  AS 65003, eBGP toward the Local AS 65020 under `replace-as`
#         (Section 3.3). BIRD receives AS_PATH 65020 alone.
#
# The checker is internal/le/interoplab/bgp/checkers.go,
# "bgp-as-migration-local-as".

static {
	table default {
		route 10.77.5.0/24 {
			next {
				hop 172.30.0.1 {
				}
			}
		}
	}
}

redistribute {
	destination bgp {
		import static {
			family [ ipv4/unicast ];
		}
	}
}

bgp {
	session {
		asn { local 65001; }
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { remote 65002; migration 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65030; remote 64512; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65020; remote 65003; local-options [ replace-as ]; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
