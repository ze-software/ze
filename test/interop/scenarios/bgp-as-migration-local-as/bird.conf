# RFC 7705 Section 3.3, the external neighbor of a Local AS session. BIRD is AS
# 65003 and peers with ze's Local AS 65020, not with ze's globally configured
# 65001. Ze's peer block sets `local-options [ replace-as ]`, so the AS_PATH
# BIRD installs carries 65020 alone; without that option it carries
# "65020 65001".
#
# import all: the route under test must reach BIRD's table for `show route all`
# to report its path.
log stderr all;
router id 172.30.0.4;

protocol device {
}

protocol bgp ze_peer {
	local 172.30.0.4 as 65003;
	neighbor 172.30.0.2 as 65020;
	ipv4 {
		import all;
		export none;
	};
}
