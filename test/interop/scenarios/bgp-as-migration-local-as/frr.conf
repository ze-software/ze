frr defaults traditional
hostname frr-as-migration
log file /tmp/frr.log informational
!
! RFC 7705 Section 4.2, the far end of a migrating iBGP session. FRR is AS
! 65002 and expects ze to open with 65002. Ze's globally configured AS is 65001
! and its peer block carries `migration 65002`, so ze's FIRST OPEN carries
! 65001, FRR answers "OPEN Message Error / Bad Peer AS", and ze's next OPEN
! carries 65002. The session establishing at all is that fallback: an OPEN
! that kept 65001 would be refused on every attempt.
!
router bgp 65002
 bgp router-id 172.30.0.3
 neighbor 172.30.0.2 remote-as 65002
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
