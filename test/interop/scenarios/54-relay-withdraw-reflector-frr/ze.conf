# RFC 4456 Section 8 against a real receiver, on the iBGP ROUTE-REFLECTOR rail.
#
# Ze (AS 65000) is a route reflector with two clients: a raw injector at
# 172.30.0.9 and FRR at 172.30.0.3. Both sessions are internal, which is what
# this scenario needs and what scenarios 52 and 53 cannot give: forwardUpdateCore
# (internal/component/bgp/reactor/reactor_api_forward.go) records
# Op(9, AttrModSet) and Op(10, AttrModPrepend) only when the source is internal
# and the destination is not external.
#
# Those two operations reach originatorIDHandler and clusterListHandler
# (internal/component/bgp/reactor/filter_delta_handlers.go), both of which CREATE
# their attribute when the source carries none. Neither asked whether the UPDATE
# reflects a route, so a relayed withdrawal left Ze carrying ORIGINATOR_ID and
# CLUSTER_LIST and nothing else -- no ORIGIN, no AS_PATH, no NEXT_HOP, no
# LOCAL_PREF. RFC 4271 Section 6.3 makes that a Missing Well-known Attribute
# error, and check.py reads FRR's answer.
#
# RFC 4456 Section 8 conditions both obligations on reflecting a ROUTE: "When an
# RR reflects a route, it MUST prepend the local CLUSTER_ID to the CLUSTER_LIST".
# A withdraw-only UPDATE reflects no route, so neither obligation arises.
#
# rs-fast-path is on both peers, as in scenarios 52 and 53. It selects the
# forwarding rail only; reactorForwardRS records the identical pair of operations.
plugin {
	internal rs {
		use bgp-rs;
	}
}
bgp {
	router-id 172.30.0.2;
	session {
		asn { local 65000; }
	}
	group RR-CLIENTS {
		session {
			route-reflector-client true;
			# Pinned rather than defaulted so check.py can assert the exact
			# CLUSTER_LIST value FRR reports.
			cluster-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# The raw injector. Ze dials it (accept false) exactly as the plugin .ci
		# suite does, because ze-test peer listens rather than connects in check mode.
		peer injector {
			connection {
				remote { ip 172.30.0.9; }
				local  { ip 172.30.0.2; accept false; }
			}
			session { asn { remote 65000; } }
			behavior { rs-fast-path enable; }
		}
		peer frr {
			connection {
				remote { ip 172.30.0.3; }
				local  { ip 172.30.0.2; }
			}
			session { asn { remote 65000; } }
			behavior { rs-fast-path enable; }
		}
	}
}
