frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 ! Ze relays as a route server (RFC 7947) and does not prepend its own AS, so
 ! the first AS of a relayed path is the injector's (65004), not Ze's.
 no bgp enforce-first-as
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
 !
 address-family ipv4 flowspec
  neighbor 172.30.0.2 activate
 exit-address-family
!
