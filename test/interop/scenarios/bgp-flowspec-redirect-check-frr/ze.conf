# Ze as a route server between the raw injector (AS 65004, the EBGP source of
# the redirect rule) and FRR (AS 65002, the receiver). The RIB judges the
# draft-simpson redirect check, so bgp-rib must see the injector's UPDATEs;
# the route server relays and asks adj-rib-in for the peer-up replay.
plugin {
	internal rib { use bgp-rib; }
	internal rs { use bgp-rs; }
	internal adj-rib-in { use bgp-adj-rib-in; }
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer injector {
		connection {
			# le test peer listens, so Ze dials it.
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			# rs-client keeps the AS_PATH as received (RFC 7947 Section 2.2.2.1).
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/flow { prefix { maximum 10000; } }
			}
		}
		attach process rib {
			receive [ update state refresh ];
			send [ update ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process adj-rib-in {
			receive [ update-received state ];
			send [ update ];
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/flow { prefix { maximum 10000; } }
			}
		}
		attach process rib {
			receive [ update state refresh ];
			send [ update ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process adj-rib-in {
			receive [ update-received state ];
			send [ update ];
		}
	}
}
