frr defaults traditional
hostname frr-ospf-bcast
log file /tmp/frr.log informational
!
! OSPFv2 broadcast LAN on the shared bridge to Ze (eth0). FRR keeps the default
! broadcast network type with a LOWER priority than Ze, so Ze is elected DR and
! originates the Network-LSA (Type 2); FRR becomes BDR and the adjacency reaches
! Full (AC-16).
interface eth0
 ip ospf area 0.0.0.0
 ip ospf priority 1
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
!
