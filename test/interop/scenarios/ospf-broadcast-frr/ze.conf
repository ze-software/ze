# Ze side of the ospf-broadcast-frr interop scenario (spec-ospf-13 AC-16).
#
# Ze and FRR sit on the shared Docker bridge (eth0) as a broadcast LAN segment.
# A DR/BDR is elected (priority, then router-id tiebreak). Ze runs with a HIGHER
# OSPF priority so it is elected DR and originates the Network-LSA (Type 2) for
# the segment; routes converge over the LAN.

ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type broadcast
			priority 100
			cost 10
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
