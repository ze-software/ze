# Two independent Python speaker instances (test/interop/speaker/) dial Ze at distinct IPs with
# distinct router-ids. Both must establish without colliding -- the ExaBGP-style per-instance
# router-id design (spec-bgp-plugin-speaker AC-5). Ze is passive to both (connect false): each
# speaker dials and does not listen.
plugin {
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	peer speaker1 {
		connection {
			remote { ip 172.30.0.10; connect false; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	peer speaker2 {
		connection {
			remote { ip 172.30.0.11; connect false; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65005; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
