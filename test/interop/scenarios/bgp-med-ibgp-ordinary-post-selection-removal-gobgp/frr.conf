frr defaults traditional
hostname frr-med-ibgp-ordinary
log file /tmp/frr.log informational
!
ip route 10.63.0.0/24 Null0
ip route 10.63.1.0/24 Null0
!
ip prefix-list MED_SUBJECT seq 5 permit 10.63.0.0/24
ip prefix-list MED_CONTROL seq 5 permit 10.63.1.0/24
!
route-map MED_ROUTES permit 10
 match ip address prefix-list MED_SUBJECT
 set metric 100
route-map MED_ROUTES permit 20
 match ip address prefix-list MED_CONTROL
 set metric 100
 set community 65005:1
!
router bgp 65005
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 send-community
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  redistribute static route-map MED_ROUTES
 exit-address-family
!
