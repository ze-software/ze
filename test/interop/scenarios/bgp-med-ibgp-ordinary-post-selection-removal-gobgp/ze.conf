# RFC 4271 Section 9.1.2.2 on ordinary bgp-rib selected-route iBGP
# readvertisement (no bgp-rs or route-reflector plugin).
#
# FRR is EXTERNAL to Ze (65005 -> 65001) and announces:
# - 10.63.0.0/24 with MULTI_EXIT_DISC 100 (selected with MED 100)
# - 10.63.1.0/24 with MULTI_EXIT_DISC 100 and community 65005:1 (MED removed on
#   import before Decision Process phases 1 and 2, serving as the no-MED control)
#
# GoBGP is INTERNAL to Ze (65001 -> 65001) with next-hop self and a raw export
# filter that removes attribute 4 from the destination base. GoBGP must receive
# 10.63.0.0/24 with Med 100 restored by applyFactsMED, and 10.63.1.0/24 with no
# Med synthesized.
plugin {
	internal transit-rib {
		use bgp-rib;
	}
	internal bgp-adj-rib-in {
		use bgp-adj-rib-in;
	}
	internal bgp-filter-modify {
		use bgp-filter-modify;
	}
	internal static {
		use static;
	}
	external raw-med-drop {
		run "le test interop-bgp process bgp-med-ibgp-ordinary-post-selection-removal-gobgp raw-med-drop";
		encoder json;
	}
}
static {
	table default {
		route 172.30.0.3/32 {
			next {
				interface eth0 { }
			}
		}
	}
}
policy {
	modify DROP-MED {
		del {
			med;
		}
		match {
			community [ 65005:1 ];
		}
	}
}
bgp {
	router-id 172.30.0.2;
	peer frr-source {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65005; }
			router-id 172.30.0.2;
			aigp { enabled false; }
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		filter {
			import { filters [ modify:DROP-MED ]; final accept; }
			export { final reject; }
		}
		attach process bgp-adj-rib-in {
			receive [ update-received state ];
		}
		attach process transit-rib {
			receive [ update-received state ];
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			next-hop self;
			aigp { enabled false; }
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		filter {
			import { final reject; }
			export { filters [ raw-med-drop:drop-med-raw ]; final accept; }
		}
		attach process transit-rib {
			send [ update ];
			receive [ state refresh update-sent ];
		}
	}
}
