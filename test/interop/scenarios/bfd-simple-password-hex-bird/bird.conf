# BIRD 2.15 as the BFD peer for the Simple Password interop scenario whose
# password ze takes in hexadecimal (`secret-hex`). BIRD takes the same
# password as an ASCII string, so the session comes Up only when ze decodes
# the hex digits into exactly these bytes.
#
# BIRD names the type "simple" and ze names it "simple-password"; both are
# RFC 5880 Auth Type 1. The key id and the password must match ze's profile
# exactly, because each end verifies what the other signs.
log stderr all;
router id 172.30.0.4;

protocol device {
}

protocol bfd {
	interface "*" {
		min rx interval 300 ms;
		min tx interval 300 ms;
		idle tx interval 1 s;
		authentication simple;
		password "Ze-Hex-Key" { id 7; };
	};
	neighbor 172.30.0.2 local 172.30.0.4;
}
