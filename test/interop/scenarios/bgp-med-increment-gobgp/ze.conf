# `increment { med 50 }` COMPUTES FROM THE ROUTE'S METRIC, judged by a foreign
# RIB rather than by a hand-written filter subject.
#
# The engine hands each text-mode filter one subject per UPDATE
# (AppendUpdateForFilter, reactor/filter_format.go). bgp-filter-modify reads the
# current metric out of that subject (readUint32Attr,
# plugins/filter_modify/modify.go) and adds the configured value to it. A
# subject that does not name `med` therefore makes the increment compute from
# the RFC 4271 Section 9.1.2.2 absent base of 0, and `increment 50` on a route
# carrying 100 writes 50 instead of 150. That is what this lab measures, and it
# measures it at GoBGP because GoBGP keeps the RECEIVED attribute list on the
# path and prints it verbatim.
#
# THE DESTINATION IS INTERNAL, AND THAT IS WHAT MAKES THE METRIC READABLE.
# Ze's automatic Section 5.1.4 strip runs toward a different neighboring AS
# alone (medPropagationAllowedTo, reactor/forward_med.go returns true for every
# non-eBGP destination), so on this iBGP session attribute 4 survives the relay
# and whatever the import chain computed is what GoBGP decodes.
# bgp-med-across-as-gobgp is the other half: there the destinations are external
# and the automatic rule is what is measured.
#
# THE IN-RUN POSITIVE CONTROL IS THE SECOND PREFIX. The policy carries a match
# container, so only the route tagged 65005:1 has its metric incremented. The
# untagged one travels the same session, the same route-server rail and the same
# policy chain and keeps Med 100. A blanket rewrite, a broken relay, a daemon
# that prints no attributes at all, and a ze that dropped the metric on egress
# each fail that half.
#
# THE INJECTOR'S WAIT IS WHAT SELECTS THE RAIL UNDER TEST. The forward rail
# skips a destination that is not established yet (forwardUpdateCore,
# reactor/reactor_api_forward.go), so a prefix announced before GoBGP is up
# either never arrives or arrives by some other path. inject.msg waits for four
# of Ze's KEEPALIVEs first.
plugin {
	internal rib {
		use bgp-rib;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
	internal rs {
		use bgp-rs;
	}
	internal bgp-filter-modify {
		use bgp-filter-modify;
	}
}
bgp {
	policy {
		# The mechanism under test. `increment` adds the stated value to the
		# value the route carries, which is the semantics
		# docs/guide/plugins.md states, and the import chain is where a metric
		# is adjusted before the Decision Process reads it.
		modify INC-MED {
			increment {
				med 50;
			}
			match {
				community [ 65005:1 ];
			}
		}
	}
	# The source, EXTERNAL to Ze (65005 -> 65001). The raw injector announces two
	# routes carrying MULTI_EXIT_DISC 100, and only one of them carries the
	# community the policy matches. Ze dials it (accept false) because
	# `ze-test peer` listens in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65005; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# Ze sends a KEEPALIVE every hold/3, so a 15 s hold gives the injector a
		# 5 s clock to count GoBGP's start-up against. The default 90 s hold
		# makes the same wait take eighteen times longer.
		timer { receive-hold-time 15; }
		filter {
			import [ modify:INC-MED ];
		}
		# The relay itself. bgp-rs is the ONLY plugin that forwards a received
		# UPDATE to other peers: nothing in bgp-rib calls SendRoutes,
		# ForwardUpdate or ForwardCached, and `flushBatch`
		# (plugins/rs/server_forward.go) is what reaches forwardUpdateCore.
		# Without the block the route server takes delivery of no peer-scoped
		# event (PeerScopedProcs, plugin/server/delivery_graph.go) and
		# `send update` is not granted (filterPermittedPeers,
		# reactor/send_permission.go), so nothing leaves.
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
	}
	# The destination, INTERNAL to Ze (65001 -> 65001). GoBGP keeps the RECEIVED
	# attribute list on the path and prints it verbatim, so it reports what
	# arrived rather than what it decided to keep.
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
	}
}
