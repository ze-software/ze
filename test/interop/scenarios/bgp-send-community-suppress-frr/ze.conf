# Ze relays one client's routes to two other clients, and each destination has a
# different `session { community { send ... } }` setting. The setting is applied on
# the egress rail, so what leaves the socket is what the two foreign daemons show.
#
# `rs-client true` on all three peers keeps Ze's AS out of the relayed AS_PATH
# (RFC 7947 Section 2.2.2.1). It is not what this scenario tests, but it decides
# whether FRR accepts the route at all, so frr.conf carries `no bgp
# enforce-first-as` to match. Scenario 14 records the same trap.
#
# bgp-rs relays only for peers that attach it: plugin delivery follows each
# peer's `attach process` blocks, so a loaded plugin no peer attaches receives
# nothing and relays nothing (Ze logs "the plugin declared events and no peer
# attaches it"). Every peer therefore attaches rs. The injector sends as soon as
# its session opens, before FRR and BIRD are up, so bgp-rs replays the route to
# them at peer up from what bgp-adj-rib-in holds; adj-rib-in is attached to every
# peer for that replay, as in test/plugin/send-community-suppress.ci. Without it
# the two destinations hold nothing and the absence assertions prove nothing.
# No assertion reads Ze's RIB, so bgp-rib is not loaded.
plugin {
	internal rs {
		use bgp-rs;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	# The raw injector. It emits one UPDATE carrying all three community types at
	# once, which no daemon config can promise, so the suppression under test has
	# something of each type to remove. Ze dials it (accept false) because
	# `le test peer` listens in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# Ze sends a KEEPALIVE every hold/3, so a 15 s hold gives the injector a
		# 5 s clock to sequence its second UPDATE against. The default 90 s hold
		# makes the same scenario take three times longer.
		timer { receive-hold-time 15; }
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process adj-rib-in {
			receive [ update-received state ];
			send [ update ];
		}
	}
	# Destination 1: every community type is suppressed.
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			rs-client true;
			community {
				send none;
			}
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process adj-rib-in {
			receive [ update-received state ];
			send [ update ];
		}
	}
	# Destination 2: only the standard community survives. The extended and large
	# communities must be removed, and they travel in the same UPDATE, so this
	# peer proves the suppression is per type and not all or nothing.
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			rs-client true;
			community {
				send standard;
			}
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process adj-rib-in {
			receive [ update-received state ];
			send [ update ];
		}
	}
}
