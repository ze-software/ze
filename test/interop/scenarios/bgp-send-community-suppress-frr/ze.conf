# Ze relays one client's routes to two other clients, and each destination has a
# different `session { community { send ... } }` setting. The setting is applied on
# the egress rail, so what leaves the socket is what the two foreign daemons show.
#
# `rs-client true` on all three peers keeps Ze's AS out of the relayed AS_PATH
# (RFC 7947 Section 2.2.2.1). It is not what this scenario tests, but it decides
# whether FRR accepts the route at all, so frr.conf carries `no bgp
# enforce-first-as` to match. Scenario 14 records the same trap.
plugin {
	internal rib {
		use bgp-rib;
	}
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# The raw injector. It emits one UPDATE carrying all three community types at
	# once, which no daemon config can promise, so the suppression under test has
	# something of each type to remove. Ze dials it (accept false) because
	# `ze-test peer` listens in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# Ze sends a KEEPALIVE every hold/3, so a 15 s hold gives the injector a
		# 5 s clock to sequence its second UPDATE against. The default 90 s hold
		# makes the same scenario take three times longer.
		timer { receive-hold-time 15; }
	}
	# Destination 1: every community type is suppressed.
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			rs-client true;
			community {
				send none;
			}
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	# Destination 2: only the standard community survives. The extended and large
	# communities must be removed, and they travel in the same UPDATE, so this
	# peer proves the suppression is per type and not all or nothing.
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			rs-client true;
			community {
				send standard;
			}
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
