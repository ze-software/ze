frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 ! Ze relays as a route server here, so it does not prepend its own AS and the
 ! first AS in the path is the injector's. An RS client that enforces first-AS
 ! rejects every relayed route.
 no bgp enforce-first-as
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  ! FRR must not send anything back. Without this it re-advertises the relayed
  ! prefixes to Ze, Ze relays them on to BIRD, and BIRD then holds a second path
  ! that never carried a community at all. That path would satisfy the "no
  ! extended, no large" half of the check for the wrong reason.
  neighbor 172.30.0.2 route-map BLOCK-OUT out
 exit-address-family
!
route-map BLOCK-OUT deny 10
!
