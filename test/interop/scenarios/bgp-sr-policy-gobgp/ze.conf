# RFC 9830 SR Policy origination read back by GoBGP. Ze originates one IPv4 and
# one IPv6 SR Policy from configuration, each with Binding SID label 1048575
# (the top of the 20-bit range) and a segment list of two Type A segments,
# labels 16 (the lowest unreserved label) and 1048575, plus an IPv4-address
# Route Target (RFC 9830 Section 4.2.1). The checker in
# internal/le/interoplab/bgp (check_extras.go, bgp-sr-policy-gobgp) requires
# GoBGP's text RIB to show each NLRI's distinguisher, color and endpoint and the
# labels exactly as configured. The labels pass parseConfigRoute's 20-bit range
# checks (internal/component/bgp/plugins/nlri/srpolicy), so this is goal
# validation for origination, not a discriminating test of those checks.
# A third policy, color 300, carries its Binding SID as an SRv6 SID in the
# type-13 Binding SID sub-TLV (binding-sid srv6, RFC 9830 Section 2.4.2,
# Length 18). The checker requires GoBGP to print it through its type-13
# decoder ("I-Flag: false, BSID: 2001:db8::b5}"), which reads the SID only from
# a Length-18 value; the type-20 sub-TLV would print a B-Flag in between.
bgp {
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/sr-policy { prefix { maximum 10000; } }
				ipv6/sr-policy { prefix { maximum 10000; } }
			}
		}
		update {
			attribute {
				next-hop 172.30.0.2
				extended-community [target:172.30.0.5:0]
			}
			nlri {
				ipv4/sr-policy add distinguisher 0 color 100 endpoint 10.0.0.1 preference 100 binding-sid mpls 1048575 segment-list weight 1 segment type-a mpls 16 segment type-a mpls 1048575
				ipv4/sr-policy add distinguisher 0 color 300 endpoint 10.0.0.3 preference 100 binding-sid srv6 2001:db8::b5 segment-list weight 1 segment type-a mpls 16
			}
		}
		update {
			attribute {
				next-hop 2001:db8::2
				extended-community [target:172.30.0.5:0]
			}
			nlri {
				ipv6/sr-policy add distinguisher 0 color 200 endpoint 2001:db8::1 preference 100 binding-sid mpls 1048575 segment-list weight 1 segment type-a mpls 16 segment type-a mpls 1048575
			}
		}
	}
}
