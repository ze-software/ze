frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
no ip nht resolve-via-default
ip route 10.250.0.0/24 172.30.0.15
!
router bgp 65001
 bgp router-id 172.30.0.3
 neighbor 172.30.0.5 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.5 activate
 exit-address-family
!
