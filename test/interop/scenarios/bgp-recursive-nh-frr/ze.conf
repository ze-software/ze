# Recursive iBGP next-hop resolution for spec-fib-depth AC-2 and AC-12.
#
# All three peers (ze .2, frr .3, gobgp .5) run iBGP in AS 65001. GoBGP
# advertises three prefixes:
#   10.200.0.0/24  NEXT_HOP 10.250.0.1  -> recursive via static 10.250.0.0/24 -> .15
#   10.200.1.0/24  NEXT_HOP 10.252.0.1  -> unresolvable negative control (absent)
#   10.200.2.0/24  NEXT_HOP 172.30.0.5  -> direct positive control via .5
#
# ze-reload.conf removes the static 10.250.0.0/24 route so the checker can
# verify AC-12 cascade withdrawal without dropping the iBGP session.

plugin {
	internal bgp-rib {
		use bgp-rib;
	}
	internal rib {
		use rib;
	}
	internal fib-kernel {
		use fib-kernel;
	}
	internal connected {
		use connected;
	}
	internal static {
		use static;
	}
}

connected {
}

static {
	table default {
		route 10.250.0.0/24 {
			next {
				hop 172.30.0.15 { }
			}
		}
	}
}

bgp {
	router-id 172.30.0.2;
	filter {
		import { final accept; }
		export { final reject; }
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process bgp-rib {
			receive [ update-received state ];
		}
	}
}
