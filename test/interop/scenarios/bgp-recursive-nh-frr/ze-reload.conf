# Reload config for bgp-recursive-nh-frr (spec-fib-depth AC-12).
#
# Identical to ze.conf except the covering static route 10.250.0.0/24 is
# removed. The iBGP peer block is unchanged so the session stays Established
# while 10.200.0.0/24 withdraws from the kernel FIB.

bus {
	endpoint bgp-rib {
		internal bgp-rib;
	}
	endpoint rib {
		internal rib;
	}
	endpoint fib-kernel {
		internal fib-kernel;
	}
	endpoint connected {
		internal connected;
	}
	endpoint static {
		internal static;
	}
}

connected {
}

static {
	table default {
	}
}

bgp {
	router-id 172.30.0.2;
	filter {
		import { final accept; }
		export { final reject; }
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
