# Ze side of the bgp-bfd-strict-frr interop scenario
# (spec-bgp-bfd-strict, draft-ietf-idr-bgp-bfd-strict-mode).
#
# Ze runs strict mode. FRR 10.3.1 does not implement the draft, so its OPEN
# carries no capability 74 and BfdStrictNegotiated stays FALSE. What the
# scenario proves is the interoperability half of draft Section 1: "always
# using 'strict-mode' would preclude BGP operation in an environment where not
# all routers support BFD strict-mode".
#
# frr.conf configures NO BFD, so ze's own BFD session here never leaves Down.
# That is deliberate: it means the negotiation half of the condition is the ONLY
# thing that can let this session establish, so a ze that held on its local
# configuration alone leaves this peer down forever.
bfd {
	enabled true;
	profile fast {
		detect-multiplier 3;
		desired-min-tx-us 300000;
		required-min-rx-us 300000;
	}
}

bgp {
	peer peer1 {
		connection {
			remote {
				ip 172.30.0.3;
			}
			local {
				ip 172.30.0.2;
			}
			bfd {
				enabled true;
				mode single-hop;
				profile fast;
				strict true;
				hold-time 30;
				hold-down 300;
			}
		}
		session {
			asn {
				local 65001;
				remote 65002;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
			}
		}
	}
}
