frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! NO bfd block and NO `neighbor ... bfd`, deliberately.
!
! This is the negative half of draft-ietf-idr-bgp-bfd-strict-mode. Ze runs
! strict mode against a peer that implements none of it and answers no BFD at
! all, which is the deployment the draft's Section 1 protects: "always using
! 'strict-mode' would preclude BGP operation in an environment where not all
! routers support BFD strict-mode".
!
! Ze's own BFD session therefore never leaves Down. The session must still
! reach Established, because FRR's OPEN carries no capability 74 and Section
! 8.1 gates every sub-state on strict mode being "enabled and negotiated". A ze
! that held on its local configuration alone would leave this peer down
! forever, and that is what makes this scenario discriminate.
!
router bgp 65002
 bgp router-id 172.30.0.3
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
