# Ze relays an INTERNAL client's routes to an EXTERNAL one. RFC 4271
# Section 5.1.5 forbids LOCAL_PREF on the external session, so what FRR shows is
# what the forward rail put on the socket.
#
# THE INJECTOR'S WAIT IS WHAT SELECTS THE RAIL UNDER TEST, and it is
# load-bearing rather than a start-up convenience. `bgp-rib` replays a stored
# route to a peer that came up late, and that replay is built by
# peer_rib_routes.go, a DIFFERENT rail which has stripped LOCAL_PREF correctly
# all along. A scenario that announces before its destinations are established
# therefore asserts against the rail that was already right, and stays green
# with the forward rail's strip removed -- measured on 2026-08-04 on an earlier
# draft of this scenario. inject.msg waits for fourteen of Ze's KEEPALIVEs
# first, so nothing is ever replayed and every prefix reaches both destinations
# through forwardUpdateCore (reactor/reactor_api_forward.go), the rail that
# leaked.
#
# The rib plugin STAYS. Dropping it does not remove the replay path, it removes
# the cache owner: `bgp-rs` is default-on, and without rib the first forwarded
# UPDATE dies on "BUG: ForwardUpdatesDirect: msgID missing from cache" and
# reaches nobody. The wait above is the right control over the rail, not the
# plugin list.
plugin {
	internal rib {
		use bgp-rib;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	# The raw injector, INTERNAL to Ze (65001 on both sides). It announces routes
	# carrying LOCAL_PREF 200, which is legal on an internal session and is
	# exactly what an internal peer sends. Ze dials it (accept false) because
	# `ze-test peer` listens in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# Ze sends a KEEPALIVE every hold/3, so a 15 s hold gives the injector a
		# 5 s clock to count FRR's start-up against. The default 90 s hold makes
		# the same wait take eighteen times longer.
		timer { receive-hold-time 15; }
	}
	# The destination, EXTERNAL to Ze (65001 -> 65002). RFC 4271 Section 5.1.5:
	# "A BGP speaker MUST NOT include this attribute in UPDATE messages it sends
	# to external peers, except in the case of BGP Confederations [RFC3065]."
	# Ze has no confederation configuration, so the exception cannot apply and
	# the prohibition is unconditional for this peer.
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
