frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 ! enforce-first-as stays ON here, unlike the route-server scenarios. Ze is a
 ! plain external peer in this lab, so it prepends 65001 and the first AS in the
 ! relayed path is its own, which is what FRR expects.
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  ! FRR must not send anything back. Without this it re-advertises the relayed
  ! prefixes to Ze, and a second path arriving from a different direction would
  ! satisfy the "no LOCAL_PREF" half for the wrong reason.
  neighbor 172.30.0.2 route-map BLOCK-OUT out
 exit-address-family
!
route-map BLOCK-OUT deny 10
!
