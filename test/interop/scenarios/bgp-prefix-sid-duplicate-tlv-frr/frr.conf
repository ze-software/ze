frr defaults traditional
hostname frr-prefix-sid-duplicate-tlv
log file /tmp/frr.log informational
!
! FRR IS THE JUDGE of RFC 8669 Section 6 here. ze relays an SRv6 L3VPN route
! whose Prefix-SID arrived with the SRv6 L3 Service TLV (type 5) twice. FRR's
! attribute parser refuses a second type-5 TLV with "Prefix SID SRv6 L3VPN
! field repeated" and resets the session (NOTIFICATION, Malformed Attribute
! List), so the route reaches FRR's VPN table only when ze discarded the
! repeat, and FRR then reports the SID of the FIRST occurrence.
!
! iBGP to ze (both AS 65001): RFC 8669 Section 8 keeps the Prefix-SID inside
! the SR domain, and an internal peer is inside it, so ze relays the attribute
! without a propagate leaf. No VRF imports the route: FRR retains every VPN
! route by default (bgp retain route-target all), which is what lets the
! checker read it from the VPN table.
!
router bgp 65001
 bgp router-id 172.30.0.3
 ! The checker reads FRR's log file for the refusal and needs the adjacency
 ! line there first, so a log FRR never wrote cannot pass as clean. The
 ! traditional profile leaves neighbor changes unlogged.
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  no neighbor 172.30.0.2 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 172.30.0.2 activate
 exit-address-family
!
