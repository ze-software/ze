# RFC 8669 Section 6, a repeated single-occurrence Prefix-SID TLV, judged by FRR.
#
#     INTEROP_SCENARIO=bgp-prefix-sid-duplicate-tlv-frr ./le test integration interop
#
# WHAT THE SCENARIO MEASURES. The raw injector announces one SRv6 L3VPN route
# (ipv4/mpls-vpn) whose Prefix-SID carries the SRv6 L3 Service TLV twice.
# RFC 8669 Section 6: "if a recognized TLV appears more than once in a BGP
# Prefix-SID attribute while the specification only allows for a single
# occurrence, then all the occurrences of the TLV other than the first one
# SHALL be discarded and the Prefix-SID attribute will continue to be
# processed." ze does that once, at ingest (discardRepeatedPrefixSIDTLVs,
# internal/component/bgp/reactor/rfc8669_duplicate_tlv.go, called from
# publishBase), so the route ze relays carries the first TLV only.
#
# FRR IS THE JUDGE. FRR's parser refuses a second type-5 TLV ("Prefix SID SRv6
# L3VPN field repeated") and resets the session with a NOTIFICATION (Malformed
# Attribute List). So a relay that copied the attribute as received fails the
# session and route assertions, and a relay that kept the wrong TLV fails the
# SID assertion.
#
# THE RELAY IS bgp-rs, as in as-path-mixed-width-relay-frr: ForwardUpdate to
# buildFwdBody. The injector is external (AS 65004) and FRR internal (AS 65001),
# so RFC 8669 Section 8 lets the Prefix-SID reach FRR with no propagate leaf.
#
# WHY THE INJECTOR SETS accept-srv6-prefix-sid. RFC 8669 Section 4 has ze
# discard a Prefix-SID received from an external peer unless configured to
# accept it, and without the leaf the attribute never reaches the Section 6
# step: FRR would hold the route with no SID at all, and the scenario would
# measure the Section 4 discard instead of the Section 6 one.
plugin {
	internal rs {
		use bgp-rs;
	}
	# The injector announces before FRR connects, so the route reaches FRR
	# through the peer-up REPLAY, which the route server asks adj-rib-in for.
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			# RFC 8669 Section 4: accept the attribute from this eBGP peer.
			accept-srv6-prefix-sid true;
			family {
				ipv4/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			receive [ update-received state ]
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			send [ update ]
		}
	}
}
