# RFC 9234 Section 5 egress rule 1 against a real receiver.
#
# Ze (AS 65001) is the PROVIDER of FRR (AS 65002), so FRR is an RS-Client and a
# Customer -- both are destination roles rule 1 names -- and every route Ze
# advertises to it must carry the OTC Attribute. Ze relays those routes from a
# raw injector, so the rule is exercised on a forwarding rail rather than on a
# locally originated route.
#
# The injector carries NO role block on purpose: rule 1 is conditioned on the
# DESTINATION alone, so a source with no role configuration must not suppress the
# stamp.
#
# WHY THE ROUTE-SERVER RAIL (rs-client on both peers, RFC 7947). It is what makes
# the NEGATIVE half observable at all. On the plain forward rail Ze attaches a
# 9-byte AS_PATH-only attribute set to a relayed withdraw-only UPDATE, and FRR
# 10.3.1 answers ANY such message with "Missing well-known attribute NEXT_HOP" and
# "rcvd UPDATE with errors in attr(s)!! Withdrawing route" -- whether or not an OTC
# Attribute is present. A stamped and an unstamped withdrawal are then
# indistinguishable to the receiver, which is the vacuity trap in
# ai/rules/interop-and-goal-validation.md. That AS_PATH-on-a-withdrawal shape is a
# separate defect with a separate producer -- `(*ASPathEdit).recordPrepend` in
# internal/component/bgp/wireu/aspath_slot.go synthesises the attribute when the
# payload carries none -- homed on plan/spec-rfc7606-5-1-2-relay-shape.md. It is
# not this scenario's subject and this scenario does not bless it.
#
# Under RFC 7947 Section 2.2.2 transparency the route server rewrites nothing, so
# the relayed withdrawal reaches FRR byte-identical to what the injector sent:
# attrLen=0, no attribute of any code. FRR parses it cleanly. An OTC Attribute
# would be the ONLY thing in it, and FRR would then report exactly the two error
# lines above -- so the negative below is sharp in both directions.
plugin {
	internal role {
		use bgp-role;
	}
	internal rib {
		use bgp-rib;
	}
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# A declared RFC 9234 role requires each bound chain to name a filter that
	# can refuse a path through a transit provider (RFC 7454 Section 9). What
	# this test exercises is elsewhere, so the decision is recorded and the
	# filter is left deactivated: the chain names it, and it never runs.
	policy {
		reject-asn NO-TRANSIT {
			indirect [ 3356 ]
		}
	}
	filter {
		import [ NO-TRANSIT ]
		export [ NO-TRANSIT ]
		inactive: import NO-TRANSIT
		inactive: export NO-TRANSIT
	}
	# The raw injector. Ze dials it (accept false) exactly as the plugin .ci suite
	# does, because ze-test peer listens rather than connects in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			# rs-client DEFAULTS TO FALSE and is the only thing that selects the
			# non-prepending path (reactor_api_forward.go gates on
			# `facts.isEBGP && !facts.rsClient`). Same trap scenario 47 records.
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		# Ze's Role toward this peer is Provider, so FRR is a Customer and
		# RFC 9234 Section 5 egress rule 1 applies to everything sent to it.
		role {
			import provider;
		}
	}
}
