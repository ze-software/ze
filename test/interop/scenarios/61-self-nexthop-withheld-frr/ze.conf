# RFC 4271 Section 5.1.3 against a real receiver.
#
#     "A route originated by a BGP speaker SHALL NOT be advertised to a peer
#      using an address of that peer as NEXT_HOP."
#
# Ze (AS 65001) relays between a raw injector (AS 65004) and FRR (AS 65002), the
# same eBGP rail scenarios 52 and 53 use. The injector announces TWO prefixes and
# the only difference between them is the NEXT_HOP:
#
#   10.11.0.0/24  NEXT_HOP 172.30.0.3  -- FRR's OWN address. Ze must withhold it.
#   10.12.0.0/24  NEXT_HOP 172.30.0.9  -- the injector. Ze must relay it.
#
# NEITHER PEER CARRIES `next-hop self`, and that is the whole scenario. The
# next-hop mode stays at its default, nhModeNone, so applyFactsNextHop records
# nothing and the address the injector chose is the address Ze would put on FRR's
# wire. That is the third-party NEXT_HOP Section 5.1.3 case 2 permits, and it is
# how a relay comes to tell one peer to reach a destination through itself.
#
# rs-fast-path is DELIBERATELY ABSENT, unlike scenarios 52 and 53. Its absence
# selects the GENERAL forward rail (forwardUpdateCore, reactor_api_forward.go)
# rather than the route-server fast rail (reactorForwardRS, forward_rs.go). Both
# rails carry the gate and the unit tests hold them to the same answer; this
# scenario proves the one an ordinary deployment runs.
plugin {
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# The raw injector. Ze dials it (accept false) exactly as the plugin .ci
	# suite does, because ze-test peer listens rather than connects in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
