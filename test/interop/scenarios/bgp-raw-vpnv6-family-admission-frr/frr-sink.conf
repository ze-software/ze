frr defaults traditional
hostname raw-vpnv6-frr-sink
log file /tmp/frr.log informational
!
router bgp 65002
 bgp router-id 172.30.0.15
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 172.30.0.11 remote-as 65001
 neighbor 172.30.0.11 disable-connected-check
 neighbor 172.30.0.11 passive
 neighbor 172.30.0.11 timers 3 90
 address-family ipv4 unicast
  neighbor 172.30.0.11 activate
 exit-address-family
!
