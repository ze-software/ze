# AC-27 (RFC 4659 Section 3.4 / RFC 4760 Section 8): raw UPDATE family admission.
# frr-vpnv6 negotiates ipv4/unicast and ipv6/mpls-vpn; frr-v4only negotiates ipv4/unicast only.
bgp {
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer frr-vpnv6 {
		connection {
			remote { ip 172.30.0.10; connect false; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			capability { graceful-restart disable; }
			family {
				ipv4/unicast { prefix { maximum 100; } }
				ipv6/mpls-vpn { prefix { maximum 100; } }
			}
		}
		timer { receive-hold-time 90; }
	}
	peer frr-v4only {
		connection {
			remote { ip 172.30.0.11; connect false; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			capability { graceful-restart disable; }
			family {
				ipv4/unicast { prefix { maximum 100; } }
			}
		}
		timer { receive-hold-time 90; }
	}
}
