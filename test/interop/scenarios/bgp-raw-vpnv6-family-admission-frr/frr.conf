frr defaults traditional
hostname raw-vpnv6-frr
log file /tmp/frr.log informational
!
! Dual-stack underlay so FRR's eth0 has an IPv6 address for bgp_nexthop_set
! when address-family ipv6 vpn is active on the IPv4 peer, and resolves the
! VPNv6 next hop 2001:db8:ffff::1.
ipv6 route 2001:db8:ffff::1/128 fd00:1e:0::2
!
router bgp 65002
 bgp router-id 172.30.0.3
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 172.30.0.10 remote-as 65001
 neighbor 172.30.0.10 disable-connected-check
 neighbor 172.30.0.10 passive
 neighbor 172.30.0.10 timers 3 90
 address-family ipv4 unicast
  neighbor 172.30.0.10 activate
 exit-address-family
 address-family ipv6 vpn
  neighbor 172.30.0.10 activate
 exit-address-family
!
