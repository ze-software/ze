# Ze side of the ospf-redist-static-tag-frr interop scenario
# (spec-static-route-tag-reaches-no-consumer).
#
# Ze forms a point-to-point OSPFv2 adjacency with FRR over the shared Docker
# bridge (eth0), then redistributes two static routes into OSPF. One route
# carries `tag 4242`; the other carries no tag. The `ospf filter export` chain
# names a modify instance that sets `tag 7` on an untagged static route
# (`match { tag [ 0 ]; }`), the shape `ze config migrate` writes for the retired
# per-source `tag 7`.
#
# FRR reads the two AS-External-LSAs and reports the External Route Tag of each,
# which is what the scenario asserts:
#   10.99.0.0/24 -> 4242, the route's own tag, which the filter does not match
#   10.98.0.0/24 -> 7,    a route with no tag takes the tag the filter sets

static {
	table default {
		route 10.99.0.0/24 {
			tag 4242
			next {
				hop 172.30.0.3 {
				}
			}
		}
		route 10.98.0.0/24 {
			next {
				hop 172.30.0.3 {
				}
			}
		}
	}
}

policy {
	modify ospf-export-static-tag {
		match {
			protocol [ static ];
			tag [ 0 ];
		}
		set {
			tag 7;
		}
	}
}

ospf {
	router-id 172.30.0.2
	filter {
		export {
			filters [ ospf-export-static-tag ];
			final accept;
		}
	}
	redistribute {
		static {
		}
	}
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
	}
}

redistribute {
	destination ospf {
		import static
	}
}

# The `redistribute` root auto-loads the orchestrator, which lives in the BGP
# engine and refuses to build a reactor with no `bgp` block. The session carries
# nothing this scenario reads: it exists so the daemon starts, and FRR runs a
# matching `router bgp 65002` so neither side retries into a log full of
# connection failures.
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
