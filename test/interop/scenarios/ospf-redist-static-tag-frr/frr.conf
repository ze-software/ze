frr defaults traditional
hostname frr-ospf-redist-tag
log file /tmp/frr.log informational
!
! OSPFv2 point-to-point on the shared L2 bridge to Ze (eth0). Same area 0.0.0.0,
! so the adjacency forms and FRR receives the AS-External-LSAs Ze originates for
! the redistributed static routes. FRR reports the External Route Tag of each in
! `show ip ospf database external`, which is what the scenario reads.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
!
! An eBGP peer toward Ze. The scenario reads nothing from it: it exists because
! Ze's `redistribute` root loads the BGP engine, which needs a `bgp` block, and a
! peer with nobody on the far side would retry for the length of the run.
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
