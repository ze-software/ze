# Ze side of the ospf-ldp-sync-frr interop scenario (spec-ospf-ext-11, RFC 5443).
#
# Ze forms a point-to-point OSPFv2 adjacency AND an LDP session with FRR over the
# shared Docker/QEMU bridge (eth0). LDP-IGP synchronization is enabled on eth0 with a
# hold-down, so:
#   * while LDP is converging, Ze advertises the eth0 link at LSInfinity (0xFFFF), which
#     FRR observes in Ze's Router-LSA (transit traffic avoids the un-labeled link);
#   * once the LDP session is operational and the hold-down expires, Ze restores the
#     configured cost (10) and FRR observes the link at 10.
# Ze advertises a passive loopback so FRR has a prefix whose path crosses eth0.

ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
			ldp-sync {
				enable true
				holddown 20
			}
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}

ldp {
	lsr-id 172.30.0.2
	transport-address 172.30.0.2
	interfaces eth0
}
