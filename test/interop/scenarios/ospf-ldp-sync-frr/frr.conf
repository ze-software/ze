frr defaults traditional
hostname frr-ospf-ldp-sync
log file /tmp/frr.log informational
!
! Point-to-point OSPFv2 on the shared bridge to Ze (eth0), area 0.0.0.0, so the
! adjacency forms and FRR carries Ze's Router-LSA (from which the eth0 link metric
! is observed transitioning 0xFFFF -> configured while LDP-IGP sync converges).
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
!
! FRR ldpd: establish the LDP session with Ze over eth0 so Ze's LDP-IGP sync sees
! an operational session and (after the hold-down) restores the eth0 cost.
mpls ldp
 router-id 172.30.0.3
 !
 address-family ipv4
  discovery transport-address 172.30.0.3
  interface eth0
 exit-address-family
!
