# RFC 9234 Section 3.1 against a real Provider. Ze's role toward the injector
# is rs, so the injector is an RS-Client, and the OTC egress filter
# (`OTCEgressFilter`, internal/component/bgp/plugins/role/otc.go) refuses its
# routes toward FRR, Ze's Provider. The injector's `export [ provider ]` lets
# the role export policy pass the route, so only that filter can withhold it;
# test/plugin/rfc9234-rs-client-learned-not-upward.ci pins the same rule.
#
# Ze originates 10.77.4.0/24 from a static route: FRR holding it proves the
# session carries Ze's routes, so the injected route's absence is a verdict.
#
# bgp-rs replays what bgp-adj-rib-in holds to a peer that comes up after the
# route arrived, and the injector sends as soon as its session opens, so
# adj-rib-in is attached to both peers, as in the .ci twin. Without it FRR,
# coming up later, is replayed nothing and the route's absence proves nothing.
plugin {
	internal role {
		use bgp-role;
	}
	internal rs {
		use bgp-rs;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
	internal bgp-rib {
		use bgp-rib;
	}
}
static {
	table default {
		route 10.77.4.0/24 {
			next {
				hop 172.30.0.1 {
				}
			}
		}
	}
}
redistribute {
	destination bgp {
		import static {
			family [ ipv4/unicast ];
		}
	}
}
	policy {
		reject-asn NO-TRANSIT {
			indirect [ 3356 ]
		}
	}

bgp {
	# A declared RFC 9234 role requires each bound chain to name a filter that
	# can refuse a path through a transit provider (RFC 7454 Section 9). It is
	# left deactivated: the chain names it, and it never runs.
	filter {
		import { filters [ inactive:NO-TRANSIT ]; final accept; }
		export { filters [ inactive:NO-TRANSIT ]; final accept; }
	}
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		role {
			import rs;
			export [ provider ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process adj-rib-in {
			receive [ update-received state ];
		}
		attach process bgp-rib {
			receive [ update-received state ];
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		role {
			import customer;
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process adj-rib-in {
			send [ update ];
		}
	}
}
