frr defaults traditional
hostname frr
!
! FRR is Ze's PROVIDER (RFC 9234 Section 4.2: Ze's Customer pairs with
! Provider here). It originates nothing: every route it holds came from Ze.
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 local-role provider
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
