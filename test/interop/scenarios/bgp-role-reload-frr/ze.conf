# Load the capability plugin before it has a Role to declare. Only the Role
# block differs in ze-reload.conf; the same running daemon performs both reloads.
bus {
	endpoint bgp-role {
		internal bgp-role;
	}
}
bgp {
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family { ipv4/unicast { prefix { maximum 10000; } } }
		}
	}
}
