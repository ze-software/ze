# Ze side of the bgp-bfd-strict-reload-speaker interop scenario, AFTER the
# reload (spec-bgp-bfd-strict, draft-ietf-idr-bgp-bfd-strict-mode).
#
# The checker copies this file over the running config and sends SIGHUP. It
# differs from ze.conf in one thing: the strict peer to 172.30.0.10, the address
# the pinned session above already holds Up. That peer is created by the reload,
# subscribes to a session that is already Up, and will never see another
# transition. Without the Subscribe snapshot it reads Down forever, withholds
# its KEEPALIVE under Section 8.5.5, and never establishes.
bfd {
	enabled true;
	profile fast {
		detect-multiplier 3;
		desired-min-tx-us 300000;
		required-min-rx-us 300000;
	}
	single-hop-session 172.30.0.10 {
		local 172.30.0.2;
		profile fast;
	}
}

bgp {
	peer idle {
		connection {
			remote {
				ip 172.30.0.99;
				connect false;
			}
			local {
				ip 172.30.0.2;
			}
		}
		session {
			asn {
				local 65001;
				remote 65099;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
			}
		}
	}

	peer speaker {
		connection {
			remote {
				# connect false: the speaker dials ze, as in the sibling scenarios.
				ip 172.30.0.10;
				connect false;
			}
			local {
				ip 172.30.0.2;
			}
			bfd {
				enabled true;
				mode single-hop;
				profile fast;
				strict true;
				hold-time 30;
				hold-down 300;
			}
		}
		session {
			asn {
				local 65001;
				remote 65003;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
			}
		}
	}
}
