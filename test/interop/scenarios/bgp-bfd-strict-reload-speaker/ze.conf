# Ze side of the bgp-bfd-strict-reload-speaker interop scenario, BEFORE the
# reload (spec-bgp-bfd-strict, draft-ietf-idr-bgp-bfd-strict-mode).
#
# This is the PRE-UP path: a strict peer that subscribes to a BFD session which
# is ALREADY Up. Nothing else in the lab reaches it, because a peer and a pinned
# session created by one daemon start subscribe before BFD can come up.
#
# The arrangement: this file holds the pinned session and NO peer to the
# speaker, so BFD reaches Up against the speaker's responder while no BGP peer
# exists. The checker then copies ze-reload.conf over the running config and
# sends SIGHUP. applyPinned keeps the live handle of an unchanged pinned entry,
# so the session stays Up across the reload, and the strict peer the reload adds
# subscribes to a session that has no further transition to give it. Only the
# Subscribe snapshot can tell it the session is Up.
#
# The `local` leaf makes the pinned entry's api.SessionRequest.Key match the
# peer's, so the engine holds ONE session at refcount 2. That is RFC 5882
# Section 4.4 end to end, and the checker reads the refcount.
#
# The peer to 172.30.0.99 is here so BGP is running and listening before the
# reload. Nothing answers at that address; it never leaves its connect retry.
bfd {
	enabled true;
	profile fast {
		detect-multiplier 3;
		desired-min-tx-us 300000;
		required-min-rx-us 300000;
	}
	single-hop-session 172.30.0.10 {
		local 172.30.0.2;
		profile fast;
	}
}

bgp {
	peer idle {
		connection {
			remote {
				ip 172.30.0.99;
				connect false;
			}
			local {
				ip 172.30.0.2;
			}
		}
		session {
			asn {
				local 65001;
				remote 65099;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
			}
		}
	}
}
