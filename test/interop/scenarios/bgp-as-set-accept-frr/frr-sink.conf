frr defaults traditional
hostname frr-as-set-accept-sink
log file /tmp/frr.log informational
!
! The twin of frr.conf. This router aggregates the two contributors frr sends
! it (10.99.1.0/24 as 65002 65201, 10.99.2.0/24 as 65002 65202) into
! 10.99.0.0/16 with the path 65002 {65201,65202}, and sends it to ze's peer
! that has no `as-set` leaf, as 65005 65002 {65201,65202}. Ze treats that
! route as withdrawn (RFC 9774 Section 3). 10.95.2.0/24 is this router's
! control route to ze, on the same session.
!
! It also sends frr the contributors of frr's aggregate, 10.98.1.0/24 and
! 10.98.2.0/24, each with its own extra AS so that aggregate holds a set.
!
router bgp 65005
 bgp router-id 172.30.0.15
 no bgp ebgp-requires-policy
 no bgp reject-as-sets
 no bgp network import-check
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.3 remote-as 65002
 !
 address-family ipv4 unicast
  network 10.95.2.0/24
  network 10.98.1.0/24
  network 10.98.2.0/24
  aggregate-address 10.99.0.0/16 as-set summary-only
  neighbor 172.30.0.2 activate
  neighbor 172.30.0.2 prefix-list TO-ZE out
  neighbor 172.30.0.3 activate
  neighbor 172.30.0.3 route-map TO-FRR out
 exit-address-family
!
ip prefix-list TO-ZE seq 10 permit 10.99.0.0/16
ip prefix-list TO-ZE seq 20 permit 10.95.2.0/24
ip prefix-list TO-ZE seq 30 deny 0.0.0.0/0 le 32
ip prefix-list FRR-1 seq 10 permit 10.98.1.0/24
ip prefix-list FRR-2 seq 10 permit 10.98.2.0/24
!
route-map TO-FRR permit 10
 match ip address prefix-list FRR-1
 set as-path prepend 65101
route-map TO-FRR permit 20
 match ip address prefix-list FRR-2
 set as-path prepend 65102
route-map TO-FRR deny 30
!
