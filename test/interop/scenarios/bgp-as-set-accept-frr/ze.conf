# `session as-set accept` keeps a received AS_SET; a peer without it treats the
# route as withdrawn. Judged on routes FRR itself built with an AS_SET.
#
#     INTEROP_SCENARIO=bgp-as-set-accept-frr ./le test integration interop
#
# RFC 9774 Section 3: "Unless explicitly configured by a network operator to do
# otherwise (e.g., during a transition phase), BGP speakers: MUST NOT advertise
# BGP UPDATE messages containing AS_SETs or AS_CONFED_SETs and MUST use the
# "treat-as-withdraw" error handling behavior per [RFC7606] upon reception of
# BGP UPDATE messages containing AS_SETs or AS_CONFED_SETs in the AS_PATH or
# AS4_PATH [RFC6793]." The leaf is that operator configuration, which
# `ze exabgp migrate` writes for an ExaBGP neighbor with `as-set accept`.
#
# frr (AS 65002) sends 10.98.0.0/16 with the path 65002 65005 {65101,65102} to
# the peer that has the leaf, so ze's RIB holds it. frr-sink (AS 65005) sends
# 10.99.0.0/16 with the path 65005 65002 {65201,65202} to the peer that has no
# leaf, so ze treats it as withdrawn. Each also sends a control route,
# 10.95.1.0/24 and 10.95.2.0/24. Ze sends neither router anything.
plugin {
	internal rib {
		use bgp-rib;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			as-set accept;
		}
		attach process rib {
			receive [ update-received state ]
		}
	}
	peer frr-sink {
		connection {
			remote { ip 172.30.0.15; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65005; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rib {
			receive [ update-received state ]
		}
	}
}
