frr defaults traditional
hostname frr-as-set-accept
log file /tmp/frr.log informational
!
! FRR builds a real AS_SET and sends it to ze's peer that has `session as-set
! accept`. frr-sink (172.30.0.15, AS 65005) sends this router 10.98.1.0/24 and
! 10.98.2.0/24 with different paths (65005 65101, 65005 65102); the
! summary-only aggregate below folds them into 10.98.0.0/16 with the path
! 65005 {65101,65102} and sends it to ze as 65002 65005 {65101,65102}.
!
! `no bgp reject-as-sets` is stated, not left to the default: with the knob on,
! FRR builds no AS_SET for an as-set aggregate.
!
! 10.99.1.0/24 and 10.99.2.0/24 are the contributors frr-sink aggregates for
! its own session to ze (the twin, without the leaf). 10.95.1.0/24 is this
! router's control route to ze.
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 no bgp reject-as-sets
 no bgp network import-check
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.15 remote-as 65005
 !
 address-family ipv4 unicast
  network 10.95.1.0/24
  network 10.99.1.0/24
  network 10.99.2.0/24
  aggregate-address 10.98.0.0/16 as-set summary-only
  neighbor 172.30.0.2 activate
  neighbor 172.30.0.2 prefix-list TO-ZE out
  neighbor 172.30.0.15 activate
  neighbor 172.30.0.15 route-map TO-SINK out
 exit-address-family
!
ip prefix-list TO-ZE seq 10 permit 10.98.0.0/16
ip prefix-list TO-ZE seq 20 permit 10.95.1.0/24
ip prefix-list TO-ZE seq 30 deny 0.0.0.0/0 le 32
ip prefix-list SINK-1 seq 10 permit 10.99.1.0/24
ip prefix-list SINK-2 seq 10 permit 10.99.2.0/24
!
route-map TO-SINK permit 10
 match ip address prefix-list SINK-1
 set as-path prepend 65201
route-map TO-SINK permit 20
 match ip address prefix-list SINK-2
 set as-path prepend 65202
route-map TO-SINK deny 30
!
