frr defaults traditional
hostname frr-ospf-ext
log file /tmp/frr.log informational
!
! OSPFv2 point-to-point on the shared L2 bridge to Ze (eth0), area 0.0.0.0. FRR enables the
! opaque-LSA capability and Segment Routing, so its ospfd originates RFC 7684 Extended Prefix
! Opaque LSAs (Opaque type 7, carrying a Prefix-SID sub-TLV for the loopback) and Extended Link
! Opaque LSAs (Opaque type 8). Ze must set the O-bit, keep the adjacency Full, accept and
! flood FRR's Extended Prefix/Link LSAs, and decode them (skipping FRR's SR sub-TLVs as unknown
! without ext-5). FRR must accept and flood Ze's empty-container Extended Prefix/Link LSAs.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ! The Prefix-SID's prefix must be on a loopback: FRR's sr_prefix_sid looks the prefix up
 ! on an interface and, finding none, defers flooding it, so no Extended Prefix LSA exists.
 ip address 10.255.255.3/32
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
 capability opaque
 ! FRR accepts this line only under router ospf: at top level it is refused, SR stays
 ! off, and FRR then originates no Extended Prefix or Extended Link LSA.
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing node-msd 8
 segment-routing prefix 10.255.255.3/32 index 100
!
