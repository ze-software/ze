# Ze side of the ospf-ext-prefix-link-frr interop scenario (spec-ospf-ext-4, RFC 7684).
#
# Ze enables the opaque-LSA capability (required to carry the Extended Prefix / Extended Link
# Opaque LSAs, Opaque type 7/8) and enables `extended-prefix` and `extended-link`. On a
# point-to-point OSPFv2 adjacency with FRR over the shared Docker bridge (eth0, area 0.0.0.0),
# Ze originates an Extended Prefix Opaque LSA (Opaque type 7) for its connected prefixes and an
# Extended Link Opaque LSA (Opaque type 8) mirroring its Router-LSA link. These are empty
# containers (no sub-TLVs, since Ze has no Segment Routing producer yet); FRR must accept and
# flood them, and the adjacency must stay Full. Ze in turn decodes FRR's Extended Prefix/Link
# LSAs (including FRR's SR sub-TLVs, skipped as unknown) and shows them decoded under
# `show ospf database opaque-area`.

ospf {
	router-id 172.30.0.2
	opaque true
	extended-prefix true
	extended-link true
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
