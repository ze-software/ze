log stderr all;
router id 172.30.0.4;

protocol device {
}

protocol bgp ze_peer {
	# `debug { states }` makes BIRD write one `State changed to up` trace line
	# per establishment to stderr, and docker keeps that log for the whole run.
	# Stderr is append-only, which is what lets the internal/le/interoplab/bgp checker assert the
	# session came
	# up exactly once; it reads the last 2000 lines of it, and BIRD writes about
	# five. `Last error` cannot carry that: BIRD CLEARS it when the session
	# re-establishes (measured on BIRD 2.15.1, 2026-08-05), so a NOTIFICATION
	# followed by a reconnect leaves `show protocols all` clean.
	debug { states };
	# BIRD is the only side that dials here: ze.conf sets `connect false`, so
	# ze listens and never initiates. This delay is therefore the whole
	# establishment barrier, and it is a CONFIGURED one rather than a race.
	# BIRD's default is 5 seconds, which left the plugin about 5.7s to announce
	# on the queue rail; a cold run measured on 2026-08-05 lost that race.
	# 30 seconds covers the plugin's startup on a loaded runner. It also puts a
	# FLOOR under the harness `SESSION_TIMEOUT`, which is what the internal/le/interoplab/bgp checker
	# spends
	# waiting for this session: a budget below 40 cannot cover a 30-second
	# delay, and at 20 the run fails 100% with `BIRD protocol ze_peer not
	# Established`, naming no cause. This file is not templated and cannot read
	# that knob, so `_check_session_budget` (the internal/le/interoplab/bgp checker) reads THIS LINE
	# and fails
	# early with the floor when the budget is under it.
	connect delay time 30;
	local 172.30.0.4 as 65002;
	neighbor 172.30.0.2 as 65001;
	ipv4 {
		import all;
		export none;
	};
}
