plugin {
	external announce-api-origin {
		run /etc/ze/announce-api-origin.py;
		encoder json;
	}
}
bgp {
	peer peer1 {
		connection {
			# `connect false` makes ze PASSIVE: it listens and never dials.
			# The queue rail is only reached while the session is down, so the
			# scenario needs the establishment to happen at a time it chose.
			# With both ends dialing that time is a race: ze starts before BIRD
			# and retries with exponential backoff (5s..60s,
			# internal/component/bgp/reactor/peer_run.go), so whichever side
			# dialed first decided the rail. Measured 2026-08-05: 1 run in 6
			# established ~20s early and the guard in announce-api-origin.py
			# fired. With ze passive, the ONLY route to Established is BIRD's
			# dial, which bird.conf holds for 30 seconds.
			remote { ip 172.30.0.4; connect false; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process announce-api-origin {
			send [ update ];
		}
	}
}
