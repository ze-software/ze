# RFC 2545 Section 3's "if and only if" against a real receiver (FRR 10.3.1).
#
# Ze (AS 65001) announces TWO IPv6 prefixes to FRR (AS 65002) on ONE session, with
# ONE `link-local` leaf. Each prefix identifies one case: a global next hop on
# the shared IPv6 subnet or a global next hop outside every connected subnet.
#
#   on-link  next hop fd00:1e:0::2 -- Ze's own address on the lab's IPv6 /64
#   off-link next hop 2001:db8:ffff::1 -- an address on no locally connected prefix
#
# The recipient fd00:1e:0::3 shares that SAME /64 with Ze and the on-link next hop.
# The harness renders both session endpoints and the on-link next hop onto its
# selected IPv6 network. The routes use the same session but different prefixes
# and global next hops: FRR must decode 32 octets (global + link-local) for the
# on-link route and 16 octets (global alone) for the off-link route.
#
# The `link-local` leaf SUPPLIES the address; it does not decide inclusion. That
# decision is `linkScope.linkLocalNextHop` (internal/component/bgp/reactor/link_scope.go),
# which reads the host interface table. A leaf that decided inclusion would put the
# same second address on both routes, which is what this scenario refuses.
#
# The harness renders @ZE_LINK_LOCAL@ from the selected lab prefix and Ze's host
# number, and assigns that address to Ze's eth0 before starting the daemon.
# FRR must both decode this owned address and install the on-link route via it.
bgp {
	peer frr {
		connection {
			remote { ip fd00:1e:0::3; }
			local  { ip fd00:1e:0::2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			link-local @ZE_LINK_LOCAL@;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv6/unicast { prefix { maximum 10000; } }
			}
		}
		update {
			attribute {
				origin igp;
				next-hop fd00:1e:0::2;
			}
			nlri {
				ipv6/unicast add 2001:db8:5601::/48;
			}
		}
		update {
			attribute {
				origin igp;
				next-hop 2001:db8:ffff::1;
			}
			nlri {
				ipv6/unicast add 2001:db8:5602::/48;
			}
		}
	}
}
