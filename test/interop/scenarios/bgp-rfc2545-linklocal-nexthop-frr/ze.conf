# RFC 2545 Section 3's "if and only if" against a real receiver (FRR 10.3.1).
#
# Ze (AS 65001) announces TWO IPv6 prefixes to FRR (AS 65002) on ONE session, with
# ONE `link-local` leaf. The two update blocks differ in ONE variable: the route's
# global next hop.
#
#   on-link  next hop fd00:1e:0::2  -- ze's own address on the lab's IPv6 /64, so
#                                      it lies inside a locally connected prefix
#   off-link next hop 2001:db8:ffff::1 -- an address on no locally connected prefix
#
# The peer half of the Section 3 condition holds for both, because the session
# address 172.30.0.3 lies on the lab's connected /24. So the two routes differ only
# in the next-hop half, and the wire form FRR reports is the answer to that half
# alone: 32 octets (global + link-local) for on-link, 16 (global) for off-link.
#
# The `link-local` leaf SUPPLIES the address; it does not decide inclusion. That
# decision is `linkScope.linkLocalNextHop` (internal/component/bgp/reactor/link_scope.go),
# which reads the host interface table. A leaf that decided inclusion would put the
# same second address on both routes, which is what this scenario refuses.
#
# The address is synthetic on purpose. Section 3 does not require the link-local of
# the next hop to be the sender's own kernel address, and a derived one would tie
# this scenario to docker's MAC allocation. FRR reports what it received either way.
bgp {
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			link-local fe80::be:ef:2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv6/unicast { prefix { maximum 10000; } }
			}
		}
		update {
			attribute {
				origin igp;
				next-hop fd00:1e:0::2;
			}
			nlri {
				ipv6/unicast add 2001:db8:5601::/48;
			}
		}
		update {
			attribute {
				origin igp;
				next-hop 2001:db8:ffff::1;
			}
			nlri {
				ipv6/unicast add 2001:db8:5602::/48;
			}
		}
	}
}
