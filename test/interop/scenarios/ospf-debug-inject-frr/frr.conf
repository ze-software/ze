frr defaults traditional
hostname frr-ospf-debug-inject
log file /tmp/frr.log informational
!
! OSPFv2 P2P to Ze (eth0) with opaque capability so FRR accepts and files the
! Ze-injected area-scope opaque LSA (RFC 5250) in its opaque-area database.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 capability opaque
 passive-interface lo
