# Ze side of the ospf-debug-inject-frr interop scenario (spec-ospf-ext-14, RFC 5250).
#
# Ze forms a point-to-point OSPFv2 adjacency with FRR ospfd. Opaque capability is
# required so the debug-injected Private-Use (Type 250) area-scope opaque LSA floods to
# FRR (RFC 5250 sec 3.1: only to opaque-capable neighbours). Debug injection itself is
# off by default and enabled at runtime by the check via `debug ospf inject enable`.
ospf {
	router-id 172.30.0.2
	opaque true
	areas { area 0.0.0.0 { area-type normal } }
	interfaces {
		interface eth0 { area 0.0.0.0 network-type point-to-point cost 10 }
		interface lo { area 0.0.0.0 passive true }
	}
}
