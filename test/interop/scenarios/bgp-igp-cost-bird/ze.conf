# iBGP IGP-cost best-path selection and cost-change reselection for
# spec-fib-depth AC-1 and AC-13 (RFC 4271 Section 9.1.2.2(e)).
#
# Anti-vacuity: FRR (.3, lower Router ID and lower Peer IP) advertises
# 10.210.0.0/24 with NEXT_HOP 10.221.0.1 (IGP cost 20); GoBGP (.5, higher
# Router ID and higher Peer IP) advertises 10.210.0.0/24 with NEXT_HOP
# 10.222.0.1 (initial IGP cost 10). LOCAL_PREF 100, empty AS_PATH, ORIGIN igp,
# and MED 0 all tie. Specifying `interface eth0` makes MetricRecursive=false on
# the static routes so igpcost.resolve returns the exact configured metric.
#
# ze-reload.conf raises 10.222.0.0/24's metric from 10 to 30 so both Ze and
# BIRD must flip the selected path to .3 without dropping any BGP session.

bus {
	endpoint bgp-rib {
		internal bgp-rib;
	}
	endpoint rib {
		internal rib;
	}
	endpoint fib-kernel {
		internal fib-kernel;
	}
	endpoint connected {
		internal connected;
	}
	endpoint static {
		internal static;
	}
}

connected {
}

static {
	table default {
		route 10.221.0.0/24 {
			metric 20;
			next {
				hop 172.30.0.3 {
					interface eth0;
				}
			}
		}
		route 10.222.0.0/24 {
			metric 10;
			next {
				hop 172.30.0.5 {
					interface eth0;
				}
			}
		}
	}
}

bgp {
	router-id 172.30.0.2;
	filter {
		import { final accept; }
		export { final reject; }
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
