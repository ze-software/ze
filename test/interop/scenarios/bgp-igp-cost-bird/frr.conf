frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
ip route 10.210.0.0/24 Null0
!
route-map SET-NH permit 10
 set ip next-hop 10.221.0.1
 set local-preference 100
 set metric 0
 set origin igp
!
router bgp 65001
 bgp router-id 172.30.0.3
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.4 remote-as 65001
 !
 address-family ipv4 unicast
  network 10.210.0.0/24
  neighbor 172.30.0.2 activate
  neighbor 172.30.0.2 route-map SET-NH out
  neighbor 172.30.0.4 activate
  neighbor 172.30.0.4 route-map SET-NH out
 exit-address-family
!
