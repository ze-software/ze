# Reload config for bgp-igp-cost-bird (spec-fib-depth AC-13).
#
# Identical to ze.conf except 10.222.0.0/24's metric rises from 10 to 30,
# making FRR's path via 10.221.0.1 (cost 20) win over GoBGP's path via
# 10.222.0.1 (cost 30) with no BGP session reset.

bus {
	endpoint bgp-rib {
		internal bgp-rib;
	}
	endpoint rib {
		internal rib;
	}
	endpoint fib-kernel {
		internal fib-kernel;
	}
	endpoint connected {
		internal connected;
	}
	endpoint static {
		internal static;
	}
}

connected {
}

static {
	table default {
		route 10.221.0.0/24 {
			metric 20;
			next {
				hop 172.30.0.3 {
					interface eth0;
				}
			}
		}
		route 10.222.0.0/24 {
			metric 30;
			next {
				hop 172.30.0.5 {
					interface eth0;
				}
			}
		}
	}
}

bgp {
	router-id 172.30.0.2;
	filter {
		import { final accept; }
		export { final reject; }
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
