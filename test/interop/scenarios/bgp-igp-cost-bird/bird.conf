# BIRD 3.4.0 independent judge for spec-fib-depth AC-1 and AC-13.
#
# Both iBGP sessions (peer_a from FRR .3, peer_b from GoBGP .5) resolve their
# recursive NEXT_HOPs through master4. Static routes carry explicit igp_metric
# (EA_GEN_IGP_METRIC), which rt_get_igp_metric feeds to bgp_rte_better
# (proto/bgp/attrs.c). Enabling igp_cost_b_expensive and disabling
# igp_cost_b_cheap flips BIRD's winner from peer_b (10 < 20) to peer_a (20 < 30).
log stderr all;
router id 172.30.0.4;

protocol device {
}

protocol direct {
	ipv4;
	interface "eth*";
}

protocol static igp_cost_a {
	ipv4;
	route 10.221.0.0/24 via 172.30.0.3 {
		igp_metric = 20;
	};
}

protocol static igp_cost_b_cheap {
	ipv4;
	route 10.222.0.0/24 via 172.30.0.5 {
		igp_metric = 10;
	};
}

protocol static igp_cost_b_expensive {
	disabled yes;
	ipv4;
	route 10.222.0.0/24 via 172.30.0.5 {
		igp_metric = 30;
	};
}

protocol bgp peer_a {
	local 172.30.0.4 as 65001;
	neighbor 172.30.0.3 as 65001;
	ipv4 {
		import all;
		export none;
		gateway recursive;
		igp table master4;
	};
}

protocol bgp peer_b {
	local 172.30.0.4 as 65001;
	neighbor 172.30.0.5 as 65001;
	ipv4 {
		import all;
		export none;
		gateway recursive;
		igp table master4;
	};
}
