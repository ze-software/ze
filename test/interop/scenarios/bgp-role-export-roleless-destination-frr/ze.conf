# Source export sets must reach a destination with no local role. FRR's OPEN
# advertises Customer: injector permits Customer, BIRD permits only Provider.
# Neither source sends OTC. Ze's own route is an independent delivery control.
plugin {
	internal role { use bgp-role; }
	internal rs { use bgp-rs; }
	internal adj-rib-in { use bgp-adj-rib-in; }
	internal bgp-rib { use bgp-rib; }
}
static {
	table default {
		route 10.77.4.0/24 { next { hop 172.30.0.1 {} } }
	}
}
policy { match redistribute-bgp-static { family [ ipv4/unicast ]; } }
redistribute {
	destination bgp { import static { filters [ redistribute-bgp-static ]; final accept; } }
}
bgp {
	filter { import { final accept; } export { final accept; } }
	peer injector {
		connection { remote { ip 172.30.0.9; } local { ip 172.30.0.2; accept false; } }
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family { ipv4/unicast { prefix { maximum 10000; } } }
		}
		role { import provider; export [ customer ]; }
		attach process rs { receive [ update-received state open-received refresh ]; }
		attach process adj-rib-in { receive [ update-received state ]; }
		attach process bgp-rib { receive [ update-received state ]; }
	}
	peer bird {
		connection { remote { ip 172.30.0.4; } local { ip 172.30.0.2; } }
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family { ipv4/unicast { prefix { maximum 10000; } } }
		}
		role { import provider; export [ provider ]; }
		# Sources have no send grant: FRR is the only forwarding destination,
		# so the export-set decision fence cannot come from another peer.
		attach process rs { receive [ update-received state open-received refresh ]; }
		attach process adj-rib-in { receive [ update-received state ]; }
		attach process bgp-rib { receive [ update-received state ]; }
	}
	peer frr {
		connection { remote { ip 172.30.0.3; } local { ip 172.30.0.2; } }
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family { ipv4/unicast { prefix { maximum 10000; } } }
		}
		# Deliberately no role here. The any-peer egress procedure must still
		# enforce each source's export set against FRR's advertised Customer.
		attach process rs { receive [ update-received state open-received refresh ]; send [ update ]; }
		attach process adj-rib-in { send [ update ]; }
	}
}
