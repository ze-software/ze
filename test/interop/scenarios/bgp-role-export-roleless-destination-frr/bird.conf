# BIRD sends the route the source's export set excludes toward FRR.
log stderr all;
router id 172.30.0.4;
protocol device {}
protocol static static_routes {
	ipv4;
	route 10.77.5.0/24 blackhole;
}
protocol bgp ze_peer {
	local 172.30.0.4 as 65003;
	neighbor 172.30.0.2 as 65001;
	ipv4 {
		import all;
		export filter {
			if proto != "static_routes" then reject;
			accept;
		};
	};
}
