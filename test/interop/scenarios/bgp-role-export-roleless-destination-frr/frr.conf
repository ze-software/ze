frr defaults traditional
hostname frr
!
! bgp_open_capability advertises Customer; bgp_role_violation permits Ze's
! missing Role without strict mode (FRR frr-10.7.1, bgpd/bgp_open.c).
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 local-role customer
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
