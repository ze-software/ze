frr defaults traditional
hostname frr-ospf-bfd
log file /tmp/frr.log informational
!
! OSPFv2 point-to-point on the shared bridge to Ze (eth0). `ip ospf bfd` tells
! ospfd to register the neighbor with bfdd, which opens an RFC 5881 IPv4
! single-hop session (UDP 3784, TTL 255 GTSM). Dead interval left at the default
! 40s so the BFD session detects a link loss far faster than the dead timer.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
 ip ospf bfd
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
!
! bfdd profile: 300 ms tx/rx, multiplier 3, matching the Ze side so the
! negotiated detect time is ~900 ms once out of slow-start.
bfd
 profile ospf-fast
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 !
!
