# Ze side of the ospf-bfd-frr interop scenario (spec-ospf-ext-10).
#
# Ze and FRR form a point-to-point OSPFv2 adjacency over the shared bridge and, on
# reaching Full, Ze opens an RFC 5881 IPv4 single-hop BFD session (UDP 3784, both ends
# Active, TTL 255 GTSM) against FRR's bfdd. The dead-interval is left at the default 40s
# so BFD's sub-second detection is demonstrably faster: cutting the link drives an OSPF
# neighbor-down within the BFD detection window (a few seconds), well under 40s.
#
# min-tx/min-rx are milliseconds in config (stored as microseconds); 300 ms with
# multiplier 3 gives a ~900 ms steady-state detect time once the session negotiates out
# of the RFC 5880 slow-start floor.

ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			hello-interval 10
			dead-interval 40
			cost 10
			bfd {
				enabled true
				min-tx 300
				min-rx 300
				multiplier 3
			}
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
