# Ze side of the ospfv3-bfd-frr interop scenario (spec-ospf-ext-10 AC-2b, AC-5, AC-12).
#
# Ze runs the OSPFv3 (IPv6) address family and forms a point-to-point OSPFv3 adjacency
# with FRR ospf6d over IPv6 link-local. On reaching Full, Ze opens an RFC 5881 IPv6
# single-hop BFD session (link-local pair, Hop-Limit 255 GTSM -- independent of base
# OSPFv3's Hop-Limit-1 multicast, learned 970) against FRR's bfdd. Cutting the link
# drives a v3 neighbor-down within the BFD detection window, well under the 40s dead
# interval. A dual-stack variant (v2 + v3 on one link) proves the two sessions are
# independent (distinct api.Key per RFC 5881 section 2, AC-12).

ospf {
	router-id 172.30.0.2
	address-family ipv6 {
		areas {
			area 0.0.0.0 {
				area-type normal
			}
		}
		interfaces {
			interface eth0 {
				area 0.0.0.0
				network-type point-to-point
				dead-interval 40
				cost 10
				bfd {
					enabled true
					min-tx 300
					min-rx 300
					multiplier 3
				}
			}
		}
	}
}
