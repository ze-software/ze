frr defaults traditional
hostname frr-ospfv3-bfd
log file /tmp/frr.log informational
!
! OSPFv3 (RFC 5340) point-to-point on the shared bridge to Ze (eth0). `ipv6 ospf6
! bfd` registers the neighbor with bfdd, which opens an RFC 5881 IPv6 single-hop
! session (UDP 3784 over the link-local pair, Hop-Limit 255 GTSM). Dead interval
! left at the default 40s so BFD detects a link loss far faster than the dead timer.
interface eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 bfd
!
router ospf6
 ospf6 router-id 172.30.0.3
!
bfd
 profile ospf6-fast
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 !
!
