frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! FRR announces 10.77.0.0/24 to ze from the start and advertises the Route
! Refresh capability (FRR's default). The checker attaches ze's adj-rib-in to
! the running session by reload; FRR must then receive one ROUTE-REFRESH and
! re-send the route, with its BGP session to ze never re-established.
!
ip route 10.77.0.0/24 Null0
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  redistribute static
 exit-address-family
!
