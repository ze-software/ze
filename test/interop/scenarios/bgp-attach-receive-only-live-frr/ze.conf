# Ze side of the bgp-attach-receive-only-live-frr interop scenario
# (spec-bgp-live-receive-binding-and-bfd-keep-session, AC-12 first half).
#
# bgp-adj-rib-in runs from boot with `receive { from [ /bus/endpoint/bgp-rib ]; }`
# and `send { to [ /bus/endpoint/bgp-rib ]; }`, so it completes its internal
# bgp-rib gate-query handshake while holding nothing for FRR. ze-reload.conf
# widens its receive filter to peer1 (`bgp:update` with `direction received`,
# and `bgp:state`) while keeping `send { to [ /bus/endpoint/bgp-rib ]; }`: a
# receive-only binding on peer1, which the reload delivers to the running
# session. FRR already announced its route and both sides negotiate Route
# Refresh, so ze asks FRR to re-send once per negotiated family (RFC 2918
# Section 4) instead of restarting the session.
bus {
	endpoint bgp-rib {
		internal bgp-rib;
	}
	endpoint bgp-adj-rib-in {
		internal bgp-adj-rib-in;
		receive {
			from [ /bus/endpoint/bgp-rib ];
		}
		send {
			to [ /bus/endpoint/bgp-rib ];
		}
	}
}

bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote {
				ip 172.30.0.3;
			}
			local {
				ip 172.30.0.2;
			}
		}
		session {
			asn {
				local 65001;
				remote 65002;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				route-refresh enable;
				graceful-restart disable;
			}
		}
		# Route Refresh needs a process that may put routes on the wire
		# (validatePeerProcessCaps). Bound in both configs, so it never changes.
	}
}
