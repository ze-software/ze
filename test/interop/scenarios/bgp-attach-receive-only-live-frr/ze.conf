# Ze side of the bgp-attach-receive-only-live-frr interop scenario
# (spec-bgp-live-receive-binding-and-bfd-keep-session, AC-12 first half).
#
# adj-rib-in runs from boot but no peer attaches it, so it holds nothing for
# FRR. ze-reload.conf is this file plus `attach process adj-rib-in { receive
# [ update-received state ] }` on the peer: a receive-only binding, which the
# reload delivers to the running session. FRR already announced its route and
# both sides negotiate Route Refresh, so ze asks FRR to re-send once per
# negotiated family (RFC 2918 Section 4) instead of restarting the session.
plugin {
	internal bgp-rib {
		use bgp-rib;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}

bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote {
				ip 172.30.0.3;
			}
			local {
				ip 172.30.0.2;
			}
		}
		session {
			asn {
				local 65001;
				remote 65002;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				route-refresh enable;
				graceful-restart disable;
			}
		}
		# Route Refresh needs a process that may put routes on the wire
		# (validatePeerProcessCaps). Bound in both configs, so it never changes.
		attach process bgp-rib {
			receive [ update state refresh ];
			send [ update ];
		}
	}
}
