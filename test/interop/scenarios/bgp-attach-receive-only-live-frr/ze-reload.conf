# Reload config of the bgp-attach-receive-only-live-frr interop scenario:
# ze.conf with adj-rib-in attached to the running peer, receive-only. Nothing
# else differs, so the reload's only change is that binding.
plugin {
	internal bgp-rib {
		use bgp-rib;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}

bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote {
				ip 172.30.0.3;
			}
			local {
				ip 172.30.0.2;
			}
		}
		session {
			asn {
				local 65001;
				remote 65002;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				route-refresh enable;
				graceful-restart disable;
			}
		}
		attach process bgp-rib {
			receive [ update state refresh ];
			send [ update ];
		}
		attach process adj-rib-in {
			receive [ update-received state ];
		}
	}
}
