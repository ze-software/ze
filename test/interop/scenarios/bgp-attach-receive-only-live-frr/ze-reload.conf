# Reload config of the bgp-attach-receive-only-live-frr interop scenario:
# ze.conf with bgp-adj-rib-in receiving received updates and state from peer1
# while keeping `send { allow none; }`. Nothing else differs, so the reload's
# only change is that receive-only binding.
bus {
	endpoint bgp-rib {
		internal bgp-rib;
	}
	endpoint bgp-adj-rib-in {
		internal bgp-adj-rib-in;
		receive {
			from [ /bgp/peer/peer1 ];
			allow [ bgp:update bgp:state ];
			message bgp:update {
				tag direction {
					value [ received ];
				}
			}
		}
		send {
			allow none;
		}
	}
}

bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote {
				ip 172.30.0.3;
			}
			local {
				ip 172.30.0.2;
			}
		}
		session {
			asn {
				local 65001;
				remote 65002;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				route-refresh enable;
				graceful-restart disable;
			}
		}
	}
}
