frr defaults traditional
hostname frr-sr-anycast-originator
log file /tmp/frr.log informational
!
! The second anycast advertiser: router-id 192.0.2.1, lab host 15, SRGB 18000-25999.
! It binds the same index 100 to the same 10.255.255.100/32 as frr.conf, with PHP
! requested, but at stub cost 50, so Ze's best path never ends here. Its router-id
! is the lowest of the two, and both FRRs give the LSA the same Opaque ID
! (frr.conf names the FRR functions), so it is the first advertiser in Ze's LSDB
! order and the binding's Originator. A Ze that reads flags from the Originator
! alone therefore treats the real next hop as a transit router.
segment-routing on
!
interface eth0
 ip ospf area 0.0.0.0
 ip ospf priority 1
 ip ospf cost 10
!
interface lo
 ip address 10.255.255.100/32
 ip ospf area 0.0.0.0
 ip ospf cost 50
!
router ospf
 ospf router-id 192.0.2.1
 passive-interface lo
 capability opaque
 segment-routing global-block 18000 25999 local-block 15000 15999
 segment-routing node-msd 8
 segment-routing prefix 10.255.255.100/32 index 100
!
