# Ze side of the ospf-sr-anycast-nexthop-frr interop scenario (RFC 8665 Section 5).
#
# Ze, FRR (router-id 192.0.2.3, lab host 3) and a second FRR (router-id 192.0.2.1,
# lab host 15, frr-sink.conf) share one OSPFv2 broadcast LAN on eth0, area 0.0.0.0,
# all with Segment Routing on. Both FRRs advertise the same anycast prefix
# 10.255.255.100/32 from lo with the same Prefix-SID index 100 and PHP requested
# (NP-Flag clear). FRR at host 3 advertises it at stub cost 1 and the second FRR at
# cost 50, so Ze's only SPF next hop for the prefix is FRR at host 3.
#
# Ze reads the Extended Prefix LSAs in LSDB key order (Link State ID, then
# Advertising Router). Both FRRs give their one loopback Extended Prefix LSA the
# same Opaque ID, so 192.0.2.1 sorts first and becomes the binding's Originator
# (srPrefixSIDScope.resolve), while the next hop 192.0.2.3 is listed in Also.
#
# RFC 8665 Section 5: "the router MUST take into account ... the E-, NP-, and
# M-Flags advertised by the next-hop router if that router advertised the SID for
# the prefix. This MUST be done regardless of whether the next-hop router
# contributes to the best path to the prefix." The next hop advertised the SID with
# NP clear, so Ze pops its own SID label 16100 (SRGB 16000 + index 100) toward it.
# A Ze that applies the flags only when the next hop is the Originator swaps 16100
# to 17100 (the next hop's SRGB 17000 + index 100) instead.
#
# The kernel FIB plugin programs the label routes the checker reads back with
# `ip -f mpls route show`; ze-sysctls gives the container its MPLS label space.
plugin {
	internal fib-kernel {
		use fib-kernel;
	}
}

ospf {
	router-id 192.0.2.2
	opaque true
	router-information {
		enabled true
		scope area
	}
	extended-prefix true
	extended-link true
	segment-routing {
		enable true
		srgb {
			lower-bound 16000
			upper-bound 23999
		}
		srlb {
			lower-bound 15000
			upper-bound 15999
		}
	}
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type broadcast
			priority 100
			cost 10
		}
	}
}
