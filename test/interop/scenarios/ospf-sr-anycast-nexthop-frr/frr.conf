frr defaults traditional
hostname frr-sr-anycast-nexthop
log file /tmp/frr.log informational
!
! The anycast advertiser Ze reaches directly: router-id 192.0.2.3, lab host 3, SRGB
! 17000-24999. It and frr-sink.conf (router-id 192.0.2.1) both put 10.255.255.100/32
! on lo with Prefix-SID index 100. This one advertises the stub at cost 1, so it is
! Ze's only SPF next hop for the prefix; the higher router-id makes it the second
! advertiser in Ze's LSDB order, never the binding's Originator.
!
! FRR 10.3.1 accepts and originates this, read at frr-10.3.1:
! - ospfd/ospf_sr.c "segment-routing prefix" sets only what the options ask for:
!   "desired_flags |= no_php_flag ? EXT_SUBTLV_PREFIX_SID_NPFLG : 0;", so a prefix
!   configured with neither option advertises NP clear, PHP requested.
! - ospfd/ospf_ext.c ospf_ext_ism_change gives a loopback its Extended Prefix
!   Opaque LSA: "if (oi->type == OSPF_IFTYPE_LOOPBACK) { exti->stype = PREF_SID;
!   ... exti->instance = get_ext_pref_instance_value();", a counter starting at 1
!   in each ospfd, so two identically configured routers use the same Opaque ID.
! - ospfd/ospf_sr.c update_ext_prefix_sid keeps a received Prefix-SID in the list
!   of the node that advertised it ("for (ALL_LIST_ELEMENTS_RO(srn->ext_prefix,
!   node, pref))"), so the same index from two routers is two entries, not a
!   conflict: an anycast SID is ordinary FRR state.
!
interface eth0
 ip ospf area 0.0.0.0
 ip ospf priority 1
 ip ospf cost 10
!
interface lo
 ip address 10.255.255.100/32
 ip ospf area 0.0.0.0
 ip ospf cost 1
!
router ospf
 ospf router-id 192.0.2.3
 passive-interface lo
 capability opaque
 segment-routing on
 segment-routing global-block 17000 24999 local-block 15000 15999
 segment-routing node-msd 8
 segment-routing prefix 10.255.255.100/32 index 100
!
