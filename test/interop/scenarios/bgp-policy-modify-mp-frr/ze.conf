# An import prefix-list that keeps some prefixes of a multiprotocol UPDATE
# and refuses others, judged by FRR.
#
# The raw injector (172.30.0.9, AS65004) sends each case as ONE UPDATE
# (inject.msg). Ze's import chain on that peer is the prefix-list INJECT-IN
# below, so a mixed MP_REACH_NLRI must be rebuilt to carry only the accepted
# prefixes, an all-refused one must not leave Ze at all, and an MP_UNREACH_NLRI
# must still withdraw. FRR (172.30.0.3, AS65002) receives what Ze relays and
# is the judge of what was installed; the OPEN-only relay between them
# (172.30.0.11) records the bytes Ze put on that wire.
#
# Both peers are route-server clients so the relay keeps the injector's next
# hop and AS_PATH untouched, and only the import filter changes the UPDATE.
plugin {
	internal rs {
		use bgp-rs;
	}
	# FRR comes up after the injector, and the route server asks adj-rib-in for
	# the peer-up replay toward it. Without this instance the replay waits for
	# a store that does not exist.
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
	internal bgp-filter-prefix {
		use bgp-filter-prefix;
	}
}
bgp {
	policy {
		prefix-list INJECT-IN {
			entry 2001:db8:1::/48 {
				action accept;
			}
			entry 10.61.1.0/24 {
				action accept;
			}
			# No le: the entry accepts the /48 and every longer prefix under
			# it, which is the thirty /64s of the past-255-octets case.
			entry 2001:db8:100::/48 {
				action accept;
			}
		}
	}
	# The raw injector. Ze dials it (accept false), because le test peer
	# listens rather than connects.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv6/unicast { prefix { maximum 10000; } }
			}
			# A session the injector lost would otherwise leave stale routes at
			# FRR, and the final presence checks would not see the loss.
			capability { graceful-restart disable; }
		}
		filter {
			import [ bgp-filter-prefix:INJECT-IN ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			receive [ update-received state ]
			send [ update ]
		}
	}
	# FRR, through the OPEN-only relay at .11 that dials Ze and FRR and keeps
	# every frame Ze sends on this session. That capture is the wire evidence
	# for the extended-length and the all-refused cases.
	peer frr {
		connection {
			remote { ip 172.30.0.11; connect false; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv6/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			receive [ update-received state ]
			send [ update ]
		}
	}
}
