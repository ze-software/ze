frr defaults traditional
hostname frr-policy-mp
! debugging level, not informational: FRR's own per-UPDATE decode, which only
! `debug bgp updates in` emits, is what a failed run needs to be read.
log file /tmp/frr.log debugging
!
debug bgp updates in
debug bgp neighbor-events
!
! FRR needs a global IPv6 address on the interface the session leaves from, or
! it has no IPv6 next hop of its own for the sentinels it announces.
interface eth0
 ipv6 address fd00:1e:0::3/64
exit
!
! FRR is the OBSERVER of what Ze rebuilt. It originates only the two sentinels
! the injector waits for (2001:db8:f00::/48 at start, 2001:db8:f01::/48 when the
! checker adds it), and the out lists keep everything Ze relayed to it from
! coming back: an UPDATE the injector did not expect would end its script.
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 no bgp network import-check
 ! Ze relays as a route server, so the leftmost AS is the injector's 65004.
 no bgp enforce-first-as
 ! Ze is reached through the OPEN-only relay at .11 (speaker2-args), which
 ! records every frame Ze sends. The relay dials both sides.
 neighbor 172.30.0.11 remote-as 65001
 neighbor 172.30.0.11 passive
 !
 address-family ipv4 unicast
  neighbor 172.30.0.11 activate
  neighbor 172.30.0.11 prefix-list NONE out
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:f00::/48
  neighbor 172.30.0.11 activate
  neighbor 172.30.0.11 prefix-list SENTINELS out
 exit-address-family
!
ip prefix-list NONE seq 10 deny 0.0.0.0/0 le 32
ipv6 prefix-list SENTINELS seq 10 permit 2001:db8:f00::/48
ipv6 prefix-list SENTINELS seq 20 permit 2001:db8:f01::/48
