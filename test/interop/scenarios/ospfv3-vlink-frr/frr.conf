frr defaults traditional
hostname frr-ospf6-vlink
log file /tmp/frr.log informational
!
! FRR ospf6d is the far virtual-link endpoint. eth0 is in the transit area 0.0.0.1 (shared
! segment with Ze); its loopback is in the backbone (area 0.0.0.0). The virtual link through
! area 0.0.0.1 to Ze (router-id 172.30.0.2) repairs the IPv6 backbone. RFC 5340 section 4.2.
interface eth0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 area 0.0.0.1
!
interface lo
 ipv6 ospf6 area 0.0.0.0
!
router ospf6
 ospf6 router-id 172.30.0.3
 area 0.0.0.1 virtual-link 172.30.0.2
!
