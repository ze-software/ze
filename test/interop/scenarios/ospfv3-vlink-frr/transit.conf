frr defaults traditional
hostname frr-ospf6-transit
log file /tmp/frr.log informational
!
interface eth1
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 area 0.0.0.1
 ipv6 ospf6 cost 10
!
interface eth2
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 area 0.0.0.1
 ipv6 ospf6 cost 10
!
router ospf6
 ospf6 router-id 172.30.0.14
!
