# Ze side of the ospfv3-vlink-frr interop scenario (spec-ospf-ext-7, RFC 5340 sec 4.2).
#
# The IPv6 (OSPFv3) family: Ze and FRR ospf6d are both ABRs on the transit area 0.0.0.1
# (shared segment eth0) and each owns a disjoint backbone (area 0.0.0.0) fragment. A virtual
# link through the transit area joins the two backbone fragments. Ze sends routed-unicast
# OSPFv3 (global source/destination, hop limit > 1), forms a Full point-to-point virtual
# adjacency, and originates the backbone Router-LSA with the RouterLinkTypeVirtual record
# plus the transit-area Router-LSA V-bit.
#
# AUTHORED-PENDING-QEMU: exercises the routed OSPFv3 send (global source + hop limit > 1)
# and the RID/Area-0 demux, which run only against the Linux kernel under the multi-hop
# QEMU interop harness; it cannot run on darwin.

ospf {
	router-id 172.30.0.2
	address-family ipv6 {
		areas {
			area 0.0.0.0 {
				area-type normal
			}
			area 0.0.0.1 {
				area-type normal
				virtual-link 172.30.0.3 {
					hello-interval 10
					dead-interval 40
				}
			}
		}
		interfaces {
			interface eth0 {
				area 0.0.0.1
				network-type point-to-point
				cost 10
			}
			interface lo {
				area 0.0.0.0
				passive true
			}
		}
	}
}
