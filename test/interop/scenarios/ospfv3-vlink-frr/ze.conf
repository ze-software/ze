# Ze side of the ospfv3-vlink-frr interop scenario (spec-ospf-ext-7, RFC 5340 sec 4.2).
#
# Ze and the endpoint BIRD own separate backbone fragments. Their area 0.0.0.1
# path crosses a third FRR router on two isolated VLANs. Routed virtual packets
# use global endpoint addresses learned from LA host prefixes. The carrier
# changes transit cost and exercises far-link down/up without a direct L2 path.

# Install native OSPF routes through the existing system RIB and kernel backend.
# Connected routes supply recursive reachability for the global virtual endpoint.
plugin {
	internal rib {
		use rib;
	}
	internal fib-kernel {
		use fib-kernel;
	}
	internal connected {
		use connected;
	}
}

connected {
}

telemetry {
	prometheus {
		enabled true
		netdata {
			enabled false
		}
	}
}

ospf {
	router-id 172.30.0.2
	address-family ipv6 {
		areas {
			area 0.0.0.0 {
				area-type normal
			}
			area 0.0.0.1 {
				area-type normal
				virtual-link 172.30.0.3 {
					hello-interval 10
					dead-interval 40
				}
			}
		}
		interfaces {
			interface eth1 {
				area 0.0.0.1
				network-type point-to-point
				cost 10
			}
			interface backbone0 {
				area 0.0.0.0
				passive true
			}
		}
	}
}
