# BIRD 2.15.1 supplies the IPv6 virtual endpoint; FRR remains the transit router.
# OSPFv3 virtual links are supported for IPv6 unicast in proto/ospf/config.Y.
# The carrier assigns this backbone host to lo before BIRD starts. stubnet avoids
# depending on a link-local address on the loopback interface.
log stderr all;
router id 172.30.0.3;

protocol device {
}

protocol kernel kernel6 {
	ipv6 {
		import none;
		export all;
	};
}

protocol ospf v3 vlink_ospf {
	rfc5838 no;
	ipv6 {
		import all;
		export none;
	};
	area 0.0.0.0 {
		stubnet 2001:db8:20::1/128;
	};
	area 0.0.0.1 {
		interface "eth2" {
			type ptp;
			cost 10;
			hello 10;
			dead 40;
		};
		virtual link 172.30.0.2 {
			hello 10;
			dead 40;
		};
	};
}
