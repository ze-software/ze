plugin {
	internal bgp-rib {
		use bgp-rib;
	}
	internal bgp-bmp {
		use bgp-bmp;
	}
}
bgp {
	bmp {
		sender {
			collector local {
				address 172.30.0.6;
				port 11019;
			}
			route-monitoring-policy all;
			statistics-timeout 0;
		}
	}
	peer frr-bmp {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65044; remote 65045; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
	}
}
