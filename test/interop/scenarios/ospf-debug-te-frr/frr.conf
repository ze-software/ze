frr defaults traditional
hostname frr-ospf-debug-te
log file /tmp/frr.log informational
!
! OSPFv2 P2P to Ze (eth0) with MPLS-TE enabled so FRR originates a Traffic Engineering
! opaque LSA (RFC 3630, Opaque Type 1) for Ze to receive and decode.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 capability opaque
 mpls-te on
 mpls-te router-address 172.30.0.3
 passive-interface lo
