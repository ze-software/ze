# Ze side of the ospf-debug-te-frr interop scenario (spec-ospf-ext-14, RFC 3630).
#
# Ze forms a P2P OSPFv2 adjacency with FRR and receives FRR's Traffic Engineering
# opaque LSA (Opaque Type 1). Opaque capability lets FRR flood it; Ze's ext-2 TE decoder
# renders it in `show ospf te-database`.
ospf {
	router-id 172.30.0.2
	opaque true
	areas { area 0.0.0.0 { area-type normal } }
	interfaces {
		interface eth0 { area 0.0.0.0 network-type point-to-point cost 10 }
		interface lo { area 0.0.0.0 passive true }
	}
}
