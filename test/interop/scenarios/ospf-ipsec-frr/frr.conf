frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! FRR ospf6d does not configure IPsec in frr.conf: the RFC 4552 manual ESP SAs and
! policies are installed in this container's kernel with `ip xfrm` by the checker
! (ospfIPsecPeerSetup, internal/le/interoplab/bgp/checkers.go). Here ospf6d only runs
! OSPFv3 on the shared bridge (eth0); the kernel applies ESP transport mode to protocol 89.
!
interface eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
!
router ospf6
 ospf6 router-id 10.0.0.2
!
