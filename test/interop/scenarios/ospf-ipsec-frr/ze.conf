# Ze side of the ospf-ipsec-frr interop scenario (spec-ospf-ext-16, RFC 4552).
#
# Ze protects OSPFv3 on the shared bridge (eth0) with a manually keyed ESP transport-mode
# SA (SPI 256, HMAC-SHA-256, null encryption). FRR ospf6d has no IPsec configuration of
# its own: the checker installs the matching `ip xfrm` states and policies in the FRR
# container before it waits for the adjacency (ospfIPsecPeerSetup,
# internal/le/interoplab/bgp/checkers.go).
#
# GOAL-VALIDATION TARGET: the adjacency reaches Full THROUGH the kernel IPsec on both
# sides. That needs every OSPF destination keyed: the two multicast groups, each router's
# own link-local for what its neighbor unicasts to it, and the neighbor's link-local for
# the Database Description, Link State Request and Link State Update this router unicasts
# back, which is the state ze installs when the neighbor's first Hello arrives.

ospf {
	router-id 10.0.0.1
	address-family ipv6 {
		areas {
			area 0.0.0.0 {
			}
		}
		interfaces {
			interface eth0 {
				area 0.0.0.0
				network-type point-to-point
				ipsec {
					protocol esp
					spi 256
					algorithm sha256
					key 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
				}
			}
		}
	}
}
