plugin {
	internal rs { use bgp-rs; }
	internal rib { use bgp-rib; }
	internal adj-rib-in { use bgp-adj-rib-in; }
	external announce-routes {
		run "le test interop-bgp process bgp-flowspec-gobgp announce-routes";
		encoder json;
	}
}
bgp {
	peer peer1 {
		connection {
			# The relay records the exact UPDATE bytes delivered to GoBGP.
			remote { ip 172.30.0.10; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			next-hop unchanged;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/flow { prefix { maximum 10000; } }
			}
		}
		attach process announce-routes {
			send [ update ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process rib {
			receive [ update state refresh ];
		}
		attach process adj-rib-in {
			receive [ update-received state ];
			send [ update ];
		}
	}
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/flow { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		attach process rib {
			receive [ update state refresh ];
		}
		attach process adj-rib-in {
			receive [ update-received state ];
			send [ update ];
		}
	}
}
