bus {
	endpoint announce-routes {
		external {
			run "le test interop-bgp process bgp-flowspec-gobgp announce-routes";
		}
		encoding json;
		send {
			message bgp:update {
				to [ /bgp/peer/peer1 ];
			}
		}
	}
}
static {
	table default {
		route 172.30.0.5/32 {
			next {
				interface eth0 { }
			}
		}
		route 172.30.0.9/32 {
			next {
				interface eth0 { }
			}
		}
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			# The relay records the exact UPDATE bytes delivered to GoBGP.
			remote { ip 172.30.0.10; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/flow { prefix { maximum 10000; } }
			}
		}
		filter {
			export { filters [ next-hop:unchanged ]; final accept; }
		}
	}
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/flow { prefix { maximum 10000; } }
			}
		}
	}
}
