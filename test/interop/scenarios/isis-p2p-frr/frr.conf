frr defaults traditional
hostname frr-isis-p2p
log file /tmp/frr.log informational
!
! IS-IS point-to-point on the shared L2 bridge to Ze (eth0). Same area (49.0001)
! and level-1-2 so the RFC 5303 three-way adjacency forms and FRR learns the
! reachability Ze advertises (TLV 135). FRR also originates a loopback prefix so
! Ze learns a route back (bidirectional convergence, AC-13).
interface eth0
 ip router isis ZE
 isis circuit-type level-1-2
 isis network point-to-point
!
interface lo
 ip router isis ZE
 isis passive
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
!
