# Ze side of the isis-p2p-frr interop scenario (spec-isis-13 AC-13).
#
# Ze forms a point-to-point IS-IS adjacency with FRR over the shared Docker
# bridge (eth0, a single L2 broadcast domain), originates a connected/passive
# prefix, and learns FRR's prefix. P2P uses the RFC 5303 three-way handshake.
# Both nodes are in area 49.0001 at level-1-2 so the adjacency forms and routes
# converge both ways.

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1-l2
	hostname ze-p2p
	interface eth0 {
		metric 10
		level l1-l2
		circuit-type point-to-point
	}
	# A passive loopback prefix advertised into IS-IS without an adjacency, so
	# FRR installs it (proves Ze -> FRR route convergence).
	interface lo {
		passive true
	}
}
