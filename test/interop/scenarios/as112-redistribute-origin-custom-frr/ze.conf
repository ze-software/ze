# Ze side of the as112-redistribute-origin-custom-frr interop scenario
# (spec-as112-3 AC-4: operator-overridden origin ASN on the redistribute path).
#
# Same redistribute producer as as112-redistribute-origin-frr, but the service
# sets `asn 65001` instead of the RFC 7534 default (112). The origin AS the
# COVERING prefixes carry is therefore 65001.
#
# To make the assertion unambiguous, ze's own local AS is 64512 (a private ASN
# distinct from both 112 and 65001) and the FRR peer is iBGP (remote AS == ze
# local AS 64512). Because iBGP does not prepend, the only AS in the path FRR
# observes is the configured origin, [65001] -- it cannot be ze's local AS
# (64512) and it is not the default 112.

service {
	as112 {
		enabled true
		asn 65001
		watchdog false
	}
}

bgp {
	router-id 172.30.0.2;
	session {
		asn { local 64512; }
	}
	peer frr-ibgp {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 64512; remote 64512; }
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}

redistribute {
	destination bgp {
		import as112
	}
}
