frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! iBGP: FRR shares ze's local AS (64512), so ze does not prepend and FRR
! observes the configured custom origin AS_PATH exactly, [65001].
router bgp 64512
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 64512
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
