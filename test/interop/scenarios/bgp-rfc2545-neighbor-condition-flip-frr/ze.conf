# The checker sends its subject once while the real kernel neighbor identity
# is ambiguous, then removes the extra identity. Only the native neighbor
# watch may cause the retained subject's new advertisement.
plugin {
	internal rib { use bgp-rib; }
}
bgp {
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer frr {
		connection {
			remote { ip fd00:1e:0::3; }
			local { ip fd00:1e:0::2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family { ipv6/unicast { prefix { maximum 10000; } } }
		}
		# Retain the actual sent API route for the eventual native refeed.
		# A recipient route alone would not prove Ze kept a replayable source.
		attach process rib {
			receive [ update state ];
			send [ update ];
		}
	}
}
