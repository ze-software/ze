frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! The receiver must keep its BGP session while one retained route changes
! from a global-only next hop to the third-party router's global/local pair.
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor fd00:1e:0::2 remote-as 65001
 address-family ipv6 unicast
  neighbor fd00:1e:0::2 activate
 exit-address-family
!
