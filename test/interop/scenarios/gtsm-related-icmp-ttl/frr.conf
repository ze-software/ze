frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! ttl-security hops 1 makes bgpd set IPV6_MINHOPCOUNT 255 on the session socket
! (sockopt_minttl, lib/sockopt.c), which is the check this scenario reads.
! The short timers make FRR send a segment ze's kernel can answer with an
! ICMPv6 error within a few seconds, and a hold time of 15 seconds keeps the
! session up across the one segment that is rejected and retransmitted.
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor fd00:1e:0::2 remote-as 65001
 neighbor fd00:1e:0::2 ttl-security hops 1
 neighbor fd00:1e:0::2 timers 5 15
 !
 address-family ipv6 unicast
  neighbor fd00:1e:0::2 activate
 exit-address-family
!
