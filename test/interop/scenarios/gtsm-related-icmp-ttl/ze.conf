# RFC 5082 Section 3 against a real GTSM receiver (FRR 10.3.1): "The TTL field
# in all IP packets used for transmission of messages associated with
# GTSM-enabled protocol sessions MUST be set to 255. This also applies to the
# related ICMP error handling messages."
#
# The session is IPv6 on purpose. Linux verifies a related ICMPv6 error against
# IPV6_MINHOPCOUNT by the error's OWN hop limit (tcp_v6_err, net/ipv6/tcp_ipv6.c),
# so FRR's kernel is a reader of the hop limit ze puts on the wire. The IPv4
# check reads the TTL QUOTED inside the error instead, which the sender chooses,
# so an IPv4 session could not tell the metric's presence from its absence.
#
# `ttl { max 1 }` is what makes ze install a host route to the peer carrying
# hop limit 255 (internal/component/gtsm/route_linux.go). The checker then makes
# ze's kernel emit one ICMPv6 error about this session toward FRR, and reads on
# FRR's side whether the error was delivered or counted in TCPMinTTLDrop.
bgp {
	peer frr {
		connection {
			remote { ip fd00:1e:0::3; }
			local  { ip fd00:1e:0::2; }
			ttl { max 1; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv6/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
