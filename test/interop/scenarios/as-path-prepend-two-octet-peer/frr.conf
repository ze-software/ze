frr defaults traditional
hostname frr-as-path-prepend-two-octet
log file /tmp/frr.log informational
!
! NEVER EXECUTED, and it has never reached a verdict. Written 2026-09-06 with
! the ze.conf beside it, for
! spec-as-path-prepend-encodes-at-the-negotiated-width. Three attempts on
! 2026-09-06 were each killed by the kernel for memory, because this lab brings
! up FRR, GoBGP and BIRD beside ze. The command that runs it is:
!
!     INTEROP_SCENARIO=as-path-prepend-two-octet-peer ./le integration interop
!
! FRR IS THE OLD BGP SPEAKER OF RFC 6793 HERE, and dont-capability-negotiate is
! what makes it one: FRR then sends no capability option at all, so the
! four-octet AS capability is not negotiated and the session runs on two-octet
! AS numbers. Delete that one line and the session becomes four-octet, the
! prepend is encoded at four octets by the correct and by the defective code
! alike, and every assertion the checker makes passes against either.
!
! remote-as 23456 IS NOT A TYPO. Ze's AS 4200000001 does not fit the two-octet
! My Autonomous System field of the OPEN, so Ze writes AS_TRANS there (RFC 6793
! Section 4.2.2) and carries the real number in the AS4 capability, which this
! peer refuses to read. 23456 is therefore the ASN FRR sees, and the ASN it
! must be told to expect.
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 23456
 neighbor 172.30.0.2 dont-capability-negotiate
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
