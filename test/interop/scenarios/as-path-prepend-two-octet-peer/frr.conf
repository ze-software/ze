frr defaults traditional
hostname frr-as-path-prepend-two-octet
log file /tmp/frr.log informational
!
! FRR IS THE OLD BGP SPEAKER OF RFC 6793 HERE, and dont-capability-negotiate is
! what makes it one: FRR then sends no capability option of its own, so the
! four-octet AS capability is not negotiated and the session runs on two-octet
! AS numbers. Delete that one line and the session becomes four-octet, the
! prepend is encoded at four octets by the correct and by the defective code
! alike, and every assertion the checker makes passes against either.
!
! remote-as IS THE REAL FOUR-OCTET ASN, and 23456 does not work here. Measured
! 2026-09-08: dont-capability-negotiate suppresses only what FRR SENDS. FRR
! still reads Ze's four-octet AS capability, resolves the peer AS to
! 4200000001, compares it with what remote-as declares, and answers every OPEN
! with "2/2 (OPEN Message Error/Bad Peer AS)" when the two disagree. The
! session then never leaves Active.
!
! enforce-first-as is OFF for the same reason. It is on by default in FRR 10.3
! and compares the leading AS of the received AS_PATH with 4200000001, while a
! two-octet AS_PATH from a non-mappable AS leads with AS_TRANS exactly as
! RFC 6793 Section 4.2.2 requires. Left on, FRR answers "incorrect first AS
! (must be 4200000001)" and withdraws the route. The per-neighbor form is the
! one that parses; `no bgp enforce-first-as` is not a command in FRR 10.3 and
! aborts the rest of the configuration.
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 4200000001
 neighbor 172.30.0.2 dont-capability-negotiate
 no neighbor 172.30.0.2 enforce-first-as
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
