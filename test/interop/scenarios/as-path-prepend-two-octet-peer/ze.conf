# Ze side of the as-path-prepend-two-octet-peer interop scenario.
#
# NEVER EXECUTED. This file and the frr.conf beside it were written on
# 2026-09-06 for
# plan/immediate/spec-as-path-prepend-encodes-at-the-negotiated-width.md and
# have not been run once, in the lab or anywhere else. The command that runs
# them is:
#
#     ./le integration scenario as-path-prepend-two-octet-peer
#
# WHAT THE SCENARIO MEASURES. Ze holds AS 4200000001, which is not mappable to
# two octets. FRR refuses the four-octet AS capability (frr.conf,
# dont-capability-negotiate), so the session negotiates two-octet AS numbers and
# every AS_PATH Ze writes on it carries two octets per AS number. The export
# chain below prepends the local AS twice on top of that. RFC 6793 Section
# 4.2.2: "When communicating with an OLD BGP speaker, a NEW BGP speaker MUST
# send the AS path information in the AS_PATH attribute encoded with two-octet
# AS numbers", and "non-mappable four-octet AS numbers are represented by the
# well-known two-octet AS number, AS_TRANS".
#
# WHY THE PREFIX IS REDISTRIBUTED RATHER THAN RELAYED. The width the prepend
# has to match is the width of the payload it is spliced into, and only the
# ORIGINATING rail carries a payload already encoded in this peer's send
# context (exportFilterForBody passes facts.sendASN4,
# internal/component/bgp/reactor/egress_inject_filter.go). A route relayed from
# another session is spliced at the SOURCE session's width, which is a
# different call site and a different question.
#
# The static route and the redistribute block follow
# test/interop/scenarios/bgp-redist-late-join-dynamic-frr/ze.conf, which
# originates a prefix into BGP with no process plugin.

plugin {
	# Without this instance the `modify` policy root is an unknown keyword and
	# the daemon refuses the file.
	internal bgp-filter-modify {
		use bgp-filter-modify;
	}
}

static {
	table default {
		route 10.99.0.0/24 {
			next {
				hop 172.30.0.3 {
				}
			}
		}
	}
}

redistribute {
	destination bgp {
		import static {
			family [ ipv4/unicast ];
		}
	}
}

bgp {
	policy {
		# The mechanism under test. Two prepends, so FRR sees the local AS at
		# least twice in a row whichever way it renders the number. One copy
		# would also be produced by the automatic eBGP prepend, and the
		# scenario could not then tell the policy from the protocol.
		modify PREPEND-TWICE {
			set {
				as-path-prepend 2;
			}
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			# Not mappable to two octets, so AS_TRANS is what the OPEN and the
			# AS_PATH carry on this session, and 4200000001 travels in the AS4
			# companion attributes.
			asn { local 4200000001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		filter {
			export [ modify:PREPEND-TWICE ];
		}
	}
}
