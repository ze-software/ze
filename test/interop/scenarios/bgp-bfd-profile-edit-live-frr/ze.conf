# Ze side of the bgp-bfd-profile-edit-live-frr interop scenario
# (spec-bgp-live-receive-binding-and-bfd-keep-session, AC-12 profile edit).
#
# The BGP peer opts into BFD (non-strict) under profile "fast" at 300ms with
# detect multiplier 3. ze-reload.conf is this file with that profile edited to
# 200ms and detect multiplier 5. The checker reloads ze by SIGHUP while the BFD
# session is Up and requires FRR to read the new values from ze's packets with
# the BFD session never leaving Up and the BGP session never reset: RFC 5880
# Section 6.8.3, a timer change on an Up session goes through a Poll Sequence.
bfd {
	enabled true;
	profile fast {
		detect-multiplier 3;
		desired-min-tx-us 300000;
		required-min-rx-us 300000;
	}
}

bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote {
				ip 172.30.0.3;
			}
			local {
				ip 172.30.0.2;
			}
			bfd {
				enabled true;
				mode single-hop;
				profile fast;
			}
		}
		session {
			asn {
				local 65001;
				remote 65002;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
			}
		}
	}
}
