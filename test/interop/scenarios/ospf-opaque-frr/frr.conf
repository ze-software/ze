frr defaults traditional
hostname frr-ospf-opaque
log file /tmp/frr.log informational
!
! OSPFv2 point-to-point on the shared L2 bridge to Ze (eth0), area 0.0.0.0. FRR
! enables the opaque-LSA capability and originates a Traffic Engineering opaque LSA
! (a Type-10 area-scope opaque LSA, Opaque Type 1, RFC 3630) via mpls-te. Ze must set
! the O-bit, keep the adjacency Full, and store/re-flood FRR's opaque LSA by scope.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
 mpls-te on
 mpls-te router-address 172.30.0.3
!
