# Ze side of the ospf-opaque-frr interop scenario (spec-ospf-ext-1, RFC 5250).
#
# Ze enables the opaque-LSA capability (`opaque true`): it sets the O-bit in its
# Database Description packets and, on a point-to-point OSPFv2 adjacency with FRR over
# the shared Docker bridge (eth0, area 0.0.0.0), it stores and re-floods FRR's opaque
# LSAs by scope while the adjacency stays Full. Ze ships no opaque consumer, so it
# originates no opaque LSA of its own; the carrier alone is exercised here.

ospf {
	router-id 172.30.0.2
	opaque true
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
