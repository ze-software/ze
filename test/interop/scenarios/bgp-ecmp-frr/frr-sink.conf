frr defaults traditional
hostname frr-sink
log file /tmp/frr.log informational
!
ip route 10.100.0.0/24 Null0
ip route 10.100.2.0/24 Null0
!
ip prefix-list UNEQUAL seq 5 permit 10.100.2.0/24
!
route-map PREPEND-UNEQUAL permit 10
 match ip address prefix-list UNEQUAL
 set as-path prepend 65003
!
route-map PREPEND-UNEQUAL permit 20
!
router bgp 65003
 bgp router-id 172.30.0.15
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.3 remote-as 65002
 !
 address-family ipv4 unicast
  network 10.100.0.0/24
  network 10.100.2.0/24
  neighbor 172.30.0.2 activate
  neighbor 172.30.0.2 route-map PREPEND-UNEQUAL out
  neighbor 172.30.0.3 activate
  neighbor 172.30.0.3 route-map PREPEND-UNEQUAL out
 exit-address-family
!
