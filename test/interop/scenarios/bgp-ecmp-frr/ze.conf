# Symmetric eBGP ECMP receiver for spec-fib-depth AC-3 and AC-14.
#
# Both Ze (.2, AS 65001) and FRR (.3, AS 65002) peer with frr-sink (.15,
# AS 65003) and GoBGP (.5, AS 65004). Both sources advertise:
#   10.100.0.0/24  AS_PATH length 1 from both -> equal-cost multipath {.5, .15}
#   10.100.2.0/24  frr-sink prepends 65003 (length 2) vs GoBGP (length 1) -> sole {.5}
#
# fib-kernel installs the resolved multipath into this container's Linux FIB
# (rtm_protocol 250), which the checker compares against FRR's active FIB hops.

bus {
	endpoint bgp-rib {
		internal bgp-rib;
	}
	endpoint rib {
		internal rib;
	}
	endpoint fib-kernel {
		internal fib-kernel;
	}
	endpoint connected {
		internal connected;
	}
}

interface {
	backend netlink;
}

connected {
}

bgp {
	router-id 172.30.0.2;
	multipath {
		maximum-paths 2;
		relax-as-path true;
	}
	filter {
		import { final accept; }
		export { final reject; }
	}
	peer frr-sink {
		connection {
			remote { ip 172.30.0.15; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
