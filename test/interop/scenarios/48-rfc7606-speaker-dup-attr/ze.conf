# Ze relays a route it learned from one peer to another peer through the adj-rib-in
# replay-on-peer-up path. That path (adj_rib_in/rib.go handleState -> "update hex attr set ...
# nhop set ..." -> the API announce -> reactor_api_batch.go buildWireModeUpdate) re-encodes the
# stored attribute block: it carries the received NEXT_HOP AND is handed a fresh authoritative
# next-hop, so it must de-duplicate NEXT_HOP or emit it twice (RFC 7606 Section 3(g)).
#
# This is the path the dup-NEXT_HOP bug lives on. A route SERVER (bgp-rs ForwardCached ->
# buildFwdBody) does NOT use it, which is why an RS scenario cannot exercise this bug. The .ci
# suite cannot exercise it either: auto replay-on-peer-up needs a real SECOND peer at a distinct
# IP (adj-rib-in-replay-on-peerup.ci:4-5 -- ".ci tests cannot use multiple peer IPs"). The
# Docker harness gives every peer its own IP, so the speaker is that distinct peer.
# ONLY adj-rib-in: no bgp-rib / bgp-rs. Without a best-path RIB engine, Ze does not normally
# forward the injector's route to the speaker (that normal forward is buildFwdBody, verbatim,
# and would deliver the route before adj-rib-in's replay, hiding the re-encode path). With only
# adj-rib-in, the sole delivery to the speaker is its replay command -> buildWireModeUpdate.
plugin {
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	# The injector announces 10.0.0.0/24; adj-rib-in stores it as raw hex (attribute block
	# includes NEXT_HOP 172.30.0.9). Ze dials it (accept false), as the plugin .ci suite does.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		process adj-rib-in {
			receive [ update state ];
		}
	}
	# The speaker DIALS Ze and does not listen, so Ze is passive here (connect false). On the
	# speaker's peer-up, adj-rib-in replays the injector's stored route to it through
	# buildWireModeUpdate. connect-delay in speaker-args holds the dial until the route is stored.
	peer speaker {
		connection {
			remote { ip 172.30.0.10; connect false; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		process adj-rib-in {
			receive [ state ];
		}
	}
}
