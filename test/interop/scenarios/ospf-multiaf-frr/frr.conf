frr defaults traditional
hostname frr-ospf-multiaf
log file /tmp/frr.log informational
!
! OSPFv3 (RFC 5340) default IPv6-unicast address family, point-to-point on the shared
! bridge to Ze (eth0). FRR ospf6d runs only the default IPv6-unicast AF; per RFC 5838
! §2.6 it ignores the AF-bit Ze sets (Ze is multi-AF-aware), so the adjacency still
! reaches Full. FRR does not run the IPv4-unicast-over-OSPFv3 AF (Instance ID 64).
interface eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
!
router ospf6
 ospf6 router-id 172.30.0.3
!
