# Ze side of the ospf-multiaf-frr interop scenario (spec-ospf-ext-15, RFC 5838).
#
# Ze runs TWO OSPFv3 address families on the shared bridge (eth0): the default
# IPv6-unicast AF (Instance ID 0) and an IPv4-unicast-over-OSPFv3 AF (Instance ID 64).
# Because more than one AF is configured, Ze sets the RFC 5838 AF-bit in its Hello/DD
# Options on BOTH instances. FRR ospf6d runs only the default IPv6-unicast AF and, per
# RFC 5838 §2.6, ignores the AF-bit it does not understand -- so the IPv6-unicast
# adjacency must still reach Full. The IPv4-unicast instance (Instance ID 64) has no FRR
# peer here (FRR ospf6d does not implement the IPv4-unicast AF, assumption A-9); it runs
# independently and is validated by the ospf-multiaf-v4-frr scenario / the Ze<->Ze fallback.
#
# GOAL-VALIDATION TARGET (AC-11 + AC-2): the IPv6-unicast adjacency stays Full with the
# AF-bit set (multi-AF does not regress the IPv6-base interop), and Ze runs two independent
# per-AF engine instances.

ospf {
	router-id 172.30.0.2
	address-family {
		ipv6-unicast {
			instance-id 0
			areas {
				area 0.0.0.0 {
					area-type normal
				}
			}
			interfaces {
				interface eth0 {
					area 0.0.0.0
					network-type point-to-point
					cost 10
				}
			}
		}
		ipv4-unicast {
			instance-id 64
			areas {
				area 0.0.0.0 {
					area-type normal
				}
			}
			interfaces {
				interface eth0 {
					area 0.0.0.0
					network-type point-to-point
					cost 10
				}
			}
		}
	}
}
