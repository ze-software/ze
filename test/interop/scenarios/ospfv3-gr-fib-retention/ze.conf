# Ze side of the ospfv3-gr-frr interop scenario (spec-ospf-ext-9, RFC 5187).
#
# Ze forms a P2P OSPFv3 (IPv6) adjacency with FRR ospf6d and enables Graceful
# Restart. The OSPFv3 Grace-LSA is a native link-scope LSA (LS Type 0x000B); no
# opaque capability is needed. The graceful-restart policy is family-neutral and
# drives the OSPFv3 address family here.
ospf {
	router-id 172.30.0.2
	graceful-restart {
		restarter { support planned restart-interval 120 }
		helper { support true strict-lsa-checking true }
	}
	address-family {
		ipv6 {
			areas { area 0.0.0.0 { area-type normal } }
			interfaces { interface eth0 { area 0.0.0.0 network-type point-to-point } }
		}
	}
}
