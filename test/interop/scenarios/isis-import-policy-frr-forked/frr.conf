frr defaults traditional
hostname frr-isis-a
log file /tmp/frr.log informational
!
! FRR-A: the origin. Two prefixes on the loopback, both advertised into IS-IS
! as passive reachability. Ze's `isis filter import` rejects 10.77.1.0/24 and
! accepts 10.77.2.0/24, so the second is the control the first is read against.
interface lo
 ip address 10.77.1.1/24
 ip address 10.77.2.1/24
 ip router isis ZE
 isis passive
!
! IS-IS on FRR-A's own link to Ze: eth1, VLAN 101, 10.101.0.3/24. The harness
! builds it before FRR starts (scenarioLinks in
! internal/le/interoplab/bgp/register_import_policy.go). FRR-B is not on it.
interface eth1
 ip router isis ZE
 isis circuit-type level-1-2
 isis network point-to-point
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
!
