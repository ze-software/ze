plugin {
	internal bgp-rib {
		use bgp-rib;
	}
}
bgp {
	peer frr-max-prefix {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65045; remote 65046; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast {
					prefix {
						maximum 1;
						idle-timeout 1;
					}
				}
			}
			capability { graceful-restart disable; }
		}
	}
}
