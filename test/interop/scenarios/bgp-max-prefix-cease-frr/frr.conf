frr defaults traditional
hostname frr-max-prefix
log file /tmp/frr.log informational
!
ip route 10.45.0.0/24 Null0
ip route 10.45.1.0/24 Null0
!
router bgp 65046
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65045
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  redistribute static
 exit-address-family
!
