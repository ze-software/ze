frr defaults traditional
hostname frr-blackhole
log file /tmp/frr.log informational
!
! Two host routes announced to Ze. Both carry the RFC 7999 BLACKHOLE community,
! and they differ only in whether Ze's peer config authorizes a covering prefix:
!   10.100.0.1/32   sits inside the authorized 10.100.0.0/24
!   198.51.100.1/32 sits outside every authorized prefix
ip route 10.100.0.1/32 Null0
ip route 198.51.100.1/32 Null0
!
! RFC 7999 Section 2: BLACKHOLE is 65535:666. Setting it on the outbound
! route-map tags BOTH prefixes, so the community is a constant of this test and
! coverage is the only variable.
route-map SET-BLACKHOLE permit 10
 set community 65535:666
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  neighbor 172.30.0.2 send-community
  neighbor 172.30.0.2 route-map SET-BLACKHOLE out
  redistribute static
 exit-address-family
!
