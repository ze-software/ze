# Ze side of the RFC 7999 BLACKHOLE honoring interop scenario
# (plan/spec-bcp194-6-blackhole.md, AC-1 / AC-2 / AC-3).
#
# Two eBGP sessions carry the SAME community, 65535:666, from two different
# implementations. Three outcomes must differ, and the config is the only thing
# that differs:
#
#   FRR  10.100.0.1/32   inside authorized 10.100.0.0/24, community agreed -> discard
#   FRR  198.51.100.1/32 outside every authorized prefix, community agreed -> forward
#   BIRD 10.200.0.1/32   inside authorized 10.200.0.0/24, 65535:666 NOT agreed -> forward
#
# The BIRD peer carries the authorization and agrees to a DIFFERENT community, so
# the OFF case tests RFC 7999 Section 3.3's second condition on its own rather
# than testing an absent config block.
#
# fib-kernel makes this real: the internal/le/interoplab/bgp checker reads `ip route show` in this
# container,
# so the assertion is about the Linux FIB and not about a Ze table.

plugin {
	internal bgp-rib {
		use bgp-rib;
	}
	internal rib {
		use rib;
	}
	internal fib-kernel {
		use fib-kernel;
	}
	internal connected {
		use connected;
	}
}

# Presence enables redistribution of the connected 172.30.0.0/24 prefix, which
# is what resolves both peers' next-hops. Without a covering route the system
# RIB holds the prefixes and programs nothing.
connected {
}

bgp {
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		blackhole {
			communities blackhole;
			prefixes    10.100.0.0/24;
		}
	}
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# 65535:666 is NOT agreed on this session. RFC 7999 Section 3.3 needs the
		# receiving party to have agreed on that particular BGP session, and this
		# one agreed to 65001:666 only, so the covered prefix BIRD tags with
		# 65535:666 forwards.
		#
		# The community is stated rather than omitted, and that is load-bearing:
		# `prefixes` alone resolves to the well-known value, which is Section 4's
		# explicit-directive default. Naming a different community is how a
		# session carries the authorization and withholds THIS agreement, so the
		# negative isolates the second condition instead of an absent config
		# block. It also pins that a stated list is taken exactly.
		blackhole {
			communities 65001:666;
			prefixes    10.200.0.0/24;
		}
	}
}
