frr defaults traditional
hostname frr-ospf-p2p-unnumbered
log file /tmp/frr.log informational
!
! OSPFv2 over an unnumbered point-to-point link to Ze (eth0). The checker
! removes Docker's subnet from eth0 and gives lo and eth0 the same
! 10.255.0.3/32, which FRR treats as unnumbered: Hellos leave from the borrowed
! address with a zero Network Mask (RFC 2328 Sections 8.1 and 9.5). lo runs
! OSPF passive so Ze learns a route to FRR's borrowed address.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 10.255.0.3
 passive-interface lo
!
