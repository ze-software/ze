# Ze side of the ospf-p2p-unnumbered-frr interop scenario (RFC2328-8.1-1).
#
# eth0 is unnumbered: it borrows the /32 of the dummy zeloop (`ipv4 unnumbered`),
# and iface removes the subnet Docker gave eth0, so Ze sends its OSPF packets
# from the donor address (RFC 2328 Section 8.1). The donor runs OSPF passive so
# FRR learns a route to it, and Ze learns FRR's borrowed address back.

interface {
	backend netlink
	dummy zeloop {
		unit 0 {
			ipv4 {
				address [ 10.255.0.2/32 ]
			}
		}
	}
	ethernet eth0 {
		unit 0 {
			ipv4 {
				unnumbered zeloop
			}
		}
	}
}

ospf {
	router-id 10.255.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
		interface zeloop {
			area 0.0.0.0
			passive true
		}
	}
}
