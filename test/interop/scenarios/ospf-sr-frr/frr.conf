frr defaults traditional
hostname frr-ospf-sr
log file /tmp/frr.log informational
!
! OSPFv2 point-to-point on the shared L2 bridge to Ze (eth0), area 0.0.0.0. FRR enables the
! opaque-LSA capability and Segment Routing (RFC 8665): its ospfd advertises SR-Algorithm 0 and
! an SRGB in the RI LSA, a Prefix-SID (index 100) for loopback 172.30.0.3/32 in an Extended
! Prefix Opaque LSA, and Adj-SIDs in the Extended Link Opaque LSA. Ze must form a Full
! adjacency, install FRR's Prefix-SID as an MPLS push toward FRR (label = Ze-computed from FRR's
! SRGB base 16000 + index 100 = 16100), and FRR must install Ze's Prefix-SID (index 200).
segment-routing on
!
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
 capability opaque
 segment-routing global-block 16000 23999 local-block 15000 15999
 segment-routing node-msd 8
 segment-routing prefix 172.30.0.3/32 index 100
!
