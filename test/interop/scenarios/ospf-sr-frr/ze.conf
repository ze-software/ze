# Ze side of the ospf-sr-frr interop scenario (spec-ospf-ext-5, RFC 8665).
#
# Ze runs OSPFv2 with the opaque-LSA capability, the RFC 7770 Router Information LSA, and the
# RFC 7684 Extended Prefix / Extended Link Opaque LSAs (the SR carriers), plus Segment Routing:
# an SR-Algorithm 0 + SRGB advertisement in the RI LSA, a Prefix-SID for its loopback in the
# Extended Prefix LSA, and an Adj-SID from the SRLB in the Extended Link LSA. On a Full OSPFv2
# adjacency with FRR ospfd (segment-routing on) over the shared bridge (eth0, area 0.0.0.0), Ze
# and FRR exchange the SR TLVs, compute matching index->label mappings against each other's
# SRGB, and install matching MPLS forwarding through the shared mpls-fib.
ospf {
	router-id 172.30.0.2
	opaque true
	router-information {
		enabled true
		scope area
	}
	extended-prefix true
	extended-link true
	segment-routing {
		enable true
		srgb {
			lower-bound 16000
			upper-bound 23999
		}
		srlb {
			lower-bound 15000
			upper-bound 15999
		}
		prefix-sid 172.30.0.2/32 {
			index 200
			no-php true
		}
	}
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
		interface lo {
			area 0.0.0.0
		}
	}
}
