# Ze side of the isis-dualstack-frr interop scenario (spec-isis-13 AC-15).
#
# Ze and FRR form an IS-IS adjacency over the shared bridge (eth0) carrying BOTH
# IPv4 (TLV 135) and IPv6 (TLV 236) reachability. Each advertises a passive
# loopback prefix in both families so the other installs IPv4 and IPv6 routes.

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1-l2
	hostname ze-ds
	interfaces eth0 {
		metric 10
		level l1-l2
		circuit-type point-to-point
		address-family ipv4-unicast {
		}
		address-family ipv6-unicast {
		}
	}
	interfaces lo {
		passive true
		address-family ipv4-unicast {
		}
		address-family ipv6-unicast {
		}
	}
}
