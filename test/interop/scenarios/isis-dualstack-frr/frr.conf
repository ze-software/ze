frr defaults traditional
hostname frr-isis-ds
log file /tmp/frr.log informational
!
! Dual-stack IS-IS on the shared bridge to Ze (eth0): both `ip router isis` and
! `ipv6 router isis` so FRR advertises IPv4 (TLV 135) and IPv6 (TLV 236)
! reachability and installs both families from Ze (AC-15). A loopback prefix in
! each family gives Ze a route back.
interface eth0
 ip router isis ZE
 ipv6 router isis ZE
 isis circuit-type level-1-2
 isis network point-to-point
!
interface lo
 ip router isis ZE
 ipv6 router isis ZE
 isis passive
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
!
