plugin {
	internal bgp-rib {
		use bgp-rib;
	}
}
bgp {
	peer frr-deadpeer {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65050; remote 65051; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			# Graceful Restart would keep the peer's routes and mask the
			# teardown this scenario exists to observe.
			capability { graceful-restart disable; }
		}
		# Short hold time so the expiry this scenario needs fits inside the run.
		# FRR's default is 180 s and RFC 4271 Section 4.2 negotiates the smaller
		# of the two, so this value wins on its own and FRR keepalives at hold/3.
		timer { receive-hold-time 9; }
	}
}
