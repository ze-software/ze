# The ordinary FRR recipient omits session next-hop: the default must rewrite
# a received 172.30.0.9 next hop to Ze's connected local endpoint 172.30.0.2.
# FRR-sink preserves it explicitly; the internal GoBGP peer preserves it under
# the same omitted default. Explicit RS attachment keeps this scenario
# independent of the unfinished ordinary selected-route advertiser.
bus {
	endpoint bgp-rib {
		internal bgp-rib;
	}
	endpoint bgp-adj-rib-in {
		internal bgp-adj-rib-in;
		send {
			message bgp:update {
				to none;
			}
		}
	}
}
connected {
}
bgp {
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family { ipv4/unicast { prefix { maximum 10000; } } }
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local { ip auto; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family { ipv4/unicast { prefix { maximum 10000; } } }
		}
		update {
			attribute { origin igp; next-hop self; }
			nlri { ipv4/unicast add 10.10.1.0/24; }
		}
	}
	peer unchanged {
		connection {
			remote { ip 172.30.0.15; }
			local { ip auto; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family { ipv4/unicast { prefix { maximum 10000; } } }
		}
		filter {
			export { filters [ next-hop:unchanged ]; final accept; }
		}
	}
	peer internal-control {
		connection {
			remote { ip 172.30.0.5; }
			local { ip auto; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family { ipv4/unicast { prefix { maximum 10000; } } }
		}
	}
}
