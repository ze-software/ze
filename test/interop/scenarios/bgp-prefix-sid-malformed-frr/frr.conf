frr defaults traditional
hostname frr-prefix-sid-malformed
log file /tmp/frr.log informational
!
! FRR IS THE RECEIVER here. ze relays the injector's five UPDATEs after judging
! each Prefix-SID by the family of its routes (RFC 8669 Sections 3.1, 4.1 and
! 6, RFC 9252 Section 7). FRR must hold the two labeled-unicast prefixes with
! no label index (ze discarded the attribute), hold the VPN control prefix,
! and not hold the VPN prefix whose re-announcement ze treated as withdraw.
!
! iBGP to ze (both AS 65001): RFC 8669 Section 8 keeps the Prefix-SID inside
! the SR domain, and an internal peer is inside it. No VRF imports the VPN
! routes: FRR retains every VPN route by default (bgp retain route-target all),
! which lets the checker read them from the VPN table.
!
router bgp 65001
 bgp router-id 172.30.0.3
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  no neighbor 172.30.0.2 activate
 exit-address-family
 !
 address-family ipv4 labeled-unicast
  neighbor 172.30.0.2 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 172.30.0.2 activate
 exit-address-family
!
