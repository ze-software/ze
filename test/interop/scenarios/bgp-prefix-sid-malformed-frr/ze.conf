# RFC 8669 Sections 3.1, 4.1 and 6 and RFC 9252 Section 7: a received Prefix-SID
# judged by the family of its routes, relayed to FRR.
#
#     INTEROP_SCENARIO=bgp-prefix-sid-malformed-frr ./le test integration interop
#
# WHAT THE SCENARIO MEASURES. The raw injector (AS 65004) sends five UPDATEs:
# on IPv4 labeled unicast a Prefix-SID whose Label-Index TLV is 6 octets long
# (10.0.1.0/24) and one holding only an Originator SRGB TLV (10.0.4.0/24); on
# IPv4 VPN a valid route (10.0.3.0/24, the control, whose Label-Index of length
# 6 is ignored off labeled unicast), then 10.0.2.0/24 announced valid and
# re-announced with an SRv6 L3 Service TLV that overruns attribute 40.
# RFC 8669 Section 6: a malformed Prefix-SID attached to a labeled unicast
# prefix is handled as attribute discard. RFC 9252 Section 7: "The
# treat-as-withdraw action [RFC7606] MUST be performed when at least one
# malformed SRv6 Service TLV is present in the BGP Prefix-SID attribute."
# The judge is attribute.ClassifyPrefixSID, called from the RFC 7606 walk.
#
# FRR IS THE RECEIVER. It must hold both labeled-unicast prefixes without a
# label index, hold the control, and not hold 10.0.2.0/24.
#
# THE RELAY IS bgp-rs, as in bgp-prefix-sid-duplicate-tlv-frr. The injector is
# external, so accept-srv6-prefix-sid lets the attribute reach the Section 6
# step (RFC 8669 Section 4); FRR is internal, so it receives the attribute
# with no propagate leaf (RFC 8669 Section 8).
#
# NOT RUN. Written 2026-10-14; this machine's Docker kernel refuses the lab,
# so neither the green run nor the red phase (revert validatePrefixSIDValue,
# rebuild the ze image) has been observed.
plugin {
	internal rs {
		use bgp-rs;
	}
	# The injector announces before FRR connects, so the route reaches FRR
	# through the peer-up REPLAY, which the route server asks adj-rib-in for.
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			# RFC 8669 Section 4: accept the attribute from this eBGP peer.
			accept-srv6-prefix-sid true;
			family {
				ipv4/mpls-label { prefix { maximum 10000; } }
				ipv4/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			receive [ update-received state ]
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/mpls-label { prefix { maximum 10000; } }
				ipv4/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			send [ update ]
		}
	}
}
