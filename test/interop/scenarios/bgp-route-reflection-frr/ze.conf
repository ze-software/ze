plugin {
	internal bgp-rib {
		use bgp-rib;
	}
	internal bgp-rs {
		use bgp-rs;
	}
}
bgp {
	router-id 172.30.0.2;
	session {
		asn { local 65000; }
	}
	group RR-CLIENTS {
		session {
			route-reflector-client true;
			cluster-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		peer frr-client {
			connection {
				remote { ip 172.30.0.3; }
				local  { ip 172.30.0.2; }
			}
			session { asn { remote 65000; } }
			behavior { rs-fast-path enable; }
		}
		peer bird-client {
			connection {
				remote { ip 172.30.0.4; }
				local  { ip 172.30.0.2; }
			}
			session { asn { remote 65000; } }
			behavior { rs-fast-path enable; }
		}
	}
}
