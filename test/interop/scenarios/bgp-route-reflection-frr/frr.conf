frr defaults traditional
hostname frr-rr-client
log file /tmp/frr.log informational
!
ip route 10.38.0.0/24 Null0
!
router bgp 65000
 bgp router-id 172.30.0.3
 neighbor 172.30.0.2 remote-as 65000
 neighbor 172.30.0.2 update-source 172.30.0.3
 !
address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  redistribute static
exit-address-family
!
