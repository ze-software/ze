# Ze side of the ospfv3-frr interop scenario (spec-ospf-af-unify AC-4 / AC-7).
#
# Ze runs the OSPFv3 (IPv6) address family of the unified OSPF engine and forms a
# point-to-point OSPFv3 adjacency with FRR ospf6d over the shared Docker bridge
# (eth0), exchanging Hello/DD/LSR/LSU/LSAck over IPv6 link-local (ff02::5, IP
# proto 89). Both nodes are in area 0.0.0.0. The v6 family is selected by the
# address-family ipv6 sub-section; the v4 family is idle (no v4 interfaces).
#
# GOAL-VALIDATION TARGET: this scenario passes once the unified engine's IPv6
# family reaches Full (the AFPrefixStrategy / v6 FSM work in spec-ospf-af-unify).
# Until then it is the red TDD target the v6 bring-up is driving to green.

ospf {
	router-id 172.30.0.2
	address-family ipv6 {
		areas {
			area 0.0.0.0 {
				area-type normal
			}
		}
		interfaces {
			interface eth0 {
				area 0.0.0.0
				network-type point-to-point
				cost 10
			}
		}
	}
}
