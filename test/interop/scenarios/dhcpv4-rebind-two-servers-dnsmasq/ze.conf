# Ze as a DHCPv4 client on the shared interop segment.
#
# The static address matches the one docker assigns this container (ZE_IP),
# so the interface reconcile is a no-op on it; DHCP runs beside it on the same
# unit and installs the leased 172.30.0.x address as a second address.
interface {
    backend netlink;
    ethernet eth0 {
        unit 0 {
            ipv4 {
                address [ 172.30.0.2/24 ];
                dhcp {
                    enabled true;
                }
            }
        }
    }
}
