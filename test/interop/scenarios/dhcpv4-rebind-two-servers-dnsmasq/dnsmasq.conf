# dnsmasq server A of two on the shared interop segment (172.30.0.20).
#
# Both servers hold the same one-address pool, so whichever answers ze's
# DHCPDISCOVER first leases the same address. The lease is dnsmasq's minimum
# of 120 s; options 58 and 59 bring T1 to 20 s and T2 to 40 s.
#
# dhcp-authoritative makes a server answer a REBINDING DHCPREQUEST for a lease
# the other server granted. The checker stops the server whose log holds the
# lease ACK: ze's RENEW then goes unanswered, and at T2 its broadcast REBIND
# is answered by the other server.
#
# No DNS service (port=0), and no router or DNS server option, so the lease
# changes nothing in ze's container but the address on eth0.
port=0
interface=eth0
user=root
no-ping
log-dhcp
dhcp-authoritative
dhcp-leasefile=/run/dnsmasq.leases
dhcp-range=172.30.0.50,172.30.0.50,255.255.255.0,120s
dhcp-option=option:router
dhcp-option=option:dns-server
dhcp-option=option:T1,20
dhcp-option=option:T2,40
