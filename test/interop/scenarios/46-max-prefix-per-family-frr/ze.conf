plugin {
	internal bgp-rib {
		use bgp-rib;
	}
}
bgp {
	peer frr-per-family {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65045; remote 65046; }
			router-id 172.30.0.2;
			family {
				# Warn only. FRR announces two routes against a maximum of
				# one, and the session must survive.
				ipv4/unicast {
					prefix {
						maximum 1;
						teardown false;
					}
				}
				# Stop the session. FRR never activates this family, so it
				# never overflows. Its teardown setting must not reach
				# ipv4/unicast: "ipv4/unicast" sorts before "ipv6/unicast",
				# so this is the value the per-peer scalar used to hand to
				# every family.
				ipv6/unicast {
					prefix {
						maximum 5;
						teardown true;
					}
				}
			}
			capability { graceful-restart disable; }
		}
	}
}
