# Ze side of the ospf-convergence-frr interop scenario (spec-ospf-13 AC-20).
#
# Ze and FRR form a point-to-point OSPFv2 adjacency over the shared bridge with
# FAST timers (hello 2s, dead 8s) so the dead interval expires quickly when the
# link is cut. The check cuts FRR's eth0, asserts the adjacency drops (SPF
# re-runs, stale routes withdrawn), then restores it and asserts reconvergence
# (AC-20).

ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			hello-interval 2
			dead-interval 8
			cost 10
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
