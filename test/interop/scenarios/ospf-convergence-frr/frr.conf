frr defaults traditional
hostname frr-ospf-conv
log file /tmp/frr.log informational
!
! OSPFv2 point-to-point on the shared bridge to Ze (eth0) with FAST timers
! (hello 2s, dead 8s) matching Ze, so the adjacency drops quickly when the link
! is cut and re-forms on restore (AC-20).
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
 ip ospf hello-interval 2
 ip ospf dead-interval 8
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
!
