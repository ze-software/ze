plugin {
	internal rib {
		use bgp-rib;
	}
	internal gr {
		use bgp-gr;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv6/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart {
					short-lived {
						restart-time 120;
					}
					long-lived {
						family {
							ipv4/unicast 60;
						}
					}
				}
			}
		}
		update {
			attribute {
				origin igp;
				next-hop 172.30.0.2;
			}
			nlri {
				ipv4/unicast add 10.94.0.0/24;
			}
		}
		update {
			attribute {
				origin igp;
				next-hop fd00:1e:0::2;
			}
			nlri {
				ipv6/unicast add 2001:db8:94::/48;
			}
		}
		attach process rib { receive [ update state refresh ]; send update; }
		attach process gr { receive [ open state eor ]; send update; }
	}
}
