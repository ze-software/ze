frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
ip route 10.20.0.0/24 Null0
ipv6 route 2001:db8:20::/48 Null0
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 bgp graceful-restart
 bgp long-lived-graceful-restart stale-time 60
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  redistribute static
 exit-address-family
!
 address-family ipv6 unicast
  neighbor 172.30.0.2 activate
  redistribute static
 exit-address-family
!
