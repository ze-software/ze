# RFC 4271 Section 4.3 against a real receiver: Ze relays a route whose every
# Attribute Flags octet carries the low nibble, and GoBGP decodes what Ze sent.
#
# The route-server plugin relays between the raw injector and GoBGP. GoBGP is
# not an rs-client, so this is the normal eBGP relay rail (Ze prepends 65001);
# test/plugin/rfc4271-attr-flags-low-nibble-relay.ci pins the rs-client rail
# with hex. The clear itself is `normalizeTransmittedUpdate`
# (internal/component/bgp/reactor/session_egress_normalize.go), run by the final
# session writer on every rail.
plugin {
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	# The raw injector. Ze dials it (accept false), because le test peer listens.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
}
