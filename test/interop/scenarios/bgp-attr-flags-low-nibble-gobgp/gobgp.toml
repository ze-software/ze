# RFC 4271 Section 4.3, judged by GoBGP. GoBGP keeps an attribute it does not
# recognize as an unknown attribute and prints the Attribute Flags octet it
# decoded off Ze's wire, so the low four bits Ze sends are visible to it.
[global.config]
  as = 65002
  router-id = "172.30.0.5"
  port = 179

[[neighbors]]
  [neighbors.config]
    neighbor-address = "172.30.0.2"
    peer-as = 65001
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv4-unicast"
