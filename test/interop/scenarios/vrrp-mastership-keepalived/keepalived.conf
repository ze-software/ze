# keepalived as the lower-priority VRRP router for VRID 10.
#
# `version 3` is not a default: keepalived speaks VRRPv2 unless told otherwise,
# and RFC 9568 Section 7.1 has a v3 router discard a v2 advertisement, so the
# two would never see each other and both would claim the VIP.
#
# `state BACKUP` is the starting state only. Whether it STAYS backup is the
# assertion: keepalived leaves BACKUP for MASTER unless a higher-priority
# advertisement keeps arriving, so its state is a reading of ze's wire output
# taken by an independent implementation.
#
# No use_vmac: keepalived then puts the VIP on eth0 itself, where `ip -j addr`
# finds it without knowing which macvlan name it would have chosen.
global_defs {
    vrrp_garp_master_refresh 0
}

vrrp_instance VI_1 {
    state BACKUP
    interface eth0
    virtual_router_id 10
    priority 100
    advert_int 1
    version 3
    virtual_ipaddress {
        172.30.0.100/24
    }
}
