# Ze as the higher-priority VRRP router on the shared interop segment.
#
# The address matches the one docker assigns this container (ZE_IP), so the
# interface reconcile is a no-op on the real address and only the VRRP group is
# new. VRID, virtual address and version match keepalived.conf: a mismatch in
# any of the three makes the two routers ignore each other, and BOTH would then
# hold the VIP, which is the failure this scenario exists to detect.
#
# priority 200 against keepalived's 100 (RFC 9568 Section 5.2.4). preempt is on,
# so ze takes mastership back after it returns, which is the third assertion.
#
# checksum rfc5798-compatible: keepalived computes and requires the RFC 5798
# IPv4 pseudo-header checksum and drops the RFC 9568 message-only form ze sends
# by default, so without the leaf neither router would hear the other.
interface {
    backend netlink;
    ethernet eth0 {
        unit 0 {
            ipv4 {
                address [ 172.30.0.2/24 ];
                vrrp {
                    group vip {
                        vrid 10;
                        virtual-address [ 172.30.0.100 ];
                        priority 200;
                        preempt true;
                        checksum rfc5798-compatible;
                        advertise-interval-milliseconds 1000;
                    }
                }
            }
        }
    }
}
