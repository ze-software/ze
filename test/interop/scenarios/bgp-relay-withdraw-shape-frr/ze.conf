# RFC 4271 Section 4.3 against a real receiver, on the PLAIN eBGP forward rail.
#
# Ze (AS 65001) relays between a raw injector (AS 65004) and FRR (AS 65002).
# Neither peer is an RS client, so RFC 4271 Section 5.1.2 applies in full: Ze
# prepends its own AS to every route it ADVERTISES to FRR.
#
# WHY THIS RAIL AND NOT THE ROUTE-SERVER ONE. Section 5.1.2 conditions the
# prepend on "when a given BGP speaker advertises the route to an external peer".
# Ze used to ignore that condition: forwardUpdateCore
# (internal/component/bgp/reactor/reactor_api_forward.go) recorded the prepend on
# facts.isEBGP alone, and ASPathEdit.Record
# (internal/component/bgp/wireu/aspath_slot.go) then CREATED an AS_PATH for a
# payload that carried none. A relayed withdraw-only UPDATE therefore left Ze
# with attrLen=9 carrying AS_PATH and nothing else -- no ORIGIN, no NEXT_HOP --
# which RFC 4271 Section 6.3 makes a Missing Well-known Attribute error. FRR
# 10.3.1 answers it, and the internal/le/interoplab/bgp checker reads that answer.
#
# The route-server rail cannot show this: RFC 7947 Section 2.2.2 transparency
# means Ze records no prepend there at all, so the withdrawal was already clean
# (test/interop/scenarios/bgp-role-otc-withdraw-frr). This scenario is the rail
# where the defect lived.
#
# rs-fast-path is on BOTH peers. On the injector it carries the announce and the
# withdrawal to FRR; on FRR it carries FRR's own prefix back to the injector,
# which is the injector's readiness barrier (inject.msg BARRIER 1). It selects
# the forwarding rail only -- rs-client, which is what suppresses the prepend,
# is absent here and defaults to false.
plugin {
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# The raw injector. Ze dials it (accept false) exactly as the plugin .ci
	# suite does, because ze-test peer listens rather than connects in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			rs-fast-path enable;
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			rs-fast-path enable;
		}
	}
}
