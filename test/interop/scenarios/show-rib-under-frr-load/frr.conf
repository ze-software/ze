! FRR originates a table large enough that one RIB walk is worth racing a
! withdrawal against, and small enough that a reader can see what it is.
!
! The 256 static routes below are the load. check.py toggles `redistribute
! static` on and off, and each toggle sends the whole block as announcements or
! as withdrawals, so ze's UPDATE path writes the peer RIB that ze's show walk is
! reading. This image has no route generator: sharpd is off in
! test/interop/daemons, which every FRR scenario shares, so the block is written
! out rather than produced by a loop.
frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
