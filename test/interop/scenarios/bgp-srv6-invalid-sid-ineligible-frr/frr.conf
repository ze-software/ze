frr defaults traditional
hostname frr-srv6-ineligible
log file /tmp/frr.log informational
!
! FRR IS THE VALID SOURCE here. It exports one IPv6 VPN route, RD 65001:1
! 2001:db8:9252:1::/64, with an SRv6 L3 Service TLV whose SID it allocates from
! LOC1 (sid vpn export auto), so ze holds a path with a valid SRv6 SID. The
! injector then sends the same RD and prefix with an invalid SID Structure
! (RFC 9252 Section 7). ze keys a VPN route on RD and prefix with the label
! stack stripped (nlrisplit keyVPN, keyLabeled), so the two paths compete for
! one best path whatever label each carries.
!
! The route leaks into VPN from the DEFAULT instance's IPv6 unicast table
! (export vpn), not from a "router bgp ... vrf" instance: a VRF instance stays
! inactive until a Linux VRF device of that name exists, and the lab's Docker
! kernel may have no VRF device type ("ip link add ... type vrf" answers
! "Unknown device type"). The default instance needs no device, and its VPN
! export carries the RD, the route target and the SRv6 SID all the same.
!
! iBGP to ze (both AS 65001), as in bgp-srv6-frr.
!
! IPv6 VPN negotiation needs a real local IPv6 address even on IPv4 transport:
! without one FRR refuses the session ("No local IPv6 address, and zebra does
! not support V6 routing with v4 nexthops") with Cease on ze's OPEN. Naming the
! lab's IPv6 prefix here also makes the runner build a dual-stack network
! (needsIPv6, internal/le/interoplab/bgp/prepare.go).
interface eth0
 ipv6 address fd00:1e:0::3/64
exit
!
segment-routing
 srv6
  locators
   locator LOC1
    prefix fc00:0:1::/48
    behavior usid
   !
  !
 !
!
router bgp 65001
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 update-source 172.30.0.3
 !
 address-family ipv4 unicast
  no neighbor 172.30.0.2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  sid vpn export auto
  rd vpn export 65001:1
  rt vpn both 100:1
  export vpn
  network 2001:db8:9252:1::/64
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 172.30.0.2 activate
 exit-address-family
 !
 segment-routing srv6
  locator LOC1
 !
!
