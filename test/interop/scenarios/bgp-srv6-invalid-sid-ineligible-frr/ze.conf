# bgp-srv6-invalid-sid-ineligible-frr -- RFC 9252 Section 7, a path without a
# valid SRv6 SID is not selected, against FRR's own SRv6 VPN export.
#
# FRR (172.30.0.3, iBGP) exports 2001:db8:9252:1::/64 under RD 65001:1 with a
# valid SRv6 SID. ze relays it to the injector (172.30.0.9, eBGP), which waits
# for it, then sends the same RD and prefix with an invalid SID Structure. The
# import policy gives the injector's path LOCAL_PREF 200 against FRR's 100, so
# the injector's path wins unless isSRv6Ineligible keeps it out of best-path
# selection (internal/component/bgp/plugins/rib/rib_bestchange.go). The
# checker reads `show bgp rib best`: FRR must stay the best peer.
plugin {
	internal rib {
		use bgp-rib;
	}
	internal rs {
		use bgp-rs;
	}
	internal bgp-filter-modify {
		use bgp-filter-modify;
	}
}
bgp {
	policy {
		modify INJECTOR-PREF {
			set {
				local-preference 200;
			}
		}
	}
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			# RFC 8669 Section 4: a Prefix-SID from an external peer is
			# accepted only where configured; the competing path needs it.
			accept-srv6-prefix-sid true;
			family {
				ipv6/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		filter {
			import [ modify:INJECTOR-PREF ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process rib {
			receive [ update state refresh ]
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv6/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process rib {
			receive [ update state refresh ]
		}
	}
}
