# Ze relays one EXTERNAL neighbor's routes to two other EXTERNAL neighbors, and
# originates one route of its own. RFC 4271 Section 5.1.4 forbids the first
# neighbor's MULTI_EXIT_DISC on the other two sessions and says nothing about the
# metric Ze sets itself, so what GoBGP shows is what the two rails put on the
# socket.
#
# THE INJECTOR'S WAIT IS WHAT SELECTS THE RAIL UNDER TEST, and it is load-bearing
# rather than a start-up convenience. A scenario that announces before its
# destinations are established stays GREEN with the forward rail's strip removed
# (measured on 2026-08-04 on scenario 54, the Section 5.1.5 sibling), because the
# prefixes reached the peers by some path other than the one under test.
# inject.msg waits for four of Ze's KEEPALIVEs first, so every relayed prefix
# reaches both destinations through forwardUpdateCore
# (reactor/reactor_api_forward.go), which is where applyFactsMED
# (reactor/forward_med.go) runs.
plugin {
	internal rib {
		use bgp-rib;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
	# Ze's OWN metric. This announce takes the announce rail
	# (writeAnnounceUpdate, reactor/reactor_wire.go), never the forward
	# transform, which is the whole reason the second half of this scenario
	# discriminates: a blanket strip of attribute 4 on external egress would
	# satisfy the first half and delete this one.
	external announce-med {
		run /etc/ze/announce.py;
		encoder json;
	}
}
bgp {
	# The raw injector, EXTERNAL to Ze (65004 -> 65001). It announces routes
	# carrying MULTI_EXIT_DISC 100, which is what a neighboring AS sends to
	# discriminate among its entry points. Ze dials it (accept false) because
	# `ze-test peer` listens in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# Ze sends a KEEPALIVE every hold/3, so a 15 s hold gives the injector a
		# 5 s clock to count FRR's and GoBGP's start-up against. The default 90 s
		# hold makes the same wait take eighteen times longer.
		timer { receive-hold-time 15; }
	}
	# Destination one, EXTERNAL to Ze (65001 -> 65002). RFC 4271 Section 5.1.4:
	# "The MULTI_EXIT_DISC attribute received from a neighboring AS MUST NOT be
	# propagated to other neighboring ASes." AS 65004's metric must not reach it.
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# announce.py ORIGINATES one UPDATE toward this peer and consumes no
		# event, so the block grants `update` and nothing else. Without the
		# grant the announce rail refuses the route (maySend,
		# reactor/send_permission.go) and the second half of this scenario
		# stops discriminating: a blanket strip of attribute 4 would then pass.
		attach process announce-med {
			send [ update ]
		}
	}
	# Destination two, EXTERNAL to Ze (65001 -> 65003). GoBGP is the witness: it
	# keeps the RECEIVED attribute list on the path and prints it, so it reports
	# what arrived rather than what it decided to keep.
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# Same grant, same reason: GoBGP is the witness for the originated
		# metric, so it must be sent the route.
		attach process announce-med {
			send [ update ]
		}
	}
}
