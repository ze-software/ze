frr defaults traditional
hostname frr-ospf-ptmp
log file /tmp/frr.log informational
!
! OSPFv2 point-to-multipoint on the shared L2 bridge to Ze (eth0). No DR/BDR is
! elected on a PtMP segment; each router advertises the other as a point-to-point
! link plus a /32 host route, so Ze and FRR install each other's interface /32.
interface eth0
 ip ospf network point-to-multipoint
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
!
