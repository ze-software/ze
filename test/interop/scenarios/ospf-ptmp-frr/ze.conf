# Ze side of the ospf-ptmp-frr interop scenario (spec-ospf-ext-8, IPv4 PtMP).
#
# Ze treats eth0 as an OSPFv2 point-to-multipoint interface: no DR/BDR election,
# a full adjacency with FRR, and a /32 host route for its own eth0 address so FRR
# can reach it directly (RFC 2328 sec 12.4.1.4). Both nodes are in area 0.0.0.0.

ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-multipoint
			cost 10
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
