plugin {
	external announce-as112-community {
		run "ze-test interop-bgp process as112-community-frr announce-as112-community";
		encoder json;
	}
}
bgp {
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process announce-as112-community {
			send [ update ];
		}
	}
}
