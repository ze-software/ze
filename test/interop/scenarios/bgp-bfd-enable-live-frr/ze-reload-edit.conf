# Second reload of the bgp-bfd-enable-live-frr interop scenario: ze-reload.conf
# with profile "fast" edited to 200ms and detect multiplier 5. Nothing else
# differs, so the reload's only change is the timers of an Up BFD session.
bfd {
	enabled true;
	profile fast {
		detect-multiplier 5;
		desired-min-tx-us 200000;
		required-min-rx-us 200000;
	}
}

bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote {
				ip 172.30.0.3;
			}
			local {
				ip 172.30.0.2;
			}
			bfd {
				enabled true;
				mode single-hop;
				profile fast;
			}
		}
		session {
			asn {
				local 65001;
				remote 65002;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
			}
		}
	}
}
