frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! FRR runs BFD for its BGP neighbor ze from the start, at the bfdd defaults
! (300ms, detect multiplier 3). ze opts in only by reload, so the BFD session
! first comes Up on a BGP session that was already Established. FRR brings BGP
! down on a BFD Up->Down only, never on a session that has not been Up yet,
! and FRR 10.3.1 counts ze's AdminDown at the removal as such a Down.
!
bfd
 peer 172.30.0.2
 exit
!
router bgp 65002
 bgp router-id 172.30.0.3
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 bfd
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
