# Ze side of the bgp-bfd-enable-live-frr interop scenario
# (spec-bgp-live-receive-binding-and-bfd-keep-session, AC-12 BFD half).
#
# The bfd root and profile "fast" (300ms, detect multiplier 3) are present
# from boot, but the BGP peer does not opt in. The checker reloads three times:
# ze-reload.conf adds the peer's non-strict opt-in, ze-reload-edit.conf edits
# "fast" to 200ms and detect multiplier 5, and a reload back to this file
# removes the opt-in. FRR's BGP session to ze must not be re-established by
# the add or the edit. The removal must reach FRR as ze's AdminDown
# (remote-diagnostic "administratively down"); FRR 10.3.1 then resets BGP
# against RFC 5882 Section 4.2, a recorded peer deviation the checker does not
# assert on.
# The bfd root stays in every config: an opt-in names the bfd plugin's
# profile, so the root is removed only after the last opt-in is.
bfd {
	enabled true;
	profile fast {
		detect-multiplier 3;
		desired-min-tx-us 300000;
		required-min-rx-us 300000;
	}
}

bgp {
	peer peer1 {
		connection {
			remote {
				ip 172.30.0.3;
			}
			local {
				ip 172.30.0.2;
			}
		}
		session {
			asn {
				local 65001;
				remote 65002;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
			}
		}
	}
}
