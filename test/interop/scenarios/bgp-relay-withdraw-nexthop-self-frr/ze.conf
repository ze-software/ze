# RFC 4271 Section 4.3 against a real receiver, with NEXT-HOP-SELF configured.
#
# Ze (AS 65001) relays between a raw injector (AS 65004) and FRR (AS 65002), the
# same plain eBGP rail scenario 52 uses. One thing differs, and it is the whole
# scenario: the FRR peer carries `next-hop self`.
#
# That turns on applyFactsNextHop (internal/component/bgp/reactor/
# peer_forward_facts.go), which records Op(3, Set) and Op(14, Set) for every
# UPDATE relayed to this peer. It asked nothing about whether the UPDATE
# advertises anything, so a relayed withdrawal reached FRR carrying a lone
# NEXT_HOP and no ORIGIN and no AS_PATH, and a relayed End-of-RIB stopped being a
# marker. RFC 4271 Section 6.3 makes the first a Missing Well-known Attribute
# error, and the internal/le/interoplab/bgp checker reads FRR's answer.
#
# WHY THIS SCENARIO EXISTS BESIDE 52. Scenario 52 leaves the next-hop mode at its
# default, which is nhModeNone, so applyFactsNextHop returns before recording
# anything and the producer under test here is never reached there. The two
# scenarios drive two different producers down one rail.
#
# The injector peer deliberately does NOT carry next-hop self: the route Ze
# relays back to the injector is only the readiness barrier, and rewriting its
# next-hop would prove nothing.
#
# rs-fast-path is on BOTH peers, as in scenario 52. It selects the forwarding
# rail only; reactorForwardRS calls the same applyFactsNextHop.
plugin {
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# The raw injector. Ze dials it (accept false) exactly as the plugin .ci
	# suite does, because ze-test peer listens rather than connects in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			rs-fast-path enable;
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			# The subject of this scenario. Every UPDATE relayed to FRR now has
			# NEXT_HOP and MP_REACH next-hop operations recorded against it.
			next-hop self;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			rs-fast-path enable;
		}
	}
}
