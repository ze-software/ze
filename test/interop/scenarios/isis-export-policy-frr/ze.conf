# Ze side of the isis-export-policy-frr interop scenario
# (spec-route-policy-0-umbrella AC-12).
#
# Ze forms a point-to-point IS-IS adjacency with FRR over the shared Docker
# bridge (eth0) and redistributes three static routes into IS-IS. The
# `isis filter export` chain judges each one before it enters Ze's own LSP:
#   10.66.0.1/32 (tag 300) -> accepted by `loopbacks`, metric 77 from the modify
#   10.66.0.2/32           -> accepted by `loopbacks`, the default metric 100
#   10.66.1.0/24           -> rejected by `loopbacks`, which accepts only /32s
#
# FRR adds its own link metric to Ze (10, pinned in frr.conf) to the prefix
# metric, so it installs the two /32s at 87 and 110 and holds no route for the
# /24. The checker reads all three out of one FRR answer.
#
# The redistribute root needs no `bgp` block (docs/guide/redistribution.md).

static {
	table default {
		route 10.66.0.1/32 {
			tag 300
			next {
				hop 172.30.0.3 {
				}
			}
		}
		route 10.66.0.2/32 {
			next {
				hop 172.30.0.3 {
				}
			}
		}
		route 10.66.1.0/24 {
			next {
				hop 172.30.0.3 {
				}
			}
		}
	}
}

policy {
	prefix-list loopbacks {
		entry 0.0.0.0/0 {
			ge 32;
			le 32;
			action accept;
		}
	}
	modify tagged-loopback-metric {
		match {
			tag [ 300 ];
		}
		set {
			metric 77;
		}
	}
}

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1-l2
	filter {
		export {
			filters [ loopbacks tagged-loopback-metric ];
			final accept;
		}
	}
	interfaces {
		interface eth0 {
			metric 10
			level l1-l2
			circuit-type point-to-point
		}
	}
}

redistribute {
	destination isis {
		import static
	}
}
