frr defaults traditional
hostname frr-isis-export
log file /tmp/frr.log informational
!
! IS-IS on the shared Docker bridge to Ze (eth0). Same area (49.0001), so the
! adjacency forms and FRR learns the reachability Ze's export chain let into
! Ze's LSP. The interface metric is pinned at 10: FRR installs each of Ze's
! prefixes at this link metric plus the metric Ze advertised for it, and the
! checker reads Ze's metric back out of that sum.
interface eth0
 ip router isis ZE
 isis circuit-type level-1-2
 isis network point-to-point
 isis metric 10
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
!
