plugin {
	internal bgp-rib {
		use bgp-rib;
	}
	internal bgp-adj-rib-in {
		use bgp-adj-rib-in;
	}
	internal bgp-rpki {
		use bgp-rpki;
	}
	external rpki-check {
		run "python3 /etc/ze/rpki-check.py";
		encoder json;
	}
}
bgp {
	rpki {
		cache-server 172.30.0.7 {
			port 3323;
		}
		validation-timeout 5;
		action {
			invalid reject;
			not-found accept;
		}
	}
	peer frr-rpki {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65000; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		attach process bgp-rpki {
			receive [ update-received ];
		}
		attach process bgp-adj-rib-in {
			receive [ update-received state ];
		}
	}
}
