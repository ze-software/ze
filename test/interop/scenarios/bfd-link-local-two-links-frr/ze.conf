# Ze side of the bfd-link-local-two-links-frr interop scenario
# (plan/immediate/spec-bfd-link-local-peer-zone.md, AC-21).
#
# Two single-hop sessions to ONE link-local address, FRR's, one on each of two
# links. ze-prestart.sh builds eth1 and eth2 and gives Ze's link-local to both
# before ze starts; frr-prestart.sh does the same for FRR. Because the sessions
# name two interfaces, the BFD socket is bound to no device, and each packet
# reaches its link only through the zone or ifindex Ze puts on the send.
bfd {
	enabled true;
	bind-v6 true;
	profile fast {
		detect-multiplier 3;
		desired-min-tx-us 300000;
		required-min-rx-us 300000;
	}
	single-hop-session @FRR_LINK_LOCAL@ {
		interface eth1;
		local @ZE_LINK_LOCAL@;
		profile fast;
	}
	single-hop-session @FRR_LINK_LOCAL@ {
		interface eth2;
		local @ZE_LINK_LOCAL@;
		profile fast;
	}
}
