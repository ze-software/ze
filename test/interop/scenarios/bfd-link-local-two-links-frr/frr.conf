frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! FRR holds the same link-local, @FRR_LINK_LOCAL@, on eth1 and eth2
! (frr-prestart.sh), and keeps one peer per link for Ze's link-local, which
! Ze also holds on both. local-address is required for the reason
! bfd-link-local-frr/frr.conf gives.
bfd
 profile fast
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
 !
 peer @ZE_LINK_LOCAL@ local-address @FRR_LINK_LOCAL@ interface eth1
  profile fast
 exit
 !
 peer @ZE_LINK_LOCAL@ local-address @FRR_LINK_LOCAL@ interface eth2
  profile fast
 exit
 !
exit
!
