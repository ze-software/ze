# Ze side of the bgp-open-extended-params-boundary-frr interop scenario
# (spec-bgp-open-session-rfc-defects D1, RFC 9072 Section 2). The capabilities
# total 254 octets, the first size whose Optional Parameters field (2 + 254 =
# 256 octets for ze's one type-2 parameter) exceeds 255, so ze must send the
# RFC 9072 extended form:
#   Multiprotocol ipv4/unicast   2 + 4                 =   6
#   Four-octet AS                2 + 4                 =   6
#   Hostname (FQDN, code 73)     2 + 1 + 200 + 1 + 38  = 242
#   total                                              = 254
# The host is 200 octets and the domain 38. Graceful restart is disabled so no
# other capability joins the set. Before D1 ze wrote the extended envelope
# around a one-octet Parameter Length at this size, which FRR misframes.
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer frr {
		connection {
			remote {
				ip 172.30.0.3;
			}
			local {
				ip 172.30.0.2;
			}
