plugin {
	internal bgp-rib {
		use bgp-rib;
	}
	internal bgp-bmp {
		use bgp-bmp;
	}
}
environment {
	bmp {
		enabled true;
		server main {
			ip 0.0.0.0;
			port 11019;
		}
		route-action monitor;
	}
}
bgp {
	router-id 172.30.0.2;
	session {
		asn {
			local 65044;
		}
	}
	peer frr-locrib {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65044; remote 65045; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
	}
}
