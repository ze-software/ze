frr defaults traditional
hostname frr-locrib-sender
log file /tmp/frr.log informational
!
ip route 10.55.0.0/24 Null0
!
router bgp 65045
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65044
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  redistribute static
 exit-address-family
 !
 bmp targets ze
  bmp connect 172.30.0.2 port 11019 min-retry 1000 max-retry 5000
  bmp monitor ipv4 unicast loc-rib
 exit
!
