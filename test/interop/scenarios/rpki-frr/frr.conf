frr defaults traditional
hostname frr-rpki
log file /tmp/frr.log informational
!
ip route 9.43.0.0/24 Null0
ip route 10.43.0.0/24 Null0
ip route 11.43.0.0/24 Null0
!
router bgp 65001
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65000
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  redistribute static
 exit-address-family
!
