bus {
	endpoint bgp-rib {
		internal bgp-rib;
	}
	endpoint bgp-adj-rib-in {
		internal bgp-adj-rib-in;
	}
	endpoint bgp-rpki {
		internal bgp-rpki;
	}
	endpoint rpki-check {
		external {
			run "le test interop-bgp process rpki-frr rpki-check";
		}
		encoding json;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	rpki {
		cache-server 172.30.0.7 {
			trusted-network true;
			port 3323;
		}
		validation-timeout 5;
		action {
			invalid reject;
			not-found accept;
		}
	}
	peer frr-rpki {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65000; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
	}
}
