# draft-ietf-bess-mup-safi Section 3.3.6 against GoBGP v4.11.0.
# GoBGP advertises an ipv4/mup Direct Segment Discovery route with an SRv6
# Prefix-SID over eBGP (`accept-srv6-prefix-sid true` keeps attribute 40 across
# the eBGP boundary per RFC 8669 Section 4). With no IGP locator-origin source
# configured, Ze retains the DSD route in Adj-RIB-In, keeps the session up, and
# warns with doctor-bgp-mup-locator-unresolved (`ze show isis database`).
bus {
	endpoint bgp-adj-rib-in {
		internal bgp-adj-rib-in;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			accept-srv6-prefix-sid true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/mup { prefix { maximum 10000; } }
			}
		}
	}
}
