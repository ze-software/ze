# Ze side of the isis-convergence-frr interop scenario (spec-isis-13 AC-17).
#
# Ze and FRR form an IS-IS adjacency over the shared bridge (eth0) and exchange a
# loopback prefix. The check then drops IS-IS frames on the link; the hold timer
# expires, the adjacency goes Down, the LSP is re-originated without the lost
# reachability, and FRR withdraws the stale route. Restoring the link reconverges.

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1-l2
	hostname ze-conv
	interfaces {
		interface eth0 {
			metric 10
			level l1-l2
			circuit-type point-to-point
			hello-interval 1
			hold-multiplier 3
		}
		interface lo {
			passive true
		}
	}
}
