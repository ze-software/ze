frr defaults traditional
hostname frr-isis-conv
log file /tmp/frr.log informational
!
! IS-IS on the shared bridge to Ze (eth0) with a fast hello so the hold timer
! expires quickly when the link is cut, exercising reconvergence + stale-route
! withdraw (AC-17). FRR advertises a loopback so Ze installs a route that must be
! withdrawn when the adjacency drops.
interface eth0
 ip router isis ZE
 isis circuit-type level-1-2
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
!
interface lo
 ip router isis ZE
 isis passive
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
!
