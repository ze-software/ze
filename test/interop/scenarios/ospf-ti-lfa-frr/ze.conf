# Ze side of the ospf-ti-lfa-frr interop scenario (spec-ospf-ext-6 + RFC 8665).
#
# Ze runs OSPFv2 Segment Routing (SR-Algorithm 0 + SRGB in the RI LSA, a
# loopback Prefix-SID, and an Adj-SID from the SRLB with the B-Flag set for
# FRR-eligible adjacencies) plus fast-reroute in ti-lfa mode. Over two
# point-to-point links to FRR (eth0 cost 10, eth1 cost 20) Ze pre-computes a
# fast-reroute backup toward FRR's loopback and, where no directly-connected LFA
# exists, builds a TI-LFA repair label stack from the exchanged Prefix-SID /
# Adj-SID maps (RFC 8665 Section 5 / 6.1). The wire-observable signals this
# scenario asserts are the Adj-SID B-Flag and the repair-list SR label encoding;
# a full P-space/Q-space repair (no base LFA) needs a 3-node ring and is a
# documented follow-on of the multi-node interop harness.
ospf {
	router-id 172.30.0.2
	opaque true
	router-information {
		enabled true
		scope area
	}
	extended-prefix true
	extended-link true
	segment-routing {
		enable true
		srgb {
			lower-bound 16000
			upper-bound 23999
		}
		srlb {
			lower-bound 15000
			upper-bound 15999
		}
		prefix-sid 172.30.0.2/32 {
			index 200
			no-php true
		}
	}
	fast-reroute {
		enable true
		mode ti-lfa
		node-protection true
	}
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			hello-interval 2
			dead-interval 8
			cost 10
		}
		interface eth1 {
			area 0.0.0.0
			network-type point-to-point
			hello-interval 2
			dead-interval 8
			cost 20
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
