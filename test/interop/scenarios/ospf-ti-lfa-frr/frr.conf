frr defaults traditional
hostname frr-ospf-ti-lfa
log file /tmp/frr.log informational
!
! FRR ospfd with Segment Routing and per-prefix TI-LFA over two point-to-point
! links to Ze (eth0 cost 10, eth1 cost 20), advertising a loopback Prefix-SID so
! Ze and FRR exchange SR labels and compute matching TI-LFA repair paths.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 ip ospf cost 10
!
interface eth1
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
 ip ospf hello-interval 2
 ip ospf dead-interval 8
 ip ospf cost 20
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
 fast-reroute ti-lfa
 segment-routing on
 segment-routing global-block 16000 23999 local-block 15000 15999
 segment-routing prefix 172.30.255.3/32 index 300 no-php-flag
!
