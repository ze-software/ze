# Ze side of the RFC 7999 BLACKHOLE honoring interop scenario
# (plan/spec-bcp194-6-blackhole.md, AC-1 / AC-2 / AC-3).
#
# Two eBGP sessions carry the SAME community, 65535:666, from two different
# implementations. Three outcomes must differ, and the config is the only thing
# that differs:
#
#   FRR  10.100.0.1/32   inside authorized 10.100.0.0/24, community agreed -> discard
#   FRR  198.51.100.1/32 outside every authorized prefix, community agreed -> forward
#   BIRD 10.200.0.1/32   inside authorized 10.200.0.0/24, NO community agreed -> forward
#
# The BIRD peer carries the authorization and withholds only the agreement, so
# the OFF case tests RFC 7999 Section 3.3's second condition on its own rather
# than testing an absent config block.
#
# fib-kernel makes this real: check.py reads `ip route show` in this container,
# so the assertion is about the Linux FIB and not about a Ze table.

plugin {
	internal bgp-rib {
		use bgp-rib;
	}
	internal rib {
		use rib;
	}
	internal fib-kernel {
		use fib-kernel;
	}
	internal connected {
		use connected;
	}
}

# Presence enables redistribution of the connected 172.30.0.0/24 prefix, which
# is what resolves both peers' next-hops. Without a covering route the system
# RIB holds the prefixes and programs nothing.
connected {
}

bgp {
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		blackhole {
			community blackhole;
			authorized-covering-prefix 10.100.0.0/24;
		}
	}
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# No community agreed. RFC 7999 Section 3.3 needs the receiving party to
		# have agreed on that particular BGP session, and this session did not,
		# so the covered tagged prefix from BIRD forwards.
		blackhole {
			authorized-covering-prefix 10.200.0.0/24;
		}
	}
}
