log stderr all;
router id 172.30.0.4;

protocol device {
}

# One host route, inside the prefix Ze's bird peer lists as authorized. The peer
# withholds only the agreement (honor false), so this announcement must be
# forwarded normally: RFC 7999 Section 3.3 needs BOTH conditions, and Section 4
# makes off the default.
protocol static static_routes {
	ipv4;
	route 10.200.0.1/32 blackhole;
}

protocol bgp ze_peer {
	local 172.30.0.4 as 65003;
	neighbor 172.30.0.2 as 65001;
	ipv4 {
		import all;
		export filter {
			if proto != "static_routes" then reject;
			bgp_community.add((65535, 666));
			accept;
		};
	};
}
