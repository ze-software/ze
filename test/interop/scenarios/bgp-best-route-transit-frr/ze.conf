# Ordinary selected transit: no route-server or reflector plugin.
# These terminal /32 routes resolve the actual received next hops without
# redistributing any system route into BGP.
plugin {
 internal rib { use bgp-rib; }
 internal adj { use bgp-adj-rib-in; }
 internal bgp-filter-prefix { use bgp-filter-prefix; }
 internal static { use static; }
}
static { table default {
 route 172.30.0.3/32 { next { interface eth0 { } } }
 route 172.30.0.14/32 { next { interface eth0 { } } }
} }
policy {
 prefix-list TRANSIT-OUT {
  entry 10.245.0.0/24 { action accept; }
  entry 10.245.1.0/24 { action accept; }
 }
 match prefix-list-TRANSIT-OUT { prefix-list TRANSIT-OUT; }
}
bgp {
 router-id 172.30.0.2;

 peer source {
  connection { local { ip 172.30.0.2; } remote { ip 172.30.0.3; } }
  session { asn { local 65000; remote 65001; } router-id 172.30.0.2;
   aigp { enabled false; } family { ipv4/unicast { prefix { maximum 100; } } }
   capability { graceful-restart disable; } }
  filter { import { final accept; }  }
  attach process rib { receive [ update-received state ]; }
  attach process adj { receive [ update-received state ]; }
 }


 peer backup {
  connection { local { ip 172.30.0.2; } remote { ip 172.30.0.14; } }
  session { asn { local 65000; remote 65002; } router-id 172.30.0.2;
   aigp { enabled false; } family { ipv4/unicast { prefix { maximum 100; } } }
   capability { graceful-restart disable; } }
  filter { import { final accept; }  }
  attach process rib { receive [ update-received state ]; }
  attach process adj { receive [ update-received state ]; }
 }


 peer destination {
  connection { local { ip 172.30.0.2; } remote { ip 172.30.0.15; } }
  session { asn { local 65000; remote 65003; } router-id 172.30.0.2;
   aigp { enabled false; } family { ipv4/unicast { prefix { maximum 100; } } }
   capability { graceful-restart disable; } }
  filter { import { final reject; } export { filters [ prefix-list-TRANSIT-OUT ]; final accept; } }
  attach process rib { send [ update ]; receive [ state refresh update-sent ]; }
  
 }

}
