frr defaults traditional
hostname ordinary-transit-source
log file /tmp/frr.log informational
ip route 10.245.0.0/24 Null0
ip route 10.245.1.0/24 Null0
ip route 10.245.2.0/24 Null0
router bgp 65001
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65000
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  network 10.245.0.0/24
  network 10.245.1.0/24
  network 10.245.2.0/24
 exit-address-family
