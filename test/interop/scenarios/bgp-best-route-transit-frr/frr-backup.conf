frr defaults traditional
hostname ordinary-transit-backup
log file /tmp/frr.log informational
ip route 10.245.0.0/24 Null0
route-map TRANSIT-BACKUP permit 10
 set as-path prepend 65002 65002
router bgp 65002
 bgp router-id 172.30.0.14
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65000
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  network 10.245.0.0/24
  neighbor 172.30.0.2 route-map TRANSIT-BACKUP out
 exit-address-family
