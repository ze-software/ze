bus {
	endpoint bgp-rib {
		internal bgp-rib;
	}
	endpoint bgp-filter-remove-private-as {
		internal bgp-filter-remove-private-as;
	}
}
connected {
}
	policy {
		remove-private-as STRIP {
		}
	}

bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer source-bird-old {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 23456; }
			router-id 172.30.0.2;
			capability {
				asn4 disable;
			}
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	peer dest-frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		filter {
			export { filters [ remove-private-as:STRIP ]; final accept; }
		}
	}
}
