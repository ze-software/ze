plugin {
	internal rs {
		use bgp-rs;
	}
	internal bgp-filter-remove-private-as {
		use bgp-filter-remove-private-as;
	}
}
bgp {
	policy {
		remove-private-as STRIP {
		}
	}
	peer source-bird-old {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 23456; }
			router-id 172.30.0.2;
			capability {
				asn4 false;
			}
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			rs-fast-path enable;
		}
	}
	peer dest-frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		filter {
			export [ remove-private-as:STRIP ];
		}
	}
}
