# Ze side of the as112-redistribute-origin-frr interop scenario
# (spec-as112-3 AC-1/AC-3 redistribute-path wire correctness).
#
# The REAL as112 plugin is the route producer here: enabling the service and
# `redistribute { destination bgp { import as112 } }` originates the four AS112
# COVERING prefixes (192.175.48.0/24, 192.31.196.0/24 and the two /48s) into
# BGP as a virtual router with origin AS = the configured `asn` (default 112).
# This replaces the hand-authored announce-*.py process plugin used by
# as112-origin-as-frr: no script injects routes, the plugin does.
#
# watchdog false decouples the announcement from DNS-serving state so this
# wire-correctness scenario is deterministic (the serving gate is exercised
# separately by as112-redistribute-lab).
#
# Two peers observe the SAME originated route on the wire:
#   - frr-ibgp  (172.30.0.3): iBGP (remote AS == ze local AS 65001). Ze does not
#     prepend, so FRR observes AS_PATH exactly [112] -- the producer's origin AS.
#   - bird-ebgp (172.30.0.4): eBGP (remote AS 65003). Ze prepends its local AS,
#     so BIRD observes AS_PATH [65001, 112].

service {
	as112 {
		enabled true
		asn 112
		watchdog false
	}
}

bgp {
	router-id 172.30.0.2;
	session {
		asn { local 65001; }
	}
	peer frr-ibgp {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	peer bird-ebgp {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { remote 65003; }
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}

redistribute {
	destination bgp {
		import as112
	}
}
