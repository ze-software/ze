log stderr all;
router id 172.30.0.4;

protocol device {
}

# eBGP: BIRD is AS 65003, so ze prepends its own local AS (65001) ahead of the
# producer's origin AS (112) -- BIRD observes AS_PATH [65001, 112].
protocol bgp ze_peer {
	local 172.30.0.4 as 65003;
	neighbor 172.30.0.2 as 65001;
	ipv4 {
		import all;
		export none;
	};
}
