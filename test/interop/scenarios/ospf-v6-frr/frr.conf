frr defaults traditional
hostname frr-ospf-v6
log file /tmp/frr.log informational
!
! OSPFv3 (RFC 5340) point-to-point on the shared L2 bridge to Ze (eth0). Same
! area 0.0.0.0 so the adjacency forms (no DR/BDR on a point-to-point link) and
! FRR synchronises its OSPFv3 LSDB with Ze's Router-LSA over IPv6 link-local.
interface eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
!
router ospf6
 ospf6 router-id 172.30.0.3
!
