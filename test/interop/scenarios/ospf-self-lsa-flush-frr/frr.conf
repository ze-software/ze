frr defaults traditional
hostname frr-ospf-self-lsa-flush
log file /tmp/frr.log informational
!
! FRR is the router that remembers. It holds Ze's default AS-external-LSA at a
! sequence number Ze no longer knows about once Ze restarts, and it hands that
! instance back to Ze in the database exchange after Ze has withdrawn the
! default. What FRR's LSDB and RIB hold afterwards is the verdict: the LSA is
! flushed (Ze correct) or it comes back to life at age 0 (Ze wrong).
! FRR originates no default of its own, so any 0.0.0.0 AS-external-LSA in its
! database is Ze's.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
!
