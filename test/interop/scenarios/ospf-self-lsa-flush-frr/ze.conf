# Ze side of the ospf-self-lsa-flush-frr interop scenario
# (spec-rfc-verdict-fix-ospf, D-8: RFC 2328 Section 13.4 with Section 14.1).
#
# Ze originates the default route as a Type 5 AS-external-LSA, metric 4711.
# The checker reloads ze-reload.conf (metric 4242) and then this file again
# (metric 4711), so FRR ends up holding the default at LS sequence 0x80000003
# or later. Ze then restarts from this file, which starts the default again at
# InitialSequenceNumber, and ze-reload-withdraw.conf withdraws it while FRR is
# cut off. The full sequence and the two outcomes are in the checker
# (internal/le/interoplab/bgp/check_ospf_self_flush.go).
#
# 4711 and 4242 are numbers no default produces, so FRR printing either one is
# Ze's LSA and nothing else.

ospf {
	router-id 172.30.0.2
	default-information {
		originate true
		always true
		metric 4711
	}
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
	}
}
