# Metric-only reload of ze.conf: Ze re-originates its default AS-external-LSA
# with metric 4242 at the next LS sequence number. The checker reloads ze.conf
# after it, so FRR holds the default at sequence 0x80000003 or later.
ospf {
	router-id 172.30.0.2
	default-information {
		originate true
		always true
		metric 4242
	}
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
	}
}
