# ze.conf without default-information: Ze no longer wishes to originate the
# default, so it flushes its own instance at MaxAge (RFC 2328 Section 14.1).
# The checker applies it after Ze restarted with FRR cut off, so the flush
# reaches nobody and Ze's database keeps the instance at MaxAge, at a sequence
# number lower than the one FRR still holds.
ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
	}
}
