# A panic on one session's read path ends that session with a Cease /
# Unspecific, the session comes back, and the other session never notices.
# Judged by FRR, the peer whose UPDATE triggers the panic, and by BIRD, the
# peer that must stay up.
#
#     INTEROP_SCENARIO=bgp-panic-cease ./le test integration interop
#
# The directory holds ze-le-daemon, so ze runs the daemon built with ze_le
# (LabBinaries, internal/le/interoplab/bgp/run.go): only that build carries the
# read-path panic injection (session_panic_inject_le.go in the reactor). The
# checker creates /run/ze-inject/bgp-read-panic-<FRR address> in the ze
# container, then makes FRR send an UPDATE; the injection panics on it, inside
# the read task's boundary, which sends the Cease (ceaseAfterPanic).
#
# RFC 4271 Section 4.5: "If no appropriate Error Subcode is defined, then a
# zero (Unspecific) value is used for the Error Subcode field."
plugin {
	internal bgp-rib {
		use bgp-rib;
	}
}
bgp {
	peer frr-panic {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
	}
	peer bird-bystander {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
	}
}
