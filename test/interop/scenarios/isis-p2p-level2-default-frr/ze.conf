# Both circuit levels are omitted: the instance's L2 setting must constrain
# eth0 and the passive loopback, including the LSP neighbor edge SPF needs.
interface {
	backend netlink
	loopback {
		unit 0 {
			ipv4 {
				address [ 127.0.0.1/8 10.80.0.2/32 ]
			}
		}
	}
}

isis {
	net 49.0001.0000.0000.0002.00
	level l2
	hostname ze-l2-default
	interfaces {
		interface eth0 {
			metric 10
			circuit-type point-to-point
		}
		interface lo {
			passive true
		}
	}
}
