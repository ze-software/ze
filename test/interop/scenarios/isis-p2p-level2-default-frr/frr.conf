frr defaults traditional
hostname frr-l2-default
log file /tmp/frr.log informational
!
interface eth0
 ip router isis ZE
 isis circuit-type level-1-2
 isis network point-to-point
!
interface lo
 ip address 10.80.0.3/32
 ip router isis ZE
 isis passive
!
router isis ZE
 net 49.0001.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
!
