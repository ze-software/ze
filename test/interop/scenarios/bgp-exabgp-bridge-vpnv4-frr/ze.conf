# RFC 4364 VPN-IPv4 route announced by an ExaBGP API script through the exabgp
# bridge, read back by FRR (AC-27 of spec-exabgp-6-api-compatibility). The
# script is ExaBGP 6.0's family-stating line, `announce ipv4 mpls-vpn
# 10.0.0.0/24 next-hop 172.30.0.2 rd 65001:100 label 100`, which the bridge
# hands to `update text ... mp ipv4/mpls-vpn add ...` (SAFI 128). The checker
# in internal/le/interoplab/bgp (register_exabgp_bridge_vpnv4.go) requires
# FRR's RIB to hold the route under its RD with its label.
#
# Only ze.conf is mounted into the container, so the script is busybox printf
# with the command as its format: the bridge splits `run` as Python's shlex does
# (bridge.SplitCommandLine), so the format is single-quoted to keep its
# backslashes, and \040 is the space printf writes. The
# config tokenizer reads a quoted `\\` as one backslash and drops the
# backslash of an escape it does not know, so printf's `\040` and `\n` are
# written `\\040` and `\\n` here. The script prints one line and exits;
# respawn disable keeps the bridge from re-running it, and the bgp-rib plugin
# holds the route for the session.
exabgp {
	bridge {
		process announce-vpnv4 {
			run "/usr/bin/printf 'announce\\040ipv4\\040mpls-vpn\\04010.0.0.0/24\\040next-hop\\040172.30.0.2\\040rd\\04065001:100\\040label\\040100\\n'"
			respawn disable
			feed 172.30.0.3 {
				event [ ]
			}
		}
	}
}
plugin {
	internal bgp-rib {
		use bgp-rib
	}
	internal exabgp-bridge {
		use exabgp-bridge
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		attach process bgp-rib {
			receive [ update state refresh ]
			send [ update ]
		}
		attach process exabgp-bridge {
			receive [ * ]
			send [ * ]
		}
	}
}
