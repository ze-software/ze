# The route server's client that negotiated no ADD-PATH. It announces nothing and
# holds the one route Ze sends it for 10.98.0.0/24, so its table is the foreign
# witness of which source owns that route after each step.
log stderr all;
router id 172.30.0.4;

protocol device {
}

protocol bgp ze_peer {
	local 172.30.0.4 as 65003;
	neighbor 172.30.0.2 as 65001;
	ipv4 {
		import all;
		export none;
	};
}
