# Ze as a route server (RFC 7947) between two sources, FRR and GoBGP, and one
# client, BIRD, that negotiated no ADD-PATH. BIRD holds ONE route for the prefix,
# so which source owns it is decided by Ze: the RIB-elected best on every
# announcement, and the remaining source's route when the owner withdraws.
# The checker (checkRouteServerReplacement) drives both sources and reads BIRD.
#
# The two sources are attached receive-only: Ze sends them nothing. A route
# server does not prepend its own AS, so a source that received the other
# source's route through Ze would re-advertise it back with only its own AS in
# front (FRR sent 65002 65004 65004 for GoBGP's route in a measured run), and
# that third path, not the sources' own announcements, would decide what BIRD
# holds. FRR's `no network` would then be an implicit replacement rather than a
# withdrawal, and the withdrawal half of the route server would go unexercised.
#
# bgp-rs depends on bgp-rib (plugins/rs/register.go), so the RIB loads under its
# registered name `bgp-rib` and every peer attaches it by that name. The RIB is
# the election the owed announcement and the owed withdrawal ask through
# `request bgp rib recovery`; without its receive binding it holds no route and
# without its send binding its recovery write is refused (send_permission.go).
plugin {
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			# RFC 7947 Section 2.2.2.1: a route server MUST NOT prepend its own AS.
			# `rs-client` defaults to false and is the only thing that selects the
			# non-prepending path, so BIRD's AS_PATH names the source alone.
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# Without this block the route server receives no peer-scoped event and
		# relays nothing (PeerScopedProcs, plugin/server/delivery_graph.go).
		attach process rs {
			receive [ update-received state open-received refresh ]
		}
		attach process bgp-rib {
			receive [ update state refresh ]
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
		}
		attach process bgp-rib {
			receive [ update state refresh ]
		}
	}
	# The client. No add-path stanza, and BIRD advertises none, so the session
	# carries one path per prefix; the checker asserts that from BIRD's side.
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process bgp-rib {
			receive [ update state refresh ]
			send [ update ]
		}
	}
}
