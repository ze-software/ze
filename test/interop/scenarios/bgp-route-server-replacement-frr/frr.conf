frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 ! The checker announces 10.98.0.0/24 with `network` and withdraws it with `no
 ! network`. FRR holds no IGP or static route for it, so without this the
 ! network statement would never become valid and nothing would be announced.
 no bgp network import-check
 ! Ze is a route server (RFC 7947): it relays without prepending its own AS, so
 ! the first AS in a received path is the originator's, not the peer's.
 no bgp enforce-first-as
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
