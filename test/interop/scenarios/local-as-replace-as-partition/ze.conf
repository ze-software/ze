# Ze side of the local-as-replace-as-partition interop scenario: the announce
# rail's build key, judged by FRR and BIRD in one lab.
#
#     INTEROP_SCENARIO=local-as-replace-as-partition ./le test integration interop
#
# Ze's globally configured AS is 65001. Both peers carry the SAME Local AS 65020
# and differ in one leaf, `local-options [ replace-as ]`. Once BOTH sessions are
# Established, the checker runs `send bgp * unicast 10.77.6.0/24`, which reaches
# AnnounceNLRIBatch, the rail that groups peers on announceFacts and builds ONE
# UPDATE per group (RFC 7705 Section 3.3):
#
#   frr   AS 65002, Local AS 65020, no option  ->  AS_PATH "65020 65001"
#   bird  AS 65003, Local AS 65020, replace-as ->  AS_PATH "65020"
#
# A group key that carried the bare local AS put both peers in one group, so
# whichever peer built first decided the AS_PATH both received.
#
# Every other announceFacts field is equal across the two sessions, so the
# replace-as prepend is the only thing that can keep them apart: the next hop
# is self (172.30.0.2 toward both), both are external, neither is an RS-client,
# neither sets the Prefix-SID leaf, both leave group-updates at its default,
# ze advertises no ADD-PATH send, and FRR and BIRD both speak four-octet AS.
# The extended field is the one that needed the peers aligned: ze may send RFC
# 8654 extended messages to a peer that advertised the capability, FRR
# advertises it by default and BIRD does not, so bird.conf enables it. Without
# that line the two sessions never share a group whatever the prepend says,
# which a red run with the key's prepend zeroed showed on 2026-10-09. The route
# is announced from the CLI after both sessions are up rather than originated
# from config at startup: a route that exists before a session is Established
# reaches that peer through its own initial sync, one peer at a time, and never
# meets the group key at all.
#
# bgp-as-migration-local-as proves the options themselves; this scenario proves
# that two peers sharing a Local AS are not merged.
#
# The checker is internal/le/interoplab/bgp/register_local_as_partition.go.

bgp {
	session {
		asn { local 65001; }
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65020; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65020; remote 65003; local-options [ replace-as ]; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
