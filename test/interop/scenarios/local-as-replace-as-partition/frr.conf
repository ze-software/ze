frr defaults traditional
hostname frr-local-as-partition
log file /tmp/frr.log informational
!
! RFC 7705 Section 3.3, a Local AS session with no option. FRR is AS 65002 and
! peers with ze's Local AS 65020. Ze's peer block carries no local-options, so
! FRR must install AS_PATH "65020 65001": the Local AS in front of ze's
! globally configured AS.
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65020
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
