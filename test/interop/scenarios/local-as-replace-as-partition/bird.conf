# RFC 7705 Section 3.3, a Local AS session under replace-as. BIRD is AS 65003
# and peers with ze's Local AS 65020, the same Local AS FRR peers with. Ze's
# peer block sets `local-options [ replace-as ]`, so BIRD must install AS_PATH
# 65020 alone, while FRR in the same lab is owed "65020 65001".
#
# import all: the route under test must reach BIRD's table for `show route all`
# to report its path.
#
# enable extended messages: FRR advertises the RFC 8654 capability by default
# and BIRD does not. Ze may send extended messages to a peer that advertised it
# (RFC 8654 Section 4, ExtendedMessageSend in negotiated.go), so without this
# line the two sessions differ in announceFacts.extended, never share a build
# group, and the scenario passes with the group key's prepend zeroed.
log stderr all;
router id 172.30.0.4;

protocol device {
}

protocol bgp ze_peer {
	local 172.30.0.4 as 65003;
	neighbor 172.30.0.2 as 65020;
	enable extended messages on;
	ipv4 {
		import all;
		export none;
	};
}
