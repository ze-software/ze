frr defaults traditional
hostname frr-ospf-transit
log file /tmp/frr.log informational
!
interface eth1
 ip ospf network point-to-point
 ip ospf area 0.0.0.1
 ip ospf cost 10
!
interface eth2
 ip ospf network point-to-point
 ip ospf area 0.0.0.1
 ip ospf cost 10
!
router ospf
 ospf router-id 172.30.0.14
!
