frr defaults traditional
hostname frr-ospf-vlink
log file /tmp/frr.log informational
!
! FRR is the far virtual-link endpoint. eth0 is in the transit area 0.0.0.1 (shared
! segment with Ze); its loopback is in the backbone (area 0.0.0.0). The virtual link
! through area 0.0.0.1 to Ze (router-id 172.30.0.2) repairs the backbone so FRR reaches
! Ze's backbone-fragment prefix (192.0.2.0/24). RFC 2328 section 15.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.1
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
 area 0.0.0.1 virtual-link 172.30.0.2
!
