frr defaults traditional
hostname frr-ospf-vlink
log file /tmp/frr.log informational
!
! The far virtual endpoint reaches Ze through frr-transit. Management eth0
! carries no OSPF; eth2 is the isolated far-side transit link.
interface eth2
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf area 0.0.0.1
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
 area 0.0.0.1 virtual-link 172.30.0.2
!
