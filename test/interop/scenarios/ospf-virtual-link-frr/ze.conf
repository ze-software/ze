# Ze side of the ospf-virtual-link-frr interop scenario (spec-ospf-ext-7, RFC 2328 sec 15).
#
# Ze and the endpoint FRR own separate backbone fragments. Their area 0.0.0.1
# path crosses a third FRR router on two isolated VLANs, so the virtual packet
# destination differs from its first hop. The carrier changes the transit cost,
# removes the far transit link and restores it.

# Install native OSPF routes through the existing system RIB and kernel backend.
# Connected routes resolve the physical transit next hop; no static underlay.
plugin {
	internal rib {
		use rib;
	}
	internal fib-kernel {
		use fib-kernel;
	}
	internal connected {
		use connected;
	}
}

connected {
}

telemetry {
	prometheus {
		enabled true
		netdata {
			enabled false
		}
	}
}

ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
		area 0.0.0.1 {
			area-type normal
			virtual-link 172.30.0.3 {
				hello-interval 10
				dead-interval 40
			}
		}
	}
	interfaces {
		interface eth1 {
			area 0.0.0.1
			network-type point-to-point
			cost 10
		}
		interface backbone0 {
			area 0.0.0.0
			passive true
		}
	}
}
