# Ze side of the ospf-virtual-link-frr interop scenario (spec-ospf-ext-7, RFC 2328 sec 15).
#
# Ze and FRR are both area-border routers directly attached to the transit area 0.0.0.1 on
# the shared segment (eth0). Each also owns a disjoint backbone (area 0.0.0.0) fragment on a
# loopback. A virtual link through the transit area 0.0.0.1 to FRR joins the two backbone
# fragments, so Ze originates a Type-4 virtual link record + V-bit and FRR reaches Ze's
# backbone-fragment prefix (192.0.2.0/24) across the repaired backbone.
#
# AUTHORED-PENDING-QEMU: exercises the routed (TTL > 1) virtual-link send + the RID/Area-0
# packet demux, which run only against the Linux kernel under the QEMU/Docker interop
# harness; it cannot run on darwin.

ospf {
	router-id 172.30.0.2
	areas {
		area 0.0.0.0 {
			area-type normal
		}
		area 0.0.0.1 {
			area-type normal
			virtual-link 172.30.0.3 {
				hello-interval 10
				dead-interval 40
			}
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.1
			network-type point-to-point
			cost 10
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
