# draft-ietf-bess-mup-safi Section 3.1.3.1 against a real MUP receiver. Ze's
# ingress recognizer (`recognizerFor`, internal/component/bgp/plugins/nlri/mup/
# rfc7606.go) answers Withdraw for the malformed K', and the reactor relays an
# MP_UNREACH_NLRI for it (`applyTypedNLRIDiscard`,
# internal/component/bgp/reactor/session_validation_nlritype.go).
#
# GoBGP is an rs-client, the rail test/plugin/mup-t1st-malformed-treat-as-withdraw.ci
# pins with hex, so Ze relays the injector's path transparently.
plugin {
	internal rs {
		use bgp-rs;
	}
}
bgp {
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/mup { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/mup { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
}
