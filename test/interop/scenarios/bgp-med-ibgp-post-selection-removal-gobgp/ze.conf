# RFC 4271 Section 9.1.2.2, with a raw export filter trying to remove MED
# before an internal readvertisement.
#
# FRR is EXTERNAL to Ze (65005 -> 65001) and announces 10.62.0.0/24 with
# MULTI_EXIT_DISC 100. GoBGP is INTERNAL to Ze (65001 -> 65001), and Ze uses
# next-hop self on that peer. The export filter on GoBGP declares raw=true and
# returns a full UPDATE body with attribute 4 removed. GoBGP must still receive
# Med 100 because forward_med.go restores MED at the common post-policy boundary
# for internal destinations.
plugin {
	internal rs {
		use bgp-rs;
	}
	internal bgp-adj-rib-in {
		use bgp-adj-rib-in;
	}
	external raw-med-drop {
		run "ze-test interop-bgp process bgp-med-ibgp-post-selection-removal-gobgp raw-med-drop";
		encoder json;
	}
}
bgp {
	peer frr-source {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65005; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		attach process bgp-adj-rib-in {
			receive [ update-received state ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			next-hop self;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		filter {
			export [ raw-med-drop:drop-med-raw ];
		}
		attach process bgp-adj-rib-in {
			receive [ update-received state ];
			send [ update ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
	}
}
