# Ze as a route server (RFC 7947) between three clients. Two of them announce the
# same prefix and neither negotiated ADD-PATH, so both paths arrive under Path
# Identifier 0. The third client negotiated ADD-PATH, so Ze must give each path an
# identifier OF ITS OWN before it re-advertises them (RFC 7911 Section 2). Relaying
# the received identifier sends both paths as the pair (10.99.0.0/24, 0), and RFC
# 7911 Section 5 makes the receiver treat the second as a replacement for the first.
# One path is lost, which is what this scenario measures at FRR.
plugin {
	internal rib {
		use bgp-rib;
	}
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# Client 1, the ADD-PATH receiver. It holds the RIB the assertion reads, so the
	# claim is made by a foreign daemon rather than by Ze's own view of what it sent.
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			# RFC 7947 Section 2.2.2.1: a route server MUST NOT prepend its own AS.
			# `rs-client` DEFAULTS TO FALSE and is the ONLY thing that selects the
			# non-prepending path (scenario 14 records the trap and its call sites).
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				add-path {
					direction send/receive;
				}
			}
		}
	}
	# Client 2 and client 3 are the colliding sources. NEITHER carries an add-path
	# stanza: a client that negotiated no ADD-PATH sends every path under identifier
	# 0, so both paths for 10.99.0.0/24 reach the egress transform under one value.
	# That is the ordinary mixed deployment and it needs no coincidence between the
	# two clients.
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
