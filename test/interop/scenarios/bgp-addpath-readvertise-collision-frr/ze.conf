# Ze as a route server (RFC 7947) between three clients. Two of them announce the
# same prefix and neither negotiated ADD-PATH, so both paths arrive under Path
# Identifier 0. The third client negotiated ADD-PATH, so Ze must give each path an
# identifier OF ITS OWN before it re-advertises them (RFC 7911 Section 2). Relaying
# the received identifier sends both paths as the pair (10.99.0.0/24, 0), and RFC
# 7911 Section 5 makes the receiver treat the second as a replacement for the first.
# One path is lost, which is what this scenario measures at FRR.
plugin {
	internal rib {
		use bgp-rib;
	}
	internal rs {
		use bgp-rs;
	}
	# The checker clears the FRR session and reads the two paths again, so the
	# second reading is served by the peer-up REPLAY rather than by a live
	# forward. The route server asks adj-rib-in for that replay, so without this
	# instance it waits for a store that does not exist and logs `peer-up replay
	# gave up waiting for adj-rib-in to reach the cut ... ingested=0`.
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	# Client 1, the ADD-PATH receiver. It holds the RIB the assertion reads, so the
	# claim is made by a foreign daemon rather than by Ze's own view of what it sent.
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			# RFC 7947 Section 2.2.2.1: a route server MUST NOT prepend its own AS.
			# `rs-client` DEFAULTS TO FALSE and is the ONLY thing that selects the
			# non-prepending path (scenario 14 records the trap and its call sites).
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				add-path {
					direction send/receive;
				}
			}
		}
		# Without this block the route server receives no peer-scoped event and
		# relays nothing: PeerScopedProcs (plugin/server/delivery_graph.go) reads
		# the attach bindings, and filterPermittedPeers (reactor/send_permission.go)
		# drops a destination whose bindings grant no `send update`. The tokens
		# match SetStartupSubscriptions in RunRouteServer (plugins/rs/server.go),
		# and `state` and `open-received` are as load-bearing as `update-received`,
		# because they are what fill peer.Up and peer.Families.
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		# The DESTINATION half of the replay: after the checker clears this session
		# the stored paths leave on this peer's wire, so adj-rib-in needs permission
		# to originate one here (maySend, reactor/send_permission.go).
		attach process adj-rib-in {
			send [ update ]
		}
	}
	# Client 2 and client 3 are the colliding sources. NEITHER carries an add-path
	# stanza: a client that negotiated no ADD-PATH sends every path under identifier
	# 0, so both paths for 10.99.0.0/24 reach the egress transform under one value.
	# That is the ordinary mixed deployment and it needs no coincidence between the
	# two clients.
	peer bird {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# See the peer above: this block is what feeds the route server.
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		# The SOURCE half of the replay: adj-rib-in stores what this peer sends.
		attach process adj-rib-in {
			receive [ update-received state ]
		}
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		# See the peer above: this block is what feeds the route server.
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		# The SOURCE half of the replay: adj-rib-in stores what this peer sends.
		attach process adj-rib-in {
			receive [ update-received state ]
		}
	}
}
