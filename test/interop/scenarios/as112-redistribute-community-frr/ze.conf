# Ze side of the as112-redistribute-community-frr interop scenario
# (spec-as112-3 AC-5: well-known BGP community on the redistribute path).
#
# The as112 service is configured with `community [ nopeer ]`; the redistribute
# producer attaches that community to EVERY announced COVERING prefix (unlike
# the hand-authored as112-community-frr, which injected a different community
# per prefix via a process plugin -- the producer applies one community list to
# all four covering prefixes). NOPEER (RFC 3765, 0xFFFFFF04) is carried on the
# wire as 65535:65284; FRR decodes and displays it as "no-peer".
#
# watchdog false decouples the announcement from DNS-serving state so this
# wire-correctness scenario is deterministic.

service {
	as112 {
		enabled true
		asn 112
		community [ nopeer ]
		watchdog false
	}
}

bgp {
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}

redistribute {
	destination bgp {
		import as112
	}
}
