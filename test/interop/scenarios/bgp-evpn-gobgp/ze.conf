plugin {
	external announce-routes {
		run "le test interop-bgp process bgp-evpn-gobgp announce-routes";
		encoder json;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				l2vpn/evpn { prefix { maximum 10000; } }
			}
		}
		attach process announce-routes {
			send [ update ];
		}
		# RFC 7432 Section 8.2.1: one Ethernet A-D per ES route for each
		# redundancy mode. GoBGP reads the ESI Label's three octets as one
		# 24-bit value, so ESI label 256 (001000) shows as "label":4096.
		update {
			attribute {
				origin igp;
				next-hop 172.30.0.2;
				extended-community [ target:65001:100 0x0601000000001000 ];
			}
			nlri { l2vpn/evpn add ethernet-ad rd 172.30.0.2:7 esi 00:01:02:03:04:05:06:07:08:09 etag 4294967295 redundancy-mode all-active; }
		}
		update {
			attribute {
				origin igp;
				next-hop 172.30.0.2;
				extended-community [ target:65001:100 0x0601010000002000 ];
			}
			nlri { l2vpn/evpn add ethernet-ad rd 172.30.0.2:7 esi 00:01:02:03:04:05:06:07:08:0a etag 4294967295 redundancy-mode single-active; }
		}
	}
}
