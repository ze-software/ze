# Ze side of the ospfv3-nbma-frr interop scenario (spec-ospf-ext-8, IPv6 NBMA).
#
# Ze runs the OSPFv3 (IPv6) family with eth0 as a non-broadcast (NBMA) interface:
# it discovers the peer only through the static nbma-neighbor list (keyed by Router
# ID, unicast Hellos to the link-local), elects a DR/BDR, and the DR originates the
# 0x2002 Network-LSA + Link-LSA (RFC 5340 App A.4.4).
#
# NOTE: FRR ospf6d does not implement OSPFv3 NBMA, so full NBMA-to-NBMA interop is
# gated (see the internal/le/interoplab/bgp checker); the v6 NBMA wire behavior is unit-tested.

ospf {
	router-id 172.30.0.2
	address-family ipv6 {
		areas {
			area 0.0.0.0 {
				area-type normal
			}
		}
		interfaces {
			interface eth0 {
				area 0.0.0.0
				network-type nbma
				cost 10
				poll-interval 20
				nbma-neighbor 172.30.0.3 {
					priority 1
				}
			}
		}
	}
}
