frr defaults traditional
hostname frr-ospfv3-nbma
log file /tmp/frr.log informational
!
! FRR ospf6d does NOT implement an OSPFv3 non-broadcast (NBMA) network type, so
! there is no `ipv6 ospf6 network non-broadcast`. This peer is configured with the
! default broadcast type for the shared bridge; true NBMA-to-NBMA interop is gated
! in the internal/le/interoplab/bgp checker until an ospf6d build supports NBMA. Ze's v6 NBMA
! election,
! Network-LSA, and Link-LSA behavior is validated by the Go unit tests
! (TestOSPFv3NBMAElection / NBMANetworkLSA / NBMALinkLSA).
interface eth0
 ipv6 ospf6 area 0.0.0.0
!
router ospf6
 ospf6 router-id 172.30.0.3
!
