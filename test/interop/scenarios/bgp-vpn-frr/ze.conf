plugin {
	external announce-routes {
		run "le test interop-bgp process bgp-vpn-frr announce-routes";
		encoder json;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	# One FRR speaker (AS 65002, router-id 172.30.0.3) holds both sessions,
	# and RFC 6286 Section 2.1 has a speaker use one identifier "for every
	# local interface and every BGP peer". Ze's default AS-wide uniqueness
	# claim would refuse the second session with Bad BGP Identifier, so the
	# lab opts out as docs/guide/configuration.md describes for this case.
	session { allow-shared-router-id true; }
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		attach process announce-routes {
			send [ update ];
		}
	}
	# RFC 4659 Section 3.2.1.1: one IPv6 session to FRR and one to BIRD, each
	# with the `link-local` leaf, each carrying the same two VPN-IPv6 routes.
	# The on-link route's global next hop is Ze's own address on the lab /64
	# both receivers share, so its Next Hop field is 48 octets (zero RD, global,
	# zero RD, @ZE_LINK_LOCAL@). The other route's global is a third party's
	# address, not Ze's, and Ze does not learn that router's link-local, so its
	# field is 24 octets and carries no link-local. FRR 10.3.1 prints the
	# link-local of a 48-octet VPN next hop nowhere, so BIRD is the receiver
	# that shows it.
	peer frr6 {
		connection {
			remote { ip fd00:1e:0::3; }
			local  { ip fd00:1e:0::2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			link-local @ZE_LINK_LOCAL@;
			family {
				ipv6/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		update {
			attribute {
				origin igp;
				next-hop fd00:1e:0::2;
			}
			nlri {
				ipv6/mpls-vpn add rd 65001:100 label 1002 2001:db8:4659::/48;
			}
		}
		update {
			attribute {
				origin igp;
				next-hop 2001:db8:ffff::1;
			}
			nlri {
				ipv6/mpls-vpn add rd 65001:100 label 1003 2001:db8:465a::/48;
			}
		}
	}
	peer bird6 {
		connection {
			remote { ip fd00:1e:0::4; }
			local  { ip fd00:1e:0::2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			link-local @ZE_LINK_LOCAL@;
			family {
				ipv6/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		update {
			attribute {
				origin igp;
				next-hop fd00:1e:0::2;
			}
			nlri {
				ipv6/mpls-vpn add rd 65001:100 label 1002 2001:db8:4659::/48;
			}
		}
		update {
			attribute {
				origin igp;
				next-hop 2001:db8:ffff::1;
			}
			nlri {
				ipv6/mpls-vpn add rd 65001:100 label 1003 2001:db8:465a::/48;
			}
		}
	}
}
