plugin {
	external announce-routes {
		run "le test interop-bgp process bgp-vpn-frr announce-routes";
		encoder json;
	}
}
bgp {
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		attach process announce-routes {
			send [ update ];
		}
	}
	# RFC 4659 Section 3.2.1.1 against FRR: one IPv6 session, one `link-local`
	# leaf, two VPN-IPv6 routes. The on-link route's global next hop is Ze's
	# own address on the lab /64 FRR shares, so its Next Hop field is 48 octets
	# (zero RD, global, zero RD, @ZE_LINK_LOCAL@). The off-link route's global is
	# on no connected prefix, so its field is 24 octets and carries no link-local.
	peer frr6 {
		connection {
			remote { ip fd00:1e:0::3; }
			local  { ip fd00:1e:0::2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			link-local @ZE_LINK_LOCAL@;
			family {
				ipv6/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		update {
			attribute {
				origin igp;
				next-hop fd00:1e:0::2;
			}
			nlri {
				ipv6/mpls-vpn add rd 65001:100 label 1002 2001:db8:4659::/48;
			}
		}
		update {
			attribute {
				origin igp;
				next-hop 2001:db8:ffff::1;
			}
			nlri {
				ipv6/mpls-vpn add rd 65001:100 label 1003 2001:db8:465a::/48;
			}
		}
	}
}
