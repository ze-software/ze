log stderr all;
router id 172.30.0.4;

protocol device {
}

vpn6 table vpntab6;

# The RFC 4659 Section 3.2.1.1 receiver. BIRD 2.15.1 keeps both addresses of
# a 48-octet VPN-IPv6 Next Hop and prints them on the BGP.next_hop line, and it
# refuses the UPDATE when either RD is non-zero (proto/bgp/packets.c,
# bgp_decode_next_hop_vpn). Recursive gateway mode keeps the off-link route,
# whose next hop is on no connected network, in the table as unreachable rather
# than withdrawing it, so its BGP.next_hop line can be read too.
protocol bgp ze_vpn6 {
	local fd00:1e:0::4 as 65003;
	neighbor fd00:1e:0::2 as 65001;
	vpn6 mpls {
		table vpntab6;
		import all;
		export none;
		gateway recursive;
		igp table master6;
	};
}
