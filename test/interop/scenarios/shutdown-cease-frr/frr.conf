frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! Graceful Restart is enabled on purpose: it is what makes this scenario
! discriminate. A GR-capable peer that loses the TCP connection with no
! NOTIFICATION keeps the restarting speaker's routes as STALE until Restart
! Time expires (RFC 4724 Section 4.2), so an administrative shutdown that
! closes the socket silently leaves FRR forwarding to a box that is gone.
! A Cease NOTIFICATION ends the session instead of restarting it (RFC 4724
! Section 4.3), so the routes go immediately.
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 bgp graceful-restart
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
