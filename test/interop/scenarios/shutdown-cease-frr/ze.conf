plugin {
	internal rib {
		use bgp-rib;
	}
	internal gr {
		use bgp-gr;
	}
	external announce-shutdown {
		run /etc/ze/announce-shutdown.py;
		encoder json;
	}
}
bgp {
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart {
					restart-time 300;
				}
			}
		}
		attach process announce-shutdown {
			send update;
		}
	}
}
