bus {
	endpoint bgp-rib {
		internal bgp-rib;
		send {
			message bgp:update {
				to none;
			}
		}
	}
	endpoint bgp-rs {
		internal bgp-rs;
	}
	endpoint bgp-adj-rib-in {
		internal bgp-adj-rib-in;
	}
	endpoint bgp-filter-prefix {
		internal bgp-filter-prefix;
	}
}
policy {
	prefix-list RS-DENY-ONE {
		entry 10.99.1.0/24 { action reject; }
		entry 10.99.0.0/24 { action accept; }
	}
	match match-rs-deny-one { prefix-list RS-DENY-ONE; }
}
bgp {
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		filter {
			import { filters [ match-rs-deny-one ]; final accept; }
			export { final accept; }
		}
	}
	peer peer2 {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			rs-client true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
