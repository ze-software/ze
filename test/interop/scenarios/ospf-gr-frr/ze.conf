# Ze side of the ospf-gr-frr interop scenario (spec-ospf-ext-9, RFC 3623).
#
# Ze forms a point-to-point OSPFv2 adjacency with FRR ospfd and enables Graceful
# Restart in both roles: planned restarter (originate Grace-LSAs, retain the FIB)
# and helper (hold a restarting FRR neighbor). opaque true is required because the
# RFC 3623 Grace-LSA is a Type-9 opaque LSA.
ospf {
	router-id 172.30.0.2
	opaque true
	graceful-restart {
		restarter { support planned restart-interval 120 }
		helper { support true strict-lsa-checking true }
	}
	areas { area 0.0.0.0 { area-type normal } }
	interfaces {
		interface eth0 { area 0.0.0.0 network-type point-to-point cost 10 }
		interface lo { area 0.0.0.0 passive true }
	}
}
