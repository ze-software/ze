# A real operator raw command must not bypass RFC 7607 final-wire admission.
bgp {
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer frr-relay {
		connection {
			remote { ip 172.30.0.10; connect false; }
			local { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			capability { asn4 disable; graceful-restart disable; }
			family { ipv4/unicast { prefix { maximum 100; } } }
		}
		timer { receive-hold-time 90; }
	}
}
