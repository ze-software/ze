frr defaults traditional
hostname as-zero-frr
log file /tmp/frr.log informational
!
router bgp 65002
 bgp router-id 172.30.0.3
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 172.30.0.10 remote-as 65001
 neighbor 172.30.0.10 passive
 neighbor 172.30.0.10 timers 3 90
 address-family ipv4 unicast
  neighbor 172.30.0.10 activate
 exit-address-family
!
