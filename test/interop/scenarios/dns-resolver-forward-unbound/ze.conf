# Ze as the LAN DNS resolver, forwarding to Unbound.
#
# The lab client (dnsclient, 172.30.0.42) queries ze at its lab address. Ze
# forwards every cache miss to Unbound (172.30.0.41), which resolves the lab
# zone lab.example. from Knot DNS (172.30.0.40). The checker compares ze's
# answers with Unbound's own, and counts in Unbound's query log how often ze
# asked it.
service {
    dns-resolver {
        enabled true;
        listener lan {
            ip 172.30.0.2;
            port 53;
        }
        allow-from [ 172.30.0.0/24 ];
        forward {
            server 172.30.0.41 {
                port 53;
            }
        }
    }
}
