# Unbound as the upstream recursive resolver of ze's LAN resolver.
#
# No chroot and no user switch, so the read-only mount is all it reads. Every
# query and reply is logged to stderr, which the checker reads: the line
# "info: <source> <name> <type> IN" counts what ze asked.
server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    access-control: 0.0.0.0/0 allow
    chroot: ""
    username: ""
    directory: "/etc/unbound"
    use-syslog: no
    logfile: ""
    verbosity: 1
    log-queries: yes
    log-replies: yes
    module-config: "iterator"

# The lab zone is served by Knot; Unbound resolves it from there.
stub-zone:
    name: "lab.example."
    stub-addr: 172.30.0.40
