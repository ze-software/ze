# A peer block with NO `family` section, which is the configuration this
# scenario exists for. Ze therefore advertises no Multiprotocol capability, and
# RFC 4271 carries IPv4 unicast without one.
bgp {
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
		}
		update {
			attribute {
				origin igp
				next-hop 172.30.0.2
			}
			nlri {
				ipv4/unicast add 10.10.0.0/24
			}
		}
	}
}
