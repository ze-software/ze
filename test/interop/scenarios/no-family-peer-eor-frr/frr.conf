frr defaults traditional
hostname frr
! debugging level, not informational: check.py reads FRR's own per-UPDATE decode
! to learn that the End-of-RIB marker arrived. Neither a routing table nor
! `show bgp neighbor json` can answer that question here -- FRR fills
! gracefulRestartInfo.endOfRibRecv only for the address families a peer named in
! a Graceful Restart capability, and a peer with no `family` block advertises
! neither that capability nor a Multiprotocol one.
log file /tmp/frr.log debugging
!
debug bgp updates
debug bgp updates in
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
