bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/mpls-vpn { prefix { maximum 10000; } }
			}
			capability {
				add-path {
					direction send/receive;
					family {
						ipv4/mpls-vpn;
					}
				}
			}
		}
		# No path-information: the static route reaches BuildVPN with
		# Path Identifier 0, which ADD-PATH still puts on the wire.
		update {
			attribute {
				origin igp;
				next-hop 172.30.0.2;
			}
			nlri {
				ipv4/mpls-vpn add rd 65001:100 label 1000 10.99.0.0/24;
			}
		}
	}
}
