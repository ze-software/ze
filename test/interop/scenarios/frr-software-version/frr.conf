frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
router bgp 65002
 bgp router-id 172.30.0.3
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 capability software-version
 neighbor fd00:1e:0::2 remote-as 65001
 neighbor fd00:1e:0::2 capability software-version
 neighbor fd00:1e:0::2 local-as 65003 no-prepend replace-as
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fd00:1e:0::2 activate
 exit-address-family
!
