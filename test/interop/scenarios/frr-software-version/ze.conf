# Ze side of the frr-software-version interop scenario. Two sessions to one
# FRR: peer legacy, over IPv4, sends the length-prefixed form, and peer draft,
# over IPv6, the draft's bare form. ze refuses two peers with one remote
# address, and two with one BGP Identifier in an AS, so FRR speaks to peer
# draft as AS 65003.
bgp {
	peer legacy {
		connection {
			remote {
				ip 172.30.0.3;
			}
			local {
				ip 172.30.0.2;
			}
		}
		session {
			asn {
				local 65001;
				remote 65002;
			}
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
				software-version {
					encoding legacy;
				}
			}
		}
	}
	peer draft {
		connection {
			remote {
				ip fd00:1e:0::3;
			}
			local {
				ip fd00:1e:0::2;
			}
		}
		session {
			asn {
				local 65001;
				remote 65003;
			}
			router-id 172.30.0.2;
			family {
				ipv6/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
				software-version {
					encoding draft;
				}
			}
		}
	}
}
