# dnsmasq as ze's DHCPv4 server on the shared interop segment (172.30.0.20).
#
# The pool is one address, so the lease ze holds is known in advance. The
# lease is dnsmasq's minimum of 120 s; options 58 and 59 bring T1 to 20 s and
# T2 to 40 s so three renewals fit in about a minute.
#
# dhcp-authoritative makes dnsmasq answer a DHCPREQUEST it holds no lease for,
# and NAK one it cannot grant. The checker writes a reservation for another
# address into /run/dhcp-hosts and sends SIGHUP: dnsmasq then NAKs the next
# RENEW ("static lease available") and offers the reserved address.
#
# No DNS service (port=0), and no router or DNS server option, so the lease
# changes nothing in ze's container but the address on eth0.
port=0
interface=eth0
user=root
no-ping
log-dhcp
dhcp-authoritative
dhcp-leasefile=/run/dnsmasq.leases
dhcp-hostsfile=/run/dhcp-hosts
dhcp-range=172.30.0.50,172.30.0.50,255.255.255.0,120s
dhcp-option=option:router
dhcp-option=option:dns-server
dhcp-option=option:T1,20
dhcp-option=option:T2,40
