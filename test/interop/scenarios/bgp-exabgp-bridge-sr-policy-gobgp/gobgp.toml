# RFC 9830 SR Policy announced by an ExaBGP API script through the bridge,
# read by GoBGP, which negotiates
# ipv4-srpolicy and ipv6-srpolicy and prints each received policy's NLRI and
# Tunnel Encapsulation sub-TLVs through gobgp-paths
# (Dockerfile.gobgp), since the gobgp CLI names no SR Policy family.
[global.config]
  as = 65002
  router-id = "172.30.0.5"
  port = 179

[[neighbors]]
  [neighbors.config]
    neighbor-address = "172.30.0.2"
    peer-as = 65001
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv4-unicast"
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv4-srpolicy"
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv6-srpolicy"
