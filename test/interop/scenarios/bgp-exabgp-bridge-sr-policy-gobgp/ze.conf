# RFC 9830 SR Policy announced by an ExaBGP API script through the exabgp
# bridge, read back by GoBGP (AC-28 of spec-exabgp-6-api-compatibility). The
# script is ExaBGP's own command line, `announce ipv4 sr-policy ... preference
# 300 segment-list weight 1 segment type-a mpls 16001 segment-list weight 2
# segment type-a mpls 16002 extended-community [ target:172.30.0.5:0 ]`, and
# the bridge hands it to `update text`, whose
# sr-policy section reaches the config-route parser. The checker in
# internal/le/interoplab/bgp (register_exabgp_bridge_sr_policy.go) requires
# GoBGP's RIB (read through gobgp-paths, built by Dockerfile.gobgp) to show
# the NLRI, the preference, both segment labels and the Route Target, typed by
# GoBGP as sub-type 2 of an IPv4-address-specific community.
# The Route Target is RFC 9830 Section 4.2.1's: "The SR Policy update MUST
# have either the NO_ADVERTISE community, at least one Route Target extended
# community in IPv4-address format, or both." ExaBGP 6.0 refuses the line
# without one.
#
# Only ze.conf is mounted into the container, so the script is busybox printf
# with the command as its format: the bridge splits `run` as Python's shlex does
# (bridge.SplitCommandLine), so the format is single-quoted to keep its
# backslashes, and \040 is the space printf writes. The
# config tokenizer reads a quoted `\\` as one backslash and drops the
# backslash of an escape it does not know, so printf's `\040` and `\n` are
# written `\\040` and `\\n` here. The
# script prints one line and exits; respawn disable keeps the bridge from
# re-running it, and the bgp-rib plugin holds the route for the session.
exabgp {
	bridge {
		process announce-sr-policy {
			run "/usr/bin/printf 'announce\\040ipv4\\040sr-policy\\040distinguisher\\0400\\040color\\040300\\040endpoint\\04010.0.0.3\\040next-hop\\040172.30.0.2\\040preference\\040300\\040segment-list\\040weight\\0401\\040segment\\040type-a\\040mpls\\04016001\\040segment-list\\040weight\\0402\\040segment\\040type-a\\040mpls\\04016002\\040extended-community\\040[\\040target:172.30.0.5:0\\040]\\n'"
			respawn disable
			feed 172.30.0.5 {
				event [ ]
			}
		}
	}
}
plugin {
	internal bgp-rib {
		use bgp-rib
	}
	internal exabgp-bridge {
		use exabgp-bridge
	}
}
bgp {
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/sr-policy { prefix { maximum 10000; } }
			}
		}
		attach process bgp-rib {
			receive [ update state refresh ]
			send [ update ]
		}
		attach process exabgp-bridge {
			receive [ * ]
			send [ * ]
		}
	}
}
