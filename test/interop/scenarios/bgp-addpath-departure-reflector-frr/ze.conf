# A source departure through the route reflector, observed at a foreign
# ADD-PATH receiver.
#
# Ze (AS 65000) runs bgp-rr with two clients: a raw injector at 172.30.0.9 that
# announces two paths of 10.0.0.0/8 under ADD-PATH (Path Identifiers 11 and 12),
# and FRR at 172.30.0.3, which negotiated ADD-PATH receive. Ze re-advertises
# both paths to FRR under identifiers of its own. RFC 7911 Section 2: "A BGP
# speaker that re-advertises a route MUST generate its own Path Identifier to
# be associated with the re-advertised route."
#
# The checker then stops the injector. bgp-rr hands the departure to the
# engine's recovery (recovery-source), which withdraws each path under the
# identifier Ze advertised to FRR, so FRR drops every path. Before that fix
# bgp-rr withdrew under the SOURCE's identifiers, which name no path FRR holds,
# and FRR kept both (plan/journal/identity-default-hides-a-mapping.md).
#
# Graceful Restart is off on both sessions: a stopped injector is a TCP
# failure, and a retained family would hold the paths through the restart
# window instead of withdrawing them (RFC 4724 Section 4.2).
plugin {
	internal relay {
		use bgp-rr;
	}
}
bgp {
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65000; remote 65000; }
			router-id 172.30.0.2;
			route-reflector-client true;
			cluster-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
				add-path { direction receive; family { ipv4/unicast; } }
			}
		}
		attach process relay {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		# The recovery elects through bgp-rib, so the source's paths are stored.
		attach process bgp-rib {
			receive [ update state refresh ]
			send [ update ]
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65000; remote 65000; }
			router-id 172.30.0.2;
			route-reflector-client true;
			cluster-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability {
				graceful-restart disable;
				add-path { direction send; family { ipv4/unicast; } }
			}
		}
		attach process relay {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process bgp-rib {
			receive [ update state refresh ]
			send [ update ]
		}
	}
}
