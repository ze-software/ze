frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! FRR is the ADD-PATH RECEIVING client: it advertises ADD-PATH receive for
! IPv4 unicast by default, so Ze sends it both paths under Ze's own Path
! Identifiers. It also originates one prefix of its own, which is not asserted
! on: it is the injector's readiness barrier. Blackhole so zebra has a matching
! route for `network`.
ip route 10.20.0.0/24 blackhole
!
router bgp 65000
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65000
 neighbor 172.30.0.2 update-source 172.30.0.3
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  network 10.20.0.0/24
 exit-address-family
!
