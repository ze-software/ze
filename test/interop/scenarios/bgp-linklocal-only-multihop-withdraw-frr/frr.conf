frr defaults traditional
hostname frr
! debugging level, not informational: the internal/le/interoplab/bgp checker
! reads FRR's own per-UPDATE decode, which only `debug bgp updates in` emits.
log file /tmp/frr.log debugging
!
debug bgp updates
debug bgp updates in
debug bgp neighbor-events
!
! The session address sits on loopback, outside every subnet Ze is attached to,
! so Ze's link scope (newLinkScope, link_scope.go) classifies FRR as off-link.
! The checker routes it via FRR's adjacent interface; no transit router exists.
! FRR also needs a Global IPv6 address on the interface the session leaves
! from, or it has no IPv6 next hop of its own and ends the session with a Cease.
interface lo
 ip address 10.255.0.3/32
 ipv6 address 2001:db8:ff::3/128
exit
!
router bgp 65002
 bgp router-id 10.255.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 ebgp-multihop 2
 neighbor 172.30.0.2 update-source 10.255.0.3
 neighbor 172.30.0.2 timers connect 5
 ! Capability 77 is what makes Ze's multihop gate the ONLY gate that can
 ! withhold the Link-Local-only route: without it, the "did not negotiate the
 ! capability" gate refuses the same route and the scenario cannot go red.
 ! FRR 10.4 is the first release here that speaks it (frr-image).
 neighbor 172.30.0.2 capability link-local
 ! Ze relays as a route server, so the leftmost AS is the injector's 65004.
 no neighbor 172.30.0.2 enforce-first-as
 !
 address-family ipv6 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
