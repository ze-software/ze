# draft-ietf-idr-linklocal-capability Section 4 against a real receiver (FRR 10.4.1).
#
# Of a multihop external peer: "Link-Local IPv6 next hops MUST NOT be included."
# When that leaves no next hop: "the BGP route MUST not be advertised to its peer.
# Instead, treat-as-withdraw (Section 2 of [RFC7606]) is used."
#
#   injector (AS 65004, 172.30.0.9) -- one hop --> ze (AS 65001) -- multihop --> FRR (AS 65002, 10.255.0.3)
#
# The injector relays one prefix twice. Generation 1 carries the Global next hop
# 2001:db8:9::9, and FRR learns it. Generation 2 carries ONLY the Link-Local
# fe80::9, which Ze may not send to a peer more than one hop away, so FRR must
# decode a WITHDRAWAL of the prefix and never a second announcement of it.
#
# Both sessions negotiate capability 77. The injector mirrors Ze's OPEN, and FRR
# configures `capability link-local`. That is what makes the multihop gate
# (egressNextHopLinkLocalOnlyOffLink, forward_next_hop.go) the only gate that
# can withhold generation 2.
#
# FRR's session address is on its loopback, outside every subnet Ze is attached
# to. That, not the TTL, is what Ze's link scope reads.
plugin {
	internal rs {
		use bgp-rs;
	}
}
bgp {
	# The raw injector. Ze dials it (accept false), because le test peer
	# listens rather than connects in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			link-local fe80::be:ef:2;
			family {
				ipv6/unicast { prefix { maximum 10000; } }
			}
			capability {
				link-local-nexthop
			}
		}
		behavior {
			rs-fast-path enable;
		}
	}
	peer frr {
		connection {
			remote { ip 10.255.0.3; }
			local  { ip 172.30.0.2; }
			ttl {
				set 2;
			}
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			link-local fe80::be:ef:2;
			# The received next hop stays in place, which is the mode the
			# multihop gate exists for. A rewrite would hide the Link-Local.
			next-hop unchanged;
			family {
				ipv6/unicast { prefix { maximum 10000; } }
			}
			capability {
				link-local-nexthop
			}
		}
		behavior {
			rs-fast-path enable;
		}
	}
}
