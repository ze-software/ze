# Ze side of the as112-redistribute-lab interop scenario
# (spec-as112-3 AC-13: the full AS112 anycast node lab).
#
# This is the end-to-end node: the REAL as112 DNS server runs (it binds UDP+TCP
# port 53 on the fixed anycast addresses and on loopback inside the container and
# answers authoritatively for the RFC 1918 / link-local reverse zones), AND the
# redistribute producer originates the AS112 COVERING prefixes into BGP.
#
# watchdog true (the RFC 7534 Section 3.3 default) couples the two: the covering
# prefixes are announced ONLY while the DNS node is serving. In a container
# as112 can bind port 53 and serve, so the watchdog opens and the prefixes are
# announced. The FRR peer is eBGP (remote AS 65002), so it observes AS_PATH
# [65001, 112] (ze prepends its local AS ahead of the producer's origin AS 112).
#
# the internal/le/interoplab/bgp checker asserts BOTH facets: (a) the covering prefixes reach FRR
# with the
# right origin/AS_PATH, and (b) the node answers an authoritative SOA query for
# 10.in-addr.arpa (queried on 127.0.0.1:53 inside the ze container).

service {
	as112 {
		enabled true
		asn 112
		watchdog true
	}
}

bgp {
	peer frr-lab {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}

redistribute {
	destination bgp {
		import as112
	}
}
