# RFC 4684 Route Target membership announced by an ExaBGP API script through
# the exabgp bridge, read back by GoBGP (AC-26 of
# spec-exabgp-6-api-compatibility). The script is ExaBGP 6.0's own command
# line, `announce ipv4 rtc origin-as 65001 route-target 65001:100 next-hop
# 172.30.0.2`, and the bridge hands it to `update text ... mp ipv4/rtc add
# ...`, which the rtc plugin encodes (RFC 4684 Section 4). The checker in
# internal/le/interoplab/bgp (register_exabgp_bridge_rtc.go) requires GoBGP's
# RIB (read through gobgp-paths, built by Dockerfile.gobgp) to show it.
#
# The 0-bit default membership (`announce ipv4 rtc default ...`) is not sent.
# GoBGP v3.31.0 panicked on it in BgpServer.propagateUpdate, which compared
# each earlier membership's RouteTarget.String() with the new one's while the
# default membership's Route Target is nil (2026-10-20, nil dereference at
# pkg/server/server.go:1267, gobgpd exited). GoBGP v4.10.0, the version
# Dockerfile.gobgp now installs, handles it: processRTCMembership answers a
# nil Route Target through rtmHandler.HasDefaultRouteTarget, and
# RouteTargetMembershipNLRI.String prints a nil one as "0:0"
# (pkg/server/server.go, pkg/packet/bgp/bgp.go). The scenario still sends the
# specific membership only; adding the default one is not part of the move.
#
# Only ze.conf is mounted into the container, so the script is busybox printf
# with the commands as its format: the bridge splits `run` on whitespace
# (bridgeplugin splitCommand), and \040 is the space printf writes. The
# config tokenizer reads a quoted `\\` as one backslash and drops the
# backslash of an escape it does not know, so printf's `\040` and `\n` are
# written `\\040` and `\\n` here. The script prints one line and exits;
# respawn disable keeps the bridge from re-running it, and the bgp-rib plugin
# holds the routes for the session.
exabgp {
	bridge {
		process announce-rtc {
			run "/usr/bin/printf announce\\040ipv4\\040rtc\\040origin-as\\04065001\\040route-target\\04065001:100\\040next-hop\\040172.30.0.2\\n"
			respawn disable
			feed 172.30.0.5 {
				event [ ]
			}
		}
	}
}
plugin {
	internal bgp-rib {
		use bgp-rib
	}
	internal exabgp-bridge {
		use exabgp-bridge
	}
}
bgp {
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
				ipv4/rtc { prefix { maximum 10000; } }
			}
		}
		attach process bgp-rib {
			receive [ update state refresh ]
			send [ update ]
		}
		attach process exabgp-bridge {
			receive [ * ]
			send [ * ]
		}
	}
}
