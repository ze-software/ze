frr defaults traditional
hostname frr-isis-maxmetric
log file /tmp/frr.log informational
!
! IS-IS on the shared bridge to Ze (eth0). FRR is the foreign implementation
! here: it forms the adjacency, accepts the Ze LSP whose TLV 22 neighbor entry
! carries the maximum link metric (16777215), and originates reachability of its
! own so Ze has something to install if it wrongly walks that link.
interface eth0
 ip router isis ZE
 isis circuit-type level-1-2
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
!
! A distinctive prefix only FRR advertises, so its presence in Ze's IS-IS route
! table is unambiguous evidence that Ze reached FRR through the excluded link.
interface lo
 ip address 10.77.7.7/32
 ip router isis ZE
 isis passive
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
!
