# Ze side of the isis-max-metric-frr interop scenario (RFC 5305 section 3).
#
# RFC 5305 section 3: "If a link is advertised with the maximum link metric
# (2^24 - 1), this link MUST NOT be considered during the normal SPF
# computation. This will allow advertisement of a link for purposes other than
# building the normal Shortest Path Tree. An example is a link that is available
# for traffic engineering, but not for hop-by-hop routing."
#
# eth0 carries exactly that metric, 16777215. Ze and FRR still form the IS-IS
# adjacency, Ze still originates the link in its LSP and FRR still parses it, but
# Ze must not use the link to reach FRR: FRR's 10.77.7.7/32 must never appear in
# `show isis route`.

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1-l2
	hostname ze-maxmetric
	interfaces {
		interface eth0 {
			metric 16777215
			level l1-l2
			circuit-type point-to-point
			hello-interval 1
			hold-multiplier 3
		}
	}
}
