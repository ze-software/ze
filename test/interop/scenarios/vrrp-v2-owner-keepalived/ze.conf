# Ze as the VRRPv2 address owner on the shared interop segment.
#
# 172.30.0.60 is a real address on eth0 and also the group's virtual address,
# so Ze owns it and runs the group at priority 255 (RFC 3768 Section 5.3.4).
# The primary address 172.30.0.2 stays first, so Ze's advertisements carry it
# as their source.
#
# keepalived.conf claims the same VRID and address at priority 255 from
# 172.30.0.8. Without the owner discard of RFC 3768 Section 7.1, that equal
# priority from a greater source address demotes Ze (Section 6.4.3), and the
# virtual address leaves Ze's virtual-MAC interface. The scenario checks that
# it stays.
#
# The owned address sits above keepalived's 172.30.0.8 on purpose. The
# tie-break compares the sender with the address Ze sends from, 172.30.0.2,
# and loses. A tie-break that compared it with the first virtual address
# instead would win, and the scenario would then stay green with the discard
# removed. Ordered this way, it goes red if either defect returns.
interface {
    backend netlink;
    ethernet eth0 {
        unit 0 {
            ipv4 {
                address [ 172.30.0.2/24 172.30.0.60/24 ];
                vrrp {
                    group owner {
                        vrid 20;
                        version 2;
                        virtual-address [ 172.30.0.60 ];
                        advertise-interval-milliseconds 1000;
                    }
                }
            }
        }
    }
}
