# keepalived as a second VRRPv2 router that claims priority 255 for VRID 20.
#
# `version 2` matches Ze's group: keepalived speaks VRRPv2 by default, but the
# version is written out because the scenario is about the VRRPv2 owner rule.
#
# Priority 255 from 172.30.0.8 is the stimulus. It equals Ze's owner priority
# and comes from a greater address than Ze's 172.30.0.2, so a router that
# processed it would give up mastership (RFC 3768 Section 6.4.3). The owner
# must discard it instead (Section 7.1). keepalived does not own 172.30.0.60,
# so this is a misconfiguration on purpose.
#
# Unicast, bound to its own address, so keepalived never hears Ze. keepalived
# 2.3.1 treats a priority-255 advertisement arriving while it is itself at 255
# as "CONFIGURATION ERROR: local instance and a remote instance are both
# configured as address owner" and drops itself to 254, which ends the
# stimulus after one advertisement. Deaf to Ze, it stays at 255 and keeps
# advertising to 172.30.0.2 every second. Ze's raw proto-112 socket takes a
# unicast advertisement as it takes a multicast one.
#
# No use_vmac: keepalived puts the address on eth0 itself.
global_defs {
    vrrp_garp_master_refresh 0
}

vrrp_instance VI_OWNER {
    state MASTER
    interface eth0
    virtual_router_id 20
    priority 255
    advert_int 1
    version 2
    unicast_src_ip 172.30.0.8
    unicast_peer {
        172.30.0.2
    }
    virtual_ipaddress {
        172.30.0.60/24
    }
}
