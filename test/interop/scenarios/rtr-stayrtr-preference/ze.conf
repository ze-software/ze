# Two StayRTR caches with different VRP sets. The standby (preference 20) is
# listed FIRST, so a client that walks the cache list in config order instead of
# preference order loads the standby's set and rejects 9.59.0.0/24 from the start.
# RFC 8210 Section 10: "the lower the value, the more preferred".
# `port 8282` is StayRTR's default RTR port, not Ze's 323 plain-TCP default.
plugin {
	internal bgp-rpki {
		use bgp-rpki;
	}
	internal bgp-adj-rib-in {
		use bgp-adj-rib-in;
	}
	internal bgp-rib {
		use bgp-rib;
	}
	internal rs {
		use bgp-rs;
	}
}
bgp {
	rpki {
		cache-server 172.30.0.14 {
			trusted-network true;
			port 8282;
			preference 20;
		}
		cache-server 172.30.0.12 {
			trusted-network true;
			port 8282;
			preference 10;
		}
		validation-timeout 5;
		action {
			invalid reject;
			not-found accept;
		}
	}
	group preference-peers {
		session {
			asn { local 65000; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process bgp-rpki {
			receive [ update-received state ];
		}
		attach process bgp-adj-rib-in {
			receive [ update-received state ];
			send [ update ];
		}
		attach process bgp-rib {
			receive [ update state refresh ];
			send [ update ];
		}
		attach process rs {
			receive [ update-received state open-received refresh ];
			send [ update ];
		}
		peer frr-source {
			connection {
				remote { ip 172.30.0.3; }
				local { ip 172.30.0.2; }
			}
			session { asn { remote 65001; } }
		}
		peer bird-sink {
			connection {
				remote { ip 172.30.0.4; }
				local { ip 172.30.0.2; }
			}
			session { asn { remote 65002; } }
		}
	}
}
