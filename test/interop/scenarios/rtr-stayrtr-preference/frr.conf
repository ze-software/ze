frr defaults traditional
hostname frr-rpki-preference
log file /tmp/frr.log informational
!
! 9.59.0.0/24 is Valid under the preferred cache and Invalid under the standby;
! 10.59.0.0/16 is Valid under both and is the control.
ip route 9.59.0.0/24 Null0
ip route 10.59.0.0/16 Null0
!
router bgp 65001
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65000
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  redistribute static
 exit-address-family
!
