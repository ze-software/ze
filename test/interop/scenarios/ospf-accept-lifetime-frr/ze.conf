# Ze side of the ospf-accept-lifetime-frr interop scenario
# (spec-ospf-accept-lifetime-receive-window).
#
# The security property RFC 7474 Section 4 states, put to a real peer: "For
# packet reception, the key validity interval as defined by AcceptLifetimeStart
# and AcceptLifetimeEnd must include the current time."
#
# FRR holds the same key-id 1 and the same secret as the sibling ospf-auth-frr
# scenario, and signs every packet correctly. Ze's copy of that key carries an
# accept-lifetime that CLOSED in 2020, so Ze refuses each of FRR's packets before
# it compares the digest, and no adjacency forms. Ze keeps signing its own
# Hellos, so FRR still sees Ze and reports it stuck below Full: the link works
# and the window is the only thing refusing it.
#
# Key 2 is what makes key 1 a retired key rather than the chain's last one. Its
# send and accept lifetimes both open in 2099, so it is the latest-starting key
# (lastKeyIndex) and the chain's last key, yet it neither signs nor accepts today.
# Without it key 1 would be the last key, and RFC 5709 Section 3.2 has the router
# "treat the key as having an infinite lifetime until the lifetime is extended,
# the key is deleted by network management, or a new key is configured", so Ze
# would accept FRR and reach Full. Key 1 has no send-lifetime, so Ze still signs
# with it and FRR, which knows only key 1, still verifies Ze's Hellos.
#
# Until this window was consulted Ze accepted any key of the chain whatever the
# clock said, so this scenario reached Full. An operator who believed a key was
# retired still had a neighbor authenticating with it.

ospf {
	router-id 172.30.0.2
	key-chains core {
		key 1 {
			algorithm md5
			secret ZeFrrOspfKey1
			accept-lifetime {
				start 2019-01-01T00:00:00Z
				end 2020-01-01T00:00:00Z
			}
		}
		key 2 {
			algorithm md5
			secret ZeFrrOspfKey2
			send-lifetime {
				start 2099-01-01T00:00:00Z
			}
			accept-lifetime {
				start 2099-01-01T00:00:00Z
			}
		}
	}
	areas {
		area 0.0.0.0 {
			area-type normal
			authentication {
				key-chain core
			}
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
			authentication {
				mode inherit
			}
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
