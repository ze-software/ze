frr defaults traditional
hostname frr-ospf-accept-lifetime
log file /tmp/frr.log informational
!
! FRR signs correctly and always: key-id 1 / secret "ZeFrrOspfKey1", the same
! pair the ospf-auth-frr scenario uses to reach Full. Nothing is wrong on this
! side. Ze refuses the packets because its own copy of the key is outside its
! accept-lifetime, so FRR sees Ze's Hellos and never gets past Init.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 ZeFrrOspfKey1
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
!
