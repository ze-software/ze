# Ze side of the ospf-ri-frr interop scenario (spec-ospf-ext-3, RFC 7770).
#
# Ze enables the opaque-LSA capability (required to carry the OSPFv2 RI LSA, which is an
# Opaque type-4 LSA) and enables `router-information` at area + AS scope. On a
# point-to-point OSPFv2 adjacency with FRR over the shared Docker bridge (eth0, area
# 0.0.0.0), Ze originates its RI LSA (Opaque type 4) carrying the Router Informational
# Capabilities TLV, and stores + renders FRR's RI LSA. FRR must decode Ze's LSA as a
# Router Information LSA; the adjacency must stay Full.

ospf {
	router-id 172.30.0.2
	opaque true
	router-information {
		enabled true
		scope area
		scope as
	}
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type point-to-point
			cost 10
		}
		interface lo {
			area 0.0.0.0
			passive true
		}
	}
}
