frr defaults traditional
hostname frr-ospf-ri
log file /tmp/frr.log informational
!
! OSPFv2 point-to-point on the shared L2 bridge to Ze (eth0), area 0.0.0.0. FRR enables
! the opaque-LSA capability and originates a Router Information LSA (Opaque type 4, RFC
! 7770) at AS scope via `router-info as`. Ze must set the O-bit, keep the adjacency Full,
! decode Ze's RI LSA as Router Information, and store/render FRR's RI LSA.
interface eth0
 ip ospf network point-to-point
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 172.30.0.3
 passive-interface lo
 capability opaque
 router-info as
!
