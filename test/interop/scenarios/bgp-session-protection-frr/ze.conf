bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
			ttl { max 1; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
control-plane-protection {
	bgp {
		# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
		filter {
			import { final accept; }
			export { final accept; }
		}
		protected-port 179;
	}
}
