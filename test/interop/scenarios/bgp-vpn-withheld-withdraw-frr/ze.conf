# The withdrawal ze converts for a withheld VPN destination, judged by FRR
# (spec-bgp-rs-replacement-on-withdrawal, AC-27, Data Flow 3b).
#
#     INTEROP_SCENARIO=bgp-vpn-withheld-withdraw-frr ./le test integration interop
#
# WHAT THE SCENARIO MEASURES. A raw injector announces 10.20.0.0/24 at RD
# 65004:40 under ONE label in ipv4/mpls-vpn, and ze relays it to FRR. The
# injector then re-announces the same route with a stack of THREE labels and
# the well-known community NO_EXPORT. FRR is an external peer, so RFC 1997
# withholds the revision from it ("All routes received carrying a communities
# attribute containing this value MUST NOT be advertised outside a BGP
# confederation boundary"), and the forward rail converts the revision into
# the withdrawal of the route FRR holds (buildWithdrawalPayload). ze never
# sends FRR the three-label announcement: no Multiple Labels Capability is
# exchanged (RFC 8277 Section 2.1).
#
# WHAT MAKES IT DISCRIMINATE. RFC 8277 Section 2.4 frames a withdrawn VPN NLRI
# as [Length][Compatibility:3][RD:8][prefix]. A withdrawal that copies the
# announcement's three-label stack has Length 160, so FRR reads two labels as
# prefix bits, a 72-bit IPv4 prefix, and refuses the UPDATE. The checker
# requires FRR to decode exactly one withdrawal of RD 65004:40 10.20.0.0/24 and
# its session generation with ze to be unchanged.
#
# THE RELAY IS bgp-rs on a plain eBGP peering, as in
# bgp-labeled-withdraw-compatibility-frr: ze prepends 65001, which FRR's
# enforce-first-as demands.
plugin {
	internal rs {
		use bgp-rs;
	}
	internal adj-rib-in {
		use bgp-adj-rib-in;
	}
}
bgp {
	# ze dials the injector (accept false), because le test peer listens rather
	# than connects in check mode.
	peer injector {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			receive [ update-received state ]
			send [ update ]
		}
	}
	peer frr {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/mpls-vpn { prefix { maximum 10000; } }
			}
		}
		attach process rs {
			receive [ update-received state open-received refresh ]
			send [ update ]
		}
		attach process adj-rib-in {
			receive [ update-received state ]
			send [ update ]
		}
	}
}
