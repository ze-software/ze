frr defaults traditional
hostname frr-vpn-withheld-withdraw
! debugging level, not informational: the checker counts FRR's own per-UPDATE
! decodes of what ze sends, which FRR logs only at debug level.
log file /tmp/frr.log debugging
!
debug bgp updates
debug bgp updates in
!
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 172.30.0.2 remote-as 65001
 !
 ! The family under test, RFC 4364 VPN-IPv4 (AFI 1, SAFI 128).
 address-family ipv4 vpn
  neighbor 172.30.0.2 activate
 exit-address-family
!
