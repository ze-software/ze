frr defaults traditional
hostname frr-locrib
log file /tmp/frr.log informational
!
ip route 10.44.0.0/24 Null0
!
! 65099 is ze's PER-PEER local AS, not its global one. ze.conf overrides the
! session ASN on purpose, so that the identity the Loc-RIB header carries can
! be told apart from the identity this session carries.
router bgp 65045
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65099
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
  redistribute static
 exit-address-family
!
