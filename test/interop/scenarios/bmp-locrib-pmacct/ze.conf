plugin {
	internal bgp-rib {
		use bgp-rib;
	}
	internal bgp-bmp {
		use bgp-bmp;
	}
}
bgp {
	# RFC 9069 Section 5.1 names these two, and only these two, as what the
	# Loc-RIB emulated peer describes itself with: "Peer Autonomous System (AS):
	# Set to the primary router BGP autonomous system number (ASN)", and "Peer
	# BGP ID: ... otherwise, set to the global instance router-id."
	router-id 172.30.0.2;
	session {
		asn {
			local 65044;
		}
	}
	bmp {
		sender {
			collector pmacct {
				address 172.30.0.13;
				port 1790;
			}
			route-monitoring-policy all;
			loc-rib true;
		}
	}
	peer frr-locrib {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			# The PEER overrides both. That is what makes the scenario
			# discriminate: ze's sent OPEN on this session carries 65099 and
			# 10.99.99.99, so a Loc-RIB header built from a cached OPEN reports
			# the SESSION's identity where Section 5.1 asks for the router's.
			# The two are equal on a router that overrides neither, and a
			# scenario built that way passes whichever source the code reads.
			asn { local 65099; remote 65045; }
			router-id 10.99.99.99;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
	}
}
