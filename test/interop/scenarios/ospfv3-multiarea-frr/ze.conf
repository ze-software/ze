# Ze side of the ospfv3-multiarea-frr interop scenario (spec-ospfv3-6 AC-1).
#
# Ze is an OSPFv3 Area Border Router: eth0 is in the backbone (area 0.0.0.0, facing
# FRR) and a passive dummy interface zeloop carries a unique global prefix in
# area 0.0.0.1. Ze summarises the area-1 prefix 2001:db8:a1::/64 into the backbone as
# an Inter-Area-Prefix-LSA (Type 0x2003, RFC 5340 sec 3.5), so FRR (a backbone router)
# installs it as an OSPFv3 inter-area route across the ABR. The unique dummy prefix is
# what makes the route assertable -- it exists on exactly one side of the shared LAN.

interface {
	backend netlink
	dummy zeloop {
		unit 0 {
			ipv6 {
				address [ 2001:db8:a1::1/64 ]
			}
		}
	}
}

ospf {
	router-id 172.30.0.2
	address-family ipv6 {
		areas {
			area 0.0.0.0 {
				area-type normal
			}
			area 0.0.0.1 {
				area-type normal
			}
		}
		interfaces {
			interface eth0 {
				area 0.0.0.0
				network-type point-to-point
				cost 10
			}
			interface zeloop {
				area 0.0.0.1
				passive true
			}
		}
	}
}
