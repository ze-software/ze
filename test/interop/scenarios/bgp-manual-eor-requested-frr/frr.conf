frr defaults traditional
hostname frr-manual-eor
! debugging level, not informational: the checker reads FRR's own decode of
! each prefix ze sends ("<peer> rcvd <prefix>", bgp_update in bgpd/bgp_route.c,
! logged under `debug bgp updates in`) and of each End-of-RIB marker
! ("bgp_update_receive_eor: rcvd End-of-RIB for IPv4 Unicast from <peer> in vrf
! default", bgpd/bgp_packet.c, logged at informational). The order of those
! lines is the order FRR processed the UPDATEs of one connection, and their
! count is the number of markers. `show bgp neighbor json` cannot answer either
! question: gracefulRestartInfo.endOfRibRecv is one flag, filled only for a
! peer whose Graceful Restart capability FRR received.
log file /tmp/frr.log debugging
!
debug bgp updates in
!
! The checker runs `clear bgp <ze>` once, after it judged the first session.
! The connect timer of 2 s bounds a redial whose connect failed.
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 neighbor 172.30.0.2 timers connect 2
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
