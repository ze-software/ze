# Ze side of the bgp-manual-eor-requested-frr interop scenario
# (spec eor-treats-route-processes-as-peers, AC-5 and AC-6).
#
# The peer sets `behavior { manual-eor true; }`, so Ze sends FRR no automatic
# End-of-RIB: the initial sync withholds its own, and only a marker a process
# asks for reaches the wire.
#
# The process (le test interop-bgp process ... manual-eor-requester) acts from
# INSIDE its handler for the peer-UP event, which the engine awaits before it
# starts the initial sync (deliverPeerState, bgp/server/events.go):
#   - session 1: it announces 10.84.1.0/24 and asks for nothing. FRR must
#     decode the route and no End-of-RIB.
#   - session 2, after the checker's `clear bgp`: it announces 10.84.2.0/24
#     and then asks for the IPv4 unicast End-of-RIB, with the session's
#     queueing gate still closed. FRR must decode the route, then exactly one
#     End-of-RIB.
#
# No Graceful Restart: the checker reads FRR's own receive log
# (bgp_update_receive_eor), which FRR writes for every peer, and a GR plugin
# attached here would be a second producer of markers on this peer.
bus {
	endpoint manual-eor-requester {
		external {
			run "le test interop-bgp process bgp-manual-eor-requested-frr manual-eor-requester";
		}
		encoding json;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exports routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer peer1 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			manual-eor true;
		}
	}
}
