# Ze side of the isis-redist-frr interop scenario (spec-isis-11 / isis-13 AC-18).
#
# Ze forms an IS-IS adjacency with FRR over the shared Docker bridge (eth0, a
# single L2 broadcast domain), redistributes a connected/static prefix INTO IS-IS
# (so FRR installs it), and redistributes IS-IS routes OUT to a BGP peer on the
# same bridge. The interop harness provides one Docker network, so IS-IS (L2) and
# the eBGP session (IP) both ride eth0; the FRR/gobgp peer is on eth0 too.

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1-l2
	interfaces {
		interface eth0 {
			metric 10
			level l1-l2
			circuit-type point-to-point
		}
		# A passive interface whose prefix is advertised into IS-IS without an
		# adjacency (AC-8).
		interface lo {
			passive true
		}
	}
}

static {
	route 10.99.0.0/24 {
		next-hop 172.30.0.3;
	}
}

connected {
}

bgp {
	peer bgp-peer {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}

redistribute {
	# IS-IS SPF routes (both levels) out to BGP (AC-1, AC-2, AC-7).
	destination bgp {
		import isis
	}
	# connected / static / BGP into IS-IS LSPs as TLV 135 reachability
	# (AC-3, AC-4, AC-5, AC-6). `import isis` here would be a runtime no-op
	# (loop prevention, AC-10) so it is intentionally omitted.
	destination isis {
		import connected
		import static
		import bgp
	}
}
