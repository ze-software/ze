frr defaults traditional
hostname frr-isis
log file /tmp/frr.log informational
!
! IS-IS on the shared Docker bridge to Ze (eth0, a single L2 broadcast domain).
! Same area (49.0001) so the adjacency forms and FRR learns the reachability Ze
! redistributed into IS-IS (TLV 135). The eBGP session below rides the same eth0.
interface eth0
 ip router isis ZE
 isis circuit-type level-1-2
 isis network point-to-point
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
!
! eBGP peer toward Ze (eth0) so the IS-IS routes Ze redistributes into BGP land in
! FRR's BGP table.
router bgp 65002
 bgp router-id 172.30.0.3
 no bgp ebgp-requires-policy
 neighbor 172.30.0.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 172.30.0.2 activate
 exit-address-family
!
