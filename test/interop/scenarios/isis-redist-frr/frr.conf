frr defaults traditional
hostname frr-isis
log file /tmp/frr.log informational
!
! IS-IS on the shared Docker bridge to Ze (eth0, a single L2 broadcast domain).
! Same area (49.0001) so the adjacency forms and FRR learns the reachability Ze
! redistributed into IS-IS (TLV 135).
interface eth0
 ip router isis ZE
 isis circuit-type level-1-2
 isis network point-to-point
!
! A prefix only FRR advertises into IS-IS. Ze learns it by IS-IS, its IGP next hop
! is FRR (172.30.0.3), and Ze redistributes it into BGP toward gobgp, a third
! router, so the next hop is not the BGP peer's own address and RFC 4271 Section
! 5.1.3 does not withhold the route.
interface lo
 ip address 10.98.0.1/32
 ip router isis ZE
 isis passive
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
!
