frr defaults traditional
hostname frr-isis-auth
log file /tmp/frr.log informational
!
! HMAC-MD5-authenticated IS-IS on the shared bridge to Ze (eth0). FRR's IIH
! (circuit) password and the area/domain passwords use HMAC-MD5 and MATCH the Ze
! keys, so the authenticated adjacency forms (AC-16). A mismatched key would be
! rejected on receive (TLV 10 verify fails) and no adjacency would form -- the
! negative half of the test.
interface eth0
 ip router isis ZE
 isis circuit-type level-1-2
 isis network point-to-point
 isis password md5 zekey123
!
interface lo
 ip router isis ZE
 isis passive
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1-2
 metric-style wide
 area-password md5 zearea123
 domain-password md5 zearea123
!
