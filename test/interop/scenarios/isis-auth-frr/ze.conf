# Ze side of the isis-auth-frr interop scenario (spec-isis-13 AC-16).
#
# Ze and FRR form an HMAC-MD5-authenticated IS-IS adjacency over the shared
# bridge (eth0). The IIH (circuit) and the LSP/SNP (per-level) carry TLV 10
# authentication signed with HMAC-MD5 (RFC 5304). The keys here MATCH the FRR
# side, so the adjacency forms; the negative case (a wrong key is rejected) is
# asserted by the check by inspecting that no UNauthenticated peer adjacency
# forms and that auth-failure counters stay clean for the matched key.

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1-l2
	hostname ze-auth
	key-chains iih-key {
		key 1 {
			algorithm hmac-md5
			secret zekey123
		}
	}
	key-chains area-key {
		key 1 {
			algorithm hmac-md5
			secret zearea123
		}
	}
	level-1 {
		auth-key-chain area-key
	}
	level-2 {
		auth-key-chain area-key
	}
	interface eth0 {
		metric 10
		level l1-l2
		circuit-type point-to-point
		level-1 {
			auth-key-chain iih-key
		}
		level-2 {
			auth-key-chain iih-key
		}
	}
	interface lo {
		passive true
	}
}
