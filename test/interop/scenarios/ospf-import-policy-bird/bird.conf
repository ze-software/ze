log stderr all;
router id 172.30.0.4;

protocol device {
}

# Two external routes, exported into OSPF as AS-external LSAs. 10.88.1.0/24
# carries route tag 100, which Ze's `ospf filter import` matches to set distance
# 200; 10.88.2.0/24 is untagged and keeps the OSPF distance.
protocol static externals {
	ipv4;
	route 10.88.1.0/24 blackhole { ospf_tag = 100; };
	route 10.88.2.0/24 blackhole;
}

protocol ospf v2 ospf0 {
	ipv4 {
		export where source = RTS_STATIC;
	};
	area 0.0.0.0 {
		interface "eth0" {
			type broadcast;
			cost 10;
		};
	};
}
