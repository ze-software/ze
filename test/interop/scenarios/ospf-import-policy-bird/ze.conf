# Ze side of the ospf-import-policy-bird interop scenario
# (spec-route-policy-0-umbrella AC-9).
#
# BIRD advertises three OSPF externals. 10.88.1.0/24 carries route tag 100. Ze's
# `ospf filter import` sets distance 200 on a route tagged 100. Static is at
# distance 150 and offers both prefixes, so OSPF at its own distance (110) beats
# static for the untagged 10.88.2.0/24, and the tagged 10.88.1.0/24, at 200,
# loses to static. The two prefixes differ only in the tag, so the tag is what
# moves 10.88.1.0/24 to static.
# The central import chain hides the third prefix, 10.88.3.0/24, while OSPF
# keeps it in its database.

plugin {
	internal sysrib-policy-owner {
		use rib;
	}
}

policy {
	prefix-list OSPF-CENTRAL-HIDE-LIST {
		entry 10.88.3.0/24 { action accept; }
	}
	match OSPF-CENTRAL-HIDE {
		action reject;
		prefix-list OSPF-CENTRAL-HIDE-LIST;
	}
	modify TAG-100-DISTANCE {
		match {
			tag [ 100 ];
		}
		set {
			distance 200;
		}
	}
}

rib {
	filter {
		import {
			filters [ OSPF-CENTRAL-HIDE ];
			final accept;
		}
	}
	distance {
		static 150
	}
}

static {
	table default {
		route 10.88.1.0/24 {
			blackhole { }
		}
		route 10.88.2.0/24 {
			blackhole { }
		}
	}
}

ospf {
	router-id 172.30.0.2
	filter {
		import {
			filters [ TAG-100-DISTANCE ];
			final accept;
		}
	}
	areas {
		area 0.0.0.0 {
			area-type normal
		}
	}
	interfaces {
		interface eth0 {
			area 0.0.0.0
			network-type broadcast
			cost 10
		}
	}
}
