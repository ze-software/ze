plugin {
	external announce-as112 {
		run "ze-test interop-bgp process as112-origin-as-frr announce-as112";
		encoder json;
	}
}
bgp {
	router-id 172.30.0.2;
	session {
		asn { local 65001; }
	}
	peer frr-origin112 {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 112; remote 65002; local-options [ replace-as ]; }
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		attach process announce-as112 {
			send [ update ];
		}
	}
	peer bird-internal {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { remote 65003; }
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
	}
}
