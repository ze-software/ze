# Ze side of the ospfv3-nssa-redist-frr interop scenario (spec-ospfv3-5 Part B).
#
# GoBGP is the real redistribution source: it peers with Ze over eBGP and injects
# an IPv6 NLRI. Ze imports BGP routes into an OSPFv3 NSSA area, originates a
# Type-7 NSSA-LSA (0x2007), and FRR installs the redistributed prefix as an
# NSSA route without receiving a Type-5 AS-External-LSA in the NSSA.

plugin {
	internal rib {
		use bgp-rib;
	}
}

bgp {
	peer redist-source {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv6/unicast { prefix { maximum 10000; } }
			}
		}
	}
}

ospf {
	router-id 172.30.0.2
	address-family ipv6 {
		areas {
			area 0.0.0.2 {
				area-type nssa
			}
		}
		interfaces {
			interface eth0 {
				area 0.0.0.2
				network-type point-to-point
				cost 10
			}
		}
	}
}

redistribute {
	destination ospf {
		import bgp {
			family [ ipv6/unicast ]
		}
	}
}
