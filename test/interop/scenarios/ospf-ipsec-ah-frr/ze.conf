# Ze side of the ospf-ipsec-ah-frr interop scenario (spec-ospf-ext-16, RFC 4552 §3: AH MAY).
#
# The AH twin of ospf-ipsec-frr: a manually keyed AH transport-mode SA (SPI 257,
# HMAC-SHA-256) on the shared bridge (eth0). The checker installs the matching `ip xfrm`
# states and policies in the FRR container before it waits for the adjacency
# (ospfIPsecPeerSetup, internal/le/interoplab/bgp/checkers.go).

ospf {
	router-id 10.0.0.1
	address-family ipv6 {
		areas {
			area 0.0.0.0 {
			}
		}
		interfaces {
			interface eth0 {
				area 0.0.0.0
				network-type point-to-point
				ipsec {
					protocol ah
					spi 257
					algorithm sha256
					key 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
				}
			}
		}
	}
}
