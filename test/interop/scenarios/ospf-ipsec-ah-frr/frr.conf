frr defaults traditional
hostname frr
log file /tmp/frr.log informational
!
! FRR ospf6d does not configure IPsec in frr.conf: RFC 4552 manual AH SAs/policies are
! installed in the kernel with `ip xfrm` (see the internal/le/interoplab/bgp checker). Here ospf6d
! only runs OSPFv3 on
! the link; the kernel applies AH transport mode to protocol 89 (RFC 4552 §3, AH MAY).
!
interface frr0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
!
router ospf6
 ospf6 router-id 10.0.0.2
!
