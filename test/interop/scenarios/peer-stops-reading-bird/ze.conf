# Ze side of the peer-stops-reading-bird interop scenario
# (spec-bgp-session-write-wedge, AC-9): the config ze starts from.
#
# The checker freezes BIRD and reloads ze with ze-reload.conf, which adds
# 131072 routes to this peer. The frozen BIRD accepts none of them, so ze's
# writer blocks in the kernel, and the receive hold timer below then has to
# close the connection behind that writer.
#
# The two files differ only in the two extra `update` blocks of
# ze-reload.conf. A static route set is delivered on the running session
# (Peer.deliverStaticRouteDelta), so the reload does not restart the peer.

# "session established" and "session closed" are INFO lines of this logger,
# and the checker reads both. "session closed" is logged once Session.Run has
# returned, so it is the line that says the connection is gone.
environment {
	log {
		bgp.reactor.peer info
	}
}
bus {
	endpoint bgp-rib {
		internal bgp-rib;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer bird-stops-reading {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			# Graceful Restart would make BIRD keep ze's routes across the
			# close this scenario exists to observe.
			capability { graceful-restart disable; }
		}
		# One UPDATE per route, so the reload's routes are a known number of
		# octets on the wire.
		behavior { group-updates disable; }
		# RFC 4271 Section 4.2 negotiates the smaller hold time, and BIRD's
		# default is 240 s, so this value wins: BIRD sends a KEEPALIVE every
		# 3 s at most, and ze's hold timer expires 6 s to 9 s after BIRD stops.
		# It is far below the 30 s write budget (ze.fwd.write.deadline), which
		# is what lets the checker tell a close on hold expiry from a close
		# that waited for the blocked write to give up.
		timer { receive-hold-time 9; }
		update {
			attribute {
				origin igp;
				next-hop 172.30.0.2;
			}
			nlri {
				ipv4/unicast add 192.168.84.0/24 192.168.85.0/24;
			}
		}
		# A peer that attaches nothing receiving feeds nothing (docs/guide/plugins.md):
		# bgp-rib counts BIRD's routes in `routes-in` only through this block.
	}
}
