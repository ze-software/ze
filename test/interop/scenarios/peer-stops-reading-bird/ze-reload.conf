# Ze side of the peer-stops-reading-bird interop scenario
# (spec-bgp-session-write-wedge, AC-9): the config the checker reloads ze
# with while BIRD is frozen. Every line of ze.conf is here unchanged; the two
# `update` blocks marked below are the only addition.
#
# What the addition weighs on the wire. 10.0.0.0/8 and 11.0.0.0/8 split into
# /24 are 2 x 65536 = 131072 routes. group-updates is off, so each route is
# its own UPDATE: 19 octets of header, 2 + 2 of lengths, ORIGIN 4, AS_PATH 9
# (one 4-octet AS), NEXT_HOP 7, COMMUNITIES 4 + 100 x 4, NLRI 4, 451 octets
# in all. 131072 x 451 is about 56 MiB. A frozen BIRD takes what its receive
# buffer and ze's send buffer hold, which Linux caps at 6 MiB and 4 MiB by
# default (tcp_rmem, tcp_wmem), so ze's writer blocks with most of the set
# still to write. The checker proves it did rather than trusting this sum.

environment {
	log {
		bgp.reactor.peer info
	}
}
bus {
	endpoint bgp-rib {
		internal bgp-rib;
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer bird-stops-reading {
		connection {
			remote { ip 172.30.0.4; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
			capability { graceful-restart disable; }
		}
		behavior { group-updates disable; }
		timer { receive-hold-time 9; }
		update {
			attribute {
				origin igp;
				next-hop 172.30.0.2;
			}
			nlri {
				ipv4/unicast add 192.168.84.0/24 192.168.85.0/24;
			}
		}
		# Added by the reload: the first 65536 routes.
		update {
			attribute {
				origin igp;
				next-hop 172.30.0.2;
				community [ 65000:1 65000:2 65000:3 65000:4 65000:5 65000:6 65000:7 65000:8 65000:9 65000:10 65000:11 65000:12 65000:13 65000:14 65000:15 65000:16 65000:17 65000:18 65000:19 65000:20 65000:21 65000:22 65000:23 65000:24 65000:25 65000:26 65000:27 65000:28 65000:29 65000:30 65000:31 65000:32 65000:33 65000:34 65000:35 65000:36 65000:37 65000:38 65000:39 65000:40 65000:41 65000:42 65000:43 65000:44 65000:45 65000:46 65000:47 65000:48 65000:49 65000:50 65000:51 65000:52 65000:53 65000:54 65000:55 65000:56 65000:57 65000:58 65000:59 65000:60 65000:61 65000:62 65000:63 65000:64 65000:65 65000:66 65000:67 65000:68 65000:69 65000:70 65000:71 65000:72 65000:73 65000:74 65000:75 65000:76 65000:77 65000:78 65000:79 65000:80 65000:81 65000:82 65000:83 65000:84 65000:85 65000:86 65000:87 65000:88 65000:89 65000:90 65000:91 65000:92 65000:93 65000:94 65000:95 65000:96 65000:97 65000:98 65000:99 65000:100 ];
				split /24;
			}
			nlri {
				ipv4/unicast add 10.0.0.0/8;
			}
		}
		# Added by the reload: the second 65536 routes.
		update {
			attribute {
				origin igp;
				next-hop 172.30.0.2;
				community [ 65000:1 65000:2 65000:3 65000:4 65000:5 65000:6 65000:7 65000:8 65000:9 65000:10 65000:11 65000:12 65000:13 65000:14 65000:15 65000:16 65000:17 65000:18 65000:19 65000:20 65000:21 65000:22 65000:23 65000:24 65000:25 65000:26 65000:27 65000:28 65000:29 65000:30 65000:31 65000:32 65000:33 65000:34 65000:35 65000:36 65000:37 65000:38 65000:39 65000:40 65000:41 65000:42 65000:43 65000:44 65000:45 65000:46 65000:47 65000:48 65000:49 65000:50 65000:51 65000:52 65000:53 65000:54 65000:55 65000:56 65000:57 65000:58 65000:59 65000:60 65000:61 65000:62 65000:63 65000:64 65000:65 65000:66 65000:67 65000:68 65000:69 65000:70 65000:71 65000:72 65000:73 65000:74 65000:75 65000:76 65000:77 65000:78 65000:79 65000:80 65000:81 65000:82 65000:83 65000:84 65000:85 65000:86 65000:87 65000:88 65000:89 65000:90 65000:91 65000:92 65000:93 65000:94 65000:95 65000:96 65000:97 65000:98 65000:99 65000:100 ];
				split /24;
			}
			nlri {
				ipv4/unicast add 11.0.0.0/8;
			}
		}
	}
}
