# BIRD side of the peer-stops-reading-bird interop scenario
# (spec-bgp-session-write-wedge, AC-9). The checker freezes this container
# while ze writes more than the sockets hold, then thaws it.

log stderr all;
router id 172.30.0.4;

protocol device {
}

protocol static static_routes {
	ipv4;
	route 192.168.94.0/24 blackhole;
	route 192.168.95.0/24 blackhole;
}

protocol bgp ze_peer {
	# The checker counts "ze_peer: State changed to up" in this log to tell the
	# session after the thaw from the one before the freeze.
	debug { states };
	# When BIRD's own hold timer is what ends the frozen session
	# (bgp_hold_timeout calling bgp_error), bgp_update_startup_delay holds the
	# next start for the error wait time, 60 s by default. The checker's wait
	# for the second session is sized from this bound.
	error wait time 5, 10;
	local 172.30.0.4 as 65002;
	neighbor 172.30.0.2 as 65001;
	ipv4 {
		import all;
		export where proto = "static_routes";
	};
}
