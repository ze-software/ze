# Opted-in eBGP sender (AS 65005 -> Ze AS 65001): originates 10.97.2.0/24
# carrying target:65001:7 and RFC 8097 origin-validation-state:valid across a
# trusted eBGP session (send-origin-validation-state true here, matched by
# accept-origin-validation-state true on Ze).
bgp {
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer ze {
		connection {
			remote { ip 172.30.0.2; }
			local  { ip 172.30.0.3; }
		}
		session {
			asn { local 65005; remote 65001; }
			router-id 172.30.0.3;
			send-origin-validation-state true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			group-updates disable;
		}
		update {
			attribute {
				origin igp;
				next-hop 172.30.0.3;
				extended-community [ target:65001:7 origin-validation-state:valid ];
			}
			nlri {
				ipv4/unicast add 10.97.2.0/24;
			}
		}
	}
}
