# RFC 8097 Section 2 end-to-end eBGP boundary scenario against GoBGP v4.11.0
# and two native raw-wire eBGP speaker oracles.
#
# Inbound boundary:
#   - ebgp-default-in (.9, AS 65004, default accept-origin-validation-state=false)
#     sends 10.97.1.0/24 carrying target:65001:7 and 0x43/0x00:valid. Ze MUST
#     drop 0x43/0x00 before RIB/relay, so iBGP GoBGP (.5) and opted-in eBGP
#     speaker2 (.11) receive target:65001:7 alone.
#   - ebgp-accept-in (.3, AS 65005, accept-origin-validation-state true) sends
#     10.97.2.0/24 carrying target:65001:7 and 0x43/0x00:valid. Ze retains
#     0x43/0x00, so iBGP GoBGP (.5) receives both target:65001:7 and 0x43/0x00.
#
# Outbound boundary:
#   - GoBGP (.5, iBGP AS 65001) injects 10.97.3.0/24 carrying target:65000:9 and
#     0x43/0x00:valid.
#   - speaker-default-ebgp (.10, AS 65002, default send-origin-validation-state=false)
#     runs native wire oracle rfc8097-ebgp-strip: receives 10.97.1.0/24,
#     10.97.2.0/24, and 10.97.3.0/24 with sibling Route Targets intact and ZERO
#     0x43/0x00 entries on the wire (fails red if Ze's egress strip is reverted).
#   - speaker-optin-ebgp (.11, AS 65003, send-origin-validation-state true) runs
#     native wire oracle rfc8097-ebgp-optin: receives 10.97.2.0/24 and
#     10.97.3.0/24 with both sibling Route Targets and 0x43/0x00:valid intact
#     (Reserved [2..6] == 0), while 10.97.1.0/24 arrives without 0x43/0x00.
static {
	table default {
		route 172.30.0.3/32 {
			next {
				interface eth0 { }
			}
		}
		route 172.30.0.5/32 {
			next {
				interface eth0 { }
			}
		}
		route 172.30.0.9/32 {
			next {
				interface eth0 { }
			}
		}
	}
}
bgp {
	# RFC 8212: an EBGP direction with no policy is refused; this test exchanges routes.
	filter {
		import { final accept; }
		export { final accept; }
	}
	peer gobgp {
		connection {
			remote { ip 172.30.0.5; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65001; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			group-updates disable;
		}
	}
	peer ebgp-default-in {
		connection {
			remote { ip 172.30.0.9; }
			local  { ip 172.30.0.2; accept false; }
		}
		filter {
			import { final accept; }
			export { final reject; }
		}
		session {
			asn { local 65001; remote 65004; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			group-updates disable;
		}
	}
	peer ebgp-accept-in {
		connection {
			remote { ip 172.30.0.3; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65005; }
			router-id 172.30.0.2;
			accept-origin-validation-state true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			group-updates disable;
		}
	}
	peer speaker-default-ebgp {
		connection {
			remote { ip 172.30.0.10; connect false; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65002; }
			router-id 172.30.0.2;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			group-updates disable;
		}
	}
	peer speaker-optin-ebgp {
		connection {
			remote { ip 172.30.0.11; connect false; }
			local  { ip 172.30.0.2; }
		}
		session {
			asn { local 65001; remote 65003; }
			router-id 172.30.0.2;
			send-origin-validation-state true;
			family {
				ipv4/unicast { prefix { maximum 10000; } }
			}
		}
		behavior {
			group-updates disable;
		}
	}
}
