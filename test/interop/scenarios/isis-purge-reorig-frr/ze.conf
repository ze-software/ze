# Ze side of the isis-purge-reorig-frr interop scenario.
#
# Ze and FRR form an IS-IS Level-1 adjacency on the shared Docker bridge (eth0,
# a broadcast LAN). The check then floods a purge of ZE'S OWN LSP at a sequence
# number Ze has never issued. ISO/IEC 10589 clause 7.3.16.4 c) requires Ze to
# refuse the overwrite, move its sequence above the received one, and re-originate
# -- and FRR must accept the regenerated LSP and keep Ze in its topology.
#
# FRR takes the higher DIS priority so the pseudo-node is FRR's and Ze's own LSP
# content stays stable through the run: the LSP under test is Ze's non-pseudonode
# fragment 0, 0000.0000.0002.00-00.

isis {
	net 49.0001.0000.0000.0000.0002.00
	level l1
	hostname ze-purge
	interfaces {
		interface eth0 {
			metric 10
			level l1
			circuit-type broadcast
			priority 10
			hello-interval 1
			hold-multiplier 3
		}
		interface lo {
			passive true
		}
	}
}
