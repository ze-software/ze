frr defaults traditional
hostname frr-isis-purge
log file /tmp/frr.log informational
!
! IS-IS Level-1 broadcast LAN on the shared bridge to Ze (eth0). FRR takes the
! higher DIS priority so it owns the pseudo-node and Ze's own LSP content stays
! stable while the scenario purges and re-originates it. Same area, level-1, so
! the adjacency forms and FRR's SPF sees Ze.
interface eth0
 ip router isis ZE
 isis circuit-type level-1
 isis network broadcast
 isis priority 100
 isis hello-interval 1
 isis hello-multiplier 3
!
interface lo
 ip router isis ZE
 isis passive
!
router isis ZE
 net 49.0001.0000.0000.0000.0003.00
 is-type level-1
 metric-style wide
!
