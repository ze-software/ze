# RFC 4301 Section 8.1: "This means that it MUST be possible to configure the
# implementation's treatment of the DF bit (set, clear, copy from inner header) for
# each SA." The second phase, rendered over the mounted config and applied by SIGHUP:
# IDENTICAL to ze.conf except for one leaf, df-bit copy rather than df-bit clear.
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs disable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				df-bit copy;
				traffic-selector 1 {
					local {
						prefix 10.2.0.0/24;
					}
					remote {
						prefix 10.1.0.0/24;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.3";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
