# RFC 4301 Section 8.1: "This means that it MUST be possible to configure the
# implementation's treatment of the DF bit (set, clear, copy from inner header) for
# each SA." The first phase: df-bit clear. ze-copy.conf is this file with df-bit copy.
# df-bit set is no phase: every dataplane refuses it at commit (the Linux kernel copies
# the inner DF bit or clears it, and no XFRM flag sets it).
#
# Red proof: make xfrmDFFlag (internal/component/ike/dataplane/xfrm_linux.go) answer
# false for DFClear and let the harness rebuild the Ze image; the DF-set burst of this
# phase then reaches strongSwan with the outer DF bit set (checkTunnelDFTreatment,
# internal/le/interoplab/ipsec/dftreatment.go).
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs disable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				df-bit clear;
				traffic-selector 1 {
					local {
						prefix 10.2.0.0/24;
					}
					remote {
						prefix 10.1.0.0/24;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.3";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
