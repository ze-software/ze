# RFC 4301 Section 8.1, the DF bit of the outer header Ze builds. Ze initiates a
# tunnel-mode Child SA for 10.2.0.0/24 === 10.1.0.0/24 with `df-bit clear` (ze.conf),
# the checker reads the outer DF bit of Ze's ESP packets as strongSwan's eth0 receives
# them, then reloads Ze with `df-bit copy` (ze-copy.conf) and reads it again on the
# replacement Child SA. strongSwan only answers: its own outbound DF treatment
# (copy_df) is never measured, because every counted packet is sourced by Ze.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # The reload re-establishes the peer, because the df-bit leaf is part of the
        # peer's configuration. `unique = replace` makes charon retire the SA the first
        # configuration built when Ze re-authenticates as the same identity
        # (ike_sa_manager.c check_uniqueness, UNIQUE_REPLACE), so exactly one outbound
        # SA from Ze carries the second phase's packets.
        unique = replace

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 10.1.0.0/24
                remote_ts = 10.2.0.0/24
                esp_proposals = aes256gcm16
                mode = tunnel
                # No timer rekey: only the reload replaces the Child SA.
                rekey_time = 0
                life_time = 0
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
