connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # encap = yes is strongSwan's forceencaps. charon fakes its
        # NAT_DETECTION_SOURCE_IP hash, so Ze sees a NAT on the path and both
        # ends float to UDP 4500 and encapsulate ESP (RFC 3948 Section 2.1).
        # The lab has no address-translating middlebox, so this is how the
        # scenario reaches the UDP-encapsulated transport-mode receive path.
        encap = yes

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                # RFC 7296 Section 2.23.1: transport mode carries exactly one IP
                # address in TSi and TSr, and each must match the IKE SA endpoint.
                local_ts = 172.28.0.3/32
                remote_ts = 172.28.0.2/32
                esp_proposals = aes256gcm16
                mode = transport
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
