# The lab runs both peers on one directly connected subnet, and charon's
# bypass-lan plugin installs a PASS policy for every locally attached subnet.
# That policy outranks the Child SA policy, so strongSwan would send this
# scenario's traffic in the clear and Ze would count XfrmInTmplMismatch for
# every packet. The scenario exists to observe what Ze's kernel does with a
# DECAPSULATED packet, so the bypass has to go.
charon {
    plugins {
        bypass-lan {
            load = no
        }
    }
}
