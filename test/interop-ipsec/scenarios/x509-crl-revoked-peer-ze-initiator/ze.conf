# The ca entry's crl is the revocation source of an IKE peer chain that meets
# this ca. pki/ca-crl.pem is the only input that differs between
# x509-crl-revoked-peer-ze-initiator and x509-crl-unrevoked-peer-ze-initiator.
pki {
	ca test-ca {
		certificate "%%PKI_B64:ca.pem%%";
		crl "%%PKI_B64:ca-crl.pem%%";
	}
	certificate ze-client {
		certificate "%%PKI_B64:client.pem%%";
		private {
			key "%%PKI_B64:client-key.pem%%";
		}
	}
}
vpn {
	ipsec {
		ike-group IKE-CERT {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-CERT {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-CERT;
				esp-group ESP-CERT;
				connection-type initiate;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				authentication {
					mode x509;
					local-id "ze-test-client";
					remote-id "172.28.0.3";
					certificate ze-client;
					ca-certificate test-ca;
				}
			}
		}
	}
}
