# RFC 5280 Section 6.1.3 (a)(3) revocation of a peer certificate, Ze as the
# initiator. x509-crl-revoked-peer-ze-initiator and
# x509-crl-unrevoked-peer-ze-initiator are one scenario run twice: every file in
# the two directories is the same except pki/ca-crl.pem, the list Ze's `pki ca`
# holds. In the revoked scenario that list carries the serial number of
# pki/server.pem, the certificate strongSwan presents below, so Ze must refuse
# strongSwan's AUTH and install no SA. In the unrevoked scenario the list
# revokes nothing, and the tunnel must come up.
#
# strongSwan holds the lab P-256 leaf (pki/server.pem, 172.28.0.3) and does no
# revocation check that matters here: Ze's own certificate is on no list.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # The certificate goes out whether or not Ze sent CERTREQ
        # (ike_cert_post.c build_certs, CERT_ALWAYS_SEND), so the scenario judges
        # Ze's check of that certificate and not Ze's CERTREQ policy.
        send_cert = always

        local {
            auth = pubkey
            certs = server.pem
            id = 172.28.0.3
        }
        remote {
            auth = pubkey
            id = ze-test-client
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}
