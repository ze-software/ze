# THIS SCENARIO IS eap-tls13 WITH ONE LINE CHANGED:
# server-identity requires "other-server.example.com" instead of "172.28.0.3".
# strongSwan's server certificate (IP:172.28.0.3) is valid, unrevoked, and
# issued by test-ca, and IKEv2 remote-id "172.28.0.3" matches its IKE AUTH
# payload, so Ze's RFC 5216 Section 5.3 / RFC 2818 Section 3.1 EAP-TLS server
# identity check is the ONLY reason the exchange must fail with a fatal
# bad_certificate alert and zero XFRM SAs.
pki {
	ca test-ca {
		certificate "%%PKI_B64:ca.pem%%";
		crl "%%PKI_B64:ca-crl.pem%%";
	}
	certificate ze-client {
		certificate "%%PKI_B64:client.pem%%";
		private {
			key "%%PKI_B64:client-key.pem%%";
		}
	}
}
vpn {
	ipsec {
		ike-group IKE-EAP {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-EAP {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-EAP;
				esp-group ESP-EAP;
				connection-type initiate;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				authentication {
					mode eap-tls;
					local-id "ze-test-client";
					remote-id "172.28.0.3";
					certificate ze-client;
					ca-certificate test-ca;
					server-identity "other-server.example.com";
				}
			}
		}
	}
}
