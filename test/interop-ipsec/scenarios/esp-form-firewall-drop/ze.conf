# The ESP form fast path never carries a peer's bare ESP past a firewall rule that
# drops ESP on the input path.
#
# strongSwan initiates and floats IKE to UDP 4500 with no NAT, as in esp-form-change,
# so Ze's inbound state carries the ESP-in-UDP template while strongSwan sends bare
# ESP. Ze's fast path would add the UDP header at tc ingress, ahead of every netfilter
# hook, and the rewritten datagram would pass `protocol esp` as UDP. The firewall
# table below drops protocol esp on input, so the fast path keeps its gate shut
# (espFormFirewallBlocks, internal/component/ike/dataplane/espform_firewall_linux.go),
# the bare ESP stays ESP, and the drop-esp term drops it before XFRM or the complete
# path's raw ESP reader sees it. The chain's policy is accept and the one term
# matches protocol esp alone, so IKE on UDP 500 and 4500 is accepted.
#
# Red proof: force the gate open, by making writeGateLocked
# (internal/component/ike/dataplane/espform_fastpath_gate_linux.go) write
# espFormFastPathGateOpen whatever it is given, and let the harness rebuild the Ze
# image. strongSwan's ping is then rewritten past the rule and delivered, and the
# drop-esp counter stays still (checkESPFormFirewallDrop,
# internal/le/interoplab/ipsec/espformfirewall.go).
firewall {
	backend nft;
	table espdrop {
		family inet;
		chain input {
			type filter;
			hook input;
			priority 0;
			policy accept;
			term drop-esp {
				from {
					protocol esp;
				}
				then {
					drop;
				}
			}
		}
	}
}
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type respond;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.3";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
