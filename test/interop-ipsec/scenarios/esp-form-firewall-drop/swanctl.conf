connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # strongSwan is the INITIATOR and Ze (172.28.0.2) the responder, as in
        # esp-form-change. charon floats IKE to port 4500 after IKE_SA_INIT although
        # it finds no NAT, because MOBIKE is on by default, so Ze gives its inbound
        # state an ESP-in-UDP template. charon still sends BARE ESP: build_i
        # (src/libcharon/sa/ikev2/tasks/child_create.c, 6.1.0) sets child.encap from
        # COND_NAT_ANY, and install_child_sa passes the same condition to
        # child_sa->update. No `encap = yes` here: that sets COND_NAT_FAKE
        # (force_encap, ike_natd.c) and would send ESP-in-UDP, which the drop-esp
        # rule never matches.
        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = start

                # No timer rekey: the checker compares counters of one Child SA.
                rekey_time = 0
                life_time = 0
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
