# strongSwan sits behind the NAT box, so the Child SA is INSTALLED on the address the
# box presents (172.28.0.7) and ESP rides to that address: 172.28.0.3, the address
# strongSwan's own stack holds, sees no ESP at all. `show mtu` MUST send its probes to
# the installed endpoint `show vpn ipsec sa` reports as the Child SA's remote-address,
# because that is the path the tunnel's ESP rides (A-3, AC-17 of
# spec-path-mtu-diagnostic). The checker asserts the measurement's target and the
# tunnel row's remote both equal that installed endpoint. The reference address is
# the NAT box's own address, which answers on the lab bridge: show mtu has no public
# default, and the lab has no internet path for one to answer on.
environment {
	mtu {
		reference-address 172.28.0.5;
	}
}
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		# `unmatched` defaults to discard (RFC 4301 Section 4.4.1), which drops every
		# clear packet no SPD entry names. `show mtu` measures with ICMP: its probes to
		# the reference address and the frag-needed errors the clamped path returns cross
		# in the clear, so this entry passes ICMP. Order 3000 ranks it after the tunnel's
		# 2000, so ICMP inside the traffic selectors still takes the tunnel. IKE and its
		# UDP-encapsulated ESP ride the control-plane bypass at order 100.
		unmatched discard;
		policy icmp4 {
			action bypass;
			protocol 1;
			order 3000;
			local { prefix 0.0.0.0/0; }
			remote { prefix 0.0.0.0/0; }
		}
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				mode tunnel;
				local-address 172.28.0.2;
				remote-address 172.28.0.7;
				traffic-selector 1 {
					local {
						prefix 10.10.0.1/32;
					}
					remote {
						prefix 10.20.0.1/32;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.7";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
