# The NAT box owns one secondary address for each peer and translates both
# directions, which is the two-NAT figure of RFC 7296 Section 2.23.1 drawn with one
# middlebox. Each address sits inside the lab bridge's own prefix, so the far peer
# resolves it by ARP and needs no route.
#
# <the address the peer's own stack holds>  <the address the other peer sees it at>
172.28.0.2  172.28.0.6
172.28.0.3  172.28.0.7
