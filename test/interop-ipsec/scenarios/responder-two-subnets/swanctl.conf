connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # strongSwan is the INITIATOR and proposes TWO local subnets in one Child SA.
        # Ze answers both pairs, and RFC 4301 Section 4.4.2 makes it install both:
        # one inbound and one outbound policy per pair, all on the one SA.
        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 10.1.0.0/24,10.3.0.0/24
                remote_ts = 10.2.0.0/24
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = start
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
