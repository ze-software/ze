# strongSwan proposes both Transform Type 5 values, which RFC 7296 Section 3.3.2 calls
# the usual offer from an initiator that supports Extended Sequence Numbers. Ze selects
# the one it can key, value 0, and the tunnel carries traffic.
#
# It is the discriminator for esn-extended-only-refused: a responder that refused every
# proposal carrying value 1 would pass that scenario and fail this one.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # strongSwan is the INITIATOR here; Ze (172.28.0.2) is the responder.
        # start_action = start makes charon dial the tunnel as soon as the config
        # loads, so Ze's responder path is exercised without manual --initiate.
        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16-esn-noesn
                mode = tunnel
                start_action = start
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
