# Ze ANSWERS a transport-mode Child SA request from a peer behind a real address
# translation.
#
# remote-address is the address Ze SEES the peer at, which the NAT box owns and maps
# to strongSwan. matchResponderPeer (internal/component/ike/engine/register.go)
# accepts an unsolicited IKE_SA_INIT only from that address, so a responder is always
# configured with the post-NAT address and the substitution's observed remote address
# is this one.
#
# The traffic-selector list names the pair Ze's OWN stack sees. strongSwan proposes
# its own 172.28.0.3 and the 172.28.0.6 it dials, and neither appears here: RFC 7296
# Section 2.23.1 substitutes before the SPD lookup, and without that substitution this
# policy intersects the proposal nowhere and Ze answers TS_UNACCEPTABLE.
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type respond;
				mode transport;
				local-address 172.28.0.2;
				remote-address 172.28.0.7;
				traffic-selector 1 {
					local {
						prefix 172.28.0.2/32;
					}
					remote {
						prefix 172.28.0.7/32;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.7";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
