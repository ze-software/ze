connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = pubkey
            certs = server.pem
            id = 172.28.0.3
        }
        remote {
            auth = eap-tls
            # No eap_id, so charon keys the EAP-TLS peer's certificate on Ze's
            # IKE identity (IDi ze-test-client). eap_authenticator.c in strongSwan
            # 6.1.0: load_method passes the IKE peer identity to the EAP-TLS
            # server unless an EAP identity was received, and server_initiate_eap
            # starts an EAP-Identity exchange only when AUTH_RULE_EAP_IDENTITY is
            # set. tls_server.c then verifies the client certificate against that
            # identity, so a certificate that does not name ze-test-client fails.
            #
            # eap_id = ze-test-client did the same on 5.9.14, where a configured
            # eap_id skipped the EAP-Identity exchange. Since 6.0.2 ("Setting
            # remote.eap_id now always initiates an EAP-Identity exchange", NEWS)
            # charon asks, and apply_eap_identity refuses the anonymous NAI ze
            # sends ('EAP identity ze-test-client required, not matched by
            # anonymous', AUTH_FAILED). That NAI is what RFC 9190 Section 2.1.8
            # requires: "a client supporting TLS 1.3 MUST NOT send its username
            # (or any other permanent identifiers) in cleartext in the Identity
            # Response" (anonymousNAI, internal/core/eap/nai.go). eap_id = %any
            # would accept it, and then look the certificate up as 'anonymous'.
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}
