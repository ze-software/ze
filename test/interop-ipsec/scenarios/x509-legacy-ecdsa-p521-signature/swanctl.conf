# RFC 8247 Section 3.1 legacy signature authentication, Ze as the initiator, with
# ECDSA P-521 certificates on both sides and RFC 7427 disabled on strongSwan
# (strongswan.conf). Ze signs with client.pem's key (ze-test-client), strongSwan
# with server.pem's (172.28.0.3).
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # The certificate goes out whether or not Ze sent CERTREQ, so the scenario
        # judges the AUTH method and not Ze's CERTREQ policy.
        send_cert = always

        local {
            auth = pubkey
            certs = server.pem
            id = 172.28.0.3
        }
        remote {
            auth = pubkey
            id = ze-test-client
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}
