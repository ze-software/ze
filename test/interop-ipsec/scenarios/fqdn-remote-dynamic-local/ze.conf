# A home CPE's IKE initiator on a dynamic WAN: remote-address is the DNS name
# vpn.example.net, and the peer names no local-address while vpn ipsec names no
# interface, so each connect cycle takes the source address the kernel's route to the
# resolved remote selects (spec-home-cpe-4-ike-dynamic-wan, the route-chosen mode).
# The lab name server (dns.conf) is down when Ze boots; the checker starts it after
# Ze has failed and retried a cycle.
vpn {
	ipsec {
		# `unmatched` defaults to discard (RFC 4301 Section 4.4.1), which also drops Ze's
		# own DNS query, so the name could never resolve. This entry passes Ze's UDP to
		# the lab name server in the clear, as an operator writes one for the resolver a
		# DNS-named peer needs (docs/guide/ipsec.md, "The catch-all entry"). Order 1000
		# ranks it before the tunnel's 2000. IKE rides the control-plane bypass at 100.
		unmatched discard;
		policy lab-dns {
			action bypass;
			protocol 17;
			order 1000;
			local { prefix 0.0.0.0/0; }
			remote { prefix 172.28.0.8/32; }
		}
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				remote-address vpn.example.net;
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.3";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
