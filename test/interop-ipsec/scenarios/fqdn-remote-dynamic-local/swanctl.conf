connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2
        # MOBIKE is strongSwan's default and is named here because the checker relies
        # on it: with no NAT on the path, IKE_AUTH moves to port 4500 only because
        # MOBIKE was negotiated (RFC 4555 Section 3.3). No encap: the NAT detection
        # hashes must match for real.
        mobike = yes
        encap = no

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = none
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
