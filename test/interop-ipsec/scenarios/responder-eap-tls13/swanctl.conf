connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # strongSwan is the INITIATOR and the EAP-TLS CLIENT; Ze (172.28.0.2) is the
        # responder and the EAP-TLS SERVER, authenticating itself with its own
        # certificate (CN=172.28.0.2) validated against the CA. This is the mirror of
        # scenario eap-tls13, where the roles are the other way round, and it is the only
        # scenario in the lab that reads Ze's EAP-TLS authenticator against another
        # implementation.
        #
        # certs = server.pem is the CLIENT certificate. The native plan mounts
        # that fixed path into the strongSwan peer.
        # `id` sets IDi and `eap_id` sets the EAP identity. Both are named, and
        # both must be, because they are different fields with different
        # defaults: without `id` charon asserts its certificate's DN
        # ("CN=swan-eap-client") as IDi, and Ze then refuses the MSK-derived AUTH
        # against a remote-id of "swan-eap-client" -- correctly, and with a
        # message naming both strings.
        local {
            auth = eap-tls
            certs = server.pem
            id = swan-eap-client
            eap_id = swan-eap-client
        }
        remote {
            auth = pubkey
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = start
            }
        }
    }
}
