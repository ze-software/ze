# charon settings for scenario responder-eap-tls13 (Ze is the EAP-TLS server, charon the client).
#
# version_min / version_max pin TLS 1.3, and here the pin does more than choose a
# version. charon ships `version_max = 1.2` (/etc/strongswan.d/charon.conf) with
# the source comment "default to TLS 1.2 until 1.3 is stable for use in EAP", so
# a stock client never offers 1.3 and the session would land on 1.2, where RFC
# 9190 Section 2.5 does not apply at all.
#
# The pin is ALSO what arms the requirement this scenario exists to prove.
# eap_tls.c get_msk (src/libcharon/plugins/eap_tls/, 5.9.14) reads:
#
#     if (this->tls->get_version_max(this->tls) < TLS_1_3 ||
#         this->indication_sent_received)
#     { ... return SUCCESS; }
#     else
#     { DBG1(DBG_TLS, "missing protected success indication for EAP-TLS with "
#            "%N", tls_version_names, ...); }
#     return FAILED;
#
# The test is on get_version_MAX, not on the negotiated version, so a client left
# at the shipped 1.2 ceiling accepts a bare EAP-Success and this scenario would
# pass against a server that sends no indication.
#
# tls = 2 raises the TLS subsystem to DBG2 on the existing stderr target, which
# is where client_process logs "received protected success indication via TLS".
# The failure line above is DBG1 and needs no raise; the SUCCESS line does, and
# check.py asserts it. default stays at 1 so the rest of the log is unchanged.
#
# Every line here raises or removes a limit on the PEER. Nothing weakens ze: this
# scenario ships no ze-env file, so ze runs with no GODEBUG at all.

charon {
    tls {
        version_min = 1.3
        version_max = 1.3
    }

    filelog {
        stderr {
            default = 1
            tls = 2
        }
    }
}
