# The retry this scenario asserts on is logged at INFO ("ike: rekey refused, retrying
# in the group the peer named", internal/component/ike/engine/inbound.go, refuseRekey).
# The daemon default is WARN, which would keep that line off stderr.
environment {
	log {
		level info;
	}
}

vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			# A 60 second lifetime puts Ze's IKE SA rekey at 39 s (rekeyLead).
			lifetime 60;
			# Proposal 1 is the group every IKE SA rekey starts with
			# (initiateIKERekey reads Proposals[0].DHGroup); strongSwan refuses it.
			# Proposal 2 is the group strongSwan names, configured here, so Ze may
			# retry in it. IKE_SA_INIT meets the same refusal first (invalid-ke-retry).
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
			proposal 2 {
				encryption aes256gcm;
				hash sha256;
				dh-group 19;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs disable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.3";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
