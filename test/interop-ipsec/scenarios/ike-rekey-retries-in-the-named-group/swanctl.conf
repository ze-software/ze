connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # strongSwan is the RESPONDER and runs ecp256 only. Ze's IKE SA rekey starts
        # with its first configured group, 14, so charon answers that CREATE_CHILD_SA
        # with INVALID_KE_PAYLOAD naming 19, and Ze must rekey in group 19.
        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
        }

        proposals = aes256gcm16-sha256-ecp256
        # Ze drives the IKE SA rekey; strongSwan never starts one of its own.
        rekey_time = 0

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                rekey_time = 0
                life_time = 0
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
