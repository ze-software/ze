# RFC 8247 Section 3.1 legacy signature authentication, strongSwan as the
# initiator and Ze as the responder (connection-type respond, start_action =
# start below), with RSA certificates on both sides and RFC 7427 disabled on
# strongSwan (strongswan.conf). Ze, the responder here, still signs with the
# lab's client.pem key (ze-test-client); strongSwan signs with server.pem's
# (172.28.0.3). The file names follow the lab PKI, not the IKE roles.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # The certificate goes out whether or not Ze sent CERTREQ, so the scenario
        # judges the AUTH method and not Ze's CERTREQ policy.
        send_cert = always

        local {
            auth = pubkey
            certs = server.pem
            id = 172.28.0.3
        }
        remote {
            auth = pubkey
            id = ze-test-client
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = start
            }
        }
    }
}
