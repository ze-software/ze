connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                # ze offers two ESP proposals, aes256gcm first and aes128gcm second.
                # charon accepts only the SECOND, so the Child SA runs aes128gcm and
                # `show vpn ipsec sa` MUST report it rather than the first configured
                # proposal (AC-15 of spec-path-mtu-diagnostic).
                esp_proposals = aes128gcm16
                mode = tunnel
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
