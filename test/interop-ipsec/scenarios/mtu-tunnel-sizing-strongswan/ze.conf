# A tunnel to strongSwan over a path clamped below 1500: the checker adds a route
# carrying `mtu 1400` on the NAT box, so every forwarded datagram larger than 1400
# with Don't Fragment set is refused with an ICMP frag-needed naming 1400. Ze binds
# the Child SA to the xfrm interface xa (MTU 1500), so `show mtu` measures the peer's
# path at 1400, sizes the tunnel from the negotiated aes256gcm transform over UDP
# encapsulation (the NAT floats IKE to 4500), and reports xa oversized with the
# command that fixes it. The reference address is the NAT box's own address, which
# answers at the full 1500 and is not forwarded, so the underlay advice is
# `not-clamped`: the circuit carries 1500 and only the peer's path is clamped.
environment {
	mtu {
		reference-address 172.28.0.5;
	}
}
interface {
	xfrm xa {
		if-id 7;
		mtu 1500;
	}
}
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				mode tunnel;
				vti {
					bind xa;
				}
				local-address 172.28.0.2;
				remote-address 172.28.0.7;
				traffic-selector 1 {
					local {
						prefix 10.10.0.1/32;
					}
					remote {
						prefix 10.20.0.1/32;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.7";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
