# Ze INITIATES a transport-mode Child SA from behind a real address translation, and
# rekeys it on its own lifetime after strongSwan rekeyed the IKE SA. This scenario proves
# the working path over a real NAT only: strongSwan's rekey answer already names Ze's own
# addresses, so it passes with the fix broken. The proof that goes red without the fix
# is the unit test TestTransportChildRekeyAfterIKERekeySubstitutesBehindNAT/ze_rekeys
# (internal/component/ike/engine).
#
# local-address is the address Ze's own stack holds. remote-address is the address
# Ze DIALS, which the NAT box owns and maps to strongSwan. Neither end can see the
# other's real address, so RFC 7296 Section 2.23.1's substitution is what makes the
# two ends agree on the selectors their kernels will see.
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			# A short Child SA lifetime: the checker rekeys the IKE SA from strongSwan
			# first, then waits for Ze to rekey this Child SA on its own lifetime.
			lifetime 30;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				mode transport;
				local-address 172.28.0.2;
				remote-address 172.28.0.7;
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.7";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
