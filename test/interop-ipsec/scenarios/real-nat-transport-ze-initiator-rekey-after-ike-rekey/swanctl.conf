connections {
    ze {
        # strongSwan's own address, and the address it sees Ze at. The NAT box owns
        # 172.28.0.6 and maps it to Ze's 172.28.0.2.
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.6

        # No encap = yes here, and that is the point of this scenario. The NAT is a
        # real netfilter box, so the NAT_DETECTION hashes mismatch because the
        # addresses really were translated (RFC 7296 Section 2.23).

        local {
            auth = psk
            id = 172.28.0.7
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                # RFC 7296 Section 2.23.1: strongSwan substitutes before its SPD
                # lookup, so its policy names the addresses ITS stack sees. Ze
                # proposes 172.28.0.2 and 172.28.0.7, and neither appears here.
                local_ts = 172.28.0.3/32
                remote_ts = 172.28.0.6/32
                esp_proposals = aes256gcm16
                mode = transport
                start_action = none
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
