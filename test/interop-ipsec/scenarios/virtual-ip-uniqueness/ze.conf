# Two pool-bound respond peers, one per NAT-translated client source, drawing from one
# pool that contains the address both clients ask for. RFC 3948 Section 5.1 recommends
# that the gateway "assign locally unique IP addresses", so Ze grants 10.1.2.3 to the
# first client and a different address to the second, and each Child SA names its own
# lease as its remote inner source. Return traffic to each lease then leaves on that
# client's SA alone.
#
# 10.20.0.1 is Ze's inner address. The checker installs it on Ze's loopback.
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		remote-access {
			ike-group IKE-PSK;
			esp-group ESP-PSK;
			authentication {
				mode eap-mschapv2;
			}
			pool clients {
				range 10.1.2.0/24;
			}
		}
		site-to-site {
			peer swan-a {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type respond;
				mode tunnel;
				virtual-ip-pool clients;
				local-address 172.28.0.2;
				remote-address 172.28.0.7;
				traffic-selector 1 {
					local {
						prefix 10.20.0.1/32;
					}
					remote {
						prefix 10.1.2.0/24;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.7";
					pre-shared-secret "interop-test-psk";
				}
			}
			peer swan-b {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type respond;
				mode tunnel;
				virtual-ip-pool clients;
				local-address 172.28.0.2;
				remote-address 172.28.0.9;
				traffic-selector 1 {
					local {
						prefix 10.20.0.1/32;
					}
					remote {
						prefix 10.1.2.0/24;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.9";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
