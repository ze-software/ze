# Two clients in one charon, each its own connection from its own outer address. Both
# ask for the same inner address, 10.1.2.3 (RFC 3948 Section 5.1: "both Ari and Bob
# could choose the same private address"), and the checker initiates them one after
# the other.
connections {
    ze-a {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.6
        vips = 10.1.2.3

        local {
            auth = psk
            id = 172.28.0.7
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            child-a {
                remote_ts = 10.20.0.1/32
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = none
            }
        }
    }
    ze-b {
        local_addrs = 172.28.0.8
        remote_addrs = 172.28.0.6
        vips = 10.1.2.3

        local {
            auth = psk
            id = 172.28.0.9
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            child-b {
                remote_ts = 10.20.0.1/32
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = none
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
