# Two road-warrior clients behind one NAT, the figure of RFC 3948 Section 5.1: both
# pick 10.1.2.3 as their inner address, and Ze sees them at two public addresses.
#
# strongSwan holds both client addresses: 172.28.0.3 is its own, and the checker adds
# 172.28.0.8 to its eth0 before the second connection initiates. Ze is translated too,
# so all four NAT_DETECTION comparisons mismatch and both IKE SAs float to UDP 4500.
#
# <the address the peer's own stack holds>  <the address the other peer sees it at>
172.28.0.2  172.28.0.6
172.28.0.3  172.28.0.7
172.28.0.8  172.28.0.9
