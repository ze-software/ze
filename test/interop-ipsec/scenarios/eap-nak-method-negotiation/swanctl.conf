# Scenario eap-nak-method-negotiation. strongSwan offers an EAP method ze does
# not run, and ze refuses it with the legacy Nak of RFC 3748 Section 5.3.1
# instead of erroring and killing the IKE SA.
#
# The offered method is eap-md5. RFC 7296 Section 2.16 puts it out of ze's
# scope: "EAP methods that do not establish a shared key SHOULD NOT be used, as
# they are subject to a number of man-in-the-middle attacks". ze runs
# eap-mschapv2, so every Type-4 Request earns a Type-3 Nak whose one Type-Data
# octet names Type 26.
#
# ONE method is offered, and the peer is the reason. strongSwan 5.9.14 on alpine
# 3.21 ships no eap-dynamic plugin: `ls /usr/lib/ipsec/plugins` on the image
# built from test/interop-ipsec/Dockerfile.strongswan lists eap-md5,
# eap-mschapv2, eap-tls, eap-radius, eap-aka, eap-sim and eap-identity, and no
# eap-dynamic. eap-dynamic is the only charon plugin that answers a received Nak
# by offering another method, so this charon ends the exchange rather than
# switching. What the scenario asserts is the fact that survives that decision:
# ze's Nak reaches strongSwan as a Nak, which is a fact about ze's bytes whatever
# strongSwan does next.
#
# The local side stays pubkey, exactly as scenario eap-mschapv2 has it, because
# ze must verify the responder AUTH payload before it processes any EAP Request
# (RFC 7296 Section 2.16). Without that the exchange would never reach the EAP
# method Request this scenario is about.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = pubkey
            certs = server.pem
            id = 172.28.0.3
        }
        send_cert = always
        remote {
            auth = eap-md5
            eap_id = %any
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}

secrets {
    eap-testuser {
        id = testuser
        secret = "testpassword"
    }
}
