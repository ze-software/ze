# charon settings for scenario eap-nak-method-negotiation.
#
# One setting, and it is about OBSERVATION rather than protocol: charon's log
# goes to stderr through stdio, which block-buffers when stderr is a pipe rather
# than a terminal. `docker logs` then shows only what the buffer has already
# flushed, so a short exchange leaves the interesting lines invisible for as long
# as charon stays quiet.
#
# Measured on 2026-09-01, this scenario, with ze's Nak path reverted: ze's own
# log recorded "ike: EAP packet discarded ... code=1 type=4", so charon had sent
# the EAP-MD5 Request, while charon's own log still ended at "parsed IKE_AUTH
# request 1". The checker then failed on the wrong assertion. `flush_line = yes`
# makes each line reach the pipe when it is written, so the scenario's verdict
# reads charon's exchange rather than charon's buffer.
#
# `default = 1` is the level charon already runs at when no logger is
# configured. It is written out because declaring a filelog replaces the
# built-in stderr logger, and a scenario that silently lowered the level would
# hide the lines it asserts.
charon {
    filelog {
        stderr {
            default = 1
            flush_line = yes
        }
    }
}
