# RFC 4945 Section 5.1.3.12 extended key usage of a peer certificate, Ze as the
# initiator. x509-eku-server-auth-only-refused-ze-initiator and
# x509-eku-ipsec-ike-ze-initiator are one scenario run twice: every file in the
# two directories is the same except pki/server.pem, the certificate strongSwan
# presents below. Both certificates carry the same key, subject and
# subjectAltName as the lab's server.pem, are issued by the lab CA, and carry no
# keyUsage. In the refused scenario the extendedKeyUsage names serverAuth alone,
# so Ze must refuse strongSwan's AUTH and install no SA. In the other it names
# id-kp-ipsecIKE (1.3.6.1.5.5.7.3.17), and the tunnel must come up.
#
# strongSwan does not judge its own certificate's purpose: pubkey_authenticator.c
# checks a certificate's keyUsage only in process (is_compliant_cert), for the
# peer's AUTH, and build signs with whatever certs names. Its EKU parser
# (x509_cert.c x509_parse_eku_extension) skips an OID it does not know, such as
# id-kp-ipsecIKE, so both certificates load. strongSwan's `pki --issue` cannot
# write id-kp-ipsecIKE (x509_generate_eku_extension knows serverAuth, clientAuth,
# iKEIntermediate, ocspSigning and msSmartcardLogon only), so both were issued
# with openssl.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # The certificate goes out whether or not Ze sent CERTREQ
        # (ike_cert_post.c build_certs, CERT_ALWAYS_SEND), so the scenario judges
        # Ze's check of that certificate and not Ze's CERTREQ policy.
        send_cert = always

        local {
            auth = pubkey
            certs = server.pem
            id = 172.28.0.3
        }
        remote {
            auth = pubkey
            id = ze-test-client
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}
