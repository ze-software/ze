connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # strongSwan is the INITIATOR; Ze (172.28.0.2) responds. Neither child
        # starts by itself: the checker initiates `refused` first, whose ESP
        # proposal Ze does not offer, so Ze authenticates the IKE SA and refuses
        # the Child SA in IKE_AUTH. It then initiates `wanted` on the same IKE SA,
        # which strongSwan carries in a CREATE_CHILD_SA exchange with a KE payload
        # because its proposal names a DH group (PFS).
        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            refused {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes128gcm16
                mode = tunnel
                start_action = none
            }
            wanted {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16-modp2048
                mode = tunnel
                start_action = none
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
