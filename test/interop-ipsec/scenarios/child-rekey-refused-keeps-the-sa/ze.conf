vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		# A 60 second lifetime puts the soft trigger at 39 s and the hard limit at
		# 60 s (rekeyLead: the 21 s retransmit budget, capped at half the lifetime),
		# room for the first refused rekey and the one 13.5 to 15 s after it.
		esp-group ESP-PFS {
			lifetime 60;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PFS;
				connection-type initiate;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.3";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
