connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                # No Diffie-Hellman group, while Ze's esp-group sets pfs enable: every
                # Child SA rekey Ze sends carries a MODP_2048 KE, and strongSwan answers
                # it N(NO_PROP). The Child SA from IKE_AUTH carries no KE, so it is set
                # up. This is the configuration delete-while-window-held carried before
                # 5a2ce7a9c4, where Ze resent the refused rekey every second.
                esp_proposals = aes256gcm16
                mode = tunnel
                # Ze drives the rekey; strongSwan never starts one of its own.
                rekey_time = 0
                life_time = 0
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
