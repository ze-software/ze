# charon settings for this refused Child SA rekey scenario.
#
# Two settings, both about OBSERVATION rather than protocol.
#
# 1. A timestamp on every line. The checker measures the gap between strongSwan's
#    first two N(NO_PROP) answers from the time charon wrote on each line
#    (childRekeyRefusalGap, internal/le/interoplab/ipsec/checkers.go), never from
#    when it reads them. time_add_ms appends ".mmm" to time_format. strongSwan
#    5.9.14, which this image ran when the setting was written, did not accept
#    time_precision; 6.1.0 accepts both and reads time_add_ms when
#    time_precision is unset (src/libcharon/daemon.c).
#
# 2. A logger that reaches `docker logs` line by line. With no logger configured,
#    charon 5.9.14 logs to stdout (measured 2026-10-17 in this image: stderr
#    empty, stdout carrying the log), and C stdio fully buffers stdout on a pipe.
#    This filelog writes to stderr, which stdio leaves unbuffered, and
#    `flush_line = yes` flushes each line as well.
#
# Why it matters: the evidence-nightly run of 2026-10-17 read the second refusal
# 14.858 ms after the first, the time of one log read, so both lines were in the
# log before the checker's first read found either. One buffered flush carrying
# both lines would produce that, and so would a resend inside one poll: a read time
# cannot tell them apart, and the timestamps can. Ze holds a refused rekey 13.5 to
# 15 s (TestChildRekeyRefusedOnTheWireWaits).
#
# `default = 1` is charon's level when no logger is configured, written out
# because declaring a filelog replaces the built-in logger.
charon {
    filelog {
        stderr {
            default = 1
            flush_line = yes
            time_format = %H:%M:%S
            time_add_ms = yes
        }
    }
}
