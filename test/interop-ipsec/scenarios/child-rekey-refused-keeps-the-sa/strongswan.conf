# charon settings for this refused Child SA rekey scenario.
#
# One setting, about OBSERVATION rather than protocol: a timestamp on every line
# of the lab's flushed stderr logger (test/interop-ipsec/strongswan-lab.conf,
# which this section composes with). The checker measures the gap between
# strongSwan's first two N(NO_PROP) answers from the time charon wrote on each
# line (childRekeyRefusalGap, internal/le/interoplab/ipsec/checkers.go), never
# from when it reads them. time_add_ms appends ".mmm" to time_format. strongSwan
# 5.9.14, which this image ran when the setting was written, did not accept
# time_precision; 6.1.0 accepts both and reads time_add_ms when time_precision
# is unset (src/libcharon/daemon.c).
#
# Why it matters: the evidence-nightly run of 2026-10-17 read the second refusal
# 14.858 ms after the first, the time of one log read, so both lines were in the
# log before the checker's first read found either. One buffered flush carrying
# both lines would produce that, and so would a resend inside one poll: a read time
# cannot tell them apart, and the timestamps can. Ze holds a refused rekey 13.5 to
# 15 s (TestChildRekeyRefusedOnTheWireWaits).
charon {
    filelog {
        stderr {
            time_format = %H:%M:%S
            time_add_ms = yes
        }
    }
}
