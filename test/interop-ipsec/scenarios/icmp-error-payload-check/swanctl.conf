# RFC 4301 Section 6.2, an ICMP error addressed to Ze that arrives on a Child SA with
# IP and ICMP headers the SA's selectors do not cover. strongSwan's host is the router
# that generates it: the checker turns forwarding on, routes Ze's inner prefix with
# preferred source 10.9.9.9 (inside no selector), and Ze sends echo requests with
# TTL 1 through it, so the kernel answers each with Time Exceeded from 10.9.9.9.
#
# `icmp = yes` is what carries the consistent error through this Child SA:
# vici_config.c parse_opt_icmp sets OPT_FORWARD_ICMP, child_sa.c
# install_policies_outbound passes it as forward_icmp, and kernel_netlink_ipsec.c
# add_policy_internal sets XFRM_POLICY_ICMP on the out and fwd policies. The outer
# flow 10.9.9.9 -> 10.2.0.1 matches no policy, so icmp_route_lookup
# (net/ipv4/icmp.c) looks up the reversed embedded flow 10.1.0.77 -> 10.2.0.1 with
# XFRM_LOOKUP_ICMP, which matches the out policy only because of that flag.
#
# The inconsistent error cannot be carried by any policy charon negotiates, since
# its embedded header names 10.7.0.5, inside no selector. The checker adds, for that
# step alone, a kernel out policy for 10.9.9.9/32 -> 10.2.0.0/24 bound to this Child
# SA's reqid: the model of a peer whose SPD carries what it should not. A tunnel-mode
# SA carries no state selector (kernel_netlink_ipsec.c add_sa installs one for
# transport and BEET only), so that policy resolves to charon's own outbound SA.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 10.1.0.0/24
                remote_ts = 10.2.0.0/24
                esp_proposals = aes256gcm16
                mode = tunnel
                icmp = yes
                # No timer rekey: the reqid the checker binds must not change mid-check.
                rekey_time = 0
                life_time = 0
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
