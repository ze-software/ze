# RFC 4301 Section 6.2: "If an IPsec implementation receives an inbound ICMP error
# message on an SA, and the IP and ICMP headers of the message do not match the
# traffic selectors for the SA, the receiver MUST process the received message in a
# special fashion."
#
# Local delivery only: the error is addressed to Ze's own inner address 10.2.0.1. A
# FORWARDED error on a Child SA is a known kernel limit (LL-XFRM-ICMP-TRANSIT,
# docs/architecture/linux-limitations.md) and this scenario does not cover it.
#
# icmp-error-check is left at its default, true. The catch-all is written as discard,
# so the reversed payload lookup of the inconsistent error meets an entry that drops
# it. The one bypass lets the TTL-1 echo request to 10.7.0.5 leave in the clear,
# outbound only, so the error that names it has no inbound entry to match.
#
# Red proof: remove `state.ICMP = true` in xfrmStateFromParams
# (internal/component/ike/dataplane/xfrm_linux.go) and let the harness rebuild the Ze
# image; the consistent error still arrives over the SA but Icmp.InTimeExcds stays
# still. Widening the inbound protect policy's source selector to 0.0.0.0/0 in
# xfrmPolicyFromParams turns the inconsistent half red (checkICMPErrorPayloadCheck,
# internal/le/interoplab/ipsec/icmperror.go).
vpn {
	ipsec {
		unmatched discard;
		policy icmp-error-trigger {
			action bypass;
			direction out;
			protocol 1;
			local { prefix 10.2.0.1/32; }
			remote { prefix 10.7.0.5/32; }
		}
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs disable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				traffic-selector 1 {
					local {
						prefix 10.2.0.0/24;
					}
					remote {
						prefix 10.1.0.0/24;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.3";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
