connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
        }

        proposals = aes256gcm16-sha256-modp2048

        # strongSwan's own liveness check. After restore_link it is what
        # proves the peer alive to Ze, which retires Ze's own unanswered
        # probe and frees its RFC 7296 Section 2.3 request window.
        dpd_delay = 2s

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                # Ze's esp-group sets pfs enable, so its rekey carries a MODP_2048 KE
                # (rekey.go, childRekeyDHGroup); without the group here strongSwan
                # answers NO_PROPOSAL_CHOSEN and the rekey this scenario waits on never lands.
                esp_proposals = aes256gcm16-modp2048
                mode = tunnel
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
