connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = pubkey
            certs = server.pem
            id = 172.28.0.3
        }
        send_cert = always
        remote {
            auth = eap-mschapv2
            eap_id = %any
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}

secrets {
    eap-testuser {
        id = testuser
        secret = "testpassword"
    }
}
