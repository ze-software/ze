# charon settings for scenario responder-eap-mschapv2 (Ze is the EAP-MSCHAPv2 authenticator, charon the
# client).
#
# One setting, and it exists to make an assertion trustworthy rather than to change
# what charon does on the wire.
#
# The native checker counts "retransmit 1 of request" in peer logs before the blackout and
# again after it, and refuses the run when the count did not rise. That guard is what
# stops the scenario passing without ever meeting a duplicate. charon writes to stderr
# through stdio, and stdio BLOCK buffers when the target is a pipe, which is what
# `docker logs` reads. A retransmit charon emitted during part one but had not yet
# flushed would therefore be absent from the before count and present in the after
# count, and the guard would pass on a duplicate that predates the window it claims to
# measure.
#
# flush_line makes charon flush after every line, so a count taken at any moment
# reflects what charon has actually logged. The guard then measures the blackout.
#
# default = 1 is charon's own default level and is restated here because naming a
# filelog target replaces the implicit one. "retransmit N of request" is logged at
# DBG1 (task_manager_v2.c), so level 1 is what the assertion needs.

charon {
    filelog {
        stderr {
            default = 1
            flush_line = yes
        }
    }
}
