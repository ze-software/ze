connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # strongSwan is the INITIATOR and the EAP-MSCHAPv2 CLIENT; Ze (172.28.0.2) is
        # the responder and the EAP authenticator/server, authenticating itself with
        # its server certificate (CN=172.28.0.3) validated against the CA. This mirrors
        # scenario eap-mschapv2 (initiator EAP-MSCHAPv2) with the roles reversed.
        # id is the IKE identity this side asserts in IDi, and eap_id is the EAP
        # username. RFC 7296 Section 2.16 keeps them separate, and charon falls back to
        # the local IP for IDi when id is unset. Ze's remote-id names testuser and is
        # compared against IDi (checkRemoteIdentity, engine/remote_id.go), so leaving id
        # unset made ze refuse the AUTH with "asserted identity 172.28.0.3, and
        # remote-id expects testuser" after every EAP round had already succeeded.
        local {
            auth = eap-mschapv2
            id = testuser
            eap_id = testuser
        }
        remote {
            auth = pubkey
            id = 172.28.0.3
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = start
            }
        }
    }
}

secrets {
    eap-testuser {
        id = testuser
        secret = "testpassword"
    }
}
