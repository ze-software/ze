# strongSwan initiates at 172.28.0.3, then moves to 172.28.0.9.
# The checker requires the original IKE and Child SPIs at the migrated endpoints.
vpn {
    ipsec {
        ike-group IKE-PSK {
            key-exchange ikev2;
            lifetime 28800;
            proposal 1 {
                encryption aes256gcm;
                hash sha256;
                dh-group 14;
            }
        }
        esp-group ESP-PSK {
            lifetime 3600;
            pfs enable;
            proposal 1 {
                encryption aes256gcm;
            }
        }
        interface eth0;
        site-to-site {
            peer swan {
                ike-group IKE-PSK;
                esp-group ESP-PSK;
                connection-type respond;
                mode tunnel;
                local-address 172.28.0.2;
                remote-address 172.28.0.3;
                traffic-selector 1 {
                    local {
                        prefix 10.10.0.1/32;
                    }
                    remote {
                        prefix 10.20.0.1/32;
                    }
                }
                authentication {
                    mode pre-shared-secret;
                    local-id "172.28.0.2";
                    remote-id "172.28.0.3";
                    pre-shared-secret "interop-test-psk";
                }
            }
        }
    }
}
