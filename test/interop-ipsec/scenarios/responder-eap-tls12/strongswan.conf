# charon settings for scenario responder-eap-tls12 (Ze is the EAP-TLS server, charon the
# client).
#
# version_min / version_max pin TLS 1.2, the version charon ships as its maximum
# (/etc/strongswan.d/charon.conf, `version_max = 1.2`). charon never sends the RFC 7627
# extended master secret, so the handshake completes through Finished and Ze then
# refuses to export the RFC 5216 Section 2.3 MSK: the scenario asserts that refusal and
# that the IKE SA does not authenticate (checkResponderEAPTLS12). charon accepts an
# empty and a chosen session_id alike, so this scenario cannot go red on the id; the
# unit test reads it off the ServerHello. `tls = 2` makes charon log the Finished it
# receives, which the checker reads.
charon {
    tls {
        version_min = 1.2
        version_max = 1.2
    }

    filelog {
        stderr {
            default = 1
            tls = 2
        }
    }
}
