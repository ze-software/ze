# charon settings for scenario responder-eap-tls12 (Ze is the EAP-TLS server, charon the
# client).
#
# version_min / version_max pin TLS 1.2, the version charon ships as its maximum
# (/etc/strongswan.d/charon.conf, `version_max = 1.2`). The scenario is the regression
# proof that Ze's EAP-TLS server keeps interoperating at TLS 1.2 with the standard
# library patch and the TLS 1.2 ticket suppression in place. charon accepts an empty
# and a chosen session_id alike, so this scenario cannot go red on the id; the unit
# test reads it off the ServerHello.
charon {
    tls {
        version_min = 1.2
        version_max = 1.2
    }

    filelog {
        stderr {
            default = 1
            tls = 2
        }
    }
}
