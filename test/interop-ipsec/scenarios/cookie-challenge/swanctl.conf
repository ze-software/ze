connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # strongSwan is the INITIATOR; Ze (172.28.0.2) is the responder that
        # challenges. Driving it this way is deterministic: Ze challenges every
        # initiation at cookie-threshold 0, whereas waiting for strongSwan to become
        # loaded enough to issue its OWN cookies would be a race.
        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = start
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
