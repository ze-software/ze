connections {
    ze {
        # The same translated path the two transport scenarios use: strongSwan's own
        # address, and the address it sees Ze at.
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.6

        local {
            auth = psk
            id = 172.28.0.7
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                # Inner addresses, which no NAT on this path can move. RFC 7296
                # Section 2.23.1 does not apply to tunnel mode, so both ends
                # negotiate exactly what their operators wrote.
                local_ts = 10.20.0.1/32
                remote_ts = 10.10.0.1/32
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = none
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
