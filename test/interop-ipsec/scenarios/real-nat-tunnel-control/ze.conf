# The CONTROL for the two real-NAT transport scenarios: the identical topology, the
# identical three containers and the identical netfilter rules, differing in the Child
# SA's MODE alone.
#
# RFC 7296 Section 2.23.1 governs transport mode alone, so these selectors are
# negotiated untouched. They are INNER addresses, which the NAT box never sees, so a
# substitution that leaked past its mode gate would replace them with the outer pair
# and nothing else in the suite would notice. The checker installs 10.10.0.1 on Ze and
# 10.20.0.1 on strongSwan before it pings across the tunnel.
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				mode tunnel;
				local-address 172.28.0.2;
				remote-address 172.28.0.7;
				traffic-selector 1 {
					local {
						prefix 10.10.0.1/32;
					}
					remote {
						prefix 10.20.0.1/32;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.7";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
