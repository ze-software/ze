# The home CPE's management responder. Its child config names IPv6 alone, so when Ze
# proposes TSi and TSr {0.0.0.0/0, ::/0}, strongSwan 6.1.0 narrows the answer to
# ::/0 === ::/0: traffic_selector_list.c select_ intersects each configured selector with
# each received one, and traffic_selector.c get_subset answers NULL when the two types
# differ, so the IPv4 entries drop out (RFC 7296 Section 2.9). The outer path stays IPv4.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = ::/0
                remote_ts = ::/0
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = none
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
