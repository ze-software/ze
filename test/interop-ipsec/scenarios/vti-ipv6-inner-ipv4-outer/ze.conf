# The home CPE's management path: one Child SA on the xfrm interface vti0, proposing
# both families (IPv4 entry first), over an IPv4 outer path. strongSwan narrows the
# answer to ::/0 === ::/0, so Ze installs IPv6 policies only, on vti0's if_id 7, and
# the static route sends fd00:db8:1::/112 into vti0. The tunnel states are IPv4 and
# carry IPv6 inside, which only works when they carry XFRM_STATE_AF_UNSPEC
# (RFC 4301 Section 5.1.2.1: "IPsec allows the IP version of the encapsulating header
# to be different from that of the inner header.").
interface {
	xfrm vti0 {
		if-id 7;
		unit 0 {
			ipv6 {
				address [ fd00:db8:1::1/128 ];
			}
		}
	}
}
static {
	table default {
		route fd00:db8:1::/112 {
			next { interface vti0 { } }
		}
	}
}
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				mode tunnel;
				vti {
					bind vti0;
				}
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				traffic-selector 1 {
					local {
						prefix 0.0.0.0/0;
					}
					remote {
						prefix 0.0.0.0/0;
					}
				}
				traffic-selector 2 {
					local {
						prefix ::/0;
					}
					remote {
						prefix ::/0;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.3";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
