connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                # Ze drives the Child SA rekey off the 120 second ESP lifetime in
                # ze.conf. strongSwan-initiated rekey is disabled so the SPI set
                # this scenario reads changes for ONE reason, and a collision
                # cannot leave two replacements racing in the dump.
                rekey_time = 0
                life_time = 0
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
