connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # Ze (172.28.0.2) initiates and strongSwan responds. strongSwan, the
        # responder of the original IKE SA, reauthenticates it after reauth_time by
        # creating a new IKE SA toward Ze (RFC 7296 Section 2.8.3, ike_sa.c reauth),
        # make-before-break by default in strongSwan 6. rand_time = 0s pins the
        # moment, so the checker's wait is bounded.
        reauth_time = 60s
        rand_time = 0s

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
