# charon settings for the out-of-SA notice scenario.
#
# One setting, about OBSERVATION rather than protocol: a logger that reaches
# `docker logs` line by line. With no logger configured, charon 5.9.14 logs to
# stdout, and C stdio fully buffers stdout on a pipe. The checker
# (checkOutOfSARequestNotifiedOverSA, internal/le/interoplab/ipsec/suspicious.go)
# waits for the "parsed INFORMATIONAL request" line of Ze's notice. On the first
# run (2026-10-20) charon's visible log stopped at "looking for peer configs"
# for over a minute while the Child SA was already installed: everything after
# it sat in the stdio buffer. This filelog writes to stderr, which stdio leaves
# unbuffered, and `flush_line = yes` flushes each line as well.
#
# `default = 1` is charon's level when no logger is configured, written out
# because declaring a filelog replaces the built-in logger.
charon {
    filelog {
        stderr {
            default = 1
            flush_line = yes
        }
    }
}
