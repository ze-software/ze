# RFC 8420 Ed448 IKE AUTH, Ze as the initiator. Ze holds an Ed448 leaf
# (pki/client.pem, ze-test-client) issued by the lab P-256 CA, and strongSwan
# holds the lab P-256 leaf (pki/server.pem, 172.28.0.3). RFC 7427 is left on, so
# both sides send SIGNATURE_HASH_ALGORITHMS: strongSwan 6.1.0 announces Identity
# (5) because its openssl plugin registers an HASH_IDENTITY hasher
# (openssl_plugin.c), and Ze must then sign under method 14 with id-Ed448 and no
# prehash. The openssl plugin also provides PUBKEY_VERIFY for SIGN_ED448, which is
# what verifies Ze's signature.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # The certificate goes out whether or not Ze sent CERTREQ, so the scenario
        # judges the AUTH signature and not Ze's CERTREQ policy.
        send_cert = always

        local {
            auth = pubkey
            certs = server.pem
            id = 172.28.0.3
        }
        remote {
            auth = pubkey
            id = ze-test-client
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}
