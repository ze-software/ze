# real-nat-tunnel-control with ONE difference: remote-address is the DNS name
# vpn.example.net, which the lab name server (dns.conf) answers with strongSwan's
# public address 172.28.0.7. The NAT box rewrites both addresses of every datagram, so
# RFC 7296 Section 2.23 NAT detection must hash over the address the name RESOLVED to
# for Ze and strongSwan to see the translation (spec-home-cpe-4-ike-dynamic-wan, AC-11).
# The checker starts the name server before it waits for the IKE SA.
vpn {
	ipsec {
		# `unmatched` defaults to discard (RFC 4301 Section 4.4.1), which also drops Ze's
		# own DNS query, so the name could never resolve. This entry passes Ze's UDP to
		# the lab name server in the clear, as an operator writes one for the resolver a
		# DNS-named peer needs (docs/guide/ipsec.md, "The catch-all entry"). Order 1000
		# ranks it before the tunnel's 2000. IKE rides the control-plane bypass at 100.
		unmatched discard;
		policy lab-dns {
			action bypass;
			protocol 17;
			order 1000;
			local { prefix 0.0.0.0/0; }
			remote { prefix 172.28.0.8/32; }
		}
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				mode tunnel;
				local-address 172.28.0.2;
				remote-address vpn.example.net;
				traffic-selector 1 {
					local {
						prefix 10.10.0.1/32;
					}
					remote {
						prefix 10.20.0.1/32;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.7";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
