# The far end of the guarded tunnel, and the WAN observer. Its child config names the
# one /128 pair Ze proposes, so strongSwan 6.1.0 answers with it unchanged
# (traffic_selector_list.c select_ keeps the intersection get_subset returns). The
# checker gives this container the WAN-only destination 2001:db8:99::1 and counts, in
# ip6tables INPUT, every clear packet that reaches it from the tunnel address and from
# Ze's eth0 address. charon plays no part in that count: it is the kernel's.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = fd00:db8:1::2/128
                remote_ts = fd00:db8:1::1/128
                # MODP_2048 matches Ze's esp-group, which sets pfs enable.
                esp_proposals = aes256gcm16-modp2048
                mode = tunnel
                start_action = none
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
