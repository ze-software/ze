# The tunnel-source guard against strongSwan. vti0 (if_id 7) holds fd00:db8:1::1, and
# one Child SA carries fd00:db8:1::1 <-> fd00:db8:1::2 alone. Under `unmatched
# discard` Ze lets IPv6 host traffic from fd00:db8:1::1 past the node-wide DISCARD
# catch-all with a source BYPASS at if_id 0 (the flow carries no device at that
# lookup), and the guard keeps that address on vti0: an `ip -6 rule` from the address
# into a table holding the Child SA's route and `unreachable ::/0`, and a postrouting
# drop of the address leaving any other device. The checker routes 2001:db8:99::/64
# out of eth0 with fd00:db8:1::1 as the preferred source, so both the socket-chosen
# and the kernel-chosen source meet the guard.
#
# The `wan-control` entry is the capture's positive control: a bypass for ICMPv6 from
# eth0's own address fd00:db8:a::2 to the same WAN-only destination, so a clear packet
# from Ze to that destination is shown to reach strongSwan's counter at all.
interface {
	xfrm vti0 {
		if-id 7;
		unit 0 {
			ipv6 {
				address [ fd00:db8:1::1/128 ];
			}
		}
	}
}
static {
	table default {
		route fd00:db8:1::/112 {
			next { interface vti0 { } }
		}
	}
}
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		unmatched discard;
		policy wan-control {
			action bypass;
			direction out;
			protocol 58;
			order 3000;
			local {
				prefix fd00:db8:a::2/128;
			}
			remote {
				prefix 2001:db8:99::/64;
			}
		}
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				mode tunnel;
				vti {
					bind vti0;
				}
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				traffic-selector 1 {
					local {
						prefix fd00:db8:1::1/128;
					}
					remote {
						prefix fd00:db8:1::2/128;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.3";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
