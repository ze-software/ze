# RFC 8420 Ed25519 IKE AUTH, strongSwan as the initiator and Ze as the responder
# (connection-type respond, start_action = start below). strongSwan holds an
# Ed25519 leaf (pki/server.pem, 172.28.0.3) issued by the lab P-256 CA, and Ze
# holds the lab P-256 leaf (pki/client.pem, ze-test-client). The file names
# follow the lab PKI, not the IKE roles. strongSwan can sign with its Ed25519 key
# only under method 14 with the Identity hash, so it signs only if Ze's
# IKE_SA_INIT response announced Identity (5), and the tunnel comes up only if
# Ze verified that Ed25519 AUTH.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # The certificate goes out whether or not Ze sent CERTREQ, so the scenario
        # judges the AUTH signature and not Ze's CERTREQ policy.
        send_cert = always

        local {
            auth = pubkey
            certs = server.pem
            id = 172.28.0.3
        }
        remote {
            auth = pubkey
            id = ze-test-client
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = start
            }
        }
    }
}
