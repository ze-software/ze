connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # strongSwan dials the tunnel, so Ze is the ORIGINAL IKE RESPONDER. Every
        # rekey timer here is disabled: charon must raise no exchange of its own, so
        # the only CREATE_CHILD_SA on the wire is the one Ze raises when its 30s ESP
        # lifetime expires. That is the direction this scenario exists to witness.
        rekey_time = 0s
        reauth_time = 0s

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                rekey_time = 0
                life_time = 0
                start_action = start
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
