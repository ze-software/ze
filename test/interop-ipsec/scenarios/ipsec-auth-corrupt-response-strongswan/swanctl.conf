connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # Scenario ipsec-auth-corrupt-response-strongswan: the connection of
        # psk-site-to-site, unchanged. Ze (172.28.0.2) is the INITIATOR and
        # strongSwan the responder. The checker establishes it once as the control,
        # holds strongSwan's IKE_AUTH responses back in nftables, terminates the IKE
        # SA so Ze reconnects, injects forged IKE_AUTH responses at Ze while it
        # retransmits its request, and lifts the hold. Ze sends that request from UDP
        # 4500 because it offers MOBIKE (mobikeAuthOffer), and charon answers along
        # the path the request came in (build_response, task_manager_v2.c), so the
        # held responses leave from 4500 and IKE_SA_INIT still passes on 500.
        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
