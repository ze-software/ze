# strongSwan sits behind a NAT that changes its PORT as well as its address: its UDP
# 4500 leaves the box from public port 14500 (the third column), so a Child SA that
# encapsulates to the constant 4500 sends ESP to a port the NAT never mapped. RFC 3948
# Section 2.1: "the Source Port and Destination Port MUST be the same as that used by
# IKE traffic."
#
# Ze is not translated and keeps its own address, so it is not behind a NAT and adopts
# the peer's moved endpoint after establishment (RFC 7296 Section 2.23), which the
# checker's rebind step drives by remapping the port to 14501. The row has no DNAT:
# strongSwan initiates, its checker routes it to Ze through the box, and conntrack
# reverses the replies.
#
# <the address the peer's own stack holds>  <the address Ze sees it at>  <public port of its UDP 4500>
172.28.0.3  172.28.0.7  14500
