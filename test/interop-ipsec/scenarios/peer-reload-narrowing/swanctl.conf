connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # Ze dials this connection, so charon only responds. `unique = replace` is what
        # makes charon retire the SA the wide policy built: when ze re-initiates after
        # the reload and authenticates as the same identity, charon deletes the older
        # IKE_SA and its CHILD_SA, and the SPD keeps only the narrowed pair. The default
        # `no` would leave both SAs installed until DPD expired the dead one, and this
        # scenario asserts the SET of ESP policies.
        unique = replace

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 10.1.0.0/24
                remote_ts = 10.2.0.0/24
                esp_proposals = aes256gcm16
                mode = tunnel
                # No timer rekey: check.py drives every state change, so a timer
                # firing mid-check cannot be mistaken for the reload.
                rekey_time = 0
                life_time = 0
                # No start_action: ze is the initiator here, and charon answering an
                # unsolicited IKE_SA_INIT is what proves ze put the narrowed selectors
                # on the wire. A charon that dialled would negotiate its own policy.
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
