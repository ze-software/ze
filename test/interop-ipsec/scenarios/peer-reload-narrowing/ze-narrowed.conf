# The operator's edit. This file is IDENTICAL to ze.conf except for one leaf:
# traffic-selector 1's local prefix is 10.2.0.0/25 rather than 10.2.0.0/24.
# check.py renders it over the config the container mounts and sends SIGHUP.
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs disable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				traffic-selector 1 {
					local {
						prefix 10.2.0.0/25;
					}
					remote {
						prefix 10.1.0.0/24;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.3";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
