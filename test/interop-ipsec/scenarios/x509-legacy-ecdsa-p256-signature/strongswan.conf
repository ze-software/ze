# Stimulus: charon.signature_authentication = no turns RFC 7427 off in
# strongSwan 6.1.0. ike_init.c then neither sends the SIGNATURE_HASH_ALGORITHMS
# notify nor processes Ze's (the "%s.signature_authentication" setting, default
# yes), so Ze receives no notify and RFC 7427 Section 3 leaves it no method 14.
# Ze must sign with the legacy method of its ECDSA P-256 key: ECDSA-256 (AUTH method 9). charon's
# pubkey_authenticator.c build() signs its own AUTH the same legacy way.
#
# Observation: the flushed stderr logger at charon's default level carries the
# "authentication of '<id>' with <scheme> successful" line the checker reads (see
# multiple-auth-ze-initiator/strongswan.conf for why stdout is not enough).
charon {
    signature_authentication = no
    filelog {
        stderr {
            default = 1
            flush_line = yes
        }
    }
}
