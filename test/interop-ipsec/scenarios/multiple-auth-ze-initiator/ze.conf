pki {
	ca test-ca {
		certificate "%%PKI_B64:ca.pem%%";
	}
	certificate ze-client {
		certificate "%%PKI_B64:client.pem%%";
		private {
			key "%%PKI_B64:client-key.pem%%";
		}
	}
}
vpn {
	ipsec {
		ike-group IKE-MA {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-MA {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-MA;
				esp-group ESP-MA;
				connection-type initiate;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				authentication {
					mode x509;
					local-id "ze-test-client";
					remote-id "172.28.0.3";
					certificate ze-client;
					ca-certificate test-ca;
					second-round {
						local {
							mode pre-shared-secret;
							pre-shared-secret "interop-round-two-psk";
							id "ze-user.example.com";
						}
						remote {
							mode pre-shared-secret;
							pre-shared-secret "interop-round-two-psk";
							id "swan-user.example.com";
						}
					}
				}
			}
		}
	}
}
