# RFC 4739 multiple authentication, Ze as the initiator.
#
# Round 1 is X.509 both ways: Ze signs with client.pem (ze-test-client),
# strongSwan with server.pem (172.28.0.3). Round 2 is a pre-shared key both
# ways, under identities of their own, so the second round is told apart from
# the first in charon's log by the identity it names.
#
# The round-2 identities are FQDNs on purpose. Ze derives the ID type from the
# value (encodeIKEID, internal/component/ike/engine/auth.go): an IP literal is
# an address, anything else ID_FQDN. charon parses "user@domain" as
# ID_RFC822_ADDR, and an FQDN never matches an RFC822 identity, so a mail-shaped
# id would fail the constraint check for a reason unrelated to RFC 4739.
#
# multiple_authentication needs no setting: ike_auth.c multiple_auth_enabled()
# reads "%s.multiple_authentication" with the default TRUE.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # The certificate goes out whether or not Ze sent CERTREQ, so this
        # scenario judges the second round and not Ze's CERTREQ policy.
        send_cert = always

        local {
            auth = pubkey
            certs = server.pem
            id = 172.28.0.3
        }
        local-2 {
            auth = psk
            id = swan-user.example.com
        }
        remote {
            auth = pubkey
            id = ze-test-client
        }
        remote-2 {
            auth = psk
            id = ze-user.example.com
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}

# One round-2 secret serves both directions. charon looks a PSK up by the pair
# (my_id, other_id) and matches each against the entry's owner list, which is
# unordered (mem_cred.c has_owner, shared_filter). Proving Ze's AUTH and
# building its own both look up (swan-user.example.com, ze-user.example.com),
# so per-direction secrets cannot be expressed. Round 1 is X.509 both ways, so
# no lookup of round 1 asks for a pre-shared key at all.
secrets {
    ike-round2 {
        id-ze = ze-user.example.com
        id-swan = swan-user.example.com
        secret = "interop-round-two-psk"
    }
}
