connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = pubkey
            certs = server.pem
            id = 172.28.0.3
        }
        remote {
            auth = eap-tls
            # charon looks the EAP-TLS peer's certificate up BY the EAP identity:
            # process_cert_verify (strongSwan 5.9.14 src/libtls/tls_server.c) calls
            # tls_find_public_key with this->peer, and load_method
            # (src/libcharon/sa/ikev2/authenticators/eap_authenticator.c) sets that
            # to the EAP-Response/Identity whenever eap_id is %any. RFC 9190
            # Section 2.1.8 forbids a TLS 1.3 client from putting a permanent
            # identifier in the Identity Response, so the anonymous NAI ze sends
            # (anonymousNAI, internal/core/eap/nai.go) can never name this
            # certificate, and %any made charon answer 'no trusted certificate
            # found for anonymous to verify TLS peer'.
            #
            # Naming the certificate identity keys that lookup on the configuration
            # instead of on the wire. It is what RFC 9190 Section 2.2 permits a
            # server to do: the Identity Response "is not authenticated by EAP-TLS",
            # so a server that needs an identity to select credentials must get it
            # from somewhere else. charon then skips the EAP-Identity exchange
            # entirely (load_method's "using configured EAP-Identity" branch), which
            # is why no strongSwan scenario can observe ze's anonymous NAI.
            eap_id = ze-test-client
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}
