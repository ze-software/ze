# charon settings for scenario eap-tls13 (EAP-TLS over TLS 1.3).
#
# version_min / version_max pin TLS 1.3. charon ships `version_max = 1.2`
# (/etc/strongswan.d/charon.conf), with the source comment "default to TLS 1.2
# until 1.3 is stable for use in EAP", so a stock responder never offers 1.3 and
# every EAP-TLS session lands on 1.2. Pinning BOTH ends of the range means a
# silent fall back to 1.2 fails this scenario instead of passing it under the
# wrong version.
#
# `send_certreq_authorities` is deliberately NOT set here. charon ships it as
# `yes` and this scenario runs it at that shipped default, so the exchange it
# proves is one a stock strongSwan performs. The checked-in PKI carries an RSA
# CA key rather than prime256v1; that peer-side fixture is the only change
# needed to reach this path.
#
# Why the key type of a CA decides whether a TLS extension is well formed:
# write_certificate_authorities() (src/libtls/tls_server.c, 5.9.14) fills the
# certificate_authorities list from
#
#     lib->credmgr->create_cert_enumerator(lib->credmgr, CERT_X509, KEY_RSA,
#                                          NULL, TRUE)
#
# KEY_RSA is a hardcoded literal, and certificate_matches()
# (src/libstrongswan/credentials/certificates/certificate.c) returns FALSE for
# any certificate whose public key type differs from the requested one. An
# ECDSA trust anchor is therefore never enumerated, no matter how it is
# configured -- setting `cacerts` on the remote section does not help, because
# the anchor was already loaded and trusted and the filter rejects it on key
# type alone. The list came out empty, and charon emitted the extension anyway
# as `002f 0002 0000`. RFC 8446 Section 4.2.4 declares
# `DistinguishedName authorities<3..2^16-1>`, so 3 octets is the shortest legal
# encoding and an empty list is malformed. Go's crypto/tls rejects it
# (`certificateRequestMsgTLS13.unmarshal`: `!extData.ReadUint16LengthPrefixed
# (&auths) || auths.Empty()`) and answers decode_error, which reaches ze as
# "local error: tls: error decoding message".
#
# Measured 2026-08-01, same scenario, same shipped `send_certreq_authorities`:
# with the shared EC CA charon logged "sending TLS cert request" 0 times and the
# SA never left CONNECTING; with the RSA CA it logs it once for
# 'CN=ze-interop-ca' and the SA reaches ESTABLISHED. The native checker asserts that line,
# so a regression back to an empty list fails this scenario rather than passing
# it on the omit-the-extension workaround.
#
# Every line here raises or removes a limit on the PEER. Nothing weakens ze:
# this scenario ships no ze-env file, so it runs with no GODEBUG at all.

charon {
    tls {
        version_min = 1.3
        version_max = 1.3
    }
}
