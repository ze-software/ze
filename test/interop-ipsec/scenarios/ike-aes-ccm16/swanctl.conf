connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
        }

        # One IKE proposal, and it names AES CCM with a 16-octet ICV. charon
        # answers a proposal it cannot key with NO_PROPOSAL_CHOSEN rather than
        # falling back, so an IKE SA here is an IKE SA under RFC 5282.
        proposals = aes256ccm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                # ESP is AES GCM: ze refuses AES CCM for an ESP SA at config
                # parse, because no dataplane backend names a CCM transform
                # (ipsec.EncryptionImplementedESP).
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
