connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # strongSwan is the RESPONDER. Ze proposes TSi {10.2.0.0/24} and
        # TSr {10.1.0.0/24, 10.3.0.0/24}, and strongSwan answers one TSi and two
        # TSr selectors. RFC 7296 Section 3.13 reads that answer as both
        # combinations, so Ze must install 10.2-10.1 AND 10.2-10.3; pairing TSi[0]
        # with TSr[0] alone installed the first and dropped the second.
        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 10.1.0.0/24,10.3.0.0/24
                remote_ts = 10.2.0.0/24
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
