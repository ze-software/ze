connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
        }

        proposals = aes256gcm16-sha256-modp2048

        # strongSwan RESPONDS. Its child proposal (aes128gcm16) is one Ze does not
        # offer, so the IKE_AUTH Child SA is refused and Ze keeps a childless IKE
        # SA. The checker later loads zz-fix.conf over this child, and Ze's
        # scheduled CREATE_CHILD_SA then succeeds on the same IKE SA.
        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes128gcm16
                mode = tunnel
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
