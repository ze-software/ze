# charon settings for this childless IKE SA scenario.
#
# One setting, about OBSERVATION rather than protocol: with no logger
# configured, charon 5.9.14 logs to stdout through stdio, which fully buffers
# stdout on a pipe, so `docker logs` shows only what the buffer has flushed
# (measured 2026-10-17 in the lab image: stderr empty, stdout carrying the
# log). The checker reads charon's log for the exchange it asserts and for
# the ABSENCE of "deleting IKE_SA ze[", and an absence read from a buffer
# proves nothing.
#
# Measured on 2026-10-10 in childless-ike-sa-ze-responder: charon's log ended at
# "IKE_SA ze[1] established" while `swanctl --list-sas` already showed the
# `wanted` Child SA INSTALLED, so neither the vici initiate of `wanted` nor its
# CREATE_CHILD_SA request was visible. `flush_line = yes` writes each line to
# the pipe when it is logged (eap-nak-method-negotiation measured the same).
#
# `default = 1` is charon's level when no logger is configured, written out
# because declaring a filelog replaces the built-in stdout logger.
charon {
    filelog {
        stderr {
            default = 1
            flush_line = yes
        }
    }
}
