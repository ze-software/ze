connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
        }

        # The IKE SA is ordinary AES GCM: RFC 7296 Section 5 forbids ENCR_NULL
        # there. Only the Child SA is integrity-only.
        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                # ESP is NULL encryption with HMAC-SHA2-256-128: integrity-only
                # ESP, which RFC 4303 Section 1 requires to be negotiable. charon
                # answers NO_PROPOSAL_CHOSEN to any other ESP proposal, so an
                # installed Child SA here was negotiated as ENCR_NULL.
                esp_proposals = null-sha256
                mode = tunnel
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
