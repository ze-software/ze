# The NULL checker reads charon's exact selected ESP proposal from docker logs.
# strongSwan 6.1.0 load_loggers (src/libcharon/daemon.c) opens its default
# stdout logger without line flushing. In the native guest run, the Child SA
# was installed while that log still stopped after IKE establishment.
# Use the childless-ike-sa-ze-initiator fixture's flushed stderr pattern so
# the checker observes the exchange, not a partially flushed stdout buffer.
# Keep charon's default level: this changes observation, not negotiation.
charon {
    filelog {
        stderr {
            default = 1
            flush_line = yes
        }
    }
}
