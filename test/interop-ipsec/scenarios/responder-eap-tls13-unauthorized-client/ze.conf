# THIS SCENARIO IS responder-eap-tls13 WITH ONE LINE CHANGED:
# allowed-identities requires "other-client.example.com" instead of
# "swan-eap-client". pki/server.pem (DNS:swan-eap-client) is valid, unrevoked,
# and issued by test-ca, so Ze's RFC 5216 Section 5.3 client identity
# authorization is the ONLY reason the exchange must fail with a fatal
# bad_certificate alert and zero XFRM SAs.
pki {
	ca test-ca {
		certificate "%%PKI_B64:ca.pem%%";
		crl "%%PKI_B64:ca-crl.pem%%";
	}
	certificate ze-server {
		certificate "%%PKI_B64:ze.pem%%";
		private {
			key "%%PKI_B64:ze-key.pem%%";
		}
	}
}
vpn {
	ipsec {
		ike-group IKE-EAP {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-EAP {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-EAP;
				esp-group ESP-EAP;
				connection-type respond;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				authentication {
					mode eap-tls;
					local-id "172.28.0.2";
					remote-id "swan-eap-client";
					certificate ze-server;
					ca-certificate test-ca;
					allowed-identities "other-client.example.com";
				}
			}
		}
	}
}
