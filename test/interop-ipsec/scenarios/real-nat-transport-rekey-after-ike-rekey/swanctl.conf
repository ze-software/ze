# strongSwan behind the lab NAT box rekeys the IKE SA, then the transport Child SA,
# with Ze answering both (respondIKERekey, then respondChildRekey on the successor).
# Before the fix the successor IKE SA carried no transport-mode flag and the Child SA
# rekey met TS_UNACCEPTABLE.
connections {
    ze {
        # strongSwan INITIATES from behind the translation. Its own stack holds
        # 172.28.0.3 and it dials 172.28.0.6, which the NAT box owns and maps to Ze.
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.6

        local {
            auth = psk
            id = 172.28.0.7
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                # RFC 7296 Section 2.23.1, client rules: the TSi address matches the
                # source address of the IKE SA and the TSr address its destination, so
                # charon proposes 172.28.0.3 and 172.28.0.6. Ze substitutes both before
                # its own policy lookup.
                local_ts = 172.28.0.3/32
                remote_ts = 172.28.0.6/32
                # Ze's esp-group runs `pfs enable`, so the CREATE_CHILD_SA rekey
                # carries a KE payload in the IKE SA's group. Without a group here
                # Ze refuses it with NO_PROPOSAL_CHOSEN; the IKE_AUTH Child SA
                # negotiates no key exchange and never shows the mismatch.
                esp_proposals = aes256gcm16-modp2048
                mode = transport
                start_action = start
                # The checker rekeys this Child SA by command, after an IKE SA rekey
                # (swanctl --rekey --ike, then --rekey --child), so no lifetime races it.
                rekey_time = 0
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
