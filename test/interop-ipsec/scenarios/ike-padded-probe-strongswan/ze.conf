# The padded IKE path probe against strongSwan (spec ike-padded-path-probe). The
# topology is mtu-tunnel-sizing-strongswan's: the NAT box floats IKE to 4500 and
# clamps the route it forwards over to 1400. Two things differ, both installed by the
# checker on the box. ICMP is exempted from the clamp by a policy route, so an echo
# crosses at 1500 and the ICMP search believes the path is 1500 where every UDP and
# ESP datagram is clamped at 1400; and every Fragmentation Needed the box would send
# Ze is dropped, so the clamp is invisible to ICMP. Only the padded INFORMATIONAL
# exchange on the SA's own UDP/4500 channel can find it: the DF copy at 1500 is
# refused in silence, the DF-clear retransmission crosses the box fragmented and
# strongSwan answers it (A-2, A-3), the size reads too big, and the descent settles
# on 1400 with `prober: ike`. The IKE SA is aes256gcm, so every size is reachable.
environment {
	mtu {
		reference-address 172.28.0.5;
	}
}
interface {
	xfrm xa {
		if-id 7;
		mtu 1500;
	}
}
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				mode tunnel;
				vti {
					bind xa;
				}
				local-address 172.28.0.2;
				remote-address 172.28.0.7;
				traffic-selector 1 {
					local {
						prefix 10.10.0.1/32;
					}
					remote {
						prefix 10.20.0.1/32;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.7";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
