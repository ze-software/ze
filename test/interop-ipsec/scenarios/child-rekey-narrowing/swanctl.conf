connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 10.1.0.0/24
                remote_ts = 10.2.0.0/24
                esp_proposals = aes256gcm16
                mode = tunnel
                # No timer rekey: check.py drives every state change, so a timer
                # firing mid-check cannot be mistaken for the policy change.
                rekey_time = 0
                life_time = 0
                # start_action is what makes charon act on a narrowed policy. It
                # terminates the SA the old policy built and initiates a new one
                # from the loaded config.
                start_action = start
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
