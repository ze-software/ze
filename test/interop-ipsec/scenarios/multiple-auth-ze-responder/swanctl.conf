# RFC 4739 multiple authentication, strongSwan as the initiator and Ze as the
# responder (connection-type respond, start_action = start below).
#
# Round 1 is X.509 both ways: strongSwan signs with server.pem (172.28.0.3), Ze
# with client.pem (ze-test-client). Round 2 is a pre-shared key both ways under
# identities of their own: strongSwan proves swan-user.example.com, which Ze
# checks in second-round remote, and Ze proves ze-user.example.com, which
# remote-2 checks.
#
# strongSwan's round 2 cannot reuse server.pem. charon counts a configured round
# as done when a round already completed complies with it (ike_auth.c
# do_another_auth), so a local-2 identical to local is never sent, and the lab
# holds no third key pair.
#
# Round 1 is NOT a pre-shared key on strongSwan's side, on purpose. charon's
# initiator runs the strict check of every configured remote round as soon as
# its current local round is a PSK (ike_auth.c require_strict returns TRUE for
# AUTH_CLASS_PSK), so with a PSK round 1 it refuses Ze's first response with
# "insufficient authentication rounds" before Ze's second round can come.
#
# multiple_authentication needs no setting: ike_auth.c multiple_auth_enabled()
# reads "%s.multiple_authentication" with the default TRUE.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # Both certificate rounds need server.pem on the wire, so it is sent
        # whether or not Ze asked with CERTREQ.
        send_cert = always

        local {
            auth = pubkey
            certs = server.pem
            id = 172.28.0.3
        }
        local-2 {
            auth = psk
            id = swan-user.example.com
        }
        remote {
            auth = pubkey
            id = ze-test-client
        }
        remote-2 {
            auth = psk
            # An FQDN, because Ze sends every non-address id as ID_FQDN
            # (encodeIKEID, internal/component/ike/engine/auth.go) and charon
            # would read "user@domain" as ID_RFC822_ADDR.
            id = ze-user.example.com
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = start
            }
        }
    }
}

# One round-2 secret serves both directions: proving Ze's AUTH and building
# strongSwan's own both look up the unordered pair (swan-user.example.com,
# ze-user.example.com) (mem_cred.c has_owner, shared_filter). Round 1 is X.509
# both ways, so no lookup of round 1 asks for a pre-shared key.
secrets {
    ike-round2 {
        id-ze = ze-user.example.com
        id-swan = swan-user.example.com
        secret = "interop-round-two-psk"
    }
}
