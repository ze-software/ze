# Observation, not stimulus. The checker reads charon's "authentication of
# '<id>' with pre-shared key successful" lines from docker logs, and strongSwan
# 6.1.0 load_loggers (src/libcharon/daemon.c) opens its default stdout logger
# without line flushing, so a line can still sit in the buffer when the Child
# SA is installed (esp-integrity-only-null/strongswan.conf measured it). The
# flushed stderr logger at charon's default level changes what the checker can
# see, not what the peers negotiate.
charon {
    filelog {
        stderr {
            default = 1
            flush_line = yes
        }
    }
}
