# RFC 4301 Section 4.4.1, an operator DISCARD entry beside a policy-based tunnel, in
# the default configuration: no `unmatched` leaf (it defaults to discard), no
# icmp-error-check leaf (it defaults to true), and the entry's own order, direction
# and protocol left at their defaults (1000, both, any). Order 1000 ranks the entry
# before the peer's default policy-priority of 2000, so the kernel consults it first.
#
# The tunnel carries 10.2.0.0/24 <-> 10.1.0.0/24. The entry discards 10.1.0.128/25,
# the upper half of strongSwan's side: traffic the Child SA would otherwise carry.
# The checker (checkSPDDiscardEntry, internal/le/interoplab/ipsec/spddiscard.go)
# pings both halves in both directions and requires the tunnel to stay up.
#
# Red proof: make spdPolicyHasDirection (internal/component/ike/engine/spd_policy.go)
# answer false for SADirOut and let the harness rebuild the Ze image; Ze installs no
# outbound half, its echo to 10.1.0.200 crosses the tunnel, and assertion 4 is red.
# Make it answer false for SADirIn instead; Ze's out BLOCK still drops the reply, so
# every echo is still lost, but XfrmInPolBlock stays still and assertion 5 is red.
vpn {
	ipsec {
		policy drop-swan-upper {
			action discard;
			local {
				prefix 10.2.0.0/24;
			}
			remote {
				prefix 10.1.0.128/25;
			}
		}
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs disable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				traffic-selector 1 {
					local {
						prefix 10.2.0.0/24;
					}
					remote {
						prefix 10.1.0.0/24;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.3";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
