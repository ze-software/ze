# The far end of the tunnel beside Ze's operator DISCARD entry. strongSwan knows
# nothing of the entry: its Child SA covers the whole of 10.1.0.0/24, so it carries
# 10.1.0.200 <-> 10.2.0.1 like any other pair of the selectors. strongSwan 6.1.0
# installs the Child SA's policies through child_create.c select_and_install, which
# calls child_sa install_policies, and kernel_netlink_ipsec.c add_policy_internal
# writes each one as XFRM_POLICY_ALLOW with the SA's template, so strongSwan's kernel
# encrypts every packet the selectors name. Only Ze's entry can drop the upper half.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 10.1.0.0/24
                remote_ts = 10.2.0.0/24
                esp_proposals = aes256gcm16
                mode = tunnel
                # No timer rekey: the checker requires the same Child SA throughout.
                rekey_time = 0
                life_time = 0
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
