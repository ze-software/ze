connections {
    ze {
        # Ze (172.28.0.2, seen at 172.28.0.6) initiates through the NAT box and
        # strongSwan responds. strongSwan, the responder of the original IKE SA,
        # reauthenticates it after reauth_time by creating a new IKE SA toward Ze
        # (RFC 7296 Section 2.8.3, ike_sa.c reauth), make-before-break by default in
        # strongSwan 6. rand_time = 0s pins the moment, so the checker's wait is
        # bounded.
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.6

        reauth_time = 60s
        rand_time = 0s

        local {
            auth = psk
            id = 172.28.0.7
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 10.20.0.1/32
                remote_ts = 10.10.0.1/32
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = none
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
