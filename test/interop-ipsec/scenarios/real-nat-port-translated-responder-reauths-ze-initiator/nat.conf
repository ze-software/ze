# Ze sits behind a NAT that changes its PORT as well as its address: its UDP 4500
# leaves the box from public port 14500 (the third column). strongSwan, the original
# responder, reauthenticates by creating a new IKE SA toward the address and port it
# knows Ze at, 172.28.0.6[14500] (ike_sa.c reestablish copies the old SA's
# other_host), so its IKE_SA_INIT reaches Ze only through the mapping the old SA's
# NAT-T traffic keeps open (spec-home-cpe-22 AC-14, assumption A-3).
#
# Ze's row has no DNAT: Ze initiates, and conntrack reverses everything strongSwan
# sends back, the reauth IKE_SA_INIT included. strongSwan's two-column row gives Ze
# an address to dial (172.28.0.7) that the box owns and answers by ARP, so Ze needs
# no route through the box and its first IKE_SA_INIT already crosses the NAT.
#
# <the address the peer's own stack holds>  <the address the other peer sees it at>  <public port of its UDP 4500>
172.28.0.2  172.28.0.6  14500
172.28.0.3  172.28.0.7
