# Ze INITIATES a tunnel-mode Child SA from behind a NAT that translates its UDP 4500
# to 172.28.0.6:14500, and the gateway (strongSwan) later reauthenticates. remote-address
# is the address Ze dials strongSwan at, which the NAT box owns. The selectors are
# INNER addresses the box never sees; the checker installs 10.10.0.1 on Ze and
# 10.20.0.1 on strongSwan before it pings across the tunnel.
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				mode tunnel;
				local-address 172.28.0.2;
				remote-address 172.28.0.7;
				traffic-selector 1 {
					local {
						prefix 10.10.0.1/32;
					}
					remote {
						prefix 10.20.0.1/32;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.7";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
