# The retry this scenario asserts on is logged at INFO ("ike: retrying IKE_SA_INIT",
# internal/component/ike/engine/sa_init_retry.go). A successful retry is normal
# operation, so INFO is the right level for it; the daemon default is WARN, which
# would keep the line off stderr and make the native log wait unsatisfiable.
environment {
	log {
		level info;
	}
}

vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			# Proposal 1 is the group Ze GUESSES on its first IKE_SA_INIT
			# (newInitiatorSA reads Proposals[0].DHGroup). strongSwan accepts only
			# ecp256, so it answers INVALID_KE_PAYLOAD naming group 19 and Ze must
			# retry under it. RFC 7296 Section 1.2.
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
			proposal 2 {
				encryption aes256gcm;
				hash sha256;
				dh-group 19;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.3";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
