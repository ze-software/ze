# RFC 4301 Section 4.4.3.1: "Alternatively, the name may encompass a group of peers by
# being partially specified, e.g., the string ".example.com" could be used to match any
# DNS name ending in these two domain name components." Ze initiates toward strongSwan
# with remote-id ".example.com", a PAD sub-tree entry. strongSwan first asserts the
# ID_FQDN vpn.example.com (swanctl.conf), under the sub-tree, and Ze must authenticate
# it; the checker then changes strongSwan's local id alone to vpn.notexample.com,
# outside the sub-tree though it ends in the same characters "example.com", and Ze
# must refuse it (checkPADSubtreeIdentity, internal/le/interoplab/ipsec/padsubtree.go).
#
# Ze sends no IDr as the initiator, so charon answers with its configured local id
# (ike_auth.c build_r, strongSwan 6.1.0).
#
# Red proof: make textIdentityMatches (internal/component/ike/engine/remote_id.go)
# answer true for a sub-tree whatever the asserted name, and let the harness rebuild the
# Ze image; Ze authenticates vpn.notexample.com, logs no refusal, and assertion 7 is
# red. Make it answer false for a sub-tree instead; Ze refuses vpn.example.com and
# assertion 1 is red.
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs disable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				traffic-selector 1 {
					local {
						prefix 10.2.0.0/24;
					}
					remote {
						prefix 10.1.0.0/24;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id ".example.com";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
