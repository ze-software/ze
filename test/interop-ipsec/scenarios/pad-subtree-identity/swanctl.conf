# The responder Ze's PAD sub-tree entry judges. `id = vpn.example.com` is an ID_FQDN:
# identification_create_from_string (strongSwan 6.1.0
# src/libstrongswan/utils/identification.c) reads a string with no '=', no '@' and no
# ':' that does not parse as an IPv4 address as ID_FQDN, and ike_auth.c build_r sends
# it as IDr because Ze, the initiator, sends none. The checker later loads a second
# file into conf.d that changes this id alone, to vpn.notexample.com.
#
# The secret names no owner, so vici_cred.c load_shared gives it the owner %any and it
# keys both identities (mem_cred.c shared_filter, has_owner).
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = vpn.example.com
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 10.1.0.0/24
                remote_ts = 10.2.0.0/24
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = none
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
