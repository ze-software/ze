# Ze ANSWERS a transport-mode Child SA from a peer whose NAT translates its port. No
# TunnelMigrator moves a transport-mode state, so after the rebind step Ze rekeys the
# Child SA onto the remapped port. The selectors name the addresses Ze sees: RFC 7296
# Section 2.23.1 substitutes the peer's 172.28.0.3 with the IKE SA's remote address.
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		# pfs disable: the rebind rekeys this Child SA, and strongSwan's esp_proposals
		# (aes256gcm16) carry no key exchange, so a rekey that offers MODP_2048 draws
		# NO_PROPOSAL_CHOSEN (measured 2026-10-21), as in every other rekey scenario.
		esp-group ESP-PSK {
			lifetime 3600;
			pfs disable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type respond;
				mode transport;
				local-address 172.28.0.2;
				remote-address 172.28.0.7;
				traffic-selector 1 {
					local {
						prefix 172.28.0.2/32;
					}
					remote {
						prefix 172.28.0.7/32;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.7";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
