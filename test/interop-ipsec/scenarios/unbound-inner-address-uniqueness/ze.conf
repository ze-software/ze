# Two respond peers, one per NAT-translated client source, bound to no virtual-IP pool
# and carrying no traffic-selector, so each client chooses its own inner selector. Both
# choose 10.1.2.3/32. RFC 3948 Section 5.1: "Because SGW will now see two possible SAs
# that lead to 10.1.2.3, it can become confused about where to send packets coming from
# Suzy's server. Implementors MUST devise ways of preventing this from occurring." Ze
# installs the first Child SA and refuses the second with TS_UNACCEPTABLE, keeping its
# IKE SA.
#
# 10.20.0.1 is Ze's inner address. The checker installs it on Ze's loopback.
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan-a {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type respond;
				mode tunnel;
				local-address 172.28.0.2;
				remote-address 172.28.0.7;
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.7";
					pre-shared-secret "interop-test-psk";
				}
			}
			peer swan-b {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type respond;
				mode tunnel;
				local-address 172.28.0.2;
				remote-address 172.28.0.9;
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.9";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
