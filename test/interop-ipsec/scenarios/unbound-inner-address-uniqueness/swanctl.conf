# Two clients in one charon, each its own connection from its own outer address, and
# neither asks for a virtual IP. Both propose the same inner address, 10.1.2.3, as their
# own selector: the two laptops of the RFC 3948 Section 5.1 figure. The checker
# initiates them one after the other.
#
# child-b asks for Ze's side as 10.20.0.0/24, not child-a's 10.20.0.1/32. The two
# tunnels then overlap without being one selector, so the dataplane's per-selector
# owner check (policyOwners.claim) cannot refuse the second: only the cross-peer
# inner-selector guard does, and with the guard reverted Ze installs two outbound
# policies to 10.1.2.3/32.
connections {
    ze-a {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.6

        local {
            auth = psk
            id = 172.28.0.7
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            child-a {
                local_ts = 10.1.2.3/32
                remote_ts = 10.20.0.1/32
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = none
            }
        }
    }
    ze-b {
        local_addrs = 172.28.0.8
        remote_addrs = 172.28.0.6

        local {
            auth = psk
            id = 172.28.0.9
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            child-b {
                local_ts = 10.1.2.3/32
                remote_ts = 10.20.0.0/24
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = none
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
