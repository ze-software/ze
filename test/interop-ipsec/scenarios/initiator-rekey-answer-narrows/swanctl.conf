connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 10.1.0.0/24
                remote_ts = 10.2.0.0/24
                esp_proposals = aes256gcm16
                mode = tunnel
                # Ze dials and Ze drives the rekey (30s ESP lifetime), so charon's own
                # timers are off: a charon-initiated rekey would race the one under test
                # and answer it from charon's stored child_cfg instead.
                rekey_time = 0
                life_time = 0
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
