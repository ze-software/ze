# THIS SCENARIO IS responder-eap-tls13 WITH THE CLIENT ONE LEVEL DEEPER.
# pki/server.pem, the client certificate charon presents, is issued by
# pki/sub-ca.pem, which ca.pem issued. charon holds only ca.pem in x509ca, so its
# certificate message carries the leaf ALONE, and Ze completes the path from the
# intermediate-certificate list (RFC 5216 Section 5.3). The intermediate's crl
# answers for the leaf on TLS 1.3 (RFC 9190 Section 5.4).
pki {
	ca test-ca {
		certificate "%%PKI_B64:ca.pem%%";
		crl "%%PKI_B64:ca-crl.pem%%";
	}
	ca test-sub-ca {
		certificate "%%PKI_B64:sub-ca.pem%%";
		crl "%%PKI_B64:sub-ca-crl.pem%%";
	}
	certificate ze-server {
		certificate "%%PKI_B64:ze.pem%%";
		private {
			key "%%PKI_B64:ze-key.pem%%";
		}
	}
}
vpn {
	ipsec {
		ike-group IKE-EAP {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-EAP {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		site-to-site {
			peer swan {
				ike-group IKE-EAP;
				esp-group ESP-EAP;
				connection-type respond;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				authentication {
					mode eap-tls;
					local-id "172.28.0.2";
					remote-id "swan-eap-client";
					certificate ze-server;
					ca-certificate test-ca;
					intermediate-certificate test-sub-ca;
				}
			}
		}
	}
}
