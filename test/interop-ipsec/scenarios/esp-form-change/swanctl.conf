connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # strongSwan is the INITIATOR; Ze (172.28.0.2) is the responder, as in 07.
        # strongSwan floats IKE to port 4500 after IKE_SA_INIT even though it finds
        # no NAT, because MOBIKE is on by default (ike_natd.c process_i). Ze reads
        # that float and gives its INBOUND state an ESP-in-UDP template, while
        # strongSwan keeps sending BARE ESP because COND_NAT_ANY stays false. The
        # two forms therefore disagree for the whole life of this Child SA, which
        # is the case this scenario exists to exercise.
        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = start

                # Ze drives no rekey here and strongSwan must not either: this
                # scenario asserts that the SA is NOT rekeyed, so a peer-initiated
                # rekey would turn a real assertion into a flaky one.
                rekey_time = 0
                life_time = 0
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
