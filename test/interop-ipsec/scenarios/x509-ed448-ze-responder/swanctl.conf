# RFC 8420 Ed448 IKE AUTH, strongSwan as the initiator and Ze as the responder
# (connection-type respond). The file names follow the lab PKI, not the IKE
# roles: Ze holds the lab P-256 leaf (pki/client.pem, ze-test-client).
#
# ze: strongSwan holds an Ed448 leaf (pki/server.pem, 172.28.0.3) issued by the
# lab P-256 CA Ze trusts, and starts at once. It can sign with that key only
# under method 14 with the Identity hash, so it signs only if Ze's IKE_SA_INIT
# response announced Identity (5), and the tunnel comes up only if Ze verified
# the chain and the Ed448 AUTH.
#
# untrusted: the same identity with an Ed448 leaf
# (pki/server-untrusted.pem) issued by untrusted-ca.example.net
# (pki/untrusted-ca.pem), a CA Ze does not hold. The checker initiates it after
# the trusted tunnel is up, and Ze must answer AUTHENTICATION_FAILED.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # The certificate goes out whether or not Ze sent CERTREQ, so the scenario
        # judges the AUTH signature and not Ze's CERTREQ policy.
        send_cert = always

        local {
            auth = pubkey
            certs = server.pem
            id = 172.28.0.3
        }
        remote {
            auth = pubkey
            id = ze-test-client
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = start
            }
        }
    }
    untrusted {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        send_cert = always

        local {
            auth = pubkey
            certs = server-untrusted.pem
            id = 172.28.0.3
        }
        remote {
            auth = pubkey
            id = ze-test-client
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            untrusted-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16
                mode = tunnel
            }
        }
    }
}
