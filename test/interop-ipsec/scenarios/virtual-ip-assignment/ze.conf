# Ze answers a strongSwan road-warrior client's CFG_REQUEST with a lease from a
# remote-access pool (RFC 7296 Section 2.19), over the multi-exchange EAP-MSCHAPv2
# IKE_AUTH. The peer is bound to pool "clients", so the lease replaces the client's
# proposed inner selector (RFC 3948 Section 5.1) and the Child SA Ze installs names
# that one address. The checker reads the lease from both ends, the installed policy,
# the DNS server the client installed, and traffic over the Child SA both ways.
#
# 10.20.0.1 is Ze's inner address. The checker installs it on Ze's loopback once the
# Child SA is up.
pki {
	ca test-ca {
		certificate "%%PKI_B64:ca.pem%%";
	}
	certificate ze-server {
		certificate "%%PKI_B64:server.pem%%";
		private {
			key "%%PKI_B64:server-key.pem%%";
		}
	}
}
vpn {
	ipsec {
		ike-group IKE-EAP {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-EAP {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		remote-access {
			ike-group IKE-EAP;
			esp-group ESP-EAP;
			authentication {
				mode eap-mschapv2;
			}
			pool clients {
				range 10.10.0.0/24;
				dns 10.10.0.53;
			}
		}
		site-to-site {
			peer swan {
				ike-group IKE-EAP;
				esp-group ESP-EAP;
				connection-type respond;
				virtual-ip-pool clients;
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				traffic-selector 1 {
					local {
						prefix 10.20.0.1/32;
					}
					remote {
						prefix 10.10.0.0/24;
					}
				}
				authentication {
					mode eap-mschapv2;
					local-id "172.28.0.3";
					remote-id "testuser";
					certificate ze-server;
					ca-certificate test-ca;
					pre-shared-secret "testpassword";
				}
			}
		}
	}
}
