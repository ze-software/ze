connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # A road-warrior client: vips = 0.0.0.0 sends a CFG_REQUEST asking for any
        # IPv4 address (RFC 7296 Section 2.19), and the child's local_ts stays at its
        # default, dynamic, which charon fills with the address it is given.
        vips = 0.0.0.0

        # strongSwan is the INITIATOR and the EAP-MSCHAPv2 CLIENT; Ze is the
        # responder and the EAP server, authenticating itself with its server
        # certificate (CN=172.28.0.3), the same credentials responder-eap-mschapv2
        # uses.
        local {
            auth = eap-mschapv2
            id = testuser
            eap_id = testuser
        }
        remote {
            auth = pubkey
            id = 172.28.0.3
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                remote_ts = 10.20.0.1/32
                esp_proposals = aes256gcm16
                mode = tunnel
                start_action = start
            }
        }
    }
}

secrets {
    eap-testuser {
        id = testuser
        secret = "testpassword"
    }
}
