# A route-based tunnel under `unmatched discard`: one Child SA on the xfrm interface
# vti0 (if_id 7) carrying 10.255.1.0/24 <-> 10.255.2.0/24 and fd00:db8:1::/64 <->
# fd00:db8:2::/64 over an IPv4 outer path. Ze holds two SPDs here: the node-wide one
# at if_id 0, whose final entry discards, and vti0's at if_id 7, which holds the
# Child SA policies and its own final DISCARD entry. RFC 4301 Section 4.4.1: "However,
# if an implementation supports multiple SPDs, then it MUST include an explicit SPD
# selection function that is invoked to select the appropriate SPD for outbound
# traffic processing." The if_id 0 entries on vti0's ifindex (and on its IPv6
# address) are that function. The routes for 10.255.9.0/24 and fd00:db8:9::/64 also
# lead into vti0, outside every selector, so vti0's own final entry must drop them.
interface {
	xfrm vti0 {
		if-id 7;
		unit 0 {
			ipv4 {
				address [ 10.255.1.1/32 ];
			}
			ipv6 {
				address [ fd00:db8:1::1/128 ];
			}
		}
	}
}
static {
	table default {
		route 10.255.2.0/24 {
			next { interface vti0 { } }
		}
		route fd00:db8:2::/64 {
			next { interface vti0 { } }
		}
		route 10.255.9.0/24 {
			next { interface vti0 { } }
		}
		route fd00:db8:9::/64 {
			next { interface vti0 { } }
		}
	}
}
vpn {
	ipsec {
		ike-group IKE-PSK {
			key-exchange ikev2;
			lifetime 28800;
			proposal 1 {
				encryption aes256gcm;
				hash sha256;
				dh-group 14;
			}
		}
		esp-group ESP-PSK {
			lifetime 3600;
			pfs enable;
			proposal 1 {
				encryption aes256gcm;
			}
		}
		interface eth0;
		# Written, not left to the default, so the commit names the choice. IKE and ESP
		# ride the control-plane bypass at order 100; nothing else crosses in the clear.
		unmatched discard;
		site-to-site {
			peer swan {
				ike-group IKE-PSK;
				esp-group ESP-PSK;
				connection-type initiate;
				mode tunnel;
				vti {
					bind vti0;
				}
				local-address 172.28.0.2;
				remote-address 172.28.0.3;
				traffic-selector 1 {
					local {
						prefix 10.255.1.0/24;
					}
					remote {
						prefix 10.255.2.0/24;
					}
				}
				traffic-selector 2 {
					local {
						prefix fd00:db8:1::/64;
					}
					remote {
						prefix fd00:db8:2::/64;
					}
				}
				authentication {
					mode pre-shared-secret;
					local-id "172.28.0.2";
					remote-id "172.28.0.3";
					pre-shared-secret "interop-test-psk";
				}
			}
		}
	}
}
