# The far end of Ze's route-based tunnel. Its child config names exactly the two
# selector pairs Ze proposes, so strongSwan 6.1.0 answers with them unchanged:
# traffic_selector_list.c select_ keeps each intersection get_subset returns, and an
# IPv4 and an IPv6 selector never intersect (RFC 7296 Section 2.9). strongSwan's own
# side is policy-based: charon installs policies at if_id 0 and decapsulates onto
# eth0, so the checker enables IPv6 there.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 10.255.2.0/24,fd00:db8:2::/64
                remote_ts = 10.255.1.0/24,fd00:db8:1::/64
                # MODP_2048 matches Ze's esp-group, which sets pfs enable.
                esp_proposals = aes256gcm16-modp2048
                mode = tunnel
                start_action = none
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
