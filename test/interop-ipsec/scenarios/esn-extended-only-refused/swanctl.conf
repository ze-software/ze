# strongSwan proposes Extended Sequence Numbers and nothing else. RFC 7296
# Section 3.3.2: "A proposal containing a single ESN transform with value '1' means
# that using normal (non-extended) sequence numbers is not acceptable."
#
# Ze installs a 32-bit sequence space in both dataplane backends, so it can key no
# such Child SA. RFC 7296 Section 2.7 leaves it one answer, NO_PROPOSAL_CHOSEN, and
# this scenario proves a real peer receives that answer rather than an acceptance it
# would key ESN against.
connections {
    ze {
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # strongSwan is the INITIATOR here; Ze (172.28.0.2) is the responder.
        # start_action = start makes charon dial the tunnel as soon as the config
        # loads, so Ze's responder path is exercised without manual --initiate.
        local {
            auth = psk
            id = 172.28.0.3
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256gcm16-esn
                mode = tunnel
                start_action = start
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
