connections {
    ze {
        # strongSwan INITIATES from behind the port translation. The checker routes
        # 172.28.0.2 through the NAT box and then initiates, so start_action is none.
        local_addrs = 172.28.0.3
        remote_addrs = 172.28.0.2

        # DPD is the authenticated message that carries the moved endpoint to Ze on a
        # quiet tunnel. No re-authentication and no rekey run during the rebind step,
        # so the SPI comparison sees only what the move did.
        dpd_delay = 5s
        reauth_time = 0s
        rekey_time = 0

        local {
            auth = psk
            id = 172.28.0.7
        }
        remote {
            auth = psk
            id = 172.28.0.2
        }

        proposals = aes256gcm16-sha256-modp2048

        children {
            ze-child {
                local_ts = 10.20.0.1/32
                remote_ts = 10.10.0.1/32
                esp_proposals = aes256gcm16
                mode = tunnel
                rekey_time = 0
                start_action = none
            }
        }
    }
}

secrets {
    ike-ze {
        secret = "interop-test-psk"
    }
}
