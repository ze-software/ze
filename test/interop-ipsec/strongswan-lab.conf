# charon settings that apply to EVERY strongSwan peer this lab starts.
#
# prepareScenario (internal/le/interoplab/ipsec/ipsec.go) mounts this file at
# /etc/strongswan.d/98-lab.conf for every scenario that has a swanctl.conf. A
# scenario's own strongswan.conf still lands at 99-interop.conf and composes with
# this one; nothing here is repeated there.
#
# ONE setting, and without it no scenario in this suite can observe protected
# traffic in both directions.
#
# charon loads bypass-lan by default, which installs a PASS shunt policy for every
# locally attached subnet. In this lab that subnet is 172.28.0.0/24, and it holds
# BOTH containers, so every packet between them takes the bypass instead of the
# Child SA.
#
# MEASURED on 2026-08-30 in psk-site-to-site: the bypass-lan shunt for
# 172.28.0.0/24 sits at priority 175423 while the Child SA policy for the
# negotiated 0.0.0.0/0 selector sits at priority 399999. The lower number wins, so
# every packet strongSwan sends to 172.28.0.2 leaves in the clear, Ze drops each
# one as XfrmInTmplMismatch, ping reports 100 percent loss, and strongSwan's
# OUTBOUND ESP SA stays at 0 packets. strongSwan therefore encrypted nothing
# toward Ze, and a defect confined to Ze's inbound decapsulation would have been
# invisible to the whole suite.
#
# The same reading, taken from the two natt-* scenarios, is why they carried a
# private copy of this setting until 2026-09-03: each asserts what Ze's kernel does
# with a DECAPSULATED packet, so the bypass had to go before either could observe
# anything. That setting lives here once now, for every peer, and the three
# per-scenario copies are deleted (`ai/rules/no-layering.md`).
charon {
    plugins {
        bypass-lan {
            load = no
        }
    }
}
