# charon settings that apply to EVERY strongSwan peer this lab starts.
#
# prepareScenario (internal/le/interoplab/ipsec/ipsec.go) mounts this file at
# /etc/strongswan.d/98-lab.conf for every scenario that has a swanctl.conf. A
# scenario's own strongswan.conf still lands at 99-interop.conf and composes with
# this one; nothing here is repeated there.
#
# TWO settings. Without the first no scenario in this suite can observe
# protected traffic in both directions; without the second no checker can rely on
# reading charon's log.
#
# 1. bypass-lan.
#
# charon loads bypass-lan by default, which installs a PASS shunt policy for every
# locally attached subnet. In this lab that subnet is 172.28.0.0/24, and it holds
# BOTH containers, so every packet between them takes the bypass instead of the
# Child SA.
#
# MEASURED on 2026-08-30 in psk-site-to-site: the bypass-lan shunt for
# 172.28.0.0/24 sits at priority 175423 while the Child SA policy for the
# negotiated 0.0.0.0/0 selector sits at priority 399999. The lower number wins, so
# every packet strongSwan sends to 172.28.0.2 leaves in the clear, Ze drops each
# one as XfrmInTmplMismatch, ping reports 100 percent loss, and strongSwan's
# OUTBOUND ESP SA stays at 0 packets. strongSwan therefore encrypted nothing
# toward Ze, and a defect confined to Ze's inbound decapsulation would have been
# invisible to the whole suite.
#
# The same reading, taken from the two natt-* scenarios, is why they carried a
# private copy of this setting until 2026-09-03: each asserts what Ze's kernel does
# with a DECAPSULATED packet, so the bypass had to go before either could observe
# anything. That setting lives here once now, for every peer, and the three
# per-scenario copies are deleted (`ai/rules/no-layering.md`).
#
# 2. A logger that reaches `docker logs` line by line. With no logger configured,
# strongSwan 6.1.0 load_loggers (src/libcharon/daemon.c) logs through a default
# file logger on stdout opened without line flushing, and musl's stdio fully
# buffers stdout on a pipe, so `docker logs` shows only what the buffer has
# flushed. A checker that waits for a charon line then waits on the buffer, not
# on the exchange: a short exchange leaves the line invisible for as long as
# charon stays quiet.
#
# MEASURED scenario by scenario, each time fixed by a private copy of this logger
# in that scenario's strongswan.conf (eap-nak-method-negotiation on 2026-09-01,
# childless-ike-sa-ze-responder on 2026-10-10, out-of-sa-request-notified-over-sa
# on 2026-10-20, esp-integrity-only-null in the native guest), and again in
# evidence-nightly run 41298258262 (2026-11-01): mtu-negotiated-transform, which
# had no copy, waited 90 s for "selected proposal: ESP:AES_GCM_16_128/" while
# charon's visible log stopped at "scheduling rekeying". The logger lives here
# once now, for every peer, and the private copies are deleted
# (`ai/rules/no-layering.md`).
#
# This filelog writes to stderr, which stdio leaves unbuffered, and
# `flush_line = yes` flushes each line as well. `default = 1` is charon's level
# when no logger is configured, written out because declaring a filelog replaces
# the built-in stdout logger. A scenario's own strongswan.conf (99-interop.conf)
# composes with this section: child-rekey-refused-keeps-the-sa adds its
# timestamps to this same `stderr` logger.
charon {
    plugins {
        bypass-lan {
            load = no
        }
    }
    filelog {
        stderr {
            default = 1
            flush_line = yes
        }
    }
}
