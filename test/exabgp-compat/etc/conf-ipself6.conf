# Ze's local address is deliberately not the peer's: `next-hop self` resolves to
# it, and RFC 4271 Section 5.1.3 forbids a speaker to advertise a route to a peer
# using an address of that peer as NEXT_HOP. With one address at both ends, ze
# withholds the route (originatedNextHopIsPeerOwn, forward_next_hop.go) and this
# fixture has nothing to assert. A host carries exactly one ::1, so the second
# address is real configuration: fd00::2 comes from `./le setup`
# (LOOPBACK_IPV6, scripts/le/devtools/system.py) and from the verify workflow in CI.
neighbor ::1 {
	router-id 127.0.0.2;
	local-address fd00::2;
	local-as 12345;
	peer-as 12345;

	family {
		ipv6 unicast;
	}

	static {
		route 2a04:6d80::1/128 next-hop self;
	}
}
