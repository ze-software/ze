process one-shot {
	run ./run/api-on-exit-v4-keep.run;
	encoder text;
	respawn false;
}

process marker {
	run ./run/api-on-exit-v4-keep-marker.run;
	encoder text;
}

neighbor 127.0.0.1 {
	router-id 1.2.3.4;
	local-address 127.0.0.1;
	local-as 1;
	peer-as 1;
	group-updates false;

	family {
		ipv4 unicast;
	}

	api {
		processes [ one-shot marker ];
	}
}
