neighbor 127.0.0.1 {
	router-id 1.2.3.4;
	local-address 127.0.0.1;
	local-as 1;
	peer-as 1;
	group-updates false;

	capability {
		add-path send/receive;
	}

	family {
		ipv4 unicast;
	}

	add-path {
