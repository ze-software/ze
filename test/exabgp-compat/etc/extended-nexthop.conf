neighbor 127.0.0.1 {
	router-id 127.0.0.2;
	local-address 127.0.0.1;
	local-as 12345;
	peer-as 12345;

	capability {
		nexthop true;
	}

	family {
		ipv4 unicast;
		ipv4 mpls-vpn;
		ipv6 unicast;
		ipv6 mpls-vpn;
	}

	nexthop {
		ipv4 unicast ipv6;
		ipv4 mpls-vpn ipv6;
		ipv6 unicast ipv4;
	}

	static {
		route 153.153.153.153 next-hop BAD:CAFE:BAD:CAFE:BAD:CAFE:BAD:CAFE;
		# RFC 2545 Section 3: the AFI 2 next-hop length "shall be set to 16,
		# when only a global address is present, or 32". RFC 8950 Section 1:
		# RFC 4798 "defines how the IPv4-mapped IPv6 address format ... can
		# be used for that purpose", so the IPv4 endpoint is written mapped.
		route DEAD:BEEF:DEAD:BEEF:DEAD:BEEF:DEAD:BEEF next-hop ::ffff:170.170.170.170;
	}
}
