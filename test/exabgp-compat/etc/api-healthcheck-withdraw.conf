# ze's copy differs from upstream's in ONE byte of topology, and the expected
# frames are unchanged by it.
#
# Upstream writes `neighbor 127.0.0.1` beside `local-address 127.0.0.1`, so the
# peer's address and the speaker's own address are the SAME address. `next-hop
# self` then resolves to the peer's own address, and RFC 4271 Section 5.1.3 says
# "A route originated by a BGP speaker SHALL NOT be advertised to a peer using
# an address of that peer as NEXT_HOP." ze withholds such a route
# (session_write.go, originatedNextHopIsPeerOwn); ExaBGP advertises it.
#
# The collision is an artefact of running both ends on the loopback, not the
# behaviour this case tests, which is that `next-hop self` resolves to the
# LOCAL address. Moving the peer to 127.0.0.2 separates the two addresses and
# leaves `self` equal to 127.0.0.1, so every expected frame in the .ci is byte
# for byte what it was.
process healthcheck {
	run ./run/api-healthcheck-withdraw.run;
	encoder json;
}

neighbor 127.0.0.2 {
	router-id 1.2.3.4;
	local-address 127.0.0.1;
	local-as 1;
	peer-as 1;
	group-updates false;

	family {
		ipv4 unicast;
	}

	capability {
		graceful-restart;
	}

	api {
		processes [ healthcheck ];
	}
}
