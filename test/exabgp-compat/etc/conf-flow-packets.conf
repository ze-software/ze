neighbor 127.0.0.1 {
	router-id 1.2.3.4;
	local-address 127.0.0.1;
	local-as 1;
	peer-as 1;
	group-updates false;

	family {
		ipv4 flow;
	}

	flow {
		route another-but-packets {
			match {
				source 10.0.1.0/24;
				destination-port =3128;
				protocol tcp;
			}
			then {
				rate-limit 1000 packets;
			}
		}
	}
}
