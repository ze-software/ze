# The route's next hop is deliberately not the peer's address: RFC 4271 Section
# 5.1.3 forbids a speaker to advertise a route to a peer using an address of that
# peer as NEXT_HOP, and ze withholds such a route (originatedNextHopIsPeerOwn,
# forward_next_hop.go). RFC 2545 Section 3 requires ONE common subnet:
# fd00::2/127 contains speaker/next-hop fd00::2 and recipient fd00::3.
# Explicit setup and CI assign fd00::2/128, fd00::3/127 and fe80::1/128
# to loopback, so the advertised link-local belongs to the next-hop owner.
neighbor fd00::3 {
	router-id 10.0.0.2;
	local-address fd00::2;
	local-link-local fe80::1;
	local-as 65533;
	peer-as 65533;
	hold-time 180;

	capability {
		link-local-nexthop enable;
	}

	family {
		ipv6 unicast;
	}

	static {
		route 2001:db8:1::1/128 next-hop fd00::2;
	}
}
