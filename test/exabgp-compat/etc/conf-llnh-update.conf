# The route's next hop is deliberately not the peer's address: RFC 4271 Section
# 5.1.3 forbids a speaker to advertise a route to a peer using an address of that
# peer as NEXT_HOP, and ze withholds such a route (originatedNextHopIsPeerOwn,
# forward_next_hop.go). Both halves of RFC 2545 Section 3 still hold, which is what
# this fixture exists to assert: the speaker shares a locally connected subnet with
# fd00::2 and with ::1 alike. fd00::2 comes from `make ze-setup` (LOOPBACK_IPV6,
# scripts/dev/dev-setup.py) and from the verify workflow in CI.
neighbor ::1 {
	router-id 10.0.0.2;
	local-address fd00::2;
	local-link-local fe80::1;
	local-as 65533;
	peer-as 65533;
	hold-time 180;

	capability {
		link-local-nexthop enable;
	}

	family {
		ipv6 unicast;
	}

	static {
		route 2001:db8:1::1/128 next-hop fd00::2;
	}
}
