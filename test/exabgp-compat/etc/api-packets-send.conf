process packets-text {
	run ./run/api-packets-send.run;
	encoder text;
	respawn false;
}

process packets-json {
	run ./run/api-packets-send.run;
	encoder json;
	respawn false;
}

neighbor 127.0.0.1 {
	router-id 1.2.3.4;
	local-address 127.0.0.1;
	local-as 1;
	peer-as 1;
	hold-time 180;
	group-updates false;

	capability {
		graceful-restart disable;
	}

	family {
		ipv4 unicast;
	}

	api {
		processes [ packets-text packets-json ];
		send {
			packets;
			open;
			keepalive;
			update;
			notification;
		}
	}
}
