process announce-ipv6-nexthop {
	run ./run/api-ipv4-nexthop-ipv6.run;
	encoder json;
}

neighbor 127.0.0.1 {
	router-id 1.2.3.4;
	local-address 127.0.0.1;
	local-as 1;
	peer-as 1;
	group-updates false;

	capability {
		nexthop true;
	}

	family {
		ipv4 unicast;
	}

	nexthop {
		ipv4 unicast ipv6;
	}

	api {
		processes [ announce-ipv6-nexthop ];
	}
}
