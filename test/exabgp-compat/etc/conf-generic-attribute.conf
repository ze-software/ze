neighbor 127.0.0.1 {
	router-id 10.0.0.10;
	local-address 127.0.0.1;
	local-as 65533;
	peer-as 65533;
	group-updates false;

	family {
		ipv4 unicast;
	}

	static {
		# this will cause the following to be created (we detect this is a known attribute)
		# route 100.100.100.100 next-hop 192.168.1.100 med 100;
		route 100.100.100.100 next-hop 192.168.1.100 attribute [0x04 0x80 0x00000064];

		# ExaBGP's file sent flags 0x60 and 0x70: Optional clear, which marks a
		# well-known attribute, on unknown code 0x99, with the Partial bit set.
		# RFC 4271 Section 4.3: "For well-known attributes and for optional
		# non-transitive attributes, the Partial bit MUST be set to 0." Ze refuses
		# those flags (textparse.CheckRawAttributeFlags), so the routes carry the
		# optional transitive partial form, 0xe0, and 0xf0 with Extended Length.

		# non transitive attribute, we will not even try to decode it
		route 101.101.101.101 next-hop 192.168.1.100 attribute [0x99 0xe0 0x00000064];

		# transitive attribute, we will decode it
		route 111.111.111.111 next-hop 192.168.1.100 attribute [0x99 0xf0 0x00000064];
	}
}

