# ze's copy moves the first neighbor to 127.0.0.2, and the expected frames are
# unchanged by it.
#
# Upstream writes `neighbor 127.0.0.1` beside `local-address 127.0.0.1` and then
# announces `next-hop 127.0.0.1`, so the route's next hop IS that peer's own
# address. RFC 4271 Section 5.1.3: "A route originated by a BGP speaker SHALL
# NOT be advertised to a peer using an address of that peer as NEXT_HOP." ze
# withholds such a route (session_write.go, originatedNextHopIsPeerOwn); ExaBGP
# advertises it.
#
# The collision is an artefact of running both ends on the loopback, not the
# behaviour this case tests, which is that two neighbors feed two different API
# processes. Moving the peer separates the two addresses and leaves the next hop
# at 127.0.0.1, so every `4003047F000001` in the .ci is byte for byte what it
# was. api-nexthop-self.conf and api-healthcheck-withdraw.conf carry the same
# note for the same reason.
process public {
    run ./run/api-multiple-public.run;
    encoder text;
}

process private {
    run ./run/api-multiple-private.run;
    encoder text;
}

template {
    neighbor public {
        local-as 1;
        peer-as 1;
    	group-updates false;

        family {
            ipv4 unicast;
        }

        api {
            processes [ public ];
        }
    }
    neighbor private {
        local-as 2;
        peer-as 2;
    	group-updates false;

        family {
            ipv4 unicast;
        }

        api {
            processes [ private ];
        }
    }
}

neighbor 127.0.0.2 {
    router-id 1.2.3.4;
    local-address 127.0.0.1;
    inherit public;
}

neighbor 192.168.0.1 {
    router-id 1.2.3.4;
    local-address 127.0.0.1;
    inherit private;
}
