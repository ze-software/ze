plugin {
	external private {
		run "ze-test interop-bgp exabgp-api api-multiple-private"
		encoder text
	}
	external public {
		run "ze-test interop-bgp exabgp-api api-multiple-public"
		encoder text
	}
}
bgp {
	group public {
		local-as 1
		peer-as 1
		group-updates disable

		family {
			ipv4/unicast
		}
		attach process public {
			send [ update ]
		}

		peer 127.0.0.1 {
			router-id 1.2.3.4
			local-address 127.0.0.1
		}
	}
	group private {
		local-as 2
		peer-as 2
		group-updates disable

		family {
			ipv4/unicast
		}
		attach process private {
			send [ update ]
		}

		peer 192.168.0.1 {
			router-id 1.2.3.4
			local-address 127.0.0.1
		}
	}
}
