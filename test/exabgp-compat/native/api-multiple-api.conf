bus {
	endpoint private {
		external {
			run "le test interop-bgp exabgp-api api-multiple-private";
		}
		encoding text;
		receive {
			from [ /bgp/group/private ];
		}
		send {
			to [ /bgp/group/private ];
		}
	}
	endpoint public {
		external {
			run "le test interop-bgp exabgp-api api-multiple-public";
		}
		encoding text;
		receive {
			from [ /bgp/group/public ];
		}
		send {
			to [ /bgp/group/public ];
		}
	}
}
bgp {
	group public {
		local-as 1
		peer-as 1
		group-updates disable

		family {
			ipv4/unicast
		}

		peer 127.0.0.1 {
			router-id 1.2.3.4
			local-address 127.0.0.1
		}
	}
	group private {
		local-as 2
		peer-as 2
		group-updates disable

		family {
			ipv4/unicast
		}

		peer 192.168.0.1 {
			router-id 1.2.3.4
			local-address 127.0.0.1
		}
	}
}
