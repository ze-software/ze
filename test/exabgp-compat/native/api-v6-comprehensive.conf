plugin {
	external api-v6-test {
		run "ze-test interop-bgp exabgp-api api-v6-comprehensive"
		encoder json
	}
}
bgp {
	group default {
		peer 127.0.0.1 {
			router-id 1.2.3.4
			local-address 127.0.0.1
			local-as 65000
			peer-as 65000
			group-updates disable

			family {
				ipv4/flow
				ipv4/unicast
				ipv6/unicast
			}
			attach process api-v6-test {
				send [ update ]
			}
		}
	}
}
