bus {
	endpoint expecting-a-keepalive {
		external {
			run "le test interop-bgp exabgp-api api-api.receive";
		}
		encoding json;
	}
	endpoint expecting-no-data {
		external {
			run "le test interop-bgp exabgp-api api-api.nothing";
		}
		encoding json;
	}
}
bgp {
	group controller {
		family {
			ipv4/nlri-mpls
			ipv4/unicast
		}

		peer 127.0.0.1 {
			router-id 127.0.0.123
			local-address 127.0.0.1
			local-as 65535
			peer-as 65535
			group-updates disable
		}
	}
}
