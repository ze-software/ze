bus {
	endpoint blocklist-10-0-0-2 {
		external {
			run "le test interop-bgp exabgp-api api-blocklist";
		}
		encoding text;
	}
	endpoint blocklist-10-0-0-3 {
		external {
			run "le test interop-bgp exabgp-api api-blocklist";
		}
		encoding text;
	}
}
bgp {
	group blocklist {
		router-id 10.0.0.17
		local-address 10.0.0.17
		local-as 64512
