plugin {
	external my-process {
		run "ze-test interop-bgp exabgp-api syslog"
		encoder json
	}
	external my-second-process {
		run "ze-test interop-bgp exabgp-api stderr"
		encoder json
	}
}
bgp {
	group test {

		peer peer3 {
			connection {
				remote {
					ip 10.0.0.3
				}
				local {
					ip 10.0.0.2
				}
			}
			session {
				asn {
					local 65533
					remote 65533
				}
				router-id 10.0.0.2
			}
			description "will pass received routes to the program"
			timer {
				receive-hold-time 180
			}
		}
	}
}
