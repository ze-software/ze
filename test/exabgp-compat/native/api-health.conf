plugin {
	external health-test {
		run ./run/api-health.run
		encoder text
	}
}
bgp {
	group controller {
		family {
			ipv4/unicast
		}
		attach process health-test {
			send [ update ]
		}

		peer 127.0.0.1 {
			router-id 127.0.0.1
			local-address 127.0.0.1
			local-as 65535
			peer-as 65535
			group-updates disable
		}
	}
}
