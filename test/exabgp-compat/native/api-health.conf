bus {
	endpoint health-test {
		external {
			run "le test interop-bgp exabgp-api api-health";
		}
		encoding text;
	}
}
bgp {
	group controller {
		family {
			ipv4/unicast
		}

		peer 127.0.0.1 {
			router-id 127.0.0.1
			local-address 127.0.0.1
			local-as 65535
			peer-as 65535
			group-updates disable
		}
	}
}
