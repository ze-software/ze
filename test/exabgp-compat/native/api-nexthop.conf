plugin {
	external announce-routes {
		run "ze-test interop-bgp exabgp-api api-nexthop"
		encoder json
	}
}
bgp {
	group default {
		peer 127.0.0.1 {
			router-id 10.0.0.139
			local-address 127.0.0.1
			local-as 65512
			peer-as 65512
			receive-hold-time 30

			family {
				ipv6/unicast
			}
			attach process announce-routes {
				send [ update ]
			}
		}
	}
}
