plugin {
	external service-nginx {
		run "ze-test interop-bgp exabgp-api healthcheck"
		encoder text
	}
}
bgp {
	group default {
		peer 10.0.0.3 {
			description "will announce a route to a service"
			router-id 198.111.227.39
			local-address 10.0.0.2
			local-as 65533
			peer-as 65533
			attach process service-nginx {
				send [ update ]
			}
		}
	}
}
