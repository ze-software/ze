plugin {
	external one-shot {
		run "ze-test interop-bgp exabgp-api api-no-respawn-1"
		encoder json
		respawn disable
	}
	external respawn {
		run "ze-test interop-bgp exabgp-api api-no-respawn-2"
		encoder json
	}
}
bgp {
	group default {
		peer 127.0.0.1 {
			router-id 1.2.3.4
			local-address 127.0.0.1
			local-as 1
			peer-as 1
			group-updates disable

			family {
				ipv4/unicast
			}
			capability {
				graceful-restart
			}
			attach process one-shot {
				send [ update ]
			}
			attach process respawn {
				send [ update ]
			}
		}
	}
}
