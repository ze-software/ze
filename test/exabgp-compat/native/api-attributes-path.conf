plugin {
	external announce-routes {
		run "ze-test interop-bgp exabgp-api api-attributes-path"
		encoder text
	}
}
bgp {
	group default {
		peer 127.0.0.1 {
			router-id 1.2.3.4
			local-address 127.0.0.1
			local-as 300
			peer-as 300

			family {
				ipv4/unicast
				ipv6/unicast
			}
			capability {
				route-refresh
				add-path send/receive
			}
			attach process announce-routes {
				receive {
					state
				}
			}
		}
	}
}
