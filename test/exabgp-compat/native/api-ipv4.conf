plugin {
	external announce-routes {
		run "ze-test interop-bgp exabgp-api api-ipv4"
		encoder json
	}
}
bgp {
	group default {
		peer 127.0.0.1 {
			router-id 10.0.0.1
			local-address 127.0.0.1
			local-as 65000
			peer-as 65000
			group-updates disable

			family {
				ipv4/mup
				ipv4/unicast
			}
			capability {
				graceful-restart
			}
			attach process announce-routes {
				send [ update ]
			}
		}
	}
}
