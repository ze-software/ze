plugin {
	external ack-control {
		run "ze-test interop-bgp exabgp-api api-ack-control"
		encoder text
	}
}
bgp {
	group default {
		peer 127.0.0.1 {
			router-id 1.2.3.4
			local-address 127.0.0.1
			local-as 1
			peer-as 1
			group-updates disable

			family {
				ipv4/unicast
			}
			capability {
				graceful-restart
			}
			attach process ack-control {
				send [ update ]
			}
		}
	}
}
