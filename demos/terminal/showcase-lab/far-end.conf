interface {
    xfrm vpn-xfrm {
        if-id 42
        mtu 1400
    }
}

static {
    table default {
        route 10.78.1.0/24 {
            next {
                interface vpn-xfrm {}
            }
        }
    }
}

vpn {
    ipsec {
        # Other lab traffic and management must remain reachable.
        unmatched bypass
        ike-group ike-default {
            key-exchange ikev2
            lifetime 28800
            proposal 1 {
                encryption aes256
                hash sha256
                dh-group 14
            }
        }
        esp-group esp-default {
            lifetime 3600
            proposal 1 {
                encryption aes256
                hash sha256
            }
        }
        site-to-site {
            peer initiator {
                connection-type respond
                mode tunnel
                local-address 172.30.0.2
                remote-address 172.30.0.1
                ike-group ike-default
                esp-group esp-default
                vti {
                    bind vpn-xfrm
                }
                traffic-selector 1 {
                    local {
                        prefix 10.78.2.0/24
                    }
                    remote {
                        prefix 10.78.1.0/24
                    }
                }
                authentication {
                    mode pre-shared-secret
                    local-id 172.30.0.2
                    remote-id 172.30.0.1
                    pre-shared-secret showcase-lab-key
                }
            }
        }
    }
}
