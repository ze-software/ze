system {
    host edge-original
}

environment {
    ssh {
        enabled enable
        server main {
            ip 127.0.0.1
            port 2222
        }
    }
}

telemetry {
    prometheus {
        enabled true
        server main {
            ip 127.0.0.1
            port 9273
        }
    }
}

# Base plumbing only. Protocol sections are loaded in the running SSH editor.
interface {
    backend netlink
    ethernet frr0 {
        unit 0 { ipv4 { address [ 172.29.0.1/24 ] } }
    }
    ethernet vpn0 {
        unit 0 { ipv4 { address [ 172.30.0.1/30 ] } }
    }
    ethernet vpn-lan {
        unit 0 { ipv4 { address [ 10.78.1.1/24 ] } }
    }
    ethernet zeptrk0 {
        unit 0 { ipv4 { address [ 203.0.113.251/24 ] } }
    }
    ethernet traffic0 {
        unit 0 { ipv4 { address [ 10.77.0.1/24 ] } }
    }
    dummy zetrk1 {}
}

plugin {
    internal bgp-rib {
        use bgp-rib
    }
    internal bgp-adj-rib-in {
        use bgp-adj-rib-in
    }
}

bgp {
    router-id 192.0.2.1
    session {
        asn {
            local 65000
        }
    }
    peer transit {
        connection {
            remote {
                ip 127.0.0.2
                port 1179
            }
            local {
                ip 127.0.0.1
            }
        }
        session {
            asn {
                local 65000
                remote 65001
            }
            capability {
                route-refresh enable
            }
            family {
                ipv4/unicast {
                    prefix {
                        maximum 100
                    }
                }
            }
        }
        attach process bgp-adj-rib-in {
            receive [ update-received state ]
            send [ update ]
        }
        attach process bgp-rib {
            receive [ update state refresh ]
            send [ update ]
        }
    }
    peer customer {
        connection {
            remote {
                ip 127.0.0.4
                port 1179
            }
            local {
                ip 127.0.0.1
            }
        }
        session {
            asn {
                local 65000
                remote 65001
            }
            family {
                ipv4/unicast {
                    prefix {
                        maximum 100
                    }
                }
            }
        }
        attach process bgp-adj-rib-in {
            receive [ update-received state ]
            send [ update ]
        }
    }
    peer frr {
        connection {
            remote {
                ip 172.29.0.2
            }
            local {
                ip 172.29.0.1
                accept false
            }
        }
        session {
            asn {
                local 65000
                remote 65002
            }
            family {
                ipv4/unicast {
                    prefix {
                        maximum 100
                    }
                }
            }
        }
        attach process bgp-adj-rib-in {
            receive [ update-received state ]
            send [ update ]
        }
    }
}
