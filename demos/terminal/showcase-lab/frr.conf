frr defaults traditional
hostname frr-lab
service integrated-vtysh-config
!
interface eth0
!
router bgp 65002
 bgp router-id 172.29.0.2
 no bgp ebgp-requires-policy
 neighbor 172.29.0.1 remote-as 65000
 neighbor 172.29.0.1 bfd profile fast
 address-family ipv4 unicast
  network 10.255.1.2/32
 exit-address-family
!
router ospf
 ospf router-id 172.29.0.2
 network 172.29.0.0/24 area 0.0.0.0
 redistribute connected
!
bfd
 profile fast
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 !
!
