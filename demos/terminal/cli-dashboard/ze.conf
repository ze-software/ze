environment {
    ssh {
        enabled enable
        server main {
            ip 127.0.0.1
            port 2222
        }
    }
}

bgp {
    router-id 192.0.2.1
    session {
        asn {
            local 65000
        }
    }

    peer edge-a {
        connection {
            remote {
                ip 127.0.0.2
                port 1179
            }
            local {
                ip 127.0.0.1
            }
        }
        session {
            asn {
                local 65000
                remote 65001
            }
            family {
                ipv4/unicast {
                    prefix {
                        maximum 1000
                    }
                }
            }
        }
    }

    peer edge-b {
        connection {
            remote {
                ip 127.0.0.3
                port 1179
            }
            local {
                ip 127.0.0.1
            }
        }
        session {
            asn {
                local 65000
                remote 65002
            }
            family {
                ipv4/unicast {
                    prefix {
                        maximum 1000
                    }
                }
            }
        }
    }

    peer transit-c {
        connection {
            remote {
                ip 127.0.0.4
                port 1179
            }
            local {
                ip 127.0.0.1
            }
        }
        session {
            asn {
                local 65000
                remote 64496
            }
            family {
                ipv4/unicast {
                    prefix {
                        maximum 1000
                    }
                }
            }
        }
    }
}
