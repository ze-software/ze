vpn {
    ipsec {
        site-to-site {
            peer responder {
                connection-type initiate
                mode tunnel
                local-address 172.30.0.1
                remote-address 172.30.0.2
                ike-group ike-default
                esp-group esp-default
                vti {
                    bind vpn-xfrm
                }
                traffic-selector 1 {
                    local {
                        prefix 10.78.1.0/24
                    }
                    remote {
                        prefix 10.78.2.0/24
                    }
                }
                authentication {
                    mode pre-shared-secret
                    local-id 172.30.0.1
                    remote-id 172.30.0.2
                    pre-shared-secret showcase-lab-key
                }
            }
        }
    }
}
