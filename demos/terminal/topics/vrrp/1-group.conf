interface {
    ethernet zeptrk0 {
        unit 0 {
            ipv4 {
                vrrp {
                    group uplink {
                        vrid 12
                        virtual-address [ 203.0.113.1 ]
                        version 3
                        checksum rfc5798-compatible
                        priority 200
                        preempt true
                        accept-mode true
                        advertise-interval-milliseconds 1000
                    }
                }
            }
        }
    }
}
