system {
    host edge-router
}

bgp {
    # RFC 8212 Section 3: an EBGP direction with no explicit policy passes
    # no routes, so this config states that its sessions exchange them all.
    filter {
        import { final accept; }
        export { final accept; }
    }
    router-id 10.0.0.1
    session { asn { local 65000; } }
    group transit {
        session { asn { remote 64500; } }
        peer upstream-a {
            connection {
                remote { ip 192.0.2.1; }
                local { ip 192.0.2.2; }
            }
        }
        peer upstream-b {
            connection {
                remote { ip 198.51.100.1; }
                local { ip 198.51.100.2; }
            }
        }
    }
}
