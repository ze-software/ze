# The injected route names 127.0.0.1 as its next hop. A route whose next hop
# does not resolve is left out of best-path selection (RFC 4271 Section 9.1.2),
# so the lab publishes its connected subnets for the next hop to resolve in.
connected {
}

environment {
    ssh {
        enabled enable
        server main {
            ip 127.0.0.1
            port 2222
        }
    }
}

bus {
    endpoint bgp-rib {
        internal bgp-rib
    }
    endpoint rib {
        internal rib
    }
    endpoint fib-kernel {
        internal fib-kernel
    }
    endpoint sysctl {
        internal sysctl
    }
}

bgp {
    # RFC 8212 Section 3: an EBGP direction with no explicit policy passes
    # no routes, so this config states that its sessions exchange them all.
    filter {
        import { final accept; }
        export { final accept; }
    }
    router-id 192.0.2.1
    session {
        asn {
            local 65000
        }
    }
    peer synthetic {
        connection {
            remote {
                ip 192.0.2.10
            }
            local {
                ip 127.0.0.1
                accept false
            }
        }
        session {
            asn {
                local 65000
                remote 65001
            }
            family {
                ipv4/unicast {
                    prefix {
                        maximum 100
                    }
                }
            }
        }
    }
}
