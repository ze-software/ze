services:
  ze:
    image: ze:local
    hostname: ze
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # init, config import, and the daemon all use this one persistent store.
    command: ["start"]
    environment:
      ZE_CONFIG_DIR: /etc/ze
    ports:
      - "179:179"
      - "127.0.0.1:2222:2222"
    volumes:
      - ze-data:/etc/ze
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped

volumes:
  ze-data:
