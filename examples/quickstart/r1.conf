# Local evaluation only: the lab user/password is lab/lab. SSH binds loopback.
# iBGP uses synthetic unicast next hops for route inspection, not forwarding.
environment {
    ssh {
        enabled true
        server main {
            ip 127.0.0.1
            port 2221
        }
    }
}

system {
    authentication {
        user lab {
            plaintext-password lab
        }
    }
}

plugin {
    internal bgp-rib {
        use bgp-rib
    }
}

bgp {
    filter {
        import { final accept; }
        export { final accept; }
    }
    peer r2 {
        connection {
            local {
                ip 127.0.0.1
                port 1179
                accept false
            }
            remote {
                ip 127.0.0.2
                port 2179
            }
        }
        session {
            router-id 192.0.2.1
            asn { local 65001; remote 65001; }
            family {
                ipv4/unicast { prefix { maximum 100; } }
            }
        }
        attach process bgp-rib {
            receive [ update-received state refresh ]
            send [ update ]
        }
        update {
            attribute {
                origin igp
                next-hop 192.0.2.1
            }
            nlri {
                ipv4/unicast add 192.0.2.0/24
            }
        }
    }
}
