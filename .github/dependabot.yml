# Dependabot version-update configuration.
#
# NOTE: this file governs update PRs only. GitHub's security-alert *scanning* is
# always-on and cannot be suppressed here. In particular, alerts on the vendored
# gokrazy init manifest under gokrazy/modcache/ are handled by bumping the pin per
# ai/rules/platform-linux.md, NOT by this config.
#
# Scoped to the root module (the ze codebase). The gokrazy builddir modules under
# gokrazy/ze/builddir/ are hand-pinned for the appliance and are deliberately NOT
# managed here (a Dependabot PR against them would fight the pin); bump them via the
# runbook above.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Indirect modules too: without this, an indirect module moves only when a
    # direct one drags it, and lands on that module's floor rather than the
    # latest release (go-runewidth sat at v0.0.27 with an eager 50 ms init
    # while v0.0.28 had made it lazy).
    allow:
      - dependency-type: all
    # golang.org/x/crypto/x509roots/fallback is a module of its own nested
    # inside the x/crypto repository, and Dependabot resolves it as part of
    # golang.org/x/crypto, so the whole update run failed on it. It is bumped by
    # hand with `go get golang.org/x/crypto/x509roots/fallback@latest`.
    #
    # gobwas/glob v1 removed the glob.Glob type that linters vendored by
    # golangci-lint still use (protogetter, misspell, wrapcheck), and Go keeps
    # one version per build, so glob v1 breaks the golangci-lint build. depguard
    # v2.3.0 is what requires glob v1. Both stay at golangci-lint's own pins
    # (depguard v2.2.1, glob v0.2.3) until golangci-lint itself moves to glob v1.
    ignore:
      - dependency-name: golang.org/x/crypto/x509roots/fallback
      - dependency-name: github.com/gobwas/glob
        versions: [">= 1.0.0"]
      - dependency-name: github.com/OpenPeeDeeP/depguard/v2
        versions: [">= 2.3.0"]
    groups:
      go-modules:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
