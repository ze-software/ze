name: verify

# The fast merge gate. The native verifier owns the ordered stage population;
# this workflow only applies the round-robin shard rule. A new verifier action
# therefore reaches CI without a second stage catalog here.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # A red shard must not cancel siblings whose stages have not run yet.
      fail-fast: false
      # This count is also the number of pieces the Staticcheck feature matrix
      # is cut into (staticcheckParts, internal/le/verify/engine/stages.go), so
      # each of its pieces runs on a shard of its own. Change one and
      # TestEachShardRunsOnePieceOfTheStaticcheckMatrix reports the other.
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ strategy.job-total }}
    steps:
      # Every shard is interchangeable. The full clone is required by repository
      # history checks, and any action can land on any shard.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A site build seeds itself from the last published artifact, the
      # gh-pages tree beside the main checkout (internal/le/site lastPublished),
      # and the recorded terminal demos live nowhere else: a render needs the
      # recorder image, which this repository builds locally and publishes to
      # no registry. TestBuildRendersEveryPublishedRoute builds the real
      # checkout the way a publish does, so it needs that tree. An export, not
      # a clone: no second repository, and the full clone above stays unshallow.
      - name: Lay the published site down beside the checkout
        run: |
          git fetch --no-tags origin gh-pages
          mkdir ../gh-pages
          git archive FETCH_HEAD | tar -x -C ../gh-pages

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl git iproute2 iptables nftables util-linux

      # Ubuntu 24.04 lets AppArmor restrict unprivileged user namespaces, so
      # every unit test that builds its own network namespace (bfd, bfd/engine,
      # bfd/transport, ike/engine, ospf, internal/test/userns) fails with
      # "lo up: operation not permitted". Owner decision, 2026-10-17: allow them.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # The l2tp kernel capability (internal/component/l2tp/kernelcap_linux.go)
      # probes the l2tp generic netlink family (CONFIG_L2TP: l2tp_core,
      # l2tp_netlink) and the PPPoL2TP socket (CONFIG_PPPOL2TP: pppox, l2tp_ppp).
      # The hosted kernel ships them as modules it has not loaded, and without
      # them every L2TP functional group and the RADIUS late-bind unit test are
      # refused. A module the image lacks stops the job here, by name.
      - name: Load the L2TP and PPPoL2TP kernel modules
        run: |
          for module in l2tp_core l2tp_netlink pppox l2tp_ppp; do
            if ! sudo modprobe "$module"; then
              echo "::error::kernel module $module is missing from this runner's kernel $(uname -r), so ze's l2tp capability (CONFIG_L2TP and CONFIG_PPPOL2TP) cannot be met and every L2TP test would be refused. Fix: install linux-modules-extra-$(uname -r) in the system packages step of .github/workflows/verify.yml." >&2
              exit 1
            fi
          done

      # RFC2545's positive fixture needs ONE prefix for speaker/next-hop ::2 and
      # peer ::3, plus an assigned link-local belonging to the next-hop owner.
      # Provision explicitly before all shards; test runners never alter the host.
      - name: Add the loopback addresses and common subnet the functional suite needs
        run: |
          sudo ip -6 addr add fd00::2/128 dev lo
          sudo ip -6 addr add fd00::3/127 dev lo
          sudo ip -6 addr add fe80::1/128 dev lo

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      # golangci-lint and staticcheck build from vendor/, so the release CI runs
      # is the one go.mod requires and cannot drift from it. A pinned @version
      # here drifted once: v2.13.1 against go.mod's v2.14.0 cannot read Go 1.27
      # export data and reported every package as a typecheck failure.
      - name: Install Go verification tools
        run: |
          CGO_ENABLED=0 go install -mod=vendor github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          CGO_ENABLED=0 go install -mod=vendor honnef.co/go/tools/cmd/staticcheck
          CGO_ENABLED=0 go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # functional/exabgp-test runs the compatibility suite through
      # `uv run --with paramiko`, so a runner without uv answers 127 before the
      # first case. The installer is the route uv documents; it writes to
      # ~/.local/bin, which is not on the runner's PATH by default.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Browser fixtures fail rather than skip when this dependency is absent.
      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps

      - name: Run this shard's native verify actions
        env:
          # Native verification exports this for every action. The functional
          # runner uses it to turn an environment skip into a hard failure.
          ZE_VERIFY_MODE: "1"
          STAGE_LIST: ${{ runner.temp }}/verify-stages.txt
          SHARD_LIST: ${{ runner.temp }}/verify-shard-stages.txt
        run: |
          set -uo pipefail
          ./le verify list mode full | tee "$STAGE_LIST" || exit $?
          test -s "$STAGE_LIST" || exit 1
          awk -v i="$SHARD_INDEX" -v n="$SHARD_TOTAL" 'NR % n == i % n' "$STAGE_LIST" > "$SHARD_LIST"
          test -s "$SHARD_LIST" || exit 1

          # Keep running after a red action so the shard reports every failure.
          status=0
          while IFS=/ read -r -a action; do
            printf '==> ./le'
            printf ' %q' "${action[@]}"
            printf '\n'
            ./le "${action[@]}" || status=$?
          done < "$SHARD_LIST"
          exit "$status"
