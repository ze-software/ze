name: verify

# The fast merge gate: `make ze-precommit-verify` (unit + functional + static gates) on
# every push and pull request. Ported from .woodpecker/verify.yml when the
# validation moved off Codeberg's shared Woodpecker runners onto GitHub Actions
# (the repo is pushed to both codeberg.org and github.com/ze-software/ze; GitHub
# is where CI now runs).
#
# The stage list is NOT reproduced here: it lives in `stagesForMode`
# (scripts/status/verify_run.go) and nowhere else, and this workflow runs nothing
# but `make ze-precommit-verify`, so a gate absent from that function runs nowhere. To read
# the live list: `make ze-precommit-verify-list`. See docs/functional-tests.md.
#
# scripts/dev/github_workflows_test.go pins this workflow's shape (push +
# pull_request, runs ze-precommit-verify, never a heavy/scheduled suite).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not a convenience. actions/checkout
      # defaults to a shallow clone, and `collect_adoption`
      # (scripts/dev/testing_health.py) answers UNKNOWN in one on purpose:
      # git attributes every file to the graft commit, so package age -- the
      # whole point of the metric -- cannot be derived. `do_check` compares
      # every metric status, so the committed `ok` never matched CI's
      # `unknown` and ze-generated-files-check was red on EVERY run, with a
      # diagnostic ("regenerate and commit") that could not fix it: regenerating
      # in a full clone reproduces the `ok` already committed.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl git iproute2 iptables nftables \
            python3 python3-venv util-linux

      # A BGP session needs a different address at each end: RFC 4271 Section
      # 5.1.3 forbids a peer its own address as NEXT_HOP, and ze withholds such a
      # route (originatedNextHopIsPeerOwn, internal/component/bgp/reactor/
      # forward_next_hop.go). IPv4 fixtures spend 127.0.0.0/8, which Linux routes
      # to lo already. IPv6 gives a host exactly ::1, so the second address is
      # real configuration, and adding it needs CAP_NET_ADMIN -- which the bare
      # `make ze-precommit-verify` below does not have. fd00::/8 is unique-local (RFC
      # 4193), never globally routable, so a fixture cannot leak a packet onto a
      # real network. Same address, same reason, on a developer machine:
      # `make ze-dev-setup` (scripts/dev/dev-setup.py, loopback_addresses).
      #
      # This runs after the apt step because `ip` comes from iproute2 there.
      - name: Add the loopback address the functional suite binds
        run: sudo ip -6 addr add fd00::2/128 dev lo

      # Node comes from setup-node, NOT apt: the runner's own Node gives npm a
      # user-writable global prefix, so `npm install -g` below works without sudo.
      # apt's `nodejs npm` land a root-owned /usr prefix and would EACCES a bare
      # `npm install -g` -- and agent-browser is load-bearing (the .wb web suite
      # hard-fails without it, failing all of ze-precommit-verify).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Go verification tools
        run: |
          CGO_ENABLED=0 go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
          CGO_ENABLED=0 go install honnef.co/go/tools/cmd/staticcheck@2026.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Web suite (.wb tests) requires agent-browser; without it the suite fails
      # hard under the verify gate instead of silently skipping.
      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps

      - name: make ze-precommit-verify
        run: make ze-precommit-verify
