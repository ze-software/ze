name: verify

# The fast merge gate. The native verifier owns the ordered stage population;
# this workflow only applies the round-robin shard rule. A new verifier action
# therefore reaches CI without a second stage catalog here.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # A red shard must not cancel siblings whose stages have not run yet.
      fail-fast: false
      # This count is also the number of pieces the Staticcheck feature matrix
      # is cut into (staticcheckParts, internal/le/verify/engine/stages.go), so
      # each of its pieces runs on a shard of its own. Change one and
      # TestEachShardRunsOnePieceOfTheStaticcheckMatrix reports the other.
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ strategy.job-total }}
    steps:
      # Every shard is interchangeable. The full clone is required by repository
      # history checks, and any action can land on any shard.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl git iproute2 iptables nftables util-linux

      # IPv6 fixtures need a peer address distinct from ::1. This step needs the
      # runner's administrative privilege and must precede every possible shard.
      - name: Add the loopback address the functional suite binds
        run: sudo ip -6 addr add fd00::2/128 dev lo

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install Go verification tools
        run: |
          CGO_ENABLED=0 go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          CGO_ENABLED=0 go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          CGO_ENABLED=0 go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # functional/exabgp-test runs the compatibility suite through
      # `uv run --with paramiko`, so a runner without uv answers 127 before the
      # first case. The installer is the route uv documents; it writes to
      # ~/.local/bin, which is not on the runner's PATH by default.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Browser fixtures fail rather than skip when this dependency is absent.
      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps

      - name: Run this shard's native verify actions
        env:
          # Native verification exports this for every action. The functional
          # runner uses it to turn an environment skip into a hard failure.
          ZE_VERIFY_MODE: "1"
          STAGE_LIST: ${{ runner.temp }}/verify-stages.txt
          SHARD_LIST: ${{ runner.temp }}/verify-shard-stages.txt
        run: |
          set -uo pipefail
          ./le verify list mode full | tee "$STAGE_LIST" || exit $?
          test -s "$STAGE_LIST" || exit 1
          awk -v i="$SHARD_INDEX" -v n="$SHARD_TOTAL" 'NR % n == i % n' "$STAGE_LIST" > "$SHARD_LIST"
          test -s "$SHARD_LIST" || exit 1

          # Keep running after a red action so the shard reports every failure.
          status=0
          while IFS=/ read -r -a action; do
            printf '==> ./le'
            printf ' %q' "${action[@]}"
            printf '\n'
            ./le "${action[@]}" || status=$?
          done < "$SHARD_LIST"
          exit "$status"
