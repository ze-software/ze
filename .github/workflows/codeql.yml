name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "21 16 * * 3"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - gokrazy/modcache

      # ze compiles only against Ze's patched crypto/tls, so every later go
      # command in this job runs under the patched GOROOT the generator answers
      # (docs/contributing/patching-the-standard-library.md). The tree comes
      # from le, not from `go run ./internal/le/go/stdpatch/goroot`: the
      # launcher links cache/ to ~/.cache/ze before it builds le, and moves a
      # real cache/ aside. A generator run before le made cache/ a real
      # directory, so the next step's ./le moved the exported GOROOT away and
      # go fell back to downloading a toolchain (CodeQL run 42915194844).
      - name: Select the patched Go standard library
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          tree="$(./le go stdpatch goroot)"
          echo "GOROOT=$tree" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          echo "$tree/bin" >> "$GITHUB_PATH"

      # A bare build excludes the feature-gated daemon and appliance surface.
      # These shipped combinations are generated from feature-gates.txt by
      # internal/le/repo/featuretags/actions.go (`./le repo feature-tags update`).
      - name: Build Go shipped feature combinations
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          # Both selection and tracing use the same controlled Go environment.
          export GOENV=off GOFLAGS= GOWORK=off GOTOOLCHAIN=local
          codeql_build() {
            local assignment="$1"
            shift
            if [[ "$assignment" != CGO_ENABLED=0 || "$#" != 4 || "$1" != go || "$2" != build || "$3" != -tags ]]; then
              echo "CodeQL needs the explicit CGO-disabled tagged build context" >&2
              return 2
            fi
            local selected
            selected="$(env "$assignment" ./le repo codeql packages tags "$4")" || return
            if [[ -z "$selected" ]]; then
              echo "CodeQL refuses an empty tracked package selection" >&2
              return 2
            fi
            local -a packages
            mapfile -t packages <<< "$selected"
            env "$assignment" "$@" "${packages[@]}"
          }
          codeql_build CGO_ENABLED=0 go build -tags 'ze_core ze_distro ze_anomaly ze_as112 ze_bfd ze_bgp ze_bmp ze_copp ze_cos ze_ddos ze_dhcpserver ze_exabgp ze_flowexport ze_geodns ze_gnmi ze_grpc ze_ike ze_isis ze_l2tp ze_ldp ze_lg ze_mcp ze_mpls ze_ntp ze_ospf ze_policyroute ze_pxe ze_radius ze_rest ze_rsvpte ze_ssh ze_tacacs ze_telemetry ze_trafficusage ze_vpp ze_vrrp ze_web'
          codeql_build CGO_ENABLED=0 go build -tags 'ze_core ze_appliance ze_anomaly ze_as112 ze_bfd ze_bgp ze_bmp ze_copp ze_cos ze_ddos ze_dhcpserver ze_exabgp ze_flowexport ze_geodns ze_gnmi ze_grpc ze_ike ze_isis ze_l2tp ze_ldp ze_lg ze_mcp ze_mpls ze_ntp ze_ospf ze_policyroute ze_pxe ze_radius ze_rest ze_rsvpte ze_ssh ze_tacacs ze_telemetry ze_trafficusage ze_vpp ze_vrrp ze_web'
          codeql_build CGO_ENABLED=0 go build -tags 'ze_setup'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
