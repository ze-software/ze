name: perf-nightly

# Scheduled, Docker-free timing regression evidence. Machine-dependent timing
# stays outside push and pull-request gates; the deterministic allocation action
# remains in the native full verifier.
on:
  schedule:
    - cron: "42 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-regression-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # An empty history is not a regression. Once records exist, `le perf
      # track` owns the comparison and its non-zero verdict fails this job.
      # The launcher builds le on its first call.
      - name: Perf regression check
        run: |
          if [ -s test/perf/history/ze.ndjson ]; then
            ./le perf track --check test/perf/history/ze.ndjson
          else
            echo "no perf history (test/perf/history/ze.ndjson); nothing to check"
          fi
