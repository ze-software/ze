name: perf-nightly

# Scheduled, Docker-free timing regression evidence. Machine-dependent timing
# stays outside push and pull-request gates; the deterministic allocation action
# remains in the native full verifier.
on:
  schedule:
    - cron: "42 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-regression-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The history is recorded on the owner's Mac and committed. CI compares
      # that evidence; it never measures the hosted runner as a substitute.
      # Missing evidence is a failed check, not proof of no regression.
      - name: Perf regression check
        run: |
          if [ ! -s test/perf/history/ze.ndjson ]; then
            echo "::error::test/perf/history/ze.ndjson is missing or empty, so no performance comparison ran. On the owner's Mac, measure and record the evidence, then commit the resulting history:"
            echo "./le perf record evidence"
            exit 1
          fi
          ./le perf track --check test/perf/history/ze.ndjson
