name: Deploy website

on:
  push:
    branches: ["gh-pages"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ze
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Checkout website
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: main/go.mod
          cache-dependency-path: main/go.sum

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build website prerequisites
        run: |
          make -C main ze
          make -C main ze-terminal-demo-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate terminal media
        run: make -C main ze-terminal-demos-release TERMINAL_DEMO_OUTPUT="$GITHUB_WORKSPACE/terminal-demos"

      - name: Test website sources
        run: uv run --with pytest --with markdown python3 -m pytest -q site/tools/test_*.py

      - name: Build Pages artifact
        env:
          ZE_TERMINAL_DEMO_SOURCE: ${{ github.workspace }}/terminal-demos
        run: ./site/update-website.sh


      # The demo scenarios redirect ze's output into per-demo log files, so a
      # failed render or validation reaches the job log as a bare exit status.
      # Print those logs before the job ends or the failure is undiagnosable.
      - name: Show demo state on failure
        if: failure()
        run: |
          state=main/tmp/terminal-demos/state
          sudo ls -laR "$state" || true
          sudo find "$state" -maxdepth 2 -type f -name '*.log' \
            -exec sh -c 'echo "=== $1 ==="; tail -50 "$1"' _ {} \; || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
