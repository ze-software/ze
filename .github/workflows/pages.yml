name: Deploy website

on:
  push:
    branches: ["gh-pages"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ze
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Checkout website
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: main/go.mod
          cache-dependency-path: main/go.sum

      - name: Install VHS and ffmpeg
        run: |
          make -C main ze-terminal-demo-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate terminal media
        run: make -C main ze-terminal-demos-release TERMINAL_DEMO_OUTPUT="$GITHUB_WORKSPACE/site/assets/demos"


      # The demo scenarios redirect ze's output into per-demo log files, so a
      # failed render or validation reaches the job log as a bare exit status.
      # Print those logs before the job ends or the failure is undiagnosable.
      - name: Show demo state on failure
        if: failure()
        run: |
          state=main/tmp/terminal-demos/state
          sudo ls -laR "$state" || true
          sudo find "$state" -maxdepth 2 -type f -name '*.log' \
            -exec sh -c 'echo "=== $1 ==="; tail -50 "$1"' _ {} \; || true

      - name: Trace the cli-dashboard daemon start on failure
        if: failure()
        run: |
          cat > main/tmp/demo-debug.sh <<'SCRIPT'
          #!/usr/bin/env bash
          state=/src/tmp/terminal-demos/state/dbg
          config="${state}/config"
          rm -rf "${state}"; mkdir -p "${config}"
          export ZE_CONFIG_DIR="${config}" ZE_SSH_PASSWORD=secret123
          printf 'admin\nsecret123\n127.0.0.1\n2222\nze-demo\n' | ze init; echo "init rc=$?"
          ze config cat ze.conf > "${state}/active.conf"; echo "cat rc=$?"
          cat /src/demos/terminal/cli-dashboard/ze.conf >> "${state}/active.conf"
          ze config import --name ze.conf "${state}/active.conf"; echo "import rc=$?"
          for binding in 127.0.0.2:65001 127.0.0.3:65002 127.0.0.4:64496; do
              ze-test peer --mode sink --bind "${binding%%:*}" --port 1179 \
                  --asn "${binding##*:}" >/dev/null 2>&1 &
          done
          echo "--- ze start in the foreground (30s cap) ---"
          timeout 30 ze start ze.conf; echo "ze start exit=$?"
          echo "--- crash reports ---"
          ls -la "${config}/crash" || true
          for f in "${config}"/crash/*; do
              [ -f "$f" ] || continue
              echo "== $f"; head -80 "$f"
          done
          echo "--- ze version ---"; ze version; echo "version exit=$?"
          SCRIPT
          chmod +x main/tmp/demo-debug.sh
          # ze pipes its own stderr through a reader goroutine that dies with
          # the process, so a startup panic never reaches the log. Rebuild with
          # that redirect disabled so the panic prints to the real stderr.
          sed -i \
            's|if err := redirectStderr(syslogAddr, crashDir); err != nil {|if err := (error)(nil); err != nil {|' \
            main/internal/core/crashlog/crashlog.go
          grep -n "if err := (error)(nil)" main/internal/core/crashlog/crashlog.go
          tags="ze_core ze_distro $(awk '$1 ~ /^ze_/ {print $1}' main/feature-gates.txt | sort -u | tr '\n' ' ')"
          (cd main && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -tags "$tags" -o tmp/terminal-demos/bin/ze ./cmd/ze)
          docker run --rm --network none \
            --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --volume "$GITHUB_WORKSPACE/main:/src" \
            --workdir /src/demos/terminal \
            ze-terminal-demos:vhs-0.11.0-playwright-1.55.0 \
            /src/tmp/demo-debug.sh || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
