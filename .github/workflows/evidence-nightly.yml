name: evidence-nightly

# Scheduled heavy evidence stays outside the merge gate. Every job is advisory,
# and each expensive proof has its own runner so one infrastructure failure is
# not attributed to another suite.
#
# Advisory means these jobs gate no merge. It does NOT mean they may fail
# quietly: every job carried `continue-on-error: true` until 2026-09-02, so the
# workflow reported success while five of its six jobs failed, and the run this
# ledger cites as interop evidence had not passed in a week. A job that fails
# now says so.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run every native fuzz target
        run: ./le test fuzz run

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install kernel integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git iproute2 iptables nftables

      # These six actions need CAP_NET_ADMIN or CAP_NET_BIND_SERVICE. Preserve
      # PATH across sudo so the Go toolchain remains available. Later actions
      # still run after an earlier failure, yielding the whole nightly verdict.
      - name: Interface integration
        run: sudo -E env "PATH=$PATH" ./le test integration iface
      - name: FIB integration
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" ./le test integration fib
      - name: Firewall integration
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" ./le test integration firewall
      - name: Traffic integration
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" ./le test integration traffic
      - name: GTSM integration
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" ./le test integration gtsm
      - name: AS112 integration
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" ./le test integration as112

  # The Docker labs below run Ze in containers, so the kernel they test is the
  # Docker host's, and Ze enrolls features the hosted runner's kernel lacks
  # (XFRM_MSG_MIGRATE_STATE among them). Each therefore boots the Alpine QEMU
  # guest on Ze's own amd64 runtime kernel under KVM and runs the lab there,
  # through `./le test qemu docker-lab`: the path the Mac shares under HVF
  # (owner D-6). The guest runs `./le setup docker-kernel check` before the lab,
  # so a kernel that lacks a feature fails in seconds and names it. The kernel
  # cache entry is the one qemu-nightly.yml builds and saves, under the same key.
  # The last step asks the hosted runner's own kernel too, as information: when
  # GitHub moves ubuntu-latest to a kernel that passes, the log shows it.
  #
  # BGP interoperability against FRR, BIRD, and GoBGP. Its own advisory job
  # keeps a container-lab failure distinct from kernel integration evidence.
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git qemu-system-x86 qemu-utils openssh-client curl
      - name: Grant KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm
      - name: Restore the runtime kernel cache
        id: kernel-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: Materialize the native runtime kernel
        run: |
          ./le build host-driver
          ./ze-host appliance kernel --target runtime --arch amd64
      - name: Save the runtime kernel cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: BGP interoperability in the Ze-kernel guest
        env:
          ZE_QEMU_MEMORY: "12288"
          ZE_QEMU_CPUS: "3"
          ZE_QEMU_BOOT_TIMEOUT: "300"
        run: ./le test qemu docker-lab lab "test integration interop" timeout 5400s
      - name: The hosted runner's own Docker kernel, for information
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./le setup docker-kernel check ze tmp/qemu/linux-amd64/ze

  # The strongSwan lab programs XFRM state in privileged containers. It remains
  # scheduled and advisory, never part of a merge gate.
  ipsec-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git qemu-system-x86 qemu-utils openssh-client curl
      - name: Grant KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm
      - name: Restore the runtime kernel cache
        id: kernel-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: Materialize the native runtime kernel
        run: |
          ./le build host-driver
          ./ze-host appliance kernel --target runtime --arch amd64
      - name: Save the runtime kernel cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: IKEv2/IPsec interoperability in the Ze-kernel guest
        env:
          ZE_QEMU_MEMORY: "12288"
          ZE_QEMU_CPUS: "3"
          ZE_QEMU_BOOT_TIMEOUT: "300"
        run: ./le test qemu docker-lab lab "test integration interop-ipsec" timeout 5400s
      - name: The hosted runner's own Docker kernel, for information
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./le setup docker-kernel check ze tmp/qemu/linux-amd64/ze

  # Ze's admin login against a real FreeRADIUS server. Every other RADIUS proof
  # ze holds runs against a mock ze wrote, and a mock built beside ze's own
  # encoder agrees with ze by construction. Ze computes a CHAP digest the server
  # must reproduce from its own stored password, so only a server ze did not
  # write can disagree.
  #
  # The admin path itself is a UDP socket and ze's own listeners, but the lab
  # stages a ze that enrols every kernel capability, and interoplab.Suite.Run
  # checks that ze against the Docker kernel for every suite. The hosted
  # runner's kernel lacks some of them (the spec's XFRM_MSG_MIGRATE_STATE), so
  # this lab runs in the Ze-kernel guest like the others.
  radius-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git qemu-system-x86 qemu-utils openssh-client curl
      - name: Grant KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm
      - name: Restore the runtime kernel cache
        id: kernel-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: Materialize the native runtime kernel
        run: |
          ./le build host-driver
          ./ze-host appliance kernel --target runtime --arch amd64
      - name: Save the runtime kernel cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: RADIUS admin-login interoperability against FreeRADIUS in the Ze-kernel guest
        env:
          ZE_QEMU_MEMORY: "12288"
          ZE_QEMU_CPUS: "3"
          ZE_QEMU_BOOT_TIMEOUT: "300"
        run: ./le test qemu docker-lab lab "test integration interop-radius" timeout 5400s
      - name: The hosted runner's own Docker kernel, for information
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./le setup docker-kernel check ze tmp/qemu/linux-amd64/ze

  # The L2TP lab builds a PPP/NCP path between peer-isolated containers. It needs
  # PPPoL2TP in the Docker host's kernel, which the Ze-kernel guest carries. It
  # is scheduled and advisory like the strongSwan lab above, never part of a
  # merge gate.
  #
  # Scheduling it is what its RFC evidence depends on. interopCarriers
  # (internal/le/rfc/carriers.go) DERIVES an interop tree's tier from whether a
  # scheduled workflow names its action, so an unscheduled tree resolves unrun and
  # every `RFC requirement:` tag inside it is refused. The RFC 2661 obligations
  # this lab can prove were therefore held at unit-only evidence by the absence of
  # these lines, not by anything about the tests.
  l2tp-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git qemu-system-x86 qemu-utils openssh-client curl
      - name: Grant KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm
      - name: Restore the runtime kernel cache
        id: kernel-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: Materialize the native runtime kernel
        run: |
          ./le build host-driver
          ./ze-host appliance kernel --target runtime --arch amd64
      - name: Save the runtime kernel cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: L2TP PPP/NCP interoperability in the Ze-kernel guest
        env:
          ZE_QEMU_MEMORY: "12288"
          ZE_QEMU_CPUS: "3"
          ZE_QEMU_BOOT_TIMEOUT: "300"
        run: ./le test qemu docker-lab lab "test deployment docker-l2tp-ppp-test" timeout 5400s
      - name: The hosted runner's own Docker kernel, for information
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./le setup docker-kernel check ze tmp/qemu/linux-amd64/ze

  # Ze's PPPoE client against a real accel-ppp access concentrator. Same tiering
  # reason as the L2TP lab above, and the same advisory posture: it needs PPPoE
  # support in the Docker host's kernel, which the Ze-kernel guest carries.
  pppoe-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git qemu-system-x86 qemu-utils openssh-client curl
      - name: Grant KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm
      - name: Restore the runtime kernel cache
        id: kernel-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: Materialize the native runtime kernel
        run: |
          ./le build host-driver
          ./ze-host appliance kernel --target runtime --arch amd64
      - name: Save the runtime kernel cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: PPPoE client against accel-ppp in the Ze-kernel guest
        env:
          ZE_QEMU_MEMORY: "12288"
          ZE_QEMU_CPUS: "3"
          ZE_QEMU_BOOT_TIMEOUT: "300"
        run: ./le test qemu docker-lab lab "test deployment docker-pppoe-accel-test" timeout 5400s
