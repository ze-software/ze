name: evidence-nightly

# Scheduled heavy evidence stays outside the merge gate. Every job is advisory,
# and each expensive proof has its own runner so one infrastructure failure is
# not attributed to another suite.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run every native fuzz target
        run: ./le fuzz run

  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install kernel integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git iproute2 iptables nftables

      # These six actions need CAP_NET_ADMIN or CAP_NET_BIND_SERVICE. Preserve
      # PATH across sudo so the Go toolchain remains available. Later actions
      # still run after an earlier failure, yielding the whole nightly verdict.
      - name: Interface integration
        run: sudo -E env "PATH=$PATH" ./le integration iface
      - name: FIB integration
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" ./le integration fib
      - name: Firewall integration
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" ./le integration firewall
      - name: Traffic integration
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" ./le integration traffic
      - name: GTSM integration
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" ./le integration gtsm
      - name: AS112 integration
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" ./le integration as112

  # BGP interoperability against FRR, BIRD, and GoBGP. Its own advisory job
  # keeps a container-lab failure distinct from kernel integration evidence.
  interop:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: BGP interoperability
        run: ./le integration interop

  # The strongSwan lab programs XFRM state in privileged containers. It remains
  # scheduled and advisory, never part of a merge gate.
  ipsec-interop:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: IKEv2/IPsec interoperability
        run: ./le integration interop-ipsec
