name: notification-preview

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions run ID to preview as data
        required: true
        type: string
      destination:
        description: Proposed destination label; delivery remains inactive
        required: true
        default: pending-owner-approval
        type: string

permissions:
  contents: read
  actions: read

jobs:
  preview:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted preview code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Render candidate messages without delivery
        env:
          SELECTED_RUN_ID: ${{ inputs.run_id }}
          DESTINATION: ${{ inputs.destination }}
        run: |
          ./le github preview run "$SELECTED_RUN_ID" destination "$DESTINATION" '|' json > "$RUNNER_TEMP/notification-preview.json"
      - name: Retain the exact preview for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notification-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notification-preview.json
          if-no-files-found: error
          retention-days: 14
