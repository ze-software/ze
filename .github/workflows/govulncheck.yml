name: govulncheck

# The native vulnerability action is also part of full verification. This daily
# run catches advisories published after a commit passed its merge gate. The
# action runs the scanner against the Linux/amd64 package graph and propagates
# its verdict.
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install govulncheck
        run: |
          CGO_ENABLED=0 go install -mod=vendor golang.org/x/vuln/cmd/govulncheck
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan reachable dependencies
        run: ./le verify deps vulnerability
