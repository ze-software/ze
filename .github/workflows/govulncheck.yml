name: govulncheck

# The native vulnerability action is also part of full verification. This daily
# run catches advisories published after a commit passed its merge gate. The
# action runs the scanner against the Linux/amd64 package graph and propagates
# its verdict.
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install govulncheck
        run: |
          CGO_ENABLED=0 go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan reachable dependencies
        run: ./le verify-deps vulnerability
