name: qemu-nightly

# Linux and appliance evidence that needs a real kernel remains scheduled and
# advisory. Each job keeps its historical budget, accelerator fallback, and
# independent failure signal.
on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  needs-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git qemu-system-x86 qemu-utils openssh-client curl
      - name: Grant KVM access (best effort)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm: QEMU will fall back to TCG"
      - name: Restore the runtime kernel cache
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: Materialize the native runtime kernel
        run: |
          ./le build host-driver run
          ./ze-host appliance kernel --target runtime --arch amd64
      - name: Save the runtime kernel cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      # ze compiles only against Ze's patched crypto/tls, so every later go
      # command in this job runs under the patched GOROOT the generator answers
      # (docs/contributing/patching-the-standard-library.md).
      - name: Select the patched Go standard library
        shell: bash
        run: |
          tree="$(go run ./internal/le/go/stdpatch/goroot)"
          echo "GOROOT=$tree" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          echo "$tree/bin" >> "$GITHUB_PATH"
      # The guest set comes from the producer `test qemu all` checks against
      # (testfunctional.PrepareGuest): ze, ze-stripped, ze-stripped-flow,
      # ze-upgrade and ze-fakefilter, under tmp/qemu/linux-amd64/bin. A hand-written build
      # list here once left ze-stripped-flow out, and every run refused before
      # its first test.
      - name: Cross-build the guest daemons
        run: ./le test qemu guest-binaries
      - name: Fill the gokrazy module cache
        # The docker-host image builds with GOPROXY=off over gokrazy/modcache,
        # and git holds only module source there: this downloads what every
        # gokrazy/*/builddir needs, as `./le setup install` does on a workstation.
        run: ./le setup appliance-modules
      # `test qemu docker-lab` boots the cached docker-host image and never builds
      # one inside its deadline. Cache the downloaded tarballs and static musl
      # binaries (about 100 MiB, non-sparse) rather than the 64 GiB sparse raw
      # image itself, because actions/cache untars without --sparse and would
      # expand 64 GiB of zeroes onto the runner disk.
      - name: Restore the docker-host build inputs cache
        id: docker-host-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/ze/docker-host/downloads
            ~/.cache/ze/docker-host/amd64/static-*
          key: ze-docker-host-inputs-amd64-${{ hashFiles('gokrazy/docker-host/binaries.json', 'internal/le/setup/docker/host/static.go') }}
      - name: Build the docker-host image
        run: ./le setup docker host build arch amd64
      - name: Save the docker-host build inputs cache
        if: steps.docker-host-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/ze/docker-host/downloads
            ~/.cache/ze/docker-host/amd64/static-*
          key: ze-docker-host-inputs-amd64-${{ hashFiles('gokrazy/docker-host/binaries.json', 'internal/le/setup/docker/host/static.go') }}
      # Ze's image carries no Go, and the unit, installer and integration phases
      # of `test qemu all` compile in the guest. The patched tree's links name
      # this runner's GOROOT, outside every share, so the guest gets a copy that
      # holds the files. The `_` keeps it out of the unit phase's `./...`.
      - name: Copy the patched Go tree into the checkout the guest mounts
        run: |
          mkdir -p tmp/qemu
          cp -RL "$GOROOT" tmp/qemu/_guest-go
      - name: Run every Linux-only functional test in the VM
        env:
          ZE_QEMU_MEMORY: "8192"
          ZE_QEMU_CPUS: "3"
          ZE_QEMU_PARALLEL: "2"
          ZE_QEMU_BOOT_TIMEOUT: "300"
        run: >-
          ./le test qemu docker-lab
          kernel tmp/kernel/build/vmlinuz
          harness
          timeout 5400s
          command 'ZE_QEMU_LINUX_ONLY=1 PATH=/workspace/tmp/qemu/_guest-go/bin:$PATH GOROOT=/workspace/tmp/qemu/_guest-go GOTOOLCHAIN=local GOCACHE=/workspace/tmp/qemu/go-cache GOMODCACHE=/workspace/tmp/qemu/gomodcache ZE_BIN=tmp/qemu/linux-amd64/bin/ze ZE_STRIPPED_BIN=tmp/qemu/linux-amd64/bin/ze-stripped ZE_STRIPPED_FLOW_BIN=tmp/qemu/linux-amd64/bin/ze-stripped-flow ZE_QEMU_SKIP_SUITES=web ZE_QEMU_PARALLEL=2 tmp/qemu/linux-amd64/le test qemu all'

  protocol-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git qemu-system-x86 qemu-utils openssh-client curl
      - name: Grant KVM access (best effort)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm: QEMU will fall back to TCG"
      - name: Restore the runtime kernel cache
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: Materialize the native runtime kernel
        run: |
          ./le build host-driver run
          ./ze-host appliance kernel --target runtime --arch amd64
      - name: Save the runtime kernel cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: LDP against FRR
        env:
          ZE_QEMU_MEMORY: "8192"
          ZE_QEMU_CPUS: "3"
          ZE_QEMU_BOOT_TIMEOUT: "300"
        run: >-
          ./le test qemu run kernel tmp/kernel/build/vmlinuz
          packages "frr iproute2 kmod"
          timeout 150s
          command 'go test -tags integration -count=1 -timeout 150s -run TestLDPInteropFRR ./internal/plugins/ldp/...'
      - name: IS-IS against FRR
        if: ${{ !cancelled() }}
        env:
          ZE_QEMU_MEMORY: "8192"
          ZE_QEMU_CPUS: "3"
          ZE_QEMU_BOOT_TIMEOUT: "300"
        run: >-
          ./le test qemu run kernel tmp/kernel/build/vmlinuz
          packages "frr iproute2 kmod tcpdump"
          timeout 180s
          command 'go test -tags integration -count=1 -timeout 180s -run TestISISInteropFRR ./internal/plugins/isis/...'
      - name: VRRP against keepalived
        if: ${{ !cancelled() }}
        env:
          ZE_QEMU_MEMORY: "8192"
          ZE_QEMU_CPUS: "3"
          ZE_QEMU_BOOT_TIMEOUT: "300"
        run: >-
          ./le test qemu run kernel tmp/kernel/build/vmlinuz
          packages "keepalived tcpdump iproute2 iputils-ping kmod"
          timeout 900s
          command 'tmp/qemu/linux-amd64/le test qemu vrrp-keepalived'

  runtime-kernel-labs:
    runs-on: ubuntu-latest
    # 135 minutes of capped lab commands (600+1200+5700+600 s) plus the 90
    # minutes the uncapped boot, build and appliance steps had before.
    timeout-minutes: 225
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install runtime lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git qemu-system-x86 qemu-utils openssh-client curl \
            dnsmasq xl2tpd ppp iputils-ping
      - name: Grant KVM access (best effort)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm: QEMU will fall back to TCG"
      - name: Restore the runtime kernel cache
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      - name: Materialize the native runtime kernel
        run: |
          ./le build host-driver run
          ./ze-host appliance kernel --target runtime --arch amd64
      - name: Save the runtime kernel cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ze
          key: ze-runtime-kernel-amd64-${{ hashFiles('internal/appliance/kernel.version', 'gokrazy/kernel/**', 'tools/kernel-builder/**') }}
      # ze compiles only against Ze's patched crypto/tls, so every later go
      # command in this job runs under the patched GOROOT the generator answers
      # (docs/contributing/patching-the-standard-library.md).
      - name: Select the patched Go standard library
        shell: bash
        run: |
          tree="$(go run ./internal/le/go/stdpatch/goroot)"
          echo "GOROOT=$tree" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          echo "$tree/bin" >> "$GITHUB_PATH"
      - name: Cross-build native guest binaries
        run: |
          FEATURES='ze_anomaly ze_as112 ze_bfd ze_bgp ze_bmp ze_copp ze_cos ze_ddos ze_dhcpserver ze_exabgp ze_flowexport ze_geodns ze_gnmi ze_grpc ze_ike ze_isis ze_l2tp ze_ldp ze_lg ze_mcp ze_mpls ze_ntp ze_ospf ze_policyroute ze_pxe ze_radius ze_rest ze_rsvpte ze_ssh ze_tacacs ze_telemetry ze_trafficusage ze_vpp ze_vrrp ze_web'
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags "ze_core zetest ze_distro ze_setup $FEATURES" -o bin/ze-linux-amd64 ./cmd/ze
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags 'ze_core' -o bin/ze-stripped-linux-amd64 ./cmd/ze
      - name: Fill the gokrazy module cache
        # Both `gokrazy-l2tp-ppp` and the docker-host image build with
        # GOPROXY=off over gokrazy/modcache, and git holds only module source
        # there. Fill it as the runner user before `sudo -E` runs
        # `gokrazy-l2tp-ppp`, so that step finds every module and leaves no
        # root-owned files in gokrazy/modcache.
        run: ./le setup appliance-modules
      # `test qemu docker-lab` boots the cached docker-host image and never builds
      # one inside its deadline. Build it before `sudo -E` runs `gokrazy-l2tp-ppp`,
      # and cache the non-sparse downloads and static musl binaries (about 100 MiB)
      # under the same key `needs-linux` and `evidence-nightly.yml` share.
      - name: Restore the docker-host build inputs cache
        id: docker-host-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/ze/docker-host/downloads
            ~/.cache/ze/docker-host/amd64/static-*
          key: ze-docker-host-inputs-amd64-${{ hashFiles('gokrazy/docker-host/binaries.json', 'internal/le/setup/docker/host/static.go') }}
      - name: Build the docker-host image
        run: ./le setup docker host build arch amd64
      - name: Save the docker-host build inputs cache
        if: steps.docker-host-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/ze/docker-host/downloads
            ~/.cache/ze/docker-host/amd64/static-*
          key: ze-docker-host-inputs-amd64-${{ hashFiles('gokrazy/docker-host/binaries.json', 'internal/le/setup/docker/host/static.go') }}
      - name: L2TP PPP appliance proof
        run: sudo -E env "PATH=$PATH" "XDG_CACHE_HOME=$HOME/.cache" ./le test deployment gokrazy-l2tp-ppp
      - name: PPPoE against accel-ppp
        if: ${{ !cancelled() }}
        env:
          ZE_QEMU_MEMORY: "8192"
          ZE_QEMU_CPUS: "3"
          ZE_QEMU_BOOT_TIMEOUT: "300"
        run: >-
          ./le test qemu run kernel tmp/kernel/build/vmlinuz
          packages "accel-ppp ppp iproute2 iputils-ping kmod"
          timeout 600s
          command 'tmp/qemu/linux-amd64/le test qemu pppoe-accel'
      # The two namespace steps below need only setcap, getcap, nft and ip, which
      # Ze's image carries, so they boot it. Their accel-ppp and Go neighbours
      # still need tools it does not carry.
      - name: PPPoE functional suite
        if: ${{ !cancelled() }}
        env:
          ZE_QEMU_MEMORY: "8192"
          ZE_QEMU_CPUS: "3"
          ZE_QEMU_BOOT_TIMEOUT: "300"
        run: >-
          ./le test qemu docker-lab
          kernel tmp/kernel/build/vmlinuz
          harness
          timeout 1200s
          command 'ZE_QEMU_BIN=bin/ze-linux-amd64 ZE_QEMU_STRIPPED_BIN=bin/ze-stripped-linux-amd64 tmp/qemu/linux-amd64/le test qemu pppoe'
      # The subset runs one test at a time under netnsSuiteTimeout, 90 minutes
      # (internal/le/test/qemu/netns_linux.go); this cap leaves it the guest
      # preparation on top.
      - name: Plugin namespace subset
        if: ${{ !cancelled() }}
        env:
          ZE_QEMU_MEMORY: "8192"
          ZE_QEMU_CPUS: "3"
          ZE_QEMU_BOOT_TIMEOUT: "300"
        run: >-
          ./le test qemu docker-lab
          kernel tmp/kernel/build/vmlinuz
          harness
          timeout 5700s
          command 'ZE_QEMU_BIN=bin/ze-linux-amd64 ZE_QEMU_STRIPPED_BIN=bin/ze-stripped-linux-amd64 tmp/qemu/linux-amd64/le test qemu netns suites plugin'
      - name: Traffic-usage eBPF proof
        if: ${{ !cancelled() }}
        env:
          ZE_QEMU_MEMORY: "8192"
          ZE_QEMU_CPUS: "3"
          ZE_QEMU_BOOT_TIMEOUT: "300"
        run: >-
          ./le test qemu run kernel tmp/kernel/build/vmlinuz
          packages "iproute2 kmod"
          timeout 600s
          command 'go test -tags integration -count=1 -timeout 180s -run "TestProgram_|TestAttachTCX_CountsTraffic|TestMetricsScrape" ./internal/plugins/trafficusage/...'
