    <!--
        Markdown renderer: the source .md file uses only controlled markup
        (headings, lists, tables, code blocks, bold/italic, blockquotes).
        No user-supplied or untrusted content is rendered.
    -->
    <script>
        function parseMarkdown(md) {
            return md.split(/\n---\n/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
        }

        function escapeHtml(text) {
            var d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function linkifyHttps(text) {
            return text.replace(/https:\/\/[^\s<*`]+/g, function(url) {
                var trailing = '';
                while (/[.,;:!?)]$/.test(url)) {
                    trailing = url.slice(-1) + trailing;
                    url = url.slice(0, -1);
                }
                return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>' + trailing;
            });
        }

        function inlineMarkup(text) {
            text = escapeHtml(text);
            var codeSpans = [];
            text = text.replace(/`([^`]+)`/g, function(_, code) {
                var idx = codeSpans.length;
                codeSpans.push('<code>' + code + '</code>');
                return '\u0000CODE' + idx + '\u0000';
            });
            text = linkifyHttps(text);
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
            text = text.replace(/\u0000CODE(\d+)\u0000/g, function(_, idx) {
                return codeSpans[Number(idx)];
            });
            return text;
        }

        var screenshotMap = {
            'terminal output of /ze-review finding issues': 'cli-session',
            'SSH session showing tab completion and set/diff/commit workflow': 'web-config-editor',
            'Finder-style column navigation with config diff': 'web-show-bgp-peer',
            'peer dashboard with AS path topology SVG': 'lg-peers',
            'route lookup results with Team Cymru org name annotations': 'lg-routes',
            'chaos web dashboard showing convergence tracking': 'chaos-dashboard'
        };

        function splitTableRow(row) {
            var cells = [];
            var cur = '';
            var inCode = false;
            for (var i = 0; i < row.length; i++) {
                if (row[i] === '`') { inCode = !inCode; cur += '`'; }
                else if (row[i] === '|' && !inCode) { cells.push(cur); cur = ''; }
                else { cur += row[i]; }
            }
            cells.push(cur);
            return cells.filter(function(c) { return c.trim().length > 0; });
        }

        function renderSlide(md) {
            var lines = md.split('\n');
            var parts = [];
            var listStack = [];
            var inTable = false;
            var inCode = false;
            var codeLines = [];
            var inBQ = false;
            var bqLines = [];
            var tableRows = [];

            function closeList() {
                while (listStack.length > 0) { parts.push('</ul>'); listStack.pop(); }
            }
            function flushTable() {
                if (!inTable) return;
                var hasHeader = tableRows.length > 1 && splitTableRow(tableRows[1]).every(function(c) { return /^[\s\-:]+$/.test(c); });
                var h = '<table>';
                for (var i = 0; i < tableRows.length; i++) {
                    var cells = splitTableRow(tableRows[i]);
                    if (i === 1 && hasHeader) continue;
                    var tag = (i === 0 && hasHeader) ? 'th' : 'td';
                    h += '<tr>' + cells.map(function(c) { return '<' + tag + '>' + inlineMarkup(c.trim()) + '</' + tag + '>'; }).join('') + '</tr>';
                }
                h += '</table>';
                parts.push(h);
                inTable = false;
                tableRows = [];
            }
            function flushBQ() {
                if (!inBQ) return;
                parts.push('<blockquote>' + bqLines.map(inlineMarkup).join('<br>') + '</blockquote>');
                inBQ = false;
                bqLines = [];
            }

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];

                if (line.indexOf('```') === 0) {
                    if (inCode) {
                        parts.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
                        codeLines = [];
                        inCode = false;
                    } else {
                        closeList(); flushTable(); flushBQ();
                        inCode = true;
                    }
                    continue;
                }
                if (inCode) { codeLines.push(line); continue; }

                var commentMatch = line.match(/^<!--\s*screenshot:\s*(.+?)\s*-->$/);
                if (commentMatch) {
                    closeList(); flushTable(); flushBQ();
                    var desc = commentMatch[1];
                    var imgName = screenshotMap[desc] || desc.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
                    parts.push(
                        '<img class="screenshot-img" src="screenshots/' + escapeHtml(imgName) + '.png" ' +
                        'onerror="this.outerHTML=\'<div class=screenshot-placeholder>' + escapeHtml(desc) + '</div>\'" ' +
                        'alt="' + escapeHtml(desc) + '">'
                    );
                    continue;
                }
                var embedMatch = line.match(/^<!--\s*embed:\s*(.+?)\s*-->$/);
                if (embedMatch) {
                    closeList(); flushTable(); flushBQ();
                    var embedName = embedMatch[1].replace(/[^a-z0-9._-]+/gi, '-').toLowerCase();
                    var embeddedEl = document.getElementById('embedded-' + embedName.replace(/\./g, '-'));
                    if (embeddedEl) {
                        var decoded = new TextDecoder().decode(Uint8Array.from(atob(embeddedEl.textContent.trim()), function(c) { return c.charCodeAt(0); }));
                        parts.push(
                            '<iframe class="screenshot-img" srcdoc="' + decoded.replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '" ' +
                            'style="width:100%;height:70vh;border:none;border-radius:8px;">' +
                            '</iframe>'
                        );
                    } else {
                        parts.push(
                            '<iframe class="screenshot-img" src="' + escapeHtml(embedName) + '" ' +
                            'style="width:100%;height:70vh;border:none;border-radius:8px;" ' +
                            'onerror="this.outerHTML=\'<div class=screenshot-placeholder>' + escapeHtml(embedMatch[1]) + '</div>\'">' +
                            '</iframe>'
                        );
                    }
                    continue;
                }
                if (/^<!--.*-->$/.test(line)) continue;

                if (line.indexOf('> ') === 0 || line === '>') {
                    closeList(); flushTable();
                    inBQ = true;
                    bqLines.push(line === '>' ? '' : line.slice(2));
                    continue;
                }
                if (inBQ) {
                    if (line.indexOf('> ') === 0 || line === '>') { bqLines.push(line === '>' ? '' : line.slice(2)); continue; }
                    if (line.trim() === '') { flushBQ(); continue; }
                    flushBQ();
                }

                if (/^\|/.test(line)) {
                    closeList(); flushBQ();
                    inTable = true;
                    tableRows.push(line);
                    continue;
                }
                if (inTable) flushTable();

                if (line.indexOf('# ') === 0) { closeList(); flushTable(); flushBQ(); parts.push('<h1>' + inlineMarkup(line.slice(2)) + '</h1>'); continue; }
                if (line.indexOf('## ') === 0) { closeList(); flushTable(); flushBQ(); parts.push('<h2>' + inlineMarkup(line.slice(3)) + '</h2>'); continue; }
                if (line.indexOf('### ') === 0) { closeList(); flushTable(); flushBQ(); parts.push('<h3>' + inlineMarkup(line.slice(4)) + '</h3>'); continue; }

                if (/^\s*[-*] /.test(line)) {
                    flushTable(); flushBQ();
                    var indent = (line.match(/^(\s*)/)[1] || '').length;
                    var depth = indent >= 2 ? 1 : 0;
                    var text = line.replace(/^\s*[-*] /, '');

                    while (listStack.length > depth + 1) { parts.push('</ul>'); listStack.pop(); }
                    while (listStack.length <= depth) { parts.push('<ul>'); listStack.push(listStack.length); }

                    parts.push('<li>' + inlineMarkup(text) + '</li>');
                    continue;
                }

                if (line.trim() === '') { closeList(); flushTable(); flushBQ(); continue; }

                closeList(); flushTable(); flushBQ();
                parts.push('<p>' + inlineMarkup(line) + '</p>');
            }

            closeList(); flushTable(); flushBQ();
            if (inCode) parts.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');

            return parts.join('\n');
        }

        var current = 0;

        function showSlide(n) {
            var slides = document.querySelectorAll('.slide');
            var total = slides.length;
            if (total === 0) return;
            slides[current].classList.remove('active');
            current = Math.max(0, Math.min(n, total - 1));
            slides[current].classList.add('active');
            document.getElementById('progress').style.width = ((current + 1) / total * 100) + '%';
            document.getElementById('counter').textContent = (current + 1) + ' / ' + total;
            document.getElementById('prev').disabled = current === 0;
            document.getElementById('next').disabled = current === total - 1;
        }

        function changeSlide(dir) { showSlide(current + dir); }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') changeSlide(-1);
            if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') changeSlide(1);
            if (e.key === 'Home') showSlide(0);
            if (e.key === 'End') showSlide(document.querySelectorAll('.slide').length - 1);
        });

        var touchStartX = 0;
        document.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', function(e) {
            var diff = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(diff) > 50) changeSlide(diff < 0 ? 1 : -1);
        });

        function buildSlides(md) {
            var slideTexts = parseMarkdown(md);
            var container = document.getElementById('slides-container');
            for (var i = 0; i < slideTexts.length; i++) {
                var div = document.createElement('div');
                div.className = 'slide' + (i === 0 ? ' active title-slide' : '');
                var rendered = renderSlide(slideTexts[i]);
                if (i === 0) {
                    rendered = rendered.replace('<h1>', '<h1><img class="bird-float" src="zeledon.svg" alt="Zeledon">');
                }
                div.innerHTML = rendered;
                container.appendChild(div);
            }
            showSlide(0);
        }

        (function loadPresentation() {
            var embedded = document.getElementById('embedded-slides');
            if (embedded && embedded.textContent.trim()) {
                buildSlides(new TextDecoder().decode(Uint8Array.from(atob(embedded.textContent.trim()), function(c) { return c.charCodeAt(0); })));
                return;
            }
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'slides.md', true);
            xhr.onload = function() {
                if (xhr.status !== 200) return;
                buildSlides(xhr.responseText);
            };
            xhr.send();
        })();
    </script>
</body>
</html>
