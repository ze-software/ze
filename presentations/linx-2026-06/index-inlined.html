<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>From ExaBGP to a Network OS with AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --purple: #312783;
            --cyan: #009FE3;
            --teal: #2ED9B9;
        }
        body {
            font-family: "Lato", sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }
        .slide {
            display: none;
            width: 94vw;
            max-width: 1600px;
            height: 82vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); /* v3 */
            border-radius: 16px;
            padding: clamp(35px, 4vw, 55px) clamp(25px, 4vw, 60px) clamp(20px, 3vw, 40px);
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow-y: auto;
        }
        .slide.active { display: block; }
        .slide.title-slide {
            padding-top: clamp(140px, 22vh, 300px);
            background: linear-gradient(135deg, #0d1117 0%, #16213e 40%, #1a1a2e 100%);
        }
        .slide.title-slide h1 {
            background: linear-gradient(90deg, var(--purple) 0%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: clamp(28px, 3.5vw, 56px);
            margin-bottom: clamp(25px, 3.5vw, 50px);
        }
        .slide.title-slide .bird-float { float: left; height: 1.4em; margin-right: clamp(10px, 1.5vw, 25px); margin-top: -0.1em; }
        @keyframes shimmer {
            to { background-position: 200% center; }
        }
        .slide.title-slide p { font-size: clamp(15px, 1.6vw, 24px); }
        .slide.title-slide p:nth-child(4) { margin-bottom: clamp(25px, 4vw, 50px); }
        .slide.title-slide strong { color: #fff; }
        .slide.title-slide p:nth-child(3) em { color: var(--cyan); opacity: 0.7; }
        .slide.title-slide p:nth-child(4) { color: #5a4f9e; font-size: clamp(11px, 1.1vw, 16px); }
        .slide.title-slide p:nth-child(n+5) em { color: var(--teal); }
        h1 { font-family: "Poppins", sans-serif; font-size: clamp(28px, 3.5vw, 56px); margin-bottom: clamp(15px, 2vw, 30px); }
        h2 { font-family: "Poppins", sans-serif; font-size: clamp(22px, 2.6vw, 40px); color: var(--cyan); margin: 0 0 clamp(8px, 1vw, 15px); }
        h3 { font-family: "Poppins", sans-serif; font-size: clamp(16px, 1.9vw, 28px); color: var(--teal); margin: clamp(8px, 1vw, 18px) 0 clamp(4px, 0.5vw, 8px); }
        p, li { font-size: clamp(13px, 1.3vw, 21px); line-height: 1.5; margin-bottom: clamp(3px, 0.5vw, 8px); }
        ul { list-style: none; margin: 0; }
        ul ul { margin-left: clamp(12px, 1.5vw, 24px); }
        li { padding-left: clamp(16px, 2vw, 30px); position: relative; }
        li:before { content: "\2192"; position: absolute; left: 0; color: var(--cyan); }
        li li:before { content: "\2022"; color: var(--teal); }
        li li { font-size: clamp(11px, 1.2vw, 18px); opacity: 0.85; }
        .note { font-style: italic; opacity: 0.8; font-size: clamp(11px, 1.2vw, 18px); }
        blockquote {
            background: rgba(49, 39, 131, 0.3);
            border-left: 4px solid var(--cyan);
            border-top: none;
            border-right: none;
            border-bottom: none;
            padding: clamp(10px, 1.2vw, 18px) clamp(12px, 1.3vw, 20px) clamp(12px, 1.4vw, 22px);
            border-radius: 4px;
            margin: clamp(8px, 1vw, 15px) 0;
            font-style: italic;
            font-family: "Courier New", monospace;
            font-size: clamp(10px, 1vw, 16px);
            line-height: 1.5;
            white-space: pre-wrap;
            color: rgba(255, 255, 255, 0.85);
        }
        blockquote > :last-child { margin-bottom: 0; }
        .progress { position: fixed; top: 0; left: 0; height: 4px; background: linear-gradient(90deg, var(--purple) 0%, var(--cyan) 100%); transition: width 0.3s; z-index: 1002; }
        .nav { position: fixed; bottom: 8px; right: 40px; z-index: 1001; }
        .footer { position: fixed; bottom: 10px; left: 40px; font-size: clamp(10px, 0.9vw, 14px); opacity: 0.5; z-index: 1001; }
        .nav button { background: rgba(0, 159, 227, 0.2); border: 2px solid var(--cyan); color: #fff; padding: clamp(6px, 0.8vw, 12px) clamp(12px, 1.5vw, 24px); margin: 0 5px; border-radius: 30px; cursor: pointer; font-size: clamp(11px, 1vw, 16px); font-weight: 600; }
        .nav button:hover { background: var(--cyan); }
        .counter { position: fixed; top: 30px; right: 120px; color: var(--cyan); font-size: clamp(12px, 1.2vw, 18px); z-index: 1001; }
        .logo { position: fixed; top: 8px; left: 40px; height: clamp(16px, 1.8vw, 28px); z-index: 1000; }
        .logo-right { position: fixed; top: 8px; right: 40px; height: clamp(24px, 2.5vw, 40px); z-index: 1000; }
        .logo-bird { display: none; }
        .logo-bird.visible { display: block; }
        pre {
            background: rgba(0, 159, 227, 0.08);
            border: 1px solid rgba(0, 159, 227, 0.3);
            padding: clamp(8px, 1vw, 15px) clamp(12px, 1.3vw, 20px);
            border-radius: 10px;
            margin: clamp(8px, 1vw, 15px) 0;
            font-family: "Courier New", monospace;
            font-size: clamp(10px, 0.9vw, 14px);
            line-height: 1.5;
            white-space: pre;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; margin: clamp(8px, 1vw, 15px) 0; }
        th { text-align: left; padding: clamp(5px, 0.7vw, 10px) clamp(8px, 0.9vw, 14px); color: var(--cyan); border-bottom: 2px solid var(--purple); font-size: clamp(12px, 1.2vw, 18px); }
        td { padding: clamp(4px, 0.5vw, 8px) clamp(8px, 0.9vw, 14px); border-bottom: 1px solid rgba(255,255,255,0.1); font-size: clamp(12px, 1.2vw, 18px); }
        tr:hover td { background: rgba(49, 39, 131, 0.2); }
        code { color: var(--teal); background: rgba(46, 217, 185, 0.1); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        pre code { background: none; padding: 0; }
        strong { color: var(--cyan); font-weight: 600; }
        em { opacity: 0.85; }
        hr { display: none; }
        .screenshot-placeholder {
            background: rgba(0, 159, 227, 0.05);
            border: 2px dashed rgba(0, 159, 227, 0.3);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: var(--cyan);
            opacity: 0.6;
            margin: 20px 0;
            flex: 1;
        }
        .screenshot-img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 12px;
            margin: 10px auto;
            display: block;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

    <div id="slides-container"></div>

        <button onclick="changeSlide(-1)" id="prev">&larr; Prev</button>

    </div>

    <!--
        Markdown renderer: the source .md file uses only controlled markup
        (headings, lists, tables, code blocks, bold/italic, blockquotes).
        No user-supplied or untrusted content is rendered.
    -->
    <script>
        function parseMarkdown(md) {
            return md.split(/\n---\n/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
        }

        function escapeHtml(text) {
            var d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function inlineMarkup(text) {
            text = escapeHtml(text);
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            return text;
        }

        var screenshotMap = {
            'terminal output of /ze-review finding issues': 'cli-ze-review',
            'SSH session showing tab completion and set/diff/commit workflow': 'cli-session',
            'Finder-style column navigation with config diff': 'web-config-editor',
            'peer dashboard with AS path topology SVG': 'lg-peers',
            'route lookup results with Team Cymru org name annotations': 'lg-routes',
            'chaos web dashboard showing convergence tracking': 'chaos-dashboard'
        };

        function renderSlide(md) {
            var lines = md.split('\n');
            var parts = [];
            var listStack = [];
            var inTable = false;
            var inCode = false;
            var codeLines = [];
            var inBQ = false;
            var bqLines = [];
            var tableRows = [];

            function closeList() {
                while (listStack.length > 0) { parts.push('</ul>'); listStack.pop(); }
            }
            function flushTable() {
                if (!inTable) return;
                var h = '<table>';
                for (var i = 0; i < tableRows.length; i++) {
                    var cells = tableRows[i].split('|').filter(function(c) { return c.trim().length > 0; });
                    if (i === 1 && cells.every(function(c) { return /^[\s\-:]+$/.test(c); })) continue;
                    var tag = i === 0 ? 'th' : 'td';
                    h += '<tr>' + cells.map(function(c) { return '<' + tag + '>' + inlineMarkup(c.trim()) + '</' + tag + '>'; }).join('') + '</tr>';
                }
                h += '</table>';
                parts.push(h);
                inTable = false;
                tableRows = [];
            }
            function flushBQ() {
                if (!inBQ) return;
                parts.push('<blockquote>' + bqLines.map(inlineMarkup).join('<br>') + '</blockquote>');
                inBQ = false;
                bqLines = [];
            }

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];

                if (line.indexOf('```') === 0) {
                    if (inCode) {
                        parts.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
                        codeLines = [];
                        inCode = false;
                    } else {
                        closeList(); flushTable(); flushBQ();
                        inCode = true;
                    }
                    continue;
                }
                if (inCode) { codeLines.push(line); continue; }

                var commentMatch = line.match(/^<!--\s*screenshot:\s*(.+?)\s*-->$/);
                if (commentMatch) {
                    closeList(); flushTable(); flushBQ();
                    var desc = commentMatch[1];
                    var imgName = screenshotMap[desc] || desc.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
                    parts.push(
                        '<img class="screenshot-img" src="screenshots/' + escapeHtml(imgName) + '.png" ' +
                        'onerror="this.outerHTML=\'<div class=screenshot-placeholder>' + escapeHtml(desc) + '</div>\'" ' +
                        'alt="' + escapeHtml(desc) + '">'
                    );
                    continue;
                }
                if (/^<!--.*-->$/.test(line)) continue;

                if (line.indexOf('> ') === 0 || line === '>') {
                    closeList(); flushTable();
                    inBQ = true;
                    bqLines.push(line === '>' ? '' : line.slice(2));
                    continue;
                }
                if (inBQ) {
                    if (line.indexOf('> ') === 0 || line === '>') { bqLines.push(line === '>' ? '' : line.slice(2)); continue; }
                    if (line.trim() === '') { flushBQ(); continue; }
                    flushBQ();
                }

                if (/^\|/.test(line)) {
                    closeList(); flushBQ();
                    inTable = true;
                    tableRows.push(line);
                    continue;
                }
                if (inTable) flushTable();

                if (line.indexOf('# ') === 0) { closeList(); flushTable(); flushBQ(); parts.push('<h1>' + inlineMarkup(line.slice(2)) + '</h1>'); continue; }
                if (line.indexOf('## ') === 0) { closeList(); flushTable(); flushBQ(); parts.push('<h2>' + inlineMarkup(line.slice(3)) + '</h2>'); continue; }
                if (line.indexOf('### ') === 0) { closeList(); flushTable(); flushBQ(); parts.push('<h3>' + inlineMarkup(line.slice(4)) + '</h3>'); continue; }

                if (/^\s*[-*] /.test(line)) {
                    flushTable(); flushBQ();
                    var indent = (line.match(/^(\s*)/)[1] || '').length;
                    var depth = indent >= 2 ? 1 : 0;
                    var text = line.replace(/^\s*[-*] /, '');

                    while (listStack.length > depth + 1) { parts.push('</ul>'); listStack.pop(); }
                    while (listStack.length <= depth) { parts.push('<ul>'); listStack.push(listStack.length); }

                    parts.push('<li>' + inlineMarkup(text) + '</li>');
                    continue;
                }

                if (line.trim() === '') { closeList(); flushTable(); flushBQ(); continue; }

                closeList(); flushTable(); flushBQ();
                parts.push('<p>' + inlineMarkup(line) + '</p>');
            }

            closeList(); flushTable(); flushBQ();
            if (inCode) parts.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');

            return parts.join('\n');
        }

        var current = 0;

        function showSlide(n) {
            var slides = document.querySelectorAll('.slide');
            var total = slides.length;
            if (total === 0) return;
            slides[current].classList.remove('active');
            current = Math.max(0, Math.min(n, total - 1));
            slides[current].classList.add('active');
            document.getElementById('progress').style.width = ((current + 1) / total * 100) + '%';
            document.getElementById('counter').textContent = (current + 1) + ' / ' + total;
            document.getElementById('prev').disabled = current === 0;
            document.getElementById('next').disabled = current === total - 1;
        }

        function changeSlide(dir) { showSlide(current + dir); }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') changeSlide(-1);
            if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') changeSlide(1);
            if (e.key === 'Home') showSlide(0);
            if (e.key === 'End') showSlide(document.querySelectorAll('.slide').length - 1);
        });

        var touchStartX = 0;
        document.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', function(e) {
            var diff = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(diff) > 50) changeSlide(diff < 0 ? 1 : -1);
        });

        (function loadPresentation() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'slides.md', true);
            xhr.onload = function() {
                if (xhr.status !== 200) return;
                var slideTexts = parseMarkdown(xhr.responseText);
                var container = document.getElementById('slides-container');
                for (var i = 0; i < slideTexts.length; i++) {
                    var div = document.createElement('div');
                    div.className = 'slide' + (i === 0 ? ' active title-slide' : '');
                    // Content is from our own controlled .md file, not user input
