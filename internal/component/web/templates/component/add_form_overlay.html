{{define "add_form_overlay"}}
<div class="add-entry-overlay" id="add-entry-overlay">
  <div class="add-entry-card">
    <h3>{{.Heading}}</h3>
    <form hx-post="{{.AddURL}}" hx-target="{{if .Workbench}}#workbench-workspace{{else}}#detail{{end}}" hx-swap="innerHTML" data-close-on-after-request="true">
      {{if .Workbench}}<input type="hidden" name="_workbench" value="1">{{end}}
      {{if .Keyless}}
        {{if .DisplayKey}}
      <div class="add-entry-row">
        <label class="add-entry-label" for="add-entry-key">{{.DisplayKey}}</label>
        <input type="text" class="add-entry-input" id="add-entry-key" name="field:{{.DisplayKey}}" aria-label="{{.DisplayKey}}" autofocus>
      </div>
        {{end}}
      {{else}}
      <div class="add-entry-row">
        <label class="add-entry-label" for="{{.KeyInputID}}">{{.KeyLabel}}</label>
        <input type="text" class="add-entry-input" id="{{.KeyInputID}}" name="name" aria-label="{{.KeyLabel}}" required autofocus>
      </div>
      {{end}}
      {{range .Fields}}
      <div class="add-entry-row add-entry-{{.Category}}">
        <label class="add-entry-label" for="field-{{fieldid .Path}}">{{fieldlabel .Path}}{{if eq .Category "required"}} <span class="add-entry-req-mark">*</span>{{end}}</label>
        <input type="text" class="add-entry-input" id="field-{{fieldid .Path}}" name="field:{{.Path}}"
               {{if .Inherited}}value="{{.Inherited}}"{{end}}
               placeholder="{{if .Placeholder}}{{.Placeholder}}{{end}}"
               {{if eq .Category "required"}}data-required="true"{{end}}>
      </div>
      {{end}}
      <div class="add-entry-actions">
        <button type="submit" class="add-entry-submit">{{if .Workbench}}Save{{else}}Create{{end}}</button>
        <button type="button" class="add-entry-cancel" data-action="close-add-overlay">Cancel</button>
      </div>
    </form>
  </div>
</div>
{{end}}
