
<div class="main-split">
  
<div class="finder-columns" id="finder">
  
  <div class="finder-col">
    
    
    <a class="finder-item selected has-children"
       href="/show/bgp/peer/london/"
       hx-get="/fragment/detail?path=bgp/peer/london" hx-target="#content-area" hx-swap="innerHTML" hx-push-url="/show/bgp/peer/london/">
      london
    </a>
    
    
    
    <button class="finder-item finder-add" id="btn-add-entry" data-action="add-entry" data-base-url="/config/add/bgp/peer/">+ new</button>
    
    
    <hr class="finder-separator">
    
    <a class="finder-item"
       href="/show/bgp/timers/"
       hx-get="/fragment/detail?path=bgp/timers" hx-target="#content-area" hx-swap="innerHTML" hx-push-url="/show/bgp/timers/">
      timers
    </a>
    
  </div>
  
  <div class="finder-col">
    
    
    <a class="finder-item"
       href="/show/bgp/peer/"
       hx-get="/fragment/detail?path=bgp/peer" hx-target="#content-area" hx-swap="innerHTML" hx-push-url="/show/bgp/peer/">
      peer <span class="finder-count">2</span>
    </a>
    
    
    
    
  </div>
  
</div>

  <div class="detail-panel" id="detail" hx-get="/monitor/bgp/peer" hx-trigger="every 5s" hx-target="#content-area" hx-swap="innerHTML" hx-select=".main-split">

<div class="context-heading">
  <span class="context-label">peer</span> <span class="context-key">london</span> 
</div>


<section class="config-section">
  <div class="config-fields">
    
<div class="ze-field" id="field-hold-time">
  <label class="ze-field-label">hold-time
    <span class="ze-field-info" data-tooltip="BGP hold timer in seconds">i</span>
    <span class="ze-field-decoration">(Example Transit)</span>
  </label>

<input type="text" class="ze-field-input ze-field-set" name="value" value="london"
       hx-post="/config/set/bgp/peer/london" hx-trigger="blur changed, keyup[key=='Enter'], input changed delay:1s" hx-target="closest .ze-field" hx-swap="outerHTML"
       hx-vals='{"leaf":"hold-time"}' pattern="[a-z]&#43;"><span class="ze-field-tag ze-field-tag-set">set</span>

</div>

<div class="ze-field" id="field-hold-time">
  <label class="ze-field-label">hold-time
    <span class="ze-field-info" data-tooltip="BGP hold timer in seconds">i</span>
    <span class="ze-field-decoration">(Example Transit)</span>
  </label>

<input type="text" class="ze-field-input ze-field-set" name="value" value="180"
       hx-post="/config/set/bgp/peer/london" hx-trigger="blur changed, keyup[key=='Enter'], input changed delay:1s" hx-target="closest .ze-field" hx-swap="outerHTML"
       hx-vals='{"leaf":"hold-time"}'><span class="ze-field-tag ze-field-tag-set">set</span>

</div>

<div class="ze-field" id="field-hold-time">
  <label class="ze-field-label">hold-time
    <span class="ze-field-info" data-tooltip="BGP hold timer in seconds">i</span>
    <span class="ze-field-decoration">(Example Transit)</span>
  </label>

<div class="ze-tristate" id="tristate-hold-time">

  <span class="ze-tristate-label ze-tristate-active">yes</span>
  <button type="button" class="ze-tristate-track ze-tristate-yes"
          hx-post="/config/set/bgp/peer/london" hx-target="closest .ze-field" hx-swap="outerHTML"
          hx-vals='{"leaf":"hold-time","value":"false"}' data-tristate data-default="90"><span class="ze-tristate-thumb"></span></button>
  <span class="ze-tristate-label">no</span>

</div>

</div>

<div class="ze-field" id="field-hold-time">
  <label class="ze-field-label">hold-time
    <span class="ze-field-info" data-tooltip="BGP hold timer in seconds">i</span>
    <span class="ze-field-decoration">(Example Transit)</span>
  </label>

<select class="ze-field-select" name="value"
        hx-post="/config/set/bgp/peer/london" hx-trigger="change" hx-target="closest .ze-field" hx-swap="outerHTML"
        hx-vals='{"leaf":"hold-time"}'>
  <option value="">(90)</option>
  
  <option value="igp" selected>igp</option>
  
  <option value="egp">egp</option>
  
  <option value="incomplete">incomplete</option>
  
</select>

</div>

<div class="ze-field" id="field-hold-time">
  <label class="ze-field-label">hold-time
    <span class="ze-field-info" data-tooltip="BGP hold timer in seconds">i</span>
    <span class="ze-field-decoration">(Example Transit)</span>
  </label>

<input type="text" class="ze-field-input ze-field-set" name="value" value="192.0.2.1"
       hx-post="/config/set/bgp/peer/london" hx-trigger="blur changed, keyup[key=='Enter'], input changed delay:1s" hx-target="closest .ze-field" hx-swap="outerHTML"
       hx-vals='{"leaf":"hold-time"}'><span class="ze-field-tag ze-field-tag-set">set</span>

</div>

  </div>
  
  <div class="field-page-actions">
    <button type="button" class="field-page-save" data-action="save-field-page">Save</button>
  </div>
  
</section>

</div>
</div>
