
<div class="wb-table-container">
  <h2 class="wb-table-title">BGP Peers</h2>
  <div class="wb-table-toolbar">
    <button type="button" class="wb-table-add" id="btn-add-entry" data-action="add-entry" data-base-url="/config/add/bgp/peer/">Add Peer</button>
    <div class="wb-table-toolbar-right">
      <input type="search" class="wb-table-search" placeholder="Search..." aria-label="Search table">
    </div>
  </div>
  <table class="wb-table">
    <thead>
      <tr>
        <th class="wb-table-flag-header">Flags</th>
        <th class="wb-table-col wb-table-col--sortable">Name</th><th class="wb-table-col">State</th><th class="wb-table-col">Uptime</th>
        <th class="wb-table-actions-header">Actions</th>
      </tr>
    </thead>
    <tbody>
      
        
        <tr class="wb-table-row wb-table-row--pending"
            data-key="london">
          <td class="wb-table-flag wb-table-flag--green">UP</td>
          <td class="wb-table-cell">london</td><td class="wb-table-cell">established</td><td class="wb-table-cell">3h 12m</td>
          <td class="wb-table-actions">
            
            <a href="/show/bgp/peer/london/" class="wb-action">Detail</a>
            
            <button hx-post="/admin/bgp/peer/london/teardown" class="wb-action wb-action--danger" hx-confirm="Reset the session?">Teardown</button>
            
            
          </td>
        </tr>
        
        <tr class="wb-table-row"
            data-key="paris">
          <td class="wb-table-flag wb-table-flag--red">DOWN</td>
          <td class="wb-table-cell">paris</td><td class="wb-table-cell">idle</td><td class="wb-table-cell">-</td>
          <td class="wb-table-actions">
            
          </td>
        </tr>
        
      
    </tbody>
  </table>
</div>
