

<section class="config-section">
  
  <div class="list-table-toolbar" id="list-table-toolbar">
    
    <button class="related-tool related-tool--inspect"
            data-tool-id="bgp-summary"
            hx-post="/tools/related/run"
            hx-target="#tool-overlays"
            hx-swap="beforeend"
            hx-vals='{"tool_id":"bgp-summary","context_path":"bgp/peer"}'>
      Summary
    </button>
    
  </div>
  
  <table class="finder-table detail-table">
    <thead>
      <tr>
        <th class="finder-table-action"></th>
        
        <th>name</th>
        
        <th>remote/ip</th>
        
        <th>remote/as</th>
        
        <th class="finder-table-action"></th>
      </tr>
    </thead>
    <tbody>
      
      <tr class="row--pending" data-row-key="london">
        <td class="finder-table-action"><button class="finder-rename-btn" data-action="rename-entry" data-url="/show/bgp/peer/london/" data-key="london" title="Rename">&#9998;</button></td>
        <td><span class="row-pending-marker" title="Uncommitted changes" aria-label="Pending changes">●</span><a class="finder-table-link" href="/show/bgp/peer/london/"
               hx-get="/fragment/detail?path=bgp/peer/london&ui=workbench" hx-target="#workbench-workspace" hx-swap="innerHTML" hx-push-url="/show/bgp/peer/london/">london</a></td>
        
        
        <td><input class="finder-table-input" type="text" value="192.0.2.1"
                   placeholder="peer address"
                   hx-post="/config/set/bgp/peer/london/remote" hx-trigger="blur changed, keyup[key=='Enter'], input changed delay:1s"
                   hx-target="closest td" hx-swap="innerHTML"
                   name="value" hx-vals='{"leaf":"ip"}'></td>
        
        
        
        <td><input class="finder-table-input" type="text" value="64500"
                   placeholder="peer AS"
                   hx-post="/config/set/bgp/peer/london/remote" hx-trigger="blur changed, keyup[key=='Enter'], input changed delay:1s"
                   hx-target="closest td" hx-swap="innerHTML"
                   name="value" hx-vals='{"leaf":"as"}'></td>
        
        
        <td class="finder-table-action">
          
          <span class="row-tools" data-row-tools="london">
            
            <button class="related-tool related-tool--danger"
                    data-tool-id="peer-teardown"
                    data-confirm="true"
                    hx-post="/tools/related/run"
                    hx-target="#tool-overlays"
                    hx-swap="beforeend"
                    hx-vals='{"tool_id":"peer-teardown","context_path":"bgp/peer/london"}'>
              Teardown
            </button>
            
          </span>
          
          <button class="finder-delete-btn" data-action="delete-entry" data-path="bgp/peer/london" data-key="london" title="Delete">&#128465;</button>
        </td>
      </tr>
      
      <tr class="" data-row-key="paris">
        <td class="finder-table-action"><button class="finder-rename-btn" data-action="rename-entry" data-url="/show/bgp/peer/paris/" data-key="paris" title="Rename">&#9998;</button></td>
        <td><a class="finder-table-link" href="/show/bgp/peer/paris/"
               hx-get="/fragment/detail?path=bgp/peer/paris&ui=workbench" hx-target="#workbench-workspace" hx-swap="innerHTML" hx-push-url="/show/bgp/peer/paris/">paris</a></td>
        
        
        <td><input class="finder-table-input" type="text" value=""
                   placeholder="peer address"
                   hx-post="/config/set/bgp/peer/paris/remote" hx-trigger="blur changed, keyup[key=='Enter'], input changed delay:1s"
                   hx-target="closest td" hx-swap="innerHTML"
                   name="value" hx-vals='{"leaf":"ip"}'></td>
        
        
        
        <td><input class="finder-table-input" type="text" value="64501"
                   placeholder="peer AS"
                   hx-post="/config/set/bgp/peer/paris/remote" hx-trigger="blur changed, keyup[key=='Enter'], input changed delay:1s"
                   hx-target="closest td" hx-swap="innerHTML"
                   name="value" hx-vals='{"leaf":"as"}'></td>
        
        
        <td class="finder-table-action">
          
          <button class="finder-delete-btn" data-action="delete-entry" data-path="bgp/peer/paris" data-key="paris" title="Delete">&#128465;</button>
        </td>
      </tr>
      
    </tbody>
  </table>
  
  <button class="finder-item finder-add" id="btn-add-entry"
          hx-get="/config/add-form/bgp/peer/" hx-target="body" hx-swap="beforeend">+ new</button>
  
</section>
