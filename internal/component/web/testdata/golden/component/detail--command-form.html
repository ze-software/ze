

<div class="context-heading">
  <span class="context-label">peer</span> <span class="context-key">london</span> 
</div>



<div class="command-form">
  <h3 class="command-form-title">peer teardown</h3>
  
  <p class="command-form-description">Reset a BGP session</p>
  
  <form method="post" action="/admin/bgp/peer/london/teardown"
        hx-post="/admin/bgp/peer/london/teardown"
        hx-target="#detail"
        hx-swap="innerHTML">
    
    <div class="command-form-field">
      <label class="command-form-label" for="param-peer">peer</label>
      <input type="text" class="command-form-input" id="param-peer"
             name="peer" value="london" placeholder="peer name">
    </div>
    
    <div class="command-form-field">
      <label class="command-form-label" for="param-reason">reason</label>
      <input type="text" class="command-form-input" id="param-reason"
             name="reason" value="" placeholder="free text">
    </div>
    
    <button type="submit" class="command-form-execute">Execute</button>
  </form>
</div>
