<section class="backup-panel" aria-labelledby="backup-source-title"><h2 id="backup-source-title">Check or repair a data file</h2><p>Open a damaged backup or another data file without requiring a valid ZeFS container. Checking and salvage use the normal Ze storage tools. The uploaded original stays separate from any salvage.</p><form method="POST" action="/backups/sources/" enctype="multipart/form-data"><label for="backup-source-file">Data file (at most 64 MiB)</label> <input id="backup-source-file" type="file" name="source" required> <button id="backup-source-upload" type="submit">Open data file</button></form><details><summary>Paste base64 data instead</summary><form method="POST" action="/backups/sources/" enctype="multipart/form-data"><label for="backup-source-content">Base64 data (at most 64 MiB after decoding)</label> <textarea id="backup-source-content" name="content" rows="6" spellcheck="false"></textarea> <button id="backup-source-paste" type="submit">Open pasted data</button></form></details></section>
