    <text x="127.0" y="468.0" text-anchor="middle" class="axis">Dec 25</text><text x="213.0" y="468.0" text-anchor="middle" class="axis">Jan</text><text x="299.0" y="468.0" text-anchor="middle" class="axis">Feb</text><text x="385.0" y="468.0" text-anchor="middle" class="axis">Mar</text><text x="471.0" y="468.0" text-anchor="middle" class="axis">Apr</text><text x="557.0" y="468.0" text-anchor="middle" class="axis">May</text><text x="643.0" y="468.0" text-anchor="middle" class="axis">Jun</text><text x="729.0" y="468.0" text-anchor="middle" class="axis">Jul</text><text x="815.0" y="468.0" text-anchor="middle" class="axis">Aug</text><text x="901.0" y="468.0" text-anchor="middle" class="axis">Sep</text><text x="987.0" y="468.0" text-anchor="middle" class="axis">Oct</text><text x="1073.0" y="468.0" text-anchor="middle" class="axis">Nov*</text>
