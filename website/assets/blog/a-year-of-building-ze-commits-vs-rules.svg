    <polyline points="127.0,339.4 213.0,295.5 299.0,352.2 385.0,318.3 471.0,268.7 557.0,245.4 643.0,261.5 729.0,203.7 815.0,304.4 901.0,393.9 987.0,411.7 1073.0,397.3" fill="none" stroke="#c084fc" stroke-width="2.6" stroke-dasharray="7 4" stroke-linejoin="round"/>
    <polyline points="127.0,429.5 213.0,429.0 299.0,401.2 385.0,403.4 471.0,413.4 557.0,400.0 643.0,332.7 729.0,360.5 815.0,312.7 901.0,338.8 987.0,337.7 1073.0,335.5" fill="none" stroke="#42d8bd" stroke-width="2.6" stroke-dasharray="7 4" stroke-linejoin="round"/>
    <circle cx="127.0" cy="333.3" r="4.5" fill="#f5a623"/><circle cx="213.0" cy="290.4" r="4.5" fill="#f5a623"/><circle cx="299.0" cy="324.4" r="4.5" fill="#f5a623"/><circle cx="385.0" cy="288.8" r="4.5" fill="#f5a623"/><circle cx="471.0" cy="250.4" r="4.5" fill="#f5a623"/><circle cx="557.0" cy="207.0" r="4.5" fill="#f5a623"/><circle cx="643.0" cy="212.0" r="4.5" fill="#f5a623"/><circle cx="729.0" cy="179.7" r="4.5" fill="#f5a623"/><circle cx="815.0" cy="228.7" r="4.5" fill="#f5a623"/><circle cx="901.0" cy="313.8" r="4.5" fill="#f5a623"/><circle cx="987.0" cy="317.1" r="4.5" fill="#f5a623"/><circle cx="1073.0" cy="304.4" r="4.5" fill="#f5a623"/><circle cx="127.0" cy="339.4" r="3.8" fill="#c084fc"/><circle cx="213.0" cy="295.5" r="3.8" fill="#c084fc"/><circle cx="299.0" cy="352.2" r="3.8" fill="#c084fc"/><circle cx="385.0" cy="318.3" r="3.8" fill="#c084fc"/><circle cx="471.0" cy="268.7" r="3.8" fill="#c084fc"/><circle cx="557.0" cy="245.4" r="3.8" fill="#c084fc"/><circle cx="643.0" cy="261.5" r="3.8" fill="#c084fc"/><circle cx="729.0" cy="203.7" r="3.8" fill="#c084fc"/><circle cx="815.0" cy="304.4" r="3.8" fill="#c084fc"/><circle cx="901.0" cy="393.9" r="3.8" fill="#c084fc"/><circle cx="987.0" cy="411.7" r="3.8" fill="#c084fc"/><circle cx="1073.0" cy="397.3" r="3.8" fill="#c084fc"/><circle cx="127.0" cy="429.5" r="3.8" fill="#42d8bd"/><circle cx="213.0" cy="429.0" r="3.8" fill="#42d8bd"/><circle cx="299.0" cy="401.2" r="3.8" fill="#42d8bd"/><circle cx="385.0" cy="403.4" r="3.8" fill="#42d8bd"/><circle cx="471.0" cy="413.4" r="3.8" fill="#42d8bd"/><circle cx="557.0" cy="400.0" r="3.8" fill="#42d8bd"/><circle cx="643.0" cy="332.7" r="3.8" fill="#42d8bd"/><circle cx="729.0" cy="360.5" r="3.8" fill="#42d8bd"/><circle cx="815.0" cy="312.7" r="3.8" fill="#42d8bd"/><circle cx="901.0" cy="338.8" r="3.8" fill="#42d8bd"/><circle cx="987.0" cy="337.7" r="3.8" fill="#42d8bd"/><circle cx="1073.0" cy="335.5" r="3.8" fill="#42d8bd"/>

    <rect x="446.0" y="146" width="188" height="24" rx="8" fill="#1b2636" stroke="#f5a623" stroke-width="1" opacity="0.92"/>
    <text x="540.0" y="162" text-anchor="middle" class="anno" fill="#ffd480">Apr–Jul methodology build-out</text>

    <rect x="643.0" y="141.7" width="214" height="26" rx="8" fill="#132236" stroke="#f5a623" stroke-width="1.3"/>
    <text x="750.0" y="158.7" text-anchor="middle" class="anno">Jul peak: 47.5% (43.2% rules)</text>

    <rect x="911.0" y="123.1" width="152" height="26" rx="8" fill="#132236" stroke="#4390cf" stroke-width="1.3"/>
    <text x="987.0" y="140.1" text-anchor="middle" class="anno">Oct: 5,157 commits</text>

    <rect x="855.0" y="377.7" width="156" height="25" rx="8" fill="#132236" stroke="#c084fc" stroke-width="1.2"/>
    <text x="933.0" y="394.7" text-anchor="middle" class="anno">AI rules down to 5.8%</text>
  </g>

  <text x="44" y="512" class="foot">*Nov covers 1–27 November 2026 (4,599 commits). A single commit can touch both rules and tooling, so the amber curve counts either.</text>
</svg>
