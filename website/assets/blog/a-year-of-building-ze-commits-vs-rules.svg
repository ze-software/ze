<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 540">
  <title id="title">Monthly commits compared with share touching AI rules and le tooling</title>
  <desc id="desc">Combined bar and line chart across 19,193 commits from December 2025 to 27 November 2026. Commits touching AI rules or development tooling peak at 47.5 per cent in July 2026 (43.2 per cent AI rules alone), then AI rule commits fall to 5.8 to 9.0 per cent in autumn while total monthly commits climb to 5,157 in October and 4,599 through 27 November.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1524"/>
      <stop offset="0.55" stop-color="#111d30"/>
      <stop offset="1" stop-color="#0e2228"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#b990ff"/>
      <stop offset="0.5" stop-color="#5bc4f0"/>
      <stop offset="1" stop-color="#42d8bd"/>
    </linearGradient>
    <style>
      text { font-family: Lato, "Avenir Next", sans-serif; fill: #edf4fc; }
      .eyebrow { font-family: Poppins, Avenir, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 1.6px; fill: #8fa9c4; }
      .title { font-family: Poppins, Avenir, sans-serif; font-size: 27px; font-weight: 800; letter-spacing: -0.5px; }
      .subhead { font-family: Poppins, Avenir, sans-serif; font-size: 16px; font-weight: 800; }
      .kicker { font-family: Poppins, Avenir, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 1.3px; }
      .axis { font-size: 13px; font-weight: 700; fill: #8fa3ba; }
      .legend { font-size: 13.5px; font-weight: 700; fill: #c6d5e6; }
      .anno { font-size: 12.5px; font-weight: 700; fill: #e6f0fa; }
      .foot { font-size: 12.5px; font-weight: 600; fill: #8fa3ba; }
    </style>
</defs>
  <rect width="1200" height="540" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#rail)"/>

  <text x="44" y="46" class="eyebrow">19,193 COMMITS · METHODOLOGY INVESTMENT VS PRODUCT OUTPUT</text>
  <text x="44" y="82" class="title">AI rules and tooling peaked at 47.5% of commits before output surged</text>

  <!-- Legend -->
  <rect x="44" y="98" width="14" height="14" rx="3" fill="#4390cf"/>
  <text x="64" y="110" class="legend">Total commits / month (right axis)</text>
  <line x1="322" y1="105" x2="346" y2="105" stroke="#f5a623" stroke-width="3.2"/>
  <text x="354" y="110" class="legend">Either rules or tooling (%)</text>
  <line x1="566" y1="105" x2="590" y2="105" stroke="#c084fc" stroke-width="2.8" stroke-dasharray="6 4"/>
  <text x="598" y="110" class="legend">AI rules (%)</text>
  <line x1="712" y1="105" x2="736" y2="105" stroke="#42d8bd" stroke-width="2.8" stroke-dasharray="6 4"/>
  <text x="744" y="110" class="legend">Scripts / le tooling (%)</text>

  <g>
    <rect x="432.0" y="138.0" width="336.0" height="306.0" rx="8" fill="#f5a623" opacity="0.07"/>
    <line x1="84" y1="388.4" x2="1116" y2="388.4" stroke="#1f3045" stroke-width="1"/><text x="72" y="393.4" text-anchor="end" class="axis">10%</text><text x="1128" y="393.4" text-anchor="start" class="axis">1k</text><line x1="84" y1="332.7" x2="1116" y2="332.7" stroke="#1f3045" stroke-width="1"/><text x="72" y="337.7" text-anchor="end" class="axis">20%</text><text x="1128" y="337.7" text-anchor="start" class="axis">2k</text><line x1="84" y1="277.1" x2="1116" y2="277.1" stroke="#1f3045" stroke-width="1"/><text x="72" y="282.1" text-anchor="end" class="axis">30%</text><text x="1128" y="282.1" text-anchor="start" class="axis">3k</text><line x1="84" y1="221.5" x2="1116" y2="221.5" stroke="#1f3045" stroke-width="1"/><text x="72" y="226.5" text-anchor="end" class="axis">40%</text><text x="1128" y="226.5" text-anchor="start" class="axis">4k</text><line x1="84" y1="165.8" x2="1116" y2="165.8" stroke="#1f3045" stroke-width="1"/><text x="72" y="170.8" text-anchor="end" class="axis">50%</text><text x="1128" y="170.8" text-anchor="start" class="axis">5k</text><line x1="84" y1="444.0" x2="1116" y2="444.0" stroke="#334a66" stroke-width="1.5"/><text x="72" y="449.0" text-anchor="end" class="axis">0%</text><text x="1128" y="449.0" text-anchor="start" class="axis">0</text>
