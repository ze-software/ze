<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 675">
  <title id="title">Reference stays attached to code</title>
  <desc id="desc">Repository-owned facts publish a checked public reference view, while an agent follows a maintained lookup route back to the same source.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7fb"/>
      <stop offset="0.5" stop-color="#edf8ff"/>
      <stop offset="1" stop-color="#eefbf8"/>
    </linearGradient>
    <filter id="shadow" x="-14%" y="-18%" width="128%" height="144%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#331f40" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#331f40" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#009fe3"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1abc9c"/>
    </marker>
    <marker id="arrow-grape" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9d64f5"/>
    </marker>
    <style>
      text { font-family: Lato, "Avenir Next", sans-serif; fill: #331f40; }
      .headline { font-family: Poppins, "Avenir Next", sans-serif; font-size: 43px; font-weight: 800; letter-spacing: -1.1px; }
      .subhead { font-size: 18px; font-weight: 700; fill: #6a4478; }
      .eyebrow { font-family: Poppins, "Avenir Next", sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 1.7px; }
      .card-title { font-family: Poppins, "Avenir Next", sans-serif; font-size: 27px; font-weight: 800; letter-spacing: -0.45px; }
      .route-title { font-family: Poppins, "Avenir Next", sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.7px; }
      .body { font-size: 16px; font-weight: 700; }
      .detail { font-size: 14px; font-weight: 700; fill: #6a4478; }
      .chip { font-family: Poppins, "Avenir Next", sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 1px; }
      .panel { fill: #fffefe; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="675" rx="38" fill="url(#canvas)"/>

  <text x="74" y="104" class="headline">Facts stay with the owner.</text>
  <text x="74" y="137" class="subhead">One repository source serves the public view and the next edit.</text>

  <g aria-hidden="true">
    <path d="M444 269 H486" fill="none" stroke="#009fe3" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-sky)"/>
    <path d="M676 269 H716" fill="none" stroke="#1abc9c" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
    <path d="M716 470 H676" fill="none" stroke="#9d64f5" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 7"/>
    <path d="M486 470 H444" fill="none" stroke="#9d64f5" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 7" marker-end="url(#arrow-grape)"/>
  </g>

  <g aria-label="Repository source that owns the facts" filter="url(#shadow)">
    <rect x="74" y="182" width="370" height="372" rx="26" class="panel" stroke="#9d64f5"/>
    <rect x="74" y="182" width="370" height="8" rx="4" fill="#9d64f5"/>
    <text x="102" y="222" class="eyebrow" fill="#9d64f5">REPOSITORY OWNER</text>
    <text x="102" y="264" class="card-title">Code-owned facts</text>
    <text x="102" y="290" class="detail">kept where the system enforces them</text>

    <g aria-label="Owned fact examples">
      <rect x="102" y="315" width="314" height="48" rx="13" fill="#9d64f5" fill-opacity="0.07" stroke="#9d64f5" stroke-opacity="0.45"/>
      <path d="M121 327 H128 V351 H121" fill="none" stroke="#9d64f5" stroke-width="2.5" stroke-linecap="round"/>
      <text x="145" y="346" class="body">Command registry</text>

      <rect x="102" y="375" width="314" height="48" rx="13" fill="#9d64f5" fill-opacity="0.07" stroke="#9d64f5" stroke-opacity="0.45"/>
      <path d="M121 387 H128 V411 H121" fill="none" stroke="#9d64f5" stroke-width="2.5" stroke-linecap="round"/>
      <text x="145" y="406" class="body">YANG schema</text>

      <rect x="102" y="435" width="314" height="48" rx="13" fill="#9d64f5" fill-opacity="0.07" stroke="#9d64f5" stroke-opacity="0.45"/>
      <path d="M121 447 H128 V471 H121" fill="none" stroke="#9d64f5" stroke-width="2.5" stroke-linecap="round"/>
      <text x="145" y="466" class="body">RFC requirement ledger</text>

      <rect x="102" y="495" width="314" height="35" rx="17.5" fill="#9d64f5" fill-opacity="0.12"/>
      <circle cx="123" cy="512.5" r="6" fill="#9d64f5"/>
      <text x="140" y="518" class="detail">one maintained source of truth</text>
    </g>
  </g>

  <g aria-label="Publish route" filter="url(#shadow)">
    <rect x="486" y="230" width="190" height="78" rx="20" class="panel" stroke="#009fe3"/>
    <path d="M511 249 L523 261 L511 273 L499 261 Z" fill="#009fe3" fill-opacity="0.12" stroke="#009fe3" stroke-width="2"/>
    <text x="540" y="260" class="route-title" fill="#009fe3">PUBLISH</text>
    <text x="511" y="289" class="detail">generate and check</text>
  </g>

  <g aria-label="Published public reference view" filter="url(#shadow)">
    <rect x="716" y="182" width="410" height="172" rx="26" class="panel" stroke="#1abc9c"/>
    <rect x="716" y="182" width="410" height="8" rx="4" fill="#1abc9c"/>
    <text x="744" y="222" class="eyebrow" fill="#1abc9c">PUBLISHED REFERENCE</text>
    <text x="744" y="262" class="card-title">Current public view</text>
    <text x="744" y="288" class="detail">checked links route each claim to evidence</text>
    <g aria-label="Reference views">
      <rect x="744" y="307" width="68" height="28" rx="14" fill="#1abc9c" fill-opacity="0.12"/>
      <text x="778" y="326" text-anchor="middle" class="chip" fill="#1abc9c">CLI</text>
      <rect x="822" y="307" width="92" height="28" rx="14" fill="#1abc9c" fill-opacity="0.12"/>
      <text x="868" y="326" text-anchor="middle" class="chip" fill="#1abc9c">CONFIG</text>
      <rect x="924" y="307" width="160" height="28" rx="14" fill="#1abc9c" fill-opacity="0.12"/>
      <text x="1004" y="326" text-anchor="middle" class="chip" fill="#1abc9c">RFC STATUS</text>
    </g>
  </g>

  <g aria-label="Agent lookup route" filter="url(#shadow)">
    <rect x="486" y="431" width="190" height="78" rx="20" class="panel" stroke="#009fe3"/>
    <circle cx="511" cy="458" r="11" fill="none" stroke="#009fe3" stroke-width="2.5"/>
    <path d="M519 466 L529 476" stroke="#009fe3" stroke-width="2.5" stroke-linecap="round"/>
    <text x="540" y="460" class="route-title" fill="#009fe3">LOOK UP</text>
    <text x="511" y="490" class="detail">follow the route back</text>
  </g>

  <g aria-label="Agent context for the next edit" filter="url(#shadow)">
    <rect x="716" y="384" width="410" height="170" rx="26" class="panel" stroke="#009fe3"/>
    <rect x="716" y="384" width="410" height="8" rx="4" fill="#009fe3"/>
    <text x="744" y="424" class="eyebrow" fill="#009fe3">AGENT CONTEXT</text>
    <text x="744" y="464" class="card-title">Same route, next edit</text>
    <text x="744" y="490" class="detail">the source supplies context before code changes</text>
    <rect x="744" y="510" width="354" height="28" rx="14" fill="#009fe3" fill-opacity="0.1"/>
    <text x="921" y="529" text-anchor="middle" class="chip" fill="#009fe3">RULE · OWNER · EVIDENCE · DECISION</text>
  </g>
</svg>
