<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 675">
  <title id="title">One decision per peer. One encode per result.</title>
  <desc id="desc">A fan-out diagram shows one received BGP UPDATE becoming 100 independent peer decisions, two distinct encoded results, and 100 peer-owned output buffers. It does not assign peer counts to either result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7fb"/>
      <stop offset="0.5" stop-color="#edf8ff"/>
      <stop offset="1" stop-color="#eefbf8"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#9d64f5"/>
      <stop offset="0.52" stop-color="#009fe3"/>
      <stop offset="1" stop-color="#1abc9c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="19" flood-color="#3d2557" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#009fe3"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1abc9c"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b76a00"/>
    </marker>
    <style>
      text { font-family: Lato, "Avenir Next", sans-serif; fill: #331f40; }
      .headline { font-family: Poppins, Avenir, sans-serif; font-size: 42px; font-weight: 800; letter-spacing: -1.2px; }
      .eyebrow { font-family: Poppins, Avenir, sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 2px; fill: #6a4478; }
      .count { font-family: Poppins, Avenir, sans-serif; font-size: 68px; font-weight: 800; letter-spacing: -3px; }
      .stage { font-family: Poppins, Avenir, sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 0.6px; }
      .stage-copy { font-size: 14px; font-weight: 700; fill: #6a4478; }
      .arrow-label { font-family: Poppins, Avenir, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.8px; }
      .result-label { font-family: Poppins, Avenir, sans-serif; font-size: 13px; font-weight: 800; }
      .contract { font-family: Poppins, Avenir, sans-serif; font-size: 24px; font-weight: 800; }
      .contract-copy { font-size: 15px; font-weight: 700; fill: #6a4478; }
      .flow-sky { fill: none; stroke: #009fe3; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow-sky); }
      .flow-teal { fill: none; stroke: #1abc9c; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow-teal); }
      .flow-gold { fill: none; stroke: #b76a00; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow-gold); }
    </style>
  </defs>

  <rect width="1200" height="675" rx="42" fill="url(#bg)"/>
  <circle cx="1080" cy="102" r="154" fill="#bfe3ff" opacity="0.34"/>
  <circle cx="114" cy="606" r="176" fill="#e0cdfc" opacity="0.32"/>

  <g filter="url(#shadow)">
    <rect x="54" y="52" width="1092" height="570" rx="36" fill="#fffefe" opacity="0.94"/>
    <rect x="54" y="52" width="1092" height="12" rx="6" fill="url(#rail)"/>
  </g>

  <text x="88" y="104" class="eyebrow">FAN-OUT · COMPLETE POLICY BEFORE ENCODING</text>
  <text x="88" y="158" class="headline">One decision per peer. One encode per result.</text>

  <g transform="translate(78 214)">
    <rect width="205" height="242" rx="26" fill="#f3edfe" stroke="#d9c1fb" stroke-width="3"/>
    <text x="24" y="76" class="count" fill="#9d64f5">1</text>
    <text x="24" y="105" class="stage">RECEIVED UPDATE</text>
    <g transform="translate(24 129)">
      <path d="M0 0H140L157 17V65H0Z" fill="#9d64f5"/>
      <path d="M140 0V17H157" fill="none" stroke="#fffefe" stroke-width="3"/>
      <path d="M18 24H118M18 41H96" stroke="#fffefe" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="24" y="220" class="stage-copy">one immutable source</text>
  </g>

  <text x="319" y="302" text-anchor="middle" class="arrow-label" fill="#009fe3">FAN OUT</text>
  <path d="M290 334H346" class="flow-sky"/>

  <g transform="translate(355 214)">
    <rect width="238" height="242" rx="26" fill="#e7f6fd" stroke="#009fe3" stroke-width="3"/>
    <text x="24" y="76" class="count" fill="#009fe3">100</text>
    <text x="24" y="105" class="stage">PEER DECISIONS</text>
    <g transform="translate(24 128)">
      <path d="M0 15H124M0 47H124" stroke="#bfe3ff" stroke-width="3" stroke-linecap="round"/>
      <path d="M142 0L158 16L142 32L126 16Z" fill="#fffefe" stroke="#009fe3" stroke-width="3"/>
      <path d="M142 32L158 48L142 64L126 48Z" fill="#fffefe" stroke="#009fe3" stroke-width="3"/>
      <path d="M137 16L141 20L149 11M137 48L141 52L149 43" fill="none" stroke="#009fe3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="24" y="208" class="stage-copy">policy + capabilities</text>
    <text x="24" y="228" class="stage-copy">evaluated independently</text>
  </g>

  <text x="629" y="302" text-anchor="middle" class="arrow-label" fill="#087f6b">MATCH</text>
  <path d="M600 334H656" class="flow-teal"/>

  <g transform="translate(665 214)">
    <rect width="196" height="242" rx="26" fill="#e2faf8" stroke="#1abc9c" stroke-width="3"/>
    <text x="24" y="76" class="count" fill="#1abc9c">2</text>
    <text x="24" y="105" class="stage">ENCODED RESULTS</text>
    <g transform="translate(24 126)">
      <rect width="148" height="38" rx="12" fill="#1abc9c"/>
      <text x="16" y="25" class="result-label" fill="#fffefe">RESULT A</text>
      <path d="M115 19H132" stroke="#fffefe" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 54H136L148 66L136 78H0Z" fill="#fffefe" stroke="#1abc9c" stroke-width="3"/>
      <text x="16" y="70" class="result-label" fill="#087f6b">RESULT B</text>
    </g>
    <text x="24" y="228" class="stage-copy">each encoded once</text>
  </g>

  <text x="897" y="302" text-anchor="middle" class="arrow-label" fill="#b76a00">COPY</text>
  <path d="M868 334H924" class="flow-gold"/>

  <g transform="translate(933 214)">
    <rect width="194" height="242" rx="26" fill="#e2faf8" stroke="#1abc9c" stroke-width="3"/>
    <text x="22" y="76" class="count" fill="#1abc9c">100</text>
    <text x="22" y="105" class="stage">PEER BUFFERS</text>
    <g transform="translate(22 127)">
      <rect x="18" y="0" width="130" height="43" rx="10" fill="#fffefe" stroke="#abeee7" stroke-width="3"/>
      <rect x="9" y="11" width="130" height="43" rx="10" fill="#fffefe" stroke="#62d9c6" stroke-width="3"/>
      <rect x="0" y="22" width="130" height="43" rx="10" fill="#fffefe" stroke="#1abc9c" stroke-width="3"/>
      <path d="M18 43H104" stroke="#1abc9c" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="22" y="220" class="stage-copy">one owner per send</text>
  </g>

  <g transform="translate(88 486)">
    <rect width="1003" height="95" rx="24" fill="#fff7fb" stroke="#eadbea" stroke-width="2"/>
    <circle cx="30" cy="32" r="8" fill="#009fe3"/>
    <text x="52" y="39" class="contract">Independent decision · peer-owned send buffer</text>
    <text x="52" y="70" class="contract-copy">Encoding is reused only after complete results match.</text>
  </g>
</svg>
