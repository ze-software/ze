<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 675">
  <title id="title">One seed. Swarm faults. Minimal reproducer.</title>
  <desc id="desc">Ze derives distinct BGP swarm scenarios from one seed, injects sub-header TCP stream faults on in-memory pipes, checks live reactor invariants and buffer pools, and shrinks any violation to a minimal reproducer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1524"/>
      <stop offset="0.5" stop-color="#131e33"/>
      <stop offset="1" stop-color="#11262c"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#b990ff"/>
      <stop offset="0.5" stop-color="#5bc4f0"/>
      <stop offset="1" stop-color="#42d8bd"/>
    </linearGradient>
    <filter id="shadow" x="-16%" y="-20%" width="132%" height="148%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#040911" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5bc4f0"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ffda63"/>
    </marker>
    <style>
      text { font-family: Lato, "Avenir Next", sans-serif; fill: #edf4fc; }
      .eyebrow { font-family: Poppins, Avenir, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 1.8px; fill: #9badc1; }
      .headline { font-family: Poppins, Avenir, sans-serif; font-size: 39px; font-weight: 800; letter-spacing: -1px; }
      .step { font-family: Poppins, Avenir, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 1.4px; }
      .card-title { font-family: Poppins, Avenir, sans-serif; font-size: 21px; font-weight: 800; }
      .body { font-size: 14.5px; font-weight: 700; fill: #b2c0d2; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 13px; font-weight: 700; }
      .mono-sm { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="675" rx="40" fill="url(#bg)"/>
  <circle cx="1090" cy="108" r="150" fill="#7c4de6" opacity="0.18"/>
  <circle cx="110" cy="590" r="170" fill="#1676ce" opacity="0.16"/>

  <g filter="url(#shadow)">
    <rect x="54" y="48" width="1092" height="579" rx="34" fill="#111d2d" stroke="#29394d" stroke-width="2"/>
    <rect x="54" y="48" width="1092" height="10" rx="5" fill="url(#rail)"/>
  </g>

  <text x="90" y="96" class="eyebrow">LE CHAOS · VOPR-STYLE DETERMINISTIC SIMULATION</text>
  <text x="90" y="148" class="headline">One seed. Swarm faults. Minimal reproducer.</text>

  <!-- Stage 1: Swarm Seed -->
  <g transform="translate(86 186)">
    <rect width="310" height="296" rx="22" fill="#1b1930" stroke="#b990ff" stroke-width="2.5"/>
    <text x="22" y="34" class="step" fill="#b990ff">1 · SWARM SEED</text>
    <text x="22" y="66" class="card-title">Distinct fault profiles</text>
    <text x="22" y="92" class="body">Virtual clock + per-peer PCG</text>

    <rect x="22" y="114" width="266" height="44" rx="11" fill="#111d2d" stroke="#7654a0" stroke-width="1.5"/>
    <text x="36" y="141" class="mono" fill="#d8b4fe">seed → peer &amp; family mix</text>

    <rect x="22" y="172" width="266" height="44" rx="11" fill="#111d2d" stroke="#7654a0" stroke-width="1.5"/>
    <text x="36" y="199" class="mono" fill="#d8b4fe">GR · RFC 7606 · churn</text>

    <rect x="22" y="230" width="266" height="44" rx="11" fill="#111d2d" stroke="#7654a0" stroke-width="1.5"/>
    <text x="36" y="257" class="mono" fill="#b2c0d2">hours of BGP in seconds</text>
  </g>

  <path d="M402 334 H438" fill="none" stroke="#5bc4f0" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow-sky)"/>

  <!-- Stage 2: Wire Stream Faults -->
  <g transform="translate(445 186)">
    <rect width="310" height="296" rx="22" fill="#11273b" stroke="#5bc4f0" stroke-width="2.5"/>
    <text x="22" y="34" class="step" fill="#5bc4f0">2 · WIRE STREAM FAULTS</text>
    <text x="22" y="66" class="card-title">Break below BGP frames</text>
    <text x="22" y="92" class="body">FaultConn on in-memory pipes</text>

    <rect x="22" y="114" width="266" height="44" rx="11" fill="#091322" stroke="#397394" stroke-width="1.5"/>
    <text x="36" y="141" class="mono" fill="#71bcff">≤19B sub-header splits</text>

    <rect x="22" y="172" width="266" height="44" rx="11" fill="#091322" stroke="#397394" stroke-width="1.5"/>
    <text x="36" y="199" class="mono" fill="#71bcff">virtual-clock blackholes</text>

    <rect x="22" y="230" width="266" height="44" rx="11" fill="#091322" stroke="#397394" stroke-width="1.5"/>
    <text x="36" y="257" class="mono" fill="#71bcff">truncated UPDATE + reset</text>
  </g>

  <path d="M761 334 H797" fill="none" stroke="#5bc4f0" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrow-sky)"/>

  <!-- Stage 3: White-Box Checks -->
  <g transform="translate(804 186)">
    <rect width="310" height="296" rx="22" fill="#132e2c" stroke="#42d8bd" stroke-width="2.5"/>
    <text x="22" y="34" class="step" fill="#42d8bd">3 · WHITE-BOX CHECKS</text>
    <text x="22" y="66" class="card-title">Inspect live reactor</text>
    <text x="22" y="92" class="body">Every tick + bounded settle</text>

    <rect x="22" y="114" width="266" height="44" rx="11" fill="#091322" stroke="#2d8f7e" stroke-width="1.5"/>
    <text x="36" y="141" class="mono" fill="#60d6a2">RFC 4271 FSM legal edges</text>

    <rect x="22" y="172" width="266" height="44" rx="11" fill="#091322" stroke="#2d8f7e" stroke-width="1.5"/>
    <text x="36" y="199" class="mono" fill="#60d6a2">state hash + RIB counts</text>

    <rect x="22" y="230" width="266" height="44" rx="11" fill="#091322" stroke="#2d8f7e" stroke-width="1.5"/>
    <text x="36" y="257" class="mono" fill="#60d6a2">4K/64K pool leak check</text>
  </g>

  <!-- Bottom Bar: Two-Level Shrinker -->
  <g transform="translate(86 504)">
    <rect width="1028" height="92" rx="18" fill="#25211a" stroke="#ffda63" stroke-width="2"/>
    <text x="22" y="28" class="step" fill="#ffe087">ON VIOLATION · TWO-LEVEL AUTOMATIC SHRINKER</text>

    <rect x="22" y="42" width="330" height="36" rx="10" fill="#111d2d" stroke="#a68536" stroke-width="1.5"/>
    <text x="187" y="65" text-anchor="middle" class="mono-sm" fill="#ffe087">1. strip faults, families &amp; peers</text>

    <path d="M358 60 H384" fill="none" stroke="#ffda63" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-amber)"/>

    <rect x="392" y="42" width="318" height="36" rx="10" fill="#111d2d" stroke="#a68536" stroke-width="1.5"/>
    <text x="551" y="65" text-anchor="middle" class="mono-sm" fill="#ffe087">2. shrink causal event trace</text>

    <path d="M716 60 H742" fill="none" stroke="#ffda63" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-amber)"/>

    <rect x="750" y="42" width="256" height="36" rx="10" fill="#173832" stroke="#42d8bd" stroke-width="1.5"/>
    <text x="878" y="65" text-anchor="middle" class="mono-sm" fill="#60d6a2">✓ minimal seed reproducer</text>
  </g>
</svg>
