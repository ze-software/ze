<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 675">
  <title id="title">Reference stays attached to code</title>
  <desc id="desc">A code-owned source publishes a reference view while an agent follows a lookup route back to the same source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17141f"/>
      <stop offset="0.5" stop-color="#172331"/>
      <stop offset="1" stop-color="#162b28"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#b990ff"/>
      <stop offset="0.52" stop-color="#5bc4f0"/>
      <stop offset="1" stop-color="#42d8bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.44"/>
    </filter>
    <style>
      .heading{font:900 46px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f7f3fb;letter-spacing:-.035em}
      .label{font:900 38px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f7f3fb;letter-spacing:-.03em}
      .small{font:760 29px Inter,ui-sans-serif,system-ui,sans-serif;fill:#d7cadd}
      .mono{font:850 25px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#c9aaff}
    </style>
  </defs>

  <rect width="1200" height="675" rx="42" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="190" fill="#264660" opacity="0.5"/>
  <circle cx="100" cy="608" r="220" fill="#3b2a50" opacity="0.52"/>
  <circle cx="1010" cy="596" r="160" fill="#1f554b" opacity="0.42"/>

  <g filter="url(#shadow)">
    <rect x="54" y="52" width="1092" height="570" rx="36" fill="#1d1b29" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="54" y="52" width="1092" height="13" rx="7" fill="url(#rail)"/>
  </g>

  <text x="92" y="138" class="heading">Facts stay with the owner</text>

  <g transform="translate(82 232)" filter="url(#shadow)">
    <rect width="300" height="222" rx="30" fill="#2b2338" stroke="#7654a0" stroke-width="3"/>
    <circle cx="42" cy="42" r="12" fill="#b990ff"/>
    <text x="30" y="90" class="label">Reference</text>
    <text x="30" y="130" class="label">view</text>
    <text x="30" y="174" class="small">published from</text>
    <text x="30" y="208" class="small">the source</text>
  </g>

  <g transform="translate(450 202)" filter="url(#shadow)">
    <rect width="300" height="282" rx="34" fill="#1b2835" stroke="#397394" stroke-width="3"/>
    <circle cx="42" cy="42" r="12" fill="#5bc4f0"/>
    <text x="30" y="100" class="label">Code-owned</text>
    <text x="30" y="140" class="label">fact</text>
    <text x="30" y="190" class="mono">command registry</text>
    <text x="30" y="226" class="mono">YANG schema</text>
    <text x="30" y="262" class="mono">RFC evidence</text>
  </g>

  <g transform="translate(818 232)" filter="url(#shadow)">
    <rect width="300" height="222" rx="30" fill="#19322d" stroke="#338b79" stroke-width="3"/>
    <circle cx="42" cy="42" r="12" fill="#42d8bd"/>
    <text x="30" y="90" class="label">Agent</text>
    <text x="30" y="130" class="label">context</text>
    <text x="30" y="174" class="small">lookup route to</text>
    <text x="30" y="208" class="small">the same source</text>
  </g>

  <path d="M440 376 L392 376" fill="none" stroke="#b990ff" stroke-width="10" stroke-linecap="round"/>
  <path d="M410 358 L390 376 L410 394" fill="none" stroke="#b990ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M808 376 L760 376" fill="none" stroke="#42d8bd" stroke-width="10" stroke-linecap="round"/>
  <path d="M778 358 L758 376 L778 394" fill="none" stroke="#42d8bd" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(246 532)">
    <rect width="708" height="58" rx="29" fill="#241c2a" stroke="#74415e" stroke-width="2"/>
    <circle cx="36" cy="29" r="8" fill="#5bc4f0"/>
    <text x="58" y="38" class="small">One source owns the facts behind both views.</text>
  </g>
</svg>
