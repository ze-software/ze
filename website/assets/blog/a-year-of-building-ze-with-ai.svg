<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 675">
  <title id="title">Ze codebase growth and methodology investment from December 2025 to November 2026</title>
  <desc id="desc">Two charts from Ze's Git history. Left: first-party Go lines grow from 98,000 in December 2025 to 4.58 million by 27 November 2026, with Go tests overtaking Go production lines in July. Right: commits touching AI rules and development tooling peak at 47.5 per cent in July 2026, then fall to 23 to 25 per cent in autumn while monthly commit volume rises past 5,100.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f3fc"/>
      <stop offset="0.5" stop-color="#edf7ff"/>
      <stop offset="1" stop-color="#eefbf7"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#7c4de6"/>
      <stop offset="0.5" stop-color="#0086cc"/>
      <stop offset="1" stop-color="#13a688"/>
    </linearGradient>
    <filter id="shadow" x="-16%" y="-20%" width="132%" height="148%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#122841" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Lato, "Avenir Next", sans-serif; fill: #152538; }
      .eyebrow { font-family: Poppins, Avenir, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 1.8px; fill: #485e75; }
      .headline { font-family: Poppins, Avenir, sans-serif; font-size: 36px; font-weight: 800; letter-spacing: -0.9px; }
      .panel-kicker { font-family: Poppins, Avenir, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 1.4px; }
      .panel-title { font-family: Poppins, Avenir, sans-serif; font-size: 19px; font-weight: 800; }
      .axis { font-size: 12px; font-weight: 700; fill: #5c7288; }
      .legend { font-size: 12.5px; font-weight: 700; fill: #485e75; }
      .anno { font-size: 11.5px; font-weight: 700; fill: #2b4259; }
      .foot { font-size: 12px; font-weight: 600; fill: #5c7288; }
    </style>
  </defs>

  <rect width="1200" height="675" rx="40" fill="url(#bg)"/>
